  let matchedCards = 0, totalNormal = 0, totalFoil = 0;
  for(let i=1; i<rows.length; i++){
    const cols = rows[i];
    const n = parseInt((cols[idx.normal]||"").trim(), 10) || 0;
    const f = parseInt((cols[idx.foil]||"").trim(), 10) || 0;
    if(n<=0 && f<=0) continue;
    const name = (cols[idx.name]||"").trim();
    if(!name) continue;
    const cn = idx.number>=0 ? (cols[idx.number]||"").trim() : "";

    let candidates = rowsByName.primary[normalizeCardName(name)];
    if(!candidates || !candidates.length){
      candidates = rowsByName.squash[squashCardName(name)];
    }
    if(!candidates || !candidates.length){
      unmatched.push({name, normal:n, foil:f});
      continue;
    }
    if(cn){
      const byNum = candidates.filter(r => String(r.Number).trim() === String(cn).trim());
      if(byNum.length) candidates = byNum;
    }
    const byPrint = {};
    for(const r of candidates){ if(!byPrint[r.tcg_printing]) byPrint[r.tcg_printing] = r; }

    let pushed = false;
    if(n>0 && byPrint.Normal){
      entries.push({cardId:byPrint.Normal.card_id, printing:"Normal", qty:n, name});
      totalNormal += n; pushed = true;
    }
    if(f>0){
      let foilRow = null;
      for(const pref of FOIL_PRINTING_PREF){ if(byPrint[pref]){ foilRow = byPrint[pref]; break; } }
      if(!foilRow){
        for(const k of Object.keys(byPrint)){ if(k!=="Normal"){ foilRow = byPrint[k]; break; } }
      }
      if(foilRow){
        entries.push({cardId:foilRow.card_id, printing:foilRow.tcg_printing, qty:f, name});
        totalFoil += f; pushed = true;
      }
    }
    if(pushed) matchedCards++;
    else unmatched.push({name, normal:n, foil:f, reason:"no matching printing"});
  }
  return {entries, matchedCards, unmatched, totalNormal, totalFoil};
}

// Sealed Collection — per-user inventory of booster boxes / packs / troves
// etc. Grouped by display type (mirrors the Market Sealed sub-tab). Rows have
// +/- counters that persist to sealed_collection_items via updateSealedQty.
// Portfolio-value chart for the Sealed tab. Mirrors the raw-collection
// chart on the Home panel — fetches prices_daily for every owned sealed
// product, rolls up via the shared computeCollectionValueHistory helper,
// then renders the same line-chart shape used by Graded.
const SealedValueChart = ({sealedCollection, sealedPrices, rangeKey, setRangeKey}) => {
  const [historyRows, setHistoryRows] = useState(null);
  const [state, setState] = useState({loading: false, error: null});

  // owned Map keyed as `pid|Normal` so it matches computeCollectionValueHistory's
  // expected shape (the helper reads "<pid>|<printing>"). Sealed entries are
  // always Normal printing.
  const owned = useMemo(() => {
    const map = new Map();
    for(const [pid, qty] of Object.entries(sealedCollection || {})){
      if(qty <= 0) continue;
      map.set(pid + "|Normal", qty);
    }
    return map;
  }, [sealedCollection]);

  const ownedKey = useMemo(() => Array.from(owned.keys()).sort().join(","), [owned]);

  useEffect(() => {
    if(!owned.size){ setHistoryRows([]); return; }
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    const pids = Array.from(new Set(Array.from(owned.keys()).map(k => parseInt(k.split("|")[0],10))));
    let cancelled = false;
    setState({loading: true, error: null});
    fetchCollectionPriceHistory(pids, since)
      .then(rows => { if(!cancelled){ setHistoryRows(rows); setState({loading:false, error:null}); } })
      .catch(e => { if(!cancelled) setState({loading:false, error: String(e?.message || e)}); });
    return () => { cancelled = true; };
  }, [ownedKey, rangeKey]);

  const valueSeries = useMemo(() => historyRows ? computeCollectionValueHistory(historyRows, owned, null) : null, [historyRows, owned]);
  const chartSeries = useMemo(() => {
    if(!valueSeries || !valueSeries.length) return [];
    return [{
      label: "Sealed portfolio value",
      color: "var(--accent)",
      dashed: false,
      data: valueSeries.map(p => ({x: new Date(p.date+"T00:00:00Z").getTime(), y: p.value})),
    }];
  }, [valueSeries]);

  const currentValue = valueSeries && valueSeries.length ? valueSeries[valueSeries.length-1].value : 0;
  const startValue   = valueSeries && valueSeries.length ? valueSeries[0].value : null;
  const rangeDelta   = (startValue != null && startValue > 0) ? (currentValue - startValue) : null;
  const rangeDeltaPct= (startValue != null && startValue > 0) ? ((currentValue - startValue) / startValue * 100) : null;
  const deltaColor   = rangeDelta == null ? "var(--text-muted)" : rangeDelta >= 0 ? "var(--green)" : "var(--red)";
  const rangeLabel   = (COLLECTION_RANGES.find(r => r.key === rangeKey) || {}).label || rangeKey;

  // When you don't own any sealed items the chart has nothing to draw —
  // render a thin placeholder strip so the panel is still discoverable.
  if(!owned.size) return html`<div class="graded-value-chart">
    <div class="gvc-header">
      <div class="gvc-title">Sealed portfolio value</div>
      <div class="muted" style=${{fontSize:11,marginLeft:"auto"}}>
        Add sealed products below to start tracking value over time.
      </div>
    </div>
  </div>`;
  return html`<div class="graded-value-chart">
    <div class="gvc-header">
      <div class="gvc-title">Sealed portfolio value</div>
      <div class="gvc-value">
        <span class="gvc-now">$${currentValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
        ${rangeDelta != null && html`<span class="gvc-delta" style=${{color:deltaColor}}>
          ${rangeDelta >= 0 ? "+" : ""}$${Math.abs(rangeDelta).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}
          <span style=${{opacity:0.8}}>(${rangeDeltaPct >= 0 ? "+" : ""}${rangeDeltaPct.toFixed(1)}%)</span>
          <span class="muted" style=${{fontWeight:400,fontSize:10,marginLeft:4}}>past ${rangeLabel}</span>
        </span>`}
      </div>
      <div class="panel-range-buttons">
        ${COLLECTION_RANGES.map(r => html`<button key=${r.key}
          class=${rangeKey===r.key?"active":""}
          onClick=${()=>setRangeKey(r.key)}>${r.label}</button>`)}
      </div>
    </div>
    <div class="gvc-chart">
      ${(chartSeries.length && chartSeries[0].data.length)
        ? html`<${LineChart} series=${chartSeries} width=720 height=180
            padding=${{top:6,right:8,bottom:22,left:60}}/>
            ${state.loading ? html`<div class="muted" style=${{fontSize:10,textAlign:"center",marginTop:-4}}>Refreshing…</div>` : null}`
        : state.loading
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>Loading…</div>`
          : state.error
            ? html`<div style=${{padding:"40px 0",textAlign:"center",color:"var(--red)",fontSize:11}}>${state.error}</div>`
            : html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>
                No sealed price history yet for the cards you own.
              </div>`}
    </div>
  </div>`;
};

function SealedCollectionView({raw, user, sealedPrices, sealedCollection, updateSealedQty, onSignIn, readOnly, compareMode, viewerOwnSealedCollection}){
  const sealedMatchesCompare = (pid) => {
    if(!readOnly || !compareMode || compareMode === "all" || !viewerOwnSealedCollection) return true;
    const ownerHas  = (sealedCollection[pid]||0) > 0;
    const viewerHas = (viewerOwnSealedCollection[pid]||0) > 0;
    if(!ownerHas) return false;
    if(compareMode === "missing") return !viewerHas;
    if(compareMode === "shared")  return viewerHas;
    return true;
  };
  const [priceMode, setPriceMode] = useState(()=>{
    try { return localStorage.getItem("packsink:market:priceMode") || "low"; }
    catch { return "low"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:market:priceMode", priceMode); } catch {} }, [priceMode]);
  const [hideUnowned, setHideUnowned] = useState(false);
  // Grid (image tiles) vs Compact (text-only rows) — mirrors Graded.
  const [displayMode, setDisplayMode] = useState(()=>{
    try { return localStorage.getItem("packsink:sealedColl:display") || "grid"; }
    catch { return "grid"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:sealedColl:display", displayMode); } catch {} }, [displayMode]);
  // Grouping mode: "set" (per-set sections, with mixed product types within)
  // or "type" (per-product-type sections, mixed sets within). Persisted.
  const [groupBy, setGroupBy] = useState(()=>{
    try { return localStorage.getItem("packsink:sealedColl:groupBy") || "set"; }
    catch { return "set"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:sealedColl:groupBy", groupBy); } catch {} }, [groupBy]);
  // Collapsed set sections, persisted. Key is set_id when groupBy=set, or the
  // display-type string when groupBy=type. Cleared on toggle change so each
  // mode tracks its own collapsed state.
  const [collapsedSets, setCollapsedSets] = useState(()=>{
    try { return new Set(JSON.parse(localStorage.getItem("packsink:sealedColl:collapsed") || "[]")); }
    catch { return new Set(); }
  });
  const toggleCollapsed = (sid) => {
    setCollapsedSets(prev => {
      const next = new Set(prev);
      if(next.has(sid)) next.delete(sid); else next.add(sid);
      try { localStorage.setItem("packsink:sealedColl:collapsed", JSON.stringify([...next])); } catch {}
      return next;
    });
  };
  const [chartRange, setChartRange] = useState("3m");
  const useMarket = priceMode === "market";
  const priceField = useMarket ? "market_price" : "low_price";

  const setNameById = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.Set && r.set_id && !m[r.set_id]) m[r.set_id] = r.Set;
    return m;
  }, [raw]);

  // Group either by set_id or by display-type (Booster Box / Trove / etc).
  // Each section has the same shape `{set_id, set_name, items}` so the
  // render below doesn't need to branch — set_id doubles as the section
  // key in either mode (using the type string when grouping by type).
  const grouped = useMemo(()=>{
    const items = (sealedPrices || []).filter(p =>
      p.printing === "Normal" && p.product_type !== "Promo Single"
    );
    const filtered = (hideUnowned
      ? items.filter(p => (sealedCollection[p.tcgplayer_product_id] || 0) > 0)
      : items
    ).filter(p => sealedMatchesCompare(p.tcgplayer_product_id));
    const setOrder = {};
    MAINLINE_SETS.forEach((name, i) => {
      const sid = Object.entries(setNameById).find(([, n]) => n === name)?.[0];
      if(sid) setOrder[sid] = MAINLINE_SETS.length - i;
    });
    if(groupBy === "type"){
      const byType = new Map();
      for(const item of filtered){
        const t = deriveSealedDisplayType(item);
        if(!byType.has(t)) byType.set(t, []);
        byType.get(t).push(item);
      }
      const out = [];
      for(const [type, list] of byType){
        // Inside each type-section, sort newest-set first then by name.
        list.sort((a, b) => {
          const ai = a.set_id != null ? (setOrder[a.set_id] ?? 999) : 1000;
          const bi = b.set_id != null ? (setOrder[b.set_id] ?? 999) : 1000;
          if(ai !== bi) return ai - bi;
          return (a.name||"").localeCompare(b.name||"");
        });
        out.push({set_id: type, set_name: type, items: list});
      }
      out.sort((a, b) => sealedDisplayTypeRank(a.set_name) - sealedDisplayTypeRank(b.set_name));
      return out;
    }
    // groupBy === "set" (default)
    const bySet = new Map();
    for(const item of filtered){
      const sid = item.set_id || "__other__";
      if(!bySet.has(sid)) bySet.set(sid, []);
      bySet.get(sid).push(item);
    }
    const out = [];
    for(const [sid, list] of bySet){
      list.sort((a, b) => sealedDisplayTypeRank(deriveSealedDisplayType(a)) - sealedDisplayTypeRank(deriveSealedDisplayType(b))
        || (a.name||"").localeCompare(b.name||""));
      out.push({
        set_id: sid,
        set_name: sid === "__other__" ? "Other / Promo" : (setNameById[sid] || sid),
        items: list,
      });
    }
    out.sort((a, b) => {
      const ai = setOrder[a.set_id] ?? 999;
      const bi = setOrder[b.set_id] ?? 999;
      if(ai !== bi) return ai - bi;
      return a.set_name.localeCompare(b.set_name);
    });
    return out;
  }, [sealedPrices, sealedCollection, hideUnowned, setNameById, readOnly, compareMode, viewerOwnSealedCollection, groupBy]);

  // Totals: number of sealed items owned + their combined market value.
  const totals = useMemo(()=>{
    let units = 0, distinct = 0, value = 0;
    if(!sealedPrices) return {units, distinct, value};
    const priceByPid = {};
    for(const p of sealedPrices){
      if(p.printing !== "Normal") continue;
      priceByPid[p.tcgplayer_product_id] = parseFloat(p[priceField]);
    }
    for(const [pid, qty] of Object.entries(sealedCollection)){
      if(qty <= 0) continue;
      distinct++;
      units += qty;
      const p = priceByPid[pid];
      if(p && !isNaN(p)) value += p * qty;
    }
    return {units, distinct, value};
  }, [sealedCollection, sealedPrices, priceField]);

  if(!user){
    return html`<div class="sealed-coll-empty">
      <p>Sign in with Google to track which booster boxes, packs and troves you own.</p>
      <button class="settings-action primary" onClick=${onSignIn}>Sign in with Google</button>
    </div>`;
  }

  return html`<div class="graded-collection sealed-coll">
    <div class="graded-collection-header">
      <div class="graded-collection-totals">
        <div class="gc-stat"><div class="gc-stat-val">${totals.units.toLocaleString()}</div><div class="gc-stat-lbl">Units owned</div></div>
        <div class="gc-stat"><div class="gc-stat-val">${totals.distinct.toLocaleString()}</div><div class="gc-stat-lbl">Distinct SKUs</div></div>
        <div class="gc-stat"><div class="gc-stat-val green">${fmt(totals.value)}</div><div class="gc-stat-lbl">Est. value (${useMarket?"Market":"Low"})</div></div>
      </div>
      <div class="graded-collection-header-actions">
        <div class="seg-toggle" title="Group sections by set or by product type">
          <button class=${groupBy==="set"?"active":""} onClick=${()=>setGroupBy("set")}>By Set</button>
          <button class=${groupBy==="type"?"active":""} onClick=${()=>setGroupBy("type")}>By Type</button>
        </div>
        <div class="seg-toggle" title="Display mode">
          <button class=${displayMode==="grid"?"active":""} onClick=${()=>setDisplayMode("grid")}>Grid</button>
          <button class=${displayMode==="compact"?"active":""} onClick=${()=>setDisplayMode("compact")}>Compact</button>
        </div>
        <div class="market-sim-kind" role="group" aria-label="Price source">
          <button class=${priceMode==="low"?"active":""} onClick=${()=>setPriceMode("low")}>Low</button>
          <button class=${priceMode==="market"?"active":""} onClick=${()=>setPriceMode("market")}>Market</button>
        </div>
        <label class="sealed-coll-flag" title="Only show sealed products you actually own.">
          <input type="checkbox" checked=${hideUnowned} onChange=${e=>setHideUnowned(e.target.checked)}/>
          <span>Only owned</span>
        </label>
      </div>
    </div>

    ${!readOnly && html`<${SealedValueChart} sealedCollection=${sealedCollection} sealedPrices=${sealedPrices}
      rangeKey=${chartRange} setRangeKey=${setChartRange}/>`}

    <div class="graded-collection-body">
      <div class="graded-collection-main">
        ${(!sealedPrices || sealedPrices.length === 0)
          ? html`<div class="muted" style=${{padding:"40px 12px",textAlign:"center",fontSize:13,lineHeight:1.5}}>
              Loading sealed products…
            </div>`
          : grouped.length === 0
          ? html`<div class="muted" style=${{padding:"40px 12px",textAlign:"center",fontSize:13,lineHeight:1.5}}>
              ${hideUnowned
                ? "No owned sealed products yet — uncheck \"Only owned\" to browse the catalog."
                : "No sealed products match your filters."}
            </div>`
          : grouped.map(section => {
              const collapsed = collapsedSets.has(section.set_id);
              const ownedInSet = section.items.filter(it => (sealedCollection[it.tcgplayer_product_id]||0) > 0).length;
              return html`<div key=${section.set_id} class="gc-set-block">
                <div class="gc-set-title gc-set-title-clickable"
                    onClick=${()=>toggleCollapsed(section.set_id)}>
                  <span class="gc-set-caret">${collapsed ? "▸" : "▾"}</span>
                  ${section.set_name}
                  <span class="muted">${ownedInSet} / ${section.items.length}</span>
                </div>
                ${!collapsed && html`<div class=${"gc-set-grid"+(displayMode==="compact"?" gc-compact":"")}>
                  ${section.items.map(item => {
                    const qty = sealedCollection[item.tcgplayer_product_id] || 0;
                    const price = item[priceField];
                    const url = tcgUrl(item.tcgplayer_product_id);
                    const dtype = deriveSealedDisplayType(item);
                    const bump = (delta) => {
                      const next = Math.max(0, Math.min(99, qty + delta));
                      if(next !== qty) updateSealedQty(item.tcgplayer_product_id, next);
                    };
                    return html`<div key=${item.tcgplayer_product_id} class=${"gc-card"+(qty>0?" gc-card-owned":"")}>
                      ${displayMode==="grid" && item.image_url && html`<img src=${item.image_url} alt="" class="gc-card-img sealed-card-img" loading="lazy"/>`}
                      <div class="gc-card-body">
                        <div class="gc-card-name" title=${item.name}>${cleanSealedName(item.name)}</div>
                        <div class="gc-card-sub muted">${dtype}</div>
                        <div class="gc-card-raw">
                          <span class="gc-card-raw-px">${useMarket?"Market":"Low"} ${fmt(price)}</span>
                          ${url && html`<a class="gc-card-buy" href=${url} target="_blank" rel="noopener nofollow"
                              onClick=${e=>e.stopPropagation()}
                              title="Buy on TCGPlayer">Buy ↗</a>`}
                        </div>
                        ${qty > 0 && html`<div class="gc-card-owned-value">
                          <span class="muted">Owned value</span>
                          <strong>${fmt((price || 0) * qty)}</strong>
                        </div>`}
                        ${readOnly
                          ? html`<div class="sealed-coll-counter sealed-coll-counter-readonly">
                              <span class=${"sealed-coll-counter-qty"+(qty>0?" has":"")}>×${qty}</span>
                            </div>`
                          : html`<div class="sealed-coll-counter">
                              <button onClick=${()=>bump(-1)} disabled=${qty<=0} aria-label="Decrease">−</button>
                              <span class=${"sealed-coll-counter-qty"+(qty>0?" has":"")}>${qty}</span>
                              <button onClick=${()=>bump(+1)} disabled=${qty>=99} aria-label="Increase">+</button>
                            </div>`}
                      </div>
                    </div>`;
                  })}
                </div>`}
              </div>`;
            })}
      </div>
    </div>
  </div>`;
}

// Graded Collection — user-owned graded cards + custom set-tracking goals.
// Two-column layout: left lists owned + tracked-but-unowned cards by set;
// right is the Set Tracking sidebar (add a set/rarities goal to populate
// checklist entries). Stores into public.graded_collection_items and
// public.graded_collection_goals via Supabase.
const GRADED_RARITY_OPTIONS = ["Common","Uncommon","Rare","Super Rare","Legendary","Enchanted","Epic","Iconic","Promo"];
// Portfolio-value chart for the Graded tab. Mirrors the raw-collection
// chart on the Home panel but pulls from graded_prices_daily and keys
// per (tcgplayer_product_id, grader, grade) slot instead of (pid, printing).
const GradedValueChart = ({items, cardById, rangeKey, setRangeKey}) => {
  const [historyRows, setHistoryRows] = useState(null);
  const [state, setState] = useState({loading: false, error: null});

  // Build the slot list. Skip rows whose card meta is missing from raw
  // (catalog hasn't loaded yet, or graded entry references a card we don't
  // have a product id for).
  const slots = useMemo(() => {
    const out = [];
    for(const it of (items || [])){
      const meta = cardById.get(it.card_id);
      if(!meta || !meta.tcgplayer_product_id) continue;
      out.push({pid: meta.tcgplayer_product_id, grader: it.grader, grade: it.grade, qty: it.quantity || 0});
    }
    return out;
  }, [items, cardById]);

  const slotsKey = useMemo(() => slots.map(s => `${s.pid}|${s.grader}|${s.grade}|${s.qty}`).sort().join(","), [slots]);

  useEffect(() => {
    if(!slots.length){ setHistoryRows([]); return; }
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    let cancelled = false;
    setState({loading: true, error: null});
    fetchGradedHistoryFor(slots, since)
      .then(rows => { if(!cancelled){ setHistoryRows(rows); setState({loading:false, error:null}); } })
      .catch(e => { if(!cancelled) setState({loading:false, error: String(e?.message || e)}); });
    return () => { cancelled = true; };
  }, [slotsKey, rangeKey]);

  const valueSeries = useMemo(() => historyRows ? computeGradedValueHistory(historyRows, slots) : null, [historyRows, slots]);
  const chartSeries = useMemo(() => {
    if(!valueSeries || !valueSeries.length) return [];
    return [{
      label: "Graded value (7d avg)",
      color: "var(--accent)",
      dashed: false,
      data: valueSeries.map(p => ({x: new Date(p.date+"T00:00:00Z").getTime(), y: p.value})),
    }];
  }, [valueSeries]);

  const currentValue = valueSeries && valueSeries.length ? valueSeries[valueSeries.length-1].value : 0;
  const startValue   = valueSeries && valueSeries.length ? valueSeries[0].value : null;
  const rangeDelta   = (startValue != null && startValue > 0) ? (currentValue - startValue) : null;
  const rangeDeltaPct= (startValue != null && startValue > 0) ? ((currentValue - startValue) / startValue * 100) : null;
  const deltaColor   = rangeDelta == null ? "var(--text-muted)" : rangeDelta >= 0 ? "var(--green)" : "var(--red)";
  const rangeLabel   = (COLLECTION_RANGES.find(r => r.key === rangeKey) || {}).label || rangeKey;

  if(!slots.length) return null;
  return html`<div class="graded-value-chart">
    <div class="gvc-header">
      <div class="gvc-title">Graded portfolio value</div>
      <div class="gvc-value">
        <span class="gvc-now">$${currentValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
        ${rangeDelta != null && html`<span class="gvc-delta" style=${{color:deltaColor}}>
          ${rangeDelta >= 0 ? "+" : ""}$${Math.abs(rangeDelta).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}
          <span style=${{opacity:0.8}}>(${rangeDeltaPct >= 0 ? "+" : ""}${rangeDeltaPct.toFixed(1)}%)</span>
          <span class="muted" style=${{fontWeight:400,fontSize:10,marginLeft:4}}>past ${rangeLabel}</span>
        </span>`}
      </div>
      <div class="panel-range-buttons">
        ${COLLECTION_RANGES.map(r => html`<button key=${r.key}
          class=${rangeKey===r.key?"active":""}
          onClick=${()=>setRangeKey(r.key)}>${r.label}</button>`)}
      </div>
    </div>
    <div class="gvc-chart">
      ${(chartSeries.length && chartSeries[0].data.length)
        ? html`<${LineChart} series=${chartSeries} width=720 height=180
            padding=${{top:6,right:8,bottom:22,left:60}}/>
            ${state.loading ? html`<div class="muted" style=${{fontSize:10,textAlign:"center",marginTop:-4}}>Refreshing…</div>` : null}`
        : state.loading
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>Loading…</div>`
          : state.error
            ? html`<div style=${{padding:"40px 0",textAlign:"center",color:"var(--red)",fontSize:11}}>${state.error}</div>`
            : html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>
                No graded price history for this range yet. Add some graded copies or extend the range.
              </div>`}
    </div>
  </div>`;
};

const GradedCollectionView = ({raw, user, onSignIn, theme, readOnly, viewedGradedRows}) => {
  const [items, setItems] = useState(null);          // owned graded cards
  const [goals, setGoals] = useState(null);          // tracking goals
  const [latestPrices, setLatestPrices] = useState(null); // graded_prices_latest cache
  const [addOpen, setAddOpen] = useState(false);
  const [goalOpen, setGoalOpen] = useState(false);
  const [loadErr, setLoadErr] = useState(null);
  // Click-to-open: builds a CardDetailModal-shaped "group" from raw rows
  // and shows the modal anchored to the graded tab.
  const [selectedGroup, setSelectedGroup] = useState(null);
  // Collapsed-state per set_id. Persisted to localStorage so collapsed
  // sections stay collapsed across tab switches.
  const [collapsedSets, setCollapsedSets] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("packsink:graded:collapsed") || "[]")); }
    catch { return new Set(); }
  });
  const toggleCollapsed = (sid) => setCollapsedSets(prev => {
    const next = new Set(prev);
    if(next.has(sid)) next.delete(sid); else next.add(sid);
    try { localStorage.setItem("packsink:graded:collapsed", JSON.stringify([...next])); } catch {}
    return next;
  });
  // Display mode: "grid" (default, with images) | "compact" (one row per card).
  const [displayMode, setDisplayMode] = useState(() => {
    try { return localStorage.getItem("packsink:graded:display") || "grid"; }
    catch { return "grid"; }
  });
  useEffect(() => { try { localStorage.setItem("packsink:graded:display", displayMode); } catch {} }, [displayMode]);
  // Portfolio value chart range. Persisted alongside the raw collection chart
  // pattern from the Home panel.
  const [chartRange, setChartRange] = useState("3m");

  // Load both user tables + the latest-prices snapshot. In viewer (read-only)
  // mode we use the rows passed in via props and don't fetch goals (they're
  // private tracking targets — not shared).
  useEffect(() => {
    if(readOnly){
      setItems(viewedGradedRows || []);
      setGoals([]);
    }
  }, [readOnly, viewedGradedRows]);
  useEffect(() => {
    if(readOnly) return;
    if(!user){ setItems([]); setGoals([]); return; }
    let cancelled = false;
    (async () => {
      try {
        const [it, gl, lp] = await Promise.all([
          sbClient.from("graded_collection_items")
            .select("card_id,grader,grade,quantity,updated_at")
            .eq("user_id", user.id),
          sbClient.from("graded_collection_goals")
            .select("goal_id,set_id,rarities,display_name,inserted_at")
            .eq("user_id", user.id),
          sbFetchAll("graded_prices_latest", {
            select: "tcgplayer_product_id,grader,grade,ebay_avg_1d,ebay_avg_7d,ebay_avg_30d,price_date",
          }).catch(()=>[]),
        ]);
        if(cancelled) return;
        if(it.error){ setLoadErr(it.error.message); return; }
        if(gl.error){ setLoadErr(gl.error.message); return; }
        setItems(it.data || []);
        setGoals(gl.data || []);
        setLatestPrices(lp || []);
      } catch(e){ if(!cancelled) setLoadErr(String(e?.message || e)); }
    })();
    return () => { cancelled = true; };
  }, [user, readOnly]);
  // Fetch latest prices in read-only mode too (anon-readable matview).
  useEffect(() => {
    if(!readOnly) return;
    let cancelled = false;
    (async () => {
      try {
        const lp = await sbFetchAll("graded_prices_latest", {
          select: "tcgplayer_product_id,grader,grade,ebay_avg_1d,ebay_avg_7d,ebay_avg_30d,price_date",
        }).catch(()=>[]);
        if(!cancelled) setLatestPrices(lp || []);
      } catch {/* ignore */}
    })();
    return () => { cancelled = true; };
  }, [readOnly]);

  // Index raw by card_id for metadata join (we need name/set/image/rarity).
  const cardById = useMemo(() => {
    const m = new Map();
    for(const r of (raw||[])){
      if(r.card_id && !m.has(r.card_id)) m.set(r.card_id, r);
    }
    return m;
  }, [raw]);
  // Index latest prices by (pid, grader, grade) for the "we have data" check.
  const priceByKey = useMemo(() => {
    const m = new Map();
    for(const p of (latestPrices||[])){
      m.set(p.tcgplayer_product_id + "|" + (p.grader||"") + "|" + p.grade, p);
    }
    return m;
  }, [latestPrices]);
  // Group cards in raw by set so the goal flow + main render can lay them out.
  const cardsBySetId = useMemo(() => {
    const m = new Map();
    for(const r of (raw||[])){
      if(!r.card_id || !r.set_id) continue;
      const arr = m.get(r.set_id) || [];
      arr.push(r);
      m.set(r.set_id, arr);
    }
    return m;
  }, [raw]);
  // Set name lookup.
  const setNameById = useMemo(() => {
    const m = new Map();
    for(const r of (raw||[])){
      if(r.set_id && r.Set && !m.has(r.set_id)) m.set(r.set_id, r.Set);
    }
    return m;
  }, [raw]);
  // Reverse: set_id by Set name for the goal picker dropdown.
  const setIdsByName = useMemo(() => {
    const m = new Map();
    for(const [sid, name] of setNameById){ m.set(name, sid); }
    return m;
  }, [setNameById]);

  // Compose the displayable list of entries (owned + tracked-but-unowned)
  // grouped by set. Tracked entries pull from each goal's set + rarity
  // filter; owned entries always show (regardless of goals). Dedupe per
  // (card_id, grader, grade) — owned wins over tracked-only.
  const grouped = useMemo(() => {
    if(!items || !goals) return [];
    const slotsByCard = new Map();   // card_id -> Map<grader|grade, {owned, qty}>
    const ensureCard = (cid) => {
      if(!slotsByCard.has(cid)) slotsByCard.set(cid, new Map());
      return slotsByCard.get(cid);
    };
    // Owned items first.
    for(const it of items){
      const slots = ensureCard(it.card_id);
      slots.set(it.grader + "|" + it.grade, {owned: true, qty: it.quantity, grader: it.grader, grade: it.grade});
    }
    // Tracked goals add placeholder slots when no graded copy is owned for
    // the card. Goal = (set_id, rarities[]). We don't pick a specific grade
    // for placeholders — show the card once with no grader/grade so the
    // user can later add an owned slot when they buy one.
    const trackedCardIds = new Set();
    for(const g of goals){
      const cardsInSet = cardsBySetId.get(g.set_id) || [];
      const rarFilter = new Set((g.rarities||[]).map(r => (r||"").toLowerCase()));
      for(const r of cardsInSet){
        if(rarFilter.size && !rarFilter.has((r.Rarity||"").toLowerCase())) continue;
        if(!r.card_id) continue;
        trackedCardIds.add(r.card_id);
        if(!slotsByCard.has(r.card_id)){
          slotsByCard.set(r.card_id, new Map());
          // placeholder slot for "tracked but no graded copy yet"
          slotsByCard.get(r.card_id).set("__placeholder", {owned: false, qty: 0});
        }
      }
    }
    // Bucket by set_id.
    const bySet = new Map();
    for(const [cid, slots] of slotsByCard){
      const meta = cardById.get(cid);
      if(!meta) continue;
      const sid = meta.set_id;
      if(!bySet.has(sid)) bySet.set(sid, []);
      const arr = Array.from(slots.values());
      arr.sort((a,b) => {
        if(a.owned !== b.owned) return a.owned ? -1 : 1;
        return (parseFloat(b.grade)||0) - (parseFloat(a.grade)||0);
      });
      bySet.get(sid).push({card: meta, slots: arr});
    }
    // Sort sets newest-first using MAINLINE_RELEASE_ORDER; promos sink.
    // Sort cards inside each set by collector number (Number = "12/204").
    const setEntries = Array.from(bySet.entries()).map(([sid, cards]) => ({
      set_id: sid,
      set_name: setNameById.get(sid) || "Unknown set",
      cards: cards.sort((a,b) => collectorNum(a.card) - collectorNum(b.card)),
    }));
    setEntries.sort((a,b) => {
      const ai = (typeof MAINLINE_RELEASE_ORDER !== "undefined") ? MAINLINE_RELEASE_ORDER.indexOf(a.set_name) : -1;
      const bi = (typeof MAINLINE_RELEASE_ORDER !== "undefined") ? MAINLINE_RELEASE_ORDER.indexOf(b.set_name) : -1;
      if(ai !== bi) return bi - ai;
      return a.set_name.localeCompare(b.set_name);
    });
    return setEntries;
  }, [items, goals, cardById, cardsBySetId, setNameById]);

  // Quick total/value math for the header.
  const totals = useMemo(() => {
    if(!items) return {owned: 0, slots: 0, value: 0};
    let owned = 0, slots = 0, value = 0;
    for(const it of items){
      slots++;
      owned += it.quantity;
      const meta = cardById.get(it.card_id);
      if(meta){
        const p = priceByKey.get(meta.tcgplayer_product_id + "|" + it.grader + "|" + it.grade);
        const px = p && (p.ebay_avg_7d ?? p.ebay_avg_1d ?? p.ebay_avg_30d);
        if(px) value += px * it.quantity;
      }
    }
    return {owned, slots, value};
  }, [items, cardById, priceByKey]);

  // Mutations — write through Supabase, then reload locally on success.
  const addItem = useCallback(async ({card_id, grader, grade, quantity}) => {
    if(!user) return;
    const row = {user_id: user.id, card_id, grader, grade, quantity: Math.max(1, Math.min(99, quantity || 1)),
      updated_at: new Date().toISOString()};
    const {error} = await sbClient.from("graded_collection_items").upsert(row, {onConflict: "user_id,card_id,grader,grade"});
    if(error){ alert("Save failed: " + error.message); return; }
    setItems(prev => {
      const ix = (prev||[]).findIndex(p => p.card_id===card_id && p.grader===grader && p.grade===grade);
      if(ix >= 0){ const out = (prev||[]).slice(); out[ix] = {...out[ix], quantity: row.quantity, updated_at: row.updated_at}; return out; }
      return [...(prev||[]), {card_id, grader, grade, quantity: row.quantity, updated_at: row.updated_at}];
    });
  }, [user]);
  const removeItem = useCallback(async ({card_id, grader, grade}) => {
    if(!user) return;
    const {error} = await sbClient.from("graded_collection_items").delete()
      .eq("user_id", user.id).eq("card_id", card_id).eq("grader", grader).eq("grade", grade);
    if(error){ alert("Delete failed: " + error.message); return; }
    setItems(prev => (prev||[]).filter(p => !(p.card_id===card_id && p.grader===grader && p.grade===grade)));
  }, [user]);
  const addGoal = useCallback(async ({set_id, rarities, display_name}) => {
    if(!user) return;
    const row = {user_id: user.id, set_id, rarities: rarities||[], display_name: display_name||null};
    const {data, error} = await sbClient.from("graded_collection_goals").insert(row).select().single();
    if(error){ alert("Save failed: " + error.message); return; }
    setGoals(prev => [...(prev||[]), data]);
  }, [user]);
  const removeGoal = useCallback(async (goal_id) => {
    if(!user) return;
    const {error} = await sbClient.from("graded_collection_goals").delete()
      .eq("user_id", user.id).eq("goal_id", goal_id);
    if(error){ alert("Delete failed: " + error.message); return; }
    setGoals(prev => (prev||[]).filter(g => g.goal_id !== goal_id));
  }, [user]);

  if(!user) return html`<div class="muted" style=${{fontSize:13,padding:"30px 0",textAlign:"center"}}>
    Sign in to track your graded collection.
    <button class="active" onClick=${onSignIn} style=${{marginLeft:10,padding:"7px 14px",fontSize:12}}>Sign in</button>
  </div>`;
  if(items == null) return html`<div class="muted" style=${{padding:"30px 0",textAlign:"center"}}>Loading graded collection…</div>`;
  if(loadErr) return html`<div style=${{padding:"20px 0",color:"var(--red)",fontSize:12}}>${loadErr}</div>`;

  return html`<div class="graded-collection">
    <div class="graded-collection-header">
      <div class="graded-collection-totals">
        <div class="gc-stat"><div class="gc-stat-val">${totals.owned}</div><div class="gc-stat-lbl">Owned copies</div></div>
        <div class="gc-stat"><div class="gc-stat-val">${totals.slots}</div><div class="gc-stat-lbl">Distinct slots</div></div>
        <div class="gc-stat"><div class="gc-stat-val green">$${totals.value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="gc-stat-lbl">Est. value (7d avg)</div></div>
      </div>
      <div class="graded-collection-header-actions">
        <div class="seg-toggle" title="Display mode">
          <button class=${displayMode==="grid"?"active":""} onClick=${()=>setDisplayMode("grid")}>Grid</button>
          <button class=${displayMode==="compact"?"active":""} onClick=${()=>setDisplayMode("compact")}>Compact</button>
        </div>
        ${!readOnly && html`<button class="active" onClick=${()=>setAddOpen(true)} style=${{padding:"7px 14px",fontSize:12}}>+ Add graded card</button>`}
      </div>
    </div>
    ${!readOnly && html`<${GradedValueChart} items=${items} cardById=${cardById}
      rangeKey=${chartRange} setRangeKey=${setChartRange}/>`}
    <div class="graded-collection-body">
      <div class="graded-collection-main">
        ${grouped.length === 0
          ? html`<div class="muted" style=${{padding:"40px 12px",textAlign:"center",fontSize:13,lineHeight:1.5}}>
              No graded cards yet. Click <strong>+ Add graded card</strong> above to log a copy you own, or add a Set Tracking goal on the right to start a checklist.
            </div>`
          : grouped.map(section => {
              const collapsed = collapsedSets.has(section.set_id);
              const ownedInSet = section.cards.filter(c => c.slots.some(s => s.owned)).length;
              return html`<div key=${section.set_id} class="gc-set-block">
                <div class="gc-set-title gc-set-title-clickable"
                    onClick=${()=>toggleCollapsed(section.set_id)}>
                  <span class="gc-set-caret">${collapsed ? "▸" : "▾"}</span>
                  ${section.set_name}
                  <span class="muted">${ownedInSet} / ${section.cards.length}</span>
                </div>
                ${!collapsed && html`<div class=${"gc-set-grid"+(displayMode==="compact"?" gc-compact":"")}>
                  ${section.cards.map(({card, slots}) => {
                    // Build a CardDetailModal-shaped group from raw rows for
                    // this card_id. groupCards() merges Normal + Foil rows
                    // into a single group. Run lazily on click.
                    const openDetail = () => {
                      const matching = (raw||[]).filter(r => r.card_id === card.card_id);
                      const groups = matching.length ? groupCards(matching) : [card];
                      setSelectedGroup(groups[0] || card);
                    };
                    // Ink tile background. Single ink: light tint. Two inks
                    // (dual): 90deg gradient across both.
                    const inkList = (card.inks && card.inks.length) ? card.inks : (card.ink ? [card.ink] : []);
                    const tileBg = inkList.length === 2
                      ? `linear-gradient(135deg, ${inkTint(inkList[0], theme)} 0%, ${inkTint(inkList[1], theme)} 100%)`
                      : (inkList.length === 1 ? inkTint(inkList[0], theme) : null);
                    // Raw reference: prefer Low → Market. The cardById grabs
                    // whichever row was first; for variants their price is
                    // null, so this falls through and we hide the strip.
                    const rawPx = card["Low Price"] ?? card["TCGPlayer Market"] ?? null;
                    const isCustomVariant = !!card.isCustomVariant;
                    // Custom variants share their base's tcgplayer_product_id
                    // and inherit the base's graded prices. That's misleading
                    // — the variant has no graded market. Suppress price
                    // lookups for variants entirely.
                    const variantSuffix = card.variant_label
                      ? ` (${card.variant_label.replace(/\s*Variant$/i, "")})`
                      : "";
                    return html`<div key=${card.card_id} class="gc-card gc-card-clickable"
                        style=${tileBg ? {background: tileBg} : null}
                        onClick=${openDetail}
                        title="Open card · graded prices">
                      ${card.img_small && html`<img src=${card.img_small} alt="" class="gc-card-img"/>`}
                      <div class="gc-card-body">
                        <div class="gc-card-name" title=${(card["Product Name"]||"") + variantSuffix}>
                          ${card["Product Name"]||"Unknown"}${variantSuffix}
                        </div>
                        <div class="gc-card-sub muted">#${(card.Number||"").split("/")[0] || "?"} · ${card.Rarity||""}</div>
                        ${(rawPx != null || (card.tcgplayer_product_id && !isCustomVariant)) && html`<div class="gc-card-raw">
                          ${rawPx != null && html`<span class="gc-card-raw-px">Raw $${Number(rawPx).toLocaleString(undefined,{maximumFractionDigits:2})}</span>`}
                          ${card.tcgplayer_product_id && !isCustomVariant && html`<a class="gc-card-buy" href=${tcgUrl(card.tcgplayer_product_id, card.tcg_printing||"Normal")}
                              target="_blank" rel="noopener nofollow"
                              onClick=${e=>e.stopPropagation()}
                              title="Buy on TCGPlayer">Buy ↗</a>`}
                        </div>`}
                        <div class="gc-card-slots">
                          ${slots.map((s, si) => {
                            if(!s.owned){
                              // Tracking placeholder. Show a PSA 10 reference
                              // price for real cards; suppress for custom
                              // variants (their base's graded data is the
                              // wrong reference).
                              if(isCustomVariant){
                                return html`<span key=${si} class="gc-slot gc-slot-tracked" title="Tracked — variant has no graded market"
                                  onClick=${e=>e.stopPropagation()}>Tracking</span>`;
                              }
                              const refKey = card.tcgplayer_product_id + "|psa|10";
                              const refP = priceByKey.get(refKey);
                              const refPx = refP && (refP.ebay_avg_7d ?? refP.ebay_avg_1d ?? refP.ebay_avg_30d);
                              return html`<span key=${si} class="gc-slot gc-slot-tracked" title="Tracked — not yet owned"
                                onClick=${e=>e.stopPropagation()}>
                                Tracking
                                ${refPx != null && html`<span class="gc-slot-px gc-slot-px-ref">PSA 10 · $${Number(refPx).toLocaleString(undefined,{maximumFractionDigits:0})}</span>`}
                              </span>`;
                            }
                            const pk = card.tcgplayer_product_id + "|" + s.grader + "|" + s.grade;
                            const p = isCustomVariant ? null : priceByKey.get(pk);
                            const px = p && (p.ebay_avg_7d ?? p.ebay_avg_1d ?? p.ebay_avg_30d);
                            return html`<span key=${si} class=${"gc-slot gc-slot-owned" + (readOnly ? " gc-slot-readonly" : "")}
                              title=${readOnly ? `${(s.grader||"").toUpperCase()} ${s.grade}` : ("Remove this " + (s.grader||"").toUpperCase() + " " + s.grade + " from your collection")}
                              onClick=${readOnly ? (e=>e.stopPropagation()) : (e=>{ e.stopPropagation(); if(confirm(`Remove ${(s.grader||"").toUpperCase()} ${s.grade} of ${card["Product Name"]}?`)) removeItem({card_id: card.card_id, grader: s.grader, grade: s.grade}); })}>
                              <span class="gc-slot-tag">${(s.grader||"").toUpperCase()} ${s.grade}</span>
                              <span class="gc-slot-qty">×${s.qty}</span>
                              ${px != null && html`<span class="gc-slot-px">$${Number(px).toLocaleString(undefined,{maximumFractionDigits:0})}</span>`}
                            </span>`;
                          })}
                        </div>
                      </div>
                    </div>`;
                  })}
                </div>`}
              </div>`;
            })}
      </div>
      ${!readOnly && html`<aside class="graded-collection-side">
        <div class="gc-side-head">
          <span>Set Tracking</span>
          <button class="active" onClick=${()=>setGoalOpen(true)} style=${{padding:"5px 10px",fontSize:11}}>+ Add</button>
        </div>
        <div class="gc-side-body">
          ${goals && goals.length === 0
            ? html`<div class="muted" style=${{fontSize:12,padding:"12px 0",lineHeight:1.5}}>
                No tracking goals. Add one to surface a checklist of cards you're chasing — e.g. <em>Fabled · Epic + Enchanted + Iconic</em>.
              </div>`
            : (goals||[]).map(g => {
                // x/X math for this goal: total = cards in goal's set matching
                // the rarity filter; owned = subset where the user has any
                // graded slot recorded. Goals with empty rarities[] track
                // every rarity in the set.
                const cardsInSet = cardsBySetId.get(g.set_id) || [];
                const rar = new Set((g.rarities||[]).map(r => (r||"").toLowerCase()));
                const inGoal = cardsInSet.filter(r => !rar.size || rar.has((r.Rarity||"").toLowerCase()));
                const inGoalIds = new Set(inGoal.map(r => r.card_id).filter(Boolean));
                const ownedSet = new Set((items||[]).map(it => it.card_id));
                const ownedCount = [...inGoalIds].filter(cid => ownedSet.has(cid)).length;
                const total = inGoalIds.size;
                const pct = total ? Math.round((ownedCount/total)*100) : 0;
                return html`<div key=${g.goal_id} class="gc-goal">
                  <div class="gc-goal-name">${g.display_name || setNameById.get(g.set_id) || "Goal"}</div>
                  <div class="gc-goal-sub muted">${setNameById.get(g.set_id) || g.set_id}${g.rarities?.length ? " · " + g.rarities.join(" · ") : " · All rarities"}</div>
                  <div class="gc-goal-progress">
                    <div class="gc-goal-progress-bar"><div class="gc-goal-progress-fill" style=${{width: pct+"%"}}></div></div>
                    <span class="gc-goal-progress-text">${ownedCount} / ${total} ${total ? `· ${pct}%` : ""}</span>
                  </div>
                  <button class="gc-goal-remove" onClick=${()=>{ if(confirm("Remove this tracking goal?")) removeGoal(g.goal_id); }}
                    title="Remove goal">×</button>
                </div>`;
              })}
        </div>
      </aside>`}
    </div>
    ${addOpen && html`<${GradedCollectionAddModal}
      raw=${raw} cardById=${cardById} priceByKey=${priceByKey}
      onClose=${()=>setAddOpen(false)}
      onAdd=${async (p) => { await addItem(p); setAddOpen(false); }}/>`}
    ${goalOpen && html`<${GradedCollectionGoalModal}
      setNameById=${setNameById} setIdsByName=${setIdsByName}
      onClose=${()=>setGoalOpen(false)}
      onAdd=${async (p) => { await addGoal(p); setGoalOpen(false); }}/>`}
    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      user=${readOnly ? null : user} collection=${{}} updateQty=${()=>{}}
      onSignIn=${onSignIn}
      initialTab="graded"
      onClose=${()=>setSelectedGroup(null)}/>`}
  </div>`;
};

// Modal for adding a graded card to the collection. Search → pick a card →
// pick grader/grade → validate against graded_prices_latest → save.
const GradedCollectionAddModal = ({raw, cardById, priceByKey, onClose, onAdd}) => {
  const [query, setQuery] = useState("");
  const [pickedId, setPickedId] = useState(null);
  const [grader, setGrader] = useState("psa");
  const [grade, setGrade] = useState("10");
  const [qty, setQty] = useState(1);
  const [busy, setBusy] = useState(false);

  const hits = useMemo(() => {
    const q = query.trim().toLowerCase();
    if(q.length < 2 && !pickedId) return [];
    const seen = new Set();
    const out = [];
    for(const r of (raw||[])){
      if(!r.card_id || seen.has(r.card_id)) continue;
      const name = (r["Product Name"]||"").toLowerCase();
      if(q && !name.includes(q)) continue;
      seen.add(r.card_id);
      out.push(r);
      if(out.length >= 50) break;
    }
    return out;
  }, [raw, query, pickedId]);

  const picked = pickedId ? cardById.get(pickedId) : null;
  const priceKey = picked ? (picked.tcgplayer_product_id + "|" + grader + "|" + grade) : null;
  const hasPriceData = picked ? priceByKey.has(priceKey) : false;
  const priceRow = priceKey ? priceByKey.get(priceKey) : null;
  const priceVal = priceRow && (priceRow.ebay_avg_7d ?? priceRow.ebay_avg_1d ?? priceRow.ebay_avg_30d);

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:560}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Add a graded card</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18}}>
        ${!picked && html`<div>
          <input type="search" placeholder="Search by name…"
            value=${query} onInput=${e=>setQuery(e.target.value)}
            style=${{width:"100%",padding:"8px 12px",border:"1px solid var(--btn-border)",
              borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13,marginBottom:10,
              fontFamily:"'Nunito Sans',sans-serif"}}/>
          <div style=${{maxHeight:380,overflowY:"auto",display:"flex",flexDirection:"column",gap:3}}>
            ${query.trim().length < 2
              ? html`<div class="muted" style=${{fontSize:12,padding:"20px 0",textAlign:"center"}}>Type at least 2 characters to search.</div>`
              : hits.length === 0
                ? html`<div class="muted" style=${{fontSize:12,padding:"20px 0",textAlign:"center"}}>No matches.</div>`
                : hits.map(c => html`<button key=${c.card_id} class="gc-add-hit"
                    onClick=${()=>setPickedId(c.card_id)}>
                    ${c.img_small && html`<img src=${c.img_small} alt=""/>`}
                    <div style=${{minWidth:0,flex:1,textAlign:"left"}}>
                      <div style=${{fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>${c["Product Name"]}</div>
                      <div class="muted" style=${{fontSize:10,display:"flex",alignItems:"center",gap:4}}>${c.Set} · #${c.collector_number||"?"} · <${RarityTag} rarity=${c.Rarity}/></div>
                    </div>
                  </button>`)}
          </div>
        </div>`}
        ${picked && html`<div>
          <div style=${{display:"flex",gap:12,alignItems:"center",marginBottom:14}}>
            ${picked.img_small && html`<img src=${picked.img_small} alt="" style=${{width:60,height:84,objectFit:"cover",borderRadius:4}}/>`}
            <div style=${{minWidth:0,flex:1}}>
              <div style=${{fontWeight:700,fontSize:14}}>${picked["Product Name"]}</div>
              <div class="muted" style=${{fontSize:11,display:"flex",alignItems:"center",gap:4}}>${picked.Set} · #${picked.collector_number||"?"} · <${RarityTag} rarity=${picked.Rarity}/></div>
            </div>
            <button class="settings-action link" onClick=${()=>setPickedId(null)}>Change</button>
          </div>
          <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:10,marginBottom:12}}>
            <label>
              <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Grader</div>
              <select value=${grader} onChange=${e=>setGrader(e.target.value)}
                style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",
                  borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}>
                ${["psa","cgc","bgs","sgc","tag"].map(g => html`<option key=${g} value=${g}>${g.toUpperCase()}</option>`)}
              </select>
            </label>
            <label>
              <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Grade</div>
              <select value=${grade} onChange=${e=>setGrade(e.target.value)}
                style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",
                  borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}>
                ${["10","9.5","9","8.5","8","7","6","5","4","3","2","1"].map(g => html`<option key=${g} value=${g}>${g}</option>`)}
              </select>
            </label>
            <label>
              <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Qty</div>
              <input type="number" min="1" max="99" value=${qty}
                onChange=${e=>setQty(Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)))}
                style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",
                  borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
            </label>
          </div>
          <div style=${{padding:"10px 12px",background:hasPriceData?"var(--accent-glow)":"rgba(220,38,38,0.07)",
            border:"1px solid "+(hasPriceData?"var(--border-accent)":"rgba(220,38,38,0.3)"),borderRadius:6,
            fontSize:12,marginBottom:14,lineHeight:1.5}}>
            ${hasPriceData
              ? html`<span style=${{color:"var(--accent)",fontWeight:700}}>✓ Price data available</span>
                  · ${grader.toUpperCase()} ${grade} 7d avg: <strong>$${Number(priceVal||0).toLocaleString(undefined,{maximumFractionDigits:2})}</strong>`
              : html`<span style=${{color:"var(--red)",fontWeight:700}}>⚠ No price data for this grader/grade</span>
                  · You can still save it; portfolio value will exclude this slot until a sale is recorded.`}
          </div>
          <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick=${onClose}>Cancel</button>
            <button class="active" disabled=${busy} onClick=${async ()=>{
              setBusy(true);
              await onAdd({card_id: picked.card_id, grader, grade, quantity: qty});
              setBusy(false);
            }} style=${{padding:"7px 16px",fontSize:13}}>
              ${busy ? "Saving…" : "Save to collection"}
            </button>
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
};

// Modal for adding a Set Tracking goal. Pick set + optional rarities subset.
const GradedCollectionGoalModal = ({setNameById, setIdsByName, onClose, onAdd}) => {
  const [setName, setSetName] = useState("");
  const [rarities, setRarities] = useState(new Set());
  const [displayName, setDisplayName] = useState("");
  const [busy, setBusy] = useState(false);
  const setOptions = useMemo(() => {
    return Array.from(setIdsByName.keys()).sort((a,b) => {
      const ai = (typeof MAINLINE_RELEASE_ORDER !== "undefined") ? MAINLINE_RELEASE_ORDER.indexOf(a) : -1;
      const bi = (typeof MAINLINE_RELEASE_ORDER !== "undefined") ? MAINLINE_RELEASE_ORDER.indexOf(b) : -1;
      if(ai !== bi) return bi - ai;
      return a.localeCompare(b);
    });
  }, [setIdsByName]);
  const canSave = setName && setIdsByName.has(setName);

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:480}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Add tracking goal</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18}}>
        <p class="muted" style=${{fontSize:12,margin:"0 0 14px",lineHeight:1.5}}>
          Pick a set and (optionally) the rarities you care about. Every matching card shows up in your Graded collection as a "Tracking" placeholder until you log a graded copy.
        </p>
        <label style=${{display:"block",marginBottom:12}}>
          <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Set</div>
          <select value=${setName} onChange=${e=>setSetName(e.target.value)}
            style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",
              borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}>
            <option value="">— Pick a set —</option>
            ${setOptions.map(s => html`<option key=${s} value=${s}>${s}</option>`)}
          </select>
        </label>
        <div style=${{marginBottom:12}}>
          <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Rarities</div>
          <div style=${{display:"flex",flexWrap:"wrap",gap:4}}>
            ${GRADED_RARITY_OPTIONS.map(r => html`<button key=${r}
              class=${"chip "+(rarities.has(r)?"active":"")}
              onClick=${()=>setRarities(prev=>{ const n=new Set(prev); n.has(r)?n.delete(r):n.add(r); return n; })}>${r}</button>`)}
          </div>
          <div class="muted" style=${{fontSize:10,marginTop:4}}>Leave empty to track all rarities in this set.</div>
        </div>
        <label style=${{display:"block",marginBottom:14}}>
          <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Display name (optional)</div>
          <input type="text" value=${displayName} onChange=${e=>setDisplayName(e.target.value)} maxLength="60"
            placeholder=${setName ? setName + " chase" : "e.g. Fabled chase"}
            style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",
              borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13,
              fontFamily:"'Nunito Sans',sans-serif"}}/>
        </label>
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick=${onClose}>Cancel</button>
          <button class="active" disabled=${!canSave || busy} onClick=${async ()=>{
            setBusy(true);
            await onAdd({set_id: setIdsByName.get(setName), rarities: Array.from(rarities), display_name: displayName.trim() || null});
            setBusy(false);
          }} style=${{padding:"7px 16px",fontSize:13}}>
            ${busy ? "Saving…" : "Add goal"}
          </button>
        </div>
      </div>
    </div>
  </div>`;
};

const CollectionView = ({raw, user, collection, collectionLoading, updateQty, bulkUpdateCollection, sealedPrices, sealedCollection, updateSealedQty, tabClickNonce, onSignIn, theme, viewerContext, currentUser, viewerOwnCollection, viewerOwnSealedCollection, ownerProfile, saveCollectionVisibility, regenerateCollectionShareToken}) => {
  const isViewerMode = !!viewerContext;
  const viewerVis = viewerContext?.data?.visibility || {raw:false, sealed:false, graded:false};
  // Comparison filter for viewer mode: "all" | "missing" | "shared".
  // Only meaningful when the viewer is signed in and has their own collection.
  const [compareMode, setCompareMode] = useState("all");
  const canCompare = isViewerMode && !!currentUser && !!viewerOwnCollection;
  // Share-dropdown state for the owner's tab header. Closes on outside click
  // and Escape, same UX pattern as the global settings popover.
  const [shareOpen, setShareOpen] = useState(false);
  const shareRef = useRef(null);
  useEffect(() => {
    if(!shareOpen) return;
    const onClick = (e) => { if(shareRef.current && !shareRef.current.contains(e.target)) setShareOpen(false); };
    const onKey   = (e) => { if(e.key === "Escape") setShareOpen(false); };
    document.addEventListener("mousedown", onClick);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onClick); document.removeEventListener("keydown", onKey); };
  }, [shareOpen]);
  // All hooks must run unconditionally on every render (Rules of Hooks).
  // Initial value reads ?set= from the URL so refresh/back-forward land on
  // the same set the user was viewing instead of bouncing them to the grid.
  const [selectedSet, setSelectedSet] = useState(() => {
    try { return new URL(window.location.href).searchParams.get("set") || null; }
    catch { return null; }
  });
  // Push a discrete history entry on entering a set so browser back goes
  // /collection?set=X → /collection (grid) instead of skipping the set
  // page entirely and landing on whatever view was open before Collection.
  useEffect(() => {
    try {
      const u = new URL(window.location.href);
      const cur = u.searchParams.get("set");
      if(cur === selectedSet) return;
      if(selectedSet) u.searchParams.set("set", selectedSet);
      else            u.searchParams.delete("set");
      window.history.pushState({set: selectedSet || null}, "", u.toString());
    } catch {}
  }, [selectedSet]);
  // Browser back/forward — sync selectedSet from the URL so a popstate
  // event re-renders the right view.
  useEffect(() => {
    const onPop = () => {
      try {
        const v = new URL(window.location.href).searchParams.get("set");
        setSelectedSet(v || null);
      } catch {}
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  // Cards-vs-Sealed top-level toggle. Persisted so coming back lands on the
  // tab the user was last using.
  const [section, setSection] = useState(()=>{
    try { return localStorage.getItem("packsink:collection:section") || "cards"; }
    catch { return "cards"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:collection:section", section); } catch {} }, [section]);
  // Re-clicking the Collection tab while inside a set drops back to the
  // top-level set grid. tabClickNonce increments on every tab click.
  useEffect(() => {
    if(tabClickNonce > 0) setSelectedSet(null);
  }, [tabClickNonce]);
  // 1 = Master Set, 4 = Play Set. Any integer 1-4 supported.
  const [copies, setCopies] = useState(1);
  // CSV import flow state. null when idle; {report, mode, busy} when a file
  // has been parsed and the user is reviewing the preview modal.
  const [importState, setImportState] = useState(null);
  const importFileRef = useRef(null);

  // Map raw rows by (card_id, tcg_printing) for fast lookup
  const cardByKey = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.card_id && r.tcg_printing){
      m[r.card_id+":"+r.tcg_printing] = r;
    }
    return m;
  }, [raw]);

  // Index for CSV import: normalized Product Name → [raw rows]. Used to
  // resolve Dreamborn export rows (which key on Name + collector number)
  // back to our (card_id, tcg_printing) shape. Normalized so case +
  // punctuation drift between Dreamborn and Lorcast doesn't drop matches.
  const rowsByName = useMemo(()=>{
    const m = {}, mSquash = {};
    for(const r of raw){
      const n = r["Product Name"];
      if(!n || !r.card_id || !r.tcg_printing) continue;
      const k = normalizeCardName(n);
      if(!m[k]) m[k] = [];
      m[k].push(r);
      const sk = squashCardName(n);
      if(!mSquash[sk]) mSquash[sk] = [];
      mSquash[sk].push(r);
    }
    return {primary:m, squash:mSquash};
  }, [raw]);

  // Per-set card lists by rarity bucket — used both for catalog totals and
  // missing/extras value calculation. Each bucket is a Set<card_id>.
  const setCardLists = useMemo(()=>{
    const m = {};
    const ensure = (s) => {
      if(!m[s]) m[s] = {normal:new Set(), foil:new Set(), enchanted:new Set(), iconic:new Set(), epic:new Set()};
      return m[s];
    };
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      const s = ensure(r.Set);
      if(r.Rarity === "Enchanted")    s.enchanted.add(r.card_id);
      else if(r.Rarity === "Iconic")  s.iconic.add(r.card_id);
      else if(r.Rarity === "Epic")    s.epic.add(r.card_id);
      else if(r.tcg_printing === "Normal") s.normal.add(r.card_id);
      else s.foil.add(r.card_id);
    }
    return m;
  }, [raw]);

  const setTotals = useMemo(()=>{
    const out = {};
    for(const [k,v] of Object.entries(setCardLists)){
      out[k] = {normal:v.normal.size, foil:v.foil.size, enchanted:v.enchanted.size, iconic:v.iconic.size, epic:v.epic.size};
    }
    return out;
  }, [setCardLists]);

  // What the user owns, grouped by set + rarity bucket (unique card_ids)
  const owned = useMemo(()=>{
    const m = {};
    const ensure = (s) => {
      if(!m[s]) m[s] = {normal:new Set(), foil:new Set(), enchanted:new Set(), iconic:new Set(), epic:new Set()};
      return m[s];
    };
    for(const [key, qty] of Object.entries(collection)){
      if(qty<=0) continue;
      const card = cardByKey[key];
      if(!card || !SET_ORDER.includes(card.Set)) continue;
      const s = ensure(card.Set);
      if(card.Rarity === "Enchanted")     s.enchanted.add(card.card_id);
      else if(card.Rarity === "Iconic")   s.iconic.add(card.card_id);
      else if(card.Rarity === "Epic")     s.epic.add(card.card_id);
      else if(card.tcg_printing === "Normal") s.normal.add(card.card_id);
      else s.foil.add(card.card_id);
    }
    return m;
  }, [collection, cardByKey]);

  // Compute missing $ and extras $ relative to the chosen copies target.
  // Iterate every main-set (card, printing) pair: needed=copies, owned=qty,
  // missing += max(0, needed-owned)*price, extras += max(0, owned-needed)*price.
  const valueStats = useMemo(()=>{
    let totalValue = 0, totalCards = 0, totalUnique = 0;
    let missing = 0, extras = 0;
    const seenKey = new Set();

    // Iterate main-set products in raw to compute missing
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      if(!r.card_id || !r.tcg_printing) continue;
      const key = r.card_id+":"+r.tcg_printing;
      if(seenKey.has(key)) continue;
      seenKey.add(key);
      const qty = collection[key] || 0;
      const price = r["Low Price"] ?? r["TCGPlayer Market"] ?? 0;
      const need = copies;
      const short = Math.max(0, need - qty);
      const over  = Math.max(0, qty - need);
      missing += short * price;
      extras  += over  * price;
    }
    // Total value across ALL owned cards (including non-main-set if any)
    for(const [key, qty] of Object.entries(collection)){
      if(qty<=0) continue;
      totalCards += qty;
      totalUnique += 1;
      const card = cardByKey[key];
      if(card){
        const price = card["Low Price"] ?? card["TCGPlayer Market"] ?? 0;
        totalValue += price * qty;
      }
    }
    return {totalValue, totalCards, totalUnique, missing, extras};
  }, [raw, collection, cardByKey, copies]);

  // For per-set missing dollar amounts — same logic, scoped to a set.
  const setMissing = useMemo(()=>{
    const m = {};
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      if(!r.card_id || !r.tcg_printing) continue;
      const key = r.card_id+":"+r.tcg_printing;
      const qty = collection[key] || 0;
      const need = copies;
      const short = Math.max(0, need - qty);
      if(short === 0) continue;
      const price = r["Low Price"] ?? r["TCGPlayer Market"] ?? 0;
      if(!m[r.Set]) m[r.Set] = {count:0, value:0};
      m[r.Set].count += short;
      m[r.Set].value += short * price;
    }
    return m;
  }, [raw, collection, copies]);

  const handleImportFile = useCallback(async (file) => {
    if(!file) return;
    let text;
    try { text = await file.text(); }
    catch(e){ alert("Couldn't read file: "+e.message); return; }
    const report = parseDreambornCsv(text, rowsByName);
    if(report.error){ alert(report.error); return; }
    if(!report.entries.length){
      alert("CSV parsed but no rows have Normal or Foil quantities > 0. Nothing to import.");
      return;
    }
    setImportState({report, mode:"replace", busy:false});
  }, [rowsByName]);

  const commitImport = useCallback(async () => {
    if(!importState || !bulkUpdateCollection) return;
    const {report, mode} = importState;
    setImportState(s => ({...s, busy:true}));
    const updates = [];
    for(const e of report.entries){
      const cur = collection[e.cardId+":"+e.printing] || 0;
      const qty = mode==="add" ? cur + e.qty : e.qty;
      updates.push({cardId:e.cardId, printing:e.printing, qty});
    }
    const result = await bulkUpdateCollection(updates);
    if(!result || !result.ok){
      const msg = (result && result.error) || "unknown error";
      alert(`Import failed after writing ${result?.written ?? 0} rows: ${msg}\n\nYour collection has been rolled back to its previous state.`);
      setImportState(s => ({...s, busy:false}));
      return;
    }
    setImportState(null);
  }, [importState, bulkUpdateCollection, collection]);

  // Early returns AFTER all hooks.
  // Viewer-mode loading / error states. In viewer mode `user` is the OWNER
  // profile (populated only after the visibility RPC resolves), so we have
  // to gate before the !user check below.
  if(isViewerMode){
    if(viewerContext.error){
      return html`<div class="empty-state">
        <button class="settings-action link" style=${{marginBottom:12}} onClick=${viewerContext.onClose}>← Back</button>
        <h2 class="title-font">${viewerContext.error}</h2>
        <p>The owner may have made it private, or the link has been revoked.</p>
      </div>`;
    }
    if(!viewerContext.data){
      return html`<div class="empty-state"><p>Loading collection…</p></div>`;
    }
  }

  if(!user) return html`<div class="empty-state">
    <h2 class="title-font">Sign in to track your collection</h2>
    <p>Save the cards you own to Packs.Ink and we'll show your set completion, total value at current Low prices, and what you're still missing.</p>
    <button class="active" onClick=${onSignIn} style=${{padding:"10px 20px",fontSize:14,marginTop:14}}>Sign in with Google</button>
  </div>`;

  if(selectedSet) return html`<${CollectionSetDetail} setName=${selectedSet} raw=${raw}
    collection=${collection} updateQty=${updateQty} bulkUpdateCollection=${bulkUpdateCollection}
    onBack=${()=>setSelectedSet(null)} theme=${theme}
    user=${user} onSignIn=${onSignIn} copies=${copies}
    readOnly=${isViewerMode}
    compareMode=${canCompare ? compareMode : "all"}
    viewerOwnCollection=${viewerOwnCollection || null}/>`;

  const {totalValue, totalCards, totalUnique, missing, extras} = valueStats;
  const setsToShow = [...SET_ORDER].reverse().filter(s => setTotals[s]);
  const totalMissingCount = Object.values(setMissing).reduce((s,v)=>s+v.count, 0);

  // For overall master/play set %: count owned vs needed across all main-set
  // printings. Extras & Oddities is a curio bucket (starter-deck-exclusive
  // foils etc), not part of the mainline "complete the set" goal — exclude
  // it from both totals so the headline % isn't artificially deflated.
  let totalNeeded = 0, totalOwnedTowardNeed = 0;
  for(const k of Object.keys(setCardLists)){
    if(k === EXTRAS_SET_NAME) continue;
    const tot = setTotals[k];
    totalNeeded += (tot.normal + tot.foil + tot.enchanted + tot.iconic + tot.epic) * copies;
  }
  for(const [key, qty] of Object.entries(collection)){
    if(qty<=0) continue;
    const card = cardByKey[key];
    if(!card || !SET_ORDER.includes(card.Set)) continue;
    if(card.Set === EXTRAS_SET_NAME) continue;
    totalOwnedTowardNeed += Math.min(qty, copies);
  }
  const masterPct = totalNeeded ? (totalOwnedTowardNeed / totalNeeded * 100) : 0;

  // Viewer-mode: if the user lands on a tab whose section isn't visible
  // to them (private to them), fall back to the first visible section.
  const effectiveSection = (() => {
    if(!isViewerMode) return section;
    if(section === "cards"  && viewerVis.raw)    return "cards";
    if(section === "sealed" && viewerVis.sealed) return "sealed";
    if(section === "graded" && viewerVis.graded) return "graded";
    if(viewerVis.raw)    return "cards";
    if(viewerVis.sealed) return "sealed";
    if(viewerVis.graded) return "graded";
    return null;
  })();

  return html`<div>
    ${isViewerMode && (() => {
      const p = viewerContext.data?.profile || {};
      const openProfile = () => {
        if(!p.user_id) return;
        try {
          const u = new URL(window.location.href);
          u.pathname = "/decks";
          u.searchParams.delete("collection");
          u.searchParams.delete("token");
          u.searchParams.set("user", p.user_id);
          window.history.pushState({user: p.user_id}, "", u.toString());
          window.dispatchEvent(new PopStateEvent("popstate"));
        } catch {}
      };
      const initial = (p.display_name || "?").trim().charAt(0).toUpperCase() || "?";
      return html`<div class="collection-viewer-banner">
        <button class="settings-action link" onClick=${viewerContext.onClose}>← Back</button>
        ${p.avatar_url
          ? html`<img class="collection-viewer-avatar" src=${p.avatar_url} alt=""
              onClick=${openProfile} title="View profile"/>`
          : html`<span class="collection-viewer-avatar collection-viewer-avatar-fallback"
              onClick=${openProfile} title="View profile">${initial}</span>`}
        <button class="collection-viewer-name" onClick=${openProfile}
          title="View ${p.display_name || "user"}'s profile">
          ${p.display_name || "Anonymous user"}
        </button>
        ${canCompare && html`<label class="collection-viewer-compare" title="Filter by what you own vs what they own">
          <span>Compare:</span>
          <select value=${compareMode} onChange=${e=>setCompareMode(e.target.value)}>
            <option value="all">All cards</option>
            <option value="missing">Missing for me</option>
            <option value="shared">We both have</option>
          </select>
        </label>`}
      </div>`;
    })()}
    ${canCompare && (() => {
      // Comparison stats — count distinct (card_id, printing) slots the
      // owner has at qty > 0, then check whether the viewer has each slot
      // too. Sealed gets the same treatment for the (pid) key.
      let theirRaw = 0, sharedRaw = 0;
      for(const [k, q] of Object.entries(collection)){
        if(q <= 0) continue;
        theirRaw += 1;
        if((viewerOwnCollection?.[k] || 0) > 0) sharedRaw += 1;
      }
      let theirSealed = 0, sharedSealed = 0;
      if(sealedCollection && viewerOwnSealedCollection){
        for(const [pid, q] of Object.entries(sealedCollection)){
          if(q <= 0) continue;
          theirSealed += 1;
          if((viewerOwnSealedCollection[pid] || 0) > 0) sharedSealed += 1;
        }
      }
      const missingRaw    = theirRaw    - sharedRaw;
      const missingSealed = theirSealed - sharedSealed;
      const showSealedRow = viewerVis.sealed && theirSealed > 0;
      return html`<div class="collection-compare-stats">
        <div class="ccs-row">
          <span class="ccs-label">Cards</span>
          <span class="ccs-stat"><b>${theirRaw}</b> they own</span>
          <span class="ccs-stat ccs-shared"><b>${sharedRaw}</b> we both have</span>
          <span class="ccs-stat ccs-missing"><b>${missingRaw}</b> missing for you</span>
        </div>
        ${showSealedRow && html`<div class="ccs-row">
          <span class="ccs-label">Sealed</span>
          <span class="ccs-stat"><b>${theirSealed}</b> they own</span>
          <span class="ccs-stat ccs-shared"><b>${sharedSealed}</b> we both have</span>
          <span class="ccs-stat ccs-missing"><b>${missingSealed}</b> missing for you</span>
        </div>`}
      </div>`;
    })()}
    <div class="collection-section-tabs">
      ${(!isViewerMode || viewerVis.raw) && html`<button class=${"collection-section-tab"+(effectiveSection==="cards"?" active":"")}
        onClick=${()=>setSection("cards")}>Cards</button>`}
      ${(!isViewerMode || viewerVis.sealed) && html`<button class=${"collection-section-tab"+(effectiveSection==="sealed"?" active":"")}
        onClick=${()=>setSection("sealed")}>Sealed</button>`}
      ${(!isViewerMode || viewerVis.graded) && html`<button class=${"collection-section-tab"+(effectiveSection==="graded"?" active":"")}
        onClick=${()=>setSection("graded")}>Graded</button>`}
      ${!isViewerMode && user && ownerProfile && html`<div class="collection-share-wrap" ref=${shareRef}>
        <button class=${"collection-share-btn"+(shareOpen?" open":"")}
          onClick=${()=>setShareOpen(o=>!o)}
          title="Choose who can see each section of your collection">
          Share ▾
        </button>
        ${shareOpen && html`<div class="collection-share-popover">
          <div class="settings-section-title" style=${{marginTop:0}}>Collection sharing</div>
          <${CollectionSharingPanel}
            profile=${ownerProfile}
            onChange=${saveCollectionVisibility}
            onRegenerate=${regenerateCollectionShareToken}/>
        </div>`}
      </div>`}
    </div>
    ${effectiveSection === "sealed"
      ? html`<${SealedCollectionView} raw=${raw} user=${user}
          sealedPrices=${sealedPrices} sealedCollection=${sealedCollection}
          updateSealedQty=${updateSealedQty} onSignIn=${onSignIn}
          readOnly=${isViewerMode}
          compareMode=${canCompare ? compareMode : "all"}
          viewerOwnSealedCollection=${viewerOwnSealedCollection || null}/>`
      : effectiveSection === "graded"
      ? html`<${GradedCollectionView} raw=${raw} user=${user} onSignIn=${onSignIn} theme=${theme}
          readOnly=${isViewerMode}
          viewedGradedRows=${isViewerMode ? viewerContext.data?.gradedRows || [] : null}/>`
      : effectiveSection === null
      ? html`<div class="empty-state"><p>No sections of this collection are visible to you.</p></div>`
      : html`<div>
    <div class="collection-controls">
      <div class="seg-toggle">
        <button class=${copies===1?"active":""} onClick=${()=>setCopies(1)}>Master Set</button>
        <button class=${copies===4?"active":""} onClick=${()=>setCopies(4)}>Play Set</button>
      </div>
      <label class="copies-select">
        <span>Copies:</span>
        <select value=${copies} onChange=${e=>setCopies(parseInt(e.target.value,10))}>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </label>
      ${!isViewerMode && html`<button class="import-csv-btn" onClick=${()=>importFileRef.current && importFileRef.current.click()}
        title="Import a collection CSV">Import CSV</button>`}
      ${!isViewerMode && html`<input ref=${importFileRef} type="file" accept=".csv,text/csv" style=${{display:"none"}}
        onChange=${e=>{ const f=e.target.files && e.target.files[0]; e.target.value=""; handleImportFile(f); }}/>`}
    </div>
