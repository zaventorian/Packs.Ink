};

// Wrapped in React.memo below so unchanged tiles skip re-render when
// filter state changes. Stable group references (see CardBrowser) make
// this effective — without them the prop diff would always miss.
const CardTileImpl = ({group, onSelectGroup, collection, deckQty, onDeckQtyChange, viewMode}) => {
  const img = group.img_normal || group.img_small || group.img_large;
  const productName = group["Product Name"];
  const showLabels = group.normal && group.foil;
  const nKey = group.normal ? group.card_id+":"+group.normal.tcg_printing : null;
  const fKey = group.foil   ? group.card_id+":"+group.foil.tcg_printing   : null;
  const nQty = (collection && nKey) ? (collection[nKey]||0) : 0;
  const fQty = (collection && fKey) ? (collection[fKey]||0) : 0;
  const ownedAny = nQty > 0 || fQty > 0;
  const deckMode = typeof onDeckQtyChange === "function";
  // In deck mode, tapping the tile body adds a copy (like the + button).
  // The dedicated expand button (bottom-left) opens the detail modal. Outside
  // deck mode, tile click opens the modal as before.
  const openModal = onSelectGroup ? () => onSelectGroup(group) : null;
  // Per-card max for the +/- UI. Most cards = 4, exceptions (Dalmatian Puppy
  // - Tail Wagger = 99, Microbots = unlimited capped at 99 for sanity) come
  // from SPECIAL_DECK_LIMITS. Variant-sharing for Dalmatian Puppy is enforced
  // at the deck level in checkDeckLegality, not here.
  const cardMax = getDeckLimitForUI(group["Product Name"]);
  const addOne = () => {
    const next = Math.min(cardMax, (deckQty || 0) + 1);
    if(next !== (deckQty || 0)) onDeckQtyChange(group, next);
  };
  const onClick = deckMode ? addOne : openModal;
  const onExpand = (e) => { e.stopPropagation(); if(openModal) openModal(); };
  const bump = (delta) => (e) => {
    e.stopPropagation();
    const next = Math.max(0, Math.min(cardMax, (deckQty || 0) + delta));
    if(next !== (deckQty || 0)) onDeckQtyChange(group, next);
  };

  // Compact list-view row — image thumbnail, name, set/cn, prices, optional
  // deck counter. Used when the browser's viewMode is "list".
  if(viewMode === "list"){
    const nLow = group.normal && group.normal["Low Price"];
    const fLow = group.foil   && group.foil["Low Price"];
    return html`<div class="card-row" onClick=${onClick}>
      ${img
        ? html`<img class="card-row-img" src=${img} alt=${productName} loading="lazy"/>`
        : html`<div class="card-row-img card-row-img-placeholder"></div>`}
      <div class="card-row-main">
        <div class="card-row-name" title=${productName}>${productName}</div>
        <div class="card-row-meta">
          ${group.Rarity ? html`<span>${group.Rarity}</span>` : null}
          ${group.Set ? html`<span class="card-row-set">${group.Set}${group.Number?` #${group.Number}`:""}</span>` : null}

// React.memo with default shallow compare. Filter changes re-create the
// `grouped` array but the individual `group` object references are now
// stable (see CardBrowser's two-stage memoization), so unchanged tiles
// short-circuit here instead of re-rendering all 1500.
const CardTile = React.memo(CardTileImpl);

// Group rows by card_id: one tile per unique card with both printings inline.
// For chase rarities (Enchanted/Iconic/Epic) there is only one printing —
// the foil — and we don't bother labeling it.
const groupCards = (rows) => {
  const CHASE = new Set(["Enchanted","Iconic","Epic"]);
  const byCard = new Map();
  for(const r of rows){
    const key = r.card_id || (r["Product Name"]+"::"+r.Set+"::"+r.Number);
    let g = byCard.get(key);
    if(!g){
      g = {...r, normal:null, foil:null, isChase:CHASE.has(r.Rarity)};
      byCard.set(key, g);
    }
    if(r.Printing === "Normal") g.normal = r;
    else g.foil = r;
  }
  return Array.from(byCard.values());
};

// Sort options. Default: newest set first, then collector number ascending.
const SORT_OPTIONS = [
  {key:"set-new",   label:"Set: newest first"},
  {key:"set-old",   label:"Set: oldest first"},
  {key:"name",      label:"Name (A→Z)"},
  {key:"cost-asc",  label:"Cost (low→high)"},
  {key:"cost-desc", label:"Cost (high→low)"},
  {key:"price-asc", label:"Price (low→high)"},
  {key:"price-desc",label:"Price (high→low)"},
];

// Unknown sets sort to the very end in both newest-first and oldest-first modes.
const UNKNOWN_SET_RANK = 9999;
const setRank = (g) => {
  const idx = SET_ORDER.indexOf(g.Set);
  return idx === -1 ? UNKNOWN_SET_RANK : idx;
};
const collectorNum = (g) => {
  const n = parseInt((g.Number||"").split("/")[0], 10);
  return Number.isFinite(n) ? n : 99999;
};
// Return the numeric price to use for sorting a card group. Prefers Normal
// Low; falls back to Foil Low when Normal is absent (i.e., chase rarities).
// Returns null if neither printing has a real number. (Strict typeof check
// avoids the case where ?? would treat 0 as falsy or where a stale cache has
// the field as a string.)
const getCardPrice = (g) => {
  const nLow = g && g.normal ? g.normal["Low Price"] : null;
  if(typeof nLow === "number" && !Number.isNaN(nLow)) return nLow;
  const fLow = g && g.foil   ? g.foil["Low Price"]   : null;
  if(typeof fLow === "number" && !Number.isNaN(fLow)) return fLow;
  return null;
};

const priceCompare = (a, b, desc) => {
  const pa = getCardPrice(a);
  const pb = getCardPrice(b);
  if(pa === null && pb === null) return 0;
  if(pa === null) return 1;   // unpriced cards always at the bottom
  if(pb === null) return -1;
  return desc ? pb - pa : pa - pb;
};

const SORT_COMPARATORS = {
  "set-new":   (a,b) => {
    const ar = setRank(a), br = setRank(b);
    // Unknown sets (rank=9999) go last in both directions
    if(ar === UNKNOWN_SET_RANK && br !== UNKNOWN_SET_RANK) return 1;
    if(br === UNKNOWN_SET_RANK && ar !== UNKNOWN_SET_RANK) return -1;
    // Higher rank = newer = first
    return (br - ar) || (collectorNum(a) - collectorNum(b));
  },
  "set-old":   (a,b) => {
    const ar = setRank(a), br = setRank(b);
    if(ar === UNKNOWN_SET_RANK && br !== UNKNOWN_SET_RANK) return 1;
    if(br === UNKNOWN_SET_RANK && ar !== UNKNOWN_SET_RANK) return -1;
    return (ar - br) || (collectorNum(a) - collectorNum(b));
  },
  "name":      (a,b) => (a["Product Name"]||"").localeCompare(b["Product Name"]||""),
  "cost-asc":  (a,b) => ((a.cost ?? 999) - (b.cost ?? 999)) || (collectorNum(a) - collectorNum(b)),
  "cost-desc": (a,b) => ((b.cost ?? -1)  - (a.cost ?? -1))  || (collectorNum(a) - collectorNum(b)),
  "price-asc": (a,b) => priceCompare(a, b, false),
  "price-desc":(a,b) => priceCompare(a, b, true),
};

// Shared card-browser UI used by the Cards tab + the deck builder. Owns
// the filter / sort / search / drawer state and the responsive grid.
//   - onSelectGroup(g): called when a tile's image is clicked (opens modal)
//   - deckQty(g) / onDeckQtyChange(g, n): optional, enables the +/- counter
//     overlay used by the deck builder.
// Stable references on these callbacks let React.memo on CardTile skip
// unchanged tiles when filters change.
const CardBrowser = ({raw, onSelectGroup, collection, deckQty, onDeckQtyChange, sortDefault="set-new"}) => {
  const [filter,setFilter] = useState(emptyFilter);
  const [drawerOpen,setDrawerOpen] = useState(false);
  const [sortKey,setSortKey] = useState(sortDefault);
  // Grid (image tiles) vs List (compact rows). Persisted per session in
  // localStorage so toggling once sticks across page navigation.
  const [viewMode, setViewMode] = useState(() => {
    try { return localStorage.getItem("packsink:cardBrowser:view") || "grid"; }
    catch { return "grid"; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:cardBrowser:view", viewMode); } catch {}
  }, [viewMode]);
  // Defer the heavy filter+sort pipeline so chip/input clicks remain
  // responsive even when the resulting render touches 1500 tiles. The
  // toolbar reads the live `filter` (chip active class flips instantly),
  // while `grouped` reads the deferred copy — React.18 can interrupt the
  // big render to process subsequent input events.
  const deferredFilter = React.useDeferredValue(filter);
  const parsed = useMemo(()=>parseSearchQuery(deferredFilter.search||""), [deferredFilter.search]);
  // Pre-group ALL cards once per `raw`. Every filter dimension (ink, cost,
  // rarity, set, inkable, name, etc.) applies uniformly to a card's
  // printings, so we can filter the *groups* downstream and keep their
  // object references stable across filter changes — letting React.memo on
  // CardTile actually short-circuit unchanged tiles.
  const allGroups = useMemo(() => groupCards(raw), [raw]);
  const grouped = useMemo(()=>{
    const groups = allGroups.filter(g => matchesCardFilter(g, deferredFilter, parsed));
    const cmp = SORT_COMPARATORS[sortKey] || SORT_COMPARATORS["set-new"];
    return groups.slice().sort(cmp);
  },[allGroups, deferredFilter, parsed, sortKey]);
  const isFiltering = filter !== deferredFilter;
  const parsedSummary = useMemo(()=>summarizeParsedQuery(parsed), [parsed]);
  const setsByGroup = useMemo(()=>groupSetsForFilter(raw),[raw]);
  const activeCount = countActiveFilters(filter);
  return html`<div>
    <div class="cards-toolbar">
      <div class="search"><input type="search"
        placeholder="Smart search: 'amber legendary', 'tfc enchanted', 'stitch 7', 'red rush', 'non promo'..."
        value=${filter.search}
        onInput=${e=>setFilter(f=>({...f,search:e.target.value}))}/></div>

        ${INKS.map(ink => html`<button key=${ink} class=${"chip ink ink-icon-chip "+(filter.inks.has(ink)?"active":"")}

// ── Views ──────────────────────────────────────────────────────────────
// EV time windows mirror the home-page movers banners so users see the same
// vocabulary for "how has this changed" everywhere on the site. Labels match
// MOVER_WINDOWS exactly (1D / 1W / 1M / 3M / 6M / 1Y).
const EV_WINDOWS = [
  ["1D",  1,   "1 day"],
  ["1W",  7,   "1 week"],
  ["1M",  30,  "1 month"],
  ["3M",  90,  "3 months"],
  ["6M",  180, "6 months"],
  ["1Y",  365, "1 year"],
];
function EVView({raw, sets, avgs, nc, setNc, ne, setNe, priceMode, openSetHistory, sealedPrices}){
  const useMarket = priceMode === "market";
  // Per-set Booster Box lookup. A set typically has the box itself plus a
  // "Booster Box Case" SKU (12-box case). We want the single-box price, so
  // exclude anything with "case" in the name. If multiple boxes remain (rare),
  // pick the cheapest as the canonical "what the consumer actually pays".
  const boxBySetId = useMemo(() => {
    const out = {};
    if(!sealedPrices) return out;
    for(const row of sealedPrices){
      if(!row.set_id) continue;
      if(row.product_type !== "Booster Box") continue;
      const nm = (row.name || "").toLowerCase();
      if(nm.includes("case")) continue;
      const price = useMarket ? row.market_price : row.low_price;
      if(price == null) continue;
      const prev = out[row.set_id];
      if(!prev || prev.price > price){
        out[row.set_id] = {
          price: parseFloat(price),
          name: row.name,
          url: tcgUrl(row.tcgplayer_product_id),
          productId: row.tcgplayer_product_id,
        };
      }
    }
    return out;
  }, [sealedPrices, useMarket]);
  // Map set name -> set_id once, so we can index historical rows (which key
  // by set_id) back to the set name we render in the row label.
  const setIdByName = useMemo(()=>{
    const m = {};
    for(const r of raw){
      if(r.Set && r.set_id && !m[r.Set]) m[r.Set] = r.set_id;
    }
    return m;
  }, [raw]);

  // Historical fetch: find the latest date in rarity_avg_daily, then pull
  // rows for exactly the dates we need (today, -1d, -7d, ..., -365d). One
  // round-trip after the latest-date probe; ~1100 rows total.
  const [hist, setHist] = useState({status:"loading", byDateSet:null, latest:null});
  useEffect(()=>{
    let cancelled = false;
    (async () => {
      try {
        const probe = await sbClient.from("rarity_avg_daily")
          .select("date").order("date", {ascending:false}).limit(1);
        if(cancelled) return;
        if(probe.error) throw probe.error;
        const latestRows = probe.data || [];
        if(!latestRows.length){ setHist({status:"empty"}); return; }
        const latest = latestRows[0].date;
        const base = new Date(latest + "T00:00:00Z");
        const fmtDate = d => d.toISOString().slice(0,10);
        const targets = EV_WINDOWS.map(([,o])=>{
          const d = new Date(base); d.setUTCDate(d.getUTCDate() - o); return fmtDate(d);
        });
        const dateList = [latest, ...targets];
        const rows = await sbFetchAll("rarity_avg_daily", {
          select: "set_id,date,rarity,printing,avg_low,avg_low_nc,avg_market,avg_market_nc",
          date: "in.(" + dateList.join(",") + ")",
          order: "set_id.asc,date.asc",
        });
        if(cancelled) return;
        const byDateSet = {};
        for(const r of rows){
          if(!byDateSet[r.date]) byDateSet[r.date] = {};
          if(!byDateSet[r.date][r.set_id]) byDateSet[r.date][r.set_id] = {};
          const key = getRarKey(r.rarity, r.printing);
          if(!key) continue;
          byDateSet[r.date][r.set_id][key] = {
            low:   r.avg_low       != null ? parseFloat(r.avg_low)       : null,
            lowNC: r.avg_low_nc    != null ? parseFloat(r.avg_low_nc)    : null,
            mkt:   r.avg_market    != null ? parseFloat(r.avg_market)    : null,
            mktNC: r.avg_market_nc != null ? parseFloat(r.avg_market_nc) : null,
          };
        }
        setHist({status:"ready", byDateSet, latest, targets});
      } catch(e){
        if(!cancelled) setHist({status:"error", error: String(e?.message||e).slice(0,200)});
      }
    })();
    return ()=>{ cancelled = true; };
  }, []);

  // Compute EV for a given set+date from a fetched rarity-avg bucket. Returns
  // null if the date snapshot doesn't have enough data (set unreleased or ETL
  // gap). `useNc` switches the avg-market-NC column on per the toggle.
  const evFromBucket = (setName, bucket) => {
    if(!bucket) return null;
    const pull = getPull(setName);
    let ev = 0, anyHit = false;
    for(const r of RARS){
      if(ne && NO_ENCH.has(r)) continue;
      const rate = pull[r], cell = bucket[r];
      if(!cell) continue;
      const v = useMarket
        ? (nc ? cell.mktNC : cell.mkt)
        : (nc ? cell.lowNC : cell.low);
      if(v == null) continue;
      ev += v * rate;
      anyHit = true;
    }
    return anyHit ? ev : null;
  };

  // Build the per-set rows: current EV (from in-memory avgs) plus % change for
  // each window (computed off historical buckets). Memoized so toggling nc/ne
  // doesn't refetch — only re-derives.
  const rows = useMemo(() => {
    return sets.map(setName => {
      const ev = calcEV(avgs, setName, nc, ne, priceMode);
      const sid = setIdByName[setName];
      const deltas = {};
      if(hist.status === "ready" && sid){
        const latestBucket = (hist.byDateSet[hist.latest] || {})[sid];
        const latestEv = evFromBucket(setName, latestBucket);
        EV_WINDOWS.forEach(([key,,], i) => {
          const targetDate = hist.targets[i];
          const pastBucket = (hist.byDateSet[targetDate] || {})[sid];
          const pastEv = evFromBucket(setName, pastBucket);
          if(latestEv != null && pastEv != null && pastEv > 0){
            deltas[key] = (latestEv - pastEv) / pastEv * 100;
          } else {
            deltas[key] = null;
          }
        });
      } else {
        EV_WINDOWS.forEach(([key])=>{ deltas[key] = null; });
      }
      const box = sid ? boxBySetId[sid] : null;
      const diffVsBox = (box && ev) ? (ev - box.price) : null;
      return {setName, ev, deltas, box, diffVsBox};
    });
  }, [sets, avgs, nc, ne, hist, setIdByName, priceMode, boxBySetId]);
  const anyBoxData = rows.some(r => r.box);

  return html`<div class="ev-view">
    <div class="ev-header">
      <div class="ev-header-title">
        <div class="ev-header-eyebrow">Market analytics</div>
        <h2 class="ev-header-h2">Expected Value</h2>
        <div class="ev-header-sub">Estimated booster-box and pack value at current TCGPlayer ${useMarket?"Market":"Low"} prices.</div>
      </div>
      <div class="ev-toggles">
        <${Tip} text="Treats any card worth less than $1.00 as $0. Gives a more realistic 'sellable' EV by ignoring bulk penny cards.">
          <label class=${"ev-toggle"+(nc?" on":"")}>
            <input type="checkbox" checked=${nc} onChange=${e=>setNc(e.target.checked)}/>
            <div class="ev-toggle-text">
              <div class="ev-toggle-title">Remove Bulk</div>
              <div class="ev-toggle-sub">${"<$1 → $0"}</div>
            </div>
          </label>
        <//>
        <${Tip} text="Removes Enchanted and Iconic cards from the EV calculation. Shows your expected return without relying on ultra-rare jackpot pulls.">
          <label class=${"ev-toggle"+(ne?" on":"")}>
            <input type="checkbox" checked=${ne} onChange=${e=>setNe(e.target.checked)}/>
            <div class="ev-toggle-text">
              <div class="ev-toggle-title">Exclude Enchanted/Iconic</div>
              <div class="ev-toggle-sub">Skip chase rarities</div>
            </div>
          </label>
        <//>
      </div>
    </div>

    <div class=${"ev-rows"+(anyBoxData?" with-box":"")}>
      <div class="ev-row ev-row-head">
        <div class="ev-row-set">Set</div>
        <div class="ev-row-vals">
          <div class="ev-row-val"><span class="ev-row-val-lbl">per box</span></div>
          <div class="ev-row-val"><span class="ev-row-val-lbl">per pack</span></div>
        </div>
        ${anyBoxData && html`<div class="ev-row-box">
          <div class="ev-row-val"><span class="ev-row-val-lbl">box price</span></div>
          <div class="ev-row-val"><span class="ev-row-val-lbl">EV − box</span></div>
        </div>`}
        <div class="ev-row-deltas-wrap">
          <div class="ev-row-deltas-title">EV change</div>
          <div class="ev-row-deltas">
            ${EV_WINDOWS.map(([k,,label])=>html`<div key=${k} class="ev-delta-cell ev-delta-head">${k}</div>`)}
          </div>
        </div>
      </div>
      ${rows.map(({setName, ev, deltas, box, diffVsBox}) => html`<div key=${setName}
        class=${"ev-row"+(openSetHistory?" ev-row-clickable":"")}
        onClick=${openSetHistory ? ()=>openSetHistory(setName) : null}
        role=${openSetHistory ? "button" : null}
        tabIndex=${openSetHistory ? 0 : null}
        onKeyDown=${openSetHistory ? (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openSetHistory(setName);} } : null}
        title=${openSetHistory ? "Open price history for "+setName : null}>
        <div class="ev-row-set">${setName} <span class="ev-row-set-hint">↗</span></div>
        <div class="ev-row-vals">
          <div class="ev-row-val">${fmt(ev)}</div>
          <div class="ev-row-val ev-row-val-dim">${fmt(ev/24)}</div>
        </div>
        ${anyBoxData && html`<div class="ev-row-box">
          ${box
            ? html`<div class="ev-row-val">
                ${box.url
                  ? html`<a href=${box.url} target="_blank" rel="noopener nofollow"
                      onClick=${e=>e.stopPropagation()}
                      class="ev-box-link" title=${box.name}>${fmt(box.price)}<span class="ev-box-link-ext">↗</span></a>`
                  : fmt(box.price)}
              </div>
              ${(() => {
                const cls = diffVsBox > 0 ? "up" : (diffVsBox < 0 ? "down" : "flat");
                const sign = diffVsBox > 0 ? "+" : "";
                return html`<div class=${"ev-box-diff ev-box-diff-"+cls}
                  title=${diffVsBox>0?"Cracking is +EV at current box price":"Box price exceeds EV — buy singles"}>
                  ${sign}${fmt(diffVsBox)}
                </div>`;
              })()}`
            : html`<div class="ev-row-val ev-row-val-dim">—</div>
              <div class="ev-box-diff ev-box-diff-none">—</div>`}
        </div>`}
        <div class="ev-row-deltas">
          ${EV_WINDOWS.map(([k,,label])=>{
            const pct = deltas[k];
            if(pct == null) return html`<div key=${k} class="ev-delta-cell ev-delta-none" title=${"No data for "+label}>—</div>`;
            const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
            const arrow = pct > 0 ? "▲" : (pct < 0 ? "▼" : "·");
            return html`<div key=${k} class=${"ev-delta-cell ev-delta-"+cls} title=${label}>
              <span class="ev-delta-arrow">${arrow}</span>${Math.abs(pct).toFixed(1)}%
            </div>`;
          })}
        </div>
      </div>`)}
    </div>

    <p class="muted" style=${{fontSize:11,marginTop:12}}>
      ${hist.status === "loading" && "Loading history…"}
      ${hist.status === "error" && ("History unavailable: " + hist.error)}
      ${hist.status === "empty" && "No historical data yet — run the ETL once to populate rarity_avg_daily."}
      ${hist.status === "ready" && `Prices via Lorcast (TCGPlayer ${useMarket?"Market":"Low"}). Change windows compare ${hist.latest} against earlier snapshots.`}
    </p>
  </div>`;
}

// Sealed — table of every booster box / pack / starter deck / trove etc.
// with current price + change-over-time pills. Grouped by *display type*
// (Booster Boxes, Sleeved Packs, Cases, etc.) so users can compare same-kind
// SKUs across sets. The display-type classifier is a frontend refinement of
// the loader's product_type — splits Packs by sub-variant and pulls every
// "Case"/"Display" SKU into one section regardless of parent type.
const SEALED_DISPLAY_TYPE_ORDER = [
  "Booster Boxes",
  "Booster Packs",
  "Sleeved Booster Packs",
  "Booster Pack Art Bundles",
  "Illumineer's Troves",
  "Prerelease Packs",
  "Starter Decks",
  "Gift Sets",
  "Bundles",
  "Quests",
  "Sealed",
  "Collector's Edition",
  "Cases & Displays",
];
const SEALED_DISPLAY_TYPE_FOR = {
  "Booster Box":         "Booster Boxes",
  "Trove":               "Illumineer's Troves",
  "Starter Deck":        "Starter Decks",
  "Gift Set":            "Gift Sets",
  "Quest":               "Quests",
  "Bundle":              "Bundles",
  "Prerelease Pack":     "Prerelease Packs",
  "Sealed":              "Sealed",
  "Collector's Edition": "Collector's Edition",
};
function deriveSealedDisplayType(item){
  const name = (item.name || "").toLowerCase();
  // Cases & Displays — multi-unit retail containers regardless of parent
  // type. " case" with leading space avoids mid-word false positives;
  // "display" matches "Starter Deck Display" and similar.
  if(name.includes(" case") || / display( |$)/.test(name)) return "Cases & Displays";
  // Pack sub-variants: split the loader's single "Booster Pack" bucket into
  // basic / sleeved / art bundle so they show up as distinct sections.
  if(item.product_type === "Booster Pack"){
    if(name.includes("art bundle")) return "Booster Pack Art Bundles";
    if(name.includes("sleeved"))    return "Sleeved Booster Packs";
    return "Booster Packs";
  }
  // Special-edition "Collection Starter Set" and "Starter Blister Bundle"
  // SKUs aren't competitive starter decks — they're sealed multi-pack
  // collectibles. Surface them under Bundles instead.
  if(item.product_type === "Starter Deck"){
    if(name.includes("collection starter") || name.includes("starter blister")){
      return "Bundles";
    }
  }
  return SEALED_DISPLAY_TYPE_FOR[item.product_type] || item.product_type || "Other Sealed";
}
const sealedDisplayTypeRank = (t) => {
  const i = SEALED_DISPLAY_TYPE_ORDER.indexOf(t);
  return i === -1 ? 999 : i;
};
// Strip the "Disney Lorcana: " prefix that TCGCSV prepends to every product —
// the set pill already says where this is from; the prefix is just noise.
const cleanSealedName = (name) => (name || "").replace(/^Disney Lorcana:\s*/i, "");

function SealedView({raw, sealedPrices, sets, priceMode, openSetHistory}){
  const useMarket = priceMode === "market";
  const priceField = useMarket ? "market_price" : "low_price";

  // set_id -> set name (only mainline sets that are in `raw` get an entry;
  // Quests / promo groups will fall through to the "Other Sealed" bucket).
  const setNameById = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.Set && r.set_id && !m[r.set_id]) m[r.set_id] = r.Set;
    return m;
  }, [raw]);
  const setIdByName = useMemo(()=>{
    const m = {};
    for(const [sid, name] of Object.entries(setNameById)) m[name] = sid;
    return m;
  }, [setNameById]);

  // Newest-first set ordering keyed by set_id, used to sort rows within a
  // display-type section (Booster Boxes ordered newest set → oldest set).
  const setOrderIndex = useMemo(()=>{
    const m = {};
    sets.forEach((name, i) => {
      const sid = setIdByName[name];
      if(sid) m[sid] = i;
    });
    return m;
  }, [sets, setIdByName]);

  // Group sealed products by *display type*. Sub-sort within each section
  // by set order (newest first) then product name. Promo Singles are
  // excluded — they're individual cards, not sealed product.
  const grouped = useMemo(()=>{
    const items = (sealedPrices || []).filter(p =>
      p.printing === "Normal" && p.product_type !== "Promo Single"
    );
    const byType = new Map();
    for(const item of items){
      const t = deriveSealedDisplayType(item);
      if(!byType.has(t)) byType.set(t, []);
      byType.get(t).push(item);
    }
    const out = [];
    for(const [type, list] of byType){
      list.sort((a, b) => {
        const ai = a.set_id != null ? (setOrderIndex[a.set_id] ?? 999) : 1000;
        const bi = b.set_id != null ? (setOrderIndex[b.set_id] ?? 999) : 1000;
        if(ai !== bi) return ai - bi;
        return (a.name||"").localeCompare(b.name||"");
      });
      out.push({type, items: list});
    }
    out.sort((a, b) => sealedDisplayTypeRank(a.type) - sealedDisplayTypeRank(b.type));
    return out;
  }, [sealedPrices, setOrderIndex]);

  // Historical price fetch — exactly the same shape as EVView's, but keyed
  // per product_id instead of per (set_id, rarity_key). One probe call to
  // find the latest snapshot date, then a chunked fetch for the seven
  // target dates we care about.
  const [hist, setHist] = useState({status:"loading"});
  useEffect(()=>{
    if(!sealedPrices || !sealedPrices.length){ setHist({status:"empty"}); return; }
    let cancelled = false;
    (async () => {
      try {
        const probe = await sbClient.from("prices_daily")
          .select("date")
          .eq("source", "tcgcsv").eq("grade", "raw")
          .order("date", {ascending:false}).limit(1);
        if(cancelled) return;
        if(probe.error) throw probe.error;
        const probeRows = probe.data || [];
        if(!probeRows.length){ setHist({status:"empty"}); return; }
        const latest = probeRows[0].date;
        const base = new Date(latest + "T00:00:00Z");
        const fmtDate = d => d.toISOString().slice(0,10);
        const targets = EV_WINDOWS.map(([,o])=>{
          const d = new Date(base); d.setUTCDate(d.getUTCDate() - o); return fmtDate(d);
        });
        const dateList = [latest, ...targets];
        // PostgREST URL caps out around ~8KB. ~80 product IDs × ~7 chars each
        // ≈ 560 chars per chunk — leaves plenty of headroom for the other
        // params even with 6 date values.
        const productIds = [...new Set(sealedPrices.map(p=>p.tcgplayer_product_id).filter(Boolean))];
        const CHUNK = 80;
        const allRows = [];
        for(let i = 0; i < productIds.length; i += CHUNK){
          const chunk = productIds.slice(i, i+CHUNK);
          const rows = await sbFetchAll("prices_daily", {
            select: "tcgplayer_product_id,date,low_price,market_price",
            source: "eq.tcgcsv",
            grade:  "eq.raw",
            printing: "eq.Normal",
            tcgplayer_product_id: "in.(" + chunk.join(",") + ")",
            date: "in.(" + dateList.join(",") + ")",
          });
          if(cancelled) return;
          allRows.push(...rows);
        }
        const byProductDate = {};
        for(const r of allRows){
          const pid = r.tcgplayer_product_id;
          if(!byProductDate[pid]) byProductDate[pid] = {};
          byProductDate[pid][r.date] = {
            low: r.low_price != null ? parseFloat(r.low_price) : null,
            mkt: r.market_price != null ? parseFloat(r.market_price) : null,
          };
        }
        setHist({status:"ready", byProductDate, latest, targets});
      } catch(e){
        if(!cancelled) setHist({status:"error", error: String(e?.message||e).slice(0,200)});
      }
    })();
    return ()=>{ cancelled = true; };
  }, [sealedPrices]);

  const deltasFor = (productId) => {
    const out = {};
    EV_WINDOWS.forEach(([k])=>{ out[k] = null; });
    if(hist.status !== "ready") return out;
    const byDate = hist.byProductDate[productId];
    if(!byDate) return out;
    const latestRow = byDate[hist.latest];
    if(!latestRow) return out;
    const cur = useMarket ? latestRow.mkt : latestRow.low;
    if(cur == null) return out;
    EV_WINDOWS.forEach(([k,,], i)=>{
      const pastRow = byDate[hist.targets[i]];
      if(!pastRow) return;
      const past = useMarket ? pastRow.mkt : pastRow.low;
      if(past == null || past <= 0) return;
      out[k] = (cur - past) / past * 100;
    });
    return out;
  };

  return html`<div class="sealed-view">
    <div class="sealed-header">
      <div class="ev-header-eyebrow">Market analytics</div>
      <h2 class="ev-header-h2">Sealed Product</h2>
      <div class="ev-header-sub">
        Current TCGPlayer ${useMarket?"Market":"Low"} prices for every booster box, pack, starter deck, trove and related sealed SKU.
      </div>
    </div>

    ${grouped.length === 0 && html`<div class="muted" style=${{fontSize:13,padding:"20px 0"}}>
      No sealed-product price data yet. Run supabase/16_sealed_prices_latest.sql, then refresh_sealed_prices_latest(), then reload.
    </div>`}

    ${grouped.map(({type, items}) => html`<div class="sealed-set" key=${type}>
      <div class="sealed-set-header">
        <span class="sealed-set-title">${type}</span>
        <span class="sealed-set-count">${items.length}</span>
      </div>
      <div class="sealed-rows">
        <div class="sealed-row sealed-row-head">
          <div class="sealed-row-set">Set</div>
          <div class="sealed-row-name">Product</div>
          <div class="sealed-row-price">${useMarket?"Market":"Low"}</div>
          <div class="ev-row-deltas-wrap">
            <div class="ev-row-deltas-title">Price change</div>
            <div class="ev-row-deltas">
              ${EV_WINDOWS.map(([k])=>html`<div key=${k} class="ev-delta-cell ev-delta-head">${k}</div>`)}
            </div>
          </div>
        </div>
        ${items.map(item => {
          const setName = item.set_id ? setNameById[item.set_id] : null;
          const url = tcgUrl(item.tcgplayer_product_id);
          const price = item[priceField];
          const deltas = deltasFor(item.tcgplayer_product_id);
          return html`<div class="sealed-row" key=${item.tcgplayer_product_id}>
            <div class="sealed-row-set">
              ${setName && openSetHistory
                ? html`<button class="sealed-set-pill" onClick=${()=>openSetHistory(setName)}
                    title=${"Open price history for "+setName}>${setName}</button>`
                : html`<span class="sealed-set-pill sealed-set-pill-muted">${setName || "—"}</span>`}
            </div>
            <div class="sealed-row-name">
              ${url
                ? html`<a href=${url} target="_blank" rel="noopener nofollow"
                    title=${item.name}>${cleanSealedName(item.name)}<span class="sealed-name-ext">↗</span></a>`
                : cleanSealedName(item.name)}
            </div>
            <div class="sealed-row-price">${fmt(price)}</div>
            <div class="sealed-row-deltas">
              ${EV_WINDOWS.map(([k,,label])=>{
                const pct = deltas[k];
                if(pct == null) return html`<div key=${k} class="ev-delta-cell ev-delta-none" title=${"No data for "+label}>—</div>`;
                const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
                const arrow = pct > 0 ? "▲" : (pct < 0 ? "▼" : "·");
                return html`<div key=${k} class=${"ev-delta-cell ev-delta-"+cls} title=${label}>
                  <span class="ev-delta-arrow">${arrow}</span>${Math.abs(pct).toFixed(1)}%
                </div>`;
              })}
            </div>
          </div>`;
        })}
      </div>
    </div>`)}

    <p class="muted" style=${{fontSize:11,marginTop:12}}>
      ${hist.status === "loading" && "Loading price history…"}
      ${hist.status === "error"   && ("History unavailable: " + hist.error)}
      ${hist.status === "empty"   && "No historical price data yet."}
      ${hist.status === "ready"   && `Prices via TCGPlayer (${useMarket?"Market":"Low"}). Change windows compare ${hist.latest} against earlier snapshots.`}
    </p>
  </div>`;
}

// Card Averages — average price per rarity, per set, with optional set
// filtering. Absorbs the old Compare Sets view: pick exactly two sets and a
// Diff column appears so you get the same A−B comparison without a separate
// page. Bottom row summarizes box EV for whatever sets are visible.
function AvgView({sets, avgs, nc, priceMode, openSetHistory}){
  const useMarket = priceMode === "market";
  // Default = all sets selected. When `sets` changes (new release) keep
  // whatever overlap exists; if the user had filtered down and the overlap
  // would be empty, fall back to all-selected.
  const [selected, setSelected] = useState(()=>new Set(sets));
  useEffect(()=>{
    setSelected(prev => {
      const next = new Set([...prev].filter(s => sets.includes(s)));
      return next.size > 0 ? next : new Set(sets);
    });
  }, [sets]);
  const visibleSets = sets.filter(s => selected.has(s));
  const showDiff = visibleSets.length === 2;
  // Smart toggle: when every set is selected (the default), the user almost
  // certainly wants to narrow down to a comparison — so the first click
  // becomes "show only this one" instead of forcing the user to deselect
  // everything else. Subsequent clicks add/remove from the subset. Emptying
  // the subset reverts to "all" rather than showing a blank table.
  const toggleSet = (s) => setSelected(prev => {
    if(prev.size === sets.length) return new Set([s]);
    const next = new Set(prev);
    if(next.has(s)) next.delete(s); else next.add(s);
    return next.size === 0 ? new Set(sets) : next;
  });
  const pickAvg = (d) => d ? (useMarket ? (nc?d.avgMktNC:d.avgMkt) : (nc?d.avgNC:d.avg)) : null;
  const onlyOne = visibleSets.length === 1 ? visibleSets[0] : null;
  return html`<div>
    <div class="card-avg-chips">
      <span class="card-avg-chips-lbl">Sets:</span>
      ${sets.map(s => html`<button key=${s}
        class=${"card-avg-chip"+(selected.has(s)?" active":"")}
        onClick=${()=>toggleSet(s)}>${s}</button>`)}
      ${visibleSets.length < sets.length && html`<button class="card-avg-chip-reset"
        onClick=${()=>setSelected(new Set(sets))} title="Show all sets">✕ Reset</button>`}
      ${showDiff && html`<span class="card-avg-mode-hint">Comparing two sets — Diff column shown.</span>`}
    </div>

    <div class="scr">
      <table>
        <thead>
          <tr>
            <th style=${{minWidth:100}}>Rarity</th>
            <th style=${{minWidth:60}}>Pull rate</th>
            ${visibleSets.map(s => html`<th key=${s} style=${{minWidth:90,whiteSpace:"nowrap"}}>
              ${openSetHistory
                ? html`<button class="card-avg-set-head" onClick=${()=>openSetHistory(s)}
                    title=${"Open price history for "+s}>${s} <span class="card-avg-set-head-hint">↗</span></button>`
                : s}
            </th>`)}
            ${showDiff && html`<th style=${{minWidth:80}}>Diff (A−B)</th>`}
          </tr>
        </thead>
        <tbody>
          ${RARS.map(r => {
            const cells = visibleSets.map(s => pickAvg((avgs[s]||{})[r]));
            const diff = showDiff && cells[0] != null && cells[1] != null ? cells[0] - cells[1] : null;
            return html`<tr key=${r}>
              <td style=${{fontWeight:500}}>${r}</td>
              <td class="muted">${PULL[r]}</td>
              ${cells.map((v,i) => {
                const tone = showDiff && diff != null
                  ? (i===0 ? (diff>0?"var(--green)":diff<0?"var(--red)":"inherit")
                            : (diff<0?"var(--green)":diff>0?"var(--red)":"inherit"))
                  : (v!=null&&v<0.5?"var(--text-muted)":"inherit");
                return html`<td key=${i} style=${{color:tone}}>${fmt(v)}</td>`;
              })}
              ${showDiff && html`<td style=${{color:diff==null?"var(--text-muted)":diff>0?"var(--green)":diff<0?"var(--red)":"inherit",fontWeight:600}}>
                ${diff==null?"—":(diff>0?"+":"")+fmt(diff)}
              </td>`}
            </tr>`;
          })}
          ${(() => {
            const evs = visibleSets.map(s => calcEV(avgs, s, nc, false, priceMode));
            const diff = showDiff && evs[0] != null && evs[1] != null ? evs[0] - evs[1] : null;
            return html`<tr class="card-avg-ev-row">
              <td style=${{fontWeight:600,color:"var(--text-dim)"}}>EV / box</td>
              <td class="muted">—</td>
              ${evs.map((ev,i)=>{
                const tone = showDiff && diff != null
                  ? (i===0 ? (diff>0?"var(--green)":"inherit") : (diff<0?"var(--green)":"inherit"))
                  : "var(--text)";
                return html`<td key=${i} style=${{fontWeight:700,color:tone}}>${fmt(ev)}</td>`;
              })}
              ${showDiff && html`<td style=${{fontWeight:700,color:diff==null?"var(--text-muted)":diff>0?"var(--green)":diff<0?"var(--red)":"inherit"}}>
                ${diff==null?"—":(diff>0?"+":"")+fmt(diff)}
              </td>`}
            </tr>`;
          })()}
        </tbody>
      </table>
    </div>
    <p class="muted" style=${{fontSize:11,marginTop:8}}>
      Average ${useMarket?"TCGPlayer Market":"Low"} price per card by rarity${onlyOne?" for "+onlyOne:""}.
      ${showDiff && " A = "+visibleSets[0]+", B = "+visibleSets[1]+". Diff = A − B."}
      ${" "}Pull rates shown are for Sets 1–11. Starting with Wilds Unknown (Set 12), rates differ: 6 Legendaries, ~30 Rares, 0.333 Enchanteds, 2.5 Epics per box.
    </p>
  </div>`;
}

// Resolve a Pack/Box sim card object into a "group" the CardDetailModal can
// display. The sim card carries tcgplayer_product_id, so we look up matching
// rows in raw to find both printings and group them.
const groupFromSimCard = (simCard, rawData) => {
  if(!simCard || !simCard.tcgplayer_product_id) return null;
  const rows = rawData.filter(r => r.tcgplayer_product_id === simCard.tcgplayer_product_id);
  if(rows.length === 0) return null;
  const groups = groupCards(rows);
  return groups[0] || null;
};

function Histogram({data}){
  const ents=Object.entries(data.buckets).sort(([a],[b])=>+a-+b);const maxC=Math.max(...ents.map(([,c])=>c));
  const bw=Math.max(4,Math.min(22,Math.floor(560/ents.length))),H=100,skip=Math.max(1,Math.ceil(ents.length/10));
  return html`<div><div class="muted" style=${{fontSize:11,marginBottom:6}}>Distribution across ${data.n.toLocaleString()} simulated boxes</div>
    <div class="scr"><svg width=${ents.length*(bw+2)+10} height=${H+28} style=${{display:"block"}}>
      ${ents.map(([b,c],i)=>{const bh=Math.max(2,(c/maxC)*H),x=i*(bw+2),near=Math.abs(+b-data.mean)<15;
        return html`<g key=${b}><rect x=${x} y=${H-bh} width=${bw} height=${bh} fill=${near?"var(--accent)":"rgba(200,168,70,0.25)"} rx="2"/>
          ${i%skip===0&&html`<text x=${x+bw/2} y=${H+18} textAnchor="middle" fontSize="9" fill="var(--text-muted)">$${b}</text>`}</g>`;})}
      <line x1="0" y1=${H} x2=${ents.length*(bw+2)} y2=${H} stroke="var(--border)" strokeWidth="0.5"/></svg></div>
    <div class="muted" style=${{fontSize:11,marginTop:4}}>Dark = near mean (${fmt(data.mean)}). ${((data.totals.filter(t=>t>=100).length/data.n)*100).toFixed(1)}% of boxes hit $100+.</div></div>`;
}

function BoxSim({rawData,sets,theme,user,collection,updateQty,onSignIn}){
  const [s,setS]=useState("");const [res,setRes]=useState(null);const [boxHist,setBoxHist]=useState([]);
  const [n,setN]=useState(1000);const [running,setRunning]=useState(false);const [dist,setDist]=useState(null);
  const [selectedGroup,setSelectedGroup]=useState(null);
  const openBestPull = () => { if(!res?.best) return; const g = groupFromSimCard(res.best, rawData); if(g) setSelectedGroup(g); };
  const pools=useMemo(()=>s?buildPools(rawData,s):null,[rawData,s]);
  const bestBox = useMemo(()=>boxHist.length?boxHist.reduce((best,b)=>b.total>best.total?b:best,boxHist[0]):null,[boxHist]);
  const openBox=()=>{
    if(!pools) return;
    const pull=getPull(s);
    const all=[];for(let i=0;i<24;i++) all.push(...simPack(pools,pull));
    const total=all.reduce((t,c)=>t+(c.price||0),0);
    const best=all.reduce((b,c)=>(!b||(c.price||0)>(b.price||0))?c:b,null);
    const rc={};for(const c of all){const k=c.printing==="Cold Foil"||c.printing==="Foil"?c.rarity+" Foil":c.rarity;rc[k]=(rc[k]||0)+1;}
    const entry={total,best,rc,num:boxHist.length+1};
    setRes(entry);setBoxHist(h=>[...h,entry]);setDist(null);
  };
  const runSim=()=>{
    if(!pools) return;setRunning(true);
    setTimeout(()=>{
      const pull=getPull(s);
      const tots=[];for(let b=0;b<n;b++){let t=0;for(let p=0;p<24;p++) for(const c of simPack(pools,pull)) t+=(c.price||0);tots.push(t);}
      tots.sort((a,b)=>a-b);
      const mean=tots.reduce((a,b)=>a+b,0)/tots.length,median=tots[Math.floor(tots.length/2)];
      const bs=10,minB=Math.floor(tots[0]/bs)*bs,maxB=Math.ceil(tots[tots.length-1]/bs)*bs;
      const bkts={};for(let b=minB;b<=maxB;b+=bs) bkts[b]=0;
      for(const t of tots){const b=Math.floor(t/bs)*bs;bkts[b]=(bkts[b]||0)+1;}
      setDist({totals:tots,mean,median,min:tots[0],max:tots[tots.length-1],buckets:bkts,n});setRunning(false);
    },50);
  };
  return html`<div>
    <div class="row">
      <${SetSel} val=${s} onChange=${v=>{setS(v);setRes(null);setBoxHist([]);setDist(null);}} placeholder="Select a set..." sets=${sets}/>

    ${boxHist.length>0&&html`<div style=${{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1rem"}}>
      <${Stat} label="Boxes opened" value=${boxHist.length}/>

      <${Stat} label="Best box" value=${fmt(bestBox?.total)} accent="var(--green)"/>
      <${Stat} label="Total spent" value=${fmt(boxHist.length*109.99)}/>
    </div>`}
    ${res&&html`<div style=${{marginBottom:"1.5rem"}}>
      <div class="muted" style=${{fontSize:11,marginBottom:8}}>Box #${res.num} \u2014 ${s}</div>
      <div style=${{display:"flex",gap:16,flexWrap:"wrap"}}>
        <div style=${{flex:1,minWidth:200}}>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
            <${Stat} label="Box total" value=${fmt(res.total)} accent=${res.total>=100?"var(--green)":null}/>
            <${Stat} label="Best pull" value=${(res.best?.name||"").substring(0,24)}/>
            <${Stat} label="Best card $" value=${fmt(res.best?.price)} accent=${res.best?.price>=10?"var(--green)":null}/>
          </div>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:5}}>
            ${RARS.flatMap(r=>[r,r+" Foil"]).filter(k=>res.rc[k]).map(k=>{
              const b=k.replace(" Foil",""),st=getBadgeStyle(b,theme),foil=k.includes("Foil");
              return html`<div class="card" key=${k} style=${{flexDirection:"row",alignItems:"center",padding:"5px 10px"}}>
                <span class="badge" style=${{background:st.bg,color:st.fg,fontSize:9}}>${foil?"\u2726 ":""}${k}</span>
                <span style=${{marginLeft:"auto",fontWeight:600}}>${res.rc[k]}</span>
              </div>`;
            })}
          </div>
        </div>
        ${res.best&&(res.best.img_small||res.best.img_normal)&&html`<div class="best-card-display" onClick=${openBestPull} style=${{cursor:"pointer"}}>
          <div style=${{fontSize:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Best Pull</div>
          <img src=${res.best.img_normal||res.best.img_small} alt=${res.best.name} style=${{width:"100%",borderRadius:6}}/>
          <div style=${{fontSize:12,fontWeight:600,marginTop:6}}>${res.best.name}</div>

          <${Badge} rarity=${res.best.rarity} foil=${res.best.printing==="Cold Foil"} theme=${theme}/>
        </div>`}

    ${boxHist.length>1&&html`<div style=${{marginBottom:"1.5rem"}}>
      <div style=${{fontWeight:600,fontSize:13,marginBottom:8,fontFamily:"'Cinzel',serif"}}>Box History</div>
      <div class="scr"><table>
        <thead><tr><th>Box #</th><th>Total</th><th>Best Pull</th><th>Best Card $</th></tr></thead>
        <tbody>${boxHist.slice().reverse().map(b=>html`<tr key=${b.num} style=${{background:b===bestBox?"var(--accent-glow)":"inherit"}}>
          <td style=${{fontWeight:500}}>Box #${b.num}${b===bestBox?" \u2B50":""}</td>
          <td style=${{color:b.total>=100?"var(--green)":"inherit"}}>${fmt(b.total)}</td>
          <td style=${{textAlign:"left",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${b.best?.name||"\u2014"}</td>
          <td style=${{color:b.best?.price>=10?"var(--green)":"inherit"}}>${fmt(b.best?.price)}</td>
        </tr>`)}</tbody>
      </table></div>
    </div>`}
    ${s&&html`<div style=${{borderTop:"1px solid var(--border)",paddingTop:"1.5rem"}}>
      <div style=${{fontWeight:600,marginBottom:"0.75rem",fontFamily:"'Cinzel',serif"}}>Monte Carlo Simulation</div>
      <div class="row">
        <select value=${n} onChange=${e=>setN(+e.target.value)} style=${{width:160}}>
          ${[100,500,1000,5000].map(v=>html`<option key=${v} value=${v}>${v.toLocaleString()} boxes</option>`)}
        </select>
        <button onClick=${runSim} disabled=${running} class="active">${running?"Running...":"Run simulation"}</button>
      </div>
      ${dist&&html`<div>
        <div style=${{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1rem"}}>
          <${Stat} label="Mean" value=${fmt(dist.mean)}/><${Stat} label="Median" value=${fmt(dist.median)}/>
          <${Stat} label="Min" value=${fmt(dist.min)}/><${Stat} label="Max" value=${fmt(dist.max)} accent="var(--green)"/>
        </div>
        <${Histogram} data=${dist}/>
      </div>`}
    </div>`}
  </div>`;
}

function CompareView({sets,avgs,priceMode}){
  const [a,setA]=useState("");const [b,setB]=useState("");
  const useMarket = priceMode === "market";
  const pickAvg = (d) => d ? (useMarket ? d.avgMkt : d.avg) : null;
  return html`<div><div class="row"><${SetSel} val=${a} onChange=${setA} placeholder="Set A..." sets=${sets}/><span class="muted">vs</span><${SetSel} val=${b} onChange=${setB} placeholder="Set B..." sets=${sets}/></div>
    ${a&&b&&html`<div class="scr"><table>
      <thead><tr><th>Rarity</th><th>Pull rate</th><th style=${{minWidth:90,whiteSpace:"nowrap"}}>${a}</th><th style=${{minWidth:90,whiteSpace:"nowrap"}}>${b}</th><th>Diff (A\u2212B)</th></tr></thead>
      <tbody>
        ${RARS.map(r=>{const dA=(avgs[a]||{})[r],dB=(avgs[b]||{})[r],vA=pickAvg(dA),vB=pickAvg(dB),diff=vA!=null&&vB!=null?vA-vB:null;
          return html`<tr key=${r}><td style=${{fontWeight:500,textAlign:"left"}}>${r}</td><td class="muted">${PULL[r]}</td>
            <td style=${{fontWeight:diff>0?600:400,color:diff>0?"var(--green)":diff<0?"var(--red)":"inherit"}}>${fmt(vA)}</td>
            <td style=${{fontWeight:diff<0?600:400,color:diff<0?"var(--green)":diff>0?"var(--red)":"inherit"}}>${fmt(vB)}</td>
            <td style=${{color:diff==null?"var(--text-muted)":diff>0?"var(--green)":"var(--red)"}}>${diff==null?"\u2014":diff>0?"+"+fmt(diff):fmt(diff)}</td></tr>`;
        })}
        ${(()=>{const evA=calcEV(avgs,a,false,false,priceMode),evB=calcEV(avgs,b,false,false,priceMode),diff=evA-evB;
          return html`<tr style=${{borderTop:"2px solid var(--border)"}}><td style=${{fontWeight:600,color:"var(--text-dim)",textAlign:"left"}}>EV / box</td><td class="muted">\u2014</td>
            <td style=${{fontWeight:600,color:diff>0?"var(--green)":"inherit"}}>${fmt(evA)}</td>
            <td style=${{fontWeight:600,color:diff<0?"var(--green)":"inherit"}}>${fmt(evB)}</td>
            <td style=${{fontWeight:600,color:diff>0?"var(--green)":"var(--red)"}}>${diff>0?"+"+fmt(diff):fmt(diff)}</td></tr>`;})()}
      </tbody></table></div>`}
  </div>`;
}

function HeatmapView({sets,avgs,priceMode}){
  const useMarket = priceMode === "market";
  const pickAvg = (cell) => cell ? (useMarket ? (cell.avgMkt||0) : (cell.avg||0)) : 0;
  const rows=useMemo(()=>sets.map(s=>{const d=avgs[s]||{},tot=RARS.reduce((t,r)=>t+pickAvg(d[r])*PULL[r],0);const c={};for(const r of RARS) c[r]=tot>0?(pickAvg(d[r])*PULL[r]/tot)*100:0;return {s,c};}),[sets,avgs,priceMode]);
  const cs={padding:"5px 7px",fontSize:11,textAlign:"center",border:"1px solid var(--border)"};
  return html`<div>
    <p class="muted" style=${{fontSize:12,marginBottom:"1rem"}}>% of box EV from each rarity. Darker = higher contribution.</p>
    <div class="scr"><table style=${{borderCollapse:"collapse"}}><thead><tr>
      <th style=${{...cs,textAlign:"left",minWidth:100,whiteSpace:"nowrap"}}>Set</th>
      ${RARS.map(r=>html`<th key=${r} style=${{...cs,minWidth:52,fontSize:10}}>${r}</th>`)}</tr></thead>
      <tbody>${rows.map(({s,c})=>html`<tr key=${s}>
        <td style=${{...cs,textAlign:"left",fontWeight:500,whiteSpace:"nowrap",background:"var(--table-header)"}}>${s}</td>
        ${RARS.map(r=>{const pct=c[r]||0,int=Math.min(1,pct/40);
          return html`<td key=${r} style=${{...cs,background:pct<0.5?"transparent":"rgba(200,168,70,"+(0.08+int*0.55).toFixed(2)+")",
            color:int>0.5?"var(--heatmap-text-hi)":"var(--heatmap-text-lo)",fontWeight:int>0.6?600:400}}>${pct<0.5?"":pct.toFixed(1)+"%"}</td>`;})}
      </tr>`)}</tbody></table></div></div>`;
}

// ── Collection set detail view ─────────────────────────────────────────
// Shown when user clicks a set on the Collection page. Dense responsive grid
// of every card in the set with +/- counters per printing. Two view modes:
// "list" (compact rows, ~2-3 columns) and "cards" (image tiles).

// Tiny horizontal counter — [−][N][+] all on one line. Used in both list
// rows and card tiles. Click-stop-propagation so we don't accidentally open
// the detail modal when changing quantity.
const InlineCounter = ({qty, onChange, disabled}) => {
  if(!onChange) return html`<div class="inline-counter empty"/>`;
  return html`<div class="inline-counter">
    <button class="ic-btn" onClick=${e=>{e.stopPropagation(); onChange(Math.max(0,qty-1));}} disabled=${qty<=0||disabled}>−</button>
    <span class="ic-qty ${qty>0?'has':''}">${qty}</span>
    <button class="ic-btn" onClick=${e=>{e.stopPropagation(); onChange(qty+1);}} disabled=${disabled}>+</button>
  </div>`;
};

const SetDetailListRow = ({group, normalQty, foilQty, onNormal, onFoil, onOpen, theme, showNormalSide, showFoilSide, subtitle}) => {
  const num = (group.Number||"").split("/")[0] || "—";
  const nLow = group.normal && group.normal["Low Price"];
  const fLow = group.foil   && group.foil["Low Price"];
  const showN = showNormalSide && group.normal && nLow != null;
  const showF = showFoilSide   && group.foil   && fLow != null;
  // When foilMode hides one side, render only the visible counter and span
  // both grid columns so it fills the space instead of leaving a gap.
  const onlyNormal = showNormalSide && !showFoilSide;
  const onlyFoil   = showFoilSide   && !showNormalSide;
  const rowClass = "sd-row" + ((onlyNormal||onlyFoil) ? " sd-row-solo" : "");
  // Hover-preview: list rows don't show the card art inline (too small to
  // be useful), so we float a larger image near the cursor on hover. State
  // lives per-row; the preview is portaled into <body> so it escapes any
  // overflow clipping further up the tree.
  const [hoverPos, setHoverPos] = useState(null);
  const previewImg = group.img_normal || group.img_small;
  const onEnter = (e) => {
    if(!previewImg) return;
    setHoverPos({x: e.clientX, y: e.clientY});
  };
  const onMove = (e) => {
    if(!previewImg || !hoverPos) return;
    setHoverPos({x: e.clientX, y: e.clientY});
  };
  const onLeave = () => setHoverPos(null);
  return html`<div class=${rowClass} style=${{background:inkTint(group.ink,theme)}}
      onClick=${onOpen}
      onMouseEnter=${onEnter} onMouseMove=${onMove} onMouseLeave=${onLeave}>
    ${onlyFoil
      ? html`<${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`
      : onlyNormal
        ? html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>`
        : html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>
               <${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`}
    <span class="sd-row-num">${num}</span>
    <div class="sd-row-name-wrap">
      <span class="sd-row-name" title=${group["Product Name"]}>${group["Product Name"]}</span>
      ${subtitle && html`<span class="sd-row-subtitle">${subtitle}</span>`}
    </div>
    <div class="sd-row-prices">
      ${showN && html`<a class="sd-row-price normal" href=${tcgUrl(group.normal.tcgplayer_product_id,"Normal")} target="_blank" rel="noopener nofollow" onClick=${e=>e.stopPropagation()}>$${nLow.toFixed(2)}</a>`}
      ${showF && html`<a class="sd-row-price foil" href=${tcgUrl(group.foil.tcgplayer_product_id, group.foil.tcg_printing)} target="_blank" rel="noopener nofollow" onClick=${e=>e.stopPropagation()}>$${fLow.toFixed(2)}</a>`}
      ${!showN && !showF && html`<span class="sd-row-price muted">—</span>`}
    </div>
    ${hoverPos && previewImg ? ReactDOM.createPortal(
      html`<div class="sd-row-preview" style=${{
        left:  Math.min(hoverPos.x + 18, window.innerWidth - 230) + "px",
        top:   Math.min(hoverPos.y + 18, window.innerHeight - 320) + "px",
      }}>
        <img src=${previewImg} alt=${group["Product Name"]}/>
      </div>`,
      document.body
    ) : null}
  </div>`;
};

const SetDetailCardTile = ({group, normalQty, foilQty, onNormal, onFoil, onOpen, theme, showNormalSide, showFoilSide, subtitle}) => {
  const num = (group.Number||"").split("/")[0] || "—";
  const img = group.img_small || group.img_normal;
  const price = (group.normal && group.normal["Low Price"]) ?? (group.foil && group.foil["Low Price"]);
  const onlyNormal = showNormalSide && !showFoilSide;
  const onlyFoil   = showFoilSide   && !showNormalSide;
  return html`<div class="sd-tile" style=${{background:inkTint(group.ink,theme)}}>
    ${img
      ? html`<img class="sd-tile-img" src=${img} alt=${group["Product Name"]} loading="lazy" onClick=${onOpen}/>`
      : html`<div class="sd-tile-img-placeholder" onClick=${onOpen}>${group["Product Name"]}</div>`}
    <div class="sd-tile-info" onClick=${onOpen}>
      <span class="sd-tile-num">#${num}</span>
      <div class="sd-tile-name-wrap">
        <span class="sd-tile-name" title=${group["Product Name"]}>${group["Product Name"]}</span>
        ${subtitle && html`<span class="sd-tile-subtitle">${subtitle}</span>`}
      </div>
