// ── Data source: Supabase (PostgREST). Publishable key is safe client-side. ──
const SUPABASE_URL = "https://umwqowkiatjjltologrd.supabase.co";
const SUPABASE_KEY = "sb_publishable_B2qq0Dsfij-7X2CZSxl2uQ_7PWc6Ob0";
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {persistSession:true, autoRefreshToken:true, detectSessionInUrl:true},
});

// Build PostgREST request headers. Pass an access_token to query as the
// signed-in user (gets RLS-authenticated role); omit it for anon reads.
const sbHeaders = (token) => ({
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + (token || SUPABASE_KEY),
});

// Supabase caps response at ~1000 rows server-side. To drain a larger table:
// first request uses Prefer:count=exact so Content-Range gives us the total,
// then we fire all remaining pages in parallel. One round-trip on small tables,
// two for tables up to ~10x the page size.
const SB_PAGE = 1000;
// Retry wrapper for transient 5xx / network errors. Supabase has a 10s
// statement timeout (PG error 57014) that fires intermittently on heavy
// views like card_prices_latest; one or two retries with backoff get the
// query through the next time the server is less loaded.
const SB_MAX_RETRIES = 3;
async function sbFetchWithRetry(url, headers, attempt = 0){
  try {
    const r = await fetch(url, {headers});
    if(r.status >= 500 && attempt < SB_MAX_RETRIES){
      const body = await r.text().catch(() => "");
      const wait = 400 * Math.pow(2, attempt); // 400ms, 800ms, 1600ms
      console.warn(`Supabase ${r.status}: retrying in ${wait}ms (attempt ${attempt+1}/${SB_MAX_RETRIES})`, body.slice(0,200));
      await new Promise(res => setTimeout(res, wait));
      return sbFetchWithRetry(url, headers, attempt + 1);
    }
    return r;
  } catch(e){
    if(attempt < SB_MAX_RETRIES){
      const wait = 400 * Math.pow(2, attempt);
      console.warn(`Supabase network error: retrying in ${wait}ms`, e.message);
      await new Promise(res => setTimeout(res, wait));
      return sbFetchWithRetry(url, headers, attempt + 1);
    }
    throw e;
  }
}
async function sbFetchAll(path, params, token){
  const url = SUPABASE_URL+"/rest/v1/"+path+"?"+(new URLSearchParams(params)).toString();
  const baseHeaders = {...sbHeaders(token), "Range-Unit":"items"};
  const fetchRange = async (start, end) => {
    const r = await sbFetchWithRetry(url, {...baseHeaders, "Range":start+"-"+end});
    if(!r.ok && r.status!==206) throw new Error("Supabase "+r.status+": "+await r.text());
    return {rows: await r.json(), contentRange: r.headers.get("Content-Range") || ""};
  };
  // First request with count=exact to learn total rows
  const firstRes = await sbFetchWithRetry(url, {...baseHeaders, "Range":"0-"+(SB_PAGE-1), "Prefer":"count=exact"});
  if(!firstRes.ok && firstRes.status!==206) throw new Error("Supabase "+firstRes.status+": "+await firstRes.text());
  const firstRows = await firstRes.json();
  const cr = firstRes.headers.get("Content-Range") || "";
  const total = parseInt((cr.split("/")[1]||"").trim(), 10);
  if(!Number.isFinite(total) || total <= firstRows.length) return firstRows;
  // Parallel fetch the rest
  const pages = [];
  for(let start = SB_PAGE; start < total; start += SB_PAGE){
    pages.push(fetchRange(start, Math.min(start + SB_PAGE - 1, total - 1)));
  }
  const results = await Promise.all(pages);
  const out = [...firstRows];
  for(const {rows} of results) out.push(...rows);
  return out;
}

// Local cache: render instantly on subsequent loads, then refresh in background.
// Bump the version suffix any time the row shape changes (or to bust a bad cache).
const CACHE_KEY = "packsink:catalog:v39";
// 24h cache — we always background-refresh when stale, so the user sees
// cached data instantly and gets a fresh swap within seconds. Long TTL keeps
// the experience snappy on slow Supabase nights without risking stale-price
// shock (refresh fires every load).
const CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
// Minimum row count we'd ever expect. If cache has fewer than this it's
// almost certainly from a partial fetch or older era — treat as missing.
const CACHE_MIN_ROWS = 4000;
function readCache(){
  try {
    const s = localStorage.getItem(CACHE_KEY);
    if(!s) return null;
    const {t, rows} = JSON.parse(s);
    if(typeof t !== "number" || !Array.isArray(rows)) return null;
    if(rows.length < CACHE_MIN_ROWS){
      console.warn("Cache row count below threshold ("+rows.length+"); discarding.");
      localStorage.removeItem(CACHE_KEY);
      return null;
    }
    const stale = Date.now() - t > CACHE_MAX_AGE_MS;
    return {rows, stale};
  } catch { return null; }
}
function writeCache(rows){
  if(!Array.isArray(rows) || rows.length < CACHE_MIN_ROWS) return; // don't poison the cache with partial data
  // Strip img_large before caching — it eats ~500KB across 5k rows and is
  // only used as a fallback for img_normal in three places (deck poster /
  // hover preview / detail modal). When those need the larger image they
  // gracefully degrade to img_normal (~400w), which is plenty visually.
  // Saves ~30% of the catalog cache size, keeping us well under the 5MB
  // localStorage quota.
  const slim = rows.map(r => {
    if(!r.img_large) return r;
    const {img_large, ...rest} = r;
    return rest;
  });
  const payload = JSON.stringify({t:Date.now(), rows: slim});
  // Three-pass write:
  //   1. Delete the old key first so the browser doesn't have to hold both
  //      old + new during the setItem (some browsers count it that way and
  //      reject the write when the sum exceeds quota).
  //   2. If that still fails, evict every other packsink cache except
  //      auth — those are rebuildable, the catalog is the expensive one.
  //   3. If still failing, give up and warn (next visit will retry).
  try { localStorage.removeItem(CACHE_KEY); localStorage.setItem(CACHE_KEY, payload); return; }
  catch(e){ /* fall through */ }
  try {
    const keysToDrop = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith("packsink:") && k !== CACHE_KEY && !k.startsWith("packsink:theme") && !k.startsWith("packsink:tipsEnabled")) keysToDrop.push(k);
    }
    for(const k of keysToDrop) localStorage.removeItem(k);
    localStorage.setItem(CACHE_KEY, payload);
  } catch(e2){
    console.warn("cache write failed even after eviction:", e2?.message || e2);
  }
}

// Separate cache for sealed-product prices. Small payload (~30KB for ~300
// rows) but worth keeping in localStorage so revisits don't re-fetch every
// time. Bump version on shape changes.
const SEALED_CACHE_KEY = "packsink:sealed:v1";
const SEALED_CACHE_MAX_AGE_MS = 60 * 60 * 1000; // same as catalog
function readSealedCache(){
  try {
    const s = localStorage.getItem(SEALED_CACHE_KEY);
    if(!s) return null;
    const {t, rows} = JSON.parse(s);
    if(typeof t !== "number" || !Array.isArray(rows)) return null;
    const stale = Date.now() - t > SEALED_CACHE_MAX_AGE_MS;
    return {rows, stale};
  } catch { return null; }
}
function writeSealedCache(rows){
  if(!Array.isArray(rows)) return;
  try { localStorage.setItem(SEALED_CACHE_KEY, JSON.stringify({t:Date.now(), rows})); }
  catch(e){ console.warn("sealed cache write failed:", e); }
}

const TipsContext = React.createContext(true);

// Custom hover tooltip rendered via portal. Native title= had a long delay
// and didn't show reliably on small labels. This shows immediately and
// escapes overflow:hidden ancestors. Gated on TipsContext (user setting).
function Tip(props){
  const tips = useContext(TipsContext);
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const text = props.text;
  const cls = props.class || props.className;
  const enabled = tips && !!text;
  const show = () => {
    if(!enabled || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setPos({left: r.left + r.width/2, top: r.top});
  };
  const hide = () => setPos(null);
  return html`<span ref=${ref}
      class=${(cls?cls+" ":"")+(enabled?"tip-trigger":"")}
      onMouseEnter=${show} onMouseLeave=${hide}
      onFocus=${show} onBlur=${hide}>
    ${props.children}
    ${enabled && pos ? ReactDOM.createPortal(
      html`<div class="tip-bubble" style=${{left:pos.left+"px", top:pos.top+"px"}}>${text}</div>`,
      document.body
    ) : null}
  </span>`;
}

const normalizeRarity = r => {
  if(!r) return r;
  const m={"super_rare":"Super Rare","Super_rare":"Super Rare","common":"Common","Common":"Common","uncommon":"Uncommon","Uncommon":"Uncommon","rare":"Rare","Rare":"Rare","legendary":"Legendary","Legendary":"Legendary","enchanted":"Enchanted","Enchanted":"Enchanted","epic":"Epic","Epic":"Epic","iconic":"Iconic","Iconic":"Iconic","promo":"Promo","Promo":"Promo"};
  return m[r]||r;
};

const getInk = n => { if(!n||isNaN(n)) return null; const i=Math.floor((n-1)/34); return i>=0&&i<6?INKS[i]:null; };
const getRarKey = (r,p) => {
  if(!r) return null; r=r.trim(); p=(p||"").trim();

const parseP = s => { if(s==null||s===undefined) return null; if(typeof s==="number") return s; const n=parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; };
const fmt = n => n==null?"\u2014":"$"+n.toFixed(2);
const pick = a => a?.length?a[Math.floor(Math.random()*a.length)]:null;
const wPick = opts => {
  const av=opts.filter(o=>o.p?.length); if(!av.length) return null;
  let r=Math.random()*av.reduce((s,o)=>s+o.w,0);
  for(const o of av){r-=o.w; if(r<=0) return o.p;} return av[av.length-1].p;
};

// Map a TCGCSV printing label to the site's expected printing string.
// For Enchanted/Epic/Iconic the site only expects "Cold Foil" rows.
const mapPrinting = (rar, tcgPrinting) => {
  if(["Enchanted","Epic","Iconic"].includes(rar)) return "Cold Foil";
  if(tcgPrinting==="Normal") return "Normal";
  return "Cold Foil"; // covers both "Cold Foil" and "Holofoil"
};

// Build site-shape rows from Supabase. We use TWO inputs:
//   priceRows — from card_prices_latest view (one row per priced product+printing)
//   cardsRows — from cards table (one row per card, including those without
//               current prices, e.g., bought-out chase cards)
// Strategy: iterate cards (authoritative catalog). For each card, emit one
// row per existing price entry. If the card has NO current price, emit
// synthetic row(s) so it still appears in the Cards / Collection views.
// Heavy fields (text, flavor_text, mid, high, image_large) are NOT stored
// here — they'd blow past localStorage's ~5MB quota. text/flavor are
// fetched on demand when the detail modal opens.
// Curated list of "custom variant" cards that live inside a mainline set but
// don't exist in Lorcast / TCGCSV with their own product id. Each variant
// inherits everything from its base printing (image, ink, cost, classifications)
// and links to the base's TCGPlayer listing for shopping, but is rendered as
// a distinct row with an "Error"-style Number and a subtitle. No prices.
//
// Add new entries here when more printing-error / alt-art variants surface.
const CUSTOM_VARIANTS = [
  {
    baseProductName: "Genie - On the Job",
    baseSet: "The First Chapter",
    baseRarity: "Enchanted",
    variantLabel: "Two Swords Variant",
  },
  {
    baseProductName: "Peter Pan - Pirate's Bane",
    baseSet: "Into the Inklands",
    baseRarity: "Enchanted",
    variantLabel: "Text Error",
  },
];

// Standalone cards Lorcast doesn't index. Each entry produces a synthetic
// catalog row in its declared set. Use this when a print run truly bypasses
// Lorcast — typical promos / Challenge / D23 cards are already in Lorcast
// (just re-run scripts/load_lorcast.py to pull them).
//
// Image strategy: provide EITHER `image` (full URL or `Logos/cards/...`)
// OR `tcgplayer_product_id` (auto-derives the TCGPlayer CDN URL).
// `printing` defaults to "Normal".
const CUSTOM_CARDS = [
  // Golden Mickey (pid 554628) is now a real cards row, injected via
  // scripts/patch_pid_overrides.py. No client-side stub needed.
];

const transformSupabaseData = (priceRows, cardsRows, setNameById) => {
  // Index prices by tcgplayer_product_id
  const pricesByProduct = {};
  for(const p of priceRows){
    const pid = p.tcgplayer_product_id;
    if(pid == null) continue;
    if(!pricesByProduct[pid]) pricesByProduct[pid] = [];
    pricesByProduct[pid].push(p);
  }

  // Companion product_ids in CONNECTING_FOILS are NOT standalone catalog
  // entries — they represent the foil printing of their base card. Some of
  // them (e.g. RoJ "1f" extended-art prints) are in our cards table, so
  // without a guard they'd also be emitted as duplicate rows. Track the
  // set + a lookup to the companion's image so the foil row can use it.
  const FOIL_COMPANION_PIDS = new Set(Object.values(CONNECTING_FOILS));
  const companionCardByPid = {};
  for(const c of cardsRows){
    if(c.tcgplayer_product_id != null && FOIL_COMPANION_PIDS.has(c.tcgplayer_product_id)){
      companionCardByPid[c.tcgplayer_product_id] = c;
    }
  }

  // Extract Lorcana keywords (Evasive, Rush, etc.) from each card's text once.
  // Lorcana keywords appear capitalized at the start of an ability line, often
  // followed by parenthetical reminder text. Whole-word match is enough since
  // the keyword set is small and unambiguous.
  const KEYWORD_NAMES = ["Rush","Reckless","Evasive","Bodyguard","Challenger",
    "Support","Ward","Singer","Resist","Voiceless","Shift","Probe","Lurk",
    "Alert","Boost","Vanish","Puppy Shift","Sing Together","Universal Shift"];
  const keywordsByCardId = {};
  for(const c of cardsRows){
    const t = (c.text || "");
    if(!t) continue;
    const found = [];
    for(const kw of KEYWORD_NAMES){
      const re = new RegExp("\\b" + kw + "\\b");
      if(re.test(t)) found.push(kw);
    }
    if(found.length) keywordsByCardId[c.id] = found;
  }

  const rows = [];
  const buildRow = (c, setName, rar, name, printing, priceRow) => ({
    "Set":setName,
    "set_id":c.set_id,
    "card_id":c.id,
    "tcgplayer_product_id":c.tcgplayer_product_id,
    "Product Name":name,
    "Rarity":rar,
    "Printing":mapPrinting(rar, printing),
    "tcg_printing":printing,
    "Low Price":priceRow ? parseP(priceRow.low_price) : null,
    "TCGPlayer Market":priceRow ? parseP(priceRow.market_price) : null,
    "Market Price":priceRow ? (parseP(priceRow.low_price) ?? parseP(priceRow.market_price)) : null,
    // Apply collector-number override (Challenge Promo renumber 25→1, etc.)
    "Number": COLLECTOR_NUMBER_OVERRIDES[(c.set_id||"") + "|" + (c.collector_number||"")] || c.collector_number || "",
    // Lorcast sometimes only populates the `large` image (Challenge Promo
    // Dragon Fire / Let It Go / Cinderella / Rapunzel are this way). Fall
    // back to large when small/normal are empty strings or null so tiles
    // still render an image.
    "img_small":  c.image_small  || c.image_large || c.image_normal || null,
    "img_normal": c.image_normal || c.image_large || c.image_small  || null,
    "img_large":  c.image_large  || c.image_normal || c.image_small || null,
    "ink":c.ink||null,
    "inks":Array.isArray(c.inks) && c.inks.length ? c.inks : (c.ink ? [c.ink] : null),
    "cost":c.cost!=null?c.cost:null,
    "strength":c.strength!=null?c.strength:null,
    "willpower":c.willpower!=null?c.willpower:null,
    "lore":c.lore!=null?c.lore:null,
    "move_cost":c.move_cost!=null?c.move_cost:null,
    "inkable":c.inkable,
    "card_type":c.card_type||null,
    "classifications":c.classifications||null,
    "keywords":keywordsByCardId[c.id] || null,
    "illustrators":Array.isArray(c.illustrators) && c.illustrators.length
      // Lorcast stores co-illustrators as a single " / "-joined string
      // ("Magenta Muraca / Grace Tran"). Split so each artist is searchable
      // independently and shows up as its own chip in the Artist filter.
      ? c.illustrators.flatMap(s => String(s||"").split(/\s*\/\s*/).map(t => t.trim()).filter(Boolean))
      : null,
    // Per-card variant label (e.g. Golden Mickey · Serial Numbered). Most
    // cards have this as null; the few that need it are listed in
    // VARIANT_LABELS_BY_CARD_ID at the top of the file.
    "variant_label": VARIANT_LABELS_BY_CARD_ID[c.id] || null,
  });

  // Drop the `tcgplayer_product_id is not null` filter at fetch time too so
  // catalog-only cards (no TCGPlayer mapping) reach this loop.
  for(const origC of cardsRows){
    // A connecting-foil COMPANION product (e.g. RoJ cn 1f) is not its own
    // card — it's the foil printing of its base. Skip it here so the
    // catalog doesn't show a duplicate "1f" row alongside the base "1".
    if(origC.tcgplayer_product_id != null && FOIL_COMPANION_PIDS.has(origC.tcgplayer_product_id)) continue;

    const rawSetName = setNameById[origC.set_id] || "";
    const setName = SET_DISPLAY_NAMES[rawSetName] || rawSetName;
    if(!setName) continue;
    // Apply curated tcgplayer_product_id overrides. Used to backfill recent
    // promos Lorcast hasn't linked yet AND to *correct* cases where Lorcast
    // bound the wrong pid (the Hiro Hamada 24 / 24B swap is the canonical
    // example). Override wins regardless of whether Lorcast has a value.
    let c = origC;
    {
      const overrideName = c.version ? c.name+" - "+c.version : c.name;
      const ov = TCG_PID_OVERRIDES[overrideName + "|" + (c.collector_number||"")];
      if(ov != null) c = {...c, tcgplayer_product_id: ov};
    }
    let rar = normalizeRarity(c.rarity);
    if(!SET_ORDER.includes(setName)) rar = "Promo";
    else if(PROMO_RARITY_SETS.has(setName)) rar = "Promo";
    const name = c.version ? c.name+" - "+c.version : c.name;
    const isChase = ["Enchanted","Iconic","Epic"].includes(rar);
    const extras = c.tcgplayer_product_id != null ? EXTRAS_MAP[c.tcgplayer_product_id] : null;
    const connectingFoilPid = c.tcgplayer_product_id != null
      ? CONNECTING_FOILS[c.tcgplayer_product_id] : null;

    // Half-Hexwell-style cards live ONLY in Extras & Oddities — suppress the
    // base-set appearance entirely. (The synthetic Extras row is emitted in
    // the EXTRAS_MAP loop below, regardless of this skip.)
    if(extras && extras.excludeFromBaseSet) continue;

    // Cards without a TCGPlayer mapping (e.g., Stitch Carefree Snowboarder
    // Epic) still show in the catalog with no buy link / no price.
    const prices = c.tcgplayer_product_id ? pricesByProduct[c.tcgplayer_product_id] : null;
    if(prices && prices.length){
      // Mislabel handling: TCGCSV sometimes publishes a card's in-pack foil
      // under printing=Holofoil instead of Cold Foil (confirmed via live
      // TCGPlayer listings on several WitW cards). If a non-chase, non-extras
      // card has a Holofoil row, it's the canonical foil and any separate
      // Cold Foil / Foil row is stale — suppress those so they don't show
      // up as a duplicate "Foil" line in the modal.
      const hasHolofoil = prices.some(p => p.printing === "Holofoil");
      const treatHolofoilAsFoil = hasHolofoil && !isChase && !extras && !connectingFoilPid;
      const suppressNonFoil = (c.tcgplayer_product_id != null && SUPPRESS_NONFOIL_PIDS.has(c.tcgplayer_product_id))
        || SUPPRESS_NONFOIL_NAMES.has(name + "|" + (c.collector_number||""));
      // Year 3 ghost-row suppression: each card has exactly one real printing
      // per collector number; TCGCSV publishes both. Drop the bogus one.
      const y3Num = setName === "Lorcana Challenge Promo (C2)"
        ? parseInt(String(c.collector_number||"").split("/")[0], 10)
        : null;
      const y3Canonical = (y3Num != null) ? YEAR3_PRINTING_BY_NUMBER[y3Num] : null;
      for(const p of prices){
        if(suppressNonFoil && p.printing === "Normal") continue;
        if(y3Canonical){
          const pIsFoil = p.printing === "Cold Foil" || p.printing === "Foil" || p.printing === "Holofoil";
          if(y3Canonical === "foil"   && !pIsFoil) continue;
          if(y3Canonical === "normal" &&  pIsFoil) continue;
        }
        if(connectingFoilPid && (p.printing === "Cold Foil" || p.printing === "Foil" || p.printing === "Holofoil")){
          // Connecting-art foils have the real foil at a SEPARATE
          // tcgplayer_product_id (handled below). Any foil-class row on
          // the BASE product is the stray/mistaken listing the user
          // flagged, so we drop it instead of letting it pollute the
          // foil slot.
          continue;
        }
        if(p.printing === "Holofoil"){
          // Chase cards: Holofoil IS the chase printing — emit as-is.
          // Extras cards: Holofoil is the variant — handled in the synthetic
          //   emission loop below; skip here so it doesn't pollute the base.
          // Mislabel cards: emit but re-key as "Cold Foil" so the foil block
          //   uses this row's price (tcg_printing stays "Holofoil" so reads
          //   from prices_daily continue to hit the right rows).
          if(extras) continue;
          if(treatHolofoilAsFoil){
            rows.push(buildRow(c, setName, rar, name, p.printing, p));
            continue;
          }
          rows.push(buildRow(c, setName, rar, name, p.printing, p));
        } else if(p.printing === "Cold Foil" || p.printing === "Foil"){
          if(treatHolofoilAsFoil) continue; // stale — Holofoil wins
          rows.push(buildRow(c, setName, rar, name, p.printing, p));
        } else {
          // p.printing === "Normal" path. Apply Chinese-Exclusive override
          // here: suppress price + label + clear the TCGPlayer link +
          // swap in the locally-hosted card art.
          const chinaKey = name + "|" + (c.collector_number||"");
          const chinaImg = CHINA_ONLY_NONFOIL[chinaKey];
          const isChinese = chinaImg !== undefined;
          const row = buildRow(c, setName, rar, name, p.printing, isChinese ? null : p);
          if(isChinese){
            row.variant_label = "Chinese Exclusive";
            row.tcgplayer_product_id = null;
            row.china_only = true;
            row.img_small = chinaImg;
            row.img_normal = chinaImg;
            row.img_large = chinaImg;
          }
          rows.push(row);
        }
      }
      // Backfill: Chinese-Exclusive Non-Foil row for cards whose TCGCSV
      // feed has ONLY foil rows (no Normal entry to decorate above).
      // Without this the China-only non-foil entry would be invisible.
      const chinaOnlyKey = name + "|" + (c.collector_number||"");
      const chinaOnlyImg = CHINA_ONLY_NONFOIL[chinaOnlyKey];
      if(chinaOnlyImg !== undefined){
        const haveNormal = rows.some(r =>
          r.card_id === c.id && r.tcg_printing === "Normal" && r.Set === setName);
        if(!haveNormal){
          const row = buildRow(c, setName, rar, name, "Normal", null);
          row.variant_label = "Chinese Exclusive";
          row.tcgplayer_product_id = null;
          row.china_only = true;
          row.img_small = chinaOnlyImg;
          row.img_normal = chinaOnlyImg;
          row.img_large = chinaOnlyImg;
          rows.push(row);
        }
      }
      // Lorcana Challenge Promo (C1) always ships a foil printing per card — every
      // card has at least a Cold Foil/Holofoil prize variant. If TCGCSV
      // only returned a Normal row for a card in this set (e.g. A Whole
      // New World — only the Normal pid is indexed), synthesize a Cold
      // Foil placeholder so the Foil section is complete.
      if(setName === "Lorcana Challenge Promo (C1)"){
        const haveFoil = rows.some(r =>
          r.card_id === c.id && r.Set === setName
          && (r.tcg_printing === "Cold Foil" || r.tcg_printing === "Foil" || r.tcg_printing === "Holofoil"));
        if(!haveFoil){
          rows.push(buildRow(c, setName, rar, name, "Cold Foil", null));
        }
      }
    } else {
      // No current price entry. Synthesize so the card appears in Cards /
      // Collection views with $— prices. Chase cards only print as Holofoil;
      // everything else gets both Normal + Cold Foil synthetic rows.
      const suppressNonFoil = (c.tcgplayer_product_id != null && SUPPRESS_NONFOIL_PIDS.has(c.tcgplayer_product_id))
        || SUPPRESS_NONFOIL_NAMES.has(name + "|" + (c.collector_number||""));
      // Promo sets almost always ship a single printing per card (typically
      // Cold Foil). Emitting both placeholder rows is noise — collapse to one.
      const isPromoSet = setName === "Promo Set 1" || setName === "Promo Set 2" || setName === "Promo Set 3";
      // Same Year 3 canonical-printing rule as the priced branch — pick
      // only the one synthetic row that actually exists in the print run.
      const y3NumNoPx = setName === "Lorcana Challenge Promo (C2)"
        ? parseInt(String(c.collector_number||"").split("/")[0], 10)
        : null;
      const y3CanonicalNoPx = (y3NumNoPx != null) ? YEAR3_PRINTING_BY_NUMBER[y3NumNoPx] : null;
      if(isChase){
        rows.push(buildRow(c, setName, rar, name, "Holofoil", null));
      } else if(isPromoSet){
        rows.push(buildRow(c, setName, rar, name, "Cold Foil", null));
      } else if(y3CanonicalNoPx === "foil"){
        rows.push(buildRow(c, setName, rar, name, "Cold Foil", null));
      } else if(y3CanonicalNoPx === "normal"){
        rows.push(buildRow(c, setName, rar, name, "Normal", null));
      } else {
        if(!suppressNonFoil) rows.push(buildRow(c, setName, rar, name, "Normal", null));
        if(!connectingFoilPid) rows.push(buildRow(c, setName, rar, name, "Cold Foil", null));
      }
    }

    // Connecting-art foils: the real foil lives at a separate product_id.
    // Look it up in prices_daily and emit a Cold Foil row that points at
    // the companion product (TCGPlayer link, history fetch) while keeping
    // the same card_id so the collection slot groups under the base card.
    // We also lift the companion's image when available — for extended-art
    // foils the visual is distinct from the base card, and we want the
    // foil block in the modal to show that image specifically.
    if(connectingFoilPid){
      const foilPrices = pricesByProduct[connectingFoilPid] || [];
      const foilPrice = foilPrices.find(p => p.printing === "Cold Foil")
                     || foilPrices.find(p => p.printing === "Foil")
                     || foilPrices.find(p => p.printing === "Holofoil")
                     || null;
      const companion = companionCardByPid[connectingFoilPid];
      const cardWithFoilOverrides = {
        ...c,
        tcgplayer_product_id: connectingFoilPid,
        image_small:  (companion && companion.image_small)  || c.image_small,
        image_normal: (companion && companion.image_normal) || c.image_normal,
      };
      const printingTag = foilPrice ? foilPrice.printing : "Cold Foil";
      rows.push(buildRow(cardWithFoilOverrides, setName, rar, name, printingTag, foilPrice));
    }
  }

  // Synthetic Extras & Oddities rows. One per EXTRAS_MAP entry, regardless
  // of whether the base card was emitted above. We reuse the base card's
  // metadata (image, name, ink/cost/etc) but stamp it with the variant
  // label and a synthetic card_id so collection rows for the variant don't
  // collide with the base card's collection slot.
  for(const [pidStr, info] of Object.entries(EXTRAS_MAP)){
    const pid = parseInt(pidStr, 10);
    const baseCard = cardsRows.find(c => c.tcgplayer_product_id === pid);
    // Fall back to standalone metadata for cards Lorcast doesn't index
    // (e.g. Illumineer's Quest products). Both paths converge on a
    // baseCard-shaped object that buildRow can consume.
    const seed = baseCard || (info.standalone ? {
      ...info.standalone,
      tcgplayer_product_id: pid,
      set_id: null,
    } : null);
    if(!seed) continue;
    const prices = pricesByProduct[pid] || [];
    // Variants live under different printings depending on the source.
    // Starter-deck foils + Half Hexwell are Holofoil; Deep Trouble cards
    // are Cold Foil. Prefer whichever printing the product actually has.
    const foilPrice = prices.find(p => p.printing === "Cold Foil")
                   || prices.find(p => p.printing === "Foil")
                   || prices.find(p => p.printing === "Holofoil")
                   || null;
    const printingTag = foilPrice ? foilPrice.printing : "Cold Foil";
    const syntheticCard = {
      ...seed,
      id: "extras:" + pid,
      // set_id stays as base for image lookups etc, but the buildRow's
      // setName arg overrides the displayed set.
    };
    const baseName = seed.version ? seed.name+" - "+seed.version : seed.name;
    const row = buildRow(syntheticCard, EXTRAS_SET_NAME, info.variantLabel, baseName, printingTag, foilPrice);
    // Stash the origin set so the Extras detail view can group / label
    // entries by where they came from in the mainline catalog.
    row.originSet = info.originSet;
    rows.push(row);
  }

  // ── Custom variants ────────────────────────────────────────────────
  // Inject error / alt-art listings curated above. Each clones its base
  // row (any printing) but with a distinct card_id, a Number suffixed
  // with "Error", a variant_label that surfaces as the row subtitle,
  // and no prices (no Low / Market / Market Price). The TCGPlayer link
  // still points at the base product so users can buy from the same
  // listing the variant ships in.
  for(const cv of CUSTOM_VARIANTS){
    // Case-insensitive name match + optional rarity filter (defaults to
    // "Enchanted" since our variants currently target enchanted printings).
    // The same Product Name can appear at multiple collector numbers within
    // a set (Pirate's Bane is at #120 AND #215) — the rarity filter picks
    // the right one.
    const wantName   = cv.baseProductName.toLowerCase();
    const wantRarity = (cv.baseRarity || "Enchanted").toLowerCase();
    const base = rows.find(r =>
      r.Set === cv.baseSet
      && String(r["Product Name"]||"").toLowerCase() === wantName
      && String(r.Rarity||"").toLowerCase() === wantRarity);
    if(!base){
      console.warn("CUSTOM_VARIANTS: base not found for", cv.baseProductName, "in", cv.baseSet, `(rarity=${cv.baseRarity||"Enchanted"})`);
      continue;
    }
    const slug = cv.variantLabel.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const baseNum = String(base.Number || "");
    const [num, denom] = baseNum.split("/");
    const variantNumber = denom ? `${num}Error/${denom}` : `${num}Error`;
    rows.push({
      ...base,
      card_id: `${base.card_id}::variant::${slug}`,
      Number: variantNumber,
      variant_label: cv.variantLabel,
      "Low Price": null,
      "TCGPlayer Market": null,
      "Market Price": null,
      isCustomVariant: true,
    });
  }

  // ── Custom standalone cards (Lorcast-missing) ──────────────────────
  // Pull in any cards declared in CUSTOM_CARDS that aren't already in
  // Lorcast — Challenge Set prizes, future one-offs, etc. No prices
  // attached. Image URL is resolved in this order:
  //   1. explicit `image` field
  //   2. derived from `tcgplayer_product_id` via the TCGPlayer CDN
  //   3. null (tile renders without an image)
  for(const cc of (CUSTOM_CARDS || [])){
    const printing = cc.printing || "Normal";
    const numSlug  = String(cc.Number || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const nameSlug = String(cc.name   || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0,50);
    const printSlug = printing.toLowerCase().replace(/\s+/g, "-");
    const variantSlug = cc.variantLabel ? "-" + cc.variantLabel.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") : "";
    const card_id = `custom::${(cc.Set||"unknown").toLowerCase().replace(/\s+/g,"-")}::${numSlug}::${nameSlug}::${printSlug}${variantSlug}`;
    const img = cc.image
      || (cc.tcgplayer_product_id != null
            ? `https://tcgplayer-cdn.tcgplayer.com/product/${cc.tcgplayer_product_id}_400w.jpg`
            : null);
    const img_small = cc.image_small
      || (cc.tcgplayer_product_id != null
            ? `https://tcgplayer-cdn.tcgplayer.com/product/${cc.tcgplayer_product_id}_200w.jpg`
            : null);
    rows.push({
      "Set":              cc.Set,
      "set_id":           null,
      "card_id":          card_id,
      "tcgplayer_product_id": cc.tcgplayer_product_id ?? null,
      "Product Name":     cc.name,
      "Rarity":           cc.Rarity || "Promo",
      "Printing":         printing,
      "tcg_printing":     printing,
      "Low Price":        null,
      "TCGPlayer Market": null,
      "Market Price":     null,
      "Number":           cc.Number || "",
      "img_small":        img_small,
      "img_normal":       img,
      "img_large":        img,
      "ink":              cc.ink   || null,
      "inks":             cc.inks  || (cc.ink ? [cc.ink] : null),
      "cost":             cc.cost  != null ? cc.cost : null,
      "inkable":          cc.inkable != null ? cc.inkable : null,
      "card_type":        cc.card_type || null,
      "classifications":  cc.classifications || null,
      "keywords":         cc.keywords || null,
      "illustrators":     cc.illustrators || null,
      "variant_label":    cc.variantLabel || null,
      "isCustomCard":     true,
    });
  }

  return rows;
};

const buildPools = (data, set) => {
  const p={byInk:{Amber:[],Amethyst:[],Emerald:[],Ruby:[],Sapphire:[],Steel:[]},unc:[],rar:[],sr:[],leg:[],cF:[],uF:[],rF:[],srF:[],lF:[],enc:[],epi:[],ico:[]};
  for(const row of data){
    if((row["Set"]||"").trim()!==set) continue;
    const name=(row["Product Name"]||"").trim(),rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim(),price=parseP(row["Market Price"]);
    const num=parseInt((row["Number"]||"").split("/")[0]),ink=row["ink"]||null;
    const c={name,rarity:rar,printing:pr,price,num,img_small:row["img_small"],img_normal:row["img_normal"],img_large:row["img_large"],ink:ink,
      tcgplayer_product_id:row["tcgplayer_product_id"]||null,
      tcg_printing:row["tcg_printing"]||null};
    if(rar==="Enchanted"){p.enc.push(c);continue;} if(rar==="Epic"){p.epi.push(c);continue;} if(rar==="Iconic"){p.ico.push(c);continue;}
    if(pr==="Normal"){
      const ci=ink||getInk(num);
      if(rar==="Common"&&ci) p.byInk[ci].push(c); else if(rar==="Uncommon") p.unc.push(c); else if(rar==="Rare") p.rar.push(c); else if(rar==="Super Rare") p.sr.push(c); else if(rar==="Legendary") p.leg.push(c);
    } else if(pr==="Cold Foil"||pr==="Foil"){
      if(rar==="Common") p.cF.push(c); else if(rar==="Uncommon") p.uF.push(c); else if(rar==="Rare") p.rF.push(c); else if(rar==="Super Rare") p.srF.push(c); else if(rar==="Legendary") p.lF.push(c);
    }
  }
  return p;
};

const simPack = (pools,pull) => {
  const cards=[];
  for(const ink of INKS){const c=pick(pools.byInk[ink]);if(c) cards.push(c);}
  for(let i=0;i<3;i++){const c=pick(pools.unc);if(c) cards.push(c);}
  for(let i=0;i<2;i++){const pool=wPick([{p:pools.rar,w:pull["Rare"]},{p:pools.sr,w:pull["Super Rare"]},{p:pools.leg,w:pull["Legendary"]}]);const c=pick(pool);if(c) cards.push(c);}
  const fp=wPick([{p:pools.cF,w:pull["Common Foil"]},{p:pools.uF,w:pull["Uncommon Foil"]},{p:pools.rF,w:pull["Rare Foil"]},{p:pools.srF,w:pull["Super Rare Foil"]},{p:pools.lF,w:pull["Legendary Foil"]},{p:pools.enc,w:pull["Enchanted"]},{p:pools.epi,w:pull["Epic"]},{p:pools.ico,w:pull["Iconic"]}]);
  const fc=pick(fp);if(fc) cards.push(fc);
  return cards;
};

const processData = raw => {
  // Collect both Low and Market price samples per (set, rarity). The Market
  // analytics views (EV / Playset Cost / Card Averages) let the user toggle
  // which one drives the numbers, so we precompute both.
  //
  // Fallback semantics: prefer the chosen source, fall back to the other when
  // null. Newer-set commons/foils often have a market_price but no low_price
  // (or vice versa), and strict per-side lookup would silently zero them out
  // — wrecking EV / heatmap / averages for the newest set. The fallback
  // matches the pre-toggle behavior in Low mode so existing displays are
  // backward-compatible, and gives Market mode useful coverage too.
  const grpLow={}, grpMkt={}, sSet=new Set();
  for(const row of raw){
    const set=(row["Set"]||"").trim(),rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim();
    if(!set||!rar) continue;
    const key=getRarKey(rar,pr); if(!key) continue;
    const rawLow = parseP(row["Low Price"]);
    const rawMkt = parseP(row["TCGPlayer Market"]);
    if(rawLow == null && rawMkt == null) continue;
    const pLow = rawLow != null ? rawLow : rawMkt;
    const pMkt = rawMkt != null ? rawMkt : rawLow;
    sSet.add(set);
    if(!grpLow[set]) grpLow[set]={}; if(!grpLow[set][key]) grpLow[set][key]=[]; grpLow[set][key].push(pLow);
    if(!grpMkt[set]) grpMkt[set]={}; if(!grpMkt[set][key]) grpMkt[set][key]=[]; grpMkt[set][key].push(pMkt);
  }
  const mean   = (a) => a.reduce((x,y)=>x+y,0)/a.length;
  const meanNC = (a) => a.map(p=>p<1?0:p).reduce((x,y)=>x+y,0)/a.length;
  const avgs={};
  const allSets = new Set([...Object.keys(grpLow), ...Object.keys(grpMkt)]);
  for(const s of allSets){
    avgs[s] = {};
    const rmLow = grpLow[s] || {}, rmMkt = grpMkt[s] || {};
    const allRars = new Set([...Object.keys(rmLow), ...Object.keys(rmMkt)]);
    for(const r of allRars){
      const lowArr = rmLow[r], mktArr = rmMkt[r];
      avgs[s][r] = {
        avg:      lowArr && lowArr.length ? mean(lowArr)   : null,
        avgNC:    lowArr && lowArr.length ? meanNC(lowArr) : null,
        avgMkt:   mktArr && mktArr.length ? mean(mktArr)   : null,
        avgMktNC: mktArr && mktArr.length ? meanNC(mktArr) : null,
      };
    }
  }
  // EV / Pack / Box / History / Set-Values views are mainline-only — promo
  // sets, Extras, EPCOT, Illumineer's Quest etc. don't follow standard
  // pull rates so they don't belong in those calculations / pickers.
  const sets = MAINLINE_SETS.filter(s => sSet.has(s));
  return {sets,avgs};
};

// `excludes` accepts a Set of rarity names to skip, or a legacy boolean
// (true = skip Enchanted + Iconic, false = skip nothing). Keeping the
// boolean overload avoids changing every existing call site.
const calcEV = (avgs,set,nc,excludes,priceMode) => {
  const d=avgs[set]||{},pull=getPull(set);let ev=0;
  const useMarket = priceMode === "market";
  const exc = excludes instanceof Set ? excludes : (excludes === true ? NO_ENCH : new Set());
  for(const r of RARS){
    const rate=pull[r],rd=d[r];if(!rd) continue;
    if(exc.has(r)) continue;
    const v = useMarket ? (nc?rd.avgMktNC:rd.avgMkt) : (nc?rd.avgNC:rd.avg);
    if(v == null) continue;
    ev += v * rate;
  }
  return ev;
};

// ── TCGPlayer affiliate URL via Impact ──────────────────────────────────
// /c/<MID>/<AID>/<OFFER_ID>/ is the partner-specific tracking entry; ?u=
// is Impact's deep-link parameter to forward to a specific TCGPlayer page
// after the click is recorded. When a `printing` is supplied, we add it as a
// Printing= query parameter on the destination so the product page lands
// pre-filtered to that variant (Cold Foil for regular foils, Holofoil for
// Enchanted/Iconic/Epic chase cards).
const TCG_AFFILIATE_BASE = "https://partner.tcgplayer.com/c/7285926/1780961/21018";
const tcgUrl = (productId, printing) => {
  if(!productId) return null;
  let dest = `https://www.tcgplayer.com/product/${productId}/?Language=English`;
  if(printing && printing !== "Normal"){

// ── Price history fetching ──────────────────────────────────────────────
// Per-card history is the dominant anon query against prices_daily (89% of
// DB time in the Supabase query report). A localStorage cache with a 12h
// TTL collapses repeat views of the same card within a session — and across
// sessions until the next ETL cycle has plausibly run — into zero DB calls.
const CARD_HIST_TTL_MS = 12 * 60 * 60 * 1000;
const CARD_HIST_KEY_PREFIX = "packsink:hist:v1:";
const cardHistKey = (productId, printing) => CARD_HIST_KEY_PREFIX + productId + ":" + printing;
function readCardHistCache(productId, printing){
  try {
    const s = localStorage.getItem(cardHistKey(productId, printing));
    if(!s) return null;
    const o = JSON.parse(s);
    if(!o || !Array.isArray(o.rows) || typeof o.t !== "number") return null;
    if(Date.now() - o.t > CARD_HIST_TTL_MS) return null;
    return o.rows;
  } catch { return null; }
}
function writeCardHistCache(productId, printing, rows){
  const payload = JSON.stringify({t: Date.now(), rows});
  try { localStorage.setItem(cardHistKey(productId, printing), payload); }
  catch(e){
    // Quota exceeded — drop every hist entry and retry once. We never
    // attempt a third write; a single failure is harmless (next view
    // re-fetches), but we don't want to spin in retry loops.
    try {
      const keysToDrop = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(CARD_HIST_KEY_PREFIX)) keysToDrop.push(k);
      }
      for(const k of keysToDrop) localStorage.removeItem(k);
      localStorage.setItem(cardHistKey(productId, printing), payload);
    } catch { /* still no room — give up silently */ }
  }
}

// Generic JSON cache for stuff that survives tab switches AND page refreshes.
// HomeView/FollowingFeed/TournamentResultsBanner all unmount when you leave
// their tab; previously they'd re-fetch from Supabase every time you came
// back. Now they hydrate cached data instantly and only re-fetch in
// background after the TTL.
function readJsonCache(key, ttlMs){
  try {
    const s = localStorage.getItem(key);
    if(!s) return null;
    const o = JSON.parse(s);
    if(!o || typeof o.t !== "number") return null;
    if(Date.now() - o.t > ttlMs) return {data: o.data, stale: true};
    return {data: o.data, stale: false};
  } catch { return null; }
}
function writeJsonCache(key, data){
  const payload = JSON.stringify({t: Date.now(), data});
  try { localStorage.setItem(key, payload); return; }
  catch(e){
    // Quota exceeded. Evict cache keys we can rebuild on demand, in order
    // of "least costly to lose". History and per-graded entries first, then
    // home-page banners. Catalog cache (packsink:catalog) is the most
    // expensive to rebuild — keep it longest.
    const EVICT_PRIORITY = [
      "packsink:hist:",              // per-card price history (regenerates fast)
      "packsink:home:tourneys:",     // home tournament banner
      "packsink:following:",         // home following feed
      "packsink:movers:",            // home movers banner
      "packsink:screener-movers:",   // screener movers
      "packsink:sealed:",            // sealed catalog
    ];
    for(const prefix of EVICT_PRIORITY){
      const toDrop = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix) && k !== key) toDrop.push(k);
      }
      for(const k of toDrop) localStorage.removeItem(k);
      if(toDrop.length){
        try { localStorage.setItem(key, payload); return; }
        catch { /* still full — keep evicting */ }
      }
    }
    console.warn("localStorage quota exceeded; could not cache", key);
  }
}

async function fetchCardHistory(productId, printing){
  if(!productId || !printing) return [];
  const cached = readCardHistCache(productId, printing);
  if(cached) return cached;
  const rows = await sbFetchAll("prices_daily", {
    select: "date,low_price,market_price",
    source: "eq.tcgcsv",
    grade: "eq.raw",
    tcgplayer_product_id: "eq." + productId,
    printing: "eq." + printing,
    order: "date.asc",
  });
  writeCardHistCache(productId, printing, rows || []);
  return rows;
}

// Bulk price history for the collection-value chart. Batches both the
// product IN-list AND the date range — Supabase has a 10s statement
// timeout, and a full-year × full-collection query blows past it. With
// 80-ID batches running in parallel, each individual query stays small
// enough to land in under a second.
const COLLECTION_HISTORY_BATCH = 80;
// Pull daily graded price history for a user's owned (pid, grader, grade)
// slots since a given date. PostgREST doesn't support multi-column IN, so we
// query by tcgplayer_product_id IN(...) (in batches to keep URLs short) and
// then filter client-side to the requested (grader, grade) combos.
async function fetchGradedHistoryFor(slots, sinceDate){
  if(!slots.length) return [];
  const pids = Array.from(new Set(slots.map(s => s.pid).filter(Number.isFinite)));
  if(!pids.length) return [];
  const wantKey = new Set(slots.map(s => `${s.pid}|${s.grader}|${s.grade}`));
  const BATCH = 60;
  const batches = [];
  for(let i=0; i<pids.length; i+=BATCH) batches.push(pids.slice(i, i+BATCH));
  const results = await Promise.all(batches.map(b => sbFetchAll("graded_prices_daily", {
    select: "tcgplayer_product_id,grader,grade,date,ebay_avg_7d,ebay_avg_1d,ebay_avg_30d",
    tcgplayer_product_id: "in.(" + b.join(",") + ")",
    date: "gte." + sinceDate,
    order: "tcgplayer_product_id.asc,grader.asc,grade.asc,date.asc",
  })));
  const rows = results.flat();
  return rows.filter(r => wantKey.has(`${r.tcgplayer_product_id}|${r.grader}|${r.grade}`));
}

// Roll up graded_prices_daily rows into a {date, value} series.
// ownedSlots: array of {pid, grader, grade, qty}. Forward-fills missing dates
// from the last known price so cards that didn't tick still contribute.
function computeGradedValueHistory(rows, ownedSlots){
  const bySlot = {};
  for(const r of rows){
    const k = `${r.tcgplayer_product_id}|${r.grader}|${r.grade}`;
    if(!bySlot[k]) bySlot[k] = [];
    bySlot[k].push(r);
  }
  const dateSet = new Set();
  for(const s of ownedSlots){
    const k = `${s.pid}|${s.grader}|${s.grade}`;
    const series = bySlot[k]; if(!series) continue;
    for(const r of series) dateSet.add(r.date);
  }
  const dates = Array.from(dateSet).sort();
  if(!dates.length) return [];
  const valueByDate = Object.fromEntries(dates.map(d => [d, 0]));
  for(const s of ownedSlots){
    const k = `${s.pid}|${s.grader}|${s.grade}`;
    const series = bySlot[k];
    if(!series || !series.length) continue;
    let prev = null, si = 0;
    for(const date of dates){
      while(si < series.length && series[si].date <= date){
        const r = series[si];
        const p = r.ebay_avg_7d ?? r.ebay_avg_1d ?? r.ebay_avg_30d;
        if(p != null) prev = Number(p);
        si++;
      }
      if(prev != null) valueByDate[date] += s.qty * prev;
    }
  }
  return dates.map(d => ({date: d, value: valueByDate[d]}));
}

async function fetchCollectionPriceHistory(productIds, sinceDate){
  if(!productIds.length) return [];
  const batches = [];
  for(let i=0; i<productIds.length; i+=COLLECTION_HISTORY_BATCH){
    batches.push(productIds.slice(i, i+COLLECTION_HISTORY_BATCH));
  }
  const results = await Promise.all(batches.map(b => sbFetchAll("prices_daily", {
    select: "tcgplayer_product_id,printing,date,low_price",
    source: "eq.tcgcsv",
    grade: "eq.raw",
    tcgplayer_product_id: "in.(" + b.join(",") + ")",
    date: "gte." + sinceDate,
    order: "tcgplayer_product_id.asc,printing.asc,date.asc",
  })));
  return results.flat();
}

// djb2-style hash for the (sorted) owned-products string. The full key
// would be ~15 KB for a 1500-card collection — fine in memory but wasteful
// as a localStorage key. The hash collapses it to ~8 chars.
function shortHash(s){
  let h = 5381;
  for(let i=0; i<s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
// localStorage key for the persisted collection-value cache.
function collectionValueCacheKey(userId, productsHash, rangeKey){
  // v2 = prerelease-spike guard applied. Bump when the rollup logic changes
  // so stale per-user series get invalidated automatically.
  return `packsink:colvalue:v2:${(userId||"").slice(0,8)}:${productsHash}:${rangeKey}`;
}
function readCollectionValueCache(key){
  try {
    const s = localStorage.getItem(key);
    if(!s) return null;
    const o = JSON.parse(s);
    if(!o || !Array.isArray(o.series) || typeof o.t !== "number") return null;
    return o;
  } catch { return null; }
}
function writeCollectionValueCache(key, series){
  try { localStorage.setItem(key, JSON.stringify({t:Date.now(), series})); }
  catch(e){ /* quota / disabled — non-fatal */ }
}

// Roll up daily price rows into total collection value per date.
// ownedByProductPrinting: Map<"productId|printing", quantity>
// Forward-fills missing days from the last known price (cards aren't always
// in every daily snapshot), so a card that didn't tick today still contributes.
function computeCollectionValueHistory(rows, ownedByProductPrinting, productEarliestDate){
  // productEarliestDate: optional map tcgplayer_product_id → "YYYY-MM-DD".
  // Any price snapshot strictly older than this date is dropped (prerelease
  // spike guard for mainline sets — typical Pre-Release lows are 20x real).
  const guard = productEarliestDate || null;
  const byKey = {};
  for(const r of rows){
    if(guard){
      const earliest = guard[r.tcgplayer_product_id];
      if(earliest && r.date < earliest) continue;
    }
    const k = r.tcgplayer_product_id + "|" + r.printing;
    if(!byKey[k]) byKey[k] = [];
    byKey[k].push(r);
  }
  // Union of all dates in the relevant series — anchors the X axis.
  const dateSet = new Set();
  for(const k of ownedByProductPrinting.keys()){
    const s = byKey[k]; if(!s) continue;
    for(const r of s) dateSet.add(r.date);
  }
  const dates = Array.from(dateSet).sort();
  if(!dates.length) return [];
  const valueByDate = Object.fromEntries(dates.map(d => [d, 0]));
  for(const [key, qty] of ownedByProductPrinting){
    const series = byKey[key];
    if(!series || !series.length) continue;
    let prev = null, si = 0;
    for(const date of dates){
      while(si < series.length && series[si].date <= date){
        const p = parseP(series[si].low_price);
        if(p != null) prev = p;
        si++;
      }
      if(prev != null) valueByDate[date] += qty * prev;
    }
  }
  return dates.map(d => ({date:d, value: valueByDate[d]}));
}

// ── Lightweight SVG line chart ──────────────────────────────────────────
// Renders one or more series of {x, y} points. x is a number (typically a
// unix timestamp); y is a number (typically a price). Auto-fits axes and
// draws subtle grid + y-axis labels. Hand-rolled to avoid any chart library.
const niceTicks = (min, max, n=4) => {
  if(!Number.isFinite(min) || !Number.isFinite(max) || max <= min) return [min];
  const range = max - min;
  const roughStep = range / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
  const norm = roughStep / mag;
  const step = norm < 1.5 ? 1*mag : norm < 3 ? 2*mag : norm < 7 ? 5*mag : 10*mag;
  const ticks = [];
  for(let v = Math.ceil(min/step)*step; v <= max + 1e-9; v += step) ticks.push(v);
  return ticks;
};
const fmtTickPrice = (v) => v >= 100 ? "$"+v.toFixed(0) : v >= 10 ? "$"+v.toFixed(1) : "$"+v.toFixed(2);
// Format an axis tick based on how wide the visible date range is.
// Short ranges → "Month DD", medium → "Month DD 'YY", long → "Month 'YY".
const fmtTickDate = (ts, rangeMs) => {
  const DAY = 24*3600*1000;
  const opts = rangeMs < 60*DAY
    ? {month:"short", day:"numeric", timeZone:"UTC"}
    : rangeMs < 547*DAY  // ~1.5 years
      ? {month:"short", day:"numeric", year:"2-digit", timeZone:"UTC"}
      : {month:"short", year:"numeric", timeZone:"UTC"};
  return new Date(ts).toLocaleDateString(undefined, opts);
};
const fmtTooltipDate = (ts) =>
  new Date(ts).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});

const LineChart = ({series, width=320, height=120, padding={top:8,right:8,bottom:22,left:42}, showDateAxis=true, verticalMarkers=null}) => {
  const wrapRef = useRef(null);
  const [hover, setHover] = useState(null); // {x: viewBoxX, clientX, clientY}
  // Measure the wrapper's actual rendered width so the SVG viewBox matches
  // the on-screen pixel width 1:1. Without this, the SVG was stretched
  // horizontally via preserveAspectRatio="none" — visually fine for the
  // line path, but text labels (date axis, dollar ticks) end up squashed
  // or stretched depending on container ratio. Resize-observing keeps the
  // viewBox aligned even when the chart is resized.
  const [measuredW, setMeasuredW] = useState(width);
  useEffect(() => {
    if(!wrapRef.current || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(entries => {
      const w = entries[0]?.contentRect?.width;
      if(w && w > 0) setMeasuredW(Math.round(w));
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  width = measuredW;

  if(!series || !series.length) return null;
  const allPoints = series.flatMap(s => s.data || []);
  const valids = allPoints.filter(p => p && Number.isFinite(p.y));
  if(valids.length < 2) return html`<div class="chart-empty">Not enough data yet</div>`;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const p of valids){
    if(p.x < minX) minX = p.x;
    if(p.x > maxX) maxX = p.x;
    if(p.y < minY) minY = p.y;
    if(p.y > maxY) maxY = p.y;
  }
  if(maxX === minX){ maxX = minX + 1; }
  const yPad = Math.max(0.01, (maxY - minY) * 0.08);
  const yMin = Math.max(0, minY - yPad);
  const yMax = maxY + yPad;

  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const xScale = (x) => padding.left + ((x - minX) / (maxX - minX)) * innerW;
  const yScale = (y) => padding.top + innerH - ((y - yMin) / (yMax - yMin || 1)) * innerH;

  const yTicks = niceTicks(yMin, yMax, 4);
  const xTicks = showDateAxis ? [minX, (minX+maxX)/2, maxX] : [];

  // Find the data point closest to a given viewBoxX, per series. Also stash
  // the leftmost valid point on each series so we can compute % change
  // relative to the start of the visible range.
  const pickPoints = (vbX) => series.map(s => {
    const valid = (s.data||[]).filter(p => Number.isFinite(p.y));
    if(!valid.length) return null;
    let best = null, bestDist = Infinity;
    for(const p of valid){
      const px = xScale(p.x);
      const d = Math.abs(px - vbX);
      if(d < bestDist){ bestDist = d; best = p; }
    }
    return {series: s, point: best, first: valid[0]};
  }).filter(h => h);

  const onMove = (e) => {
    const el = wrapRef.current;
    if(!el) return;
    const rect = el.getBoundingClientRect();
    const vbX = ((e.clientX - rect.left) / rect.width) * width;
    if(vbX < padding.left - 2 || vbX > width - padding.right + 2){ setHover(null); return; }
    setHover({x: vbX, clientX: e.clientX, clientY: e.clientY, rect});
  };
  const onLeave = () => setHover(null);

  const hovered = hover ? pickPoints(hover.x) : null;
  // Snap the guide to the nearest data point's x for consistency across series
  const snapX = hovered && hovered.length > 0 ? xScale(hovered[0].point.x) : null;
  // Tooltip position (in CSS pixels relative to the wrapper)
  const tipLeftPct = snapX != null ? (snapX / width) * 100 : null;

  const dateStr = hovered && hovered.length > 0
    ? fmtTooltipDate(hovered[0].point.x)
    : "";

  return html`<div class="line-chart-wrap" ref=${wrapRef}>
    <svg viewBox=${`0 0 ${width} ${height}`} class="line-chart" preserveAspectRatio="none"
      style=${{width:"100%",height:height+"px"}}
      onMouseMove=${onMove} onMouseLeave=${onLeave}>
      ${yTicks.map(t => html`<line key=${"g"+t}
        x1=${padding.left} x2=${width-padding.right}
        y1=${yScale(t)} y2=${yScale(t)}
        stroke="var(--border)" stroke-dasharray="2,3" stroke-width="0.6"/>`)}
      ${yTicks.map(t => html`<text key=${"l"+t}
        x=${padding.left - 4} y=${yScale(t)+3.5}
        text-anchor="end" font-size="9" fill="var(--text-muted)">${fmtTickPrice(t)}</text>`)}
      ${xTicks.map((t,i) => html`<text key=${"xl"+i}
        x=${xScale(t)} y=${height-6}
        text-anchor=${i===0?"start":i===xTicks.length-1?"end":"middle"}
        font-size="9" fill="var(--text-muted)">${fmtTickDate(t, maxX-minX)}</text>`)}
      ${verticalMarkers && verticalMarkers.map((m,i) => {
        const x = xScale(m.x);
        if(x < padding.left - 2 || x > width - padding.right + 2) return null;
        const labelX = x > width * 0.8 ? x - 4 : x + 4;
        const labelAnchor = x > width * 0.8 ? "end" : "start";
        return html`<g key=${"vm"+i}>
          <line x1=${x.toFixed(1)} x2=${x.toFixed(1)} y1=${padding.top} y2=${height-padding.bottom}
            stroke=${m.color||"var(--text-muted)"} stroke-width="1.1"
            stroke-dasharray=${m.dashed?"4,3":"0"} opacity="0.65"/>
          ${m.label && html`<text x=${labelX} y=${padding.top+9}
            font-size="9" text-anchor=${labelAnchor}
            fill=${m.color||"var(--text-muted)"} font-weight="600">${m.label}</text>`}
        </g>`;
      })}
      ${series.map((s,i) => {
        const points = (s.data||[]).filter(p => Number.isFinite(p.y))
          .map(p => `${xScale(p.x).toFixed(1)},${yScale(p.y).toFixed(1)}`).join(" ");
        if(!points) return null;
        return html`<polyline key=${"s"+i} fill="none" stroke=${s.color} stroke-width="1.6"
          stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray=${s.dashed?"5,3":"0"} points=${points}/>`;
      })}
      ${snapX != null && html`<line
        x1=${snapX} x2=${snapX} y1=${padding.top} y2=${height-padding.bottom}
        stroke="var(--text-muted)" stroke-width="0.7" stroke-dasharray="2,2"/>`}
      ${hovered && hovered.map((h,i) => html`<circle key=${"h"+i}
        cx=${xScale(h.point.x)} cy=${yScale(h.point.y)}
        r="3.2" fill=${h.series.color} stroke="var(--bg-card)" stroke-width="1.2"/>`)}
    </svg>
    ${hovered && hovered.length > 0 && html`<div class="chart-tooltip" style=${{
        left: tipLeftPct + "%",
        transform: (tipLeftPct > 75) ? "translateX(-105%)" : (tipLeftPct < 25) ? "translateX(5%)" : "translateX(-50%)"
      }}>
      <div class="chart-tooltip-date">${dateStr}</div>
      ${hovered.map(h => {
        const firstY = h.first?.y;
        const showPct = firstY != null && firstY !== 0 && h.point.x !== h.first.x;
        const pct = showPct ? ((h.point.y - firstY) / firstY * 100) : null;
        return html`<div key=${h.series.label} class="chart-tooltip-row">
          <span class="legend-swatch" style=${{background:h.series.color}}/>
          <span class="chart-tooltip-label">${h.series.label}</span>
          <span class="chart-tooltip-value">$${h.point.y.toFixed(2)}</span>
          ${pct != null && html`<span class=${"chart-tooltip-pct "+(pct>=0?"up":"down")}>${pct>=0?"+":""}${pct.toFixed(1)}%</span>`}
        </div>`;
      })}
    </div>`}
  </div>`;
};

// Build chart series array from raw history rows for a card.
// showLow/showMarket let us render Low and Market on the same chart as
// solid (Low) + dashed (Market) lines.
const buildHistorySeries = (normalRows, foilRows, opts={}) => {
  const {showLow=true, showMarket=false, showFoil=true} = opts;
  const out = [];
  const seriesFor = (rows, color, kind) => {
    if(showLow){
      out.push({
        label: kind + " NM Low", color, dashed:false,
        data: rows.map(r => ({
          x: Date.parse(r.date),
          y: r.low_price != null ? parseFloat(r.low_price) : null,
        })).filter(p => Number.isFinite(p.y)),
      });
    }
    if(showMarket){
      out.push({
        label: kind + " Market", color, dashed:true,
        data: rows.map(r => ({
          x: Date.parse(r.date),
          y: r.market_price != null ? parseFloat(r.market_price) : null,
        })).filter(p => Number.isFinite(p.y)),
      });
    }
  };
  if(normalRows && normalRows.length) seriesFor(normalRows, "#1d8d4a", "Normal");
  if(showFoil && foilRows && foilRows.length) seriesFor(foilRows, "#7e54c4", "Foil");
  return out;
};

// ── Compare-report export ───────────────────────────────────────────────
// Builds a self-contained SVG of the multi-product compare chart with a
// Morningstar-style title block, branded footer, and a product table
// (color swatch, name, type/set, start/end price, % change). Serializable
// to PNG via the standard SVG -> Image -> canvas trick. No external assets
// referenced (no <img>, no web fonts) so the rendered PNG is deterministic
// and CORS-clean.
const _xmlEscape = (s) => String(s == null ? "" : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]);
const _truncate = (s, n) => { const str = String(s||""); return str.length <= n ? str : str.slice(0, n-1) + "…"; };

function buildCompareReportSvg({title, subtitle, items, series, colors, footerNote}){
  const W = 1100;
  const headerH = 80;
  const chartH = 340;
  const chartPad = {top: 24, right: 28, bottom: 36, left: 64};
  const tableHeaderH = 30;
  const rowH = 26;
  const tableH = tableHeaderH + Math.max(1, items.length) * rowH + 16;
  const footerH = 34;
  const totalH = headerH + chartH + tableH + footerH;

  const validSeries = (series || []).filter(s => s && s.data && s.data.length);
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for(const s of validSeries){
    for(const p of s.data){
      if(!Number.isFinite(p.y)) continue;
      if(p.x < minX) minX = p.x;
      if(p.x > maxX) maxX = p.x;
      if(p.y < minY) minY = p.y;
      if(p.y > maxY) maxY = p.y;
    }
  }
  const hasData = Number.isFinite(minX) && Number.isFinite(maxX) && Number.isFinite(minY) && Number.isFinite(maxY);
  if(hasData && maxX === minX){ maxX = minX + 1; }
  const yPad = hasData ? Math.max(0.01, (maxY - minY) * 0.08) : 0;
  const yMin = hasData ? Math.max(0, minY - yPad) : 0;
  const yMax = hasData ? maxY + yPad : 1;

  const innerLeft = chartPad.left;
  const innerRight = W - chartPad.right;
  const innerTop = headerH + chartPad.top;
  const innerBottom = headerH + chartH - chartPad.bottom;
  const innerW = innerRight - innerLeft;
  const innerH = innerBottom - innerTop;
  const xScale = x => innerLeft + ((x - minX) / (maxX - minX)) * innerW;
  const yScale = y => innerBottom - ((y - yMin) / (yMax - yMin || 1)) * innerH;
  const yTicks = hasData ? niceTicks(yMin, yMax, 5) : [];
  const xTicks = hasData ? [minX, minX + (maxX - minX) * 0.25, (minX+maxX)/2, minX + (maxX - minX) * 0.75, maxX] : [];
  const rangeMs = hasData ? (maxX - minX) : 0;

  const parts = [];
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">`);
  parts.push(`<rect width="${W}" height="${totalH}" fill="#ffffff"/>`);
  parts.push(`<rect x="0" y="0" width="6" height="${totalH}" fill="#1d8d4a"/>`);
  parts.push(`<text x="40" y="40" font-size="22" font-weight="700" fill="#16181c">${_xmlEscape(title)}</text>`);
  parts.push(`<text x="40" y="62" font-size="12" fill="#5a6068">${_xmlEscape(subtitle)}</text>`);
  parts.push(`<text x="${W-40}" y="40" font-size="13" font-weight="700" fill="#1d8d4a" text-anchor="end">packs.ink</text>`);
  parts.push(`<text x="${W-40}" y="58" font-size="10" fill="#7a8088" text-anchor="end">Lorcana market data</text>`);
  parts.push(`<line x1="40" x2="${W-40}" y1="${headerH-1}" y2="${headerH-1}" stroke="#e3e6ea"/>`);

  if(hasData){
    for(const t of yTicks){
      const y = yScale(t);
      parts.push(`<line x1="${innerLeft}" x2="${innerRight}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef0f2" stroke-dasharray="3,3"/>`);
      parts.push(`<text x="${innerLeft-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#7a8088">${_xmlEscape(fmtTickPrice(t))}</text>`);
    }
    xTicks.forEach((t, i) => {
      const x = xScale(t);
      const anchor = i===0?'start':i===xTicks.length-1?'end':'middle';
      parts.push(`<text x="${x.toFixed(1)}" y="${(innerBottom+16).toFixed(1)}" font-size="10" fill="#7a8088" text-anchor="${anchor}">${_xmlEscape(fmtTickDate(t, rangeMs))}</text>`);
    });
    parts.push(`<line x1="${innerLeft}" x2="${innerRight}" y1="${innerBottom}" y2="${innerBottom}" stroke="#cfd3d8"/>`);
    parts.push(`<line x1="${innerLeft}" x2="${innerLeft}" y1="${innerTop}" y2="${innerBottom}" stroke="#cfd3d8"/>`);
    validSeries.forEach((s) => {
      const valid = s.data.filter(p => Number.isFinite(p.y));
      if(valid.length < 2) return;
      const pts = valid.map(p => `${xScale(p.x).toFixed(1)},${yScale(p.y).toFixed(1)}`).join(' ');
      parts.push(`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
    });
  } else {
    parts.push(`<text x="${(W/2).toFixed(0)}" y="${(headerH + chartH/2).toFixed(0)}" font-size="14" fill="#7a8088" text-anchor="middle">No history data available for the selected products.</text>`);
  }

  const tableTop = headerH + chartH;
  parts.push(`<line x1="40" x2="${W-40}" y1="${tableTop}" y2="${tableTop}" stroke="#e3e6ea"/>`);
  const cols = [
    {label:"#",         x: 64,  anchor:"start"},
    {label:"PRODUCT",   x: 96,  anchor:"start"},
    {label:"TYPE / SET",x: 480, anchor:"start"},
    {label:"START",     x: 760, anchor:"end"},
    {label:"END",       x: 870, anchor:"end"},
    {label:"CHANGE",    x: 990, anchor:"end"},
  ];
  const headerY = tableTop + 20;
  for(const c of cols){
    parts.push(`<text x="${c.x}" y="${headerY}" font-size="10" font-weight="700" fill="#3a4047" text-anchor="${c.anchor}" letter-spacing="0.6">${_xmlEscape(c.label)}</text>`);
  }
  parts.push(`<line x1="40" x2="${W-40}" y1="${tableTop + tableHeaderH - 2}" y2="${tableTop + tableHeaderH - 2}" stroke="#eef0f2"/>`);

  items.forEach((it, i) => {
    const rowY = tableTop + tableHeaderH + i * rowH + 18;
    const color = colors[i % colors.length];
    parts.push(`<rect x="46" y="${rowY-9}" width="14" height="5" fill="${color}" rx="2"/>`);
    parts.push(`<text x="${cols[0].x}" y="${rowY}" font-size="11" fill="#5a6068" text-anchor="start">${i+1}</text>`);
    parts.push(`<text x="${cols[1].x}" y="${rowY}" font-size="12" fill="#16181c" font-weight="600">${_xmlEscape(_truncate(it.name, 60))}</text>`);
    const kindBadge = it.kind === "sealed" ? "Sealed" : "Card";
    const typeStr = (it.sub ? it.sub + " · " : "") + kindBadge;
    parts.push(`<text x="${cols[2].x}" y="${rowY}" font-size="11" fill="#5a6068">${_xmlEscape(_truncate(typeStr, 44))}</text>`);
    const sData = series[i] && series[i].data ? series[i].data.filter(p => Number.isFinite(p.y)) : [];
    if(sData.length){
      const start = sData[0].y, end = sData[sData.length-1].y;
      const pct = start !== 0 ? ((end - start)/start*100) : null;
      parts.push(`<text x="${cols[3].x}" y="${rowY}" font-size="11" fill="#16181c" text-anchor="end">$${start.toFixed(2)}</text>`);
      parts.push(`<text x="${cols[4].x}" y="${rowY}" font-size="11" fill="#16181c" text-anchor="end">$${end.toFixed(2)}</text>`);
      const pctText = pct == null ? "—" : (pct >= 0 ? "+" : "") + pct.toFixed(1) + "%";
      const pctColor = pct == null ? "#5a6068" : (pct >= 0 ? "#1d8d4a" : "#c64c5a");
      parts.push(`<text x="${cols[5].x}" y="${rowY}" font-size="11" fill="${pctColor}" font-weight="600" text-anchor="end">${_xmlEscape(pctText)}</text>`);
    } else {
      parts.push(`<text x="${cols[5].x}" y="${rowY}" font-size="11" fill="#5a6068" text-anchor="end">no data</text>`);
    }
  });

  parts.push(`<line x1="40" x2="${W-40}" y1="${totalH-footerH}" y2="${totalH-footerH}" stroke="#e3e6ea"/>`);
  parts.push(`<text x="40" y="${totalH-12}" font-size="10" fill="#7a8088">${_xmlEscape(footerNote || "Unofficial fan site · not affiliated with Disney or Ravensburger")}</text>`);
  parts.push(`<text x="${W-40}" y="${totalH-12}" font-size="10" fill="#7a8088" text-anchor="end">Source: TCGCSV / TCGPlayer · Generated ${new Date().toISOString().slice(0,10)}</text>`);
  parts.push('</svg>');
  return parts.join('');
}

async function exportCompareReportPng(reportArgs){
  const svgString = buildCompareReportSvg(reportArgs);
  const filenameBase = "packs-ink-compare-" + new Date().toISOString().slice(0,10);
  const svgBlob = new Blob([svgString], {type: "image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);
  try {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = (e) => reject(e);
      im.src = url;
    });
    const scale = 2;
    const canvas = document.createElement("canvas");
    const W = img.width || 1100;
    const H = img.height || 800;
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W, H);
    await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if(!blob) return reject(new Error("toBlob returned null"));
        const a = document.createElement("a");
        const burl = URL.createObjectURL(blob);
        a.href = burl;
        a.download = filenameBase + ".png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(burl);
        resolve();
      }, "image/png");
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

// Ported (loosely) from Ink.Box card_lookup.parse_query — typing free-form

const INK_ALIASES = {

const RARITY_ALIASES = {

  "super rare":"Super Rare", "superrare":"Super Rare", "sr":"Super Rare",
  "legendary":"Legendary", "leg":"Legendary",
  "enchanted":"Enchanted", "enc":"Enchanted",
  "epic":"Epic", "iconic":"Iconic", "promo":"Promo",
};
const SET_NICKNAMES = {
  "tfc":"The First Chapter", "first chapter":"The First Chapter",
  "rotf":"Rise of the Floodborn", "rise":"Rise of the Floodborn", "floodborn set":"Rise of the Floodborn",
  "iti":"Into the Inklands", "inklands":"Into the Inklands", "into the inklands":"Into the Inklands",
  "ursula":"Ursula's Return", "ursulas":"Ursula's Return", "ursulas return":"Ursula's Return",
  "shimmering":"Shimmering Skies", "skies":"Shimmering Skies", "shimmering skies":"Shimmering Skies",
