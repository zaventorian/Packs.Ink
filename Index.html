const MulliganSimulator = ({deck, cardById, onClose}) => {
  // Expand the deck-cards list (with quantities) into a flat array of
  // card_ids. Order doesn't matter — we shuffle immediately.
  const flatDeck = useMemo(() => {
    const out = [];
    for(const c of (deck.cards || [])){
      for(let i=0; i<c.quantity; i++) out.push(c.card_id);
    }
    return out;
  }, [deck.cards]);

  const [phase, setPhase] = useState("initial"); // "initial" | "final"
  const [hand, setHand] = useState([]);
  const [remaining, setRemaining] = useState([]);
  const [mulliganSet, setMulliganSet] = useState(new Set());

  const reshuffle = useCallback(() => {
    if(flatDeck.length < 7){
      setHand([]); setRemaining([]); setPhase("initial"); setMulliganSet(new Set());
      return;
    }
    const shuffled = fisherYates(flatDeck);
    setHand(shuffled.slice(0, 7));
    setRemaining(shuffled.slice(7));
    setMulliganSet(new Set());
    setPhase("initial");
  }, [flatDeck]);

  // Shuffle on first open.
  useEffect(() => { reshuffle(); /* eslint-disable-next-line */ }, []);

  const toggleMulligan = (idx) => {
    if(phase !== "initial") return;
    setMulliganSet(prev => {
      const next = new Set(prev);
      if(next.has(idx)) next.delete(idx); else next.add(idx);
      return next;
    });
  };

  const applyMulligan = () => {
    const toBottom = [];
    const keepHand = [];
    hand.forEach((cid, i) => {
      if(mulliganSet.has(i)) toBottom.push(cid);
      else keepHand.push(cid);
    });
    // Mulliganed cards go to the BOTTOM of the deck; we draw replacements
    // from the TOP.
    const newDeck = remaining.concat(toBottom);
    const drawN = toBottom.length;
    const drawn = newDeck.slice(0, drawN);
    const finalHand = keepHand.concat(drawn);
    setHand(finalHand);
    setRemaining(newDeck.slice(drawN));
    setMulliganSet(new Set());
    setPhase("final");
  };

  const totalCards = flatDeck.length;
  const isShort = totalCards < 7;

  const renderCard = (cid, idx) => {
    const meta = (cardById[cid] || [])[0];
    const rawImg = meta?.img_large || meta?.img_normal || meta?.img_small;
    const img = rawImg ? rawImg.replace("/normal/", "/large/").replace("/small/", "/large/") : null;
    const name = meta?.["Product Name"] || cid;
    const isMull = mulliganSet.has(idx);
    return html`<button key=${idx+":"+cid}
      class=${"mulligan-card"+(isMull?" is-mull":"")}
      onClick=${()=>toggleMulligan(idx)}
      disabled=${phase!=="initial"}
      title=${name}>
      ${img
        ? html`<img src=${img} alt=${name}/>`
        : html`<div class="mulligan-card-fallback">${name}</div>`}
      ${isMull && html`<div class="mulligan-card-overlay">↻ MULL</div>`}
    </button>`;
  };

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal mulligan-modal" onClick=${e=>e.stopPropagation()}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>
          Mulligan Simulator <span class="muted" style=${{fontSize:12,fontWeight:400,marginLeft:8}}>
            — ${deck.name || "Untitled deck"}
          </span>
        </h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:20}}>
        ${isShort
          ? html`<div class="muted" style=${{fontSize:13,padding:"20px 0",textAlign:"center"}}>
              Need at least 7 cards in the deck to simulate (this one has ${totalCards}).
            </div>`
          : html`<div>
              <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
                <span style=${{fontSize:13,fontWeight:600}}>
                  ${phase === "initial" ? "Opening hand" : "Final hand"}
                </span>
                <span class="muted" style=${{fontSize:11}}>
                  ${phase === "initial"
                    ? "Click cards to mark for mulligan. Marked cards go to the bottom; replacements come off the top."
                    : `${remaining.length} cards left in deck.`}
                </span>
              </div>
              <div class="mulligan-hand">
                ${hand.map(renderCard)}
              </div>
              <div style=${{display:"flex",gap:8,marginTop:18,alignItems:"center",flexWrap:"wrap"}}>
                ${phase === "initial"
                  ? html`<button class="active" onClick=${applyMulligan}
                      style=${{padding:"8px 18px",fontSize:13}}
                      title=${mulliganSet.size === 0 ? "Keep this opening hand" : `Mulligan ${mulliganSet.size} card${mulliganSet.size===1?"":"s"}`}>
                      ${mulliganSet.size === 0 ? "✓ Keep hand" : `↻ Mulligan ${mulliganSet.size}`}
                    </button>`
                  : html`<span style=${{fontSize:12,color:"var(--green)",fontWeight:600}}>✓ Hand locked in</span>`}
                <button onClick=${reshuffle} style=${{padding:"8px 16px",fontSize:13}}
                  title="Reshuffle the deck and draw a fresh opening hand">
                  🔀 Go again
                </button>
              </div>
            </div>`}
      </div>
    </div>
  </div>`;
};

// "Artist Alley" — pick an artist, get a downloadable PNG showing every card
// they illustrated. Lays out card images on an off-screen canvas with a header
// banner, then serves the PNG as a download. Loading images with
// crossOrigin="anonymous" works because the Lorcast CDN serves the correct
// CORS headers; tainted-canvas exports would silently fail otherwise.
const ArtistAlleyModal = ({allIllustrators, raw, onClose}) => {
  const [query, setQuery] = useState("");
  const [picked, setPicked] = useState(null);
  const [error, setError] = useState(null);

  // Group raw -> one entry per card_id for the picked artist. Dedupe across
  // printings (Normal + Foil refer to the same card).
  const cardsForArtist = useMemo(() => {
    if(!picked) return [];
    const seen = new Set();
    const out = [];
    for(const r of raw){
      if(!r.card_id || seen.has(r.card_id)) continue;
      const ills = r.illustrators || [];
      if(!ills.some(n => (n||"").toLowerCase() === picked.toLowerCase())) continue;
      const img = r.img_large || r.img_normal || r.img_small;
      if(!img) continue;
      seen.add(r.card_id);
      out.push({name:r["Product Name"], set:r.Set, number:r.Number, img});
    }
    // Group by set newest-first, then collector number ascending.
    out.sort((a,b) => {
      const sa = SET_ORDER.indexOf(a.set), sb = SET_ORDER.indexOf(b.set);
      if(sa !== sb) return sb - sa;
      const na = parseInt((a.number+"").replace(/\D/g,""),10) || 0;
      const nb = parseInt((b.number+"").replace(/\D/g,""),10) || 0;
      return na - nb;
    });
    return out;
  }, [picked, raw]);

  const filteredArtists = useMemo(() => {
    if(!allIllustrators) return [];
    const q = query.trim().toLowerCase();
    return q ? allIllustrators.filter(n => n.toLowerCase().includes(q)) : allIllustrators;
  }, [allIllustrators, query]);

  // Open a self-contained poster window. Plain <img> tags render without
  // needing CORS, so this sidesteps the canvas-taint issue Lorcast's CDN
  // would otherwise cause. The user uses the browser's "Save as PDF" from
  // the print dialog to get a downloadable PDF.
  const openPoster = useCallback(() => {
    if(!picked || !cardsForArtist.length) return;
    setError(null);
    const w = window.open("", "_blank");
    if(!w){
      setError("Pop-up blocked. Allow pop-ups for this site, then try again.");
      return;
    }
    const safeArtist = picked.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    // Route Lorcast art through /img-proxy/* so html2canvas (used by the
    // "Copy as Image" button) can read pixels without canvas-taint. The
    // proxy is same-origin (Netlify _redirects in prod, dev_server.py
    // locally), and it sends Access-Control-Allow-Origin: * so crossOrigin
    // works on the <img> too.
    const proxify = (url) => (typeof url === "string" && url.startsWith("https://cards.lorcast.io/"))
      ? "/img-proxy/" + url.slice("https://cards.lorcast.io/".length)
      : url;
    const tiles = cardsForArtist.map(c => `
      <figure>
        <img src="${proxify(c.img)}" crossorigin="anonymous"
          alt="${c.name.replace(/"/g,"&quot;")}" loading="eager"/>
        <figcaption>${c.set} · #${c.number||""}</figcaption>
      </figure>`).join("");
    const doc = `<!doctype html><html><head>
      <meta charset="utf-8"/>
      <title>Artist Alley — ${safeArtist}</title>
      <style>
        :root{color-scheme:dark;}
        *{box-sizing:border-box;
          -webkit-print-color-adjust:exact;print-color-adjust:exact;}
        body{margin:0;padding:36px 44px;background:linear-gradient(180deg,#1a1334,#0d0a1f);
          color:#fff;font-family:'Nunito Sans',system-ui,sans-serif;min-height:100vh;}
        header{display:flex;align-items:flex-end;justify-content:space-between;
          margin-bottom:24px;gap:20px;flex-wrap:wrap;}
        h1{font-size:48px;margin:0;font-weight:800;letter-spacing:-0.5px;line-height:1;}
        h2{font-size:28px;margin:4px 0 0;font-weight:500;color:#c4b5fd;line-height:1.1;}
        .meta{font-size:14px;color:rgba(255,255,255,0.6);text-align:right;line-height:1.5;}
        .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
        figure{margin:0;display:flex;flex-direction:column;gap:6px;
          /* Don't split a card across page boundaries when printing. */
          break-inside:avoid;page-break-inside:avoid;}
        figure img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:10px;
          box-shadow:0 6px 16px rgba(0,0,0,0.35);background:rgba(255,255,255,0.04);}
        figcaption{font-size:11px;color:rgba(255,255,255,0.55);text-align:center;
          font-variant-numeric:tabular-nums;}
        .actions{position:fixed;bottom:20px;right:20px;display:flex;gap:8px;z-index:10;}
        .actions button{padding:10px 18px;font-size:13px;font-weight:600;border-radius:8px;
          border:1px solid rgba(255,255,255,0.2);background:#7c3aed;color:#fff;cursor:pointer;
          font-family:inherit;}
        .actions button.secondary{background:rgba(255,255,255,0.1);}
        /* Print: preserve the dark poster look (no white-background flip).
           Chromium / Edge / modern Safari honor color-adjust:exact and render
           background gradients + drop-shadows in the saved PDF. Spreading
           across multiple pages is fine; the break-inside guard on figures
           keeps individual cards intact across page splits. */
        @media print{
          @page{margin:0;size:letter portrait;}
          body{padding:28px 32px;background:linear-gradient(180deg,#1a1334,#0d0a1f);
            color:#fff;min-height:auto;}
          h1{font-size:44px;}
          h2{font-size:26px;color:#c4b5fd;}
          figcaption{color:rgba(255,255,255,0.55);}
          .actions{display:none;}
          header{break-after:avoid;margin-bottom:18px;}
          /* Pin print grid to 6 cols explicitly — the print preview's
             ~816px viewport (8.5in × 96dpi) would otherwise match the
             max-width:900px screen rule and drop to 4 cols. */
          .grid{grid-template-columns:repeat(6,1fr) !important;gap:10px;}
          figcaption{font-size:9px;}
        }
        @media screen and (max-width:900px){
          .grid{grid-template-columns:repeat(4,1fr);}
        }
      </style>
    </head><body>
      <header>
        <div>
          <h1>Artist Alley</h1>
          <h2>${safeArtist}</h2>
        </div>
        <div class="meta">
          ${cardsForArtist.length} card${cardsForArtist.length===1?"":"s"}<br/>
          packs.ink
        </div>
      </header>
      <div class="grid">${tiles}</div>
      <div class="actions">
        <button id="copy-img-btn" onclick="copyAsImage()" title="Copy the entire poster to your clipboard as one tall PNG">📋 Copy as Image</button>
        <button id="save-img-btn" onclick="saveAsImage()" title="Download the entire poster as a single JPG (well under 10 MB so Discord accepts it)">💾 Save JPG</button>
        <button onclick="window.print()" title="Open the print dialog, then choose 'Save as PDF' as the destination">🖨 Save as PDF</button>
        <button class="secondary" onclick="window.close()">Close</button>
      </div>
      <div id="toast" style="position:fixed;bottom:80px;right:20px;padding:10px 16px;
        background:rgba(124,58,237,0.95);color:#fff;font-size:13px;font-weight:600;
        border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.3);
        opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:11;"></div>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        crossorigin="anonymous"><\/script>
      <script>
        const TOAST = document.getElementById('toast');
        const showToast = (msg, ms = 2000) => {
          TOAST.textContent = msg; TOAST.style.opacity = '1';
          setTimeout(() => { TOAST.style.opacity = '0'; }, ms);
        };
        // Render the whole poster as one tall canvas. Waits for every <img>
        // to finish loading first — otherwise html2canvas paints empty boxes
        // for any image that hasn't decoded yet.
        const renderPosterCanvas = async () => {
          const imgs = Array.from(document.querySelectorAll('figure img'));
          await Promise.all(imgs.map(img => img.complete
            ? Promise.resolve()
            : new Promise(res => { img.onload = img.onerror = res; })));
          if(!window.html2canvas) throw new Error('html2canvas failed to load');
          // Adaptive scale: short posters can use full 2× for sharpness, but
          // tall posters (40+ cards) blow past Discord's 10 MB cap unless we
          // render at lower density. Target ~6-8 megapixels total — JPEG of
          // that size at q=0.85 comfortably lands under 10 MB.
          const bodyH = document.body.scrollHeight;
          const bodyW = document.body.scrollWidth || 1200;
          // Output canvas pixels = (bodyW*scale) × (bodyH*scale). We want
          // the resulting megapixel count near targetMP so JPEG q=0.85
          // lands well under Discord's 10 MB cap regardless of card count.
          const targetMP = 7;
          const naturalMP = (bodyW * bodyH) / 1e6;
          let scale = Math.sqrt(targetMP / Math.max(0.1, naturalMP));
          if(scale > 2) scale = 2;
          if(scale < 1) scale = 1;
          return await window.html2canvas(document.body, {
            useCORS: true,
            backgroundColor: '#0d0a1f',
            scale: scale,
            logging: false,
            // Skip the floating action bar + toast so the captured PNG is just the poster.
            ignoreElements: (el) => {
              if(!el || !el.classList) return false;
              return el.classList.contains('actions') || el.id === 'toast';
            },
          });
        };
        // JPEG quality 0.92 keeps card art sharp but yields ~1-3 MB on the
        // typical poster — well under Discord's 10 MB free-tier upload cap.
        // PNG of the same canvas would be 15-30 MB and unsendable. Quality
        // tuned to be visually indistinguishable from PNG on card photos.
        const JPEG_QUALITY = 0.85;
        const DISCORD_BUDGET = 9.5 * 1048576; // leave headroom under 10 MB cap
        const canvasToBlob = (canvas, type, quality) => new Promise((res, rej) =>
          canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), type, quality));
        // Encode JPEG; if it overshoots Discord's cap, retry at progressively
        // lower quality until it fits (or we bottom out at q=0.55).
        const encodeJpegUnderBudget = async (canvas) => {
          for(const q of [JPEG_QUALITY, 0.78, 0.7, 0.62, 0.55]){
            const b = await canvasToBlob(canvas, 'image/jpeg', q);
            if(b.size <= DISCORD_BUDGET) return b;
          }
          // Give up — return the smallest version we produced (q=0.55).
          return await canvasToBlob(canvas, 'image/jpeg', 0.55);
        };
        async function copyAsImage(){
          const btn = document.getElementById('copy-img-btn');
          btn.disabled = true; btn.textContent = '⏳ Rendering…';
          try {
            if(!navigator.clipboard || !window.ClipboardItem){
              throw new Error('Clipboard image copy not supported in this browser — try Save instead.');
            }
            const canvas = await renderPosterCanvas();
            // Try JPEG first (small file). Some browsers (older Safari) reject
            // image/jpeg in ClipboardItem — fall back to PNG for those.
            try {
              const jpg = await encodeJpegUnderBudget(canvas);
              try { window.focus(); } catch {}
              await navigator.clipboard.write([new ClipboardItem({'image/jpeg': jpg})]);
              const mb = (jpg.size / 1048576).toFixed(1);
              showToast('Poster copied (' + mb + ' MB)');
            } catch(jpegErr) {
              const png = await canvasToBlob(canvas, 'image/png');
              try { window.focus(); } catch {}
              await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
              const mb = (png.size / 1048576).toFixed(1);
              showToast('Poster copied as PNG (' + mb + ' MB)');
            }
          } catch(e) {
            showToast('Copy failed: ' + (e && e.message || e), 4000);
          } finally {
            btn.disabled = false; btn.textContent = '📋 Copy as Image';
          }
        }
        async function saveAsImage(){
          const btn = document.getElementById('save-img-btn');
          btn.disabled = true; btn.textContent = '⏳ Rendering…';
          try {
            const canvas = await renderPosterCanvas();
            const blob = await encodeJpegUnderBudget(canvas);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safe = (s) => String(s||'artist').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g,'');
            a.href = url;
            a.download = 'packsink-artist-alley-' + safe(${JSON.stringify(picked)}) + '.jpg';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            const mb = (blob.size / 1048576).toFixed(1);
            showToast('Poster saved (' + mb + ' MB)');
          } catch(e) {
            showToast('Save failed: ' + (e && e.message || e), 4000);
          } finally {
            btn.disabled = false; btn.textContent = '💾 Save JPG';
          }
        }
      <\/script>
    </body></html>`;
    w.document.open();
    w.document.write(doc);
    w.document.close();
  }, [picked, cardsForArtist]);

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal artist-alley-modal" onClick=${e=>e.stopPropagation()}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Artist Alley</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:16}}>
        ${!picked && html`<div>
          <p class="muted" style=${{fontSize:12,margin:"0 0 12px"}}>
            Pick an artist to generate a downloadable poster of every card they illustrated.
          </p>
          <input type="search" placeholder="Find an artist…"
            value=${query} onInput=${e=>setQuery(e.target.value)}
            style=${{width:"100%",padding:"8px 12px",border:"1px solid var(--btn-border)",
              borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13,
              marginBottom:12,fontFamily:"'Nunito Sans',sans-serif"}}/>
          <div style=${{maxHeight:340,overflowY:"auto",display:"flex",flexWrap:"wrap",gap:6}}>
            ${filteredArtists.length === 0
              ? html`<div class="muted" style=${{fontSize:12,padding:"20px 0"}}>
                  ${allIllustrators?.length
                    ? "No artists match that search."
                    : "Artist data isn't loaded yet. Run scripts/load_lorcast.py after applying supabase/31_card_illustrators.sql."}
                </div>`
              : filteredArtists.map(n => html`<button key=${n} class="chip"
                  onClick=${()=>setPicked(n)}>${n}</button>`)}
          </div>
        </div>`}
        ${picked && html`<div>
          <div style=${{display:"flex",alignItems:"baseline",gap:10,marginBottom:12}}>
            <h3 style=${{margin:0,fontSize:16}}>${picked}</h3>
            <span class="muted" style=${{fontSize:12}}>
              ${cardsForArtist.length} card${cardsForArtist.length===1?"":"s"}
            </span>
            <button class="settings-action link" style=${{marginLeft:"auto"}}
              onClick=${()=>{setPicked(null); setError(null);}}>← Pick another artist</button>
          </div>
          ${cardsForArtist.length === 0
            ? html`<div class="muted" style=${{fontSize:12,padding:"20px 0"}}>
                No cards found for this artist in the catalog.</div>`
            : html`<div>
                <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(80px, 1fr))",
                  gap:6, maxHeight:340, overflowY:"auto", marginBottom:14,
                  padding:8, background:"var(--bg-surface)", borderRadius:6}}>
                  ${cardsForArtist.map(c => html`<img key=${c.name+c.number+c.set} src=${c.img}
                    style=${{width:"100%",aspectRatio:"5/7",objectFit:"cover",borderRadius:4}}
                    title=${c.name+" · "+c.set+" #"+c.number}/>`)}
                </div>
                <div style=${{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <button class="active" onClick=${openPoster}
                    style=${{padding:"8px 18px",fontSize:13}}>
                    Open Poster (Save as PDF)
                  </button>
                  <span class="muted" style=${{fontSize:11,lineHeight:1.4}}>
                    Opens in a new tab. Use your browser's print dialog to save as PDF or print.
                  </span>
                </div>
              </div>`}
          ${error && html`<div style=${{padding:"12px 0",color:"var(--red)",fontSize:12}}>${error}</div>`}
        </div>`}
      </div>
    </div>
  </div>`;
};

// Shared card-browser UI used by the Cards tab + the deck builder. Owns
// the filter / sort / search / drawer state and the responsive grid.
//   - onSelectGroup(g): called when a tile's image is clicked (opens modal)
//   - deckQty(g) / onDeckQtyChange(g, n): optional, enables the +/- counter
//     overlay used by the deck builder.
// Stable references on these callbacks let React.memo on CardTile skip
// unchanged tiles when filters change.
const CardBrowser = ({raw, onSelectGroup, collection, deckQty, onDeckQtyChange,
                      sortDefault="set-new",
                      selectable, isAuthed, onSignIn,
                      onBulkAddCollection, onBulkAddToDeck, onBulkNewDeck, fetchUserDecks,
                      pendingSearch, onConsumedPendingSearch}) => {
  const [filter,setFilter] = useState(emptyFilter);
  // Apply a search string handed in from outside (the home page quick-search
  // bar uses this so opening Cards via the search bar lands with the query
  // already in the smart-search box).
  useEffect(() => {
    if(pendingSearch == null) return;
    setFilter(f => ({...f, search: pendingSearch}));
    onConsumedPendingSearch && onConsumedPendingSearch();
  }, [pendingSearch, onConsumedPendingSearch]);
  const [drawerOpen,setDrawerOpen] = useState(false);
  const [artistAlleyOpen, setArtistAlleyOpen] = useState(false);
  const [sortKey,setSortKey] = useState(sortDefault);
  // Grid (image tiles) vs List (compact rows). Persisted per session in
  // localStorage so toggling once sticks across page navigation.
  const [viewMode, setViewMode] = useState(() => {
    try { return localStorage.getItem("packsink:cardBrowser:view") || "grid"; }
    catch { return "grid"; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:cardBrowser:view", viewMode); } catch {}
  }, [viewMode]);
  // Defer the heavy filter+sort pipeline so chip/input clicks remain
  // responsive even when the resulting render touches 1500 tiles. The
  // toolbar reads the live `filter` (chip active class flips instantly),
  // while `grouped` reads the deferred copy — React.18 can interrupt the
  // big render to process subsequent input events.
  // Smart-search chips: locked filters added by clicking a suggestion in the
  // dropdown. Each chip is one of {kind: ink|rarity|set|classification|
  // card_type|keyword|inkable|contains, value}. Filtering merges these with
  // whatever's currently being parsed from the input text.
  const [smartChips, setSmartChips] = useState([]);
  const addSmartChip = useCallback((chip) => {
    setSmartChips(prev => {
      // Avoid exact duplicates of (kind, value).
      if(prev.some(c => c.kind === chip.kind && String(c.value) === String(chip.value))) return prev;
      return [...prev, chip];
    });
  }, []);
  const removeSmartChip = useCallback((idx) => {
    setSmartChips(prev => prev.filter((_, i) => i !== idx));
  }, []);
  const deferredFilter = React.useDeferredValue(filter);
  const parsedFromInput = useMemo(()=>parseSearchQuery(deferredFilter.search||""), [deferredFilter.search]);
  // Merge chip filters onto the parsed object. Chips win over input for the
  // same dimension since they were explicitly locked in.
  const parsed = useMemo(() => {
    const p = {
      name: parsedFromInput.name,
      filters: {...parsedFromInput.filters},
      excludeRarities: new Set(parsedFromInput.excludeRarities),
    };
    const containsTokens = [];
    for(const chip of smartChips){
      if(chip.kind === "ink")            p.filters.ink = chip.value;
      else if(chip.kind === "rarity")    p.filters.rarity = chip.value;
      else if(chip.kind === "set")       p.filters.set = chip.value;
      else if(chip.kind === "card_type") p.filters.card_type = chip.value;
      else if(chip.kind === "classification") p.filters.classification = chip.value;
      else if(chip.kind === "keyword")   p.filters.ability_keyword = chip.value;
      else if(chip.kind === "inkable")   p.filters.inkable = chip.value;
      else if(chip.kind === "cost")      p.filters.cost = chip.value;
      else if(chip.kind === "legality")  p.filters.legality = chip.value;
      else if(chip.kind === "illustrator") p.filters.illustrator = chip.value;
      else if(chip.kind === "contains")  containsTokens.push(chip.value);
    }
    if(containsTokens.length){
      p.name = (p.name ? p.name + " " : "") + containsTokens.join(" ");
    }
    return p;
  }, [parsedFromInput, smartChips]);
  // Pre-group ALL cards once per `raw`. Every filter dimension (ink, cost,
  // rarity, set, inkable, name, etc.) applies uniformly to a card's
  // printings, so we can filter the *groups* downstream and keep their
  // object references stable across filter changes — letting React.memo on
  // CardTile actually short-circuit unchanged tiles.
  const allGroups = useMemo(() => groupCards(raw), [raw]);
  const grouped = useMemo(()=>{
    let groups = allGroups.filter(g => matchesCardFilter(g, deferredFilter, parsed));
    // "Only show cards in my collection" toggle. A group qualifies if the
    // user owns >=1 of either its Normal or Foil printing. Collection map is
    // keyed by `card_id:tcg_printing` (see CollectionView).
    if(deferredFilter.onlyOwned && collection){
      groups = groups.filter(g => {
        const nKey = g.normal ? g.card_id + ":" + g.normal.tcg_printing : null;
        const fKey = g.foil   ? g.card_id + ":" + g.foil.tcg_printing   : null;
        return (nKey && collection[nKey] > 0) || (fKey && collection[fKey] > 0);
      });
    }
    const cmp = SORT_COMPARATORS[sortKey] || SORT_COMPARATORS["set-new"];
    return groups.slice().sort(cmp);
  },[allGroups, deferredFilter, parsed, sortKey, collection]);
  const isFiltering = filter !== deferredFilter;
  const parsedSummary = useMemo(()=>summarizeParsedQuery(parsed), [parsed]);
  const setsByGroup = useMemo(()=>groupSetsForFilter(raw),[raw]);
  // Unique illustrator names across the catalog (sorted, deduped) for the
  // Artist filter list and smart-search suggestions. Empty when the column
  // hasn't been backfilled — the drawer surfaces a hint in that case.
  const allIllustrators = useMemo(() => {
    const s = new Set();
    for(const r of raw){
      const ills = r.illustrators;
      if(!Array.isArray(ills)) continue;
      for(const n of ills){ if(n) s.add(n); }
    }
    return Array.from(s).sort((a,b) => a.localeCompare(b));
  }, [raw]);
  const activeCount = countActiveFilters(filter);

  // Multi-select. Kept as a Set of card_ids so the selection persists
  // across filter changes (the user can stack a few from one filter, then
  // change filters and add more without losing anything). Disabled when
  // CardBrowser is being used inside the deck editor (deckMode) — the
  // ± counter UX already covers that case.
  const deckMode = typeof onDeckQtyChange === "function";
  const allowSelect = !!selectable && !deckMode;
  const [selected, setSelected] = useState(() => new Set());
  const toggleSelected = useCallback((cardId) => {
    setSelected(prev => {
      const next = new Set(prev);
      if(next.has(cardId)) next.delete(cardId); else next.add(cardId);
      return next;
    });
  }, []);
  const clearSelection = useCallback(() => setSelected(new Set()), []);
  const selectAllVisible = useCallback(() => {
    setSelected(prev => {
      const next = new Set(prev);
      for(const g of grouped) if(g.card_id) next.add(g.card_id);
      return next;
    });
  }, [grouped]);

  // Action dropdown state — what's open, and the cached deck list for the
  // "Add to existing deck" submenu.
  const [actionMenu, setActionMenu] = useState(null); // null | "root" | "deckPicker"
  const [userDecks, setUserDecks] = useState(null);
  const [pickerLoading, setPickerLoading] = useState(false);
  const actionRef = useRef(null);
  useEffect(() => {
    if(!actionMenu) return;
    const onDoc = (e) => {
      if(actionRef.current && !actionRef.current.contains(e.target)) setActionMenu(null);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [actionMenu]);
  const openDeckPicker = useCallback(async () => {
    setActionMenu("deckPicker");
    if(userDecks != null) return;
    setPickerLoading(true);
    try {
      const decks = (typeof fetchUserDecks === "function") ? await fetchUserDecks() : [];
      setUserDecks(decks);
    } finally { setPickerLoading(false); }
  }, [userDecks, fetchUserDecks]);

  // Suggestion dropdown state.
  const [suggestOpen, setSuggestOpen] = useState(false);
  // -1 = no suggestion is "armed" for Enter. Becomes >=0 only when the user
  // explicitly arrow-keys or mouse-hovers onto a suggestion. Without this,
  // Enter would auto-pick suggestion 0 every time, converting fuzzy queries
  // like "elsa spirit" into a strict 'contains' filter the user didn't ask for.
  const [suggestIdx, setSuggestIdx] = useState(-1);
  const suggestions = useMemo(()=>buildSearchSuggestions(filter.search||"", allIllustrators), [filter.search, allIllustrators]);
  const applySuggestion = useCallback((sug) => {
    if(!sug) return;
    if(sug.kind === "contains"){
      // "contains:" commits the whole input as a name-search chip.
      addSmartChip({kind:"contains", value:sug.value});
      setFilter(f=>({...f, search:""}));
    } else {
      addSmartChip({kind:sug.kind, value:sug.value});
      // Strip the matched token(s) from the input so the user can keep
      // typing. Two-token keywords (e.g. "puppy shift") drop both.
      const drop = sug.isTwoToken ? 2 : 1;
      setFilter(f=>{
        const txt = f.search||"";
        const tokens = txt.split(/(\s+)/);
        let removed = 0;
        for(let i=tokens.length-1; i>=0 && removed < drop; i--){
          if(tokens[i].trim().length){
            tokens.splice(i, 1);
            removed++;
          }
        }
        while(tokens.length && !tokens[tokens.length-1].trim()) tokens.pop();
        return {...f, search: tokens.join("")};
      });
    }
    setSuggestIdx(-1);
    setSuggestOpen(false);
  }, [addSmartChip]);

  return html`<div>

          onInput=${e=>{ setFilter(f=>({...f,search:e.target.value})); setSuggestIdx(-1); setSuggestOpen(true); }}
          onKeyDown=${e=>{

              return;

            if(e.key === "ArrowDown"){ e.preventDefault(); setSuggestIdx(i => i < 0 ? 0 : (i+1) % suggestions.length); }
            else if(e.key === "ArrowUp"){ e.preventDefault(); setSuggestIdx(i => i < 0 ? suggestions.length-1 : (i-1+suggestions.length) % suggestions.length); }
            else if(e.key === "Enter"){
              // Only apply a suggestion if the user explicitly armed one via
              // arrow/hover. Otherwise commit the typed query as-is so fuzzy
              // matching can take over.
              if(suggestIdx >= 0 && suggestions[suggestIdx]){
                e.preventDefault();
                applySuggestion(suggestions[suggestIdx]);
              } else {

            }

        ${suggestOpen && suggestions.length > 0 && html`<div class="smart-suggest-pop">

const CardsView = ({raw, sets, theme, user, collection, updateQty, onSignIn, openDeckById,
                    incomingSearch, incomingOpenCardId, onConsumedIncomingCardsSearch}) => {
  const [selectedGroup,setSelectedGroup] = useState(null);
  // Home-page quick-search handoff: pre-seed the smart-search and (when set)
  // open the chosen card's detail modal once `raw` is loaded.
  const [pendingSearch, setPendingSearch] = useState(null);
  useEffect(() => {
    if(incomingSearch == null && incomingOpenCardId == null) return;
    setPendingSearch(incomingSearch || "");
    if(incomingOpenCardId && raw && raw.length){
      // Build a fully-populated "group" via the canonical groupCards()
      // helper so every CardDetailModal subsection (normal + foil rows,
      // price compares, ownership counters) renders correctly. Same path
      // the Pack/Box sims + Playset rows use.
      const row = raw.find(r => r.card_id === incomingOpenCardId);
      if(row && row.tcgplayer_product_id){
        const g = groupFromSimCard(row, raw);
        if(g) setSelectedGroup(g);
      }
    }
    onConsumedIncomingCardsSearch && onConsumedIncomingCardsSearch();
  }, [incomingSearch, incomingOpenCardId, raw, onConsumedIncomingCardsSearch]);
  // Stable click handler so React.memo on CardTile can actually skip
  // unchanged tiles when filters change. Without useCallback the handler
  // identity changes every parent render, busting the memo.
  const openGroup = useCallback((g) => setSelectedGroup(g), []);
  // Toast for ephemeral confirmation after bulk actions.
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  }, []);
  // Build a card_id -> first-row index so we can find the canonical
  // tcg_printing key for each selected card without scanning raw on
  // every action.
  const rowByCardId = useMemo(() => {
    const m = new Map();
    for(const r of raw){
      if(!r.card_id || m.has(r.card_id)) continue;
      // Prefer the Normal printing when one exists for this card_id.
      m.set(r.card_id, r);
    }
    // Second pass: if a card has a Normal printing in raw, swap it in.
    for(const r of raw){
      if(!r.card_id) continue;
      const cur = m.get(r.card_id);
      if(cur && cur.tcg_printing !== "Normal" && r.tcg_printing === "Normal"){
        m.set(r.card_id, r);
      }
    }
    return m;
  }, [raw]);

  // Bulk: add each selected card to the collection. Normal printing when
  // available, foil otherwise.
  const onBulkAddCollection = useCallback(async (cardIds) => {
    if(!user){ onSignIn && onSignIn(); return; }
    let added = 0;
    for(const id of cardIds){
      const row = rowByCardId.get(id);
      if(!row || !row.tcg_printing) continue;
      const key = id + ":" + row.tcg_printing;
      const cur = (collection && collection[key]) || 0;
      updateQty(key, cur + 1);
      added++;
    }
    showToast(`Added ${added} card${added===1?"":"s"} to your collection.`);
  }, [user, onSignIn, collection, updateQty, rowByCardId, showToast]);

  // Bulk: start a new deck pre-seeded with the selected cards, then jump
  // to the editor for that deck.
  const onBulkNewDeck = useCallback(async (cardIds) => {
    if(!user){ onSignIn && onSignIn(); return; }
    try {
      const {data: deckRow, error} = await sbClient.from("decks")
        .insert({user_id: user.id, name: "New Deck from Cards"})
        .select("id").single();
      if(error) throw error;
      const rows = [];
      for(const id of cardIds){
        const row = rowByCardId.get(id);
        if(!row || !row.tcg_printing) continue;
        rows.push({deck_id: deckRow.id, card_id: id, printing: row.tcg_printing, quantity: 1});
      }
      if(rows.length){
        const ins = await sbClient.from("deck_cards").insert(rows);
        if(ins.error) throw ins.error;
      }
      openDeckById && openDeckById(deckRow.id);
    } catch(e){
      console.error("new deck from selection failed:", e);
      alert("Couldn't create deck: " + (e.message || String(e)));
    }
  }, [user, onSignIn, rowByCardId, openDeckById]);

  // Bulk: add the selection to an existing deck. The caller (CardBrowser's
  // popover) gives us the deck id; we upsert one row per card, summing the
  // quantity if the row already exists (deck_cards uses a composite PK on
  // deck_id+card_id+printing).
  const onBulkAddToDeck = useCallback(async (cardIds, deckId, deckName) => {
    if(!user || !deckId){ return; }
    try {
      // Pre-fetch existing rows in that deck so we can compute new quantities.
      const {data: existing, error: e1} = await sbClient.from("deck_cards")
        .select("card_id,printing,quantity").eq("deck_id", deckId);
      if(e1) throw e1;
      const have = new Map();
      for(const r of (existing || [])) have.set(r.card_id+":"+r.printing, r.quantity || 0);
      const upserts = [];
      for(const id of cardIds){
        const row = rowByCardId.get(id);
        if(!row || !row.tcg_printing) continue;
        const k = id + ":" + row.tcg_printing;
        const cur = have.get(k) || 0;
        // Cap at the card's deck limit (4 for most cards, 99 for Dalmatian
        // Puppy variants, Microbots is uncapped but UI-capped at 99).
        const cap = getDeckLimit(row["Product Name"]);
        const target = Math.min(cap === Infinity ? 99 : cap, cur + 1);
        if(target === cur) continue;
        upserts.push({deck_id: deckId, card_id: id, printing: row.tcg_printing, quantity: target});
      }
      if(upserts.length){
        const {error: e2} = await sbClient.from("deck_cards")
          .upsert(upserts, {onConflict: "deck_id,card_id,printing"});
        if(e2) throw e2;
      }
      // Touch the deck's updated_at so it reorders correctly.
      await sbClient.from("decks").update({updated_at: new Date().toISOString()}).eq("id", deckId);
      showToast(`Added ${upserts.length} card${upserts.length===1?"":"s"} to "${deckName}".`);
    } catch(e){
      console.error("add to deck failed:", e);
      alert("Couldn't add to deck: " + (e.message || String(e)));
    }
  }, [user, rowByCardId, showToast]);

  // Lazy-fetch the user's decks for the "Add to existing deck" picker.
  const fetchUserDecks = useCallback(async () => {
    if(!user) return [];
    const {data, error} = await sbClient.from("decks")
      .select("id,name,visibility,updated_at")
      .eq("user_id", user.id)
      .order("updated_at", {ascending:false});
    if(error){ console.warn("fetch user decks failed:", error.message); return []; }
    return data || [];
  }, [user]);

  return html`<div>
    <${CardBrowser} raw=${raw} onSelectGroup=${openGroup} collection=${collection}
      selectable=${true}
      isAuthed=${!!user}
      onSignIn=${onSignIn}
      onBulkAddCollection=${onBulkAddCollection}
      onBulkNewDeck=${onBulkNewDeck}
      onBulkAddToDeck=${onBulkAddToDeck}
      fetchUserDecks=${fetchUserDecks}
      pendingSearch=${pendingSearch}
      onConsumedPendingSearch=${() => setPendingSearch(null)}/>
    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
    ${toast && html`<div class="cards-toast">${toast}</div>`}
  </div>`;
};

const Footer = ({lastEtlDate, lastRawPriceDate})=>{
  // Warn when the daily ETL hasn't refreshed prices on schedule. Anchor
  // to 21:00 UTC of the snapshot date (when the cron actually runs) plus
  // a 30h grace window — covers the natural "cron is running / TCGCSV is
  // late to publish" transition window so the pill doesn't flap red right
  // at the next cron's start time. Fires when we're > 6h past when the
  // next expected snapshot should have landed.
  const stale = lastEtlDate
    ? (Date.now() - new Date(lastEtlDate + "T21:00:00Z").getTime()) > 30*3600*1000
    : false;
  // SEPARATE warning: prices_daily has a newer date than card_prices_latest.
  // Means today's ETL wrote raw rows but the matview refresh failed silently
  // — the site is currently serving yesterday's prices despite today's being
  // in the database. This is a distinct failure mode from "ETL didn't run."
  const matviewLag = lastEtlDate && lastRawPriceDate && lastRawPriceDate > lastEtlDate;
  return html`<div class="footer">
    <div class="footer-text">
      <div class="footer-social">
        follow <a href="https://x.com/packs_ink" target="_blank" rel="noopener">@packs_ink</a>
        · <a href="https://x.com/HighScoreZAP" target="_blank" rel="noopener">@HighScoreZAP</a>
        · <a href="/privacy">Privacy</a>
      </div>
      ${stale && html`<div class="footer-stale" title=${"Last successful ETL on " + lastEtlDate + " (your local time). The daily price refresh may be failing — check the ETL cron."}>
        ⚠ Prices may be stale (last update ${relativeTime(lastEtlDate)})
      </div>`}
      ${matviewLag && !stale && html`<div class="footer-stale"
        title=${"prices_daily has " + lastRawPriceDate + " but card_prices_latest only has " + lastEtlDate + ". Refresh the matview to recover."}>
        ⚠ Display layer is behind raw data (${lastEtlDate} vs ${lastRawPriceDate}) — run refresh_card_prices_latest()
      </div>`}
    </div>
    <img class="footer-logo" src=${LOGO_B64} alt="Ink & Lore"/>
  </div>`;
};

// ── Views ──────────────────────────────────────────────────────────────
// EV time windows mirror the home-page movers banners so users see the same
// vocabulary for "how has this changed" everywhere on the site. Labels match
// MOVER_WINDOWS exactly (1D / 1W / 1M / 3M / 6M / 1Y).
const EV_WINDOWS = [
  ["1D",  1,   "1 day"],
  ["1W",  7,   "1 week"],
  ["1M",  30,  "1 month"],
  ["3M",  90,  "3 months"],
  ["6M",  180, "6 months"],
  ["1Y",  365, "1 year"],
];
function EVView({raw, sets, avgs, nc, setNc,
                excludeEnchanted, setExcludeEnchanted, excludeIconic, setExcludeIconic, excludeRars,
                priceMode, setPriceMode, openSetHistory, sealedPrices}){
  const useMarket = priceMode === "market";
  const ne = !!(excludeEnchanted && excludeIconic);
  const setExcludeBoth = (v) => { setExcludeEnchanted(!!v); setExcludeIconic(!!v); };
  // Per-set Booster Box lookup. A set typically has the box itself plus a
  // "Booster Box Case" SKU (12-box case). We want the single-box price, so
  // exclude anything with "case" in the name. If multiple boxes remain (rare),
  // pick the cheapest as the canonical "what the consumer actually pays".
  const boxBySetId = useMemo(() => {
    const out = {};
    if(!sealedPrices) return out;
    for(const row of sealedPrices){
      if(!row.set_id) continue;
      if(row.product_type !== "Booster Box") continue;
      const nm = (row.name || "").toLowerCase();
      if(nm.includes("case")) continue;
      const price = useMarket ? row.market_price : row.low_price;
      if(price == null) continue;
      const prev = out[row.set_id];
      if(!prev || prev.price > price){
        out[row.set_id] = {
          price: parseFloat(price),
          name: row.name,
          url: tcgUrl(row.tcgplayer_product_id),
          productId: row.tcgplayer_product_id,
        };
      }
    }
    return out;
  }, [sealedPrices, useMarket]);
  // Map set name -> set_id once, so we can index historical rows (which key
  // by set_id) back to the set name we render in the row label.
  const setIdByName = useMemo(()=>{
    const m = {};
    for(const r of raw){
      if(r.Set && r.set_id && !m[r.Set]) m[r.Set] = r.set_id;
    }
    return m;
  }, [raw]);

  // Historical fetch: find the latest date in rarity_avg_daily, then pull
  // rows for exactly the dates we need (today, -1d, -7d, ..., -365d). One
  // round-trip after the latest-date probe; ~1100 rows total.
  const [hist, setHist] = useState({status:"loading", byDateSet:null, latest:null});
  useEffect(()=>{
    let cancelled = false;
    (async () => {
      try {
        const probe = await sbClient.from("rarity_avg_daily")
          .select("date").order("date", {ascending:false}).limit(1);
        if(cancelled) return;
        if(probe.error) throw probe.error;
        const latestRows = probe.data || [];
        if(!latestRows.length){ setHist({status:"empty"}); return; }
        const latest = latestRows[0].date;
        const base = new Date(latest + "T00:00:00Z");
        const fmtDate = d => d.toISOString().slice(0,10);
        const targets = EV_WINDOWS.map(([,o])=>{
          const d = new Date(base); d.setUTCDate(d.getUTCDate() - o); return fmtDate(d);
        });
        const dateList = [latest, ...targets];
        const rows = await sbFetchAll("rarity_avg_daily", {
          select: "set_id,date,rarity,printing,avg_low,avg_low_nc,avg_market,avg_market_nc",
          date: "in.(" + dateList.join(",") + ")",
          order: "set_id.asc,date.asc",
        });
        if(cancelled) return;
        const byDateSet = {};
        for(const r of rows){
          if(!byDateSet[r.date]) byDateSet[r.date] = {};
          if(!byDateSet[r.date][r.set_id]) byDateSet[r.date][r.set_id] = {};
          const key = getRarKey(r.rarity, r.printing);
          if(!key) continue;
          byDateSet[r.date][r.set_id][key] = {
            low:   r.avg_low       != null ? parseFloat(r.avg_low)       : null,
            lowNC: r.avg_low_nc    != null ? parseFloat(r.avg_low_nc)    : null,
            mkt:   r.avg_market    != null ? parseFloat(r.avg_market)    : null,
            mktNC: r.avg_market_nc != null ? parseFloat(r.avg_market_nc) : null,
          };
        }
        setHist({status:"ready", byDateSet, latest, targets});
      } catch(e){
        if(!cancelled) setHist({status:"error", error: String(e?.message||e).slice(0,200)});
      }
    })();
    return ()=>{ cancelled = true; };
  }, []);

  // Compute EV for a given set+date from a fetched rarity-avg bucket. Returns
  // null if the date snapshot doesn't have enough data (set unreleased or ETL
  // gap). `useNc` switches the avg-market-NC column on per the toggle.
  const evFromBucket = (setName, bucket) => {
    if(!bucket) return null;
    const pull = getPull(setName);
    let ev = 0, anyHit = false;
    for(const r of RARS){
      if(excludeRars && excludeRars.has(r)) continue;
      const rate = pull[r], cell = bucket[r];
      if(!cell) continue;
      const v = useMarket
        ? (nc ? cell.mktNC : cell.mkt)
        : (nc ? cell.lowNC : cell.low);
      if(v == null) continue;
      ev += v * rate;
      anyHit = true;
    }
    return anyHit ? ev : null;
  };

  // Build the per-set rows: current EV (from in-memory avgs) plus % change for
  // each window (computed off historical buckets). Memoized so toggling nc/ne
  // doesn't refetch — only re-derives.
  const rows = useMemo(() => {
    return sets.map(setName => {
      const ev = calcEV(avgs, setName, nc, excludeRars, priceMode);
      const sid = setIdByName[setName];
      const deltas = {};
      if(hist.status === "ready" && sid){
        const latestBucket = (hist.byDateSet[hist.latest] || {})[sid];
        const latestEv = evFromBucket(setName, latestBucket);
        EV_WINDOWS.forEach(([key,,], i) => {
          const targetDate = hist.targets[i];
          const pastBucket = (hist.byDateSet[targetDate] || {})[sid];
          const pastEv = evFromBucket(setName, pastBucket);
          if(latestEv != null && pastEv != null && pastEv > 0){
            deltas[key] = (latestEv - pastEv) / pastEv * 100;
          } else {
            deltas[key] = null;
          }
        });
      } else {
        EV_WINDOWS.forEach(([key])=>{ deltas[key] = null; });
      }
      const box = sid ? boxBySetId[sid] : null;
      const diffVsBox = (box && ev) ? (ev - box.price) : null;
      return {setName, ev, deltas, box, diffVsBox};
    });
  }, [sets, avgs, nc, excludeRars, hist, setIdByName, priceMode, boxBySetId]);
  const anyBoxData = rows.some(r => r.box);

  return html`<div class="ev-view">
    <div class="ev-header">
      <div class="ev-header-title">
        <div class="ev-header-eyebrow">Market analytics</div>
        <h2 class="ev-header-h2">Expected Value</h2>
        <div class="ev-header-sub">Estimated booster-box and pack value at current TCGPlayer ${useMarket?"Market":"Low"} prices.</div>
      </div>
      <div class="ev-toggles">
        <${PriceModeToggle} priceMode=${priceMode} setPriceMode=${setPriceMode}/>
        <${Tip} text="Treats any card worth less than $1.00 as $0. Gives a more realistic 'sellable' EV by ignoring bulk penny cards.">
          <label class=${"ev-toggle"+(nc?" on":"")}>
            <input type="checkbox" checked=${nc} onChange=${e=>setNc(e.target.checked)}/>
            <div class="ev-toggle-text">
              <div class="ev-toggle-title">Remove Bulk</div>
              <div class="ev-toggle-sub">${"<$1 → $0"}</div>
            </div>
          </label>
        <//>
        <div class=${"ev-toggle ev-toggle-group"+(ne?" on":"")}>
          <${Tip} text="Click 'Exclude chase' to drop both Enchanted and Iconic from EV (the one-click default). The two checkboxes below let you exclude just one if you want to keep, say, Enchanteds in play.">
            <button class="ev-toggle-group-btn" onClick=${()=>setExcludeBoth(!ne)}>
              <div class="ev-toggle-text">
                <div class="ev-toggle-title">${ne ? "Excluding chase" : "Exclude chase"}</div>
                <div class="ev-toggle-sub">${ne ? "Enchanted + Iconic skipped" : "Skip Enchanted + Iconic"}</div>
              </div>
            </button>
          <//>
          <div class="ev-toggle-group-rows">
            <label class=${"ev-toggle-sub-row"+(excludeEnchanted?" on":"")}>
              <input type="checkbox" checked=${excludeEnchanted} onChange=${e=>setExcludeEnchanted(e.target.checked)}/>
              Enchanted
            </label>
            <label class=${"ev-toggle-sub-row"+(excludeIconic?" on":"")}>
              <input type="checkbox" checked=${excludeIconic} onChange=${e=>setExcludeIconic(e.target.checked)}/>
              Iconic
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class=${"ev-rows"+(anyBoxData?" with-box":"")}>
      <div class="ev-row ev-row-head">
        <div class="ev-row-set">Set</div>
        <div class="ev-row-vals">
          <div class="ev-row-val"><span class="ev-row-val-lbl">per box</span></div>
          <div class="ev-row-val"><span class="ev-row-val-lbl">per pack</span></div>
        </div>
        ${anyBoxData && html`<div class="ev-row-box">
          <div class="ev-row-val"><span class="ev-row-val-lbl">box price</span></div>
          <div class="ev-row-val"><span class="ev-row-val-lbl">EV − box</span></div>
        </div>`}
        <div class="ev-row-deltas-wrap">
          <div class="ev-row-deltas-title">EV change</div>
          <div class="ev-row-deltas">
            ${EV_WINDOWS.map(([k,,label])=>html`<div key=${k} class="ev-delta-cell ev-delta-head">${k}</div>`)}
          </div>
        </div>
      </div>
      ${rows.map(({setName, ev, deltas, box, diffVsBox}) => html`<div key=${setName}
        class=${"ev-row"+(openSetHistory?" ev-row-clickable":"")}
        onClick=${openSetHistory ? ()=>openSetHistory(setName) : null}
        role=${openSetHistory ? "button" : null}
        tabIndex=${openSetHistory ? 0 : null}
        onKeyDown=${openSetHistory ? (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openSetHistory(setName);} } : null}
        title=${openSetHistory ? "Open price history for "+setName : null}>
        <div class="ev-row-set">${setName} <span class="ev-row-set-hint">↗</span></div>
        <div class="ev-row-vals">
          <div class="ev-row-val">${fmt(ev)}</div>
          <div class="ev-row-val ev-row-val-dim">${fmt(ev/24)}</div>
        </div>
        ${anyBoxData && html`<div class="ev-row-box">
          ${box
            ? html`<div class="ev-row-val">
                ${box.url
                  ? html`<a href=${box.url} target="_blank" rel="noopener nofollow"
                      onClick=${e=>e.stopPropagation()}
                      class="ev-box-link" title=${box.name}>${fmt(box.price)}<span class="ev-box-link-ext">↗</span></a>`
                  : fmt(box.price)}
              </div>
              ${(() => {
                const cls = diffVsBox > 0 ? "up" : (diffVsBox < 0 ? "down" : "flat");
                const sign = diffVsBox > 0 ? "+" : "";
                return html`<div class=${"ev-box-diff ev-box-diff-"+cls}
                  title=${diffVsBox>0?"Cracking is +EV at current box price":"Box price exceeds EV — buy singles"}>
                  ${sign}${fmt(diffVsBox)}
                </div>`;
              })()}`
            : html`<div class="ev-row-val ev-row-val-dim">—</div>
              <div class="ev-box-diff ev-box-diff-none">—</div>`}
        </div>`}
        <div class="ev-row-deltas">
          ${EV_WINDOWS.map(([k,,label])=>{
            const pct = deltas[k];
            if(pct == null) return html`<div key=${k} class="ev-delta-cell ev-delta-none" title=${"No data for "+label}>—</div>`;
            const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
            const arrow = pct > 0 ? "▲" : (pct < 0 ? "▼" : "·");
            return html`<div key=${k} class=${"ev-delta-cell ev-delta-"+cls} title=${label}>
              <span class="ev-delta-arrow">${arrow}</span>${Math.abs(pct).toFixed(1)}%
            </div>`;
          })}
        </div>
      </div>`)}
    </div>

    <p class="muted" style=${{fontSize:11,marginTop:12}}>
      ${hist.status === "loading" && "Loading history…"}
      ${hist.status === "error" && ("History unavailable: " + hist.error)}
      ${hist.status === "empty" && "No historical data yet — run the ETL once to populate rarity_avg_daily."}
      ${hist.status === "ready" && `Prices via Lorcast (TCGPlayer ${useMarket?"Market":"Low"}). Change windows compare ${hist.latest} against earlier snapshots.`}
    </p>
  </div>`;
}

// Sealed — table of every booster box / pack / starter deck / trove etc.
// with current price + change-over-time pills. Grouped by *display type*
// (Booster Boxes, Sleeved Packs, Cases, etc.) so users can compare same-kind
// SKUs across sets. The display-type classifier is a frontend refinement of
// the loader's product_type — splits Packs by sub-variant and pulls every
// "Case"/"Display" SKU into one section regardless of parent type.
const SEALED_DISPLAY_TYPE_ORDER = [
  "Booster Boxes",
  "Booster Packs",
  "Sleeved Booster Packs",
  "Booster Pack Art Bundles",
  "Illumineer's Troves",
  "Prerelease Packs",
  "Starter Decks",
  "Gift Sets",
  "Bundles",
  "Quests",
  "Sealed",
  "Collector's Edition",
  "Cases & Displays",
];
const SEALED_DISPLAY_TYPE_FOR = {
  "Booster Box":         "Booster Boxes",
  "Trove":               "Illumineer's Troves",
  "Starter Deck":        "Starter Decks",
  "Gift Set":            "Gift Sets",
  "Quest":               "Quests",
  "Bundle":              "Bundles",
  "Prerelease Pack":     "Prerelease Packs",
  "Sealed":              "Sealed",
  "Collector's Edition": "Collector's Edition",
};
function deriveSealedDisplayType(item){
  const name = (item.name || "").toLowerCase();
  // Cases & Displays — multi-unit retail containers regardless of parent
  // type. " case" with leading space avoids mid-word false positives;
  // "display" matches "Starter Deck Display" and similar.
  if(name.includes(" case") || / display( |$)/.test(name)) return "Cases & Displays";
  // Pack sub-variants: split the loader's single "Booster Pack" bucket into
  // basic / sleeved / art bundle so they show up as distinct sections.
  if(item.product_type === "Booster Pack"){
    if(name.includes("art bundle")) return "Booster Pack Art Bundles";
    if(name.includes("sleeved"))    return "Sleeved Booster Packs";
    return "Booster Packs";
  }
  // Special-edition "Collection Starter Set" and "Starter Blister Bundle"
  // SKUs aren't competitive starter decks — they're sealed multi-pack
  // collectibles. Surface them under Bundles instead.
  if(item.product_type === "Starter Deck"){
    if(name.includes("collection starter") || name.includes("starter blister")){
      return "Bundles";
    }
  }
  return SEALED_DISPLAY_TYPE_FOR[item.product_type] || item.product_type || "Other Sealed";
}
const sealedDisplayTypeRank = (t) => {
  const i = SEALED_DISPLAY_TYPE_ORDER.indexOf(t);
  return i === -1 ? 999 : i;
};
// Strip the "Disney Lorcana: " prefix that TCGCSV prepends to every product —
// the set pill already says where this is from; the prefix is just noise.
const cleanSealedName = (name) => (name || "").replace(/^Disney Lorcana:\s*/i, "");

function SealedView({raw, sealedPrices, sets, priceMode, setPriceMode, openSetHistory}){
  const useMarket = priceMode === "market";
  const priceField = useMarket ? "market_price" : "low_price";

  // set_id -> set name (only mainline sets that are in `raw` get an entry;
  // Quests / promo groups will fall through to the "Other Sealed" bucket).
  const setNameById = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.Set && r.set_id && !m[r.set_id]) m[r.set_id] = r.Set;
    return m;
  }, [raw]);
  const setIdByName = useMemo(()=>{
    const m = {};
    for(const [sid, name] of Object.entries(setNameById)) m[name] = sid;
    return m;
  }, [setNameById]);

  // Newest-first set ordering keyed by set_id, used to sort rows within a
  // display-type section (Booster Boxes ordered newest set → oldest set).
  const setOrderIndex = useMemo(()=>{
    const m = {};
    sets.forEach((name, i) => {
      const sid = setIdByName[name];
      if(sid) m[sid] = i;
    });
    return m;
  }, [sets, setIdByName]);

  // Group sealed products by *display type*. Sub-sort within each section
  // by set order (newest first) then product name. Promo Singles are
  // excluded — they're individual cards, not sealed product.
  const grouped = useMemo(()=>{
    const items = (sealedPrices || []).filter(p =>
      p.printing === "Normal" && p.product_type !== "Promo Single"
    );
    const byType = new Map();
    for(const item of items){
      const t = deriveSealedDisplayType(item);
      if(!byType.has(t)) byType.set(t, []);
      byType.get(t).push(item);
    }
    const out = [];
    for(const [type, list] of byType){
      list.sort((a, b) => {
        const ai = a.set_id != null ? (setOrderIndex[a.set_id] ?? 999) : 1000;
        const bi = b.set_id != null ? (setOrderIndex[b.set_id] ?? 999) : 1000;
        if(ai !== bi) return ai - bi;
        return (a.name||"").localeCompare(b.name||"");
      });
      out.push({type, items: list});
    }
    out.sort((a, b) => sealedDisplayTypeRank(a.type) - sealedDisplayTypeRank(b.type));
    return out;
  }, [sealedPrices, setOrderIndex]);

  // Historical price fetch — exactly the same shape as EVView's, but keyed
  // per product_id instead of per (set_id, rarity_key). One probe call to
  // find the latest snapshot date, then a chunked fetch for the seven
  // target dates we care about.
  const [hist, setHist] = useState({status:"loading"});
  useEffect(()=>{
    if(!sealedPrices || !sealedPrices.length){ setHist({status:"empty"}); return; }
    let cancelled = false;
    (async () => {
      try {
        const probe = await sbClient.from("prices_daily")
          .select("date")
          .eq("source", "tcgcsv").eq("grade", "raw")
          .order("date", {ascending:false}).limit(1);
        if(cancelled) return;
        if(probe.error) throw probe.error;
        const probeRows = probe.data || [];
        if(!probeRows.length){ setHist({status:"empty"}); return; }
        const latest = probeRows[0].date;
        const base = new Date(latest + "T00:00:00Z");
        const fmtDate = d => d.toISOString().slice(0,10);
        const targets = EV_WINDOWS.map(([,o])=>{
          const d = new Date(base); d.setUTCDate(d.getUTCDate() - o); return fmtDate(d);
        });
        const dateList = [latest, ...targets];
        // PostgREST URL caps out around ~8KB. ~80 product IDs × ~7 chars each
        // ≈ 560 chars per chunk — leaves plenty of headroom for the other
        // params even with 6 date values.
        const productIds = [...new Set(sealedPrices.map(p=>p.tcgplayer_product_id).filter(Boolean))];
        const CHUNK = 80;
        const allRows = [];
        for(let i = 0; i < productIds.length; i += CHUNK){
          const chunk = productIds.slice(i, i+CHUNK);
          const rows = await sbFetchAll("prices_daily", {
            select: "tcgplayer_product_id,date,low_price,market_price",
            source: "eq.tcgcsv",
            grade:  "eq.raw",
            printing: "eq.Normal",
            tcgplayer_product_id: "in.(" + chunk.join(",") + ")",
            date: "in.(" + dateList.join(",") + ")",
          });
          if(cancelled) return;
          allRows.push(...rows);
        }
        const byProductDate = {};
        for(const r of allRows){
          const pid = r.tcgplayer_product_id;
          if(!byProductDate[pid]) byProductDate[pid] = {};
          byProductDate[pid][r.date] = {
            low: r.low_price != null ? parseFloat(r.low_price) : null,
            mkt: r.market_price != null ? parseFloat(r.market_price) : null,
          };
        }
        setHist({status:"ready", byProductDate, latest, targets});
      } catch(e){
        if(!cancelled) setHist({status:"error", error: String(e?.message||e).slice(0,200)});
      }
    })();
    return ()=>{ cancelled = true; };
  }, [sealedPrices]);

  const deltasFor = (productId) => {
    const out = {};
    EV_WINDOWS.forEach(([k])=>{ out[k] = null; });
    if(hist.status !== "ready") return out;
    const byDate = hist.byProductDate[productId];
    if(!byDate) return out;
    const latestRow = byDate[hist.latest];
    if(!latestRow) return out;
    const cur = useMarket ? latestRow.mkt : latestRow.low;
    if(cur == null) return out;
    EV_WINDOWS.forEach(([k,,], i)=>{
      const pastRow = byDate[hist.targets[i]];
      if(!pastRow) return;
      const past = useMarket ? pastRow.mkt : pastRow.low;
      if(past == null || past <= 0) return;
      out[k] = (cur - past) / past * 100;
    });
    return out;
  };

  return html`<div class="sealed-view">
    <div class="sealed-header">
      <div class="sealed-header-text">
        <div class="ev-header-eyebrow">Market analytics</div>
        <h2 class="ev-header-h2">Sealed Product</h2>
        <div class="ev-header-sub">
          Current TCGPlayer ${useMarket?"Market":"Low"} prices for every booster box, pack, starter deck, trove and related sealed SKU.
        </div>
      </div>
      <${PriceModeToggle} priceMode=${priceMode} setPriceMode=${setPriceMode}/>
    </div>

    ${grouped.length === 0 && html`<div class="muted" style=${{fontSize:13,padding:"20px 0"}}>
      No sealed-product price data yet. Run supabase/16_sealed_prices_latest.sql, then refresh_sealed_prices_latest(), then reload.
    </div>`}

    ${grouped.map(({type, items}) => html`<div class="sealed-set" key=${type}>
      <div class="sealed-set-header">
        <span class="sealed-set-title">${type}</span>
        <span class="sealed-set-count">${items.length}</span>
      </div>
      <div class="sealed-rows">
        <div class="sealed-row sealed-row-head">
          <div class="sealed-row-set">Set</div>
          <div class="sealed-row-name">Product</div>
          <div class="sealed-row-price">${useMarket?"Market":"Low"}</div>
          <div class="ev-row-deltas-wrap">
            <div class="ev-row-deltas-title">Price change</div>
            <div class="ev-row-deltas">
              ${EV_WINDOWS.map(([k])=>html`<div key=${k} class="ev-delta-cell ev-delta-head">${k}</div>`)}
            </div>
          </div>
        </div>
        ${items.map(item => {
          const setName = item.set_id ? setNameById[item.set_id] : null;
          const url = tcgUrl(item.tcgplayer_product_id);
          const price = item[priceField];
          const deltas = deltasFor(item.tcgplayer_product_id);
          return html`<div class="sealed-row" key=${item.tcgplayer_product_id}>
            <div class="sealed-row-set">
              ${setName && openSetHistory
                ? html`<button class="sealed-set-pill" onClick=${()=>openSetHistory(setName)}
                    title=${"Open price history for "+setName}>${setName}</button>`
                : html`<span class="sealed-set-pill sealed-set-pill-muted">${setName || "—"}</span>`}
            </div>
            <div class="sealed-row-name">
              ${url
                ? html`<a href=${url} target="_blank" rel="noopener nofollow"
                    title=${item.name}>${cleanSealedName(item.name)}<span class="sealed-name-ext">↗</span></a>`
                : cleanSealedName(item.name)}
            </div>
            <div class="sealed-row-price">${fmt(price)}</div>
            <div class="sealed-row-deltas">
              ${EV_WINDOWS.map(([k,,label])=>{
                const pct = deltas[k];
                if(pct == null) return html`<div key=${k} class="ev-delta-cell ev-delta-none" title=${"No data for "+label}>—</div>`;
                const cls = pct > 0 ? "up" : (pct < 0 ? "down" : "flat");
                const arrow = pct > 0 ? "▲" : (pct < 0 ? "▼" : "·");
                return html`<div key=${k} class=${"ev-delta-cell ev-delta-"+cls} title=${label}>
                  <span class="ev-delta-arrow">${arrow}</span>${Math.abs(pct).toFixed(1)}%
                </div>`;
              })}
            </div>
          </div>`;
        })}
      </div>
    </div>`)}

    <p class="muted" style=${{fontSize:11,marginTop:12}}>
      ${hist.status === "loading" && "Loading price history…"}
      ${hist.status === "error"   && ("History unavailable: " + hist.error)}
      ${hist.status === "empty"   && "No historical price data yet."}
      ${hist.status === "ready"   && `Prices via TCGPlayer (${useMarket?"Market":"Low"}). Change windows compare ${hist.latest} against earlier snapshots.`}
    </p>
  </div>`;
}

// Card Averages — average price per rarity, per set, with optional set
// filtering. Absorbs the old Compare Sets view: pick exactly two sets and a
// Diff column appears so you get the same A−B comparison without a separate
// page. Bottom row summarizes box EV for whatever sets are visible.
function AvgView({sets, avgs, nc, setNc, priceMode, setPriceMode, openSetHistory}){
  const useMarket = priceMode === "market";
  // Default = all sets selected. When `sets` changes (new release) keep
  // whatever overlap exists; if the user had filtered down and the overlap
  // would be empty, fall back to all-selected.
  const [selected, setSelected] = useState(()=>new Set(sets));
  useEffect(()=>{
    setSelected(prev => {
      const next = new Set([...prev].filter(s => sets.includes(s)));
      return next.size > 0 ? next : new Set(sets);
    });
  }, [sets]);
  const visibleSets = sets.filter(s => selected.has(s));
  const showDiff = visibleSets.length === 2;
  // Smart toggle: when every set is selected (the default), the user almost
  // certainly wants to narrow down to a comparison — so the first click
  // becomes "show only this one" instead of forcing the user to deselect
  // everything else. Subsequent clicks add/remove from the subset. Emptying
  // the subset reverts to "all" rather than showing a blank table.
  const toggleSet = (s) => setSelected(prev => {
    if(prev.size === sets.length) return new Set([s]);
    const next = new Set(prev);
    if(next.has(s)) next.delete(s); else next.add(s);
    return next.size === 0 ? new Set(sets) : next;
  });
  const pickAvg = (d) => d ? (useMarket ? (nc?d.avgMktNC:d.avgMkt) : (nc?d.avgNC:d.avg)) : null;
  const onlyOne = visibleSets.length === 1 ? visibleSets[0] : null;
  return html`<div>

        <li><strong>Avg price</strong> — current average ${useMarket?"TCGPlayer Market":"TCGPlayer Low"} price across every card of that rarity in the set.</li>

    </div>
    <div class="market-filter-row">
      <${PriceModeToggle} priceMode=${priceMode} setPriceMode=${setPriceMode}/>
      <${Tip} text="Treats any card worth less than $1.00 as $0. More realistic 'sellable' average — ignores bulk pennies.">
        <label class="market-flag">
          <input type="checkbox" checked=${nc} onChange=${e=>setNc(e.target.checked)}/>${" <$1→$0"}
        </label>
      <//>
      <div class="market-filter-spacer"></div>
      ${visibleSets.length < sets.length && html`<button class="card-avg-chip-reset"
        onClick=${()=>setSelected(new Set(sets))} title="Show all sets">✕ Reset to all sets</button>`}
    </div>
    <div class="card-avg-chips">
      <span class="card-avg-chips-lbl">Sets (newest first):</span>
      ${sets.map(s => html`<button key=${s}
        class=${"card-avg-chip"+(selected.has(s)?" active":"")}
        onClick=${()=>toggleSet(s)}>${s}</button>`)}
      ${showDiff && html`<span class="card-avg-mode-hint">Comparing two sets — Diff column shown.</span>`}
    </div>

    <div class="scr">
      <table>
        <thead>
          <tr>
            <th style=${{minWidth:100}}>Rarity</th>
            <th style=${{minWidth:60}}>Pull rate</th>
            ${visibleSets.map(s => html`<th key=${s} style=${{minWidth:90,whiteSpace:"nowrap"}}>
              ${openSetHistory
                ? html`<button class="card-avg-set-head" onClick=${()=>openSetHistory(s)}
                    title=${"Open price history for "+s}>${s} <span class="card-avg-set-head-hint">↗</span></button>`
                : s}
            </th>`)}
            ${showDiff && html`<th style=${{minWidth:80}}>Diff (A−B)</th>`}
          </tr>
        </thead>
        <tbody>
          ${RARS.map(r => {
            const cells = visibleSets.map(s => pickAvg((avgs[s]||{})[r]));
            const diff = showDiff && cells[0] != null && cells[1] != null ? cells[0] - cells[1] : null;
            return html`<tr key=${r}>
              <td style=${{fontWeight:500}}>${r}</td>
              <td class="muted">${PULL[r]}</td>
              ${cells.map((v,i) => {
                const tone = showDiff && diff != null
                  ? (i===0 ? (diff>0?"var(--green)":diff<0?"var(--red)":"inherit")
                            : (diff<0?"var(--green)":diff>0?"var(--red)":"inherit"))
                  : (v!=null&&v<0.5?"var(--text-muted)":"inherit");
                return html`<td key=${i} style=${{color:tone}}>${fmt(v)}</td>`;
              })}
              ${showDiff && html`<td style=${{color:diff==null?"var(--text-muted)":diff>0?"var(--green)":diff<0?"var(--red)":"inherit",fontWeight:600}}>
                ${diff==null?"—":(diff>0?"+":"")+fmt(diff)}
              </td>`}
            </tr>`;
          })}
          ${(() => {
            const evs = visibleSets.map(s => calcEV(avgs, s, nc, false, priceMode));
            const diff = showDiff && evs[0] != null && evs[1] != null ? evs[0] - evs[1] : null;
            return html`<tr class="card-avg-ev-row">
              <td style=${{fontWeight:600,color:"var(--text-dim)"}}>EV / box</td>
              <td class="muted">—</td>
              ${evs.map((ev,i)=>{

                  ? (i===0 ? (diff>0?"var(--green)":"inherit") : (diff<0?"var(--green)":"inherit"))
                  : "var(--text)";
                return html`<td key=${i} style=${{fontWeight:700,color:tone}}>${fmt(ev)}</td>`;
              })}

                ${diff==null?"—":(diff>0?"+":"")+fmt(diff)}

          })()}

      ${" "}Pull rates shown are for Sets 1–11. Starting with Wilds Unknown (Set 12), rates differ: 6 Legendaries, ~30 Rares, 0.333 Enchanteds, 2.5 Epics per box.
    </p>
  </div>`;
}

// Resolve a Pack/Box sim card object into a "group" the CardDetailModal can
// display. The sim card carries tcgplayer_product_id, so we look up matching
// rows in raw to find both printings and group them.
const groupFromSimCard = (simCard, rawData) => {
  if(!simCard || !simCard.tcgplayer_product_id) return null;
  const rows = rawData.filter(r => r.tcgplayer_product_id === simCard.tcgplayer_product_id);
  if(rows.length === 0) return null;
  const groups = groupCards(rows);
  // groupCards may produce TWO groups for cards in SPLIT_BY_PRINTING_SETS
  // (Challenge Promo C1 — one per printing under the same pid). When the
  // caller knows which printing the user clicked, prefer that group so the
  // modal opens to the right side (PRIZE FOIL vs PRIZE WALL). Match against
  // either the matview-style `printing` ("Normal"/"Cold Foil") or buildRow's
  // canonical Printing ("Normal"/"Foil").
  if(groups.length > 1 && simCard.printing){
    const wantFoil = simCard.printing !== "Normal";
    const picked = groups.find(g => wantFoil ? !!g.foil : !!g.normal);
    if(picked) return picked;
  }
  return groups[0] || null;
};

      <${Badge} rarity=${c.rarity} foil=${foil} theme=${theme}/><div style=${{fontSize:11,fontWeight:500,lineHeight:1.4,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",minHeight:26}}>${c.name}</div>

function Histogram({data}){
  const ents=Object.entries(data.buckets).sort(([a],[b])=>+a-+b);const maxC=Math.max(...ents.map(([,c])=>c));
  const bw=Math.max(4,Math.min(22,Math.floor(560/ents.length))),H=100,skip=Math.max(1,Math.ceil(ents.length/10));
  return html`<div><div class="muted" style=${{fontSize:11,marginBottom:6}}>Distribution across ${data.n.toLocaleString()} simulated boxes</div>
    <div class="scr"><svg width=${ents.length*(bw+2)+10} height=${H+28} style=${{display:"block"}}>
      ${ents.map(([b,c],i)=>{const bh=Math.max(2,(c/maxC)*H),x=i*(bw+2),near=Math.abs(+b-data.mean)<15;
        return html`<g key=${b}><rect x=${x} y=${H-bh} width=${bw} height=${bh} fill=${near?"var(--accent)":"rgba(200,168,70,0.25)"} rx="2"/>
          ${i%skip===0&&html`<text x=${x+bw/2} y=${H+18} textAnchor="middle" fontSize="9" fill="var(--text-muted)">$${b}</text>`}</g>`;})}
      <line x1="0" y1=${H} x2=${ents.length*(bw+2)} y2=${H} stroke="var(--border)" strokeWidth="0.5"/></svg></div>
    <div class="muted" style=${{fontSize:11,marginTop:4}}>Dark = near mean (${fmt(data.mean)}). ${((data.totals.filter(t=>t>=100).length/data.n)*100).toFixed(1)}% of boxes hit $100+.</div></div>`;
}

            <${Stat} label="Best card $" value=${fmt(res.best?.price)} accent=${res.best?.price>=10?"var(--green)":null}/>
          </div>

            ${RARS.flatMap(r=>[r,r+" Foil"]).filter(k=>res.rc[k]).map(k=>{
              const b=k.replace(" Foil",""),st=getBadgeStyle(b,theme),foil=k.includes("Foil");
              return html`<div class="card" key=${k} style=${{flexDirection:"row",alignItems:"center",padding:"5px 10px"}}>

                <span style=${{marginLeft:"auto",fontWeight:600}}>${res.rc[k]}</span>
