        onDuplicate=${user ? (()=>duplicateExternalDeck(d)) : (()=>onSignIn && onSignIn())}
        onUpdateCard=${null} onUpdateMeta=${null}/>
      ${toastEl}
    <//>`;
  }

  // Deep-link is loading the deck. Show a quiet "loading shared deck…"
  // placeholder instead of the sign-in CTA so we don't flash it.
  if(incomingDeckId) return html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>Loading shared deck…</div>`;

  if(!user) return html`<div class="empty-state">
    <h2 class="title-font">Sign in to build and save decks</h2>
    <p>Your decks live in your account, so you can build on any device and see how much your decklists are worth at current prices.</p>
    <button class="active" onClick=${onSignIn} style=${{padding:"10px 20px",fontSize:14,marginTop:14}}>Sign in with Google</button>
  </div>`;

  if(decks === null) return html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>Loading decks…</div>`;

  if(selectedDeckId){
    const deck = decks.find(d => d.id === selectedDeckId);
    if(!deck) return html`<div class="muted">Deck not found. <button onClick=${()=>setSelectedDeckId(null)}>Back</button></div>`;
    return html`<${React.Fragment}>
      <${DeckEditor} deck=${deck} cardById=${cardById}
        collection=${collection} raw=${raw} theme=${theme}
        user=${user} onSignIn=${onSignIn}
        pending=${pending}
        favoriteCount=${favoriteCounts[deck.id] || 0}
        readOnly=${!editMode}
        isOwnDeck=${true}
        onToggleEditMode=${()=>setEditMode(m=>!m)}
        onBack=${()=>setSelectedDeckId(null)}
        onRename=${(newName)=>renameDeckInline(deck.id, newName)}
        onDelete=${()=>deleteDeck(deck.id)}
        onDuplicate=${()=>duplicateDeck(deck.id)}
        onUpdateCard=${(cardId, printing, qty)=>updateDeckCard(deck.id, cardId, printing, qty)}
        onUpdateMeta=${(patch)=>updateDeckMeta(deck.id, patch)}/>
      ${toastEl}
    <//>`;
  }

  const SECTIONS = [
    ["yours",     "Your Decks", decks.length],
    ["favorites", "Favorites",  favoritedDecks.length],
    ["following", "Following",  followingFeed.length],
    ["discover",  "Discover",   0],
  ];
  const filtersActive = inkFilter.size > 0 || (deckSection === "yours" && yourDeckSearch.trim().length > 0);

  return html`<div>
    <div class="deck-section-tabs">
      ${SECTIONS.map(([k,l,n]) => html`<button key=${k}
        class=${"deck-section-tab"+(deckSection===k?" active":"")}
        onClick=${()=>setDeckSection(k)}>
        ${l}${n>0?html` <span class="deck-section-tab-count">${n}</span>`:""}
      </button>`)}
      ${deckSection==="yours" && html`<button class="active" onClick=${createDeck}
        style=${{marginLeft:"auto",padding:"7px 14px",fontSize:13}}>+ New Deck</button>`}
      ${err && html`<span style=${{color:"var(--red)",fontSize:12,marginLeft:"auto"}}>${err}</span>`}
    </div>

    <div class="deck-filter-row">
      <div class="deck-ink-filter">
        ${INKS.map(ink => html`<button key=${ink}
          class=${"chip ink ink-icon-chip "+(inkFilter.has(ink)?"active":"")}
          style=${{background:INK_COLORS[ink]?.bg,borderColor:INK_COLORS[ink]?.border}}
          title=${ink} aria-label=${ink}
          onClick=${()=>toggleInkFilter(ink)}>
          <img src=${INK_ICONS[ink]} alt=${ink}/>
        </button>`)}
        ${inkFilter.size > 0 && html`<button class="deck-filter-clear"
          onClick=${()=>setInkFilter(new Set())}>✕ Clear inks</button>`}
      </div>
      ${deckSection === "yours" && html`<div class="deck-search-sort">
        <input type="search" class="deck-search-input" placeholder="Search your decks…"
          value=${yourDeckSearch} onInput=${e=>setYourDeckSearch(e.target.value)}/>
        <select class="deck-sort-select" value=${yourDeckSort} onChange=${e=>setYourDeckSort(e.target.value)}>
          <option value="updated_desc">Recently updated</option>
          <option value="created_desc">Recently created</option>
          <option value="value_desc">Highest value</option>
          <option value="favorites_desc">Most favorited</option>
          <option value="owned_desc">Most owned</option>
          <option value="name_asc">Name (A→Z)</option>
        </select>
      </div>`}
    </div>

    ${deckSection === "yours" && (
      decks.length === 0
        ? html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
            You haven't created any decks yet. Click <strong>+ New Deck</strong> to start.
          </div>`
        : yourDecksProcessed.length === 0
          ? html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
              No decks match the current filters. ${filtersActive && html`<button class="settings-action link"
                onClick=${()=>{setYourDeckSearch(""); setInkFilter(new Set());}}>Clear filters</button>`}
            </div>`
          : html`<div class="deck-list">${yourDecksProcessed.map(renderOwnedCard)}</div>`
    )}

    ${deckSection === "favorites" && (() => {
      const visible = filterExternal(favoritedDecks);
      if(favoritedDecks.length === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
        No favorited decks yet. When you find a shared deck you like, click <strong>☆ Favorite</strong> to save it here.
      </div>`;
      if(visible.length === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
        No favorites match the current ink filter. <button class="settings-action link"
          onClick=${()=>setInkFilter(new Set())}>Clear inks</button>
      </div>`;
      return html`<div class="deck-list">${visible.map(entry => renderExternalCard(entry, {showUnfavorite:true}))}</div>`;
    })()}

    ${deckSection === "following" && (() => {
      if(userFollows.size === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
        You aren't following any creators yet. When you view a shared deck, click <strong>+ Follow</strong> next to the creator's name to see their public decks here.
      </div>`;
      if(followingFeed.length === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
        You follow ${userFollows.size} creator${userFollows.size===1?"":"s"}, but none have published a public deck yet.
      </div>`;
      const visible = filterExternal(followingFeed);
      if(visible.length === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
        No decks in your feed match the current ink filter. <button class="settings-action link"
          onClick=${()=>setInkFilter(new Set())}>Clear inks</button>
      </div>`;
      return html`<div class="deck-list">${visible.map(entry => renderExternalCard(entry, {showUnfollowCreator:true}))}</div>`;
    })()}

    ${deckSection === "discover" && html`<div>
      ${discoverEntries.length === 0 && !discoverLoading
        ? html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
            No public decks to discover yet. Once someone sets a deck's visibility to Public from its Share menu, it'll show up here.
          </div>`
        : (() => {
            const visible = filterExternal(discoverEntries);
            if(visible.length === 0) return html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
              No public decks match the current ink filter. <button class="settings-action link"
                onClick=${()=>setInkFilter(new Set())}>Clear inks</button>
            </div>`;
            return html`<div class="deck-list">${visible.map(entry => renderExternalCard(entry, {}))}</div>`;
          })()}
      ${discoverLoading && html`<div class="muted" style=${{fontSize:12,padding:"12px 0",textAlign:"center"}}>Loading…</div>`}
      ${!discoverLoading && discoverHasMore && html`<div style=${{display:"flex",justifyContent:"center",margin:"14px 0"}}>
        <button onClick=${loadMoreDiscover} style=${{padding:"7px 18px",fontSize:13}}>Load more</button>
      </div>`}
    </div>`}

    ${toastEl}
  </div>`;
};

// Lorcana deck legality. We auto-detect the deck's format instead of asking
// the user to pick one: Core Constructed is the more restrictive format
// (60 cards + ≤2 inks + ≤4 of any card + all cards from currently-legal
// sets), so a Core-legal deck is also Infinity-legal. Returns:
//   format: "core" | "infinity" | "invalid"
//   issues: [strings] — empty when format is core/infinity
function checkDeckLegality(deck, cardById){
  const issues = [];
  const total = (deck.cards||[]).reduce((s,c)=>s+c.quantity, 0);
  if(total !== 60) issues.push(`${total} / 60 cards — ${total < 60 ? "need "+(60-total)+" more" : (total-60)+" over"}`);
  // Dual-ink cards contribute BOTH colors to the deck's ink set. A deck with
  // an Emerald/Sapphire dual + an Amber single uses 3 inks (Amber, Emerald,
  // Sapphire) — over the 2-ink cap.
  const inks = new Set();
  for(const c of deck.cards||[]){
    const meta = (cardById[c.card_id]||[])[0];
    const inksList = (meta?.inks && meta.inks.length) ? meta.inks : (meta?.ink ? [meta.ink] : []);
    for(const i of inksList) inks.add(i);
  }
  if(inks.size > 2) issues.push(`${inks.size} inks (${Array.from(inks).join(", ")}) — limit is 2`);

  // Quantity cap — Lorcana's default is 4-of-any-card, but a handful of cards
  // (Dalmatian Puppy - Tail Wagger: 99, Microbots: unlimited) bypass it via
  // card text. Variants count toward the same total, so we sum by Product
  // Name across card_ids before comparing.
  const qtyByName = {};
  for(const c of deck.cards||[]){
    const meta = (cardById[c.card_id]||[])[0];
    const name = meta?.["Product Name"] || c.card_id;
    qtyByName[name] = (qtyByName[name] || 0) + c.quantity;
  }
  for(const [name, qty] of Object.entries(qtyByName)){
    const limit = getDeckLimit(name);
    if(qty > limit){
      issues.push(`${qty}× ${name} — limit is ${limit === Infinity ? "unlimited" : limit}`);
    }
  }

  // The structural rules above decide infinity vs invalid. Format = Core
  // additionally requires every card to be in a currently-legal set.
  const structurallyLegal = issues.length === 0;
  let format;
  if(!structurallyLegal){
    format = "invalid";
  } else {
    const coreLegal = getFormat("core").legalSets();
    const allInCore = (deck.cards||[]).every(c => {
      const meta = (cardById[c.card_id]||[])[0];
      return meta && coreLegal.has(meta.Set);
    });
    format = allInCore ? "core" : "infinity";
  }
  return {format, issues, total, inkCount: inks.size};
}

// Serialize a deck to the plain-text "QTY NAME" format common in Lorcana
// community shares (and what we accept on import). Cards are sorted by
// section then cost for stable output.
function deckToText(deck, cardById){
  const lines = [];
  const sections = DECK_SECTIONS.map(s => ({...s, items: []}));
  const fallback = {key:"Other", label:"Other", items:[]};
  for(const c of deck.cards||[]){
    const meta = (cardById[c.card_id]||[])[0];
    const t = meta?.card_type || "";
    const section = sections.find(s => s.match(t)) || fallback;
    section.items.push({c, meta});
  }
  if(fallback.items.length) sections.push(fallback);
  for(const s of sections){
    if(!s.items.length) continue;
    lines.push(`# ${s.label}`);
    s.items.sort((a,b)=>(a.meta?.cost ?? 99) - (b.meta?.cost ?? 99));
    for(const {c, meta} of s.items){
      const name = meta?.["Product Name"] || c.card_id;
      lines.push(`${c.quantity} ${name}`);
    }
    lines.push("");
  }
  return lines.join("\n").trim();
}

// Parse a pasted decklist. Lenient — accepts "4 Name", "4x Name", "4 - Name",
// ignores blank lines and "# Section" headers. Returns {entries, unmatched}.
// Matches against the catalog by exact name then a normalized fallback.
function parseDeckText(text, raw){
  const byName = {};
  for(const r of raw){
    if(!r.card_id) continue;
    const n = (r["Product Name"] || "").trim();
    if(!byName[normalizeCardName(n)]) byName[normalizeCardName(n)] = r;
    const sq = squashCardName(n);
    if(!byName[sq]) byName[sq] = r;
  }
  const entries = [];
  const unmatched = [];
  const lines = text.split(/\r?\n/);
  for(const raw_line of lines){
    const line = raw_line.trim();
    if(!line || line.startsWith("#") || line.startsWith("//")) continue;
    // "4x Name", "4 Name", "4 - Name"
    const m = line.match(/^(\d+)\s*(?:x|×)?\s*(?:-\s*)?(.+)$/i);
    if(!m){ unmatched.push(line); continue; }
    const qty = parseInt(m[1], 10);
    const name = m[2].trim();
    if(!qty || qty <= 0){ unmatched.push(line); continue; }
    const hit = byName[normalizeCardName(name)] || byName[squashCardName(name)];
    if(!hit){ unmatched.push(`${qty} ${name}`); continue; }
    entries.push({card_id: hit.card_id, quantity: Math.min(qty, 4), source_line: line});
  }
  // Dedupe by card_id (sum quantities, cap at 4).
  const merged = {};
  for(const e of entries){
    merged[e.card_id] = Math.min(4, (merged[e.card_id]||0) + e.quantity);
  }
  return {
    entries: Object.entries(merged).map(([cid, q]) => ({card_id:cid, quantity:q})),
    unmatched,
  };
}

// Tiny stacked-bar / pie helpers for the editor charts (no library).
function pieSlicePath(cx, cy, r, startAngle, endAngle){
  if(endAngle - startAngle >= 2 * Math.PI - 1e-6){
    // Full circle as two arcs (single-arc path can't draw 360°).
    return `M${cx-r},${cy} A${r},${r} 0 1 1 ${cx+r},${cy} A${r},${r} 0 1 1 ${cx-r},${cy} Z`;
  }
  const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle),   y2 = cy + r * Math.sin(endAngle);
  const large = endAngle - startAngle > Math.PI ? 1 : 0;
  return `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`;
}

// Click-to-edit deck name. Click → input + auto-focus + select-all. Enter
// or blur saves; Escape cancels. onSave returns truthy on success.
const EditableDeckName = ({name, onSave}) => {
  const [editing, setEditing] = useState(false);
  const [value, setValue] = useState(name);
  const inputRef = useRef(null);
  useEffect(() => { setValue(name); }, [name]);
  useEffect(() => {
    if(editing && inputRef.current){
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing]);
  const commit = async () => {
    if(!editing) return;
    const trimmed = (value || "").trim();
    if(!trimmed || trimmed === name){ setEditing(false); setValue(name); return; }
    const ok = await onSave(trimmed);
    setEditing(false);
    if(!ok) setValue(name);
  };
  const cancel = () => { setValue(name); setEditing(false); };
  if(editing){
    return html`<input ref=${inputRef} class="deck-name-input" value=${value}
      onInput=${e=>setValue(e.target.value)}
      onBlur=${commit}
      onKeyDown=${e => {
        if(e.key === "Enter"){ e.preventDefault(); commit(); }
        else if(e.key === "Escape"){ e.preventDefault(); cancel(); }
      }}/>`;
  }
  return html`<h2 class="title-font deck-name-display" title="Click to rename"
    onClick=${()=>setEditing(true)}>${name}</h2>`;
};

// Stable color picker for the card-type pie — mirrors common deckbuilder
// palettes (characters dominate so we use the accent gold for them).
// Pie-chart palettes that intentionally avoid the six ink colors so the
// Inkable / Types pies don't get visually confused with the Colors pie.
const TYPE_PIE_COLOR = (name) => ({
  "Character":     "#ec4899",  // pink-500
  "Action":        "#06b6d4",  // cyan-500
  "Item":          "#f97316",  // orange-500
  "Location":      "#84cc16",  // lime-500
  "Action - Song": "#0891b2",  // cyan-600 (slightly darker so songs read as a sub-variant)
  "Other":         "var(--text-muted)",
}[name] || "var(--text-muted)");
const INKABLE_PIE_COLOR = (name) =>
  name === "Inkable" ? "#14b8a6" :        // teal-500 (positive, not amber)
  name === "Non-Inkable" ? "#fb7185" :    // rose-400 (negative, not ruby)
  "var(--text-muted)";
// Neutral charcoal for the dual-ink slice in the Colors pie. The bar chart
// keeps the diagonal gradient (visible at the larger sizes), but pie slices
// can be tiny (2/60 = 3% of pie) where the gradient becomes confusing — a
// flat neutral lets it read as "this is the dual category" instead.
const DUAL_INK_PIE_COLOR = "#475569";  // slate-600

// Cost curve — stacked bar chart, one column per cost bucket 1..9+,
// each column stacked by ink color. Heights normalized to the tallest bar.
// Resolve an inkKey ("Amber" or "Amber/Sapphire") to either a solid color or
// a gradient definition. Returns {fill, defs} where `defs` is an optional
// <linearGradient> element to inject into the SVG <defs>. Caller dedupes.
// The gradient runs diagonally (45°) so dual-ink blocks read as "split"
// regardless of whether they're tall (pie slice) or short (bar segment).
const resolveInkFill = (inkKey, idPrefix) => {
  if(!inkKey) return {fill:"var(--text-muted)", defs:null};
  const parts = inkKey.split("/");
  if(parts.length === 1){
    return {fill: INK_COLORS[parts[0]]?.border || "var(--text-muted)", defs:null};
  }
  const id = `${idPrefix}-${parts.join("-")}`;
  const colors = parts.map(p => INK_COLORS[p]?.border || "#888");
  const stopPct = 100 / colors.length;
  const stops = colors.map((c, i) => html`
    <stop offset="${i*stopPct}%" stop-color=${c}/>
    <stop offset="${(i+1)*stopPct}%" stop-color=${c}/>
  `);
  // 45° diagonal: top-left to bottom-right.
  const defs = html`<linearGradient id=${id} x1="0%" y1="0%" x2="100%" y2="100%">${stops}</linearGradient>`;
  return {fill: `url(#${id})`, defs};
};

const DeckCostChart = ({costByInk}) => {
  const buckets = [1,2,3,4,5,6,7,8,9];
  const totals = buckets.map(c => {
    const row = costByInk[c] || {};
    return Object.values(row).reduce((s,v)=>s+v, 0);
  });
  const max = Math.max(1, ...totals);
  // padT generous enough for the per-bar count label above a max-height bar.
  const W = 360, H = 120, padL = 18, padB = 18, padT = 16;
  const innerW = W - padL - 6;
  const innerH = H - padT - padB;
  const colW = innerW / buckets.length;
  // Pre-resolve fills for every inkKey present, dedupe gradient defs.
  // Must compute defs BEFORE rendering the template (htm evaluates expressions
  // left-to-right, so defsList has to be fully populated before the <defs>
  // expression is evaluated).
  const allInkKeys = new Set();
  for(const c of buckets){ const row = costByInk[c] || {}; for(const k of Object.keys(row)) allInkKeys.add(k); }
  const fillCache = {};
  const defsList = [];
  for(const inkKey of allInkKeys){
    const {fill, defs} = resolveInkFill(inkKey, "cc-grad");
    fillCache[inkKey] = fill;
    if(defs) defsList.push(defs);
  }
  const getFill = (inkKey) => fillCache[inkKey] || "var(--text-muted)";
  return html`<div class="deck-chart">
    <div class="deck-chart-title">Cost curve</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height=${H} preserveAspectRatio="none">
      <defs>${defsList}</defs>
      ${buckets.map((c, i) => {
        const row = costByInk[c] || {};
        const total = totals[i];
        const barH = total > 0 ? (total / max) * innerH : 0;
        let yCursor = padT + innerH - barH;
        const x = padL + i * colW + 2;
        const w = Math.max(4, colW - 4);
        // Sort smallest-first so dual-ink half-contributions get rendered
        // on top and won't get visually buried. Also enforce a 4px minimum
        // segment height so a single 0.5-share from a dual card (typically
        // ~3-4px tall) stays visible.
        const stack = Object.entries(row).sort((a,b) => a[1] - b[1]);
        const raw = stack.map(([,n]) => (n / max) * innerH);
        const adjusted = raw.map(h => h > 0 ? Math.max(4, h) : 0);
        const sumAdj = adjusted.reduce((s,h)=>s+h, 0);
        const sumRaw = raw.reduce((s,h)=>s+h, 0);
        // Scale back so the visually-padded stack still fits inside barH.
        const scale = sumAdj > 0 ? Math.min(1, barH / sumAdj) : 1;
        const segHs = adjusted.map(h => h * scale);
        return html`<g key=${c}>
          ${stack.map(([ink, n], j) => {
            const segH = segHs[j];
            const y = yCursor;
            yCursor += segH;
            const color = getFill(ink);
            return html`<rect key=${ink+":"+j} x=${x} y=${y} width=${w} height=${segH}
              fill=${color} rx=${j === stack.length - 1 ? 2 : 0}/>`;
          })}
          ${total > 0 && html`<text x=${x + w/2} y=${padT + innerH - barH - 2}
            text-anchor="middle" font-size="9" fill="var(--text-dim)">${total}</text>`}
          <text x=${x + w/2} y=${H - 4} text-anchor="middle" font-size="9" fill="var(--text-muted)">${c === 9 ? "9+" : c}</text>
        </g>`;
      })}
    </svg>
  </div>`;
};

// Pie chart with title + inline legend. Slices sized by `data` values.
const DeckPie = ({title, data, colorOf, gradientPrefix}) => {
  const entries = Object.entries(data || {}).filter(([,v]) => v > 0);
  const total = entries.reduce((s,[,v])=>s+v, 0);
  const R = 36, CX = 40, CY = 40;
  if(total === 0) return html`<div class="deck-pie">
    <div class="deck-pie-title">${title}</div>
    <div class="deck-pie-empty">—</div>
  </div>`;
  // When gradientPrefix is set (Colors pie), dual-ink keys like
  // "Emerald/Sapphire" render as a flat neutral charcoal so a 3%-of-pie
  // slice doesn't disappear into the diagonal gradient. The bar chart
  // keeps its diagonal gradient (different visual context, larger blocks).
  // Inkable / Types pies don't have dual buckets and use colorOf directly.
  const defsList = [];
  const colorFor = (k) => {
    if(gradientPrefix){
      if((k||"").includes("/")) return DUAL_INK_PIE_COLOR;
      return INK_COLORS[k]?.border || "var(--text-muted)";
    }
    return colorOf(k);
  };
  let cursor = -Math.PI / 2;
  const slices = entries.map(([k, v]) => {
    const frac = v / total;
    const start = cursor;
    cursor += frac * 2 * Math.PI;
    return {k, v, start, end: cursor, color: colorFor(k), swatch: swatchStyle(k, gradientPrefix)};
  });
  return html`<div class="deck-pie">
    <div class="deck-pie-title">${title}</div>
    <svg viewBox="0 0 80 80" width="80" height="80">
      <defs>${defsList}</defs>
      ${slices.map(s => html`<path key=${s.k} d=${pieSlicePath(CX, CY, R, s.start, s.end)} fill=${s.color}/>`)}
    </svg>
    <div class="deck-pie-legend">
      ${slices.map(s => {
        const isDual = (s.k||"").includes("/");
        // For non-gradient (Inkable/Types) pies, color the legend name to
        // match the slice. For gradient (Colors) pie, keep the name in the
        // default text color since the swatch already does the gradient/dual
        // duty and a colored name competes with the ink color naming.
        const nameStyle = gradientPrefix ? null : {color: s.color, fontWeight: 600};
        return html`<div key=${s.k} class=${"deck-pie-legend-row"+(isDual?" dual":"")}>
          <span class=${"deck-pie-swatch"+(isDual?" dual":"")} style=${s.swatch}></span>
          <span class="deck-pie-legend-name" style=${nameStyle}>${s.k}${isDual?html` <span class="dual-tag">dual</span>`:""}</span>
          <span class="deck-pie-legend-val">${Number.isInteger(s.v) ? s.v : s.v.toFixed(1)}</span>
        </div>`;
      })}
    </div>
  </div>`;
};

// Background-style swatch for the legend (CSS doesn't share SVG gradient ids
// across an <svg> and a <span>, so we use a linear-gradient CSS image for
// dual-ink swatches and a solid color for single-ink). Matches the SVG
// gradient direction (135° diagonal) so swatch and slice read consistently.
const swatchStyle = (inkKey, gradientPrefix) => {
  if(!gradientPrefix) return null;
  const parts = (inkKey||"").split("/");
  if(parts.length === 1){
    return {background: INK_COLORS[parts[0]]?.border || "var(--text-muted)"};
  }
  // Dual swatch uses the neutral pie color too so legend + slice match.
  return {background: DUAL_INK_PIE_COLOR};
};

// Deck editor: card browser on the left, deck summary on the right. The
// browser is a slimmer version of CardsView's filter UI; +/- buttons on
// each card row update the current deck's quantity (max 4 per card).
const DeckEditor = ({deck, cardById, collection, raw, theme, pending,
                     user, onSignIn,
                     onBack, onRename, onDelete, onDuplicate,
                     onUpdateCard, onUpdateMeta, onToggleEditMode,
                     readOnly, creator, creatorId, isOwnDeck, canAct,
                     isFavorited, onToggleFavorite,
                     isFollowingCreator, onToggleFollowCreator,
                     onOpenCreator, favoriteCount}) => {
  // Detail modal for clicking a tile's image — same modal used by the Cards
  // tab so the deck builder feels native, not separate.
  const [selectedGroup, setSelectedGroup] = useState(null);
  // Share popover (owner-only). Holds visibility radio + share URL.
  const [shareOpen, setShareOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const shareRef = useRef(null);
  // View-mode preferences (layout, sort, highlight-missing). Persist to
  // localStorage so the user's choice survives reloads.
  const [viewLayout, setViewLayout] = useState(() => {
    try { return localStorage.getItem("packsink:deckview:layout") || "grid"; } catch { return "grid"; }
  });
  const [sortBy, setSortBy] = useState(() => {
    try { return localStorage.getItem("packsink:deckview:sort") || "cost-asc"; } catch { return "cost-asc"; }
  });
  const [groupBy, setGroupBy] = useState(() => {
    try { return localStorage.getItem("packsink:deckview:group") || "type"; } catch { return "type"; }
  });
  const [highlightMissing, setHighlightMissing] = useState(() => {
    try { return localStorage.getItem("packsink:deckview:highlight") === "true"; } catch { return false; }
  });
  const [viewDropOpen, setViewDropOpen] = useState(false);
  const viewDropRef = useRef(null);
  // Hover preview state — when hovering a list row, float the card image
  // near the cursor. Portaled to body so overflow:hidden ancestors don't
  // clip it. Edit mode shows the same preview when viewing the deck list.
  const [hoverPreview, setHoverPreview] = useState(null); // {src, x, y}
  useEffect(()=>{ try { localStorage.setItem("packsink:deckview:layout", viewLayout); } catch{} }, [viewLayout]);
  useEffect(()=>{ try { localStorage.setItem("packsink:deckview:sort", sortBy); } catch{} }, [sortBy]);
  useEffect(()=>{ try { localStorage.setItem("packsink:deckview:group", groupBy); } catch{} }, [groupBy]);
  useEffect(()=>{ try { localStorage.setItem("packsink:deckview:highlight", String(highlightMissing)); } catch{} }, [highlightMissing]);
  useEffect(()=>{
    if(!viewDropOpen) return;
    const onDoc = (e) => {
      if(viewDropRef.current && !viewDropRef.current.contains(e.target)) setViewDropOpen(false);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [viewDropOpen]);
  useEffect(()=>{
    if(!shareOpen) return;
    const onDoc = (e) => {
      if(shareRef.current && !shareRef.current.contains(e.target)) setShareOpen(false);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [shareOpen]);
  const shareUrl = useMemo(()=>{
    try {
      const url = new URL(window.location.href);
      // Strip any pre-existing path-level junk; start from origin + path.
      url.search = "";
      url.hash = "";
      url.searchParams.set("deck", deck.id);
      // Unlisted decks need the token; public ones don't (the token is
      // still in the DB but RLS allows direct access for public, so a
      // clean URL is friendlier to share). Private decks won't render
      // anything for non-owners regardless, but we include the token
      // anyway in case the user flips back to unlisted later.
      if(deck.visibility !== "public" && deck.share_token){
        url.searchParams.set("token", deck.share_token);
      }
      return url.toString();
    } catch { return ""; }
  }, [deck.id, deck.visibility, deck.share_token]);
  const copyShareUrl = useCallback(()=>{
    if(!shareUrl) return;
    const done = () => { setCopied(true); setTimeout(()=>setCopied(false), 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(shareUrl).then(done).catch(()=>{
        prompt("Copy this URL:", shareUrl); done();
      });
    } else {
      prompt("Copy this URL:", shareUrl); done();
    }
  }, [shareUrl]);
  const visibility = deck.visibility || "private";
  const setVisibility = (v) => { if(onUpdateMeta) onUpdateMeta({visibility: v}); };
  // Owner-only: rotate the share token via the SECURITY DEFINER RPC. Any
  // URL that includes the previous token stops working immediately.
  const [regenerating, setRegenerating] = useState(false);
  const regenerateShareToken = useCallback(async ()=>{
    if(!onUpdateMeta || regenerating) return;
    if(!confirm("Generate a new share link? The current link will stop working for anyone who has it.")) return;
    setRegenerating(true);
    try {
      const {data, error} = await sbClient.rpc("regenerate_deck_share_token", {p_deck_id: deck.id});
      if(error) throw error;
      // Reflect locally so the share URL updates without a refetch.
      onUpdateMeta({share_token: data});
    } catch(e){
      alert("Couldn't regenerate: " + (e.message || e));
    } finally {
      setRegenerating(false);
    }
  }, [deck.id, onUpdateMeta, regenerating]);

  // Deck-building = mainline sets only (no Extras / promo sets / weird
  // one-offs). Filter raw before handing it to CardBrowser.
  const deckRaw = useMemo(() => raw.filter(r => MAINLINE_SETS.includes(r.Set)), [raw]);

  // Build the deck's contents grouped by section.
  const qtyOf = useCallback((cardId, printing="Normal") => {
    const row = (deck.cards||[]).find(c => c.card_id === cardId && c.printing === printing);
    return row ? row.quantity : 0;
  }, [deck.cards]);

  // Stable callbacks for the CardBrowser tiles. The handlers themselves
  // never change identity; React.memo on CardTile can skip unchanged
  // tiles when the user toggles a filter. The lookup of current qty
  // happens inside `deckQtyForGroup` rather than baking it into each
  // render of the renderTile fn (which would re-create on every parent).
  const onSelectGroupStable = useCallback(g => setSelectedGroup(g), []);
  const deckQtyForGroup = useCallback(g => qtyOf(g.card_id, "Normal"), [qtyOf]);
  const onDeckQtyChangeStable = useCallback((g, n) => {
    onUpdateCard(g.card_id, "Normal", n);
  }, [onUpdateCard]);

  const inkColorsInDeck = useMemo(() => {
    const inks = new Set();
    for(const c of deck.cards||[]){
      const meta = (cardById[c.card_id]||[])[0];
      const list = (meta?.inks && meta.inks.length) ? meta.inks : (meta?.ink ? [meta.ink] : []);
      for(const i of list) inks.add(i);
    }
    return Array.from(inks);
  }, [deck.cards, cardById]);

  const legality = useMemo(() => checkDeckLegality(deck, cardById), [deck, cardById]);

  // Aggregate per-cost / per-ink / inkable / per-type counts for the charts.
  // Dual-ink cards form their own bucket keyed by the joined ink names
  // (e.g. "Emerald/Sapphire"), so they render as a distinct gradient slice
  // in the pie and a distinct gradient block in the cost curve. Single-ink
  // cards stay in their single-color buckets. Quantity is not split — the
  // dual bucket gets the card's full quantity, and totals still sum to the
  // deck size.
  const aggregates = useMemo(() => {
    const costByInk = {};   // cost (capped at 9) -> {inkKey: count}
    const inkCount = {};    // inkKey -> count  (inkKey = single ink name OR "InkA/InkB")
    const typeCount = {};
    let inkable = 0, nonInkable = 0;
    for(const c of deck.cards||[]){
      const meta = (cardById[c.card_id]||[])[0] || {};
      const q = c.quantity;
      const costBucket = Math.min(9, Math.max(1, meta.cost ?? 1));
      const inkList = (meta.inks && meta.inks.length) ? meta.inks
                    : (meta.ink ? [meta.ink] : ["Unknown"]);
      const inkKey = inkList.slice().sort().join("/");
      const t = meta.card_type || "Other";
      if(!costByInk[costBucket]) costByInk[costBucket] = {};
      costByInk[costBucket][inkKey] = (costByInk[costBucket][inkKey] || 0) + q;
      inkCount[inkKey] = (inkCount[inkKey] || 0) + q;
      typeCount[t] = (typeCount[t] || 0) + q;
      if(meta.inkable) inkable += q; else nonInkable += q;
    }
    return {costByInk, inkCount, typeCount, inkable, nonInkable};
  }, [deck.cards, cardById]);

  const handleExport = useCallback(() => {
    const text = deckToText(deck, cardById);
    if(!text){ alert("Deck is empty."); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => alert("Decklist copied to clipboard."))
        .catch(() => prompt("Copy decklist:", text));
    } else {
      prompt("Copy decklist:", text);
    }
  }, [deck, cardById]);

  const handleImport = useCallback(async () => {
    const text = prompt("Paste a decklist (one 'QTY NAME' per line). Existing cards are replaced.");
    if(text == null) return;
    const result = parseDeckText(text, raw);
    if(!result.entries.length){
      alert("No cards matched. Make sure each line is like '4 Cinderella - Stouthearted'.");
      return;
    }
    const summary = `Match: ${result.entries.length} unique cards (${result.entries.reduce((s,e)=>s+e.quantity,0)} total)`
                  + (result.unmatched.length ? `\nUnmatched (${result.unmatched.length}):\n  ${result.unmatched.slice(0,10).join("\n  ")}` : "");
    if(!confirm(summary + "\n\nReplace the current deck contents?")) return;
    // Wipe the deck, then add each parsed entry. Sequential to keep error
    // handling simple; bulk-upsert would be faster on huge decks but a
    // Lorcana deck is at most 60 rows so this is fine.
    for(const c of (deck.cards||[])){
      await onUpdateCard(c.card_id, c.printing, 0);
    }
    for(const e of result.entries){
      await onUpdateCard(e.card_id, "Normal", e.quantity);
    }
  }, [raw, deck.cards, onUpdateCard]);

  const totalCount = (deck.cards||[]).reduce((s,c)=>s+c.quantity, 0);
  const totalValue = (deck.cards||[]).reduce((s,c) => {
    const rows = cardById[c.card_id] || [];
    return s + (cheapestCardPrice(rows) || 0) * c.quantity;
  }, 0);
  const ownedCount = (deck.cards||[]).reduce((s,c) => {
    const have = (collection[c.card_id+":Normal"] || 0)
               + (collection[c.card_id+":Cold Foil"] || 0)
               + (collection[c.card_id+":Foil"] || 0)
               + (collection[c.card_id+":Holofoil"] || 0);
    return s + Math.min(c.quantity, have);
  }, 0);
  const missingValue = (deck.cards||[]).reduce((s,c) => {
    const have = (collection[c.card_id+":Normal"] || 0)
               + (collection[c.card_id+":Cold Foil"] || 0)
               + (collection[c.card_id+":Foil"] || 0)
               + (collection[c.card_id+":Holofoil"] || 0);
    const short = Math.max(0, c.quantity - have);
    const rows = cardById[c.card_id] || [];
    return s + (cheapestCardPrice(rows) || 0) * short;
  }, 0);
  const ownedPct = totalCount ? (ownedCount/totalCount*100) : 0;

  // Per-row owned/missing counts. Used by the highlight toggle, the missing
  // tile, and the mass-entry affiliate URL.
  const ownedShortByKey = useMemo(() => {
    const out = {};
    for(const c of deck.cards||[]){
      const have = (collection[c.card_id+":Normal"] || 0)
                 + (collection[c.card_id+":Cold Foil"] || 0)
                 + (collection[c.card_id+":Foil"] || 0)
                 + (collection[c.card_id+":Holofoil"] || 0);
      out[c.card_id+":"+c.printing] = {have, short: Math.max(0, c.quantity - have)};
    }
    return out;
  }, [deck.cards, collection]);

  // Sort comparator for items inside each section.
  const sortItems = useCallback((items) => {
    const get = (it, k) => {
      if(k === "cost") return it.meta?.cost ?? 99;
      if(k === "name") return (it.meta?.["Product Name"] || "").toLowerCase();
      if(k === "price") return cheapestCardPrice(cardById[it.card_id] || []) || 0;
      return 0;
    };
    const copy = items.slice();
    switch(sortBy){
      case "cost-asc":  copy.sort((a,b) => get(a,"cost") - get(b,"cost")); break;
      case "cost-desc": copy.sort((a,b) => get(b,"cost") - get(a,"cost")); break;
      case "name":      copy.sort((a,b) => get(a,"name").localeCompare(get(b,"name"))); break;
      case "price-desc":copy.sort((a,b) => get(b,"price") - get(a,"price")); break;
      case "price-asc": copy.sort((a,b) => get(a,"price") - get(b,"price")); break;
    }
    return copy;
  }, [sortBy, cardById]);

  // Group deck rows into sections. Default is by card_type (Characters /
  // Actions / Items / Locations) using DECK_SECTIONS' built-in matchers;
  // alternate groupBy values bucket by the named meta field.
  const sectioned = useMemo(() => {
    if(groupBy === "type"){
      const out = DECK_SECTIONS.map(s => ({...s, items: []}));
      const fallback = {key:"Other", label:"Other", items:[]};
      for(const c of deck.cards||[]){
        const meta = (cardById[c.card_id]||[])[0];
        const t = meta?.card_type || "";
        const section = out.find(s => s.match(t)) || fallback;
        section.items.push({...c, meta});
      }
      if(fallback.items.length) out.push(fallback);
      return out.filter(s => s.items.length).map(s => ({...s, items: sortItems(s.items)}));
    }
    // Generic grouping: build buckets keyed by the selected meta value.
    const bucketKey = (meta) => {
      if(!meta) return "Other";
      if(groupBy === "color"){
        const list = (meta.inks && meta.inks.length) ? meta.inks : (meta.ink ? [meta.ink] : ["Unknown"]);
        return list.slice().sort().join("/");
      }
      if(groupBy === "set")     return meta.Set || "Unknown";
      if(groupBy === "rarity")  return meta.Rarity || "Unknown";
      if(groupBy === "inkwell") return meta.inkable === false ? "Uninkable" : (meta.inkable === true ? "Inkable" : "Unknown");
      if(groupBy === "cost")    return (meta.cost == null) ? "?" : ("Cost " + (meta.cost >= 9 ? "9+" : meta.cost));
      return "Other";
    };
    const buckets = new Map();
    for(const c of deck.cards||[]){
      const meta = (cardById[c.card_id]||[])[0];
      const k = bucketKey(meta);
      if(!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push({...c, meta});
    }
    // Deterministic section order: rarity uses RARS ladder; cost numeric;
    // others alphabetical.
    const sectionOrder = (a, b) => {
      if(groupBy === "rarity"){
        const idx = (k) => { const i = RARS.indexOf(k); return i < 0 ? 999 : i; };
        return idx(a) - idx(b);
      }
      if(groupBy === "cost"){
        const num = (k) => { const m = k.match(/\d+/); return m ? parseInt(m[0],10) : 99; };
        return num(a) - num(b);
      }
      return a.localeCompare(b);
    };
    return Array.from(buckets.keys()).sort(sectionOrder).map(k => ({
      key: k, label: k, items: sortItems(buckets.get(k)),
    }));
  }, [deck.cards, cardById, sortItems, groupBy]);

  // TCGPlayer mass-entry affiliate URL pre-filled with missing cards.
  // Format: ?productline=Lorcana TCG&c=4 Card Name||4 Card Name|...
  const massEntryUrl = useMemo(() => {
    const lines = [];
    for(const c of deck.cards||[]){
      const meta = (cardById[c.card_id]||[])[0];
      const k = c.card_id+":"+c.printing;
      const short = ownedShortByKey[k]?.short || 0;
      if(short > 0 && meta){
        const name = meta["Product Name"] || meta.name || "";
        if(name) lines.push(`${short} ${name}`);
      }
    }
    if(!lines.length) return null;
    const dest = `https://www.tcgplayer.com/massentry?productline=Lorcana TCG&c=${encodeURIComponent(lines.join("||"))}`;
    return TCG_AFFILIATE_BASE + "?u=" + encodeURIComponent(dest);
  }, [deck.cards, cardById, ownedShortByKey]);

  return html`<div>
    ${readOnly && !isOwnDeck && html`<div class="deck-readonly-banner">
      ${creator && (creator.avatar_url
        ? html`<img class="deck-readonly-avatar" src=${creator.avatar_url} alt=""/>`
        : html`<span class="deck-readonly-avatar deck-readonly-avatar-fallback">${(creator.display_name||"?")[0].toUpperCase()}</span>`)}
      <div class="deck-readonly-info">
        <div class="deck-readonly-sub">Viewing shared deck</div>
        <div class="deck-readonly-by">
          <span>by </span>
          ${creator?.display_name && onOpenCreator
            ? html`<button class="deck-creator-link" onClick=${onOpenCreator}
                title="View this creator's public decks">${creator.display_name}</button>`
            : html`<span>${creator?.display_name || "an anonymous user"}</span>`}
          ${onToggleFollowCreator && creatorId && html`<button class=${"deck-creator-follow"+(isFollowingCreator?" on":"")}
            onClick=${onToggleFollowCreator}
            title=${canAct
              ? (isFollowingCreator ? "Stop following this creator" : "Follow this creator — their public decks show up in your Following feed")
              : "Sign in to follow this creator"}>
            ${canAct ? (isFollowingCreator ? "Following" : "+ Follow") : "Sign in"}
          </button>`}
        </div>
      </div>
      <div style=${{marginLeft:"auto",display:"flex",gap:6}}>
        ${onToggleFavorite && html`<button onClick=${onToggleFavorite}
          class=${isFavorited ? "active" : ""}
          style=${{padding:"7px 14px",fontSize:13}}
          title=${canAct
            ? (isFavorited ? "Remove from your favorites" : "Save this deck to your favorites; you'll see updates the creator makes")
            : "Sign in to favorite this deck"}>
          ${canAct
            ? (isFavorited ? "★ Favorited" : "☆ Favorite")
            : "Sign in to favorite"}
        </button>`}
        ${onDuplicate && html`<button onClick=${onDuplicate}
          class=${canAct ? "active" : ""}
          style=${{padding:"7px 14px",fontSize:13}}
          title=${canAct ? "Save a copy of this deck to your collection" : "Sign in to copy this deck to your account"}>
          ${canAct ? "Duplicate to my decks" : "Sign in to copy"}
        </button>`}
      </div>
    </div>`}

    <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <button onClick=${onBack} style=${{fontSize:12,padding:"5px 10px"}}>← Back to Decks</button>
      ${readOnly
        ? html`<h2 class="title-font deck-name-display" style=${{cursor:"default"}}>${deck.name}</h2>`
        : html`<${EditableDeckName} name=${deck.name} onSave=${onRename}/>`}
      <span class="muted" style=${{fontSize:11}}>${inkColorsInDeck.join(" · ")}</span>
      <span class=${"deck-legal-badge "+legality.format}
        title=${legality.format === "invalid" ? legality.issues.join(" • ") :
                legality.format === "core" ? "Legal in both Core Constructed and Infinity." :
                "Legal in Infinity. Contains cards from rotated-out sets, so not Core Constructed."}>
        ${legality.format === "core" ? "Core Constructed"
        : legality.format === "infinity" ? "Infinity"
        : "Invalid Deck"}
      </span>
      ${!readOnly && html`<span class=${"deck-save-status "+(pending>0?"saving":"saved")}
        title=${pending>0 ? "Saving to your account…" : "All changes saved to your account"}>
        ${pending>0 ? "Saving…" : "Saved ✓"}
      </span>`}
      ${deck.updated_at && html`<span class="deck-updated"
        title=${"Last updated " + absoluteLocalTime(deck.updated_at) + " (your local time)"}>
        Updated ${relativeTime(deck.updated_at)}
      </span>`}
      ${favoriteCount > 0 && html`<span class="deck-fav-count"
        title=${favoriteCount + " user" + (favoriteCount===1?"":"s") + " favorited this deck"}>
        ★ ${favoriteCount}
      </span>`}
      <div style=${{marginLeft:"auto",display:"flex",gap:6,position:"relative"}}>
        ${isOwnDeck && onToggleEditMode && html`<button onClick=${onToggleEditMode}
          class=${!readOnly ? "active" : ""}
          style=${{fontSize:12,padding:"5px 10px"}}
          title=${readOnly ? "Edit this deck — open the card browser" : "Done editing — back to view"}>
          ${readOnly ? "✎ Edit" : "✓ Done"}
        </button>`}
        ${isOwnDeck && html`<div ref=${shareRef} style=${{position:"relative",display:"inline-flex"}}>
          <button onClick=${()=>setShareOpen(o=>!o)}
            class=${visibility==="public" || visibility==="unlisted" ? "active" : ""}
            style=${{fontSize:12,padding:"5px 10px"}}
            title="Share this deck via URL">↗ Share</button>
          ${shareOpen && html`<div class="deck-share-popover">
            <div class="deck-share-section-title">Visibility</div>
            <label class=${"deck-share-radio"+(visibility==="private"?" active":"")}>
              <input type="radio" name="vis" checked=${visibility==="private"} onChange=${()=>setVisibility("private")}/>
              <div>
                <div class="deck-share-radio-title">Private</div>
                <div class="deck-share-radio-sub">Only you can view.</div>
              </div>
            </label>
            <label class=${"deck-share-radio"+(visibility==="unlisted"?" active":"")}>
              <input type="radio" name="vis" checked=${visibility==="unlisted"} onChange=${()=>setVisibility("unlisted")}/>
              <div>
                <div class="deck-share-radio-title">Unlisted</div>
                <div class="deck-share-radio-sub">Anyone with the link can view. Not shown in discovery.</div>
              </div>
            </label>
            <label class=${"deck-share-radio"+(visibility==="public"?" active":"")}>
              <input type="radio" name="vis" checked=${visibility==="public"} onChange=${()=>setVisibility("public")}/>
              <div>
                <div class="deck-share-radio-title">Public</div>
                <div class="deck-share-radio-sub">Anyone with the link can view, plus this deck appears in discovery.</div>
              </div>
            </label>
            <div class="deck-share-divider"></div>
            <div class="deck-share-section-title">Share URL</div>
            <div class="deck-share-url-row">
              <input class="deck-share-url" type="text" readOnly value=${shareUrl}
                onClick=${e=>e.target.select()}/>
              <button class=${"deck-share-copy"+(copied?" copied":"")}
                onClick=${copyShareUrl}>${copied?"Copied ✓":"Copy"}</button>
            </div>
            ${visibility === "private" && html`<div class="deck-share-note">
              This deck is currently <strong>private</strong>. The link above won't work for anyone but you — switch to Unlisted or Public to share.
            </div>`}
            ${visibility === "unlisted" && html`<div class="deck-share-regen-row">
              <button class="settings-action link" onClick=${regenerateShareToken}
                disabled=${regenerating}
                title="Generate a new share link. The current link stops working for anyone who has it.">
                ${regenerating ? "Regenerating…" : "↻ Regenerate share link"}
              </button>
              <div class="deck-share-note" style=${{marginTop:6}}>
                Switching back to <strong>Private</strong> also rotates the link automatically.
              </div>
            </div>`}
          </div>`}
        </div>`}
        ${!readOnly && html`<button onClick=${handleImport} style=${{fontSize:12,padding:"5px 10px"}} title="Paste a decklist to replace this deck's contents">Import</button>`}
        <button onClick=${handleExport} style=${{fontSize:12,padding:"5px 10px"}} title="Copy as plain-text decklist">Export</button>
        ${isOwnDeck && onDuplicate && html`<button onClick=${onDuplicate} style=${{fontSize:12,padding:"5px 10px"}} title="Make a copy of this deck">Duplicate</button>`}
        ${isOwnDeck && onDelete && html`<button onClick=${onDelete} style=${{fontSize:12,padding:"5px 10px",color:"var(--red)"}}>Delete</button>`}
      </div>
    </div>
    ${legality.format === "invalid" && html`<div class="deck-legal-issues">
      ${legality.issues.map((i,idx) => html`<div key=${idx}>${i}</div>`)}
    </div>`}

    ${(() => {
      const statsBlock = html`<div class="deck-stat-row">
        <div class="deck-stat">
          <div class="deck-stat-lbl">Total value</div>
          <div class="deck-stat-val green">$${totalValue.toFixed(2)}</div>
          <div class="deck-stat-sub">${totalCount} / 60 cards</div>
        </div>
        <div class="deck-stat">
          <div class="deck-stat-lbl">Owned</div>
          <div class="deck-stat-val">${ownedPct.toFixed(0)}%</div>
          <div class="deck-stat-sub">${ownedCount} / ${totalCount}</div>
        </div>
        ${massEntryUrl
          ? html`<a class="deck-stat shop-cta" href=${massEntryUrl} target="_blank" rel="noopener nofollow sponsored"
              title="Open all missing cards on TCGPlayer in one mass-entry cart (affiliate link)">
              <div class="deck-stat-lbl">Missing</div>
              <div class="deck-stat-val">$${missingValue.toFixed(2)}</div>
              <div class="deck-stat-sub">Shop on TCGPlayer ↗</div>
            </a>`
          : html`<div class="deck-stat">
              <div class="deck-stat-lbl">Missing</div>
              <div class="deck-stat-val red">$${missingValue.toFixed(2)}</div>
              <div class="deck-stat-sub">to complete</div>
            </div>`}
      </div>
      ${totalCount > 0 && html`<div class="deck-charts">
        <${DeckCostChart} costByInk=${aggregates.costByInk}/>
        <div class="deck-pie-row">
          <${DeckPie} title="Colors" data=${aggregates.inkCount}
            gradientPrefix="colors-pie"
            colorOf=${name => (INK_COLORS[name]?.border) || "var(--text-muted)"}/>
          <${DeckPie} title="Inkable" data=${{Inkable:aggregates.inkable, "Non-Inkable":aggregates.nonInkable}}
            colorOf=${INKABLE_PIE_COLOR}/>
          <${DeckPie} title="Types" data=${aggregates.typeCount}
            colorOf=${TYPE_PIE_COLOR}/>
        </div>
      </div>`}`;

      const openCardModal = (cardId) => {
        const rows = cardById[cardId] || [];
        if(!rows.length) return;
        const groups = groupCards(rows);
        if(groups[0]) setSelectedGroup(groups[0]);
      };
      // Counter shared across all three layouts. e.preventDefault prevents
      // any browser-default click behavior (which was scrolling the page
      // when the row re-rendered); stopPropagation keeps the parent tile's
      // open-modal click from also firing.
      const makeCounter = (item, cardMax, cls) => {
        if(readOnly) return null;
        const dec = (e) => { e.preventDefault(); e.stopPropagation();
          onUpdateCard(item.card_id, item.printing, Math.max(0, item.quantity - 1)); };
        const inc = (e) => { e.preventDefault(); e.stopPropagation();
          onUpdateCard(item.card_id, item.printing, Math.min(cardMax, item.quantity + 1)); };
        return html`<div class=${cls} onClick=${e=>e.stopPropagation()}>
          <button type="button" onClick=${dec} disabled=${item.quantity<=0}>−</button>
          <button type="button" onClick=${inc} disabled=${item.quantity>=cardMax}>+</button>
        </div>`;
      };

      const renderItem = (item) => {
        const meta = item.meta || {};
        const price = cheapestCardPrice(cardById[item.card_id] || []);
        const aff = tcgUrl(meta.tcgplayer_product_id, item.printing);
        const k = item.card_id+":"+item.printing;
        const owned = (ownedShortByKey[k]?.have || 0) >= item.quantity;
        const short = ownedShortByKey[k]?.short || 0;
        const dimClass = highlightMissing ? (owned ? " owned-dim" : (short>0 ? " missing-pop" : "")) : "";
        const cardMax = getDeckLimitForUI(meta["Product Name"]);
        const have = ownedShortByKey[k]?.have || 0;
        const haveCapped = Math.min(have, item.quantity);
        const ownedFracBadge = highlightMissing
          ? html`<span class=${"deck-tile-owned-frac"+(haveCapped>=item.quantity?" complete":"")}>${haveCapped}/${item.quantity}</span>`
          : null;
        if(viewLayout === "grid"){
          return html`<div key=${k} class=${"deck-grid-tile"+dimClass}>
            ${meta.img_small
              ? html`<img src=${meta.img_small} alt=${meta["Product Name"]||""} loading="lazy" onClick=${()=>openCardModal(item.card_id)}/>`
              : html`<div style=${{aspectRatio:"5/7",background:"var(--bg-surface)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"var(--text-muted)",padding:6,textAlign:"center"}}>${meta["Product Name"]||"(unknown)"}</div>`}
            <span class="deck-grid-tile-qty">${item.quantity}×</span>
            ${ownedFracBadge}
            ${price!=null && aff && html`<a class="deck-grid-tile-price" href=${aff} target="_blank" rel="noopener nofollow sponsored" onClick=${e=>e.stopPropagation()}>$${price.toFixed(2)}</a>`}
            ${makeCounter(item, cardMax, "deck-grid-tile-counter")}
          </div>`;
        }
        if(viewLayout === "stacked"){
          const peeks = Math.max(0, item.quantity - 1);
          return html`<div key=${k} class=${"deck-stack-tile"+(highlightMissing && owned?" owned-dim":"")}
            onClick=${()=>openCardModal(item.card_id)}>
            ${Array.from({length: peeks}).map((_, i) => html`<div key=${i} class="deck-stack-peek">
              ${meta.img_small ? html`<img src=${meta.img_small} alt=""/>` : null}
            </div>`)}
            <div class=${"deck-stack-top"+(highlightMissing && short>0?" missing-pop":"")}>
              <span class="deck-stack-qty">${item.quantity}×</span>
              ${ownedFracBadge}
              ${meta.img_small
                ? html`<img src=${meta.img_small} alt=${meta["Product Name"]||""} loading="lazy"/>`
                : html`<div style=${{aspectRatio:"5/7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--text-muted)",padding:8,textAlign:"center"}}>${meta["Product Name"]||"(unknown)"}</div>`}
              ${price!=null && aff && html`<a class="deck-stack-price" href=${aff} target="_blank" rel="noopener nofollow sponsored" onClick=${e=>e.stopPropagation()}>$${price.toFixed(2)}</a>`}
              ${makeCounter(item, cardMax, "deck-stack-counter")}
            </div>
          </div>`;
        }
        const inkList = (meta.inks && meta.inks.length) ? meta.inks : (meta.ink ? [meta.ink] : []);
        const inkSwatch = inkList.length === 2
          ? html`<span class="deck-row-ink dual" title=${inkList.join(" / ")}
              style=${{background: `linear-gradient(90deg, ${INK_COLORS[inkList[0]]?.border || "#888"} 0 50%, ${INK_COLORS[inkList[1]]?.border || "#888"} 50% 100%)`}}></span>`
          : inkList.length === 1
            ? html`<span class="deck-row-ink" title=${inkList[0]}
                style=${{background: INK_COLORS[inkList[0]]?.border || "#888"}}></span>`
            : null;
        const previewSrc = meta.img_normal || meta.img_small;
        const onRowEnter = (e) => {
          if(previewSrc) setHoverPreview({src: previewSrc, x: e.clientX, y: e.clientY});
        };
        const onRowMove = (e) => {
          if(previewSrc) setHoverPreview(p => p ? {...p, x: e.clientX, y: e.clientY} : p);
        };
        const onRowLeave = () => setHoverPreview(null);
        return html`<div key=${k} class=${"deck-row"+dimClass}
          onMouseEnter=${onRowEnter} onMouseMove=${onRowMove} onMouseLeave=${onRowLeave}>
          <span class="deck-row-qty">${item.quantity}×</span>
          <span class="deck-row-cost">${meta.cost ?? "—"}</span>
          <span class="deck-row-name" title=${meta["Product Name"]}
            onClick=${()=>openCardModal(item.card_id)}
            style=${{cursor:"pointer"}}>${inkSwatch}<span class=${"deck-row-inkable"+(meta.inkable===false?" no":"")} title=${meta.inkable===false?"Uninkable":"Inkable"}></span>${meta["Product Name"] || "(unknown card)"}</span>
          ${price!=null && aff
            ? html`<a class="deck-row-price" href=${aff} target="_blank" rel="noopener nofollow sponsored" title="Shop on TCGPlayer (affiliate)">$${price.toFixed(2)}</a>`
            : html`<span class="deck-row-price" style=${{background:"transparent",border:"none",padding:0}}>${price!=null?"$"+price.toFixed(2):"—"}</span>`}
          ${makeCounter(item, cardMax, "deck-row-counter")}
        </div>`;
      };

      const listBlock = html`${sectioned.length > 0 && html`<div class="deck-view-toolbar">
        <span class=${"deck-highlight-pill"+(highlightMissing?" on":"")}
          onClick=${()=>setHighlightMissing(v=>!v)}
          title="Dim cards you already own so the missing ones stand out">
          <span class="dot"></span>${highlightMissing?"Highlighting missing":"Highlight missing"}
        </span>
        <div ref=${viewDropRef} style=${{position:"relative",marginLeft:"auto"}}>
          <button class="deck-view-trigger" onClick=${()=>setViewDropOpen(o=>!o)}>View ▾</button>
          ${viewDropOpen && html`<div class="deck-view-popover">
            <div>
              <div class="deck-view-section-title">Layout</div>
              <div class="deck-view-layout-row">
                <button class=${viewLayout==="list"?"active":""} onClick=${()=>setViewLayout("list")} title="Compact list">☰</button>
                <button class=${viewLayout==="grid"?"active":""} onClick=${()=>setViewLayout("grid")} title="Image grid">▦</button>
                <button class=${viewLayout==="stacked"?"active":""} onClick=${()=>setViewLayout("stacked")} title="Stacked pile">▤</button>
              </div>
            </div>
            <div>
              <div class="deck-view-section-title">Group by</div>
              <select class="deck-view-select" value=${groupBy} onChange=${e=>setGroupBy(e.target.value)}>
                <option value="type">Type</option>
                <option value="color">Color</option>
                <option value="set">Set</option>
                <option value="rarity">Rarity</option>
                <option value="inkwell">Inkwell</option>
                <option value="cost">Cost</option>
              </select>
            </div>
            <div>
              <div class="deck-view-section-title">Sort by</div>
              <select class="deck-view-select" value=${sortBy} onChange=${e=>setSortBy(e.target.value)}>
                <option value="cost-asc">Cost: Low to High</option>
                <option value="cost-desc">Cost: High to Low</option>
                <option value="name">Name (A→Z)</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="price-asc">Price: Low to High</option>
              </select>
            </div>
          </div>`}
        </div>
      </div>`}
      ${sectioned.length === 0
        ? html`<div class="muted" style=${{fontSize:12,padding:"20px 4px",textAlign:"center"}}>
            ${readOnly ? "This deck is empty." : html`Deck is empty. Click <strong>+</strong> on any card in the browser to add it.`}</div>`
        : sectioned.map(section => html`<div key=${section.key} class="deck-section">
            <div class="deck-section-title">${section.label} <span class="muted">${section.items.reduce((s,i)=>s+i.quantity,0)}</span></div>
            ${viewLayout === "grid"
              ? html`<div class="deck-section-grid">${section.items.map(renderItem)}</div>`
              : viewLayout === "stacked"
                ? html`<div class="deck-section-stack">${section.items.map(renderItem)}</div>`
                : section.items.map(renderItem)}
          </div>`)}`;

      return html`<div class=${"deck-editor-grid"+(readOnly?" readonly":"")}>
        ${readOnly
          ? html`<div class="deck-view-list">${listBlock}</div>
                 <aside class="deck-editor-panel">${statsBlock}</aside>`
          : html`<div class="deck-editor-browser">
                   <${CardBrowser} raw=${deckRaw} collection=${collection}
                     onSelectGroup=${onSelectGroupStable}
                     deckQty=${deckQtyForGroup}
                     onDeckQtyChange=${onDeckQtyChangeStable}/>
                 </div>
                 <aside class="deck-editor-panel">${statsBlock}${listBlock}</aside>`}
      </div>`;
    })()}
    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${null} onSignIn=${onSignIn || (()=>{})}/>`}
    ${hoverPreview && html`<div class="deck-hover-preview"
      style=${{
        left:  Math.min(window.innerWidth  - 210, hoverPreview.x + 16) + "px",
        top:   Math.min(window.innerHeight - 290, hoverPreview.y + 16) + "px",
      }}>
      <img src=${hoverPreview.src} alt=""/>
    </div>`}
  </div>`;
};

// ── Main App ────────────────────────────────────────────────────────────
function App(){
  const [raw,setRaw]=useState([]);const [loading,setLoading]=useState(false);const [err,setErr]=useState(null);const [loaded,setLoaded]=useState(false);
  // Sealed-product price snapshot. Joined to sealed_products server-side
  // in the sealed_prices_latest matview. Small payload (~300 rows) so we
  // skip the catalog cache layer and refetch each load.
  const [sealedPrices, setSealedPrices] = useState(()=>{
    const cached = readSealedCache();
    return (cached && cached.rows.length) ? cached.rows : [];
  });
  // Latest price snapshot date in card_prices_latest. Used by the footer
  // pill to warn when the daily ETL hasn't run in a while (> 36h).
  const [lastEtlDate, setLastEtlDate] = useState(null);
  useEffect(() => {
    let cancelled = false;
    sbClient.from("card_prices_latest").select("price_date")
      .order("price_date", {ascending:false}).limit(1)
      .then(({data, error}) => {
        if(cancelled) return;
        if(error){ console.warn("etl health probe failed:", error.message); return; }
        if(data && data[0]) setLastEtlDate(data[0].price_date);
      });
    return () => { cancelled = true; };
  }, []);
  // Deep links: ?deck=<uuid> opens a specific deck; ?user=<uuid> opens
  // a creator's profile (their public deck list). Parsed once on mount;
  // DecksView consumes both. Mutually exclusive — deck wins if both are
  // somehow set.
  const initialUrlParams = useMemo(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      return {
        deck:  p.get("deck")  || null,
        token: p.get("token") || null,
        user:  p.get("user")  || null,
      };
    } catch { return {deck: null, token: null, user: null}; }
  }, []);
  const [incomingDeckId, setIncomingDeckId] = useState(initialUrlParams.deck);
  const [incomingShareToken, setIncomingShareToken] = useState(initialUrlParams.token);
  const [incomingUserId, setIncomingUserId] = useState(initialUrlParams.deck ? null : initialUrlParams.user);
  const [nc,setNc]=useState(false);const [ne,setNe]=useState(false);
  const [view,setView]=useState((initialUrlParams.deck || initialUrlParams.user) ? "decks" : "home");
  // Cross-view navigation: a child view sets a "target" payload (e.g. EV
  // wants to jump into History focused on a specific set) and the destination
  // view consumes it via prop on mount. Bumped to a new object each call so
  // useEffect with [target] as dep refires even when navigating to the same set.
  const [historyTarget, setHistoryTarget] = useState(null);
  const openSetHistory = useCallback((setName) => {
    setHistoryTarget({ setName, nonce: Date.now() });
    setView("history");
  }, []);
  // Incremented every time a tab button is clicked. CollectionView watches
  // this and resets its internal selectedSet on change, so re-clicking the
  // Collection tab while inside a set drops you back to the main grid.
  const [tabClickNonce, setTabClickNonce] = useState(0);
  const onTabClick = useCallback((v) => {
    setView(v);
    setTabClickNonce(n => n + 1);
    // Strip deck/token/user params when leaving Decks so a hard refresh
    // doesn't deep-link the user back into a deck they navigated away from.
    if(v !== "decks"){
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete("deck");
        url.searchParams.delete("token");
        url.searchParams.delete("user");
        window.history.replaceState({}, "", url);
      } catch {}
    }
  }, []);
  // User settings — persisted to localStorage and (when signed in) synced
  // to Supabase user_metadata so they follow the user across devices.
  const [tipsEnabled, setTipsEnabled] = useState(() => {
    try { return JSON.parse(localStorage.getItem("packsink:tipsEnabled") ?? "true"); }
    catch { return true; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:tipsEnabled", JSON.stringify(tipsEnabled)); } catch {}
  }, [tipsEnabled]);
  // Card-as-avatar: stored as the card_id of the chosen card. Falls back to
  // Google avatar (frequently 403s) and then the first initial.
  const [avatarCardId, setAvatarCardId] = useState(() => {
    try { return localStorage.getItem("packsink:avatarCardId") || null; }
    catch { return null; }
  });
  useEffect(() => {
    try {
      if(avatarCardId) localStorage.setItem("packsink:avatarCardId", avatarCardId);
      else localStorage.removeItem("packsink:avatarCardId");
    } catch {}
  }, [avatarCardId]);
  const [avatarPickerOpen, setAvatarPickerOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  // Close settings popover on outside click / Escape.
  const settingsRef = useRef(null);
  useEffect(() => {
    if(!settingsOpen) return;
    const onDocClick = (e) => {
      if(settingsRef.current && !settingsRef.current.contains(e.target)) setSettingsOpen(false);
    };
    const onKey = (e) => { if(e.key === "Escape") setSettingsOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDocClick);
      document.removeEventListener("keydown", onKey);
    };
  }, [settingsOpen]);
  const [loadProgress,setLoadProgress]=useState({loaded:0,total:0,current:""});
  // Theme persists to localStorage (per-device fallback) and, when signed in,
  // syncs to Supabase auth user_metadata (follows the user across devices).
  const [theme,setTheme]=useState(() => {
    try { return localStorage.getItem("packsink:theme") || "light"; }
    catch { return "light"; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("packsink:theme", theme); } catch {}
  }, [theme]);
  const [user,setUser]=useState(null);
  // Map of `${card_id}:${tcg_printing}` -> quantity owned. Stored locally for
  // fast lookup; mirrors the user's rows in collection_items (NM only for v1).
  const [collection,setCollection]=useState({});
  // Sealed-product collection: { [tcgplayer_product_id]: quantity }. Parallel
  // to `collection` but keyed by product_id since sealed has no card_id.
  const [sealedCollection, setSealedCollection] = useState({});
  // Tracks the post-sign-in fetch so the Home panel can show a "loading"
  // state instead of the "empty collection" CTA during the round-trip.
  const [collectionLoading, setCollectionLoading] = useState(false);

  // Track auth state. Supabase SDK auto-detects OAuth redirect on page load.
  useEffect(()=>{
    sbClient.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:{subscription}} = sbClient.auth.onAuthStateChange((_evt, session) => {
      setUser(session?.user || null);
    });
    return () => subscription.unsubscribe();
  },[]);

  // Public profile state — display name + avatar URL the rest of the world
  // sees on your shared decks. Distinct from auth.users metadata (which is
  // private + Google-controlled). On first sign-in we create an empty row;
  // the user picks their own display name via a prompt (Google name is not
  // surfaced publicly).
  const [profile, setProfile] = useState(null);
  const [showNamePrompt, setShowNamePrompt] = useState(false);
  useEffect(()=>{
    if(!user){ setProfile(null); setShowNamePrompt(false); return; }
    let cancelled = false;
    (async () => {
      // Create the row if it doesn't exist (ignoreDuplicates means existing
      // rows are left untouched — we never overwrite a user's chosen name).
      const insertRes = await sbClient.from("profiles")
        .upsert({user_id: user.id}, {onConflict: "user_id", ignoreDuplicates: true});
      if(insertRes.error) console.warn("profile upsert failed (run supabase/18_*.sql?):", insertRes.error.message);
      // Read whatever's there now.
      const {data, error} = await sbClient.from("profiles")
        .select("user_id,display_name,avatar_url")
        .eq("user_id", user.id).maybeSingle();
      if(cancelled) return;
      if(error){ console.warn("profile read failed:", error.message); return; }
      setProfile(data || {user_id: user.id, display_name: null, avatar_url: null});
      // Prompt for a display name if it's missing (typical for a fresh sign-in).
      if(!data || !data.display_name || !data.display_name.trim()){
        setShowNamePrompt(true);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [user]);

  // Save a new display name (called by both the first-time prompt and the
  // settings-popover editor).
  const saveDisplayName = useCallback(async (raw) => {
    if(!user) return {ok:false, error: "Not signed in"};
    const name = (raw||"").trim();
    if(!name) return {ok:false, error: "Name can't be empty"};
    if(name.length > 32) return {ok:false, error: "Max 32 characters"};
    const {error} = await sbClient.from("profiles")
      .update({display_name: name}).eq("user_id", user.id);
    if(error) return {ok:false, error: error.message};
    setProfile(p => ({...(p||{user_id: user.id}), display_name: name}));
    setShowNamePrompt(false);
    return {ok:true};
  }, [user]);

  // Tell Sentry who the current user is so errors get attributed in the
  // dashboard. The loader script stubs out a queue immediately, so calling
  // setUser() before Sentry finishes loading is safe — it gets replayed.
  // We only send the UUID + display name, never the email.
  useEffect(()=>{
    if(typeof window === "undefined" || !window.Sentry) return;
    if(user){
      window.Sentry.setUser({
        id: user.id,
        username: profile?.display_name || "(unset)",
      });
    } else {
      window.Sentry.setUser(null);
    }
  }, [user, profile?.display_name]);

  // When the user signs in, hydrate UI prefs (theme, tooltips) from their
  // Supabase user_metadata so settings follow them across devices. Local
  // values win only when the server has nothing stored yet — first-write on
  // a new account just snapshots whatever was in localStorage.
  const prefsHydrated = useRef(false);
  useEffect(() => {
    if(!user){ prefsHydrated.current = false; return; }
    if(prefsHydrated.current) return;
    prefsHydrated.current = true;
    const meta = user.user_metadata || {};
    if(meta.theme === "dark" || meta.theme === "light") setTheme(meta.theme);
    if(typeof meta.tipsEnabled === "boolean") setTipsEnabled(meta.tipsEnabled);
    if(typeof meta.avatarCardId === "string" || meta.avatarCardId === null) setAvatarCardId(meta.avatarCardId);
  }, [user]);

  // After hydration, write any change back to user_metadata. Debounced to a
  // microtask so flipping a toggle is one round-trip, not three.
  useEffect(() => {
    if(!user || !prefsHydrated.current) return;
    const t = setTimeout(() => {
      sbClient.auth.updateUser({data: {theme, tipsEnabled, avatarCardId}}).catch(e =>
        console.error("user prefs sync failed:", e));
    }, 250);
    return () => clearTimeout(t);
  }, [user, theme, tipsEnabled, avatarCardId]);

  // Mirror the chosen avatar card's image URL into public.profiles so other
  // users see it on shared decks / creator profiles. Google avatar URLs are
  // intentionally NOT used — only card images you've explicitly picked.
  useEffect(() => {
    if(!user || !prefsHydrated.current) return;
    let avatarImageUrl = null;
    if(avatarCardId && raw && raw.length){
      const card = raw.find(r => r.card_id === avatarCardId);
      avatarImageUrl = (card && (card.img_small || card.img_normal)) || null;
    }
    sbClient.from("profiles").update({avatar_url: avatarImageUrl})
      .eq("user_id", user.id)
      .then(({error}) => { if(error) console.warn("profile avatar sync failed:", error.message); });
    // Reflect locally so the avatar shows up in the settings popover
    // (avatarSrc reads from profile when card_id isn't loaded yet).
    setProfile(p => p ? {...p, avatar_url: avatarImageUrl} : p);
  }, [user, avatarCardId, raw]);

  // Fetch the user's collection whenever they sign in/out. PostgREST caps
  // responses at ~1000 rows by default; a CSV-imported collection routinely
  // exceeds that (Normal + Foil per card across multiple sets). We page
  // through with .range() until we've seen everything — without this the
  // App silently truncates and rows beyond row 1000 "disappear on refresh".
  useEffect(()=>{
    if(!user){ setCollection({}); setCollectionLoading(false); return; }
    let cancelled = false;
    setCollectionLoading(true);
    (async ()=>{
      const all = [];
      const PAGE = 1000;
      let from = 0;
      while(true){
        const {data, error} = await sbClient
          .from("collection_items")
          .select("card_id,printing,quantity")
          .eq("condition","NM")
          .order("card_id", {ascending:true})
          .range(from, from + PAGE - 1);
        if(error){
          console.error("collection fetch failed:", error);
          setCollectionLoading(false);
          return;
        }
        if(cancelled) return;
        const batch = data || [];
        all.push(...batch);
        if(batch.length < PAGE) break;
        from += PAGE;
      }
      const map = {};
      for(const row of all){
        map[row.card_id+":"+row.printing] = (map[row.card_id+":"+row.printing]||0) + row.quantity;
      }
      setCollection(map);
      setCollectionLoading(false);
    })();
    return ()=>{ cancelled = true; };
  },[user]);

  // Sealed-product collection fetch — same paginated pattern as cards.
  // No printing dimension (sealed is always "Normal" effectively), so the
  // local key is just the product_id. Silently no-ops if the table isn't
  // deployed yet (17_sealed_collection_items.sql).
  useEffect(()=>{
    if(!user){ setSealedCollection({}); return; }
    let cancelled = false;
    (async ()=>{
      const all = [];
      const PAGE = 1000;
      let from = 0;
      while(true){
        const {data, error} = await sbClient
          .from("sealed_collection_items")
          .select("tcgplayer_product_id,quantity")
          .eq("condition","NM")
          .order("tcgplayer_product_id", {ascending:true})
          .range(from, from + PAGE - 1);
        if(error){
          // Table not deployed yet, or transient error — leave the map
          // empty rather than crashing. Console logs the reason for ops.
          console.warn("sealed collection fetch failed (run supabase/17_*.sql?):", error.message || error);
          return;
        }
        if(cancelled) return;
        const batch = data || [];
        all.push(...batch);
        if(batch.length < PAGE) break;
        from += PAGE;
      }
      const map = {};
      for(const row of all){
        map[row.tcgplayer_product_id] = (map[row.tcgplayer_product_id] || 0) + row.quantity;
      }
      setSealedCollection(map);
    })();
    return ()=>{ cancelled = true; };
  }, [user]);

  // Optimistically bump local state, then persist to Supabase.
  const updateSealedQty = useCallback(async (productId, newQty)=>{
    if(!user || productId == null) return;
    const pid = parseInt(productId, 10);
    setSealedCollection(c=>{
      const next = {...c};
      if(newQty<=0) delete next[pid];
      else next[pid] = newQty;
      return next;
    });
    try {
      if(newQty<=0){
        await sbClient.from("sealed_collection_items").delete()
          .eq("user_id", user.id).eq("tcgplayer_product_id", pid)
          .eq("condition","NM");
      } else {
        await sbClient.from("sealed_collection_items").upsert({
          user_id:user.id, tcgplayer_product_id:pid, condition:"NM", quantity:newQty,
        }, {onConflict:"user_id,tcgplayer_product_id,condition"});
      }
    } catch(e){
      console.error("sealed collection update failed:", e);
    }
  }, [user]);

  // Optimistically bump local state, then persist to Supabase. Calling with
  // newQty<=0 deletes the row; otherwise upserts.
  const updateQty = useCallback(async (cardId, printing, newQty)=>{
    if(!user || !cardId || !printing) return;
    const key = cardId+":"+printing;
    setCollection(c=>{
      const next = {...c};
      if(newQty<=0) delete next[key];
      else next[key] = newQty;
      return next;
    });
    try {
      if(newQty<=0){
        await sbClient.from("collection_items").delete()
          .eq("user_id", user.id).eq("card_id", cardId)
          .eq("printing", printing).eq("condition","NM");
      } else {
        await sbClient.from("collection_items").upsert({
          user_id:user.id, card_id:cardId, printing:printing, condition:"NM", quantity:newQty,
        }, {onConflict:"user_id,card_id,printing,condition"});
      }
    } catch(e){
      console.error("collection update failed:", e);
    }
  }, [user]);

  // CSV import path. Optimistically updates local state, then chunks the
  // supabase upsert so a 5000-row import doesn't blow PostgREST's body size
  // limit. The supabase-js client returns {error} rather than throwing — we
  // explicitly check it and roll back the optimistic update on any failure
  // so the UI never claims success when the server actually rejected.
  const BULK_UPSERT_CHUNK = 500;
  const bulkUpdateCollection = useCallback(async (updates) => {
    if(!user || !updates.length) return {ok:true, written:0};
    const prevCollection = collection;
    setCollection(c=>{
      const next = {...c};
      for(const {cardId, printing, qty} of updates){
        const key = cardId+":"+printing;
        if(qty<=0) delete next[key];
        else next[key] = qty;
      }
      return next;
    });
    // Dedupe by (card_id, printing) — Postgres rejects an ON CONFLICT batch
    // containing two rows that resolve to the same conflict target with
    // "cannot affect row a second time". CSVs with fuzzy-matched name
    // collisions (e.g. two source names squashing to the same card) hit
    // this. Last write wins.
    const dedup = new Map();
    for(const u of updates){
      if(u.qty <= 0) continue;
      dedup.set(u.cardId + "|" + u.printing, u);
    }
    const toUpsert = Array.from(dedup.values()).map(u => ({
      user_id:user.id, card_id:u.cardId, printing:u.printing, condition:"NM", quantity:u.qty,
    }));
    let written = 0;
    for(let i=0; i<toUpsert.length; i+=BULK_UPSERT_CHUNK){
      const chunk = toUpsert.slice(i, i+BULK_UPSERT_CHUNK);
      // .select() forces PostgREST to return the actual persisted rows.
      // Without it, RLS / trigger filtering is invisible — the client gets
      // {error:null} even when zero rows were written. We compare returned
      // count to sent count and treat any mismatch as a hard error so the
      // optimistic state doesn't lie to the user.
      const {data, error} = await sbClient
        .from("collection_items")
