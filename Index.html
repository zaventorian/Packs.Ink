<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorcana Expected Value Calculator — Ink & Lore</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1eb;
  --bg-surface: rgba(0,0,0,0.03);
  --bg-surface-hover: rgba(0,0,0,0.05);
  --bg-card: #fff;
  --border: rgba(0,0,0,0.08);
  --border-accent: rgba(160,130,60,0.2);
  --text: #1a1a1a;
  --text-muted: rgba(0,0,0,0.35);
  --text-dim: rgba(0,0,0,0.55);
  --accent: #8a6d1b;
  --accent-glow: rgba(138,109,27,0.08);
  --green: #166534;
  --red: #991b1b;
  --stat-bg: rgba(0,0,0,0.03);
  --table-header: rgba(0,0,0,0.02);
  --table-row-hover: rgba(0,0,0,0.02);
  --btn-bg: transparent;
  --btn-border: rgba(0,0,0,0.12);
  --btn-text: rgba(0,0,0,0.55);
  --btn-active-bg: rgba(138,109,27,0.1);
  --btn-active-text: #8a6d1b;
  --btn-active-border: rgba(138,109,27,0.3);
  --mode: light;
  --tooltip-bg: #fff;
  --tooltip-border: rgba(0,0,0,0.12);
  --tooltip-shadow: 0 4px 16px rgba(0,0,0,0.12);
  --heatmap-text-hi: #412402;
  --heatmap-text-lo: rgba(0,0,0,0.3);
  --heatmap-color: rgba(138,109,27,VAL);
}
html[data-theme="dark"] {
  --bg: #0d0f14;
  --bg-surface: rgba(255,255,255,0.04);
  --bg-surface-hover: rgba(255,255,255,0.07);
  --bg-card: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --border-accent: rgba(200,170,100,0.25);
  --text: #e8e4dc;
  --text-muted: rgba(255,255,255,0.35);
  --text-dim: rgba(255,255,255,0.5);
  --accent: #c8a846;
  --accent-glow: rgba(200,168,70,0.15);
  --green: #5cb87a;
  --red: #d45c5c;
  --stat-bg: rgba(255,255,255,0.05);
  --table-header: rgba(255,255,255,0.03);
  --table-row-hover: rgba(255,255,255,0.03);
  --btn-bg: transparent;
  --btn-border: rgba(255,255,255,0.12);
  --btn-text: rgba(255,255,255,0.6);
  --btn-active-bg: rgba(200,168,70,0.12);
  --btn-active-text: #c8a846;
  --btn-active-border: rgba(200,168,70,0.3);
  --mode: dark;
  --tooltip-bg: #1a1c22;
  --tooltip-border: rgba(255,255,255,0.1);
  --tooltip-shadow: 0 4px 16px rgba(0,0,0,0.4);
  --heatmap-text-hi: #f0e0a0;
  --heatmap-text-lo: rgba(255,255,255,0.25);
  --heatmap-color: rgba(200,168,70,VAL);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Nunito Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);padding:1.5rem;max-width:1300px;margin:0 auto;min-height:100vh;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:var(--bg);}
body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:0.5;background:
  radial-gradient(ellipse 600px 600px at 10% 20%, rgba(200,168,70,0.04) 0%, transparent 70%),
  radial-gradient(ellipse 500px 500px at 85% 70%, rgba(100,140,220,0.04) 0%, transparent 70%),
  radial-gradient(ellipse 400px 400px at 50% 50%, rgba(160,80,180,0.03) 0%, transparent 70%);pointer-events:none;}
.ink-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
h1,h2,h3,.title-font{font-family:'Cinzel',serif;}
table{border-collapse:collapse;width:100%;}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;}
th{font-weight:500;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;background:var(--table-header);text-align:right;}
th:first-child,td:first-child{text-align:left;}
td{text-align:right;}
tr:hover{background:var(--table-row-hover);}
button{cursor:pointer;border:1px solid var(--btn-border);background:var(--btn-bg);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--btn-text);font-family:'Nunito Sans',sans-serif;transition:all 0.15s ease;}
button:hover{background:var(--bg-surface-hover);}
button.active{background:var(--btn-active-bg);color:var(--btn-active-text);border-color:var(--btn-active-border);}
button:disabled{opacity:0.3;cursor:not-allowed;}
select{border:1px solid var(--btn-border);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif;}
select option{background:var(--bg);color:var(--text);}
input[type="checkbox"]{accent-color:var(--accent);}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;}
.stat{background:var(--stat-bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.stat .lbl{font-size:11px;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.3px;}
.stat .val{font-size:16px;font-weight:600;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:4px;transition:border-color 0.15s;}
.card:hover{border-color:var(--border-accent);}
.badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;display:inline-block;white-space:nowrap;letter-spacing:0.3px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:1rem;}
.scr{overflow-x:auto;}
.green{color:var(--green);} .red{color:var(--red);} .muted{color:var(--text-muted);}
.card-img{width:100%;border-radius:6px;aspect-ratio:5/7;object-fit:cover;background:var(--bg-surface);}
.card-img-placeholder{width:100%;border-radius:6px;aspect-ratio:5/7;background:var(--bg-surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;}
.progress-bar{width:100%;height:4px;background:var(--bg-surface);border-radius:2px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#d4b85a);transition:width 0.3s ease;border-radius:2px;}
@keyframes glimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
.glimmer-text{background:linear-gradient(90deg,var(--accent) 0%,#f0d878 25%,var(--accent) 50%,#f0d878 75%,var(--accent) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glimmer 3s linear infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-100vh) rotate(360deg);opacity:0;}}
.glimmer-particle{position:fixed;width:3px;height:3px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:-1;box-shadow:0 0 6px var(--accent),0 0 12px rgba(200,168,70,0.3);}
.footer{margin-top:3rem;padding:1.5rem 0;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:16px;}
.footer-logo{height:36px;opacity:0.85;border-radius:4px;}
.footer-text{text-align:right;line-height:1.6;}
.footer-brand{font-family:'Cinzel',serif;font-size:13px;color:var(--accent);font-weight:600;}
.footer-credit{font-size:11px;color:var(--text-muted);}
.footer-social a{font-size:11px;color:var(--accent);text-decoration:none;opacity:0.8;}
.footer-social a:hover{opacity:1;text-decoration:underline;}
.theme-toggle{cursor:pointer;background:none;border:1px solid var(--btn-border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-dim);padding:0;transition:all 0.15s;}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
/* Tooltip */
.tip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help;}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--btn-border);font-size:10px;font-weight:600;color:var(--text-muted);margin-left:4px;flex-shrink:0;}
.tip-wrap:hover .tip-icon{border-color:var(--accent);color:var(--accent);}
.tip-box{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:240px;padding:10px 12px;background:var(--tooltip-bg);border:1px solid var(--tooltip-border);border-radius:8px;box-shadow:var(--tooltip-shadow);font-size:12px;line-height:1.5;color:var(--text);z-index:100;pointer-events:none;text-align:left;font-weight:400;}
.tip-wrap:hover .tip-box{display:block;}
@media(max-width:600px){.tip-box{left:auto;right:0;transform:none;width:200px;}}
/* Best card highlight */
.best-card-display{background:var(--bg-card);border:1px solid var(--border-accent);border-radius:10px;padding:12px;text-align:center;max-width:180px;}
.best-card-display img{width:100%;border-radius:6px;margin-bottom:6px;}
/* FAQ */
.faq-section{max-width:720px;}
.faq-section h2{font-size:16px;font-weight:600;color:var(--accent);margin:1.5rem 0 0.5rem;}
.faq-section p,.faq-section li{font-size:13px;line-height:1.7;color:var(--text-dim);}
.faq-section strong{color:var(--text);font-weight:600;}
</style>
</head>

// PostgREST paginates at ~1000 rows by default. fetchAll loops with Range
// headers until we've drained the table.
async function sbFetchAll(path, params){
  const out=[]; const pageSize=1000; let start=0;
  while(true){
    const url = SUPABASE_URL+"/rest/v1/"+path+"?"+(new URLSearchParams(params)).toString();
    const r = await fetch(url,{headers:{...SB_HEADERS,"Range-Unit":"items","Range":start+"-"+(start+pageSize-1)}});
    if(!r.ok && r.status!==206) throw new Error("Supabase "+r.status+": "+await r.text());
    const chunk = await r.json();
    out.push(...chunk);
    if(chunk.length<pageSize) return out;
    start += pageSize;
  }
}

const getBadgeStyle = (r,t) => (t==="dark"?BDGE_DARK:BDGE_LIGHT)[r] || (t==="dark"?BDGE_DARK:BDGE_LIGHT)["Common"];

const normalizeRarity = r => {
  if(!r) return r;
  const m={"super_rare":"Super Rare","Super_rare":"Super Rare","common":"Common","Common":"Common","uncommon":"Uncommon","Uncommon":"Uncommon","rare":"Rare","Rare":"Rare","legendary":"Legendary","Legendary":"Legendary","enchanted":"Enchanted","Enchanted":"Enchanted","epic":"Epic","Epic":"Epic","iconic":"Iconic","Iconic":"Iconic","promo":"Promo","Promo":"Promo"};
  return m[r]||r;
};

const getInk = n => { if(!n||isNaN(n)) return null; const i=Math.floor((n-1)/34); return i>=0&&i<6?INKS[i]:null; };
const getRarKey = (r,p) => {
  if(!r) return null; r=r.trim(); p=(p||"").trim();
  if(["Enchanted","Epic","Iconic"].includes(r)) return r;
  if(p==="Cold Foil"||p==="Foil") return r+" Foil";
  if(p==="Normal") return r;
  return null;
};
const parseP = s => { if(s==null||s===undefined) return null; if(typeof s==="number") return s; const n=parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; };
const fmt = n => n==null?"\u2014":"$"+n.toFixed(2);
const pick = a => a?.length?a[Math.floor(Math.random()*a.length)]:null;
const wPick = opts => {
  const av=opts.filter(o=>o.p?.length); if(!av.length) return null;
  let r=Math.random()*av.reduce((s,o)=>s+o.w,0);
  for(const o of av){r-=o.w; if(r<=0) return o.p;} return av[av.length-1].p;
};

// Map a TCGCSV printing label to the site's expected printing string.
// For Enchanted/Epic/Iconic the site only expects "Cold Foil" rows.
const mapPrinting = (rar, tcgPrinting) => {
  if(["Enchanted","Epic","Iconic"].includes(rar)) return "Cold Foil";
  if(tcgPrinting==="Normal") return "Normal";
  return "Cold Foil"; // covers both "Cold Foil" and "Holofoil"
};

// Build site-shape rows from Supabase card_prices_latest view + set name lookup.
// Output row shape matches the legacy Lorcast transform so downstream code
// doesn't need to change.
const transformSupabaseData = (priceRows, setNameById) => {
  const rows = [];
  for(const r of priceRows) {
    const rar = normalizeRarity(r.rarity);
    if(rar==="Promo") continue;
    const setName = setNameById[r.set_id] || "";
    if(!setName) continue;
    const name = r.version ? r.name+" - "+r.version : r.name;
    // Primary price = Low (live ask). Fall back to Market if Low is null.
    const price = parseP(r.low_price) ?? parseP(r.market_price);
    if(price==null) continue;
    rows.push({
      "Set":setName,
      "Product Name":name,
      "Rarity":rar,
      "Printing":mapPrinting(rar, r.printing),
      "Market Price":price,
      "Low Price":parseP(r.low_price),
      "TCGPlayer Market":parseP(r.market_price),
      "Number":r.collector_number||"",
      "img_small":r.image_small,
      "img_normal":r.image_normal,
      "img_large":r.image_large,
      "ink":r.ink||null,
    });
  }
  return rows;
};

const buildPools = (data, set) => {
  const p={byInk:{Amber:[],Amethyst:[],Emerald:[],Ruby:[],Sapphire:[],Steel:[]},unc:[],rar:[],sr:[],leg:[],cF:[],uF:[],rF:[],srF:[],lF:[],enc:[],epi:[],ico:[]};
  for(const row of data){
    if((row["Set"]||"").trim()!==set) continue;
    const name=(row["Product Name"]||"").trim(),rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim(),price=parseP(row["Market Price"]);
    const num=parseInt((row["Number"]||"").split("/")[0]),ink=row["ink"]||null;
    const c={name,rarity:rar,printing:pr,price,num,img_small:row["img_small"],img_normal:row["img_normal"],img_large:row["img_large"],ink:ink};
    if(rar==="Enchanted"){p.enc.push(c);continue;} if(rar==="Epic"){p.epi.push(c);continue;} if(rar==="Iconic"){p.ico.push(c);continue;}
    if(pr==="Normal"){
      const ci=ink||getInk(num);
      if(rar==="Common"&&ci) p.byInk[ci].push(c); else if(rar==="Uncommon") p.unc.push(c); else if(rar==="Rare") p.rar.push(c); else if(rar==="Super Rare") p.sr.push(c); else if(rar==="Legendary") p.leg.push(c);
    } else if(pr==="Cold Foil"||pr==="Foil"){
      if(rar==="Common") p.cF.push(c); else if(rar==="Uncommon") p.uF.push(c); else if(rar==="Rare") p.rF.push(c); else if(rar==="Super Rare") p.srF.push(c); else if(rar==="Legendary") p.lF.push(c);
    }
  }
  return p;
};

const simPack = (pools,pull) => {
  const cards=[];
  for(const ink of INKS){const c=pick(pools.byInk[ink]);if(c) cards.push(c);}
  for(let i=0;i<3;i++){const c=pick(pools.unc);if(c) cards.push(c);}
  for(let i=0;i<2;i++){const pool=wPick([{p:pools.rar,w:pull["Rare"]},{p:pools.sr,w:pull["Super Rare"]},{p:pools.leg,w:pull["Legendary"]}]);const c=pick(pool);if(c) cards.push(c);}
  const fp=wPick([{p:pools.cF,w:pull["Common Foil"]},{p:pools.uF,w:pull["Uncommon Foil"]},{p:pools.rF,w:pull["Rare Foil"]},{p:pools.srF,w:pull["Super Rare Foil"]},{p:pools.lF,w:pull["Legendary Foil"]},{p:pools.enc,w:pull["Enchanted"]},{p:pools.epi,w:pull["Epic"]},{p:pools.ico,w:pull["Iconic"]}]);
  const fc=pick(fp);if(fc) cards.push(fc);
  return cards;
};

const processData = raw => {
  const grp={},sSet=new Set();
  for(const row of raw){
    const set=(row["Set"]||"").trim(),rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim(),price=parseP(row["Market Price"]);
    if(!set||!rar||price==null) continue;
    const key=getRarKey(rar,pr);if(!key) continue;
    sSet.add(set);
    if(!grp[set]) grp[set]={};if(!grp[set][key]) grp[set][key]=[];grp[set][key].push(price);
  }
  const avgs={};
  for(const [s,rm] of Object.entries(grp)){avgs[s]={};for(const [r,prices] of Object.entries(rm)){avgs[s][r]={avg:prices.reduce((a,b)=>a+b,0)/prices.length,avgNC:prices.map(p=>p<1?0:p).reduce((a,b)=>a+b,0)/prices.length};}}
  const filt=Array.from(sSet).filter(s=>!isExcluded(s));
  const sets=[...SET_ORDER.filter(s=>filt.includes(s)),...filt.filter(s=>!SET_ORDER.includes(s)).sort()];
  return {sets,avgs};
};

const calcEV = (avgs,set,nc,ne) => {
  const d=avgs[set]||{},pull=getPull(set);let ev=0;
  for(const r of RARS){const rate=pull[r],rd=d[r];if(!rd) continue;if(ne&&NO_ENCH.has(r)) continue;ev+=(nc?rd.avgNC:rd.avg)*rate;}
  return ev;
};

function Histogram({data}){
  const ents=Object.entries(data.buckets).sort(([a],[b])=>+a-+b);const maxC=Math.max(...ents.map(([,c])=>c));
  const bw=Math.max(4,Math.min(22,Math.floor(560/ents.length))),H=100,skip=Math.max(1,Math.ceil(ents.length/10));
  return html`<div><div class="muted" style=${{fontSize:11,marginBottom:6}}>Distribution across ${data.n.toLocaleString()} simulated boxes</div>
    <div class="scr"><svg width=${ents.length*(bw+2)+10} height=${H+28} style=${{display:"block"}}>
      ${ents.map(([b,c],i)=>{const bh=Math.max(2,(c/maxC)*H),x=i*(bw+2),near=Math.abs(+b-data.mean)<15;
        return html`<g key=${b}><rect x=${x} y=${H-bh} width=${bw} height=${bh} fill=${near?"var(--accent)":"rgba(200,168,70,0.25)"} rx="2"/>
          ${i%skip===0&&html`<text x=${x+bw/2} y=${H+18} textAnchor="middle" fontSize="9" fill="var(--text-muted)">$${b}</text>`}</g>`;})}
      <line x1="0" y1=${H} x2=${ents.length*(bw+2)} y2=${H} stroke="var(--border)" strokeWidth="0.5"/></svg></div>
    <div class="muted" style=${{fontSize:11,marginTop:4}}>Dark = near mean (${fmt(data.mean)}). ${((data.totals.filter(t=>t>=100).length/data.n)*100).toFixed(1)}% of boxes hit $100+.</div></div>`;
}

function BoxSim({rawData,sets,theme}){
  const [s,setS]=useState("");const [res,setRes]=useState(null);const [boxHist,setBoxHist]=useState([]);
  const [n,setN]=useState(1000);const [running,setRunning]=useState(false);const [dist,setDist]=useState(null);
  const pools=useMemo(()=>s?buildPools(rawData,s):null,[rawData,s]);
  const bestBox = useMemo(()=>boxHist.length?boxHist.reduce((best,b)=>b.total>best.total?b:best,boxHist[0]):null,[boxHist]);
  const openBox=()=>{
    if(!pools) return;
    const pull=getPull(s);
    const all=[];for(let i=0;i<24;i++) all.push(...simPack(pools,pull));
    const total=all.reduce((t,c)=>t+(c.price||0),0);
    const best=all.reduce((b,c)=>(!b||(c.price||0)>(b.price||0))?c:b,null);
    const rc={};for(const c of all){const k=c.printing==="Cold Foil"||c.printing==="Foil"?c.rarity+" Foil":c.rarity;rc[k]=(rc[k]||0)+1;}
    const entry={total,best,rc,num:boxHist.length+1};
    setRes(entry);setBoxHist(h=>[...h,entry]);setDist(null);
  };
  const runSim=()=>{
    if(!pools) return;setRunning(true);
    setTimeout(()=>{
      const pull=getPull(s);
      const tots=[];for(let b=0;b<n;b++){let t=0;for(let p=0;p<24;p++) for(const c of simPack(pools,pull)) t+=(c.price||0);tots.push(t);}
      tots.sort((a,b)=>a-b);
      const mean=tots.reduce((a,b)=>a+b,0)/tots.length,median=tots[Math.floor(tots.length/2)];
      const bs=10,minB=Math.floor(tots[0]/bs)*bs,maxB=Math.ceil(tots[tots.length-1]/bs)*bs;
      const bkts={};for(let b=minB;b<=maxB;b+=bs) bkts[b]=0;
      for(const t of tots){const b=Math.floor(t/bs)*bs;bkts[b]=(bkts[b]||0)+1;}
      setDist({totals:tots,mean,median,min:tots[0],max:tots[tots.length-1],buckets:bkts,n});setRunning(false);
    },50);
  };
  return html`<div>
    <div class="row">
      <${SetSel} val=${s} onChange=${v=>{setS(v);setRes(null);setBoxHist([]);setDist(null);}} placeholder="Select a set..." sets=${sets}/>
      <button onClick=${openBox} disabled=${!s} class=${s?"active":""}>${boxHist.length===0?"Open a box":"Open another"}</button>
      ${boxHist.length>0&&html`<button onClick=${()=>{setRes(null);setBoxHist([]);setDist(null);}} style=${{color:"var(--text-muted)",border:"1px solid var(--border)"}}>Reset</button>`}
    </div>
    ${boxHist.length>0&&html`<div style=${{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1rem"}}>
      <${Stat} label="Boxes opened" value=${boxHist.length}/>
      <${Stat} label="Avg box" value=${fmt(boxHist.reduce((a,b)=>a+b.total,0)/boxHist.length)}/>
      <${Stat} label="Best box" value=${fmt(bestBox?.total)} accent="var(--green)"/>
      <${Stat} label="Total spent" value=${fmt(boxHist.length*109.99)}/>
    </div>`}
    ${res&&html`<div style=${{marginBottom:"1.5rem"}}>
      <div class="muted" style=${{fontSize:11,marginBottom:8}}>Box #${res.num} \u2014 ${s}</div>
      <div style=${{display:"flex",gap:16,flexWrap:"wrap"}}>
        <div style=${{flex:1,minWidth:200}}>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
            <${Stat} label="Box total" value=${fmt(res.total)} accent=${res.total>=100?"var(--green)":null}/>
            <${Stat} label="Best pull" value=${(res.best?.name||"").substring(0,24)}/>
            <${Stat} label="Best card $" value=${fmt(res.best?.price)} accent=${res.best?.price>=10?"var(--green)":null}/>
          </div>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(145px,1fr))",gap:5}}>
            ${RARS.flatMap(r=>[r,r+" Foil"]).filter(k=>res.rc[k]).map(k=>{
              const b=k.replace(" Foil",""),st=getBadgeStyle(b,theme),foil=k.includes("Foil");
              return html`<div class="card" key=${k} style=${{flexDirection:"row",alignItems:"center",padding:"5px 10px"}}>
                <span class="badge" style=${{background:st.bg,color:st.fg,fontSize:9}}>${foil?"\u2726 ":""}${k}</span>
                <span style=${{marginLeft:"auto",fontWeight:600}}>${res.rc[k]}</span>
              </div>`;
            })}
          </div>
        </div>
        ${res.best&&(res.best.img_small||res.best.img_normal)&&html`<div class="best-card-display">
          <div style=${{fontSize:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Best Pull</div>
          <img src=${res.best.img_normal||res.best.img_small} alt=${res.best.name} style=${{width:"100%",borderRadius:6}}/>
          <div style=${{fontSize:12,fontWeight:600,marginTop:6}}>${res.best.name}</div>
          <div style=${{fontSize:14,fontWeight:600,color:"var(--green)"}}>${fmt(res.best.price)}</div>
          <${Badge} rarity=${res.best.rarity} foil=${res.best.printing==="Cold Foil"} theme=${theme}/>
        </div>`}
      </div>
    </div>`}
    ${boxHist.length>1&&html`<div style=${{marginBottom:"1.5rem"}}>
      <div style=${{fontWeight:600,fontSize:13,marginBottom:8,fontFamily:"'Cinzel',serif"}}>Box History</div>
      <div class="scr"><table>
        <thead><tr><th>Box #</th><th>Total</th><th>Best Pull</th><th>Best Card $</th></tr></thead>
        <tbody>${boxHist.slice().reverse().map(b=>html`<tr key=${b.num} style=${{background:b===bestBox?"var(--accent-glow)":"inherit"}}>
          <td style=${{fontWeight:500}}>Box #${b.num}${b===bestBox?" \u2B50":""}</td>
          <td style=${{color:b.total>=100?"var(--green)":"inherit"}}>${fmt(b.total)}</td>
          <td style=${{textAlign:"left",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${b.best?.name||"\u2014"}</td>
          <td style=${{color:b.best?.price>=10?"var(--green)":"inherit"}}>${fmt(b.best?.price)}</td>
        </tr>`)}</tbody>
      </table></div>
    </div>`}
    ${s&&html`<div style=${{borderTop:"1px solid var(--border)",paddingTop:"1.5rem"}}>
      <div style=${{fontWeight:600,marginBottom:"0.75rem",fontFamily:"'Cinzel',serif"}}>Monte Carlo Simulation</div>
      <div class="row">
        <select value=${n} onChange=${e=>setN(+e.target.value)} style=${{width:160}}>
          ${[100,500,1000,5000].map(v=>html`<option key=${v} value=${v}>${v.toLocaleString()} boxes</option>`)}
        </select>
        <button onClick=${runSim} disabled=${running} class="active">${running?"Running...":"Run simulation"}</button>
      </div>
      ${dist&&html`<div>
        <div style=${{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1rem"}}>
          <${Stat} label="Mean" value=${fmt(dist.mean)}/><${Stat} label="Median" value=${fmt(dist.median)}/>
          <${Stat} label="Min" value=${fmt(dist.min)}/><${Stat} label="Max" value=${fmt(dist.max)} accent="var(--green)"/>
        </div>
        <${Histogram} data=${dist}/>
      </div>`}
    </div>`}
  </div>`;
}

function CompareView({sets,avgs}){
  const [a,setA]=useState("");const [b,setB]=useState("");
  return html`<div><div class="row"><${SetSel} val=${a} onChange=${setA} placeholder="Set A..." sets=${sets}/><span class="muted">vs</span><${SetSel} val=${b} onChange=${setB} placeholder="Set B..." sets=${sets}/></div>
    ${a&&b&&html`<div class="scr"><table>
      <thead><tr><th>Rarity</th><th>Pull rate</th><th style=${{minWidth:90,whiteSpace:"nowrap"}}>${a}</th><th style=${{minWidth:90,whiteSpace:"nowrap"}}>${b}</th><th>Diff (A\u2212B)</th></tr></thead>
      <tbody>
        ${RARS.map(r=>{const dA=(avgs[a]||{})[r],dB=(avgs[b]||{})[r],vA=dA?.avg,vB=dB?.avg,diff=vA!=null&&vB!=null?vA-vB:null;
          return html`<tr key=${r}><td style=${{fontWeight:500,textAlign:"left"}}>${r}</td><td class="muted">${PULL[r]}</td>
            <td style=${{fontWeight:diff>0?600:400,color:diff>0?"var(--green)":diff<0?"var(--red)":"inherit"}}>${fmt(vA)}</td>
            <td style=${{fontWeight:diff<0?600:400,color:diff<0?"var(--green)":diff>0?"var(--red)":"inherit"}}>${fmt(vB)}</td>
            <td style=${{color:diff==null?"var(--text-muted)":diff>0?"var(--green)":"var(--red)"}}>${diff==null?"\u2014":diff>0?"+"+fmt(diff):fmt(diff)}</td></tr>`;
        })}
        ${(()=>{const evA=calcEV(avgs,a,false,false),evB=calcEV(avgs,b,false,false),diff=evA-evB;
          return html`<tr style=${{borderTop:"2px solid var(--border)"}}><td style=${{fontWeight:600,color:"var(--text-dim)",textAlign:"left"}}>EV / box</td><td class="muted">\u2014</td>
            <td style=${{fontWeight:600,color:diff>0?"var(--green)":"inherit"}}>${fmt(evA)}</td>
            <td style=${{fontWeight:600,color:diff<0?"var(--green)":"inherit"}}>${fmt(evB)}</td>
            <td style=${{fontWeight:600,color:diff>0?"var(--green)":"var(--red)"}}>${diff>0?"+"+fmt(diff):fmt(diff)}</td></tr>`;})()}
      </tbody></table></div>`}
  </div>`;
}

function HeatmapView({sets,avgs}){
  const rows=useMemo(()=>sets.map(s=>{const d=avgs[s]||{},tot=RARS.reduce((t,r)=>t+(d[r]?.avg||0)*PULL[r],0);const c={};for(const r of RARS) c[r]=tot>0?((d[r]?.avg||0)*PULL[r]/tot)*100:0;return {s,c};}),[sets,avgs]);
  const cs={padding:"5px 7px",fontSize:11,textAlign:"center",border:"1px solid var(--border)"};
  return html`<div>
    <p class="muted" style=${{fontSize:12,marginBottom:"1rem"}}>% of box EV from each rarity. Darker = higher contribution.</p>
    <div class="scr"><table style=${{borderCollapse:"collapse"}}><thead><tr>
      <th style=${{...cs,textAlign:"left",minWidth:100,whiteSpace:"nowrap"}}>Set</th>
      ${RARS.map(r=>html`<th key=${r} style=${{...cs,minWidth:52,fontSize:10}}>${r}</th>`)}</tr></thead>
      <tbody>${rows.map(({s,c})=>html`<tr key=${s}>
        <td style=${{...cs,textAlign:"left",fontWeight:500,whiteSpace:"nowrap",background:"var(--table-header)"}}>${s}</td>
        ${RARS.map(r=>{const pct=c[r]||0,int=Math.min(1,pct/40);
          return html`<td key=${r} style=${{...cs,background:pct<0.5?"transparent":"rgba(200,168,70,"+(0.08+int*0.55).toFixed(2)+")",
            color:int>0.5?"var(--heatmap-text-hi)":"var(--heatmap-text-lo)",fontWeight:int>0.6?600:400}}>${pct<0.5?"":pct.toFixed(1)+"%"}</td>`;})}
      </tr>`)}</tbody></table></div></div>`;
}

function FAQView(){
  return html`<div class="faq-section">
    <h2>What is this?</h2>
    <p>This tool calculates the <strong>Expected Value (EV)</strong> of opening Disney Lorcana booster boxes and packs. It uses live market prices from <strong>TCGPlayer</strong> (via the Lorcast API, updated daily) and known pull rates to estimate how much value you can expect from a box or pack on average.</p>

    <h2>How does it work?</h2>
    <p>Each booster pack contains 12 cards with a specific distribution: 6 commons (one per ink color), 3 uncommons, 2 rare-or-higher cards, and 1 foil slot. The EV is calculated by multiplying the <strong>average market price</strong> of each rarity by the <strong>number of cards of that rarity per box</strong> (24 packs), then summing everything up.</p>
    <p>For example, if the average Legendary card in a set is worth $5.00 and you pull 4 Legendaries per box on average, that rarity contributes $20 to the box EV.</p>

    <h2>What do the tabs do?</h2>
    <p><strong>EV / Box</strong> \u2014 Shows the total expected value per box and per pack for each set, side by side.</p>
    <p><strong>Average Card Prices</strong> \u2014 Shows the average market price of each rarity across all sets. Useful for seeing which sets have the most valuable commons, rares, enchanteds, etc.</p>
    <p><strong>Pack Sim</strong> \u2014 Simulates opening a single pack using real pull rate probabilities. Shows card images and tracks stats across multiple openings.</p>
    <p><strong>Box Sim</strong> \u2014 Simulates opening an entire box (24 packs). Shows your best pull with card art, tracks your box history, and highlights your best box. Also includes a Monte Carlo simulation that runs thousands of box openings to show the statistical distribution of outcomes.</p>
    <p><strong>Compare</strong> \u2014 Compare two sets side-by-side to see which has higher average card values at each rarity and overall EV.</p>
    <p><strong>Heatmap</strong> \u2014 Shows what percentage of each set's total EV comes from each rarity tier. Helps you understand where the value is concentrated\u2014for example, whether a set's value is driven by Enchanteds or spread across lower rarities.</p>

    <h2>What does the "${" <$1\u2192$0"}" checkbox do?</h2>
    <p>When enabled, any card worth less than $1.00 is treated as worth $0.00 in the EV calculation. This gives a more realistic picture of "sellable" value, since bulk cards under a dollar are often not worth listing individually. Most collectors and sellers use this view to see the "real" EV after ignoring penny cards.</p>

    <h2>What does "No Ench/Iconic" do?</h2>
    <p>This removes Enchanted and Iconic cards from the EV calculation. Since these ultra-rare cards are extremely hard to pull (Enchanted: ~1 per 4 boxes, Iconic: ~1 per 71 boxes), they can inflate the EV significantly even though most box openings won't contain one. Toggling this on shows you the "base" EV you can expect without relying on hitting a jackpot card.</p>

    <h2>What are the pull rates?</h2>
    <p><strong>Sets 1–11</strong> (The First Chapter through Winterspell) per box (24 packs): 144 Commons, 72 Uncommons, ~32 Rares, 12 Super Rares, 4 Legendaries, 13 Common Foils, 6 Uncommon Foils, 3 Rare Foils, 1 Super Rare Foil, 0.5 Legendary Foils, 0.25 Enchanteds, 1.5 Epics, and ~0.014 Iconics.</p>
    <p><strong>Sets 12+</strong> (Wilds Unknown onward) per box (24 packs): 144 Commons, 72 Uncommons, ~30 Rares, 12 Super Rares, <strong>6 Legendaries</strong>, ~12.3 Common Foils, ~5.7 Uncommon Foils, 3 Rare Foils, 1 Super Rare Foil, 0.5 Legendary Foils, <strong>0.333 Enchanteds</strong>, <strong>2.5 Epics</strong>, and ~0.014 Iconics. The extra Legendaries come from the Rare slot, while the increased Enchanted and Epic rates are offset proportionally from Common and Uncommon Foil pulls.</p>
    <p>These are community-estimated averages and may vary.</p>

    <h2>Where does the pricing data come from?</h2>
    <p>All prices come from TCGPlayer market prices via the <strong>Lorcast API</strong> (lorcast.com). Prices are updated once per day. The prices shown are TCGPlayer "market price" which represents the recent average sale price.</p>

    <h2>About</h2>
    <p>This is an <strong>Ink & Lore</strong> project by <strong>Zaven Torian</strong>. Follow <a href="https://x.com/HighScoreZAP" target="_blank" rel="noopener" style=${{color:"var(--accent)"}}>@HighScoreZAP</a> on X for updates.</p>
  </div>`;
}

function SetDetail({data,mult,activeRars,theme}){
  const [rf,setRf]=useState(null);
  const cards=useMemo(()=>{
    let list=data.cards.filter(c=>activeRars.has(c.rarity));
    if(rf) list=list.filter(c=>c.rarity===rf);
    return list.sort((a,b)=>(b.price||0)-(a.price||0));
  },[data,activeRars,rf]);
  return html`<div style=${{padding:"12px 16px",background:"var(--bg-surface)",borderTop:"1px solid var(--border)"}}>
    <div style=${{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
      <button onClick=${()=>setRf(null)} class=${rf===null?"active":""} style=${{fontSize:11,padding:"3px 8px"}}>All</button>
      ${SET_RARS.filter(r=>activeRars.has(r)).map(r=>{const s=getBadgeStyle(r,theme);
        return html`<button key=${r} onClick=${()=>setRf(rf===r?null:r)}
          style=${{background:rf===r?s.bg:"transparent",color:rf===r?s.fg:"var(--btn-text)",
            border:rf===r?"1px solid "+(s.fg+"40"):"1px solid var(--btn-border)",fontSize:11,padding:"3px 8px",borderRadius:6}}>${r} (${data.byRar[r]?.count||0})</button>`;
      })}
    </div>
    <div style=${{maxHeight:400,overflowY:"auto"}}>
      <table><thead><tr><th style=${{textAlign:"left"}}>Card</th><th>Rarity</th><th>${mult===4?"Playset (4x)":"Price (1x)"}</th><th>Each</th></tr></thead>
        <tbody>${cards.map((c,i)=>html`<tr key=${i}>
          <td style=${{textAlign:"left",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            ${c.img_small?html`<img src=${c.img_small} alt="" style=${{width:24,height:34,borderRadius:3,verticalAlign:"middle",marginRight:6,objectFit:"cover"}}/>`:null}${c.name}
          </td>
          <td><${Badge} rarity=${c.rarity} theme=${theme}/></td>
          <td style=${{fontWeight:600}}>${fmt((c.price||0)*mult)}</td>
          <td class="muted">${fmt(c.price)}</td>
        </tr>`)}</tbody></table>
    </div>
    <div style=${{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:"var(--stat-bg)",border:"1px solid var(--border)",borderRadius:6,marginTop:8}}>
      <span style=${{color:"var(--text-dim)",fontSize:12}}>${cards.length} cards${rf?" ("+rf+")":""}</span>
      <span style=${{fontWeight:600}}>${fmt(cards.reduce((t,c)=>t+(c.price||0),0)*mult)}</span>
    </div>
  </div>`;
}

function SetValuesView({rawData,sets,theme}){
  const [mode,setMode]=useState("playset");
  const [activeRars,setActiveRars]=useState(()=>new Set(SET_RARS));
  const [expanded,setExpanded]=useState(null);
  const mult=mode==="playset"?4:1;
  const setData=useMemo(()=>{
    const result={};
    for(const set of sets){
      const cards={};
      for(const row of rawData){
        if((row["Set"]||"").trim()!==set) continue;
        const rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim();
        if(pr!=="Normal"||!SET_RARS.includes(rar)) continue;
        const name=(row["Product Name"]||"").trim(),price=parseP(row["Market Price"]);
        if(!cards[name]) cards[name]={name,rarity:rar,price,img_small:row["img_small"],img_normal:row["img_normal"],num:row["Number"]};
      }
      const cardList=Object.values(cards);
      const byRar={};
      for(const r of SET_RARS){const rc=cardList.filter(c=>c.rarity===r);byRar[r]={cards:rc,total:rc.reduce((t,c)=>t+(c.price||0),0),count:rc.length};}
      result[set]={cards:cardList,byRar};
    }
    return result;
  },[rawData,sets]);
  const toggleRar=r=>{setActiveRars(prev=>{const next=new Set(prev);if(next.has(r)) next.delete(r); else next.add(r);return next;});};
  const getTotal=s=>{const d=setData[s];if(!d) return 0;let t=0;for(const r of SET_RARS) if(activeRars.has(r)) t+=(d.byRar[r]?.total||0);return t*mult;};
  return html`<div>
    <div class="row" style=${{gap:12}}>
      <div style=${{display:"flex",gap:4}}>
        <button onClick=${()=>setMode("playset")} class=${mode==="playset"?"active":""}>Playset (4x)</button>
        <button onClick=${()=>setMode("master")} class=${mode==="master"?"active":""}>Master Set (1x)</button>
      </div>
      <div style=${{display:"flex",gap:4,flexWrap:"wrap"}}>
        ${SET_RARS.map(r=>{const s=getBadgeStyle(r,theme),on=activeRars.has(r);
          return html`<button key=${r} onClick=${()=>toggleRar(r)} style=${{background:on?s.bg:"transparent",color:on?s.fg:"var(--text-muted)",
            border:on?"1px solid "+(s.fg+"40"):"1px solid var(--border)",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:600,
            opacity:on?1:0.4,transition:"all 0.15s"}}>${r}</button>`;
        })}
      </div>
    </div>
    <div class="scr"><table>
      <thead><tr>
        <th style=${{textAlign:"left",minWidth:160}}>Set</th><th style=${{minWidth:90}}>Total</th>
        ${SET_RARS.map(r=>html`<th key=${r} style=${{minWidth:70,opacity:activeRars.has(r)?1:0.3}}>${r}</th>`)}
        <th style=${{width:40}}>Cards</th>
      </tr></thead>
      <tbody>${sets.map(s=>{const d=setData[s];if(!d) return null;const total=getTotal(s),isExp=expanded===s;
        return html`<${React.Fragment} key=${s}>
          <tr onClick=${()=>setExpanded(isExp?null:s)} style=${{cursor:"pointer",background:isExp?"var(--accent-glow)":"inherit"}}>
            <td style=${{fontWeight:500,textAlign:"left"}}><span style=${{marginRight:6,fontSize:10,color:"var(--text-muted)"}}>${isExp?"▼":"▶"}</span>${s}</td>
            <td style=${{fontWeight:600}}>${fmt(total)}</td>
            ${SET_RARS.map(r=>{const rv=(d.byRar[r]?.total||0)*mult;
              return html`<td key=${r} style=${{opacity:activeRars.has(r)?1:0.3}}>${fmt(rv)}</td>`;})}
            <td class="muted">${d.cards.length}</td>
          </tr>
          ${isExp&&html`<tr><td colspan=${SET_RARS.length+3} style=${{padding:0,border:"none"}}>
            <${SetDetail} data=${d} mult=${mult} activeRars=${activeRars} theme=${theme}/>
          </td></tr>`}
        <//>`;})}</tbody>
    </table></div>
    <p class="muted" style=${{fontSize:11,marginTop:8}}>Normal printings only (excludes foils, Enchanted, Epic, Iconic). ${mode==="playset"?"Playset = 4 copies of each card.":"Master Set = 1 copy of each card."} Prices via Lorcast (TCGPlayer).</p>
  </div>`;
}

// ── Main App ────────────────────────────────────────────────────────────
function App(){
  const [raw,setRaw]=useState([]);const [loading,setLoading]=useState(false);const [err,setErr]=useState(null);const [loaded,setLoaded]=useState(false);
  const [nc,setNc]=useState(false);const [ne,setNe]=useState(false);const [view,setView]=useState("ev");
  const [loadProgress,setLoadProgress]=useState({loaded:0,total:0,current:""});
  const [theme,setTheme]=useState("light");
  const [particles,setParticles]=useState(true);

  const toggleTheme = useCallback(()=>{const next=theme==="dark"?"light":"dark";setTheme(next);document.documentElement.setAttribute("data-theme",next);},[theme]);
  const {sets,avgs}=useMemo(()=>raw.length?processData(raw):{sets:[],avgs:{}},[raw]);

  const loadFromSupabase = useCallback(async ()=>{
    setLoading(true);setErr(null);setLoadProgress({loaded:0,total:0,current:"Connecting..."});
    try {
      setLoadProgress({loaded:0,total:3,current:"Fetching sets"});
      const setsData = await sbFetchAll("sets",{select:"id,name"});
      const setNameById = Object.fromEntries(setsData.map(s=>[s.id,s.name]));

      setLoadProgress({loaded:1,total:3,current:"Fetching prices"});
      const priceRows = await sbFetchAll("card_prices_latest",{select:"*"});

      setLoadProgress({loaded:2,total:3,current:"Building view"});
      const allRows = transformSupabaseData(priceRows, setNameById);

      setRaw(allRows);setLoaded(true);setLoading(false);
      setLoadProgress({loaded:3,total:3,current:"Done!"});
    } catch(e){setErr("Supabase error: "+e.message);setLoading(false);}
  },[]);

  useEffect(()=>{loadFromSupabase();},[loadFromSupabase]);

  const TABS=[["ev","Expected Value"],["setval","Set Values"],["avg","Average Card Prices"],["sim","Pack Sim"],["box","Box Sim"],["compare","Compare"],["heatmap","Heatmap"],["faq","How It Works"]];

  if(!loaded) return html`${particles&&html`<${GlimmerParticles}/>`}
    <div style=${{maxWidth:480,margin:"4rem auto",textAlign:"center"}}>
      <img src=${LOGO_B64} alt="Ink & Lore" style=${{height:60,marginBottom:"1.5rem",opacity:0.9,borderRadius:4}}/>
      <h1 class="title-font glimmer-text" style=${{fontSize:22,fontWeight:600,marginBottom:"0.5rem",letterSpacing:1}}>Lorcana Expected Value Calculator</h1>
      <p style=${{fontSize:12,color:"var(--text-muted)",marginBottom:"0.25rem"}}>a Zaven Torian project</p>
      <p style=${{fontSize:12,marginBottom:"2rem"}}><a href="https://x.com/HighScoreZAP" target="_blank" rel="noopener" style=${{color:"var(--accent)",textDecoration:"none"}}>follow @HighScoreZAP</a></p>
      ${loading&&html`<div style=${{marginBottom:"1rem"}}>
        <p style=${{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>${loadProgress.total>0?loadProgress.current+" ("+loadProgress.loaded+"/"+loadProgress.total+")":loadProgress.current||"Connecting..."}</p>
        ${loadProgress.total>0&&html`<div class="progress-bar"><div class="progress-fill" style=${{width:(loadProgress.loaded/loadProgress.total*100)+"%"}}/></div>`}
      </div>`}
      ${err&&html`<div><p style=${{fontSize:13,color:"var(--red)",marginBottom:"1rem"}}>${err}</p><button class="active" onClick=${loadFromSupabase} style=${{padding:"10px 24px",fontSize:14}}>Retry</button></div>`}
    </div>`;

  return html`<div>
    ${particles&&html`<${GlimmerParticles}/>`}
    <div class="tabs">
      <span class="title-font" style=${{fontWeight:600,fontSize:15,marginRight:8,color:"var(--accent)"}}>Lorcana Expected Value</span>
      ${TABS.map(([v,l])=>html`<button key=${v} onClick=${()=>setView(v)} class=${view===v?"active":""} style=${{padding:"5px 11px",fontSize:12}}>${l}</button>`)}
      ${(view==="ev"||view==="avg")&&html`
        <${Tooltip} text="Treats any card worth less than $1.00 as $0. Gives a more realistic 'sellable' EV by ignoring bulk penny cards.">
          <label style=${{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",color:"var(--text-dim)",marginLeft:6}}>
            <input type="checkbox" checked=${nc} onChange=${e=>setNc(e.target.checked)}/>${" <$1\u2192$0"}
          </label>
        <//>
        <${Tooltip} text="Removes Enchanted and Iconic cards from the EV calculation. Shows your expected return without relying on ultra-rare jackpot pulls.">
          <label style=${{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",color:"var(--text-dim)"}}>
            <input type="checkbox" checked=${ne} onChange=${e=>setNe(e.target.checked)}/> No Ench/Iconic
          </label>
        <//>`}
      <div style=${{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
        <button class="theme-toggle" onClick=${()=>setParticles(p=>!p)} title=${particles?"Hide particles":"Show particles"}>
          ${particles?"\u2728":"\u2B50"}
        </button>
        <button class="theme-toggle" onClick=${toggleTheme} title=${theme==="dark"?"Switch to light":"Switch to dark"}>
          ${theme==="dark"?"\u2600":"\uD83C\uDF19"}
        </button>
        <button onClick=${()=>{setLoaded(false);setRaw([]);setTimeout(loadFromSupabase,100);}} style=${{fontSize:11,color:"var(--text-muted)",border:"1px solid var(--border)",padding:"5px 10px"}}>${"\u21A9"} reload</button>
      </div>
    </div>
    ${view==="ev"&&html`<${EVView} sets=${sets} avgs=${avgs} nc=${nc} ne=${ne}/>`}
    ${view==="setval"&&html`<${SetValuesView} rawData=${raw} sets=${sets} theme=${theme}/>`}
    ${view==="avg"&&html`<${AvgView} sets=${sets} avgs=${avgs} nc=${nc}/>`}
    ${view==="sim"&&html`<${PackSim} rawData=${raw} sets=${sets} theme=${theme}/>`}
    ${view==="box"&&html`<${BoxSim} rawData=${raw} sets=${sets} theme=${theme}/>`}
    ${view==="compare"&&html`<${CompareView} sets=${sets} avgs=${avgs}/>`}
    ${view==="heatmap"&&html`<${HeatmapView} sets=${sets} avgs=${avgs}/>`}
    ${view==="faq"&&html`<${FAQView}/>`}
    <${Footer}/>
  </div>`;
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e};}
  render(){
    if(this.state.error) return React.createElement('div',{style:{padding:'2rem',maxWidth:600,margin:'2rem auto',color:'var(--text)'}},
      React.createElement('h2',{style:{color:'var(--red)',fontSize:16,fontFamily:'Cinzel,serif'}},'Something went wrong'),
      React.createElement('pre',{style:{fontSize:12,color:'var(--text-muted)',whiteSpace:'pre-wrap',marginTop:8}},this.state.error.toString()),
      React.createElement('button',{onClick:()=>this.setState({error:null}),style:{marginTop:12,padding:'8px 16px',cursor:'pointer',background:'transparent',border:'1px solid var(--btn-border)',color:'var(--text)',borderRadius:6}},'Retry'));
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${ErrorBoundary}><${App}/><//>`);
</script>
</body>
</html>
