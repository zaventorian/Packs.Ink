    </div>
    <div class="sd-tile-counters">
      ${onlyFoil
        ? html`<${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`
        : onlyNormal
          ? html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>`
          : html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>
                 <${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`}
    </div>
  </div>`;
};

// Build a small "from this view" suffix describing which filters are active.
const searchOrFilterLabel = (inkF, rarF, search, foilMode, statusFilter) => {
  const parts = [];
  if(foilMode === "normal") parts.push("non-foil");
  if(foilMode === "foil")   parts.push("foil");
  if(statusFilter && statusFilter !== "all") parts.push(statusFilter);
  if(inkF.size === 1) parts.push([...inkF][0]);
  else if(inkF.size > 1) parts.push(inkF.size+" inks");
  if(rarF.size === 1) parts.push([...rarF][0]);
  else if(rarF.size > 1) parts.push(rarF.size+" rarities");
  if(search) parts.push(`"${search.trim().slice(0,20)}"`);
  if(parts.length === 0) return " from this set";
  return " · " + parts.join(" · ");
};

const CollectionSetDetail = ({setName, raw, collection, updateQty, onBack, theme, user, onSignIn, copies}) => {
  const [viewMode, setViewMode] = useState("list");
  const [search, setSearch] = useState("");
  const [inkFilter, setInkFilter] = useState(new Set());
  const [rarityFilter, setRarityFilter] = useState(new Set());
  // "all" | "complete" | "incomplete" | "extras" — applied vs current foil mode
  const [statusFilter, setStatusFilter] = useState("all");
  // Extras & Oddities cards are all foil-only by design (Holofoil starter-
  // deck variants, etc.), so the foil-mode toggle is hidden in that view
  // and the state is locked to "foil".
  const isExtrasView = setName === EXTRAS_SET_NAME;
  const [foilMode, setFoilMode] = useState(isExtrasView ? "foil" : "either"); // "either" | "normal" | "foil"
  const [sortKey, setSortKeyState] = useState("num");
  const [selectedGroup, setSelectedGroup] = useState(null);
  // Per-card target: 1 for Master Set, 4 for Playset, etc. Passed in from
  // CollectionView's top-level segmented toggle. Falls back to 1 if missing
  // so the set detail view still works in isolation.
  const TARGET = Math.max(1, copies || 1);

  const groups = useMemo(()=>{
    const filtered = raw.filter(r => r.Set === setName);
    const out = groupCards(filtered);
    const cmp = SORT_COMPARATORS[sortKey];
    if(cmp) out.sort(cmp);
    else out.sort((a,b) => collectorNum(a) - collectorNum(b));
    return out;
  }, [raw, setName, sortKey]);

  // Rarities actually present in this set, in the standard display order.
  const setRarities = useMemo(()=>{
    const present = new Set(groups.map(g => g.Rarity));
    return CARDS_RARITIES.filter(r => present.has(r));
  }, [groups]);

  const visibleGroups = useMemo(() => {
    const parsed = parseSearchQuery(search||"");
    return groups.filter(g => {
      if(inkFilter.size && !inkFilter.has(g.ink)) return false;
      if(rarityFilter.size && !rarityFilter.has(g.Rarity)) return false;
      if(parsed.name && !nameMatches(parsed.name, g["Product Name"])) return false;
      if(parsed.filters.ink && g.ink !== parsed.filters.ink) return false;
      if(parsed.filters.rarity && g.Rarity !== parsed.filters.rarity) return false;

      // For the active foil mode, count which printings are "in scope" and
      // how complete the user is on each.
      const nApplies = foilMode !== "foil"   && !!g.normal;
      const fApplies = foilMode !== "normal" && !!g.foil;
      const ownN = nApplies ? (collection[g.card_id+":"+g.normal.tcg_printing] || 0) : null;
      const ownF = fApplies ? (collection[g.card_id+":"+g.foil.tcg_printing]   || 0) : null;
      const shortN = nApplies ? Math.max(0, TARGET - ownN) : 0;
      const shortF = fApplies ? Math.max(0, TARGET - ownF) : 0;
      const overN  = nApplies ? Math.max(0, ownN - TARGET) : 0;
      const overF  = fApplies ? Math.max(0, ownF - TARGET) : 0;
      const totalShort = shortN + shortF;
      const totalOver  = overN  + overF;

      if(statusFilter === "complete"   && totalShort > 0) return false;
      if(statusFilter === "incomplete" && totalShort === 0) return false;
      if(statusFilter === "extras"     && totalOver === 0) return false;
      // If no printing applies under the foilMode (e.g., chase card under
      // foilMode='normal'), only "all" should include it.
      if(!nApplies && !fApplies && statusFilter !== "all") return false;
      return true;
    });
  }, [groups, inkFilter, rarityFilter, search, statusFilter, foilMode, collection]);

  // Filter-aware "missing" summary — for each visible printing, counts the
  // copies the user is SHORT of TARGET (Master Set = 1, Playset = 4). Value
  // = short copies × current Low. Respects rarity / ink / foilMode filters
  // so toggling Enchanted off, etc., drops it from the totals.
  const visibleMissing = useMemo(() => {
    let count = 0, value = 0;
    for(const g of visibleGroups){
      if(foilMode !== "foil" && g.normal){
        const qty = collection[g.card_id+":"+g.normal.tcg_printing] || 0;
        const short = Math.max(0, TARGET - qty);
        if(short > 0){
          count += short;
          value += (g.normal["Low Price"] ?? g.normal["TCGPlayer Market"] ?? 0) * short;
        }
      }
      if(foilMode !== "normal" && g.foil){
        const qty = collection[g.card_id+":"+g.foil.tcg_printing] || 0;
        const short = Math.max(0, TARGET - qty);
        if(short > 0){
          count += short;
          value += (g.foil["Low Price"] ?? g.foil["TCGPlayer Market"] ?? 0) * short;
        }
      }
    }
    return {count, value};
  }, [visibleGroups, collection, foilMode, TARGET]);

  // Filter-aware "owned value" summary — total $ for cards in the visible
  // view that the user actually owns. Sums every owned copy at current Low
  // (capped at TARGET would feel weird — extras are still real value, so
  // we count them all).
  const visibleOwned = useMemo(() => {
    let count = 0, value = 0;
    for(const g of visibleGroups){
      if(foilMode !== "foil" && g.normal){
        const qty = collection[g.card_id+":"+g.normal.tcg_printing] || 0;
        if(qty > 0){
          count += qty;
          value += (g.normal["Low Price"] ?? g.normal["TCGPlayer Market"] ?? 0) * qty;
        }
      }
      if(foilMode !== "normal" && g.foil){
        const qty = collection[g.card_id+":"+g.foil.tcg_printing] || 0;
        if(qty > 0){
          count += qty;
          value += (g.foil["Low Price"] ?? g.foil["TCGPlayer Market"] ?? 0) * qty;
        }
      }
    }
    return {count, value};
  }, [visibleGroups, collection, foilMode]);

  return html`<div>
    <div class="setdet-header">
      <button class="setdet-back" onClick=${onBack}>← Back to Collection</button>
      <h2 class="title-font setdet-title">${setName}</h2>
      <div class="setdet-count">${visibleGroups.length} / ${groups.length} cards</div>
    </div>

    <div class="setdet-toolbar">
      <input type="search" class="setdet-search" placeholder="Search this set..."
        value=${search} onInput=${e=>setSearch(e.target.value)}/>
      <div class="cards-chipgroup">
        ${INKS.map(ink => html`<button key=${ink} class=${"chip ink ink-icon-chip "+(inkFilter.has(ink)?"active":"")}
          style=${{background:INK_COLORS[ink]?.bg,borderColor:INK_COLORS[ink]?.border}}
          title=${ink} aria-label=${ink}
          onClick=${()=>setInkFilter(s => toggleSet(s, ink))}>
          <img src=${INK_ICONS[ink]} alt=${ink}/>
        </button>`)}
      </div>
      <div class="cards-chipgroup">
        ${setRarities.map(r => html`<button key=${r} class=${"chip "+(rarityFilter.has(r)?"active":"")}
          onClick=${()=>setRarityFilter(s => toggleSet(s, r))}>${r}</button>`)}
      </div>
      <div class="seg-toggle">
        ${[["all","All"],["complete","Complete"],["incomplete","Incomplete"],["extras","Extras"]].map(([k,l]) =>
          html`<button key=${k} class=${statusFilter===k?"active":""} onClick=${()=>setStatusFilter(k)}>${l}</button>`)}
      </div>
      ${!isExtrasView && html`<div class="seg-toggle">
        ${[["either","Either"],["normal","Non-foil"],["foil","Foil"]].map(([k,l]) =>
          html`<button key=${k} class=${foilMode===k?"active":""} onClick=${()=>setFoilMode(k)}>${l}</button>`)}
      </div>`}
      <select value=${sortKey} onChange=${e=>setSortKeyState(e.target.value)} class="setdet-sort" title="Sort">
        <option value="num">#  Collector</option>
        <option value="name">Name (A→Z)</option>
        <option value="cost-asc">Cost ↑</option>
        <option value="cost-desc">Cost ↓</option>
        <option value="price-asc">Price ↑</option>
        <option value="price-desc">Price ↓</option>
      </select>
      <div class="setdet-view-toggle">
        <button class=${viewMode==="list"?"active":""} onClick=${()=>setViewMode("list")} title="Compact list">☰</button>
        <button class=${viewMode==="cards"?"active":""} onClick=${()=>setViewMode("cards")} title="Card grid">▦</button>
      </div>
    </div>

    <div class="setdet-value-stats">
      <div class="setdet-stat">
        <div class="setdet-stat-lbl">Owned value</div>
        <div class="setdet-stat-val green">$${visibleOwned.value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="setdet-stat-sub">${visibleOwned.count.toLocaleString()} card${visibleOwned.count===1?'':'s'}</div>
      </div>
      <div class="setdet-stat">
        <div class="setdet-stat-lbl">Missing value</div>
        <div class="setdet-stat-val red">$${visibleMissing.value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="setdet-stat-sub">${visibleMissing.count.toLocaleString()} to complete ${copies===1?"master":copies===4?"playset":copies+"×"} set</div>
      </div>
    </div>

    ${visibleMissing.count > 0 && html`<a class="setdet-buy-missing"
      href=${tcgSetSearchUrl(setName)} target="_blank" rel="noopener nofollow">
      <span class="setdet-buy-missing-text">Shop ${visibleMissing.count} missing card${visibleMissing.count===1?'':'s'}${searchOrFilterLabel(inkFilter,rarityFilter,search,foilMode,statusFilter)}</span>
      <span class="setdet-buy-missing-price">$${visibleMissing.value.toFixed(2)}<span class="setdet-buy-missing-arrow">↗</span></span>
    </a>`}

    ${(() => {
      // For Extras & Oddities, sub-group by the card's origin set so the
      // user sees "Wilds Unknown", "Fabled", etc. headers within the bucket.
      // For every other set there's just one (implicit) group.
      const groupsByOrigin = (() => {
        if(!isExtrasView) return [{key: setName, label: null, items: visibleGroups}];
        const buckets = new Map();
        for(const g of visibleGroups){
          const k = g.originSet || "Other";
          if(!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(g);
        }
        // Sort origin sets by their SET_ORDER position (newest first), then alpha.
        const keys = Array.from(buckets.keys()).sort((a,b) => {
          const ai = SET_ORDER.indexOf(a), bi = SET_ORDER.indexOf(b);
          if(ai === -1 && bi === -1) return a.localeCompare(b);
          if(ai === -1) return 1;
          if(bi === -1) return -1;
          return bi - ai;
        });
        return keys.map(k => ({key:k, label:k, items:buckets.get(k)}));
      })();
      const renderItems = (items) => viewMode === "list"
        ? html`<div class="setdet-list-grid">${items.map(g => {
            const nKey = g.normal ? g.card_id+":"+g.normal.tcg_printing : null;
            const fKey = g.foil   ? g.card_id+":"+g.foil.tcg_printing   : null;
            const showNormal = foilMode !== "foil"   && g.normal;
            const showFoil   = foilMode !== "normal" && g.foil;
            // Extras cards stamp their variant label into `Rarity`; surface
            // it as a subtitle (e.g. "Starter Deck Exclusive Foil").
            const subtitle = isExtrasView ? g.Rarity : null;
            return html`<${SetDetailListRow} key=${g.card_id} group=${g} theme=${theme}
              normalQty=${nKey ? (collection[nKey]||0) : 0}
              foilQty=${fKey ? (collection[fKey]||0) : 0}
              onNormal=${showNormal && nKey ? (q)=>updateQty(g.card_id, g.normal.tcg_printing, q) : null}
              onFoil=${showFoil && fKey ? (q)=>updateQty(g.card_id, g.foil.tcg_printing, q) : null}
              showNormalSide=${showNormal} showFoilSide=${showFoil}
              subtitle=${subtitle}
              onOpen=${()=>setSelectedGroup(g)}/>`;
          })}</div>`
        : html`<div class="setdet-card-grid">${items.map(g => {
            const nKey = g.normal ? g.card_id+":"+g.normal.tcg_printing : null;
            const fKey = g.foil   ? g.card_id+":"+g.foil.tcg_printing   : null;
            const showNormal = foilMode !== "foil"   && g.normal;
            const showFoil   = foilMode !== "normal" && g.foil;
            const subtitle = isExtrasView ? g.Rarity : null;
            return html`<${SetDetailCardTile} key=${g.card_id} group=${g} theme=${theme}
              normalQty=${nKey ? (collection[nKey]||0) : 0}
              foilQty=${fKey ? (collection[fKey]||0) : 0}
              onNormal=${showNormal && nKey ? (q)=>updateQty(g.card_id, g.normal.tcg_printing, q) : null}
              onFoil=${showFoil && fKey ? (q)=>updateQty(g.card_id, g.foil.tcg_printing, q) : null}
              showNormalSide=${showNormal} showFoilSide=${showFoil}
              subtitle=${subtitle}
              onOpen=${()=>setSelectedGroup(g)}/>`;
          })}</div>`;
      return groupsByOrigin.map(bucket => html`<div key=${bucket.key} class="setdet-origin-bucket">
        ${bucket.label && html`<div class="setdet-origin-header">${bucket.label}</div>`}
        ${renderItems(bucket.items)}
      </div>`);
    })()}

    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
  </div>`;
};

// ── Price History view ──────────────────────────────────────────────────
// Two modes: "card" lets you pick any card and see Low price over time;
// "set" charts the set's expected value over time (uses rarity_avg_daily
// SQL view added in supabase/06_rarity_avg.sql).
// Earliest date covered by the TCGCSV archive backfill. Anything before
// this isn't in our prices_daily table — Sets 1 & 2 released before then,
// so their charts can only show data from this date onwards.
const EARLIEST_DATA_DATE = "2024-02-08";

// Format an ISO date string (YYYY-MM-DD) for display without letting the
// viewer's timezone shift it back a day. Date.parse treats "2023-11-17" as
// midnight UTC; toLocaleDateString in a -8 timezone would then show Nov 16.
const fmtIsoDate = (iso) => {
  if(!iso) return "";
  return new Date(iso).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});
};
// Relative time for "this deck was updated X ago". `iso` is an ISO 8601
// timestamp with TZ offset (what timestamptz columns serialize to). The
// Date constructor parses the offset and then toLocaleString uses the
// browser's local TZ, so an 8am Tokyo update reads as "yesterday" /
// "6pm Thursday" automatically for a Chicago viewer. No manual TZ math.
const relativeTime = (iso) => {
  if(!iso) return "";
  const then = new Date(iso).getTime();
  if(!Number.isFinite(then)) return "";
  const diff = Math.max(0, Date.now() - then);
  const sec = Math.floor(diff / 1000);
  if(sec < 60)              return "just now";
  const min = Math.floor(sec / 60);
  if(min < 60)              return min + "m ago";
  const hr = Math.floor(min / 60);
  if(hr < 24)               return hr + "h ago";
  const day = Math.floor(hr / 24);
  if(day < 7)               return day + "d ago";
  const wk = Math.floor(day / 7);
  if(wk < 5)                return wk + "w ago";
  const mo = Math.floor(day / 30);
  if(mo < 12)               return mo + "mo ago";
  const yr = Math.floor(day / 365);
  return yr + "y ago";
};
// Absolute time in the viewer's local timezone — used as a hover tooltip
// so the relative time stays scannable. Format: "Jun 12, 2024, 3:42 PM".
const absoluteLocalTime = (iso) => {
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  try {
    return d.toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"});
  } catch {
    return d.toString();
  }
};
const setDataPartial = (setKey) => {
  const lgs = SET_RELEASE_DATES[setKey]?.lgs;
  return !!lgs && Date.parse(lgs) < Date.parse(EARLIEST_DATA_DATE);
};

// Known Lorcana set release dates (from official Ravensburger schedule).
// LGS = Local Game Store release (in-store availability, often called the
// "early release"). Retail = wide retail availability (~2 weeks later).
// Used to draw markers on the Set EV chart so the pre-order / hype curve
// vs. supply-rich retail period is visible.
const SET_RELEASE_DATES = {
  "The First Chapter":     {lgs:"2023-08-18", retail:"2023-09-01"},
  "Rise of the Floodborn": {lgs:"2023-11-17", retail:"2023-12-01"},
  "Into the Inklands":     {lgs:"2024-02-23", retail:"2024-03-08"},
  "Ursula's Return":       {lgs:"2024-05-17", retail:"2024-05-31"},
  "Shimmering Skies":      {lgs:"2024-08-09", retail:"2024-08-23"},
  "Azurite Sea":           {lgs:"2024-11-15", retail:"2024-11-29"},
  "Archazia's Island":     {lgs:"2025-03-07", retail:"2025-03-21"},
  "Reign of Jafar":        {lgs:"2025-05-30", retail:"2025-06-06"},
  "Fabled":                {lgs:"2025-08-29", retail:"2025-09-05"},
  "Whispers in the Well":  {lgs:"2025-11-07", retail:"2025-11-14"},
  "Winterspell":           {lgs:"2026-02-13", retail:"2026-02-20"},
  "Wilds Unknown":         {lgs:"2026-05-08", retail:"2026-05-15"},
};

// "all" = since release; others are rolling windows ending today.
// "custom" pairs with a date string from the date picker.
const RANGE_OPTIONS = [
  ["all",    "Since Release"],
  ["1y",     "1 Year"],
  ["6m",     "6 Months"],
  ["3m",     "3 Months"],
  ["1m",     "1 Month"],
  ["1w",     "1 Week"],
  ["custom", "Custom"],
];
const rangeStartMs = (key, customStart) => {
  if(key === "all") return null;
  if(key === "custom") return customStart ? Date.parse(customStart) : null;
  const now = Date.now();
  const day = 24*60*60*1000;
  switch(key){
    case "1w": return now - 7*day;
    case "1m": return now - 31*day;
    case "3m": return now - 93*day;
    case "6m": return now - 186*day;
    case "1y": return now - 366*day;
    default: return null;
  }
};

// Resolve the effective "start" timestamp from range/custom + preorder-hide.
const computeChartStartMs = (rangeKey, customStart, hidePreorders, setKey) => {
  const rangeStart = rangeStartMs(rangeKey, customStart);
  const lgsStr = hidePreorders && setKey ? SET_RELEASE_DATES[setKey]?.lgs : null;
  const lgsStart = lgsStr ? Date.parse(lgsStr) : null;
  if(rangeStart != null && lgsStart != null) return Math.max(rangeStart, lgsStart);
  return rangeStart != null ? rangeStart : lgsStart;
};
const clipSeriesFrom = (series, startMs) => {
  if(startMs == null) return series;
  return series.map(s => ({...s, data: (s.data||[]).filter(p => p.x >= startMs)}));
};

const HistoryView = ({raw, sets, theme, historyTarget, sealedPrices}) => {
  const tips = useContext(TipsContext);
  const [mode, setMode] = useState("card");
  // Sealed mode state — parallel to selectedGroup/cardQuery for cards.
  const [sealedSearch, setSealedSearch] = useState("");
  const [selectedSealedPid, setSelectedSealedPid] = useState(null);
  const [sealedHist, setSealedHist] = useState({rows:null, loading:false});
  const [cardQuery, setCardQuery] = useState("");
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [history, setHistory] = useState({normal:null, foil:null, loading:false});
  const [setName, setSetNameLocal] = useState("");
  // Consume cross-view nav payload from App. Bumped nonce ensures re-arriving
  // at the same set still re-applies (e.g. user clicks the same EV row twice).
  useEffect(()=>{
    if(historyTarget && historyTarget.setName){
      setMode("set");
      setSetNameLocal(historyTarget.setName);
    }
  }, [historyTarget]);
  const [setEv, setSetEv] = useState({rows:null, loading:false, error:null});
  // Low / Market checkbox state — shared across card mode and set EV mode.
  // Default = Low only. Toggle Market to add it as a dashed series.
  const [showLow, setShowLow] = useState(true);
  const [showMarket, setShowMarket] = useState(false);
  const [setSearch, setSetSearch] = useState("");
  const [rangeKey, setRangeKey] = useState("all");
  const [customStart, setCustomStart] = useState(""); // YYYY-MM-DD when rangeKey="custom"
  const [hidePreorders, setHidePreorders] = useState(true);
  // EV toggles (only meaningful in set EV mode)
  const [noChase, setNoChase] = useState(false);   // exclude Enchanted + Iconic
  const [noPenny, setNoPenny] = useState(false);   // <$1 → $0 (uses avg_low_nc)

  // De-duplicate cards by card_id, keep one representative row per card
  const cardOptions = useMemo(()=>{
    const seen = new Map();
    for(const r of raw){
      if(!r.card_id) continue;
      if(!seen.has(r.card_id)) seen.set(r.card_id, r);
    }
    return Array.from(seen.values());
  }, [raw]);

  // Smart-search filter: when the input is empty we show ALL cards grouped
  // by set (default mode); when non-empty we filter using parseSearchQuery
  // and show a flat list ranked by relevance.
  const parsedQuery = useMemo(()=>parseSearchQuery(cardQuery||""), [cardQuery]);
  const cardMatches = (c, p) => {
    if(p.filters.ink && c.ink !== p.filters.ink) return false;
    if(p.filters.rarity && c.Rarity !== p.filters.rarity) return false;
    if(p.filters.set && c.Set !== p.filters.set) return false;
    if(p.filters.cost != null && c.cost !== p.filters.cost) return false;
    if(p.filters.card_type && (c.card_type||"") !== p.filters.card_type) return false;
    if(p.filters.inkable === true  && c.inkable !== true)  return false;
    if(p.filters.inkable === false && c.inkable !== false) return false;
    if(p.filters.classification){
      const cls = (c.classifications||[]).map(s => (s||"").toLowerCase());
      if(!cls.includes(p.filters.classification.toLowerCase())) return false;
    }
    if(p.excludeRarities && p.excludeRarities.size && p.excludeRarities.has(c.Rarity)) return false;
    if(p.name && !nameMatches(p.name, c["Product Name"])) return false;
    return true;
  };
  const flatMatches = useMemo(()=>{
    if(!cardQuery.trim()) return null;
    return cardOptions.filter(c => cardMatches(c, parsedQuery)).slice(0, 200);
  }, [cardOptions, cardQuery, parsedQuery]);

  // For the default (no-search) view: group by set, newest sets first,
  // collector number ascending within each.
  const groupedBySet = useMemo(()=>{
    if(cardQuery.trim()) return null;
    const bySet = {};
    for(const c of cardOptions){
      if(!bySet[c.Set]) bySet[c.Set] = [];
      bySet[c.Set].push(c);
    }
    for(const k of Object.keys(bySet)){
      bySet[k].sort((a,b) => collectorNum(a) - collectorNum(b));
    }
    // Order sets: SET_ORDER reversed for mains, then any extras alphabetically
    const ordered = [];
    for(let i = SET_ORDER.length - 1; i >= 0; i--){
      if(bySet[SET_ORDER[i]]) ordered.push([SET_ORDER[i], bySet[SET_ORDER[i]]]);
    }
    for(const k of Object.keys(bySet).sort()){
      if(!SET_ORDER.includes(k)) ordered.push([k, bySet[k]]);
    }
    return ordered;
  }, [cardOptions, cardQuery]);

  // Display title for a card row — append rarity for chase / promo cards
  // to distinguish from the base printing in the same name family.
  const cardDisplayTitle = (c) => {
    if(["Enchanted","Iconic","Epic","Promo"].includes(c.Rarity)){
      return `${c["Product Name"]} (${c.Rarity})`;
    }
    return c["Product Name"];
  };

  // Fetch card history when selectedGroup changes
  useEffect(()=>{
    if(!selectedGroup){ setHistory({normal:null, foil:null, loading:false}); return; }
    let cancelled = false;
    setHistory({normal:null, foil:null, loading:true});
    // The "group" we have is one row from raw — find both printings via card_id
    const allRows = raw.filter(r => r.card_id === selectedGroup.card_id);
    const groups = groupCards(allRows);
    const g = groups[0];
    const tasks = [];
    if(g && g.normal && g.normal.tcgplayer_product_id){
      tasks.push(fetchCardHistory(g.normal.tcgplayer_product_id, g.normal.tcg_printing)
        .then(rows => ({key:"normal", rows})));
    }
    if(g && g.foil && g.foil.tcgplayer_product_id){
      tasks.push(fetchCardHistory(g.foil.tcgplayer_product_id, g.foil.tcg_printing)
        .then(rows => ({key:"foil", rows})));
    }
    Promise.all(tasks).then(results => {
      if(cancelled) return;
      const next = {normal:[], foil:[], loading:false};
      for(const r of results) next[r.key] = r.rows;
      setHistory(next);
    }).catch(()=>{
      if(!cancelled) setHistory({normal:[], foil:[], loading:false});
    });
    return ()=>{ cancelled = true; };
  }, [selectedGroup?.card_id, raw]);

  // Fetch sealed-product history when a sealed SKU is selected. Sealed
  // products are always Normal printing — fetchCardHistory keys on
  // tcgplayer_product_id + printing so it transparently works for them.
  useEffect(()=>{
    if(mode !== "sealed" || !selectedSealedPid){
      setSealedHist({rows:null, loading:false});
      return;
    }
    let cancelled = false;
    setSealedHist({rows:null, loading:true});
    fetchCardHistory(selectedSealedPid, "Normal")
      .then(rows => { if(!cancelled) setSealedHist({rows: rows || [], loading:false}); })
      .catch(() => { if(!cancelled) setSealedHist({rows: [], loading:false}); });
    return ()=>{ cancelled = true; };
  }, [mode, selectedSealedPid]);

  // Pre-grouped sealed picker list — same display-type sections as the
  // Market Sealed sub-tab, plus a name-substring filter from the search box.
  const sealedPickerData = useMemo(()=>{
    if(!sealedPrices) return [];
    const q = sealedSearch.trim().toLowerCase();
    const filtered = sealedPrices.filter(p =>
      p.printing === "Normal" &&
      p.product_type !== "Promo Single" &&
      (!q || cleanSealedName(p.name).toLowerCase().includes(q))
    );
    const byType = new Map();
    for(const item of filtered){
      const t = deriveSealedDisplayType(item);
      if(!byType.has(t)) byType.set(t, []);
      byType.get(t).push(item);
    }
    const out = [];
    for(const [type, list] of byType){
      list.sort((a, b) => (a.name||"").localeCompare(b.name||""));
      out.push({type, items: list});
    }
    out.sort((a, b) => sealedDisplayTypeRank(a.type) - sealedDisplayTypeRank(b.type));
    return out;
  }, [sealedPrices, sealedSearch]);

  // Build LineChart series from the sealed-history rows (mirrors the card
  // mode's buildHistorySeries, but with one printing instead of two).
  const sealedSeries = useMemo(()=>{
    if(!sealedHist.rows || !sealedHist.rows.length) return [];
    const lowPoints = [], mktPoints = [];
    for(const r of sealedHist.rows){
      const t = new Date(r.date + "T00:00:00Z").getTime();
      if(r.low_price != null)    lowPoints.push({x:t, y:parseFloat(r.low_price)});
      if(r.market_price != null) mktPoints.push({x:t, y:parseFloat(r.market_price)});
    }
    const out = [];
    if(showLow    && lowPoints.length) out.push({label:"Low",    color:"#1d8d4a", data:lowPoints});
    if(showMarket && mktPoints.length) out.push({label:"Market", color:"#7e54c4", data:mktPoints, dashed:true});
    return out;
  }, [sealedHist, showLow, showMarket]);

  const selectedSealed = useMemo(()=>{
    if(!selectedSealedPid || !sealedPrices) return null;
    return sealedPrices.find(p => p.tcgplayer_product_id === selectedSealedPid && p.printing === "Normal") || null;
  }, [selectedSealedPid, sealedPrices]);

  // Fetch set EV history when set or price field changes
  useEffect(()=>{
    if(mode !== "set" || !setName){ setSetEv({rows:null, loading:false, error:null}); return; }
    // Find the set_id matching this name
    const sample = raw.find(r => r.Set === setName);
    if(!sample){ setSetEv({rows:null, loading:false, error:"Unknown set"}); return; }
    let cancelled = false;
    setSetEv({rows:null, loading:true, error:null});
    sbFetchAll("rarity_avg_daily", {
      select: "date,rarity,printing,avg_low,avg_market,avg_low_nc,avg_market_nc",
      set_id: "eq." + sample.set_id,
      order: "date.asc",
    }).then(rows => { if(!cancelled) setSetEv({rows, loading:false, error:null}); })
      .catch(e => {
        if(cancelled) return;
        const msg = String(e?.message || e);
        // Statement timeout = view exists but isn't materialized → run the SQL
        let friendly;
        if(msg.includes("57014") || msg.includes("timeout")){
          friendly = "Set EV view timed out — re-run supabase/06_rarity_avg_daily.sql to convert it to a materialized view (then refresh this page).";
        } else if(msg.includes("404") || msg.includes("relation") || msg.includes("does not exist")){
          friendly = "Run supabase/06_rarity_avg_daily.sql in Supabase to enable this chart.";
        } else {
          friendly = "Set EV chart error: " + msg.slice(0,200);
        }
        setSetEv({rows:null, loading:false, error: friendly});
      });
    return ()=>{ cancelled = true; };
  }, [mode, setName, raw]);

  // Compute set EV series client-side from the rarity-avg rows. Builds one
  // series per active price field (Low and/or Market) so both can be plotted.
  // `noPenny` switches to the avg_*_nc columns (cards <$1 counted as $0).
  // `noChase` skips Enchanted + Iconic rarities entirely (matches the EV tab).
  const setEvSeries = useMemo(()=>{
    if(!setEv.rows || !setEv.rows.length) return [];
    const pull = getPull(setName);
    const evForField = (lowField, marketField, useField) => {
      const field = useField;
      const byDate = {};
      for(const r of setEv.rows){
        if(!byDate[r.date]) byDate[r.date] = {};
        const key = getRarKey(r.rarity, r.printing);
        if(!key) continue;
        const v = r[field] != null ? parseFloat(r[field]) : null;
        if(v == null) continue;
        byDate[r.date][key] = v;
      }
      return Object.keys(byDate).sort().map(date => {
        const avgs = byDate[date];
        let ev = 0;
        for(const r of RARS){
          if(noChase && NO_ENCH.has(r)) continue;
          const rate = pull[r];
          const avg = avgs[r];
          if(avg != null && rate != null) ev += avg * rate;
        }
        return {x: Date.parse(date), y: ev};
      });
    };
    const lowField    = noPenny ? "avg_low_nc"    : "avg_low";
    const marketField = noPenny ? "avg_market_nc" : "avg_market";
    const out = [];
    if(showLow)    out.push({label:"NM Low EV / box",  color:"#c8a846", dashed:false, data: evForField(null,null,lowField)});
    if(showMarket) out.push({label:"Market EV / box", color:"#c8a846", dashed:true,  data: evForField(null,null,marketField)});
    return out;
  }, [setEv.rows, setName, showLow, showMarket, noPenny, noChase]);

  // Vertical markers for the set EV chart — LGS release + retail release.
  const setMarkers = useMemo(()=>{
    const d = SET_RELEASE_DATES[setName];
    if(!d) return null;
    const out = [];
    if(d.lgs)    out.push({x: Date.parse(d.lgs),    label:"LGS",    color:"var(--text-muted)", dashed:true});
    if(d.retail) out.push({x: Date.parse(d.retail), label:"Retail", color:"var(--accent)",     dashed:false});
    return out;
  }, [setName]);

  // Available sets for the picker — only sets we have rarity_avg data for.
  // Reuse the same source as the dropdown (sets prop already excludes promos).
  const filteredSetList = useMemo(()=>{
    if(!setSearch.trim()) return [...sets].sort((a,b) => {
      const ai = SET_ORDER.indexOf(a), bi = SET_ORDER.indexOf(b);
      // Newest first; unknowns at end
      return (bi === -1 ? -999 : bi) - (ai === -1 ? -999 : ai);
    });
    const q = setSearch.toLowerCase();
    return sets.filter(s => s.toLowerCase().includes(q));
  }, [sets, setSearch]);

  return html`<div class="history-view">
    <div class="history-toolbar">
      <div class="seg-toggle">
        <button class=${mode==="card"?"active":""}   onClick=${()=>setMode("card")}>By Card</button>
        <button class=${mode==="set"?"active":""}    onClick=${()=>setMode("set")}>By Set EV</button>
        <button class=${mode==="sealed"?"active":""} onClick=${()=>setMode("sealed")}>By Sealed</button>
      </div>
      <div class="seg-toggle">
        ${RANGE_OPTIONS.map(([k,l]) => html`<button key=${k}
          class=${rangeKey===k?"active":""} onClick=${()=>setRangeKey(k)}>${l}</button>`)}
      </div>
      ${rangeKey === "custom" && html`<input type="date" class="custom-date-input"
        value=${customStart}
        max=${new Date().toISOString().slice(0,10)}
        onChange=${e=>setCustomStart(e.target.value)}/>`}
      <label class="checkbox-group" title="Hide data points from before the set's Local Game Store release date.">
        <input type="checkbox" checked=${hidePreorders} onChange=${e=>setHidePreorders(e.target.checked)}/>
        Hide Preorders
      </label>
      ${mode === "set" && html`<label class="checkbox-group" title="Cards worth less than $1 count as $0 in the EV calculation.">
        <input type="checkbox" checked=${noPenny} onChange=${e=>setNoPenny(e.target.checked)}/>
        ${"<"}$1 → $0
      </label>`}
      ${mode === "set" && html`<label class="checkbox-group" title="Exclude Enchanted and Iconic chase rarities from the EV calculation.">
        <input type="checkbox" checked=${noChase} onChange=${e=>setNoChase(e.target.checked)}/>
        No Ench/Iconic
      </label>`}
    </div>

    ${mode === "sealed" ? html`<div class="history-card-mode">
      <div class="history-picker">
        <input type="search" placeholder="Search sealed product..."
          value=${sealedSearch} onInput=${e=>setSealedSearch(e.target.value)}/>
        <div class="history-picker-list">
          ${sealedPickerData.length === 0
            ? html`<div class="history-picker-empty">${sealedPrices && sealedPrices.length
                ? `No products match "${sealedSearch}"`
                : "No sealed-product data loaded. Run supabase/16_sealed_prices_latest.sql."}</div>`
            : sealedPickerData.map(({type, items}) => html`<div key=${type} class="history-picker-group">
                <div class="history-picker-group-head">${type}</div>
                ${items.map(item => html`<button key=${item.tcgplayer_product_id}
                  class=${"history-picker-item "+(selectedSealedPid===item.tcgplayer_product_id?"active":"")}
                  onClick=${()=>setSelectedSealedPid(item.tcgplayer_product_id)}>
                  <div class="hpi-name">${cleanSealedName(item.name)}</div>
                </button>`)}
              </div>`)}
        </div>
      </div>
      <div class="history-chart-pane">
        ${!selectedSealed ? html`<div class="chart-empty large">Pick a sealed product from the list →</div>`
          : html`<div>
              <div class="history-card-preview">

// Modal card picker for "use a card as your profile picture". Dedupes raw
// to one entry per card_id, filters by a typed query (name substring),
// caps render to keep typing snappy. Click a tile → returns its card_id.
// Inline display-name editor in the settings popover. Display name is the
// user's public identity (shown to other users on shared decks) and is
// independent of their Google account name — they pick it themselves.
function DisplayNameEditor({profile, onSave}){
  const [editing, setEditing] = useState(false);
  const [value, setValue] = useState("");
  const [err, setErr] = useState(null);
  const [saving, setSaving] = useState(false);
  const start = () => { setValue(profile?.display_name || ""); setErr(null); setEditing(true); };
  const cancel = () => { setEditing(false); setErr(null); };
  const submit = async () => {
    setSaving(true); setErr(null);
    const r = await onSave(value);
    setSaving(false);
    if(r.ok) setEditing(false);
    else setErr(r.error || "Couldn't save");
  };
  if(!editing){
    return html`<button class="settings-action" onClick=${start}
      title="Your public display name on shared decks">
      ${profile?.display_name ? `Change display name` : `Set display name`}
    </button>`;
  }
  return html`<div class="display-name-edit">
    <input type="text" value=${value} maxLength=${32}
      placeholder="Pick a display name"
      onInput=${e => setValue(e.target.value)}
      onKeyDown=${e => { if(e.key==="Enter") submit(); else if(e.key==="Escape") cancel(); }}
      autoFocus/>
    <div class="display-name-edit-row">
      <button class="settings-action link" onClick=${cancel} disabled=${saving}>Cancel</button>
      <button class="settings-action primary" onClick=${submit} disabled=${saving || !value.trim()}>
        ${saving ? "Saving…" : "Save"}
      </button>
    </div>
    ${err && html`<div class="display-name-edit-err">${err}</div>`}
  </div>`;
}

function AvatarPicker({raw, onPick, onClose}){
  const [q, setQ] = useState("");
  const cards = useMemo(() => {
    const seen = new Set();
    const out = [];
    for(const r of raw){
      if(!r.card_id || !r.img_small) continue;
      if(seen.has(r.card_id)) continue;
      seen.add(r.card_id);
      out.push({card_id:r.card_id, name:r["Product Name"], img:r.img_small, set:r.Set});
    }
    return out;
  }, [raw]);
  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    if(!needle) return cards.slice(0, 240);
    const matches = [];
    for(const c of cards){
      if((c.name||"").toLowerCase().includes(needle)){ matches.push(c); if(matches.length >= 240) break; }
    }
    return matches;
  }, [cards, q]);
  useEffect(() => {
    const onKey = e => { if(e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);
  return html`<div class="avatar-picker-backdrop" onClick=${onClose}>
    <div class="avatar-picker" onClick=${e=>e.stopPropagation()}>

        <h3 class="title-font" style=${{margin:0,fontSize:16}}>Choose a profile card</h3>

        <button class="avatar-picker-close" onClick=${onClose} aria-label="Close">${"×"}</button>
      </div>
      <div class="avatar-picker-grid">

          No cards match "${q}".</div>`}
      </div>
    </div>
  </div>`;
}

// Minimal CSV parser that handles quoted fields with embedded commas /
// doubled-quotes — sufficient for Dreamborn exports.
function parseCsvText(text){
  text = text.replace(/^﻿/, ""); // strip BOM if present
  const rows = [];
  let cur = "", row = [], inQ = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQ){
      if(c==='"' && text[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ = false; }
      else cur += c;
    } else {
      if(c===','){ row.push(cur); cur=""; }
      else if(c==='"' && cur===""){ inQ = true; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){ /* skip */ }
      else cur += c;
    }
  }
  if(cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// Foil printing preference — different cards may use any of these strings,
// and CSV "Foil" maps to whichever is present.
const FOIL_PRINTING_PREF = ["Foil","Cold Foil","Holofoil"];

// Normalize card names for fuzzy matching. Dreamborn exports drift from
// Lorcast's canonical strings in three predictable ways:
//   - Title case vs sentence case ("Out Of Order" vs "Out of Order")
//   - Curly apostrophes vs straight ("He's" vs "He's")
//   - Whitespace around hyphens / extra spaces
// Lowercasing + quote/dash unification + whitespace collapse covers all
// observed cases without risking false positives (cards keep distinct
// names after normalization).
function normalizeCardName(s){
  return (s||"")
    .toLowerCase()
    .replace(/[‘’ʼʻ`´]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[–—]/g, "-")
    .replace(/\s*&\s*/g, " and ")
    .replace(/\s+/g, " ")
    .trim();
}
// Aggressive fallback key: strips all whitespace. Catches cases where word
// boundaries differ between sources, e.g. Dreamborn's "Tweedle Dee" vs
// Lorcast's "Tweedledee". Only consulted when the primary normalized key
// misses, so collision risk is acceptable.
function squashCardName(s){
  return normalizeCardName(s).replace(/\s+/g, "");
}

// Parse a Dreamborn-style CSV and resolve each row to (card_id, printing,
// qty) entries against our raw catalog (rowsByName index).
// Returns {entries, matchedCards, unmatched, totalNormal, totalFoil, error}.
function parseDreambornCsv(text, rowsByName){
  const rows = parseCsvText(text).filter(r => r.length && r.some(c => c && c.length));
  if(!rows.length) return {error:"CSV is empty."};
  const header = rows[0].map(h => h.trim().toLowerCase());
  const need = ["normal","foil","name"];
  for(const k of need){
    if(!header.includes(k)) return {error:`CSV is missing required column "${k}". Expected Dreamborn export format.`};
  }
  const idx = {
    normal: header.indexOf("normal"),
    foil:   header.indexOf("foil"),
    name:   header.indexOf("name"),
    number: header.indexOf("card number"),
  };
  const entries = [];
  const unmatched = [];
  let matchedCards = 0, totalNormal = 0, totalFoil = 0;
  for(let i=1; i<rows.length; i++){
    const cols = rows[i];
    const n = parseInt((cols[idx.normal]||"").trim(), 10) || 0;
    const f = parseInt((cols[idx.foil]||"").trim(), 10) || 0;
    if(n<=0 && f<=0) continue;
    const name = (cols[idx.name]||"").trim();
    if(!name) continue;
    const cn = idx.number>=0 ? (cols[idx.number]||"").trim() : "";

    let candidates = rowsByName.primary[normalizeCardName(name)];
    if(!candidates || !candidates.length){
      candidates = rowsByName.squash[squashCardName(name)];
    }
    if(!candidates || !candidates.length){
      unmatched.push({name, normal:n, foil:f});
      continue;
    }
    if(cn){
      const byNum = candidates.filter(r => String(r.Number).trim() === String(cn).trim());
      if(byNum.length) candidates = byNum;
    }
    const byPrint = {};
    for(const r of candidates){ if(!byPrint[r.tcg_printing]) byPrint[r.tcg_printing] = r; }

    let pushed = false;
    if(n>0 && byPrint.Normal){
      entries.push({cardId:byPrint.Normal.card_id, printing:"Normal", qty:n, name});
      totalNormal += n; pushed = true;
    }
    if(f>0){
      let foilRow = null;
      for(const pref of FOIL_PRINTING_PREF){ if(byPrint[pref]){ foilRow = byPrint[pref]; break; } }
      if(!foilRow){
        for(const k of Object.keys(byPrint)){ if(k!=="Normal"){ foilRow = byPrint[k]; break; } }
      }
      if(foilRow){
        entries.push({cardId:foilRow.card_id, printing:foilRow.tcg_printing, qty:f, name});
        totalFoil += f; pushed = true;
      }
    }
    if(pushed) matchedCards++;
    else unmatched.push({name, normal:n, foil:f, reason:"no matching printing"});
  }
  return {entries, matchedCards, unmatched, totalNormal, totalFoil};
}

// Sealed Collection — per-user inventory of booster boxes / packs / troves
// etc. Grouped by display type (mirrors the Market Sealed sub-tab). Rows have
// +/- counters that persist to sealed_collection_items via updateSealedQty.
function SealedCollectionView({raw, user, sealedPrices, sealedCollection, updateSealedQty, onSignIn}){
  const [priceMode, setPriceMode] = useState(()=>{
    try { return localStorage.getItem("packsink:market:priceMode") || "low"; }
    catch { return "low"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:market:priceMode", priceMode); } catch {} }, [priceMode]);
  const [hideUnowned, setHideUnowned] = useState(false);
  const useMarket = priceMode === "market";
  const priceField = useMarket ? "market_price" : "low_price";

  const setNameById = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.Set && r.set_id && !m[r.set_id]) m[r.set_id] = r.Set;
    return m;
  }, [raw]);

  // Group by display type (reuses the SealedView classifier), sorted by set
  // newest-first within each section. Optionally filter to only owned items
  // so the page is scannable once the user has even a few SKUs.
  const grouped = useMemo(()=>{
    const items = (sealedPrices || []).filter(p =>
      p.printing === "Normal" && p.product_type !== "Promo Single"
    );
    const filtered = hideUnowned
      ? items.filter(p => (sealedCollection[p.tcgplayer_product_id] || 0) > 0)
      : items;
    const byType = new Map();
    for(const item of filtered){
      const t = deriveSealedDisplayType(item);
      if(!byType.has(t)) byType.set(t, []);
      byType.get(t).push(item);
    }
    const setOrder = {};
    Object.entries(setNameById).forEach(([sid]) => { setOrder[sid] = 0; });
    // The matview gives us set_ids but we want newest-first ordering. Use
    // MAINLINE_SETS reversed: the higher the index in MAINLINE_SETS, the
    // newer; reversal flips it so newer sets get lower sort keys.
    MAINLINE_SETS.forEach((name, i) => {
      const sid = Object.entries(setNameById).find(([, n]) => n === name)?.[0];
      if(sid) setOrder[sid] = MAINLINE_SETS.length - i;
    });
    const out = [];
    for(const [type, list] of byType){
      list.sort((a, b) => {
        const ai = a.set_id != null ? (setOrder[a.set_id] ?? 999) : 1000;
        const bi = b.set_id != null ? (setOrder[b.set_id] ?? 999) : 1000;
        if(ai !== bi) return ai - bi;
        return (a.name||"").localeCompare(b.name||"");
      });
      out.push({type, items: list});
    }
    out.sort((a, b) => sealedDisplayTypeRank(a.type) - sealedDisplayTypeRank(b.type));
    return out;
  }, [sealedPrices, sealedCollection, hideUnowned, setNameById]);

  // Totals: number of sealed items owned + their combined market value.
  const totals = useMemo(()=>{
    let units = 0, distinct = 0, value = 0;
    if(!sealedPrices) return {units, distinct, value};
    const priceByPid = {};
    for(const p of sealedPrices){
      if(p.printing !== "Normal") continue;
      priceByPid[p.tcgplayer_product_id] = parseFloat(p[priceField]);
    }
    for(const [pid, qty] of Object.entries(sealedCollection)){
      if(qty <= 0) continue;
      distinct++;
      units += qty;
      const p = priceByPid[pid];
      if(p && !isNaN(p)) value += p * qty;
    }
    return {units, distinct, value};
  }, [sealedCollection, sealedPrices, priceField]);

  if(!user){
    return html`<div class="sealed-coll-empty">
      <p>Sign in with Google to track which booster boxes, packs and troves you own.</p>
      <button class="settings-action primary" onClick=${onSignIn}>Sign in with Google</button>
    </div>`;
  }

  return html`<div class="sealed-coll">
    <div class="sealed-coll-summary">
      <div class="sealed-coll-stat">
        <div class="sealed-coll-stat-lbl">Units owned</div>
        <div class="sealed-coll-stat-val">${totals.units.toLocaleString()}</div>
      </div>
      <div class="sealed-coll-stat">
        <div class="sealed-coll-stat-lbl">Distinct SKUs</div>
        <div class="sealed-coll-stat-val">${totals.distinct.toLocaleString()}</div>
      </div>
      <div class="sealed-coll-stat">
        <div class="sealed-coll-stat-lbl">Estimated value (${useMarket?"Market":"Low"})</div>
        <div class="sealed-coll-stat-val">${fmt(totals.value)}</div>
      </div>
      <div class="sealed-coll-controls">
        <div class="market-sim-kind" role="group" aria-label="Price source">
          <button class=${priceMode==="low"?"active":""} onClick=${()=>setPriceMode("low")}>Low</button>
          <button class=${priceMode==="market"?"active":""} onClick=${()=>setPriceMode("market")}>Market</button>
        </div>
        <label class="sealed-coll-flag" title="Only show sealed products you actually own.">
          <input type="checkbox" checked=${hideUnowned} onChange=${e=>setHideUnowned(e.target.checked)}/>
          <span>Show only owned</span>
        </label>
      </div>
    </div>

    ${(!sealedPrices || sealedPrices.length === 0) && html`<div class="muted" style=${{fontSize:13,padding:"20px 0"}}>
      No sealed-product price data yet. Run supabase/16_sealed_prices_latest.sql, then refresh_sealed_prices_latest(), then reload.
    </div>`}

    ${grouped.map(({type, items}) => html`<div class="sealed-set" key=${type}>
      <div class="sealed-set-header">
        <span class="sealed-set-title">${type}</span>
        <span class="sealed-set-count">${items.length}</span>
      </div>
      <div class="sealed-rows">
        <div class="sealed-row sealed-coll-row sealed-row-head">
          <div class="sealed-row-set">Set</div>
          <div class="sealed-row-name">Product</div>
          <div class="sealed-row-price">${useMarket?"Market":"Low"}</div>
          <div class="sealed-coll-owned-lbl">Owned</div>
          <div class="sealed-coll-counter-lbl">Quantity</div>
        </div>
        ${items.map(item => {
          const setName = item.set_id ? setNameById[item.set_id] : null;
          const url = tcgUrl(item.tcgplayer_product_id);
          const price = item[priceField];
          const qty = sealedCollection[item.tcgplayer_product_id] || 0;
          const bump = (delta) => {
            const next = Math.max(0, Math.min(99, qty + delta));
            if(next !== qty) updateSealedQty(item.tcgplayer_product_id, next);
          };
          return html`<div class=${"sealed-row sealed-coll-row"+(qty>0?" owned":"")} key=${item.tcgplayer_product_id}>
            <div class="sealed-row-set">
              ${setName
                ? html`<span class="sealed-set-pill sealed-set-pill-muted">${setName}</span>`
                : html`<span class="sealed-set-pill sealed-set-pill-muted">—</span>`}
            </div>
            <div class="sealed-row-name">
              ${url
                ? html`<a href=${url} target="_blank" rel="noopener nofollow"
                    title=${item.name}>${cleanSealedName(item.name)}<span class="sealed-name-ext">↗</span></a>`
                : cleanSealedName(item.name)}
            </div>
            <div class="sealed-row-price">${fmt(price)}</div>
            <div class="sealed-coll-owned-val">${qty > 0 ? fmt((price || 0) * qty) : ""}</div>
            <div class="sealed-coll-counter">
              <button onClick=${()=>bump(-1)} disabled=${qty<=0} aria-label="Decrease">−</button>
              <span class=${"sealed-coll-counter-qty"+(qty>0?" has":"")}>${qty}</span>
              <button onClick=${()=>bump(+1)} disabled=${qty>=99} aria-label="Increase">+</button>
            </div>
          </div>`;
        })}
      </div>
    </div>`)}

    ${grouped.length === 0 && hideUnowned && sealedPrices && sealedPrices.length > 0 && html`<div class="muted" style=${{fontSize:13,padding:"20px 0"}}>
      You don't own any sealed product yet — toggle "Show only owned" off to add some.
    </div>`}
  </div>`;
}

const CollectionView = ({raw, user, collection, collectionLoading, updateQty, bulkUpdateCollection, sealedPrices, sealedCollection, updateSealedQty, tabClickNonce, onSignIn, theme}) => {
  // All hooks must run unconditionally on every render (Rules of Hooks).
  const [selectedSet, setSelectedSet] = useState(null);
  // Cards-vs-Sealed top-level toggle. Persisted so coming back lands on the
  // tab the user was last using.
  const [section, setSection] = useState(()=>{
    try { return localStorage.getItem("packsink:collection:section") || "cards"; }
    catch { return "cards"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:collection:section", section); } catch {} }, [section]);
  // Re-clicking the Collection tab while inside a set drops back to the
  // top-level set grid. tabClickNonce increments on every tab click.
  useEffect(() => {
    if(tabClickNonce > 0) setSelectedSet(null);
  }, [tabClickNonce]);
  // 1 = Master Set, 4 = Play Set. Any integer 1-4 supported.
  const [copies, setCopies] = useState(1);
  // CSV import flow state. null when idle; {report, mode, busy} when a file
  // has been parsed and the user is reviewing the preview modal.
  const [importState, setImportState] = useState(null);
  const importFileRef = useRef(null);

  // Map raw rows by (card_id, tcg_printing) for fast lookup
  const cardByKey = useMemo(()=>{
    const m = {};
    for(const r of raw) if(r.card_id && r.tcg_printing){
      m[r.card_id+":"+r.tcg_printing] = r;
    }
    return m;
  }, [raw]);

  // Index for CSV import: normalized Product Name → [raw rows]. Used to
  // resolve Dreamborn export rows (which key on Name + collector number)
  // back to our (card_id, tcg_printing) shape. Normalized so case +
  // punctuation drift between Dreamborn and Lorcast doesn't drop matches.
  const rowsByName = useMemo(()=>{
    const m = {}, mSquash = {};
    for(const r of raw){
      const n = r["Product Name"];
      if(!n || !r.card_id || !r.tcg_printing) continue;
      const k = normalizeCardName(n);
      if(!m[k]) m[k] = [];
      m[k].push(r);
      const sk = squashCardName(n);
      if(!mSquash[sk]) mSquash[sk] = [];
      mSquash[sk].push(r);
    }
    return {primary:m, squash:mSquash};
  }, [raw]);

  // Per-set card lists by rarity bucket — used both for catalog totals and
  // missing/extras value calculation. Each bucket is a Set<card_id>.
  const setCardLists = useMemo(()=>{
    const m = {};
    const ensure = (s) => {
      if(!m[s]) m[s] = {normal:new Set(), foil:new Set(), enchanted:new Set(), iconic:new Set(), epic:new Set()};
      return m[s];
    };
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      const s = ensure(r.Set);
      if(r.Rarity === "Enchanted")    s.enchanted.add(r.card_id);
      else if(r.Rarity === "Iconic")  s.iconic.add(r.card_id);
      else if(r.Rarity === "Epic")    s.epic.add(r.card_id);
      else if(r.tcg_printing === "Normal") s.normal.add(r.card_id);
      else s.foil.add(r.card_id);
    }
    return m;
  }, [raw]);

  const setTotals = useMemo(()=>{
    const out = {};
    for(const [k,v] of Object.entries(setCardLists)){
      out[k] = {normal:v.normal.size, foil:v.foil.size, enchanted:v.enchanted.size, iconic:v.iconic.size, epic:v.epic.size};
    }
    return out;
  }, [setCardLists]);

  // What the user owns, grouped by set + rarity bucket (unique card_ids)
  const owned = useMemo(()=>{
    const m = {};
    const ensure = (s) => {
      if(!m[s]) m[s] = {normal:new Set(), foil:new Set(), enchanted:new Set(), iconic:new Set(), epic:new Set()};
      return m[s];
    };
    for(const [key, qty] of Object.entries(collection)){
      if(qty<=0) continue;
      const card = cardByKey[key];
      if(!card || !SET_ORDER.includes(card.Set)) continue;
      const s = ensure(card.Set);
      if(card.Rarity === "Enchanted")     s.enchanted.add(card.card_id);
      else if(card.Rarity === "Iconic")   s.iconic.add(card.card_id);
      else if(card.Rarity === "Epic")     s.epic.add(card.card_id);
      else if(card.tcg_printing === "Normal") s.normal.add(card.card_id);
      else s.foil.add(card.card_id);
    }
    return m;
  }, [collection, cardByKey]);

  // Compute missing $ and extras $ relative to the chosen copies target.
  // Iterate every main-set (card, printing) pair: needed=copies, owned=qty,
  // missing += max(0, needed-owned)*price, extras += max(0, owned-needed)*price.
  const valueStats = useMemo(()=>{
    let totalValue = 0, totalCards = 0, totalUnique = 0;
    let missing = 0, extras = 0;
    const seenKey = new Set();

    // Iterate main-set products in raw to compute missing
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      if(!r.card_id || !r.tcg_printing) continue;
      const key = r.card_id+":"+r.tcg_printing;
      if(seenKey.has(key)) continue;
      seenKey.add(key);
      const qty = collection[key] || 0;
      const price = r["Low Price"] ?? r["TCGPlayer Market"] ?? 0;
      const need = copies;
      const short = Math.max(0, need - qty);
      const over  = Math.max(0, qty - need);
      missing += short * price;
      extras  += over  * price;
    }
    // Total value across ALL owned cards (including non-main-set if any)
    for(const [key, qty] of Object.entries(collection)){
      if(qty<=0) continue;
      totalCards += qty;
      totalUnique += 1;
      const card = cardByKey[key];
      if(card){
        const price = card["Low Price"] ?? card["TCGPlayer Market"] ?? 0;
        totalValue += price * qty;
      }
    }
    return {totalValue, totalCards, totalUnique, missing, extras};
  }, [raw, collection, cardByKey, copies]);

  // For per-set missing dollar amounts — same logic, scoped to a set.
  const setMissing = useMemo(()=>{
    const m = {};
    for(const r of raw){
      if(!SET_ORDER.includes(r.Set)) continue;
      if(!r.card_id || !r.tcg_printing) continue;
      const key = r.card_id+":"+r.tcg_printing;
      const qty = collection[key] || 0;
      const need = copies;
      const short = Math.max(0, need - qty);
      if(short === 0) continue;
      const price = r["Low Price"] ?? r["TCGPlayer Market"] ?? 0;
      if(!m[r.Set]) m[r.Set] = {count:0, value:0};
      m[r.Set].count += short;
      m[r.Set].value += short * price;
    }
    return m;
  }, [raw, collection, copies]);

  const handleImportFile = useCallback(async (file) => {
    if(!file) return;
    let text;
    try { text = await file.text(); }
    catch(e){ alert("Couldn't read file: "+e.message); return; }
    const report = parseDreambornCsv(text, rowsByName);
    if(report.error){ alert(report.error); return; }
    if(!report.entries.length){
      alert("CSV parsed but no rows have Normal or Foil quantities > 0. Nothing to import.");
      return;
    }
    setImportState({report, mode:"replace", busy:false});
  }, [rowsByName]);

  const commitImport = useCallback(async () => {
    if(!importState || !bulkUpdateCollection) return;
    const {report, mode} = importState;
    setImportState(s => ({...s, busy:true}));
    const updates = [];
    for(const e of report.entries){
      const cur = collection[e.cardId+":"+e.printing] || 0;
      const qty = mode==="add" ? cur + e.qty : e.qty;
      updates.push({cardId:e.cardId, printing:e.printing, qty});
    }
    const result = await bulkUpdateCollection(updates);
    if(!result || !result.ok){
      const msg = (result && result.error) || "unknown error";
      alert(`Import failed after writing ${result?.written ?? 0} rows: ${msg}\n\nYour collection has been rolled back to its previous state.`);
      setImportState(s => ({...s, busy:false}));
      return;
    }
    setImportState(null);
  }, [importState, bulkUpdateCollection, collection]);

  // Early returns AFTER all hooks.
  if(!user) return html`<div class="empty-state">
    <h2 class="title-font">Sign in to track your collection</h2>
    <p>Save the cards you own to Packs.Ink and we'll show your set completion, total value at current Low prices, and what you're still missing.</p>
    <button class="active" onClick=${onSignIn} style=${{padding:"10px 20px",fontSize:14,marginTop:14}}>Sign in with Google</button>
  </div>`;

  if(selectedSet) return html`<${CollectionSetDetail} setName=${selectedSet} raw=${raw}
    collection=${collection} updateQty=${updateQty}
    onBack=${()=>setSelectedSet(null)} theme=${theme}
    user=${user} onSignIn=${onSignIn} copies=${copies}/>`;

  const {totalValue, totalCards, totalUnique, missing, extras} = valueStats;
  const setsToShow = [...SET_ORDER].reverse().filter(s => setTotals[s]);
  const totalMissingCount = Object.values(setMissing).reduce((s,v)=>s+v.count, 0);

  // For overall master/play set %: count owned vs needed across all main-set
  // printings. Extras & Oddities is a curio bucket (starter-deck-exclusive
  // foils etc), not part of the mainline "complete the set" goal — exclude
  // it from both totals so the headline % isn't artificially deflated.
  let totalNeeded = 0, totalOwnedTowardNeed = 0;
  for(const k of Object.keys(setCardLists)){
    if(k === EXTRAS_SET_NAME) continue;
    const tot = setTotals[k];
    totalNeeded += (tot.normal + tot.foil + tot.enchanted + tot.iconic + tot.epic) * copies;
  }
  for(const [key, qty] of Object.entries(collection)){
    if(qty<=0) continue;
    const card = cardByKey[key];
    if(!card || !SET_ORDER.includes(card.Set)) continue;
    if(card.Set === EXTRAS_SET_NAME) continue;
    totalOwnedTowardNeed += Math.min(qty, copies);
  }
  const masterPct = totalNeeded ? (totalOwnedTowardNeed / totalNeeded * 100) : 0;

  return html`<div>
    <div class="collection-section-tabs">
      <button class=${"collection-section-tab"+(section==="cards"?" active":"")}
        onClick=${()=>setSection("cards")}>Cards</button>
      <button class=${"collection-section-tab"+(section==="sealed"?" active":"")}
        onClick=${()=>setSection("sealed")}>Sealed</button>
    </div>
    ${section === "sealed"
      ? html`<${SealedCollectionView} raw=${raw} user=${user}
          sealedPrices=${sealedPrices} sealedCollection=${sealedCollection}
          updateSealedQty=${updateSealedQty} onSignIn=${onSignIn}/>`
      : html`<div>
    <div class="collection-controls">
      <div class="seg-toggle">
        <button class=${copies===1?"active":""} onClick=${()=>setCopies(1)}>Master Set</button>
        <button class=${copies===4?"active":""} onClick=${()=>setCopies(4)}>Play Set</button>
      </div>
      <label class="copies-select">
        <span>Copies:</span>
        <select value=${copies} onChange=${e=>setCopies(parseInt(e.target.value,10))}>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </label>
      <button class="import-csv-btn" onClick=${()=>importFileRef.current && importFileRef.current.click()}
        title="Import a Dreamborn.ink collection CSV">Import CSV</button>
      <input ref=${importFileRef} type="file" accept=".csv,text/csv" style=${{display:"none"}}
        onChange=${e=>{ const f=e.target.files && e.target.files[0]; e.target.value=""; handleImportFile(f); }}/>
    </div>

    ${importState && html`<div class="import-modal-backdrop" onClick=${()=>!importState.busy && setImportState(null)}>
      <div class="import-modal" onClick=${e=>e.stopPropagation()}>
        <h3 class="title-font" style=${{margin:"0 0 10px",fontSize:18}}>Import Collection CSV</h3>
        <div class="import-summary">
          <div><strong>${importState.report.matchedCards.toLocaleString()}</strong> cards matched
            (<strong>${importState.report.totalNormal.toLocaleString()}</strong> normal +
             <strong>${importState.report.totalFoil.toLocaleString()}</strong> foil)</div>
          ${importState.report.unmatched.length > 0 && html`<div class="import-unmatched">
            <strong>${importState.report.unmatched.length.toLocaleString()}</strong> rows couldn't be matched
            ${importState.report.unmatched.length <= 8
              ? html`<ul>${importState.report.unmatched.map((u,i)=>html`<li key=${i}>${u.name}</li>`)}</ul>`
              : html`<ul>${importState.report.unmatched.slice(0,6).map((u,i)=>html`<li key=${i}>${u.name}</li>`)}
                  <li>…and ${(importState.report.unmatched.length-6).toLocaleString()} more</li></ul>`}
          </div>`}
        </div>
        <div class="import-mode">
          <label><input type="radio" name="import-mode" checked=${importState.mode==="replace"}
            onChange=${()=>setImportState(s=>({...s,mode:"replace"}))}/>
            Replace — set each card's quantity to the CSV value
          </label>
          <label><input type="radio" name="import-mode" checked=${importState.mode==="add"}
            onChange=${()=>setImportState(s=>({...s,mode:"add"}))}/>
            Add — add CSV quantities on top of what you already own
          </label>
        </div>
        <div class="import-actions">
          <button onClick=${()=>setImportState(null)} disabled=${importState.busy}>Cancel</button>
          <button class="active" onClick=${commitImport} disabled=${importState.busy}>
            ${importState.busy ? "Importing…" : "Import"}
          </button>
        </div>
      </div>
    </div>`}

    <div class="collection-stats">
      <div class="stat-card">
        <div class="stat-card-lbl">Owned Value</div>
        <div class="stat-card-val green">$${totalValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="stat-card-sub">${totalCards.toLocaleString()} cards · ${totalUnique.toLocaleString()} unique</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-lbl">${copies===1?"Master Set":copies===4?"Play Set":copies+"× Set"}</div>
        <div class="stat-card-val">${masterPct.toFixed(1)}%</div>
        <div class="stat-card-sub">${totalOwnedTowardNeed.toLocaleString()} / ${totalNeeded.toLocaleString()} needed</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-lbl">Extras</div>
        <div class="stat-card-val">$${extras.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="stat-card-sub">value beyond target</div>
      </div>
    </div>

    <div class="collection-sets">
      ${setsToShow.map(setName => {
        const tot = setTotals[setName];
        const own = owned[setName] || {normal:new Set(),foil:new Set(),enchanted:new Set(),iconic:new Set(),epic:new Set()};
        // Extras & Oddities is a flat catch-all bucket — split foil/normal
        // counts here would be misleading (every card is foil-class) and
        // the per-rarity chase pills are irrelevant. Render a single
        // count + progress bar instead.
        if(setName === EXTRAS_SET_NAME){
          const total = own.normal.size + own.foil.size + own.enchanted.size + own.iconic.size + own.epic.size;
          const denom = tot.normal + tot.foil + tot.enchanted + tot.iconic + tot.epic;
          const pct = denom ? (total/denom*100) : 0;
          return html`<div key=${setName} class="set-progress-card" onClick=${()=>setSelectedSet(setName)}>
            <div class="set-progress-name">${setName}</div>
            <div class="set-progress-row">
              <div class="set-progress-row-counts" style=${{gridColumn:"1 / -1",textAlign:"right"}}>
                ${total} / ${denom} <span class="set-progress-pct">${pct.toFixed(0)}%</span>
              </div>
              <div class="progress-bar" style=${{gridColumn:"1 / -1"}}>
                <div class="progress-fill" style=${{width:pct+"%"}}/>
              </div>
            </div>
          </div>`;
        }
        const nOwn = own.normal.size, fOwn = own.foil.size;
        const nPct = tot.normal ? (nOwn/tot.normal*100) : 0;
        const fPct = tot.foil   ? (fOwn/tot.foil*100)   : 0;
        const mis = setMissing[setName];
        return html`<div key=${setName} class="set-progress-card" onClick=${()=>setSelectedSet(setName)}>
          <div class="set-progress-name">${setName}</div>
          <div class="set-progress-row">
            <div class="set-progress-row-label">Normal</div>
            <div class="set-progress-row-counts">${nOwn} / ${tot.normal} <span class="set-progress-pct">${nPct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style=${{width:nPct+"%"}}/></div>
          </div>
          ${tot.foil>0 && html`<div class="set-progress-row">
            <div class="set-progress-row-label">Foil</div>
            <div class="set-progress-row-counts">${fOwn} / ${tot.foil} <span class="set-progress-pct">${fPct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill foil" style=${{width:fPct+"%"}}/></div>
          </div>`}
          ${CHASE_KEYS.some(k => tot[k] > 0) && html`<div class="set-chase-row">
            ${CHASE_KEYS.filter(k => tot[k] > 0).map(k => html`<div key=${k} class="chase-pill">
              <span class="chase-pill-lbl">${k[0].toUpperCase()+k.slice(1)}</span>
              <span class="chase-pill-val">${own[k].size} / ${tot[k]}</span>
            </div>`)}
          </div>`}
        </div>`;
      })}
    </div>
  </div>`}
  </div>`;
};

function FAQView(){
  return html`<div class="faq-section">
    <h2>What is this?</h2>
    <p>This tool calculates the <strong>Expected Value (EV)</strong> of opening Disney Lorcana booster boxes and packs. It uses live market prices from <strong>TCGPlayer</strong> (via the Lorcast API, updated daily) and known pull rates to estimate how much value you can expect from a box or pack on average.</p>

    <h2>How does it work?</h2>
    <p>Each booster pack contains 12 cards with a specific distribution: 6 commons (one per ink color), 3 uncommons, 2 rare-or-higher cards, and 1 foil slot. The EV is calculated by multiplying the <strong>average market price</strong> of each rarity by the <strong>number of cards of that rarity per box</strong> (24 packs), then summing everything up.</p>
    <p>For example, if the average Legendary card in a set is worth $5.00 and you pull 4 Legendaries per box on average, that rarity contributes $20 to the box EV.</p>

    <h2>What do the tabs do?</h2>
    <p><strong>EV / Box</strong> \u2014 Shows the total expected value per box and per pack for each set, side by side.</p>
    <p><strong>Average Card Prices</strong> \u2014 Shows the average market price of each rarity across all sets. Useful for seeing which sets have the most valuable commons, rares, enchanteds, etc.</p>
    <p><strong>Pack Sim</strong> \u2014 Simulates opening a single pack using real pull rate probabilities. Shows card images and tracks stats across multiple openings.</p>
    <p><strong>Box Sim</strong> \u2014 Simulates opening an entire box (24 packs). Shows your best pull with card art, tracks your box history, and highlights your best box. Also includes a Monte Carlo simulation that runs thousands of box openings to show the statistical distribution of outcomes.</p>
    <p><strong>Compare</strong> \u2014 Compare two sets side-by-side to see which has higher average card values at each rarity and overall EV.</p>
    <p><strong>Heatmap</strong> \u2014 Shows what percentage of each set's total EV comes from each rarity tier. Helps you understand where the value is concentrated\u2014for example, whether a set's value is driven by Enchanteds or spread across lower rarities.</p>

    <h2>What does the "${" <$1\u2192$0"}" checkbox do?</h2>
    <p>When enabled, any card worth less than $1.00 is treated as worth $0.00 in the EV calculation. This gives a more realistic picture of "sellable" value, since bulk cards under a dollar are often not worth listing individually. Most collectors and sellers use this view to see the "real" EV after ignoring penny cards.</p>

    <h2>What does "No Ench/Iconic" do?</h2>
    <p>This removes Enchanted and Iconic cards from the EV calculation. Since these ultra-rare cards are extremely hard to pull (Enchanted: ~1 per 4 boxes, Iconic: ~1 per 71 boxes), they can inflate the EV significantly even though most box openings won't contain one. Toggling this on shows you the "base" EV you can expect without relying on hitting a jackpot card.</p>

    <h2>What are the pull rates?</h2>
    <p><strong>Sets 1–11</strong> (The First Chapter through Winterspell) per box (24 packs): 144 Commons, 72 Uncommons, ~32 Rares, 12 Super Rares, 4 Legendaries, 13 Common Foils, 6 Uncommon Foils, 3 Rare Foils, 1 Super Rare Foil, 0.5 Legendary Foils, 0.25 Enchanteds, 1.5 Epics, and ~0.014 Iconics.</p>
    <p><strong>Sets 12+</strong> (Wilds Unknown onward) per box (24 packs): 144 Commons, 72 Uncommons, ~30 Rares, 12 Super Rares, <strong>6 Legendaries</strong>, ~12.3 Common Foils, ~5.7 Uncommon Foils, 3 Rare Foils, 1 Super Rare Foil, 0.5 Legendary Foils, <strong>0.333 Enchanteds</strong>, <strong>2.5 Epics</strong>, and ~0.014 Iconics. The extra Legendaries come from the Rare slot, while the increased Enchanted and Epic rates are offset proportionally from Common and Uncommon Foil pulls.</p>
    <p>These are community-estimated averages and may vary.</p>

    <h2>Where does the pricing data come from?</h2>
    <p><strong>Live prices</strong> come from <strong>TCGCSV</strong> (a free mirror of TCGPlayer's catalog + market price data), refreshed daily. Card metadata (names, images, rules text, sets) comes from <strong>Lorcast</strong>. Everything is loaded into our own database overnight and the site reads from there, so prices on the site reflect TCGPlayer's snapshot from the latest daily refresh — not a live pull on each page load.</p>
    <p>The <strong>primary price shown is the NM Low Price</strong> (the cheapest current Near Mint listing on TCGPlayer), with the smoothed "Market Price" displayed beneath it for context. Low is the more actionable number for buyers — it's the actual current floor — while Market is an algorithmic estimate that lags reality.</p>

function SetDetail({data,mult,activeRars,theme}){

    if(rf) list=list.filter(c=>c.rarity===rf);
    return list.sort((a,b)=>(b.price||0)-(a.price||0));
  },[data,activeRars,rf]);
  return html`<div style=${{padding:"12px 16px",background:"var(--bg-surface)",borderTop:"1px solid var(--border)"}}>
    <div style=${{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
      <button onClick=${()=>setRf(null)} class=${rf===null?"active":""} style=${{fontSize:11,padding:"3px 8px"}}>All</button>
      ${SET_RARS.filter(r=>activeRars.has(r)).map(r=>{const s=getBadgeStyle(r,theme);
        return html`<button key=${r} onClick=${()=>setRf(rf===r?null:r)}
          style=${{background:rf===r?s.bg:"transparent",color:rf===r?s.fg:"var(--btn-text)",
            border:rf===r?"1px solid "+(s.fg+"40"):"1px solid var(--btn-border)",fontSize:11,padding:"3px 8px",borderRadius:6}}>${r} (${data.byRar[r]?.count||0})</button>`;

        <tbody>${cards.map((c,i)=>{const url=tcgUrl(c.tcgplayer_product_id, c.tcg_printing);
          return html`<tr key=${i}>
          <td style=${{textAlign:"left",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            ${c.img_small?html`<img src=${c.img_small} alt="" style=${{width:24,height:34,borderRadius:3,verticalAlign:"middle",marginRight:6,objectFit:"cover"}}/>`:null}${c.name}
          </td>
          <td><${Badge} rarity=${c.rarity} theme=${theme}/></td>

        </tr>`;})}</tbody></table>

}

function SetValuesView({rawData,sets,theme,priceMode}){
  const [mode,setMode]=useState("playset");
  const [activeRars,setActiveRars]=useState(()=>new Set(SET_RARS));
  const [expanded,setExpanded]=useState(null);
  const mult=mode==="playset"?4:1;
  const priceField = priceMode === "market" ? "TCGPlayer Market" : "Low Price";
  const setData=useMemo(()=>{
    const result={};
    for(const set of sets){
      const cards={};
      for(const row of rawData){
        if((row["Set"]||"").trim()!==set) continue;
        const rar=(row["Rarity"]||"").trim(),pr=(row["Printing"]||"").trim();
        if(pr!=="Normal"||!SET_RARS.includes(rar)) continue;
        const name=(row["Product Name"]||"").trim(),price=parseP(row[priceField]);
        if(!cards[name]) cards[name]={name,rarity:rar,price,img_small:row["img_small"],img_normal:row["img_normal"],num:row["Number"]};
      }
      const cardList=Object.values(cards);
      const byRar={};
      for(const r of SET_RARS){const rc=cardList.filter(c=>c.rarity===r);byRar[r]={cards:rc,total:rc.reduce((t,c)=>t+(c.price||0),0),count:rc.length};}
      result[set]={cards:cardList,byRar};
    }
    return result;
  },[rawData,sets,priceField]);
  const toggleRar=r=>{setActiveRars(prev=>{const next=new Set(prev);if(next.has(r)) next.delete(r); else next.add(r);return next;});};
  const getTotal=s=>{const d=setData[s];if(!d) return 0;let t=0;for(const r of SET_RARS) if(activeRars.has(r)) t+=(d.byRar[r]?.total||0);return t*mult;};
  return html`<div>
    <div class="row" style=${{gap:12}}>
      <div style=${{display:"flex",gap:4}}>
        <button onClick=${()=>setMode("playset")} class=${mode==="playset"?"active":""}>Playset (4x)</button>
        <button onClick=${()=>setMode("master")} class=${mode==="master"?"active":""}>Master Set (1x)</button>
      </div>
      <div style=${{display:"flex",gap:4,flexWrap:"wrap"}}>
        ${SET_RARS.map(r=>{const s=getBadgeStyle(r,theme),on=activeRars.has(r);
          return html`<button key=${r} onClick=${()=>toggleRar(r)} style=${{background:on?s.bg:"transparent",color:on?s.fg:"var(--text-muted)",
            border:on?"1px solid "+(s.fg+"40"):"1px solid var(--border)",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:600,
            opacity:on?1:0.4,transition:"all 0.15s"}}>${r}</button>`;
        })}
      </div>
    </div>
    <div class="scr"><table>
      <thead><tr>
        <th style=${{textAlign:"left",minWidth:160}}>Set</th><th style=${{minWidth:90}}>Total</th>
        ${SET_RARS.map(r=>html`<th key=${r} style=${{minWidth:70,opacity:activeRars.has(r)?1:0.3}}>${r}</th>`)}
        <th style=${{width:40}}>Cards</th>
      </tr></thead>
      <tbody>${sets.map(s=>{const d=setData[s];if(!d) return null;const total=getTotal(s),isExp=expanded===s;
        return html`<${React.Fragment} key=${s}>
          <tr onClick=${()=>setExpanded(isExp?null:s)} style=${{cursor:"pointer",background:isExp?"var(--accent-glow)":"inherit"}}>
            <td style=${{fontWeight:500,textAlign:"left"}}><span style=${{marginRight:6,fontSize:10,color:"var(--text-muted)"}}>${isExp?"▼":"▶"}</span>${s}</td>
            <td style=${{fontWeight:600}}>${fmt(total)}</td>
            ${SET_RARS.map(r=>{const rv=(d.byRar[r]?.total||0)*mult;
              return html`<td key=${r} style=${{opacity:activeRars.has(r)?1:0.3}}>${fmt(rv)}</td>`;})}
            <td class="muted">${d.cards.length}</td>
          </tr>
          ${isExp&&html`<tr><td colspan=${SET_RARS.length+3} style=${{padding:0,border:"none"}}>
            <${SetDetail} data=${d} mult=${mult} activeRars=${activeRars} theme=${theme}/>
          </td></tr>`}
        <//>`;})}</tbody>
    </table></div>
    <p class="muted" style=${{fontSize:11,marginTop:8}}>Normal printings only (excludes foils, Enchanted, Epic, Iconic). ${mode==="playset"?"Playset = 4 copies of each card.":"Master Set = 1 copy of each card."} Prices via Lorcast (TCGPlayer).</p>
  </div>`;
}

    try { return localStorage.getItem("packsink:market:sub") || "ev"; }

      ${MARKET_SUBS.map(([k,l])=>html`<button key=${k}

    ${sub==="ev"      && html`<${EVView} raw=${raw} sets=${setsNewest} avgs=${avgs}

      openSetHistory=${openSetHistory}/>`}
    ${sub==="avg"     && html`<${AvgView} sets=${setsNewest} avgs=${avgs} nc=${nc} priceMode=${priceMode}
      openSetHistory=${openSetHistory}/>`}
    ${sub==="sealed"  && html`<${SealedView} raw=${raw} sets=${setsNewest}
