// ── Home (landing) ──────────────────────────────────────────────────────
// Two horizontally-scrolling banners of biggest 1-day movers, split by
// rarity tier. Driven by the `price_movers` view (09_price_movers.sql),
// which already enforces the low_prev ≥ $5 floor and computes 1d/7d/30d Δ%.
// We fetch enough to bucket client-side and take top 20 per bucket.
const CHASE_RARS = new Set(["Enchanted","Iconic","Epic"]);
const RARELEG_RARS = new Set(["Rare","Super Rare","Legendary"]);

// Window definitions for the Home movers toolbar. Each window maps to a low
// snapshot column (for the "started >= $5 in this window" floor), a low Δ%
// column (used for sorting + display), and a market Δ% column (display only).
const MOVER_WINDOWS = [
  {key:"1d",  label:"1D", lowCol:"low_prev",  pctLow:"pct_1d",   pctMkt:"mkt_pct_1d"},
  {key:"1w",  label:"1W", lowCol:"low_7d",    pctLow:"pct_7d",   pctMkt:"mkt_pct_7d"},
  {key:"1m",  label:"1M", lowCol:"low_30d",   pctLow:"pct_30d",  pctMkt:"mkt_pct_30d"},
  {key:"3m",  label:"3M", lowCol:"low_90d",   pctLow:"pct_90d",  pctMkt:"mkt_pct_90d"},
  {key:"6m",  label:"6M", lowCol:"low_180d",  pctLow:"pct_180d", pctMkt:"mkt_pct_180d"},
  {key:"1y",  label:"1Y", lowCol:"low_365d",  pctLow:"pct_365d", pctMkt:"mkt_pct_365d"},
];
const MOVER_WIN_BY_KEY = Object.fromEntries(MOVER_WINDOWS.map(w=>[w.key,w]));

// Pick the 3 windows to display on a tile, centered on the active window
// where possible. Active is always included so the sort column is visible.
const pickVisibleWindows = (activeKey) => {
  const i = Math.max(0, MOVER_WINDOWS.findIndex(w => w.key === activeKey));
  const start = Math.max(0, Math.min(MOVER_WINDOWS.length - 3, i - 1));
  return MOVER_WINDOWS.slice(start, start + 3);
};

const fmtPct = (p) => {
  if(p == null) return "—";
  const a = Math.abs(p);
  if(a >= 1000) return (p > 0 ? "+" : "") + Math.round(p/100) + "x"; // 1500% → "+15x"
  // Trim decimals as the number grows so big movers stay inside their cell.
  const fixed = a >= 10 ? 0 : 1;
  return (p > 0 ? "+" : "") + p.toFixed(fixed) + "%";
};
const pctColor = (p) => {
  if(p == null) return "var(--text-muted)";
  if(p > 0) return "var(--green)";
  if(p < 0) return "var(--red)";
  return "var(--text-muted)";
};

// Scroll speed in CSS pixels per second. Lower = slower drift.
const MOVERS_SCROLL_PX_PER_SEC = 28;

const MoversBanner = ({title, subtitle, controls, cards, onTileClick, activeWindow, visibleWindows, paused}) => {
  const wrapRef = useRef(null);
  // Track manual interaction so the rAF loop yields briefly after the user
  // scrolls / wheels — otherwise the auto-advance immediately yanks the
  // scrollLeft back. After 1.5 s of no interaction we resume drifting.
  const lastUserScrollRef = useRef(0);
  // Hover state lives in a ref so updating it doesn't trigger re-renders
  // (and re-create the rAF effect).
  const hoverRef = useRef(false);
  const pausedRef = useRef(paused);
  useEffect(()=>{ pausedRef.current = paused; }, [paused]);
  const reducedMotion = useMemo(()=>{
    if(typeof window === "undefined") return false;
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, []);

  useEffect(()=>{
    const el = wrapRef.current;
    if(!el || cards.length === 0 || reducedMotion) return;
    // Whenever the cards array re-derives (window/direction/mode change),
    // snap back to the start so the new list is read from the beginning
    // rather than mid-stream. Note: paused is NOT in deps — toggling pause
    // must preserve scroll position.
    el.scrollLeft = 0;
    let pos = 0;
    let raf = 0;
    let last = performance.now();
    // Float accumulator — keeps sub-pixel precision between frames. Without
    // this, 28 px/s × 16 ms = 0.45 px/frame and the value gets lost to
    // integer rounding inside the browser's scrollLeft setter on some
    // platforms — the symptom was "doesn't appear to scroll until you've
    // already scrolled the page."
    const onUser = () => { lastUserScrollRef.current = performance.now(); };
    el.addEventListener("wheel",       onUser, {passive:true});
    el.addEventListener("touchmove",   onUser, {passive:true});
    el.addEventListener("pointerdown", onUser);
    const tick = (now) => {
      const dt = Math.min(64, now - last);
      last = now;
      const sinceUser = now - lastUserScrollRef.current;
      if(!pausedRef.current && !hoverRef.current && sinceUser > 1500){
        pos += (MOVERS_SCROLL_PX_PER_SEC * dt) / 1000;
        const half = el.scrollWidth / 2;
        if(half > 0 && pos >= half) pos -= half;
        el.scrollLeft = pos;
      } else {
        // User is interacting (or paused). Keep our accumulator in sync with
        // wherever they've scrolled to, so resumption is seamless.
        pos = el.scrollLeft;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>{
      cancelAnimationFrame(raf);
      el.removeEventListener("wheel",       onUser);
      el.removeEventListener("touchmove",   onUser);
      el.removeEventListener("pointerdown", onUser);
    };
  }, [cards, reducedMotion]);

  return html`<section style=${{margin:"10px 0"}}>
    ${(title || subtitle || controls) ? html`<div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap"}}>
      ${title ? html`<h2 class="title-font" style=${{fontSize:12,fontWeight:600,margin:0,color:"var(--accent)",letterSpacing:0.3}}>${title}</h2>` : null}
      ${controls ? html`<span>${controls}</span>` : null}
      ${subtitle ? html`<span class="muted" style=${{fontSize:10}}>${subtitle}</span>` : null}
    </div>` : null}
    ${cards.length === 0
      ? html`<div class="muted" style=${{fontSize:11,padding:"10px 4px"}}>
          No cards match the current window + direction filters.</div>`
      : html`<div ref=${wrapRef} class=${"movers-wrap"+(paused?" is-paused":"")}
          onMouseEnter=${()=>{ hoverRef.current = true; }}
          onMouseLeave=${()=>{ hoverRef.current = false; }}>
          <div class="movers-track">
            ${cards.map(c => html`<${MoverTile} key=${c.card_id+":"+c.printing} card=${c}
              activeWindow=${activeWindow} visibleWindows=${visibleWindows}
              onClick=${()=>onTileClick && onTileClick(c)}/>`)}
            ${cards.map(c => html`<${MoverTile} key=${"dup:"+c.card_id+":"+c.printing} card=${c}
              activeWindow=${activeWindow} visibleWindows=${visibleWindows}
              onClick=${()=>onTileClick && onTileClick(c)}/>`)}
          </div>
        </div>`}
  </section>`;
};

// Range options for the collection-value chart. Each maps to "days back".
// `all` falls through to fetching the full year (the ETL archive starts
// 2024-02-08, but we cap fetch at 365 days for cost — anything beyond gets
// summarized via the existing 1Y mover delta instead).
const COLLECTION_RANGES = [
  {key:"1m",  label:"1M",  days:30},
  {key:"3m",  label:"3M",  days:90},
  {key:"6m",  label:"6M",  days:180},
  {key:"1y",  label:"1Y",  days:365},
  {key:"all", label:"All", days:365},
];

// Right-side panel on Home: current collection value, line chart over a
// user-selected range, and a tiny "top movers in your collection" list.
const CollectionPanel = ({raw, user, collection, collectionLoading, moversByKey, onTileClick, onSignIn}) => {
  const [rangeKey, setRangeKey] = useState("3m");
  // Controls for the in-panel "Your Top Movers" list. Independent from the
  // main movers banners so the user can ask "what moved most in MY cards
  // this week" without changing the global window.
  const [moversWindow, setMoversWindow] = useState("1w");
  const [moversUp, setMoversUp] = useState(true);
  const [moversDown, setMoversDown] = useState(true);
  // Two-layer cache. (1) In-memory historyCache keyed by (productsHash,
  // rangeKey) holds the raw fetched rows for instant within-session range
  // switching. (2) A localStorage cache holds the COMPUTED value series
  // for the same key so subsequent visits with the same collection paint
  // the chart immediately and refresh in the background. We store only
  // {date,value} pairs (~30 KB per range max), not the raw rows.
  const [historyCache, setHistoryCache] = useState({});
  const [historyState, setHistoryState] = useState({loading:false, error:null});
  // Series shown immediately from persisted cache while a fresh fetch runs.
  const [cachedSeries, setCachedSeries] = useState(null);

  // Build "owned" map: (product_id|printing) -> quantity, plus owned card
  // refs for the mini movers list.
  const owned = useMemo(() => {
    const map = new Map();
    const ownedRows = [];
    if(!user || !raw.length) return {map, ownedRows};
    const byKey = {};
    for(const r of raw){
      if(r.card_id && r.tcg_printing) byKey[r.card_id+":"+r.tcg_printing] = r;
    }
    for(const [k, qty] of Object.entries(collection)){
      if(qty <= 0) continue;
      const r = byKey[k];
      if(!r || !r.tcgplayer_product_id) continue;
      const pk = r.tcgplayer_product_id + "|" + r.tcg_printing;
      map.set(pk, (map.get(pk)||0) + qty);
      ownedRows.push({row:r, qty});
    }
    return {map, ownedRows};
  }, [raw, collection, user]);

  // Current value — uses today's low (with market fallback), same logic as
  // CollectionView so the two views agree.
  const currentValue = useMemo(() => {
    let v = 0;
    for(const {row, qty} of owned.ownedRows){
      const p = row["Low Price"] ?? row["TCGPlayer Market"] ?? 0;
      v += p * qty;
    }
    return v;
  }, [owned]);

  // Fetch only the active range, on demand. Cache by (productsKey, rangeKey)
  // so toggling between ranges only ever incurs one round-trip apiece.
  const ownedProductsKey = useMemo(() => {
    const ids = Array.from(owned.map.keys()).sort();
    return ids.join(",");
  }, [owned.map]);
  const ownedProductsHash = useMemo(() => shortHash(ownedProductsKey), [ownedProductsKey]);
  // Reset the in-session cache when the collection itself changes (otherwise
  // we'd be showing stale rows for a different set of owned cards).
  useEffect(() => { setHistoryCache({}); }, [ownedProductsKey]);
  const historyRows = historyCache[ownedProductsKey]?.[rangeKey] || null;

  // Hydrate the chart from localStorage immediately whenever the user
  // switches range. If the entry is missing/stale we still trigger the
  // network fetch below; the user just doesn't have to stare at "Loading…".
  useEffect(() => {
    if(!user || owned.map.size === 0){ setCachedSeries(null); return; }
    const key = collectionValueCacheKey(user.id, ownedProductsHash, rangeKey);
    const c = readCollectionValueCache(key);
    setCachedSeries(c && c.series.length ? c.series : null);
  }, [user, owned.map, ownedProductsHash, rangeKey]);

  useEffect(() => {
    if(!user || owned.map.size === 0){ setHistoryState({loading:false, error:null}); return; }
    if(historyRows) return; // already fetched this range this session
    const productIds = Array.from(new Set(Array.from(owned.map.keys()).map(k => parseInt(k.split("|")[0],10))));
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    let cancelled = false;
    setHistoryState({loading:true, error:null});
    fetchCollectionPriceHistory(productIds, since)
      .then(rows => {
        if(cancelled) return;
        setHistoryCache(c => ({...c, [ownedProductsKey]: {...(c[ownedProductsKey]||{}), [rangeKey]: rows}}));
        setHistoryState({loading:false, error:null});
      })
      .catch(e => { if(!cancelled) setHistoryState({loading:false, error:String(e.message||e)}); });
    return () => { cancelled = true; };
  }, [user, owned.map, ownedProductsKey, rangeKey, historyRows]);

  // Forward-fill in computeCollectionValueHistory means a card that wasn't
  // priced during the range start still contributes from its most recent
  // prior snapshot.
  const freshSeries = useMemo(() => {
    if(!historyRows) return null;
    return computeCollectionValueHistory(historyRows, owned.map);
  }, [historyRows, owned.map]);

  // Persist the fresh series so the next page load with the same collection
  // hydrates instantly. Plain {date,value} pairs — small, JSON-stringifiable.
  useEffect(() => {
    if(!freshSeries || !freshSeries.length || !user) return;
    const key = collectionValueCacheKey(user.id, ownedProductsHash, rangeKey);
    writeCollectionValueCache(key, freshSeries);
  }, [freshSeries, user, ownedProductsHash, rangeKey]);

  // Prefer fresh — but fall back to whatever we hydrated from localStorage
  // so the user sees the chart immediately on return visits.
  const valueSeries = freshSeries || cachedSeries;

  const chartSeries = useMemo(() => {
    if(!valueSeries || !valueSeries.length) return [];
    return [{
      label: "Collection Low value",
      color: "var(--accent)",
      dashed: false,
      data: valueSeries.map(p => ({x: new Date(p.date+"T00:00:00Z").getTime(), y: p.value})),
    }];
  }, [valueSeries]);

  const startValue = valueSeries && valueSeries.length ? valueSeries[0].value : null;
  const rangeDelta = (startValue != null && startValue > 0) ? (currentValue - startValue) : null;
  const rangeDeltaPct = (startValue != null && startValue > 0) ? ((currentValue - startValue) / startValue * 100) : null;

  // Top 5 movers within owned collection — filtered + sorted by the in-panel
  // window/direction controls.
  const moversWin = MOVER_WIN_BY_KEY[moversWindow] || MOVER_WIN_BY_KEY["1d"];
  const collectionMovers = useMemo(() => {
    if(!user || !owned.ownedRows.length) return [];
    const out = [];
    for(const {row} of owned.ownedRows){
      const m = moversByKey[row.card_id + ":" + row.tcg_printing];
      if(!m) continue;
      const pct = m[moversWin.pctLow];
      if(pct == null || pct === 0) continue;
      if(pct > 0 && !moversUp) continue;
      if(pct < 0 && !moversDown) continue;
      out.push({row, mover:m, pct});
    }
    const cmpAbs  = (a,b) => Math.abs(b.pct) - Math.abs(a.pct);
    const cmpDesc = (a,b) => b.pct - a.pct;
    const cmpAsc  = (a,b) => a.pct - b.pct;
    out.sort((moversUp && moversDown) ? cmpAbs : moversUp ? cmpDesc : moversDown ? cmpAsc : cmpAbs);
    return out.slice(0, 10);
  }, [user, owned.ownedRows, moversByKey, moversWin.pctLow, moversUp, moversDown]);

  if(!user) return html`<aside class="collection-panel">
    <h2 class="panel-title">Your Collection</h2>
    <div class="muted" style=${{fontSize:12,marginBottom:10}}>
      Sign in to track your collection's value over time.</div>
    <button class="active" onClick=${onSignIn} style=${{padding:"7px 14px",fontSize:12}}>Sign in with Google</button>
  </aside>`;

  if(owned.ownedRows.length === 0) return html`<aside class="collection-panel">
    <h2 class="panel-title">Your Collection</h2>
    ${collectionLoading
      ? html`<div class="muted" style=${{fontSize:12,padding:"24px 0",textAlign:"center"}}>Loading your collection…</div>`
      : html`<div class="muted" style=${{fontSize:12}}>
          Add cards to your collection (or import a CSV in the Collection tab) to see your value chart here.</div>`}
  </aside>`;

  const deltaColor = rangeDelta == null ? "var(--text-muted)" : rangeDelta >= 0 ? "var(--green)" : "var(--red)";
  const rangeLabel = (COLLECTION_RANGES.find(r => r.key === rangeKey) || {}).label || rangeKey;

  return html`<aside class="collection-panel">
    <h2 class="panel-title">Your Collection</h2>
    <div class="panel-value">
      <div class="panel-value-now">$${currentValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      ${rangeDelta != null && html`<div class="panel-value-delta" style=${{color:deltaColor}}>
        ${rangeDelta >= 0 ? "+" : ""}$${Math.abs(rangeDelta).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
        <span style=${{opacity:0.8}}>(${rangeDeltaPct >= 0 ? "+" : ""}${rangeDeltaPct.toFixed(2)}%)</span>
        <span class="muted" style=${{fontWeight:400,fontSize:10,marginLeft:4}}>past ${rangeLabel}</span>
      </div>`}
    </div>
    <div class="panel-range-buttons">
      ${COLLECTION_RANGES.map(r => html`<button key=${r.key}
        class=${rangeKey===r.key?"active":""}
        onClick=${()=>setRangeKey(r.key)}>${r.label}</button>`)}
    </div>
    <div class="panel-chart">
      ${(chartSeries.length && chartSeries[0].data.length)
        ? html`<${LineChart} series=${chartSeries} width=340 height=160
            padding=${{top:6,right:8,bottom:20,left:48}}/>
            ${historyState.loading ? html`<div class="muted" style=${{fontSize:10,textAlign:"center",marginTop:-4}}>Refreshing…</div>` : null}`
        : historyState.loading
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>Loading…</div>`
          : historyState.error
            ? html`<div style=${{padding:"40px 0",textAlign:"center",color:"var(--red)",fontSize:11}}>${historyState.error}</div>`
            : html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>No price history for the selected range yet.</div>`}
    </div>
    <div class="panel-movers">
      <div class="panel-movers-title">Your Top Movers</div>
      <div class="panel-movers-controls">
        <div class="panel-range-buttons">
          ${MOVER_WINDOWS.map(w => html`<button key=${w.key}
            class=${moversWindow===w.key?"active":""}
            onClick=${()=>setMoversWindow(w.key)}>${w.label}</button>`)}
        </div>
        <div class="panel-dir-toggle">
          <label class=${moversUp?"on-up":""}>
            <input type="checkbox" checked=${moversUp} onChange=${e=>setMoversUp(e.target.checked)}/>
            ▲ Gainers
          </label>
          <label class=${moversDown?"on-down":""}>
            <input type="checkbox" checked=${moversDown} onChange=${e=>setMoversDown(e.target.checked)}/>
            ▼ Droppers
          </label>
        </div>
      </div>
      ${collectionMovers.length === 0
        ? html`<div class="muted" style=${{fontSize:11,padding:"10px 2px",textAlign:"center"}}>
            No ${moversWin.label} movement in your collection matching the filters.</div>`
        : html`<table class="panel-movers-table"><tbody>
          ${collectionMovers.map(({row, mover, pct}) => html`<tr key=${row.card_id+":"+row.tcg_printing}
            onClick=${()=>onTileClick && onTileClick(mover)}>
            <td class="panel-movers-img">${row.img_small
              ? html`<img src=${row.img_small} alt="" loading="lazy"/>`
              : ""}</td>
            <td class="panel-movers-name">${row["Product Name"]}</td>
            <td class="panel-movers-price">${fmt(parseP(mover.low_today))}</td>
            <td class="panel-movers-pct" style=${{color:pctColor(pct)}}>${fmtPct(pct)}</td>
          </tr>`)}
        </tbody></table>`}
    </div>
  </aside>`;
};

const HomeView = ({raw, theme, user, collection, collectionLoading, updateQty, onSignIn}) => {
  const [state, setState] = useState({rows:null, loading:true, error:null});
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [windowKey, setWindowKey] = useState("1d");
  const [showUp, setShowUp] = useState(true);
  const [showDown, setShowDown] = useState(true);
  const [paused, setPaused] = useState(false);
  // Most-Valuable banner: "main" (non-chase rarities) vs "chase".
  const [valuableMode, setValuableMode] = useState("main");

  // Resolve a mover (carries card_id + tcgplayer_product_id) to the
  // CardDetailModal-shaped "group" via O(1) lookups instead of scanning
  // `raw` (~1500 rows) on every click.
  const {rowsByCardId, rowsByPid} = useMemo(()=>{
    const byCard = new Map(), byPid = new Map();
    if(raw) for(const r of raw){
      if(r.card_id){
        const a = byCard.get(r.card_id); if(a) a.push(r); else byCard.set(r.card_id, [r]);
      }
      if(r.tcgplayer_product_id != null){
        const a = byPid.get(r.tcgplayer_product_id); if(a) a.push(r); else byPid.set(r.tcgplayer_product_id, [r]);
      }
    }
    return {rowsByCardId: byCard, rowsByPid: byPid};
  }, [raw]);
  const openCard = useCallback((mover) => {
    let rows = mover.card_id ? rowsByCardId.get(mover.card_id) : null;
    if(!rows && mover.tcgplayer_product_id != null){
      rows = rowsByPid.get(mover.tcgplayer_product_id);
    }
    if(!rows || !rows.length) return;
    const g = groupCards(rows)[0];
    if(g) setSelectedGroup(g);
  }, [rowsByCardId, rowsByPid]);

  useEffect(()=>{
    let cancelled = false;
    sbClient.from("price_movers")
      .select("card_id,set_id,name,version,rarity,ink,collector_number,image_small,image_normal,tcgplayer_product_id,printing,low_today,low_prev,low_7d,low_30d,low_90d,low_180d,low_365d,pct_1d,pct_7d,pct_30d,pct_90d,pct_180d,pct_365d,abs_pct_1d,market_today,market_prev,market_7d,market_30d,market_90d,market_180d,market_365d,mkt_pct_1d,mkt_pct_7d,mkt_pct_30d,mkt_pct_90d,mkt_pct_180d,mkt_pct_365d")
      .order("abs_pct_1d", {ascending:false, nullsFirst:false})
      .limit(5000)
      .then(({data, error}) => {
        if(cancelled) return;
        if(error){
          const msg = String(error.message||error||"");
          let friendly;
          if(msg.match(/relation|does not exist|404|schema cache/i))
            friendly = "Run supabase/10_price_movers_matview.sql in Supabase to enable Movers.";
          else if(msg.includes("57014") || msg.includes("timeout"))
            friendly = "Movers query timed out — consider promoting price_movers to a materialized view.";
          else
            friendly = "Movers fetch error: " + msg.slice(0,200);
          setState({rows:null, loading:false, error:friendly});
        } else {
          setState({rows: data || [], loading:false, error:null});
        }
      });
    return ()=>{ cancelled = true; };
  },[]);

  const {chase, rareLeg} = useMemo(()=>{
    if(!state.rows) return {chase:[], rareLeg:[]};
    const win = MOVER_WIN_BY_KEY[windowKey] || MOVER_WIN_BY_KEY["1d"];
    const qualifies = (r) => {
      const pct = r[win.pctLow];
      const prior = r[win.lowCol];
      // Apply the "started above $5" floor for the SELECTED window — the
      // matview only enforced "at any window", so we re-apply here against
      // the prior price for this specific window.
      if(pct == null || prior == null || prior < 5) return false;
      if(pct > 0 && !showUp) return false;
      if(pct < 0 && !showDown) return false;
      if(pct === 0) return false; // a 0% move isn't a "mover"
      return true;
    };
    const chase=[], rareLeg=[];
    for(const r of state.rows){
      if(!qualifies(r)) continue;
      if(CHASE_RARS.has(r.rarity)) chase.push(r);
      else if(RARELEG_RARS.has(r.rarity)) rareLeg.push(r);
    }
    // Sort each bucket by the selected window. Both-directions on → sort by
    // abs(pct) so the largest movers (gains OR drops) rank first. Single
    // direction on → sort signed (gainers desc, droppers asc).
    const cmpAbs    = (a,b) => Math.abs(b[win.pctLow]) - Math.abs(a[win.pctLow]);
    const cmpDesc   = (a,b) => b[win.pctLow] - a[win.pctLow];   // biggest gains first
    const cmpAsc    = (a,b) => a[win.pctLow] - b[win.pctLow];   // biggest drops first
    const cmp = (showUp && showDown) ? cmpAbs
              : showUp ? cmpDesc
              : showDown ? cmpAsc
              : cmpAbs;
    chase.sort(cmp);
    rareLeg.sort(cmp);
    return {chase: chase.slice(0,20), rareLeg: rareLeg.slice(0,20)};
  }, [state.rows, windowKey, showUp, showDown]);

  const directionLabel = (showUp && showDown) ? "|Δ%|"
                       : showUp ? "Δ% (gains)"
                       : showDown ? "Δ% (drops)"
                       : "Δ%";
  const winLabel = (MOVER_WIN_BY_KEY[windowKey]||{}).label || windowKey.toUpperCase();
  const visibleWindows = useMemo(()=>pickVisibleWindows(windowKey), [windowKey]);
  // Most Valuable banner shows the same three windows regardless of which
  // time frame is selected for the Movers banners — its purpose is absolute
  // value, not relative movement, so the global selector shouldn't change
  // what columns it displays.
  const VALUABLE_VISIBLE_WINDOWS = useMemo(()=>MOVER_WINDOWS.slice(0,3), []);

  // Index the movers matview rows by (card_id, printing) so we can splice in
  // delta data on any tile shown elsewhere on this page.
  const moversByKey = useMemo(()=>{
    const m = {};
    if(state.rows) for(const r of state.rows) m[r.card_id+":"+r.printing] = r;
    return m;
  }, [state.rows]);

  // "Most Valuable" banner — top 20 cards of the latest RELEASED set, by Low
  // price (fallback to Market). Walk MAINLINE_SETS from the end and pick
  // the first one that actually has priced cards in `raw`. Handles
  // unreleased sets at the tail (e.g., "Attack of the Vines" pre-release)
  // and never selects a promo / Extras bucket as "newest".
  const NEWEST_SET = useMemo(()=>{
    if(!raw || !raw.length) return null;
    const setsWithPrices = new Set();
    for(const r of raw){
      const p = parseP(r["Low Price"]) ?? parseP(r["TCGPlayer Market"]);
      if(p && p > 0) setsWithPrices.add(r.Set);
    }
    for(let i = MAINLINE_SETS.length - 1; i >= 0; i--){
      if(setsWithPrices.has(MAINLINE_SETS[i])) return MAINLINE_SETS[i];
    }
    return null;
  }, [raw]);
  const valuableCards = useMemo(()=>{
    if(!raw || !raw.length || !NEWEST_SET) return [];
    const chaseSet  = new Set(["Enchanted","Iconic","Epic"]);
    const mainSet   = new Set(["Common","Uncommon","Rare","Super Rare","Legendary"]);
    const isChase   = valuableMode === "chase";
    const targetSet = isChase ? chaseSet : mainSet;
    const priceOf   = (r) => parseP(r["Low Price"]) ?? parseP(r["TCGPlayer Market"]) ?? 0;
    const filtered = raw.filter(r =>
      r.Set === NEWEST_SET &&
      targetSet.has(r.Rarity) &&
      priceOf(r) > 0 &&
      // Main mode shows Normal prints only — foil variants would otherwise
      // crowd out the actual base set top 20. Chase mode keeps whatever
      // printing the data has (chases are inherently foil).
      (isChase || r.tcg_printing === "Normal"));

// ── Decks: list + editor ────────────────────────────────────────────────
// v1 scope: name + 60-card deck of mainline cards, owned-from-collection
// math, save/load via Supabase. Charts / sharing / advanced UX deferred.

// Lorcana cards that bypass the standard 4-copy deck-building limit.
// Keyed by "Product Name" (the full "<Name> - <Version>" string in our raw
// rows). Lorcana grants these exceptions via card text — Dalmatian Puppy's
// "Puppy Power" sets the cap to 99 and variants share that total; Microbots'
// rules text removes the cap entirely. Update this map as new exception
// cards are printed.
const SPECIAL_DECK_LIMITS = {
  "Dalmatian Puppy - Tail Wagger": 99,
  "Microbots":                     Infinity,
};
const getDeckLimit = (productName) => SPECIAL_DECK_LIMITS[productName] ?? 4;
// Hard cap used by the +/- UI when a card has no theoretical max (Microbots).
const SPECIAL_LIMIT_UI_CAP = 99;
const getDeckLimitForUI = (productName) => {
  const lim = getDeckLimit(productName);
  return lim === Infinity ? SPECIAL_LIMIT_UI_CAP : lim;
};

// Lorcana card-type groups used by the editor's sectioning.
const DECK_SECTIONS = [
  {key:"Character", label:"Characters", match: t => t === "Character"},
  {key:"Action",    label:"Actions",    match: t => t === "Action" || t === "Action - Song"},
  {key:"Item",      label:"Items",      match: t => t === "Item"},
  {key:"Location",  label:"Location",   match: t => t === "Location"},
];

// Lorcana competitive formats.
//   - Infinity: every released mainline set is legal (basically eternal).
//   - Core Constructed: rotating. Sets release in groups of 4; when a new
//     group starts, the oldest group rotates out. So Core's legal window
//     is the two most recent complete groups + whatever's currently in
//     progress. As of Set 12 (Wilds Unknown released, Attack of the Vines
//     not yet): legal = sets 5-12 (Shimmering Skies through Wilds Unknown).
//     When Set 13 releases, sets 5-8 rotate out, leaving 9-13.
//
// To keep this maintainable: list mainline sets in release order, then
// compute Core programmatically from the index of the latest released set.
const MAINLINE_RELEASE_ORDER = [
  "The First Chapter",       // 1
  "Rise of the Floodborn",   // 2
  "Into the Inklands",       // 3
  "Ursula's Return",         // 4
  "Shimmering Skies",        // 5
  "Azurite Sea",             // 6
  "Archazia's Island",       // 7
  "Reign of Jafar",          // 8
  "Fabled",                  // 9
  "Whispers in the Well",    // 10
  "Winterspell",             // 11
  "Wilds Unknown",           // 12
  // "Attack of the Vines",  // 13 — uncomment when released
];

// Compute the Core-Constructed legal window from the latest released set
// number. Rotation drops the oldest 4-set group, keeping the two most
// recent complete groups + the in-progress group. Result is the 5-8 most
// recent sets depending on where we sit in the cycle.
function computeCoreSets(){
  const latest = MAINLINE_RELEASE_ORDER.length; // 1-indexed set number
  if(latest <= 0) return [];
  const groupOfLatest = Math.ceil(latest / 4);          // 12 → group 3
  // The two most recent complete groups + in-progress contribute.
  // Effectively: latest set's group, plus the one before it.
  const firstLegalGroup = Math.max(1, groupOfLatest - 1);
  const firstLegalSetNum = (firstLegalGroup - 1) * 4 + 1;
  return MAINLINE_RELEASE_ORDER.slice(firstLegalSetNum - 1, latest);
}

const DECK_FORMATS = [
  {key:"infinity", label:"Infinity",
   description:"Every released mainline set is legal.",
   legalSets: () => new Set(MAINLINE_RELEASE_ORDER)},
  {key:"core",     label:"Core Constructed",
   description:"Rotating — only the most recent two 4-set groups are legal.",
   legalSets: () => new Set(computeCoreSets())},
];
const getFormat = (key) => DECK_FORMATS.find(f => f.key === key) || DECK_FORMATS[0];

// Decks store the active format as their first tag (or default to Infinity
// if tags is empty). Keeps the schema simple — no migration needed.
const deckFormatKey = (deck) => {
  const t = (deck.tags && deck.tags[0]) || "";
  return DECK_FORMATS.some(f => f.key === t) ? t : "infinity";
};

// Lowest current Low/Market price for a card across its printings. Used to
// price decks (we'd rather pay the cheap version than the foil).
function cheapestCardPrice(rowsForCardId){
  let lo = null;
  for(const r of rowsForCardId){
    const p = r["Low Price"] ?? r["TCGPlayer Market"];
    if(p == null) continue;
    if(lo == null || p < lo) lo = p;
  }
  return lo;
}

const DecksView = ({raw, user, collection, tabClickNonce, incomingDeckId, onConsumedIncomingDeckId, incomingShareToken, onConsumedIncomingShareToken, incomingUserId, onConsumedIncomingUserId, onSignIn, theme}) => {
  // All hooks run unconditionally.
  const [decks, setDecks] = useState(null); // null = loading, [] = empty, [...] = loaded
  const [selectedDeckId, setSelectedDeckId] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const openDeckInMode = useCallback((id, mode) => {
    setSelectedDeckId(id);
    setEditMode(mode === "edit");
  }, []);
  // Decks owned by someone else — fetched on demand from incomingDeckId or
  // a future "view this public deck" click. Shape: {deck, creator} | {error}.

  // Set of deck_ids the current user has favorited (their saved bookmarks
  // of specific decks). Populated from public.deck_favorites.
  const [favorites, setFavorites] = useState(new Set());
  // Hydrated favorite entries: array of {deck, creator} — same shape as
  // externalDeck. Click → drop into externalDeck (no fetch round-trip).
  const [favoritedDecks, setFavoritedDecks] = useState([]);
  // Set of user_ids the current user follows (the "follow this creator"
  // relation), distinct from deck favorites. Drives the Following feed.
  const [userFollows, setUserFollows] = useState(new Set());
  // Following feed: recent public decks from creators the user follows.
  const [followingFeed, setFollowingFeed] = useState([]);
  // Discover feed: recent public decks from anyone (excluding the current
  // user's own). Paginated — we initially load DISCOVER_PAGE entries and
  // grow via the "Load more" button.
  const [discoverEntries, setDiscoverEntries] = useState([]);
  const [discoverHasMore, setDiscoverHasMore] = useState(false);
  const [discoverLoading, setDiscoverLoading] = useState(false);
  // Creator profile state — when set, the Decks tab renders that creator's
  // public-deck list (their "profile page") instead of the section tabs.
  // {creator, decks: [{deck, creator}]} or {error}.
  const [creatorProfile, setCreatorProfile] = useState(null);
  // Aggregate favorite counts keyed by deck_id. Populated via the
  // deck_favorite_counts() SECURITY DEFINER RPC; merged from every refresh
  // path that fetches decks (own / favorites / following / discover / profile).
  const [favoriteCounts, setFavoriteCounts] = useState({});
  // Aggregate view counts (unique logged-in users) — same pattern.
  const [viewCounts, setViewCounts] = useState({});
  // UI controls scoped to the Your Decks section: search + sort + ink-filter.
  // Ink filter applies across all sub-sections so e.g. "show me only my
  // Amber Steel decks AND Amber Steel decks in Discover" works uniformly.
  const [yourDeckSearch, setYourDeckSearch] = useState("");
  const [yourDeckSort, setYourDeckSort] = useState(()=>{
    try { return localStorage.getItem("packsink:decks:sort") || "updated_desc"; }
    catch { return "updated_desc"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:decks:sort", yourDeckSort); } catch {} }, [yourDeckSort]);
  const [inkFilter, setInkFilter] = useState(new Set());
  const [err, setErr] = useState(null);
  // In-flight Supabase write counter — drives the "Saved / Saving…" badge.
  // Incremented when a mutation fires, decremented in its finally. Local
  // optimistic state means UI is always responsive; this only reflects
  // whether the server has caught up.
  const [pending, setPending] = useState(0);
  // Lightweight toast for confirming one-shot actions (e.g. duplicate).
  // Auto-dismisses after ~2.5s.
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(t => t === msg ? null : t), 2500);
  }, []);

  // Re-clicking the Decks tab pops back to the list view.
  // Clicking the top-nav Decks button while inside a deck (or external
  // viewer / creator profile) should pop back to whatever sub-section
  // (Your Decks / Favorites / Following / Discover) the user was on.
  // deckSection is preserved in state so just clearing the deeper views
  // restores the list naturally.
  useEffect(() => {
    if(tabClickNonce > 0){
      setSelectedDeckId(null);
      setExternalDeck(null);
      setCreatorProfile(null);
    }
  }, [tabClickNonce]);

  // Index raw rows by card_id so deck rendering can look up name/image/price.
  const cardById = useMemo(() => {
    const m = {};
    for(const r of raw){
      if(!r.card_id) continue;
      if(!m[r.card_id]) m[r.card_id] = [];
      m[r.card_id].push(r);
    }
    return m;
  }, [raw]);

  // Fetch all decks (with cards) for the user. We pull decks + deck_cards
  // separately and stitch on the client — simpler than nested PostgREST.
  // Pull favorite counts for a set of deck IDs and merge into local state.
  // Wrapped in try/catch so a missing RPC (older Supabase deploy) is a
  // non-fatal no-op — the UI just renders without the count badge.
  // Defined before refreshDecks so the latter's dep array can reference it
  // without hitting the const-TDZ on first render.
  const mergeFavoriteCounts = useCallback(async (deckIds) => {
    if(!deckIds || !deckIds.length) return;
    try {
      const {data, error} = await sbClient.rpc("deck_favorite_counts", {deck_ids: deckIds});
      if(error) throw error;
      const next = {};
      // Seed every requested deck to 0 so a deck with no favorites shows "0"
      // rather than "undefined" / nothing.
      for(const id of deckIds) next[id] = 0;
      for(const row of (data || [])) next[row.deck_id] = Number(row.favorite_count) || 0;
      setFavoriteCounts(prev => ({...prev, ...next}));
    } catch(e){
      console.warn("favorite count fetch failed (run supabase/20_*.sql?):", e?.message || e);
    }
  }, []);
  const mergeViewCounts = useCallback(async (deckIds) => {
    if(!deckIds || !deckIds.length) return;
    try {
      const {data, error} = await sbClient.rpc("deck_view_counts", {deck_ids: deckIds});
      if(error) throw error;
      const next = {};
      for(const id of deckIds) next[id] = 0;
      for(const row of (data || [])) next[row.deck_id] = Number(row.view_count) || 0;
      setViewCounts(prev => ({...prev, ...next}));
    } catch(e){
      console.warn("view count fetch failed (run supabase/24_*.sql?):", e?.message || e);
    }
  }, []);

  const refreshDecks = useCallback(async () => {
    if(!user){ setDecks([]); return; }
    setErr(null);
    try {
      // IMPORTANT: filter by user_id. After 18_deck_sharing.sql broadened
      // the RLS to allow anyone to read non-private decks, an unfiltered
      // select returns every public/unlisted deck the user has ever viewed
      // — which polluted "Your Decks" with externally-favorited decks and
      // made delete silently fail (RLS rejects deletes of others' rows).
      const {data: deckRows, error: e1} = await sbClient.from("decks")
        .select("id,name,description,inks,tags,visibility,share_token,created_at,updated_at,user_id")
        .eq("user_id", user.id)
        .order("updated_at", {ascending:false});
      if(e1) throw e1;
      const ids = (deckRows||[]).map(d => d.id);
      let cardRows = [];
      if(ids.length){
        // Page through deck_cards in case any deck has > 1000 entries (paranoia).
        let from = 0;
        while(true){
          const {data, error: e2} = await sbClient.from("deck_cards")
            .select("deck_id,card_id,printing,quantity")
            .in("deck_id", ids)
            .range(from, from + 999);
          if(e2) throw e2;
          cardRows.push(...(data||[]));
          if((data||[]).length < 1000) break;
          from += 1000;
        }
      }
      const cardsByDeck = {};
      for(const c of cardRows){
        if(!cardsByDeck[c.deck_id]) cardsByDeck[c.deck_id] = [];
        cardsByDeck[c.deck_id].push(c);
      }
      setDecks((deckRows||[]).map(d => ({...d, cards: cardsByDeck[d.id] || []})));
      mergeFavoriteCounts(ids);
      mergeViewCounts(ids);
    } catch(e){
      console.error("decks fetch failed:", e);
      setErr(e.message || String(e));
      setDecks([]);
    }
  }, [user, mergeFavoriteCounts]);
  useEffect(() => { refreshDecks(); }, [refreshDecks]);

  // Shared helper: turn an array of deck IDs into hydrated {deck, creator}
  // entries by batching the decks + deck_cards + profiles lookups. The
  // Favorites and Following Feed paths both reuse this.
  const hydrateDecksByIds = useCallback(async (ids) => {
    if(!ids.length) return [];
    const [decksRes, cardsRes] = await Promise.all([
      sbClient.from("decks")
        .select("id,user_id,name,description,inks,tags,visibility,updated_at")
        .in("id", ids),
      sbClient.from("deck_cards")
        .select("deck_id,card_id,printing,quantity")
        .in("deck_id", ids),
    ]);
    if(decksRes.error) throw decksRes.error;
    const decksRows = decksRes.data || [];
    const creatorIds = [...new Set(decksRows.map(d => d.user_id).filter(Boolean))];
    let creators = [];
    if(creatorIds.length){
      const {data: pRows} = await sbClient.from("profiles")
        .select("user_id,display_name,avatar_url")
        .in("user_id", creatorIds);
      creators = pRows || [];
    }
    const creatorById = Object.fromEntries(creators.map(c => [c.user_id, c]));
    const cardsByDeck = {};
    for(const c of (cardsRes.data||[])){
      if(!cardsByDeck[c.deck_id]) cardsByDeck[c.deck_id] = [];
      cardsByDeck[c.deck_id].push(c);
    }
    return decksRows.map(d => ({
      deck: {...d, cards: cardsByDeck[d.id] || []},
      creator: creatorById[d.user_id] || null,
    }));
  }, []);

  // Refresh the user's deck-level bookmarks (deck_favorites). Returns hydrated
  // entries sorted newest-favorited first.
  const refreshFavorites = useCallback(async () => {
    if(!user){ setFavorites(new Set()); setFavoritedDecks([]); return; }
    try {
      const {data: favRows, error: fErr} = await sbClient.from("deck_favorites")
        .select("deck_id,followed_at,share_token")
        .order("followed_at", {ascending:false});
      if(fErr) throw fErr;
      const ids = (favRows||[]).map(r => r.deck_id);
      setFavorites(new Set(ids));
      if(!ids.length){ setFavoritedDecks([]); return; }
      const tokenById = Object.fromEntries((favRows||[]).map(r => [r.deck_id, r.share_token || null]));
      // Two-pass hydration: public + own decks via direct read (existing
      // helper); unlisted decks via token-gated RPC. RLS denies direct
      // reads on unlisted decks not owned by the caller, so we have to
      // route those through get_shared_deck / get_shared_deck_cards.
      const directIds = ids.filter(id => !tokenById[id]);
      const tokenIds  = ids.filter(id =>  tokenById[id]);
      const directEntries = directIds.length ? await hydrateDecksByIds(directIds) : [];
      const tokenEntries = [];
      for(const id of tokenIds){
        const token = tokenById[id];
        const [deckRes, cardsRes] = await Promise.all([
          sbClient.rpc("get_shared_deck",       {p_deck_id: id, p_token: token}),
          sbClient.rpc("get_shared_deck_cards", {p_deck_id: id, p_token: token}),
        ]);
        const d = deckRes.data && deckRes.data[0];
        if(!d) continue; // token rotated or deck went private — silently drop
        const {data: profile} = await sbClient.from("profiles")
          .select("display_name,avatar_url").eq("user_id", d.user_id).maybeSingle();
        tokenEntries.push({
          deck: {...d, cards: cardsRes.data || []},
          creator: profile || null,
          shareToken: token,
        });
      }
      const entries = [...directEntries, ...tokenEntries];
      // Preserve favorite order (newest-favorited first).
      const idOrder = ids.reduce((m, id, i) => (m[id] = i, m), {});
      entries.sort((a, b) => (idOrder[a.deck.id] ?? 999) - (idOrder[b.deck.id] ?? 999));
      setFavoritedDecks(entries);
      mergeFavoriteCounts(ids);
      mergeViewCounts(ids);
    } catch(e){
      console.warn("favorites fetch failed (run supabase/19_*.sql?):", e?.message || e);
      setFavorites(new Set());
      setFavoritedDecks([]);
    }
  }, [user, hydrateDecksByIds, mergeFavoriteCounts]);
  useEffect(()=>{ refreshFavorites(); }, [refreshFavorites, tabClickNonce]);

  // Refresh the set of creators the current user follows + their recent
  // public decks feed (newest updated_at first, capped to keep the page lean).
  const refreshFollowing = useCallback(async () => {
    if(!user){ setUserFollows(new Set()); setFollowingFeed([]); return; }
    try {
      const {data: followRows, error: ufErr} = await sbClient.from("user_follows")
        .select("followed_id")
        .eq("follower_id", user.id);
      if(ufErr) throw ufErr;
      const followedIds = (followRows||[]).map(r => r.followed_id);
      setUserFollows(new Set(followedIds));
      if(!followedIds.length){ setFollowingFeed([]); return; }
      const {data: deckRows, error: dErr} = await sbClient.from("decks")
        .select("id,user_id,name,description,inks,tags,visibility,updated_at")
        .in("user_id", followedIds)
        .eq("visibility", "public")
        .order("updated_at", {ascending:false})
        .limit(50);
      if(dErr) throw dErr;
      const ids = (deckRows||[]).map(d => d.id);
      if(!ids.length){ setFollowingFeed([]); return; }
      const entries = await hydrateDecksByIds(ids);
      // hydrateDecksByIds doesn't preserve order — re-sort newest first.
      entries.sort((a, b) => new Date(b.deck.updated_at) - new Date(a.deck.updated_at));
      setFollowingFeed(entries);
      mergeFavoriteCounts(ids);
      mergeViewCounts(ids);
    } catch(e){
      console.warn("following fetch failed (run supabase/19_*.sql?):", e?.message || e);
      setUserFollows(new Set());
      setFollowingFeed([]);
    }
  }, [user, hydrateDecksByIds, mergeFavoriteCounts]);
  useEffect(()=>{ refreshFollowing(); }, [refreshFollowing, tabClickNonce]);

  // Toggle a deck favorite (bookmark this specific deck). Optimistic with
  // rollback on error. Calling on a deck you own is allowed by RLS but
  // pointless — guarded client-side at the button level.
  const toggleFavorite = useCallback(async (deckId, shareToken) => {
    if(!user || !deckId) return;
    const wasFavorited = favorites.has(deckId);
    setFavorites(prev => {
      const next = new Set(prev);
      if(wasFavorited) next.delete(deckId); else next.add(deckId);
      return next;
    });
    setFavoriteCounts(prev => ({
      ...prev,
      [deckId]: Math.max(0, (prev[deckId] || 0) + (wasFavorited ? -1 : 1)),
    }));
    try {
      if(wasFavorited){
        const {error} = await sbClient.from("deck_favorites").delete()
          .eq("user_id", user.id).eq("deck_id", deckId);
        if(error) throw error;
        setFavoritedDecks(prev => prev.filter(e => e.deck.id !== deckId));
      } else {
        // Capture the share_token used to access this deck so the favorites
        // list can re-fetch it later via the token-gated RPC. Null for
        // public decks (direct read works). Owner's own decks: skip token
        // (they don't need one, RLS allows direct read).
        const insertRow = {user_id: user.id, deck_id: deckId};
        if(shareToken) insertRow.share_token = shareToken;
        const {error} = await sbClient.from("deck_favorites").insert(insertRow);
        if(error) throw error;
        if(externalDeck?.deck?.id === deckId){
          setFavoritedDecks(prev => [
            {deck: externalDeck.deck, creator: externalDeck.creator, shareToken: shareToken || externalDeck.shareToken || null},
            ...prev.filter(e => e.deck.id !== deckId),
          ]);
        } else {
          refreshFavorites();
        }
      }
    } catch(e){
      console.error("favorite toggle failed:", e);
      setFavorites(prev => {
        const next = new Set(prev);
        if(wasFavorited) next.add(deckId); else next.delete(deckId);
        return next;
      });
      setFavoriteCounts(prev => ({
        ...prev,
        [deckId]: Math.max(0, (prev[deckId] || 0) + (wasFavorited ? 1 : -1)),
      }));
      alert("Couldn't update favorite: " + (e.message || e));
    }
  }, [user, favorites, externalDeck, refreshFavorites]);

  // Toggle a creator follow (user-level relationship). Drives the Following
  // feed of recent public decks from these creators.
  const toggleFollowCreator = useCallback(async (creatorId) => {
    if(!user || !creatorId || creatorId === user.id) return;
    const wasFollowing = userFollows.has(creatorId);
    setUserFollows(prev => {
      const next = new Set(prev);
      if(wasFollowing) next.delete(creatorId); else next.add(creatorId);
      return next;
    });
    try {
      if(wasFollowing){
        const {error} = await sbClient.from("user_follows").delete()
          .eq("follower_id", user.id).eq("followed_id", creatorId);
        if(error) throw error;
        setFollowingFeed(prev => prev.filter(e => e.deck.user_id !== creatorId));
      } else {
        const {error} = await sbClient.from("user_follows")
          .insert({follower_id: user.id, followed_id: creatorId});
        if(error) throw error;
        refreshFollowing();
      }
    } catch(e){
      console.error("user follow toggle failed:", e);
      setUserFollows(prev => {
        const next = new Set(prev);
        if(wasFollowing) next.add(creatorId); else next.delete(creatorId);
        return next;
      });
      alert("Couldn't update follow: " + (e.message || e));
    }
  }, [user, userFollows, refreshFollowing]);

  // Record a unique view of someone else's deck. No-op for anon users
  // (deck_views.insert RLS requires auth.uid()) and for the owner's own
  // decks (skip client-side so the owner doesn't bump their own counter).
  // The PK (user_id, deck_id) makes this idempotent — re-viewing the same
  // deck doesn't change anything.
  const recordDeckView = useCallback((deckId, ownerId) => {
    if(!user || !deckId || !ownerId) return;
    if(user.id === ownerId) return;
    sbClient.from("deck_views")
      .upsert({user_id: user.id, deck_id: deckId}, {ignoreDuplicates: true})
      .then(({error}) => {
        if(error) console.warn("view record failed (run supabase/24_*.sql?):", error.message);
      });
  }, [user]);

  // Open a hydrated external-deck entry in the read-only viewer (used by
  // the Favorites and Following sections — entry already has deck + cards
  // + creator, so no fetch round-trip).
  const openExternalDeckEntry = useCallback((entry) => {
    setExternalDeck(entry);
    setSelectedDeckId(null);
    setCreatorProfile(null);
    recordDeckView(entry?.deck?.id, entry?.deck?.user_id);
  }, [recordDeckView]);

  // Discover feed: refresh + load-more. Filters out the current user's own
  // decks (they have Your Decks for those) and excludes any decks the user
  // already favorited (less noise in the feed).
  const DISCOVER_PAGE = 30;
  const refreshDiscover = useCallback(async () => {
    setDiscoverLoading(true);
    try {
      let q = sbClient.from("decks")
        .select("id,user_id,name,description,inks,tags,visibility,updated_at")
        .eq("visibility", "public")
        .order("updated_at", {ascending:false})
        .limit(DISCOVER_PAGE + 1);
      if(user) q = q.neq("user_id", user.id);
      const {data: deckRows, error} = await q;
      if(error) throw error;
      const more = (deckRows||[]).length > DISCOVER_PAGE;
      const visible = (deckRows||[]).slice(0, DISCOVER_PAGE);
      setDiscoverHasMore(more);
      if(!visible.length){ setDiscoverEntries([]); return; }
      const ids = visible.map(d => d.id);
      const entries = await hydrateDecksByIds(ids);
      entries.sort((a, b) => new Date(b.deck.updated_at) - new Date(a.deck.updated_at));
      setDiscoverEntries(entries);
      mergeFavoriteCounts(ids);
      mergeViewCounts(ids);
    } catch(e){
      console.warn("discover fetch failed:", e?.message || e);
      setDiscoverEntries([]);
      setDiscoverHasMore(false);
    } finally {
      setDiscoverLoading(false);
    }
  }, [user, hydrateDecksByIds, mergeFavoriteCounts]);
  const loadMoreDiscover = useCallback(async () => {
    if(!discoverEntries.length) return;
    setDiscoverLoading(true);
    try {
      const oldest = discoverEntries[discoverEntries.length - 1].deck.updated_at;
      let q = sbClient.from("decks")
        .select("id,user_id,name,description,inks,tags,visibility,updated_at")
        .eq("visibility", "public")
        .lt("updated_at", oldest)
        .order("updated_at", {ascending:false})
        .limit(DISCOVER_PAGE + 1);
      if(user) q = q.neq("user_id", user.id);
      const {data: deckRows, error} = await q;
      if(error) throw error;
      const more = (deckRows||[]).length > DISCOVER_PAGE;
      const visible = (deckRows||[]).slice(0, DISCOVER_PAGE);
      setDiscoverHasMore(more);
      if(!visible.length) return;
      const newIds = visible.map(d => d.id);
      const entries = await hydrateDecksByIds(newIds);
      entries.sort((a, b) => new Date(b.deck.updated_at) - new Date(a.deck.updated_at));
      setDiscoverEntries(prev => [...prev, ...entries]);
      mergeFavoriteCounts(newIds);
      mergeViewCounts(newIds);
    } catch(e){
      console.warn("discover load-more failed:", e?.message || e);
    } finally {
      setDiscoverLoading(false);
    }
  }, [user, discoverEntries, hydrateDecksByIds]);
  // Initial discover load on entering the tab — fires on every tabClick so
  // the feed picks up newly-published decks while the user is on the site.
  useEffect(()=>{ refreshDiscover(); }, [refreshDiscover, tabClickNonce]);

  // Open a creator's profile page (their public decks). Fetched on demand.
  const openCreatorProfile = useCallback(async (creatorId) => {
    if(!creatorId) return;
    setExternalDeck(null);
    setSelectedDeckId(null);
    setCreatorProfile({loading: true, creatorId});
    try {
      const [profileRes, decksRes] = await Promise.all([
        sbClient.from("profiles").select("user_id,display_name,avatar_url").eq("user_id", creatorId).maybeSingle(),
        sbClient.from("decks")
          .select("id,user_id,name,description,inks,tags,visibility,updated_at")
          .eq("user_id", creatorId).eq("visibility", "public")
          .order("updated_at", {ascending:false}),
      ]);
      if(decksRes.error) throw decksRes.error;
      const deckRows = decksRes.data || [];
      const ids = deckRows.map(d => d.id);
      let entries = [];
      if(ids.length){
        entries = await hydrateDecksByIds(ids);
        entries.sort((a, b) => new Date(b.deck.updated_at) - new Date(a.deck.updated_at));
        mergeFavoriteCounts(ids);
      mergeViewCounts(ids);
      }
      setCreatorProfile({
        creator: profileRes.data || {user_id: creatorId},
        creatorId,
        decks: entries,
      });
    } catch(e){
      console.error("creator profile fetch failed:", e);
      setCreatorProfile({error: e.message || String(e), creatorId});
    }
  }, [hydrateDecksByIds, mergeFavoriteCounts]);
  const closeCreatorProfile = useCallback(() => setCreatorProfile(null), []);

  // Handle deep-linked deck arrival (?deck=<uuid>&token=<share_token>):
  // a non-owner viewing an unlisted deck must come through the token-gated
  // RPC because RLS now restricts direct reads to (owner OR public). Owners
  // and public decks still go through the regular table read.
  useEffect(() => {
    if(!incomingDeckId) return;
    let cancelled = false;
    (async () => {
      // 1. Resolve the deck row. Token path first if one's in the URL.
      let deckRow = null;
      if(incomingShareToken){
        const {data, error} = await sbClient.rpc("get_shared_deck", {
          p_deck_id: incomingDeckId, p_token: incomingShareToken,
        });
        if(cancelled) return;
        if(error){
          setExternalDeck({error: error.message || "Couldn't load deck"});
          onConsumedIncomingDeckId && onConsumedIncomingDeckId();
          onConsumedIncomingShareToken && onConsumedIncomingShareToken();
          return;
        }
        deckRow = (data && data.length) ? data[0] : null;
      }
      // 2. Fall back to direct read (works for own decks + public; returns
      //    null for unlisted-without-token or private-not-yours).
      if(!deckRow){
        const {data, error} = await sbClient.from("decks")
          .select("id,user_id,name,description,inks,tags,visibility,share_token,updated_at")
          .eq("id", incomingDeckId).maybeSingle();
        if(cancelled) return;
        if(error){
          setExternalDeck({error: error.message || "Couldn't load deck"});
          onConsumedIncomingDeckId && onConsumedIncomingDeckId();
          onConsumedIncomingShareToken && onConsumedIncomingShareToken();
          return;
        }
        deckRow = data;
      }
      if(!deckRow){
        setExternalDeck({error: "This deck is private or the share link has been revoked."});
        onConsumedIncomingDeckId && onConsumedIncomingDeckId();
        onConsumedIncomingShareToken && onConsumedIncomingShareToken();
        return;
      }
      if(user && deckRow.user_id === user.id){
        openDeckInMode(deckRow.id, "view");
        setExternalDeck(null);
        onConsumedIncomingDeckId && onConsumedIncomingDeckId();
        onConsumedIncomingShareToken && onConsumedIncomingShareToken();
        return;
      }
      // 3. Fetch cards + creator profile. Cards also go through the RPC
      //    when the deck was token-gated.
      const usedToken = incomingShareToken || null;
      const cardsP = usedToken
        ? sbClient.rpc("get_shared_deck_cards", {p_deck_id: deckRow.id, p_token: usedToken})
        : sbClient.from("deck_cards").select("deck_id,card_id,printing,quantity").eq("deck_id", deckRow.id);
      const profP  = sbClient.from("profiles").select("display_name,avatar_url").eq("user_id", deckRow.user_id).maybeSingle();
      const [cardsResult, profileResult] = await Promise.all([cardsP, profP]);
      if(cancelled) return;
      setExternalDeck({
        deck: {...deckRow, cards: cardsResult.data || []},
        creator: profileResult.data || null,
        // Preserve the token so Favorite can capture it for later RPC use.
        shareToken: usedToken || deckRow.share_token || null,
      });
      recordDeckView(deckRow.id, deckRow.user_id);
      onConsumedIncomingDeckId && onConsumedIncomingDeckId();
      onConsumedIncomingShareToken && onConsumedIncomingShareToken();
    })();
    return () => { cancelled = true; };
  }, [incomingDeckId, incomingShareToken, user, recordDeckView, onConsumedIncomingDeckId, onConsumedIncomingShareToken]);

  // Handle deep-linked creator profile (?user=<uuid>): open the profile
  // page (fetch happens inside openCreatorProfile).
  useEffect(() => {
    if(!incomingUserId) return;
    openCreatorProfile(incomingUserId);
    onConsumedIncomingUserId && onConsumedIncomingUserId();
  }, [incomingUserId, openCreatorProfile, onConsumedIncomingUserId]);

  // Keep the URL in sync with the currently-open deck (?deck=<id>[&token=<x>])
  // or creator profile (?user=<id>). Only one is active at a time. The
  // token is appended only for unlisted decks where it's actually needed
  // for non-owners to access. Public decks omit the token (cleaner URLs);
  // private decks omit it (it'd be a no-op anyway since visibility=private
  // means the share link doesn't work for anyone but the owner).
  useEffect(() => {
    const deckId    = externalDeck?.deck?.id || selectedDeckId || null;
    const profileId = creatorProfile && !deckId ? creatorProfile.creatorId : null;
    // Resolve the share_token to embed. For an external deck we already
    // know it (saved in externalDeck.shareToken). For an owned deck we
    // look it up from the decks list. Token only embedded when the deck
    // is actually unlisted.
    let token = null;
    if(externalDeck?.deck){
      const v = externalDeck.deck.visibility;
      if(v === "unlisted") token = externalDeck.shareToken || externalDeck.deck.share_token || null;
    } else if(selectedDeckId){
      const own = (decks||[]).find(d => d.id === selectedDeckId);
      if(own && own.visibility === "unlisted") token = own.share_token || null;
    }
    try {
      const url = new URL(window.location.href);
      if(deckId)    url.searchParams.set("deck", deckId); else url.searchParams.delete("deck");
      if(token)     url.searchParams.set("token", token); else url.searchParams.delete("token");
      if(profileId) url.searchParams.set("user", profileId); else url.searchParams.delete("user");
      window.history.replaceState({}, "", url);
    } catch {/* SSR / blocked storage / no-op */}
  }, [selectedDeckId, externalDeck, creatorProfile, decks]);

  // Clearing the external-deck view returns to the user's own deck list.
  const closeExternalDeck = useCallback(() => {
    setExternalDeck(null);
  }, []);

  // Build a CSS gradient from a deck's ink list. Single ink: tint holds for
  // most of the card, fades to surface near the end. Two inks: each color
  // holds ~45% with a narrow blend zone in the middle, so the deck reads
  // as visibly half-and-half instead of a soft wash. Theme-aware via the
  // existing INK_TINT_LIGHT / INK_TINT_DARK pairs.
  const deckGradient = (inks) => {
    if(!inks || !inks.length) return null;
    const tints = (theme === "dark" ? INK_TINT_DARK : INK_TINT_LIGHT);
    const c1 = tints[inks[0]];
    if(!c1) return null;
    if(inks.length === 1){
      return `linear-gradient(135deg, ${c1} 0%, ${c1} 60%, var(--bg-surface) 100%)`;
    }
    const c2 = tints[inks[1]];
    if(!c2) return `linear-gradient(135deg, ${c1} 0%, ${c1} 60%, var(--bg-surface) 100%)`;
    // 4-stop gradient: solid A → A → B → solid B. The 10% transition
    // window between 45% and 55% blends cleanly without smearing.
    return `linear-gradient(135deg, ${c1} 0%, ${c1} 45%, ${c2} 55%, ${c2} 100%)`;
  };

  // Tiny pill showing a deck's visibility. Owner-facing only; external cards
  // suppress it (the deck wouldn't be visible to the viewer if it weren't
  // shareable in the first place).
  const visibilityPill = (v) => {
    const map = {
      public:   {label: "Public",   cls: "vis-public",   icon: "🌐"},
      unlisted: {label: "Unlisted", cls: "vis-unlisted", icon: "🔗"},
      private:  {label: "Private",  cls: "vis-private",  icon: "🔒"},
    };
    const m = map[v || "private"];
    return html`<span class=${"deck-card-vis "+m.cls}
      title=${m.label === "Public" ? "Anyone with the link can view; also appears in Discover."
             : m.label === "Unlisted" ? "Anyone with the link can view. Not in Discover."
             : "Only you can view. The share link won't work for others."}>
      ${m.icon} ${m.label}
    </span>`;
  };

  // Pre-compute per-deck aggregates: total cards, total value, inks used,
  // inkable / uninkable counts. Returned object is consumed by both card
  // renderers + the deck-card meta line.
  const summarizeDeck = (d) => {
    let total = 0, value = 0, owned = 0, inkable = 0, uninkable = 0;
    const inks = new Set();
    for(const c of (d.cards||[])){
      const meta = (cardById[c.card_id]||[])[0];
      total += c.quantity;
      const price = meta ? (cheapestCardPrice(cardById[c.card_id]) || 0) : 0;
      value += price * c.quantity;
      if(meta?.ink) inks.add(meta.ink);
      if(meta?.inkable === true)  inkable   += c.quantity;
      else if(meta?.inkable === false) uninkable += c.quantity;
      const have = (collection[c.card_id+":Normal"] || 0)
                 + (collection[c.card_id+":Cold Foil"] || 0)
                 + (collection[c.card_id+":Foil"] || 0)
                 + (collection[c.card_id+":Holofoil"] || 0);
      owned += Math.min(c.quantity, have);
    }
    return {total, value, owned, inks: Array.from(inks), inkable, uninkable};
  };
  // Renders the small ink-shield row plus the inkable/uninkable badge.
  // Uses the site's existing hex glyphs (gold filigree for inkable, empty
  // hex for uninkable) so the chip reads at a glance instead of as a ratio.
  const renderDeckChips = (s) => html`<div class="deck-card-chips">
    ${s.inks.length > 0 && html`<div class="deck-card-inks">
      ${s.inks.map(ink => html`<img key=${ink} src=${INK_ICONS[ink]} alt=${ink} title=${ink}/>`)}
    </div>`}
    ${(s.inkable + s.uninkable) > 0 && html`<div class="deck-card-inkable">
      <span class="deck-ink-chip" title=${s.inkable + " inkable card" + (s.inkable===1?"":"s") + " (can be used as ink)"}>
        <${InkableHex}/><span>${s.inkable}</span>
      </span>
      <span class="deck-ink-chip" title=${s.uninkable + " uninkable card" + (s.uninkable===1?"":"s")}>
        <${UninkableHex}/><span>${s.uninkable}</span>
      </span>
    </div>`}
  </div>`;

  // Card renderers — defined up here so the creator-profile early-return
  // and the list-view tabs can both use them.
  const renderOwnedCard = (d) => {
    const s = summarizeDeck(d);
    const ownedPct = s.total ? (s.owned/s.total*100) : 0;
    const favCount = favoriteCounts[d.id] || 0;
    const viewCount = viewCounts[d.id] || 0;
    const bg = deckGradient(s.inks);
    return html`<div key=${d.id} class="deck-card"
        style=${bg ? {background: bg} : null}
        onClick=${()=>openDeckInMode(d.id, "view")}>
      <div class="deck-card-header">
        <div class="deck-card-name">${d.name}</div>
        ${visibilityPill(d.visibility)}
      </div>
      <div class="deck-card-meta">${s.total} / 60 cards · $${s.value.toFixed(2)} · ${ownedPct.toFixed(0)}% owned${favCount>0?` · ★ ${favCount}`:""}${viewCount>0?` · 👁 ${viewCount}`:""}</div>
      ${renderDeckChips(s)}
      ${d.updated_at && html`<div class="deck-card-updated" title=${"Last updated " + absoluteLocalTime(d.updated_at) + " (your local time)"}>Updated ${relativeTime(d.updated_at)}</div>`}
      <div class="deck-card-actions">
        <button onClick=${e=>{e.stopPropagation(); renameDeck(d.id, d.name);}}>Rename</button>
        <button onClick=${e=>{e.stopPropagation(); duplicateDeck(d.id);}}>Duplicate</button>
        <button class="danger" onClick=${e=>{e.stopPropagation(); deleteDeck(d.id);}}>Delete</button>
      </div>
    </div>`;
  };
  const renderExternalCard = (entry, opts={}) => {
    const d = entry.deck;
    const s = summarizeDeck(d);
    const creatorName = entry.creator?.display_name || "anonymous";
    const favCount = favoriteCounts[d.id] || 0;
    const viewCount = viewCounts[d.id] || 0;
    const bg = deckGradient(s.inks);
    return html`<div key=${d.id} class="deck-card external"
        style=${bg ? {background: bg} : null}
        onClick=${()=>openExternalDeckEntry(entry)}>
      <div class="deck-card-name">${d.name}</div>
      <div class="deck-card-meta">by ${creatorName} · ${s.total} / 60 cards · $${s.value.toFixed(2)}${favCount>0?` · ★ ${favCount}`:""}${viewCount>0?` · 👁 ${viewCount}`:""}</div>
      ${renderDeckChips(s)}
      ${d.updated_at && html`<div class="deck-card-updated" title=${"Last updated " + absoluteLocalTime(d.updated_at) + " (your local time)"}>Updated ${relativeTime(d.updated_at)}</div>`}
      <div class="deck-card-actions">
        <button onClick=${e=>{e.stopPropagation(); duplicateExternalDeck(d);}}>Duplicate</button>
        ${opts.showUnfavorite && html`<button class="danger" onClick=${e=>{e.stopPropagation(); toggleFavorite(d.id);}}>Unfavorite</button>`}
        ${opts.showUnfollowCreator && html`<button class="danger" onClick=${e=>{e.stopPropagation(); toggleFollowCreator(d.user_id);}}>Unfollow ${entry.creator?.display_name || "creator"}</button>`}
      </div>
    </div>`;
  };

  // Ink-filter helpers + filtered/sorted Your Decks list. Placed here —
  // BEFORE all the conditional early-returns below — so React always sees
  // the same hook count regardless of which view path renders this turn.
  // Calling useMemo conditionally is the cardinal Rules-of-Hooks sin.
  const matchesInks = (inks) => {
    if(inkFilter.size === 0) return true;
    for(const ink of inkFilter) if(!inks.includes(ink)) return false;
    return true;
  };
  const toggleInkFilter = (ink) => setInkFilter(prev => {
    const next = new Set(prev);
    if(next.has(ink)) next.delete(ink); else next.add(ink);
    return next;
  });
  const yourDecksProcessed = useMemo(() => {
    if(!decks) return [];
    const enriched = decks.map(d => {
      const s = summarizeDeck(d);
      return {d, s, _fav: favoriteCounts[d.id] || 0, _view: viewCounts[d.id] || 0};
    });
    const q = yourDeckSearch.trim().toLowerCase();
    const filtered = enriched.filter(({d, s}) => {
      if(q && !(d.name||"").toLowerCase().includes(q)) return false;
      if(inkFilter.size > 0){
        for(const ink of inkFilter) if(!s.inks.includes(ink)) return false;
      }
      return true;
    });
    const cmp = (a, b) => {
      switch(yourDeckSort){
        case "created_desc":   return new Date(b.d.created_at||b.d.updated_at) - new Date(a.d.created_at||a.d.updated_at);
        case "value_desc":     return (b.s.value || 0) - (a.s.value || 0);
        case "favorites_desc": return (b._fav - a._fav) || (new Date(b.d.updated_at) - new Date(a.d.updated_at));
        case "owned_desc":     return ((b.s.total ? b.s.owned/b.s.total : 0) - (a.s.total ? a.s.owned/a.s.total : 0));
        case "name_asc":       return (a.d.name||"").localeCompare(b.d.name||"");
        case "updated_desc":
        default:               return new Date(b.d.updated_at) - new Date(a.d.updated_at);
      }
    };
    return filtered.sort(cmp).map(({d}) => d);
  }, [decks, favoriteCounts, viewCounts, yourDeckSearch, yourDeckSort, inkFilter, collection, cardById]);
  const filterExternal = (entries) => entries.filter(e => matchesInks(summarizeDeck(e.deck).inks));

  const createDeck = useCallback(async () => {
    if(!user) return;
    const {data, error} = await sbClient.from("decks")
      .insert({user_id:user.id, name: "New Deck"})
      .select("id").single();
    if(error){ alert("Couldn't create deck: " + error.message); return; }
    await refreshDecks();
    openDeckInMode(data.id, "edit");
  }, [user, refreshDecks, openDeckInMode]);

  // Inline rename used by the deck-editor title click. No prompt — pass
  // the new name directly. Returns true on success so callers can revert
  // their local state on failure.
  const renameDeckInline = useCallback(async (deckId, name) => {
    const clean = (name || "").trim();
    if(!clean) return false;
    const {error} = await sbClient.from("decks").update({name: clean}).eq("id", deckId);
    if(error){ alert("Rename failed: " + error.message); return false; }
    setDecks(ds => (ds||[]).map(d => d.id === deckId ? {...d, name: clean} : d));
    return true;
  }, []);

  // Duplicate an existing deck — inserts a new deck row prefixed with
  // "Copy of ", then bulk-inserts all deck_cards. Shows a confirmation
  // toast and navigates to the new deck so the action is obvious.
  const duplicateDeck = useCallback(async (deckId) => {
    const src = (decks || []).find(d => d.id === deckId);
    if(!src || !user) return;
    const newName = "Copy of " + src.name;
    const {data, error} = await sbClient.from("decks")
      .insert({user_id:user.id, name: newName,
               description: src.description || null,
               inks: src.inks || null, tags: src.tags || null})
      .select("id").single();
    if(error){ alert("Couldn't duplicate: " + error.message); return; }
    const rows = (src.cards||[]).map(c => ({
      deck_id: data.id, card_id: c.card_id, printing: c.printing, quantity: c.quantity,
    }));
    if(rows.length){
      const {error: e2} = await sbClient.from("deck_cards").insert(rows);
      if(e2){
        console.error("duplicate-cards failed:", e2);
        alert(`Duplicated deck (header only) — cards copy failed: ${e2.message}`);
      }
    }
    await refreshDecks();
    openDeckInMode(data.id, "view");
    showToast(`Duplicated as "${newName}"`);
  }, [decks, user, refreshDecks, openDeckInMode]);

  // Deep-copy a deck the current user doesn't own (someone else's shared deck)
  // into their own collection. Mirrors duplicateDeck but sources the rows
  // from a deck object we already have in memory (the externalDeck cache).
  const duplicateExternalDeck = useCallback(async (src) => {
    if(!src || !user) return;
    const newName = "Copy of " + src.name;
    const {data, error} = await sbClient.from("decks")
      .insert({user_id:user.id, name: newName,
               description: src.description || null,
               inks: src.inks || null, tags: src.tags || null})
      .select("id").single();
    if(error){ alert("Couldn't duplicate: " + error.message); return; }
    const rows = (src.cards||[]).map(c => ({
      deck_id: data.id, card_id: c.card_id, printing: c.printing, quantity: c.quantity,
    }));
    if(rows.length){
      const {error: e2} = await sbClient.from("deck_cards").insert(rows);
      if(e2){
        console.error("duplicate-cards (external) failed:", e2);
        alert(`Saved deck header — couldn't copy cards: ${e2.message}`);
      }
    }
    await refreshDecks();
    setExternalDeck(null);
    openDeckInMode(data.id, "view");
    showToast(`Duplicated as "${newName}"`);
  }, [user, refreshDecks, showToast, openDeckInMode]);

  const deleteDeck = useCallback(async (deckId) => {
    if(!confirm("Delete this deck? This can't be undone.")) return;
    const {error} = await sbClient.from("decks").delete().eq("id", deckId);
    if(error){ alert("Delete failed: " + error.message); return; }
    if(selectedDeckId === deckId) setSelectedDeckId(null);
    await refreshDecks();
  }, [selectedDeckId, refreshDecks]);

  // Optimistic add/remove for the editor — updates local state immediately,
  // upserts/deletes the row in Supabase in the background. Errors revert.
  const updateDeckCard = useCallback(async (deckId, cardId, printing, newQty) => {
    if(!user) return;
    const prev = decks;
    setDecks(ds => (ds||[]).map(d => {
      if(d.id !== deckId) return d;
      const cards = (d.cards || []).filter(c => !(c.card_id === cardId && c.printing === printing));
      if(newQty > 0) cards.push({deck_id:deckId, card_id:cardId, printing, quantity:newQty});
      return {...d, cards};
    }));
    setPending(p => p + 1);
    try {
      if(newQty <= 0){
        const {error} = await sbClient.from("deck_cards").delete()
          .eq("deck_id", deckId).eq("card_id", cardId).eq("printing", printing);
        if(error) throw error;
      } else {
        const {error} = await sbClient.from("deck_cards")
          .upsert({deck_id:deckId, card_id:cardId, printing, quantity:newQty},
                  {onConflict:"deck_id,card_id,printing"});
        if(error) throw error;
      }
    } catch(e){
      console.error("deck card update failed:", e);
      setDecks(prev); // rollback
      alert("Couldn't save card change: " + e.message);
    } finally {
      setPending(p => Math.max(0, p - 1));
    }
  }, [user, decks]);

  // Update deck-level metadata (format/tags/description/etc). Optimistic
  // local merge + Supabase update with rollback on failure. Reads the
  // updated row back so trigger-set columns (like share_token, which the
  // visibility-change trigger rotates) stay in sync locally.
  const updateDeckMeta = useCallback(async (deckId, patch) => {
    if(!user || !patch) return;
    const prev = decks;
    setDecks(ds => (ds||[]).map(d => d.id === deckId ? {...d, ...patch} : d));
    setPending(p => p + 1);
    try {
      const {data, error} = await sbClient.from("decks").update(patch).eq("id", deckId)
        .select("id,name,description,inks,tags,visibility,share_token,created_at,updated_at,user_id")
        .maybeSingle();
      if(error) throw error;
      if(data){
        setDecks(ds => (ds||[]).map(d => d.id === deckId ? {...d, ...data} : d));
      }
    } catch(e){
      console.error("deck meta update failed:", e);
      setDecks(prev);
      alert("Couldn't save: " + e.message);
    } finally {
      setPending(p => Math.max(0, p - 1));
    }
  }, [user, decks]);

  const renameDeck = useCallback(async (deckId, currentName) => {
    const next = prompt("Rename deck:", currentName);
    if(next == null) return;
    const name = next.trim();
    if(!name || name === currentName) return;
    const {error} = await sbClient.from("decks").update({name}).eq("id", deckId);
    if(error){ alert("Rename failed: " + error.message); return; }
    await refreshDecks();
  }, [refreshDecks]);

  // Toast portal — rendered into <body> so it floats above whichever
  // sub-view (editor / list / empty state) is on screen.
  const toastEl = toast ? ReactDOM.createPortal(
    html`<div class="deck-toast">${toast}</div>`,
    document.body
  ) : null;

  // Creator profile page — public-deck list for a specific user. Rendered
  // before the sign-in gate so anonymous visitors can browse creator
  // profiles via shared URLs.
  if(creatorProfile){
    if(creatorProfile.error){
      return html`<div class="empty-state">
        <h2 class="title-font">Profile unavailable</h2>
        <p>${creatorProfile.error}</p>
        <button onClick=${closeCreatorProfile} style=${{padding:"8px 16px",fontSize:13,marginTop:10}}>← Back to Decks</button>
      </div>`;
    }
    if(creatorProfile.loading){
      return html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>Loading profile…</div>`;
    }
    const c = creatorProfile.creator || {};
    const cid = creatorProfile.creatorId;
    const isMe = user && cid === user.id;
    const isFollowingCreator = userFollows.has(cid);
    return html`<${React.Fragment}>
      <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
        <button onClick=${closeCreatorProfile} style=${{fontSize:12,padding:"5px 10px"}}>← Back to Decks</button>
      </div>
      <div class="creator-profile-header">
        ${c.avatar_url
          ? html`<img class="creator-profile-avatar" src=${c.avatar_url} alt=""/>`
          : html`<span class="creator-profile-avatar creator-profile-avatar-fallback">${(c.display_name||"?")[0].toUpperCase()}</span>`}
        <div class="creator-profile-info">
          <div class="creator-profile-eyebrow">Creator</div>
          <h2 class="creator-profile-name">${c.display_name || "Anonymous user"}</h2>
          <div class="creator-profile-meta">
            ${creatorProfile.decks.length} public deck${creatorProfile.decks.length===1?"":"s"}
          </div>
        </div>
        <div style=${{marginLeft:"auto"}}>
          ${!isMe && cid && html`<button class=${"deck-creator-follow large"+(isFollowingCreator?" on":"")}
            onClick=${user ? (()=>toggleFollowCreator(cid)) : (()=>onSignIn && onSignIn())}
            title=${user
              ? (isFollowingCreator ? "Stop following this creator" : "Follow to see their public decks in your Following feed")
              : "Sign in to follow this creator"}>
            ${user ? (isFollowingCreator ? "Following" : "+ Follow") : "Sign in to follow"}
          </button>`}
        </div>
      </div>
      ${creatorProfile.decks.length === 0
        ? html`<div class="muted" style=${{fontSize:13,padding:"24px 0"}}>
            ${isMe ? "You haven't published any public decks yet. Set a deck's visibility to Public from its Share menu."

          </div>`
        : html`<div class="deck-list">${creatorProfile.decks.map(entry => renderExternalCard(entry, {}))}</div>`}
      ${toastEl}
    <//>`;
  }

  // External (someone else's) deck — render BEFORE the sign-in gate so
  // unauthenticated visitors can view public/unlisted shared decks.
  if(externalDeck){
    if(externalDeck.error){
      return html`<div class="empty-state">
        <h2 class="title-font">Deck unavailable</h2>
        <p>${externalDeck.error}</p>
        <button onClick=${closeExternalDeck} style=${{padding:"8px 16px",fontSize:13,marginTop:10}}>← Back to Decks</button>
      </div>`;
    }
    const d = externalDeck.deck;
    const creatorId = d.user_id;
    const isFollowingCreator = creatorId ? userFollows.has(creatorId) : false;
    return html`<${React.Fragment}>
      <${DeckEditor} deck=${d} cardById=${cardById}
        collection=${collection} raw=${raw} theme=${theme}
        user=${user} onSignIn=${onSignIn}
        pending=${0}
        favoriteCount=${favoriteCounts[d.id] || 0}
        readOnly=${true}
        creator=${externalDeck.creator}
        creatorId=${creatorId}
        isOwnDeck=${false}
        canAct=${!!user}
        isFavorited=${favorites.has(d.id)}
        onToggleFavorite=${user ? (()=>toggleFavorite(d.id, externalDeck.shareToken || null)) : (()=>onSignIn && onSignIn())}
        isFollowingCreator=${isFollowingCreator}
        onToggleFollowCreator=${user ? (()=>toggleFollowCreator(creatorId)) : (()=>onSignIn && onSignIn())}
        onOpenCreator=${creatorId ? (()=>openCreatorProfile(creatorId)) : null}
        onBack=${closeExternalDeck}
        onRename=${null} onDelete=${null}
