        ${RARS.map(r=>{const pct=c[r]||0,int=Math.min(1,pct/40);
          return html`<td key=${r} style=${{...cs,background:pct<0.5?"transparent":"rgba(200,168,70,"+(0.08+int*0.55).toFixed(2)+")",
            color:int>0.5?"var(--heatmap-text-hi)":"var(--heatmap-text-lo)",fontWeight:int>0.6?600:400}}>${pct<0.5?"":pct.toFixed(1)+"%"}</td>`;})}
      </tr>`)}</tbody></table></div></div>`;
}

// ── Collection set detail view ─────────────────────────────────────────
// Shown when user clicks a set on the Collection page. Dense responsive grid
// of every card in the set with +/- counters per printing. Two view modes:
// "list" (compact rows, ~2-3 columns) and "cards" (image tiles).

// Tiny horizontal counter — [−][N][+] all on one line. Used in both list
// rows and card tiles. Click-stop-propagation so we don't accidentally open
// the detail modal when changing quantity.
const InlineCounter = ({qty, onChange, disabled}) => {
  // No onChange = read-only mode (viewing someone else's collection).
  // Render the quantity without +/- buttons so the reader can still see
  // how many copies the owner has.
  if(!onChange) return html`<div class="inline-counter inline-counter-readonly">
    <span class="ic-qty ${qty>0?'has':''}">${qty}</span>
  </div>`;
  return html`<div class="inline-counter">
    <button class="ic-btn" onClick=${e=>{e.stopPropagation(); onChange(Math.max(0,qty-1));}} disabled=${qty<=0||disabled}>−</button>
    <span class="ic-qty ${qty>0?'has':''}">${qty}</span>
    <button class="ic-btn" onClick=${e=>{e.stopPropagation(); onChange(qty+1);}} disabled=${disabled}>+</button>
  </div>`;
};

const SetDetailListRow = ({group, normalQty, foilQty, onNormal, onFoil, onOpen, theme, showNormalSide, showFoilSide, subtitle}) => {
  const num = (group.Number||"").split("/")[0] || "—";
  const nLow = group.normal && group.normal["Low Price"];
  const fLow = group.foil   && group.foil["Low Price"];
  const showN = showNormalSide && group.normal && nLow != null;
  const showF = showFoilSide   && group.foil   && fLow != null;
  // When foilMode hides one side, render only the visible counter and span
  // both grid columns so it fills the space instead of leaving a gap.
  const onlyNormal = showNormalSide && !showFoilSide;
  const onlyFoil   = showFoilSide   && !showNormalSide;
  const rowClass = "sd-row" + ((onlyNormal||onlyFoil) ? " sd-row-solo" : "");
  // Hover-preview: list rows don't show the card art inline (too small to
  // be useful), so we float a larger image near the cursor on hover. State
  // lives per-row; the preview is portaled into <body> so it escapes any
  // overflow clipping further up the tree.
  const [hoverPos, setHoverPos] = useState(null);
  const previewImg = group.img_normal || group.img_small;
  const onEnter = (e) => {
    if(!previewImg) return;
    setHoverPos({x: e.clientX, y: e.clientY});
  };
  const onMove = (e) => {
    if(!previewImg || !hoverPos) return;
    setHoverPos({x: e.clientX, y: e.clientY});
  };
  const onLeave = () => setHoverPos(null);
  // Dual-ink cards (e.g. Emerald/Sapphire) carry both colors in `group.inks`.
  // Render the row background as a 50/50 horizontal gradient so the slot
  // visually reads as both inks instead of falling back to grey.
  const inkList = (group.inks && group.inks.length) ? group.inks : (group.ink ? [group.ink] : []);
  const rowBg = inkList.length === 2
    ? `linear-gradient(90deg, ${inkTint(inkList[0], theme)} 0%, ${inkTint(inkList[1], theme)} 100%)`
    : inkTint(inkList[0] || group.ink, theme);
  return html`<div class=${rowClass} style=${{background: rowBg}}
      onClick=${onOpen}
      onMouseEnter=${onEnter} onMouseMove=${onMove} onMouseLeave=${onLeave}>
    ${onlyFoil
      ? html`<${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`
      : onlyNormal
        ? html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>`
        : html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>
               <${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`}
    <span class="sd-row-num">${num}</span>
    <span class="sd-row-rarity-slot">
      ${RARITY_ICONS[group.Rarity] && html`<img class="sd-row-rarity" src=${RARITY_ICONS[group.Rarity]}
        alt=${group.Rarity} title=${group.Rarity}
        onError=${e=>{ e.target.style.display = "none"; }}/>`}
    </span>
    <div class="sd-row-name-wrap">
      <span class="sd-row-name" title=${group["Product Name"]}>${group["Product Name"]}</span>
      ${subtitle && html`<span class="sd-row-subtitle">${subtitle}</span>`}
    </div>
    <div class="sd-row-prices">
      ${showN && html`<a class="sd-row-price normal" href=${tcgUrl(group.normal.tcgplayer_product_id,"Normal")} target="_blank" rel="noopener nofollow" onClick=${e=>e.stopPropagation()}>$${nLow.toFixed(2)}</a>`}
      ${showF && html`<a class="sd-row-price foil" href=${tcgUrl(group.foil.tcgplayer_product_id, group.foil.tcg_printing)} target="_blank" rel="noopener nofollow" onClick=${e=>e.stopPropagation()}>$${fLow.toFixed(2)}</a>`}
      ${!showN && !showF && html`<span class="sd-row-price muted">—</span>`}
    </div>
    ${hoverPos && previewImg ? ReactDOM.createPortal(
      html`<div class="sd-row-preview" style=${{
        left:  Math.min(hoverPos.x + 18, window.innerWidth - 230) + "px",
        top:   Math.min(hoverPos.y + 18, window.innerHeight - 320) + "px",
      }}>
        <img src=${previewImg} alt=${group["Product Name"]}/>
      </div>`,
      document.body
    ) : null}
  </div>`;
};

const SetDetailCardTile = ({group, normalQty, foilQty, onNormal, onFoil, onOpen, theme, showNormalSide, showFoilSide, subtitle}) => {
  const num = (group.Number||"").split("/")[0] || "—";
  const img = group.img_small || group.img_normal;
  const price = (group.normal && group.normal["Low Price"]) ?? (group.foil && group.foil["Low Price"]);
  const onlyNormal = showNormalSide && !showFoilSide;
  const onlyFoil   = showFoilSide   && !showNormalSide;
  return html`<div class="sd-tile" style=${{background:inkTint(group.ink,theme)}}>
    ${img
      ? html`<img class="sd-tile-img" src=${img} alt=${group["Product Name"]} loading="lazy" onClick=${onOpen}/>`
      : html`<div class="sd-tile-img-placeholder" onClick=${onOpen}>${group["Product Name"]}</div>`}
    <div class="sd-tile-info" onClick=${onOpen}>
      <span class="sd-tile-num">#${num}</span>
      <div class="sd-tile-name-wrap">
        <span class="sd-tile-name" title=${group["Product Name"]}>${group["Product Name"]}</span>
        ${subtitle && html`<span class="sd-tile-subtitle">${subtitle}</span>`}
      </div>
      ${price!=null && html`<span class="sd-tile-price">$${price.toFixed(2)}</span>`}
    </div>
    <div class="sd-tile-counters">
      ${onlyFoil
        ? html`<${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`
        : onlyNormal
          ? html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>`
          : html`<${InlineCounter} qty=${normalQty} onChange=${onNormal}/>
                 <${InlineCounter} qty=${foilQty}   onChange=${onFoil}/>`}
    </div>
  </div>`;
};

// Build a small "from this view" suffix describing which filters are active.
const searchOrFilterLabel = (inkF, rarF, search, foilMode, statusFilter) => {
  const parts = [];
  if(foilMode === "normal") parts.push("non-foil");
  if(foilMode === "foil")   parts.push("foil");
  if(statusFilter && statusFilter !== "all") parts.push(statusFilter);
  if(inkF.size === 1) parts.push([...inkF][0]);
  else if(inkF.size > 1) parts.push(inkF.size+" inks");
  if(rarF.size === 1) parts.push([...rarF][0]);
  else if(rarF.size > 1) parts.push(rarF.size+" rarities");
  if(search) parts.push(`"${search.trim().slice(0,20)}"`);
  if(parts.length === 0) return " from this set";
  return " · " + parts.join(" · ");
};

const CollectionSetDetail = ({setName, raw, collection, updateQty, bulkUpdateCollection, onBack, theme, user, onSignIn, copies, readOnly, compareMode, viewerOwnCollection}) => {
  // Filter helper. In viewer (read-only) mode, the viewer can ask to see
  // only cards they're missing or only cards they share. The match is on
  // EITHER printing in the group — a Normal-only owned card by the viewer
  // counts as "shared" with respect to that group.
  const matchesCompare = (g) => {
    if(!readOnly || !compareMode || compareMode === "all" || !viewerOwnCollection) return true;
    const nk = g.normal ? `${g.card_id}:${g.normal.tcg_printing}` : null;
    const fk = g.foil   ? `${g.card_id}:${g.foil.tcg_printing}`   : null;
    const ownerHas  = (nk && (collection[nk]||0) > 0) || (fk && (collection[fk]||0) > 0);
    const viewerHas = (nk && (viewerOwnCollection[nk]||0) > 0) || (fk && (viewerOwnCollection[fk]||0) > 0);
    if(!ownerHas) return false; // only show cards the OWNER has
    if(compareMode === "missing") return !viewerHas;
    if(compareMode === "shared")  return viewerHas;
    return true;
  };
  const [viewMode, setViewMode] = useState("list");
  const [bulkAddOpen, setBulkAddOpen] = useState(false);
  // Undo state — populated by the bulk-add modal's onApplied callback.
  // Holds the snapshot of prior quantities + a summary line for the toast.
  // Cleared when the user clicks Undo or after 30s (auto-dismiss).
  const [bulkUndo, setBulkUndo] = useState(null);
  const [bulkUndoBusy, setBulkUndoBusy] = useState(false);
  useEffect(() => {
    if(!bulkUndo) return;
    const t = setTimeout(() => setBulkUndo(null), 30000);
    return () => clearTimeout(t);
  }, [bulkUndo]);
  const handleBulkUndo = useCallback(async () => {
    if(!bulkUndo || !bulkUpdateCollection) return;
    setBulkUndoBusy(true);
    try {
      const res = await bulkUpdateCollection(bulkUndo.prior);
      if(!res || !res.ok){
        alert("Undo failed: " + (res?.error || "unknown error"));
      } else {
        setBulkUndo(null);
      }
    } catch(e){ alert("Undo failed: " + (e?.message || e)); }
    setBulkUndoBusy(false);
  }, [bulkUndo, bulkUpdateCollection]);
  const [search, setSearch] = useState("");
  const [inkFilter, setInkFilter] = useState(new Set());
  const [rarityFilter, setRarityFilter] = useState(new Set());
  // "all" | "complete" | "incomplete" | "extras" — applied vs current foil mode
  const [statusFilter, setStatusFilter] = useState("all");
  // Extras & Oddities cards are all foil-only by design (Holofoil starter-
  // deck variants, etc.), so the foil-mode toggle is hidden in that view
  // and the state is locked to "foil".
  const isExtrasView = setName === EXTRAS_SET_NAME;
  // Promo sets get row-flow grid (1-3 row 1, 4-6 row 2, ...) instead of the
  // column-flow we use for main sets, and tighter +/- counters so the long
  // card names ("Dalmatian Puppy - Tail Wagger" etc.) actually fit.
  const isPromoSet = setName === "Promo Set 1" || setName === "Promo Set 2" || setName === "Promo Set 3";
  // Sets that get the Non-Foil + Foil section split in the Collection set
  // detail view (top stack = non-foil, bottom stack = foil) instead of the
  // usual mixed-printing rows. Both have a meaningful price gap between the
  // Prize Wall non-foil and the Prize Foil version that makes a unified
  // counter row misleading. Year 3 also gives the two printings different
  // collector numbers so each card naturally appears once per section.
  const SECTION_SPLIT_SETS = new Set([
    "Lorcana Challenge Promo (C1)",
    "Lorcana Challenge Promo (C2)",
  ]);
  const isChallengePromoC1 = SECTION_SPLIT_SETS.has(setName);
  const [foilMode, setFoilMode] = useState(isExtrasView ? "foil" : "either"); // "either" | "normal" | "foil"
  const [sortKey, setSortKeyState] = useState("num");
  const [selectedGroup, setSelectedGroup] = useState(null);
  // Per-card target: 1 for Master Set, 4 for Playset, etc. Passed in from
  // CollectionView's top-level segmented toggle. Falls back to 1 if missing
  // so the set detail view still works in isolation.
  const TARGET = Math.max(1, copies || 1);

  const groups = useMemo(()=>{
    const filtered = raw.filter(r => r.Set === setName);
    const out = groupCards(filtered);
    const cmp = SORT_COMPARATORS[sortKey];
    if(cmp) out.sort(cmp);
    else out.sort((a,b) => collectorNum(a) - collectorNum(b));
    return out;
  }, [raw, setName, sortKey]);

  // Rarities actually present in this set, in the standard display order.
  const setRarities = useMemo(()=>{
    const present = new Set(groups.map(g => g.Rarity));
    return CARDS_RARITIES.filter(r => present.has(r));
  }, [groups]);

  const visibleGroups = useMemo(() => {
    const parsed = parseSearchQuery(search||"");
    return groups.filter(g => {
      if(!matchesCompare(g)) return false;
      if(inkFilter.size && !inkFilter.has(g.ink)) return false;
      if(rarityFilter.size && !rarityFilter.has(g.Rarity)) return false;
      if(parsed.name && !nameMatches(parsed.name, g["Product Name"])) return false;
      if(parsed.filters.ink && g.ink !== parsed.filters.ink) return false;
      if(parsed.filters.rarity && g.Rarity !== parsed.filters.rarity) return false;

      // For the active foil mode, count which printings are "in scope" and
      // how complete the user is on each.
      const nApplies = foilMode !== "foil"   && !!g.normal;
      const fApplies = foilMode !== "normal" && !!g.foil;
      const ownN = nApplies ? (collection[g.card_id+":"+g.normal.tcg_printing] || 0) : null;
      const ownF = fApplies ? (collection[g.card_id+":"+g.foil.tcg_printing]   || 0) : null;
      const shortN = nApplies ? Math.max(0, TARGET - ownN) : 0;
      const shortF = fApplies ? Math.max(0, TARGET - ownF) : 0;
      const overN  = nApplies ? Math.max(0, ownN - TARGET) : 0;
      const overF  = fApplies ? Math.max(0, ownF - TARGET) : 0;
      const totalShort = shortN + shortF;
      const totalOver  = overN  + overF;

      if(statusFilter === "complete"   && totalShort > 0) return false;
      if(statusFilter === "incomplete" && totalShort === 0) return false;
      if(statusFilter === "extras"     && totalOver === 0) return false;
      // If no printing applies under the foilMode (e.g., chase card under
      // foilMode='normal'), only "all" should include it.
      if(!nApplies && !fApplies && statusFilter !== "all") return false;
      return true;
    });
  }, [groups, inkFilter, rarityFilter, search, statusFilter, foilMode, collection, readOnly, compareMode, viewerOwnCollection]);

  // Filter-aware "missing" summary — for each visible printing, counts the
  // copies the user is SHORT of TARGET (Master Set = 1, Playset = 4). Value
  // = short copies × current Low. Respects rarity / ink / foilMode filters
  // so toggling Enchanted off, etc., drops it from the totals.
  const visibleMissing = useMemo(() => {
    let count = 0, value = 0;
    for(const g of visibleGroups){
      if(foilMode !== "foil" && g.normal){
        const qty = collection[g.card_id+":"+g.normal.tcg_printing] || 0;
        const short = Math.max(0, TARGET - qty);
        if(short > 0){
          count += short;
          value += (g.normal["Low Price"] ?? g.normal["TCGPlayer Market"] ?? 0) * short;
        }
      }
      if(foilMode !== "normal" && g.foil){
        const qty = collection[g.card_id+":"+g.foil.tcg_printing] || 0;
        const short = Math.max(0, TARGET - qty);
        if(short > 0){
          count += short;
          value += (g.foil["Low Price"] ?? g.foil["TCGPlayer Market"] ?? 0) * short;
        }
      }
    }
    return {count, value};
  }, [visibleGroups, collection, foilMode, TARGET]);

  // Filter-aware "owned value" summary — total $ for cards in the visible
  // view that the user actually owns. Sums every owned copy at current Low
  // (capped at TARGET would feel weird — extras are still real value, so
  // we count them all).
  const visibleOwned = useMemo(() => {
    let count = 0, value = 0;
    for(const g of visibleGroups){
      if(foilMode !== "foil" && g.normal){
        const qty = collection[g.card_id+":"+g.normal.tcg_printing] || 0;
        if(qty > 0){
          count += qty;
          value += (g.normal["Low Price"] ?? g.normal["TCGPlayer Market"] ?? 0) * qty;
        }
      }
      if(foilMode !== "normal" && g.foil){
        const qty = collection[g.card_id+":"+g.foil.tcg_printing] || 0;
        if(qty > 0){
          count += qty;
          value += (g.foil["Low Price"] ?? g.foil["TCGPlayer Market"] ?? 0) * qty;
        }
      }
    }
    return {count, value};
  }, [visibleGroups, collection, foilMode]);

  return html`<div>
    <div class="setdet-header">
      <button class="setdet-back" onClick=${onBack}>← Back to Collection</button>
      <h2 class="title-font setdet-title">${setName}</h2>
      <div class="setdet-count">${visibleGroups.length} / ${groups.length} cards</div>
      ${user && bulkUpdateCollection && html`<button class="setdet-bulk-add" onClick=${()=>setBulkAddOpen(true)}
        title="Bulk-add cards by rarity — e.g. a master set of Commons + Uncommons or a playset of Enchanteds">
        ＋ Bulk Add
      </button>`}
    </div>

    <div class="setdet-toolbar">
      <input type="search" class="setdet-search" placeholder="Search this set..."
        value=${search} onInput=${e=>setSearch(e.target.value)}/>
      <div class="cards-chipgroup">
        ${INKS.map(ink => html`<button key=${ink} class=${"chip ink ink-icon-chip "+(inkFilter.has(ink)?"active":"")}
          style=${{background:INK_COLORS[ink]?.bg,borderColor:INK_COLORS[ink]?.border}}
          title=${ink} aria-label=${ink}
          onClick=${()=>setInkFilter(s => toggleSet(s, ink))}>
          <img src=${INK_ICONS[ink]} alt=${ink}/>
        </button>`)}
      </div>
      <div class="cards-chipgroup">
        ${setRarities.map(r => html`<button key=${r} class=${"chip "+(rarityFilter.has(r)?"active":"")}
          onClick=${()=>setRarityFilter(s => toggleSet(s, r))}>${r}</button>`)}
      </div>
      <div class="seg-toggle">
        ${[["all","All"],["complete","Complete"],["incomplete","Incomplete"],["extras","Extras"]].map(([k,l]) =>
          html`<button key=${k} class=${statusFilter===k?"active":""} onClick=${()=>setStatusFilter(k)}>${l}</button>`)}
      </div>
      ${!isExtrasView && html`<div class="seg-toggle">
        ${[["either","Either"],["normal","Non-foil"],["foil","Foil"]].map(([k,l]) =>
          html`<button key=${k} class=${foilMode===k?"active":""} onClick=${()=>setFoilMode(k)}>${l}</button>`)}
      </div>`}
      <select value=${sortKey} onChange=${e=>setSortKeyState(e.target.value)} class="setdet-sort" title="Sort">
        <option value="num">#  Collector</option>
        <option value="name">Name (A→Z)</option>
        <option value="cost-asc">Cost ↑</option>
        <option value="cost-desc">Cost ↓</option>
        <option value="price-asc">Price ↑</option>
        <option value="price-desc">Price ↓</option>
      </select>
      <div class="setdet-view-toggle">
        <button class=${viewMode==="list"?"active":""} onClick=${()=>setViewMode("list")} title="Compact list">☰</button>
        <button class=${viewMode==="cards"?"active":""} onClick=${()=>setViewMode("cards")} title="Card grid">▦</button>
      </div>
    </div>

    <div class="setdet-value-stats">
      <div class="setdet-stat">
        <div class="setdet-stat-lbl">Owned value</div>
        <div class="setdet-stat-val green">$${visibleOwned.value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="setdet-stat-sub">${visibleOwned.count.toLocaleString()} card${visibleOwned.count===1?'':'s'}</div>
      </div>
      <div class="setdet-stat">
        <div class="setdet-stat-lbl">Missing value</div>
        <div class="setdet-stat-val red">$${visibleMissing.value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="setdet-stat-sub">${visibleMissing.count.toLocaleString()} to complete ${copies===1?"master":copies===4?"playset":copies+"×"} set</div>
      </div>
    </div>

    ${visibleMissing.count > 0 && html`<a class="setdet-buy-missing"
      href=${tcgSetSearchUrl(setName)} target="_blank" rel="noopener nofollow">
      <span class="setdet-buy-missing-text">Shop ${visibleMissing.count} missing card${visibleMissing.count===1?'':'s'}${searchOrFilterLabel(inkFilter,rarityFilter,search,foilMode,statusFilter)}</span>
      <span class="setdet-buy-missing-price">$${visibleMissing.value.toFixed(2)}<span class="setdet-buy-missing-arrow">↗</span></span>
    </a>`}

    ${(() => {
      // For Extras & Oddities, sub-group by the card's origin set so the
      // user sees "Wilds Unknown", "Fabled", etc. headers within the bucket.
      // For every other set there's just one (implicit) group.
      const groupsByOrigin = (() => {
        if(isChallengePromoC1){
          // Two stacked sections, one printing each. Cards lacking a Normal
          // row drop out of the Non-Foil section automatically.
          return [
            {key: "non-foil", label: "Non-Foil", items: visibleGroups.filter(g => g.normal), printingMode: "normal"},
            {key: "foil",     label: "Foil",                  items: visibleGroups.filter(g => g.foil),   printingMode: "foil"},
          ];
        }
        if(!isExtrasView) return [{key: setName, label: null, items: visibleGroups}];
        const buckets = new Map();
        for(const g of visibleGroups){
          const k = g.originSet || "Other";
          if(!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(g);
        }
        // Sort origin sets by their SET_ORDER position (newest first), then alpha.
        const keys = Array.from(buckets.keys()).sort((a,b) => {
          const ai = SET_ORDER.indexOf(a), bi = SET_ORDER.indexOf(b);
          if(ai === -1 && bi === -1) return a.localeCompare(b);
          if(ai === -1) return 1;
          if(bi === -1) return -1;
          return bi - ai;
        });
        return keys.map(k => ({key:k, label:k, items:buckets.get(k)}));
      })();
      // `printingMode` overrides the foil-mode toggle for a specific bucket
      // so the Challenge Promo Non-Foil section only shows non-foil counters
      // (and the Foil section only foil counters), regardless of the toggle.
      // When rendering a printing-specific section (Challenge Promo's
      // Non-Foil / Foil split), pull per-printing overrides up so the row
      // shows the right variant_label + image. groupCards builds the merged
      // group from the first row only; printing-specific fields like
      // China-Exclusive's local image live on g.normal/g.foil.
      const projectForPrinting = (g, printingMode) => {
        if(!printingMode) return g;
        const sub = printingMode === "normal" ? g.normal : g.foil;
        if(!sub) return g;
        return {
          ...g,
          variant_label: sub.variant_label || g.variant_label || null,
          img_small:  sub.img_small  || g.img_small,
          img_normal: sub.img_normal || g.img_normal,
          img_large:  sub.img_large  || g.img_large,
        };
      };
      const renderItems = (items, printingMode) => viewMode === "list"
        ? html`<div class=${"setdet-list-grid"+(isPromoSet?" setdet-list-grid--promo":"")}>${items.map(gOrig => {
            const g = projectForPrinting(gOrig, printingMode);
            const nKey = g.normal ? g.card_id+":"+g.normal.tcg_printing : null;
            const fKey = g.foil   ? g.card_id+":"+g.foil.tcg_printing   : null;
            const showNormal = printingMode ? (printingMode === "normal" && !!g.normal) : (foilMode !== "foil"   && g.normal);
            const showFoil   = printingMode ? (printingMode === "foil"   && !!g.foil)   : (foilMode !== "normal" && g.foil);
            // Extras cards stamp their variant label into `Rarity`; surface
            // it as a subtitle (e.g. "Starter Deck Exclusive Foil").
            const subtitle = g.variant_label || (isExtrasView ? g.Rarity : null);
            return html`<${SetDetailListRow} key=${g.card_id+":"+(printingMode||"")} group=${g} theme=${theme}
              normalQty=${nKey ? (collection[nKey]||0) : 0}
              foilQty=${fKey ? (collection[fKey]||0) : 0}
              onNormal=${!readOnly && showNormal && nKey ? (q)=>updateQty(g.card_id, g.normal.tcg_printing, q) : null}
              onFoil=${!readOnly && showFoil && fKey ? (q)=>updateQty(g.card_id, g.foil.tcg_printing, q) : null}
              showNormalSide=${showNormal} showFoilSide=${showFoil}
              subtitle=${subtitle}
              onOpen=${()=>setSelectedGroup(g)}/>`;
          })}</div>`
        : html`<div class="setdet-card-grid">${items.map(gOrig => {
            const g = projectForPrinting(gOrig, printingMode);
            const nKey = g.normal ? g.card_id+":"+g.normal.tcg_printing : null;
            const fKey = g.foil   ? g.card_id+":"+g.foil.tcg_printing   : null;
            const showNormal = printingMode ? (printingMode === "normal" && !!g.normal) : (foilMode !== "foil"   && g.normal);
            const showFoil   = printingMode ? (printingMode === "foil"   && !!g.foil)   : (foilMode !== "normal" && g.foil);
            const subtitle = g.variant_label || (isExtrasView ? g.Rarity : null);
            return html`<${SetDetailCardTile} key=${g.card_id+":"+(printingMode||"")} group=${g} theme=${theme}
              normalQty=${nKey ? (collection[nKey]||0) : 0}
              foilQty=${fKey ? (collection[fKey]||0) : 0}
              onNormal=${!readOnly && showNormal && nKey ? (q)=>updateQty(g.card_id, g.normal.tcg_printing, q) : null}
              onFoil=${!readOnly && showFoil && fKey ? (q)=>updateQty(g.card_id, g.foil.tcg_printing, q) : null}
              showNormalSide=${showNormal} showFoilSide=${showFoil}
              subtitle=${subtitle}
              onOpen=${()=>setSelectedGroup(g)}/>`;
          })}</div>`;
      return groupsByOrigin.map(bucket => html`<div key=${bucket.key} class="setdet-origin-bucket">
        ${bucket.label && html`<div class="setdet-origin-header">${bucket.label}</div>`}
        ${renderItems(bucket.items, bucket.printingMode || null)}
      </div>`);
    })()}

    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
    ${bulkAddOpen && html`<${BulkAddByRarityModal}
      groups=${groups} setRarities=${setRarities} collection=${collection}
      bulkUpdateCollection=${bulkUpdateCollection}
      onApplied=${(payload)=>setBulkUndo(payload)}

    ${bulkUndo && html`<div class="setdet-undo-toast" role="alert">
      <span>
        Added <strong>${bulkUndo.summary.totalCopies}</strong>
