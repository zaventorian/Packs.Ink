          </div>`}
        </div>
      </div>`}
      ${sectioned.length === 0
        ? html`<div class="muted" style=${{fontSize:12,padding:"20px 4px",textAlign:"center"}}>
            ${readOnly ? "This deck is empty." : html`Deck is empty. Click <strong>+</strong> on any card in the browser to add it.`}</div>`
        : sectioned.map(section => html`<div key=${section.key} class="deck-section">
            <div class="deck-section-title">${section.label} <span class="muted">${section.items.reduce((s,i)=>s+i.quantity,0)}</span></div>
            ${viewLayout === "grid"
              ? html`<div class="deck-section-grid">${section.items.map(renderItem)}</div>`
              : viewLayout === "stacked"
                ? html`<div class="deck-section-stack">${section.items.map(renderItem)}</div>`
                : html`<div class="deck-section-list">${section.items.map(renderItem)}</div>`}
          </div>`)}`;

      return html`<div class=${"deck-editor-grid"+(readOnly?" readonly":"")}>
        ${readOnly
          ? html`<div class="deck-view-list">${listBlock}</div>
                 <aside class="deck-editor-panel">${statsBlock}</aside>`
          : html`<div class="deck-editor-browser">
                   <${CardBrowser} raw=${deckRaw} collection=${collection}
                     onSelectGroup=${onSelectGroupStable}
                     deckQty=${deckQtyForGroup}
                     onDeckQtyChange=${onDeckQtyChangeStable}/>
                 </div>
                 <aside class="deck-editor-panel">${listBlock}${statsBlock}</aside>`}
      </div>`;
    })()}
    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${null} onSignIn=${onSignIn || (()=>{})}/>`}
    ${mulliganOpen && html`<${MulliganSimulator} deck=${deck} cardById=${cardById}
      onClose=${()=>setMulliganOpen(false)}/>`}
    ${posterOpen && html`<${DeckPosterModal} deck=${deck} cardById=${cardById}
      shareUrl=${deck.visibility && deck.visibility !== "private" ? shareUrl : null}
      creatorName=${ownerDisplayName || null}
      tournamentContext=${tournamentContext || null}
      onClose=${()=>setPosterOpen(false)}/>`}
    ${hoverPreview && html`<div class="deck-hover-preview"
      style=${{
        left:  Math.min(window.innerWidth  - 210, hoverPreview.x + 16) + "px",
        top:   Math.min(window.innerHeight - 290, hoverPreview.y + 16) + "px",
      }}>
      <img src=${hoverPreview.src} alt=""/>
    </div>`}
  </div>`;
};

// ── Main App ────────────────────────────────────────────────────────────
// ── Top-level routing ──────────────────────────────────────────────────
// Each top-level view maps to a path. We use the History API so the URL
// bar always shows where the user is, the browser back/forward buttons
// move between views, and direct links / bookmarks (e.g. packs.ink/decks)
// resolve to the right tab. On Netlify the SPA fallback in _redirects
// rewrites every unknown path to Index.html so the client can read
// location.pathname and pick the view.
const VIEW_PATHS = {
  home:       "/",
  screener:   "/screener",
  history:    "/price-graphing",
  market:     "/analytics",
  cards:      "/cards",
  collection: "/collection",
  decks:      "/decks",
  faq:        "/how-it-works",
};
const PATH_TO_VIEW = (() => {
  const m = {};
  for(const [v, p] of Object.entries(VIEW_PATHS)){
    m[p.replace(/\/$/, "") || "/"] = v;
  }
  return m;
})();
function parseViewFromPath(pathname){
  if(!pathname) return null;
  // Strip trailing slash + tolerate the literal /Index.html dev URL.
  let p = pathname.replace(/\/$/, "") || "/";
  if(p === "/Index.html" || p === "/index.html") p = "/";
  return PATH_TO_VIEW[p] || null;
}

function App(){
  const [raw,setRaw]=useState([]);const [loading,setLoading]=useState(false);const [err,setErr]=useState(null);const [loaded,setLoaded]=useState(false);
  // Sealed-product price snapshot. Joined to sealed_products server-side
  // in the sealed_prices_latest matview. Small payload (~300 rows) so we
  // skip the catalog cache layer and refetch each load.
  // Set metadata from the `sets` table — {id, name, released_at}. Used by
  // HomeEvStrip (set_id box matching) + CollectionPanel (prerelease filter).
  // Fetched independently of the catalog cache because loadFromSupabase
  // returns early on a fresh cache hit, which would otherwise leave this
  // empty and break the prerelease guard.
  const [setsMeta, setSetsMeta] = useState(() => {
    try {
      const cached = localStorage.getItem("packsink:setsMeta:v1");
      return cached ? JSON.parse(cached) : [];
    } catch { return []; }
  });
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const {data, error} = await sbClient.from("sets")
          .select("id,name,released_at").order("released_at", {ascending:false});
        if(cancelled || error || !data) return;
        setSetsMeta(data);
        try { localStorage.setItem("packsink:setsMeta:v1", JSON.stringify(data)); } catch {}
      } catch {/* non-fatal */}
    })();
    return () => { cancelled = true; };
  }, []);
  const [sealedPrices, setSealedPrices] = useState(()=>{
    const cached = readSealedCache();
    return (cached && cached.rows.length) ? cached.rows : [];
  });
  // Independent sealed-prices refresh — runs on every page mount regardless of
  // the catalog cache state. loadFromSupabase returns early when the catalog
  // cache is fresh, which would otherwise leave sealed empty for hours at a
  // time. Re-fetches when (a) we have no cache or (b) the cache is past its
  // 60-minute TTL; otherwise the initial useState hydration is enough.
  useEffect(() => {
    const cached = readSealedCache();
    if(cached && cached.rows.length && !cached.stale) return;
    let cancelled = false;
    (async () => {
      try {
        const SEALED_COLS = "tcgplayer_product_id,set_id,product_type,name,clean_name,low_price,market_price,image_url,tcgplayer_url,printing,price_date";
        const rows = await sbFetchAll("sealed_prices_latest", {
          select: SEALED_COLS,
          order: "tcgplayer_product_id.asc,printing.asc",
        });
        if(cancelled || !rows || !rows.length) return;
        setSealedPrices(rows);
        writeSealedCache(rows);
      } catch(e){
        console.warn("sealed-prices refresh failed:", e?.message || e);
      }
    })();
    return () => { cancelled = true; };
  }, []);
  // Latest price snapshot date in card_prices_latest. Used by the footer
  // pill to warn when the daily ETL hasn't run in a while (> 36h).
  // ALSO probe prices_daily.max(date) — if it's newer than the matview's
  // max(price_date), the matview refresh silently failed and the site is
  // serving yesterday's prices despite today's rows being in the raw
  // table. That bug actually fired in prod once; the warning pill now
  // surfaces it within minutes of next page load.
  const [lastEtlDate, setLastEtlDate] = useState(null);
  const [lastRawPriceDate, setLastRawPriceDate] = useState(null);
  useEffect(() => {
    let cancelled = false;
    sbClient.from("card_prices_latest").select("price_date")
      .order("price_date", {ascending:false}).limit(1)
      .then(({data, error}) => {
        if(cancelled) return;
        if(error){ console.warn("etl health probe failed:", error.message); return; }
        if(data && data[0]) setLastEtlDate(data[0].price_date);
      });
    sbClient.from("prices_daily").select("date")
      .eq("source", "tcgcsv").eq("grade", "raw")
      .order("date", {ascending:false}).limit(1)
      .then(({data, error}) => {
        if(cancelled) return;
        if(error){ console.warn("raw-prices health probe failed:", error.message); return; }
        if(data && data[0]) setLastRawPriceDate(data[0].date);
      });
    return () => { cancelled = true; };
  }, []);
  // Deep links: ?deck=<uuid> opens a specific deck; ?user=<uuid> opens
  // a creator's profile (their public deck list). Parsed once on mount;
  // DecksView consumes both. Mutually exclusive — deck wins if both are
  // somehow set.
  const initialUrlParams = useMemo(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      return {
        deck:        p.get("deck")       || null,
        token:       p.get("token")      || null,
        user:        p.get("user")       || null,
        collection:  p.get("collection") || null,
      };
    } catch { return {deck: null, token: null, user: null, collection: null}; }
  }, []);
  const [incomingDeckId, setIncomingDeckId] = useState(initialUrlParams.deck);
  // Multi-card compare on the Price Graphing tab. Screener's "Add to Price
  // Graphing" batch action sets this array of {card_id, productId, printing,
  // name} objects and switches to the history view; HistoryView consumes
  // the prop on mount, fetches each card's series, and renders them on one
  // chart.
  const [incomingCompareCards, setIncomingCompareCards] = useState(null);
  const startCompareCards = useCallback((cards) => {
    setIncomingCompareCards(cards);
    setView("history");
    setTabClickNonce(n => n + 1);
  }, []);
  // Banner → Screener filter handoff. Clicking a home banner title pushes
  // a payload here; PriceDatabase consumes it on mount via applyView.
  const [incomingScreenerView, setIncomingScreenerView] = useState(null);
  const openScreenerWithFilter = useCallback((payload) => {
    setIncomingScreenerView(payload);
    setView("screener");
    setTabClickNonce(n => n + 1);
  }, []);
  // Open a specific deck in the Decks tab. Used by cross-view jumps —
  // the Cards-tab bulk action that creates a new deck pre-seeded with
  // the user's selection AND the home Following feed entries clicking
  // through to a deck. Optional `token` lets the caller open an
  // unlisted deck via its share token (e.g. a favorited unlisted deck
  // surfaced in the feed).
  const openDeckById = useCallback((deckId, token) => {
    if(!deckId) return;
    setIncomingDeckId(deckId);
    if(token != null) setIncomingShareToken(token);
    setView("decks");
    setTabClickNonce(n => n + 1);
  }, []);
  // Jump to a specific tournament's detail page in the Decks tab.
  const [incomingTournamentId, setIncomingTournamentId] = useState(null);
  const openTournamentById = useCallback((tid) => {
    if(!tid) return;
    setIncomingTournamentId(tid);
    setView("decks");
    setTabClickNonce(n => n + 1);
  }, []);
  // Jump to the Decks → Tournaments tab list (no specific tournament).
  // Used by the home page's Tournament Results header click.
  const [incomingDeckSection, setIncomingDeckSection] = useState(null);
  const openTournamentsList = useCallback(() => {
    setIncomingDeckSection("tournaments");
    setView("decks");
    setTabClickNonce(n => n + 1);
  }, []);
  // Home section header → respective view shortcuts. Each just nudges the
  // top-level view (and a sub-section where the destination has tabs);
  // the URL sync effect handles pushState.
  const openDecksSection = useCallback((section) => {
    if(section) setIncomingDeckSection(section);
    setView("decks");
    setTabClickNonce(n => n + 1);
  }, []);
  // Home page quick-search → Cards tab handoff. Pre-fills the smart-search
  // and (when openCardId is set) opens that card's detail modal.
  const [incomingCardsSearch, setIncomingCardsSearch] = useState(null);
  const [incomingCardsOpenId, setIncomingCardsOpenId] = useState(null);
  const openCardsWithSearch = useCallback((query, openCardId) => {
    setIncomingCardsSearch(query || "");
    setIncomingCardsOpenId(openCardId || null);
    setView("cards");
    setTabClickNonce(n => n + 1);
  }, []);
  const openView = useCallback((v) => {
    setView(v);
    setTabClickNonce(n => n + 1);
  }, []);
  // Read-only collection viewer state. When `viewedCollectionId` is set
  // we're looking at someone else's collection via ?collection=<uuid>.
  // `viewedCollectionToken` carries the optional unlisted-link token.
  // `viewedCollectionData` is the fetched payload: {profile, visibility,
  // rawMap, sealedMap, gradedRows}. Null while loading / on error.
  const [viewedCollectionId, setViewedCollectionId]       = useState(initialUrlParams.collection);
  const [viewedCollectionToken, setViewedCollectionToken] = useState(
    initialUrlParams.collection ? initialUrlParams.token : null
  );
  const [viewedCollectionData, setViewedCollectionData]   = useState(null);
  const [viewedCollectionError, setViewedCollectionError] = useState(null);
  const openCollectionById = useCallback((userId, token) => {
    if(!userId) return;
    setViewedCollectionId(userId);
    setViewedCollectionToken(token || null);
    setView("collection");
    setTabClickNonce(n => n + 1);
    try {
      const u = new URL(window.location.href);
      u.searchParams.set("collection", userId);
      if(token) u.searchParams.set("token", token);
      else      u.searchParams.delete("token");
      window.history.pushState({collection: userId}, "", u.toString());
    } catch {}
  }, []);
  const closeViewedCollection = useCallback(() => {
    setViewedCollectionId(null);
    setViewedCollectionToken(null);
    setViewedCollectionData(null);
    setViewedCollectionError(null);
    try {
      const u = new URL(window.location.href);
      u.searchParams.delete("collection");
      u.searchParams.delete("token");
      window.history.pushState({}, "", u.toString());
    } catch {}
  }, []);
  // Fetch the four bits of data for the viewer: visibility/profile summary
  // first, then in parallel the three section payloads (gated by what
  // visibility flags say is visible to this viewer).
  useEffect(() => {
    if(!viewedCollectionId){ setViewedCollectionData(null); setViewedCollectionError(null); return; }
    let cancelled = false;
    (async () => {
      setViewedCollectionData(null); setViewedCollectionError(null);
      const tok = viewedCollectionToken || "";
      const visRes = await sbClient.rpc("get_collection_visibility", {p_user_id: viewedCollectionId, p_token: tok});
      if(cancelled) return;
      if(visRes.error || !visRes.data?.length){
        setViewedCollectionError(visRes.error?.message || "Collection not found.");
        return;
      }
      const vis = visRes.data[0];
      if(!vis.raw_visible && !vis.sealed_visible && !vis.graded_visible){
        setViewedCollectionError("This collection is private.");
        setViewedCollectionData({profile: {user_id: vis.user_id, display_name: vis.display_name, avatar_url: vis.avatar_url},
                                 visibility: {raw:false, sealed:false, graded:false}, rawMap:{}, sealedMap:{}, gradedRows:[]});
        return;
      }
      // PostgREST caps RPC table-returns at 1000 rows by default. Paginate
       // until we drain — a heavy collection can easily exceed 1000 raw rows.
      const paginateRpc = async (fn, args) => {
        const PAGE = 1000;
        const out = [];
        for(let from = 0; ; from += PAGE){
          const to = from + PAGE - 1;
          const res = await sbClient.rpc(fn, args).range(from, to);
          if(res.error) return res;
          const rows = res.data || [];
          out.push(...rows);
          if(rows.length < PAGE) break;
          if(from > 500000) break; // hard ceiling, paranoia
        }
        return {data: out, error: null};
      };
      const [rawRes, sealedRes, gradedRes] = await Promise.all([
        vis.raw_visible    ? paginateRpc("get_shared_collection_raw",    {p_user_id: viewedCollectionId, p_token: tok}) : Promise.resolve({data:[]}),
        vis.sealed_visible ? paginateRpc("get_shared_collection_sealed", {p_user_id: viewedCollectionId, p_token: tok}) : Promise.resolve({data:[]}),
        vis.graded_visible ? paginateRpc("get_shared_collection_graded", {p_user_id: viewedCollectionId, p_token: tok}) : Promise.resolve({data:[]}),
      ]);
      if(cancelled) return;
      const rawMap = {};
      for(const r of (rawRes.data || [])){
        rawMap[`${r.card_id}:${r.printing}`] = (rawMap[`${r.card_id}:${r.printing}`] || 0) + (r.quantity || 0);
      }
      const sealedMap = {};
      for(const r of (sealedRes.data || [])){
        sealedMap[r.tcgplayer_product_id] = (sealedMap[r.tcgplayer_product_id] || 0) + (r.quantity || 0);
      }
      setViewedCollectionData({
        profile: {user_id: vis.user_id, display_name: vis.display_name, avatar_url: vis.avatar_url},
        visibility: {raw: vis.raw_visible, sealed: vis.sealed_visible, graded: vis.graded_visible},
        rawMap,
        sealedMap,
        gradedRows: gradedRes.data || [],
      });
    })();
    return () => { cancelled = true; };
  }, [viewedCollectionId, viewedCollectionToken]);
  const [incomingShareToken, setIncomingShareToken] = useState(initialUrlParams.token);
  const [incomingUserId, setIncomingUserId] = useState(initialUrlParams.deck ? null : initialUrlParams.user);
  const [nc,setNc]=useState(false);
  const [excludeEnchanted,setExcludeEnchanted]=useState(false);
  const [excludeIconic,setExcludeIconic]=useState(false);
  // Legacy boolean (true when BOTH chase rarities are excluded). Some
  // call sites still consume `ne` as a single flag; we expose it as
  // derived state so the new split toggles remain the source of truth.
  const ne = excludeEnchanted && excludeIconic;
  const setNe = (v) => { setExcludeEnchanted(!!v); setExcludeIconic(!!v); };
  // Pick the initial view from (1) ?deck=/?user= query (forces decks),
  // (2) the URL pathname (e.g. /screener, /decks, etc.), (3) home.
  const [view,setView]=useState(() => {
    if(initialUrlParams.deck || initialUrlParams.user) return "decks";
    if(initialUrlParams.collection) return "collection";
    try { return parseViewFromPath(window.location.pathname) || "home"; }
    catch { return "home"; }
  });
  // Keep the URL pathname in sync with `view` so back/forward + reload +
  // bookmarks all work. Strips view-specific deep-link params (?deck=,
  // ?collection=, ?token=, ?user=, ?set=, ?tourney=) so navigating from
  // Collection → Home doesn't leave a stale `?collection=…` on the URL.
  // Each sub-view's own URL-sync effect re-adds the param when needed.
  useEffect(() => {
    try {
      const target = VIEW_PATHS[view] || "/";
      const current = window.location.pathname.replace(/\/$/, "") || "/";
      const normalizedTarget = target.replace(/\/$/, "") || "/";
      const url = new URL(window.location.href);
      const dirtyParams = ["deck","token","user","collection","set","tourney"];
      const hadStaleParam = dirtyParams.some(p => url.searchParams.has(p));
      if(current === normalizedTarget && !hadStaleParam) return;
      for(const p of dirtyParams) url.searchParams.delete(p);
      url.pathname = target;
      window.history.pushState({view}, "", url.toString());
    } catch {/* SSR / blocked storage / no-op */}
  }, [view]);
  // Browser back/forward — re-parse the path and update `view`.
  useEffect(() => {
    const onPop = () => {
      try {
        const params = new URLSearchParams(window.location.search);
        if(params.get("deck") || params.get("user")){ setView("decks"); return; }
        const colId = params.get("collection");
        if(colId){
          setViewedCollectionId(colId);
          setViewedCollectionToken(params.get("token") || null);
          setView("collection");
          return;
        }
        // Leaving viewer mode (no ?collection= in the URL anymore).
        setViewedCollectionId(null);
        setViewedCollectionToken(null);
        const v = parseViewFromPath(window.location.pathname);
        if(v) setView(v);
      } catch {/* no-op */}
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  // Cross-view navigation: a child view sets a "target" payload (e.g. EV
  // wants to jump into History focused on a specific set) and the destination
  // view consumes it via prop on mount. Bumped to a new object each call so
  // useEffect with [target] as dep refires even when navigating to the same set.
  const [historyTarget, setHistoryTarget] = useState(null);
  const openSetHistory = useCallback((setName) => {
    setHistoryTarget({ setName, nonce: Date.now() });
    setView("history");
  }, []);
  // Incremented every time a tab button is clicked. CollectionView watches
  // this and resets its internal selectedSet on change, so re-clicking the
  // Collection tab while inside a set drops you back to the main grid.
  const [tabClickNonce, setTabClickNonce] = useState(0);
  const onTabClick = useCallback((v) => {
    setView(v);
    setTabClickNonce(n => n + 1);
    // Strip deck/token/user params when leaving Decks so a hard refresh
    // doesn't deep-link the user back into a deck they navigated away from.
    if(v !== "decks"){
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete("deck");
        url.searchParams.delete("token");
        url.searchParams.delete("user");
        window.history.replaceState({}, "", url);
      } catch {}
    }
  }, []);
  // User settings — persisted to localStorage and (when signed in) synced
  // to Supabase user_metadata so they follow the user across devices.
  const [tipsEnabled, setTipsEnabled] = useState(() => {
    try { return JSON.parse(localStorage.getItem("packsink:tipsEnabled") ?? "true"); }
    catch { return true; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:tipsEnabled", JSON.stringify(tipsEnabled)); } catch {}
  }, [tipsEnabled]);
  // Card-as-avatar: stored as the card_id of the chosen card. Falls back to
  // Google avatar (frequently 403s) and then the first initial.
  const [avatarCardId, setAvatarCardId] = useState(() => {
    try { return localStorage.getItem("packsink:avatarCardId") || null; }
    catch { return null; }
  });
  useEffect(() => {
    try {
      if(avatarCardId) localStorage.setItem("packsink:avatarCardId", avatarCardId);
      else localStorage.removeItem("packsink:avatarCardId");
    } catch {}
  }, [avatarCardId]);
  const [avatarPickerOpen, setAvatarPickerOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  // PWA install support — capture the beforeinstallprompt event so we can
  // trigger the native install from our own button. iOS Safari doesn't fire
  // this; users on iOS get manual Share-menu instructions instead.
  const [installEvent, setInstallEvent] = useState(null);
  const [installHelpOpen, setInstallHelpOpen] = useState(false);
  const [isStandalone, setIsStandalone] = useState(() =>
    typeof window !== "undefined" && (
      window.matchMedia?.("(display-mode: standalone)").matches ||
      window.navigator.standalone === true
    )
  );
  useEffect(() => {
    const onBip = (e) => { e.preventDefault(); setInstallEvent(e); };
    const onInstalled = () => { setInstallEvent(null); setIsStandalone(true); setInstallHelpOpen(false); };
    window.addEventListener("beforeinstallprompt", onBip);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onBip);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);
  const ua = typeof navigator !== "undefined" ? navigator.userAgent || "" : "";
  const isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;
  const isAndroid = /Android/i.test(ua);
  // Close settings popover on outside click / Escape.
  const settingsRef = useRef(null);
  useEffect(() => {
    if(!settingsOpen) return;
    const onDocClick = (e) => {
      if(settingsRef.current && !settingsRef.current.contains(e.target)) setSettingsOpen(false);
    };
    const onKey = (e) => { if(e.key === "Escape") setSettingsOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDocClick);
      document.removeEventListener("keydown", onKey);
    };
  }, [settingsOpen]);
  const [loadProgress,setLoadProgress]=useState({loaded:0,total:0,current:""});
  // Theme persists to localStorage (per-device fallback) and, when signed in,
  // syncs to Supabase auth user_metadata (follows the user across devices).
  const [theme,setTheme]=useState(() => {
    try { return localStorage.getItem("packsink:theme") || "light"; }
    catch { return "light"; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("packsink:theme", theme); } catch {}
  }, [theme]);
  const [user,setUser]=useState(null);
  // Map of `${card_id}:${tcg_printing}` -> quantity owned. Stored locally for
  // fast lookup; mirrors the user's rows in collection_items (NM only for v1).
  const [collection,setCollection]=useState({});
  // Sealed-product collection: { [tcgplayer_product_id]: quantity }. Parallel
  // to `collection` but keyed by product_id since sealed has no card_id.
  const [sealedCollection, setSealedCollection] = useState({});
  // Tracks the post-sign-in fetch so the Home panel can show a "loading"
  // state instead of the "empty collection" CTA during the round-trip.
  const [collectionLoading, setCollectionLoading] = useState(false);

  // Track auth state. Supabase SDK auto-detects OAuth redirect on page load.
  useEffect(()=>{
    sbClient.auth.getSession().then(({data})=>setUser(data.session?.user||null));
    const {data:{subscription}} = sbClient.auth.onAuthStateChange((_evt, session) => {
      setUser(session?.user || null);
    });
    return () => subscription.unsubscribe();
  },[]);

  // Public profile state — display name + avatar URL the rest of the world
  // sees on your shared decks. Distinct from auth.users metadata (which is
  // private + Google-controlled). On first sign-in we create an empty row;
  // the user picks their own display name via a prompt (Google name is not
  // surfaced publicly).
  const [profile, setProfile] = useState(null);
  const [showNamePrompt, setShowNamePrompt] = useState(false);
  useEffect(()=>{
    if(!user){ setProfile(null); setShowNamePrompt(false); return; }
    let cancelled = false;
    (async () => {
      // Create the row if it doesn't exist (ignoreDuplicates means existing
      // rows are left untouched — we never overwrite a user's chosen name).
      const insertRes = await sbClient.from("profiles")
        .upsert({user_id: user.id}, {onConflict: "user_id", ignoreDuplicates: true});
      if(insertRes.error) console.warn("profile upsert failed (run supabase/18_*.sql?):", insertRes.error.message);
      // Read whatever's there now.
      const {data, error} = await sbClient.from("profiles")
        .select("user_id,display_name,avatar_url,collection_raw_visibility,collection_sealed_visibility,collection_graded_visibility,collection_share_token")
        .eq("user_id", user.id).maybeSingle();
      if(cancelled) return;
      if(error){ console.warn("profile read failed:", error.message); return; }
      setProfile(data || {user_id: user.id, display_name: null, avatar_url: null});
      // Prompt for a display name if it's missing (typical for a fresh sign-in).
      if(!data || !data.display_name || !data.display_name.trim()){
        setShowNamePrompt(true);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [user]);

  // Update one collection-section's visibility (raw / sealed / graded).
  // The DB trigger handles token rotation if this flips all three to private.
  const saveCollectionVisibility = useCallback(async (section, level) => {
    if(!user) return {ok:false, error:"Not signed in"};
    if(!["raw","sealed","graded"].includes(section)) return {ok:false, error:"bad section"};
    if(!["private","unlisted","public"].includes(level)) return {ok:false, error:"bad level"};
    const col = `collection_${section}_visibility`;
    const {error} = await sbClient.from("profiles")
      .update({[col]: level}).eq("user_id", user.id);
    if(error) return {ok:false, error: error.message};
    // Re-read so we pick up any token rotation done by the trigger.
    const {data} = await sbClient.from("profiles")
      .select("collection_raw_visibility,collection_sealed_visibility,collection_graded_visibility,collection_share_token")
      .eq("user_id", user.id).maybeSingle();
    if(data) setProfile(p => ({...(p||{user_id:user.id}), ...data}));
    else setProfile(p => ({...(p||{user_id:user.id}), [col]: level}));
    return {ok:true};
  }, [user]);

  // Owner-only RPC: rotate the collection share token, killing any in-the-
  // wild unlisted URL without flipping sections to private.
  const regenerateCollectionShareToken = useCallback(async () => {
    if(!user) return {ok:false, error:"Not signed in"};
    const {data, error} = await sbClient.rpc("regenerate_collection_share_token");
    if(error) return {ok:false, error: error.message};
    setProfile(p => ({...(p||{user_id:user.id}), collection_share_token: data}));
    return {ok:true, token: data};
  }, [user]);

  // Save a new display name (called by both the first-time prompt and the
  // settings-popover editor).
  const saveDisplayName = useCallback(async (raw) => {
    if(!user) return {ok:false, error: "Not signed in"};
    const name = (raw||"").trim();
    if(!name) return {ok:false, error: "Name can't be empty"};
    if(name.length > 32) return {ok:false, error: "Max 32 characters"};
    const bad = validateDisplayName(name);
    if(bad) return {ok:false, error: bad};
    const {error} = await sbClient.from("profiles")
      .update({display_name: name}).eq("user_id", user.id);
    if(error) return {ok:false, error: error.message};
    setProfile(p => ({...(p||{user_id: user.id}), display_name: name}));
    setShowNamePrompt(false);
    return {ok:true};
  }, [user]);

  // Tell Sentry who the current user is so errors get attributed in the
  // dashboard. The loader script stubs out a queue immediately, so calling
  // setUser() before Sentry finishes loading is safe — it gets replayed.
  // We only send the UUID + display name, never the email.
  useEffect(()=>{
    if(typeof window === "undefined" || typeof window.Sentry?.setUser !== "function") return;
    if(user){
      window.Sentry.setUser({
        id: user.id,
        username: profile?.display_name || "(unset)",
      });
    } else {
      window.Sentry.setUser(null);
    }
  }, [user, profile?.display_name]);

  // When the user signs in, hydrate UI prefs (theme, tooltips) from their
  // Supabase user_metadata so settings follow them across devices. Local
  // values win only when the server has nothing stored yet — first-write on
  // a new account just snapshots whatever was in localStorage.
  const prefsHydrated = useRef(false);
  useEffect(() => {
    if(!user){ prefsHydrated.current = false; return; }
    if(prefsHydrated.current) return;
    prefsHydrated.current = true;
    const meta = user.user_metadata || {};
    if(meta.theme === "dark" || meta.theme === "light") setTheme(meta.theme);
    if(typeof meta.tipsEnabled === "boolean") setTipsEnabled(meta.tipsEnabled);
    if(typeof meta.avatarCardId === "string" || meta.avatarCardId === null) setAvatarCardId(meta.avatarCardId);
  }, [user]);

  // After hydration, write any change back to user_metadata. Debounced to a
  // microtask so flipping a toggle is one round-trip, not three.
  //
  // CRITICAL: `user` is NOT in the deps. Supabase fires an auth-state-change
  // event after every successful updateUser(), which creates a fresh user
  // object reference. If we included `user` in deps, that would re-trigger
  // this effect → another updateUser() → another auth event → infinite
  // loop, throttled to ~4 req/s by the 250ms debounce. Supabase rate-limits
  // /auth/v1/user with a 429, queuing every other Supabase request behind
  // it and stalling catalog/movers/following fetches indefinitely.
  useEffect(() => {
    if(!prefsHydrated.current) return;
    const t = setTimeout(() => {
      sbClient.auth.updateUser({data: {theme, tipsEnabled, avatarCardId}}).catch(e =>
        console.error("user prefs sync failed:", e));
    }, 250);
    return () => clearTimeout(t);
  }, [theme, tipsEnabled, avatarCardId]);

  // Mirror the chosen avatar card's image URL into public.profiles so other
  // users see it on shared decks / creator profiles. Google avatar URLs are
  // intentionally NOT used — only card images you've explicitly picked.
  useEffect(() => {
    if(!user || !prefsHydrated.current) return;
    let avatarImageUrl = null;
    if(avatarCardId && raw && raw.length){
      const card = raw.find(r => r.card_id === avatarCardId);
      avatarImageUrl = (card && (card.img_small || card.img_normal)) || null;
    }
    sbClient.from("profiles").update({avatar_url: avatarImageUrl})
      .eq("user_id", user.id)
      .then(({error}) => { if(error) console.warn("profile avatar sync failed:", error.message); });
    // Reflect locally so the avatar shows up in the settings popover
    // (avatarSrc reads from profile when card_id isn't loaded yet).
    setProfile(p => p ? {...p, avatar_url: avatarImageUrl} : p);
  }, [user, avatarCardId, raw]);

  // Fetch the user's collection whenever they sign in/out. PostgREST caps
  // responses at ~1000 rows by default; a CSV-imported collection routinely
  // exceeds that (Normal + Foil per card across multiple sets). We page
  // through with .range() until we've seen everything — without this the
  // App silently truncates and rows beyond row 1000 "disappear on refresh".
  useEffect(()=>{
    if(!user){ setCollection({}); setCollectionLoading(false); return; }
    let cancelled = false;
    setCollectionLoading(true);
    (async ()=>{
      const all = [];
      const PAGE = 1000;
      let from = 0;
      while(true){
        const {data, error} = await sbClient
          .from("collection_items")
          .select("card_id,printing,quantity")
          .eq("condition","NM")
          .order("card_id", {ascending:true})
          .range(from, from + PAGE - 1);
        if(error){
          console.error("collection fetch failed:", error);
          setCollectionLoading(false);
          return;
        }
        if(cancelled) return;
        const batch = data || [];
        all.push(...batch);
        if(batch.length < PAGE) break;
        from += PAGE;
      }
      const map = {};
      for(const row of all){
        map[row.card_id+":"+row.printing] = (map[row.card_id+":"+row.printing]||0) + row.quantity;
      }
      setCollection(map);
      setCollectionLoading(false);
    })();
    return ()=>{ cancelled = true; };
  },[user]);

  // Sealed-product collection fetch — same paginated pattern as cards.
  // No printing dimension (sealed is always "Normal" effectively), so the
  // local key is just the product_id. Silently no-ops if the table isn't
  // deployed yet (17_sealed_collection_items.sql).
  useEffect(()=>{
    if(!user){ setSealedCollection({}); return; }
    let cancelled = false;
    (async ()=>{
      const all = [];
      const PAGE = 1000;
      let from = 0;
      while(true){
        const {data, error} = await sbClient
          .from("sealed_collection_items")
          .select("tcgplayer_product_id,quantity")
          .eq("condition","NM")
          .order("tcgplayer_product_id", {ascending:true})
          .range(from, from + PAGE - 1);
        if(error){
          // Table not deployed yet, or transient error — leave the map
          // empty rather than crashing. Console logs the reason for ops.
          console.warn("sealed collection fetch failed (run supabase/17_*.sql?):", error.message || error);
          return;
        }
        if(cancelled) return;
        const batch = data || [];
        all.push(...batch);
        if(batch.length < PAGE) break;
        from += PAGE;
      }
      const map = {};
      for(const row of all){
        map[row.tcgplayer_product_id] = (map[row.tcgplayer_product_id] || 0) + row.quantity;
      }
      setSealedCollection(map);
    })();
    return ()=>{ cancelled = true; };
  }, [user]);

  // Optimistically bump local state, then persist to Supabase.
  const updateSealedQty = useCallback(async (productId, newQty)=>{
    if(!user || productId == null) return;
    const pid = parseInt(productId, 10);
    setSealedCollection(c=>{
      const next = {...c};
      if(newQty<=0) delete next[pid];
      else next[pid] = newQty;
      return next;
    });
    try {
      if(newQty<=0){
        await sbClient.from("sealed_collection_items").delete()
          .eq("user_id", user.id).eq("tcgplayer_product_id", pid)
          .eq("condition","NM");
      } else {
        await sbClient.from("sealed_collection_items").upsert({
          user_id:user.id, tcgplayer_product_id:pid, condition:"NM", quantity:newQty,
        }, {onConflict:"user_id,tcgplayer_product_id,condition"});
      }
    } catch(e){
      console.error("sealed collection update failed:", e);
    }
  }, [user]);

  // Optimistically bump local state, then persist to Supabase. Calling with
  // newQty<=0 deletes the row; otherwise upserts.
  const updateQty = useCallback(async (cardId, printing, newQty)=>{
    if(!user || !cardId || !printing) return;
    const key = cardId+":"+printing;
    setCollection(c=>{
      const next = {...c};
      if(newQty<=0) delete next[key];
      else next[key] = newQty;
      return next;
    });
    try {
      if(newQty<=0){
        await sbClient.from("collection_items").delete()
          .eq("user_id", user.id).eq("card_id", cardId)
          .eq("printing", printing).eq("condition","NM");
      } else {
        await sbClient.from("collection_items").upsert({
          user_id:user.id, card_id:cardId, printing:printing, condition:"NM", quantity:newQty,
        }, {onConflict:"user_id,card_id,printing,condition"});
      }
    } catch(e){
      console.error("collection update failed:", e);
    }
  }, [user]);

  // CSV import path. Optimistically updates local state, then chunks the
  // supabase upsert so a 5000-row import doesn't blow PostgREST's body size
  // limit. The supabase-js client returns {error} rather than throwing — we
  // explicitly check it and roll back the optimistic update on any failure
  // so the UI never claims success when the server actually rejected.
  const BULK_UPSERT_CHUNK = 500;
  const bulkUpdateCollection = useCallback(async (updates) => {
    if(!user || !updates.length) return {ok:true, written:0};
    const prevCollection = collection;
    setCollection(c=>{
      const next = {...c};
      for(const {cardId, printing, qty} of updates){
        const key = cardId+":"+printing;
        if(qty<=0) delete next[key];
        else next[key] = qty;
      }
      return next;
    });
    // Dedupe by (card_id, printing) — Postgres rejects an ON CONFLICT batch
    // containing two rows that resolve to the same conflict target with
    // "cannot affect row a second time". CSVs with fuzzy-matched name
    // collisions (e.g. two source names squashing to the same card) hit
    // this. Last write wins.
    const dedup = new Map();
    for(const u of updates){
      if(u.qty <= 0) continue;
      dedup.set(u.cardId + "|" + u.printing, u);
    }
    const toUpsert = Array.from(dedup.values()).map(u => ({
      user_id:user.id, card_id:u.cardId, printing:u.printing, condition:"NM", quantity:u.qty,
    }));
    let written = 0;
    for(let i=0; i<toUpsert.length; i+=BULK_UPSERT_CHUNK){
      const chunk = toUpsert.slice(i, i+BULK_UPSERT_CHUNK);
      // .select() forces PostgREST to return the actual persisted rows.
      // Without it, RLS / trigger filtering is invisible — the client gets
      // {error:null} even when zero rows were written. We compare returned
      // count to sent count and treat any mismatch as a hard error so the
      // optimistic state doesn't lie to the user.
      const {data, error} = await sbClient
        .from("collection_items")
        .upsert(chunk, {onConflict:"user_id,card_id,printing,condition"})
        .select("card_id");
      if(error){
        console.error("bulk collection update failed:", error);
        setCollection(prevCollection);
        return {ok:false, written, error:error.message || String(error)};
      }
      const got = (data||[]).length;
      if(got !== chunk.length){
        console.error(`bulk upsert wrote ${got}/${chunk.length} rows — likely RLS or trigger filter`, {sample:chunk[0]});
        setCollection(prevCollection);
        return {ok:false, written:written+got,
          error:`Supabase only persisted ${got} of ${chunk.length} rows in a chunk — your RLS policy on collection_items is rejecting some rows silently. Check that the INSERT/UPDATE policies allow user_id = auth.uid().`};
      }
      written += got;
    }
    return {ok:true, written};
  }, [user, collection]);

  const signIn = useCallback(()=>{
    sbClient.auth.signInWithOAuth({
      provider:"google",
      options:{
        redirectTo: window.location.origin + window.location.pathname,
        // Force Google to show its account chooser every time. Without this,
        // Google silently re-authenticates with whatever account the browser
        // is already signed into — so "Sign out" → "Sign in" just lands you
        // right back in the same account.
        queryParams: {prompt: "select_account"},
      },
    });
  },[]);
  const signOut = useCallback(async ()=>{await sbClient.auth.signOut();},[]);

  const toggleTheme = useCallback(()=>{setTheme(t=>t==="dark"?"light":"dark");},[]);

  // Resolve avatar source. Priority: chosen card (if any) → Google avatar
  // (often 403s on Google's CDN once the OAuth window expires, so we let it
  // fail gracefully) → first-letter fallback handled by the render.
  const avatarCard = useMemo(() => {
    if(!avatarCardId || !raw.length) return null;
    return raw.find(r => r.card_id === avatarCardId && r.img_small) || null;
  }, [avatarCardId, raw]);
  const [googleAvatarOk, setGoogleAvatarOk] = useState(true);
  useEffect(() => { setGoogleAvatarOk(true); }, [user?.user_metadata?.avatar_url]);
  const avatarSrc = avatarCard
    ? avatarCard.img_small
    : (googleAvatarOk && user?.user_metadata?.avatar_url) || null;
  const avatarInitial = ((user?.user_metadata?.full_name || user?.email || "?")[0] || "?").toUpperCase();
  const {sets,avgs}=useMemo(()=>raw.length?processData(raw):{sets:[],avgs:{}},[raw]);

  const loadFromSupabase = useCallback(async ({force=false}={})=>{
    setErr(null);

    // 1. Show cached data instantly if available (and not forced refresh).
    const cached = force ? null : readCache();
    if(cached && cached.rows.length){
      setRaw(cached.rows);setLoaded(true);setLoading(false);
      // If still fresh, we're done. Otherwise fall through and refresh.
      if(!cached.stale) return;
    } else {
      setLoading(true);setLoadProgress({loaded:0,total:0,current:"Connecting..."});
    }

    // 2. Fetch fresh in background (or as the initial load).
    try {
      setLoadProgress({loaded:0,total:3,current:"Fetching sets"});
      // Slim columns — heavy text fields (text/flavor_text) are fetched on
      // demand when the detail modal opens. Explicit ORDER BY is REQUIRED so
      // PostgREST returns deterministic slices across parallel range requests.
      const PRICE_COLS = "tcgplayer_product_id,printing,low_price,market_price";
      // Probe whether the `inks` column has been deployed yet. Use a direct
      // fetch (not sbFetchAll — its count=exact pagination conflicts with
      // limit:1 and produces a misleading 416 that we'd interpret as "column
      // missing"). PostgREST returns 400 with code 42703 when the column
      // really doesn't exist; anything else means the column is present.
      let hasInksColumn = true;
      let hasIllustratorsColumn = true;
      let hasTier2Stats = true;
      try {
        // Probe columns in parallel — used to be sequential, which
        // added a wasted round-trip to every cold load.
        const [probe, probe2, probe3] = await Promise.all([
          fetch(SUPABASE_URL+"/rest/v1/cards?select=inks&limit=1", {headers: sbHeaders()}),
          fetch(SUPABASE_URL+"/rest/v1/cards?select=illustrators&limit=1", {headers: sbHeaders()}),
          fetch(SUPABASE_URL+"/rest/v1/cards?select=lore&limit=1", {headers: sbHeaders()}),
        ]);
        if(probe.status === 400){
          const body = await probe.text();
          if(body.includes("42703") || body.includes("does not exist")){
            hasInksColumn = false;
            console.warn("cards.inks column missing — run supabase/27_card_inks_array.sql for dual-ink support.");
          }
        }
        if(probe2.status === 400){
          const body = await probe2.text();
          if(body.includes("42703") || body.includes("does not exist")){
            hasIllustratorsColumn = false;
            console.warn("cards.illustrators column missing — run supabase/31_card_illustrators.sql + re-run scripts/load_lorcast.py to enable artist filters.");
          }
        }
        if(probe3.status === 400){
          const body = await probe3.text();
          if(body.includes("42703") || body.includes("does not exist")){
            hasTier2Stats = false;
            console.warn("cards.lore column missing — run supabase/43_card_tier2_stats.sql + scripts/patch_card_tier2.py to enable strength/willpower/lore filters.");
          }
        }
      } catch(e) {
        console.warn("column probes failed (network); assuming columns exist", e);
      }
      const baseCols = hasInksColumn
        ? "id,set_id,name,version,rarity,ink,inks,collector_number,cost,inkable,card_type,classifications,text,image_small,image_normal,image_large,tcgplayer_product_id"
        : "id,set_id,name,version,rarity,ink,collector_number,cost,inkable,card_type,classifications,text,image_small,image_normal,image_large,tcgplayer_product_id";
      let CARDS_COLS = hasIllustratorsColumn ? baseCols + ",illustrators" : baseCols;
      if(hasTier2Stats) CARDS_COLS += ",strength,willpower,lore,move_cost";
      const SEALED_COLS = "tcgplayer_product_id,set_id,product_type,name,clean_name,low_price,market_price,image_url,tcgplayer_url,printing,price_date";
      const [setsData, priceRows, cardsRows, sealedRows] = await Promise.all([
        sbFetchAll("sets",  {select:"id,name,released_at", order:"id.asc"}),
        sbFetchAll("card_prices_latest", {select:PRICE_COLS, order:"tcgplayer_product_id.asc,printing.asc"}),
        sbFetchAll("cards", {select:CARDS_COLS, order:"id.asc"}),
        // Sealed prices are independent of the cards/prices join — fetch
        // them in parallel. If the matview hasn't been deployed yet, this
        // 404s gracefully and we just get an empty array.
        sbFetchAll("sealed_prices_latest", {select:SEALED_COLS, order:"tcgplayer_product_id.asc,printing.asc"}).catch(e => {
          console.warn("sealed_prices_latest fetch failed (run supabase/16_*.sql?):", e?.message || e);
          // Soft-fall to the stale cache if we have one — better to show
          // old prices than a permanently-empty Sealed tab.
          const cached = readSealedCache();
          return (cached && cached.rows.length) ? cached.rows : [];
        }),
      ]);
      setLoadProgress({loaded:2,total:3,current:"Building view"});
      const setNameById = Object.fromEntries(setsData.map(s=>[s.id,s.name]));
      const allRows = transformSupabaseData(priceRows, cardsRows, setNameById);
      setRaw(allRows);setLoaded(true);setLoading(false);
      setSealedPrices(sealedRows);
      // released_at = LGS / prerelease date. Used by Home's box-price lookup
      // (set_id match) and by CollectionPanel to skip pre-release dates
      // when computing portfolio value over time.
      setSetsMeta(setsData);
      if(sealedRows && sealedRows.length) writeSealedCache(sealedRows);
      setLoadProgress({loaded:3,total:3,current:"Done!"});
      writeCache(allRows);
    } catch(e){
      // If we already showed cache, just log and keep that on screen.
      if(cached && cached.rows.length) console.warn("background refresh failed:", e);
      else { setErr("Supabase error: "+e.message); setLoading(false); }
    }
  },[]);

  useEffect(()=>{loadFromSupabase();},[loadFromSupabase]);

  const TABS=[["home","Home"],["screener","Screener"],["history","Price Graphing"],["market","Analytics"],["cards","Cards"],["collection","Collection"],["decks","Decks"]];

  // Render the app shell immediately. Empty views just render blank tables
  // while data is in flight; cache hits make this instantaneous after the
  // first visit.

  return html`<${TipsContext.Provider} value=${tipsEnabled}><div>
    <div class="top-nav">
      <button class="tabs-logo-btn" onClick=${()=>onTabClick("home")}
        title="Home" aria-label="Home">
        <img src="Logos/packs-ink-logo.png" alt="packs.ink"
          height="26" style=${{height:26,width:"auto",display:"block",pointerEvents:"none"}}/>
      </button>
      <div class="tabs">
        ${TABS.map(([v,l])=>html`<button key=${v} onClick=${()=>onTabClick(v)} class=${view===v?"active":""} style=${{padding:"5px 11px",fontSize:12}}>${l}</button>`)}
        <button class=${"tab-help"+(view==="faq"?" active":"")} onClick=${()=>onTabClick("faq")}
          title="How it works" aria-label="How it works">?</button>
        ${err&&html`<span style=${{fontSize:11,color:"var(--red)",marginLeft:8}}>${err} <button onClick=${()=>loadFromSupabase({force:true})} style=${{fontSize:11,padding:"2px 8px",marginLeft:6}}>retry</button></span>`}
      </div>
      <div class="top-nav-right" style=${{display:"flex",gap:6,alignItems:"center"}}>
        <div ref=${settingsRef} style=${{position:"relative",display:"inline-flex"}}>
          ${user
            ? html`<button class="profile-btn" onClick=${()=>setSettingsOpen(o=>!o)}
                title="Account & settings" aria-expanded=${settingsOpen}>
                ${avatarSrc
                  ? html`<img src=${avatarSrc} alt="" onError=${()=>setGoogleAvatarOk(false)}
                      style=${{width:20,height:20,borderRadius:"50%",objectFit:"cover",objectPosition:"top",background:"var(--bg-surface)"}}/>`
                  : html`<span style=${{width:20,height:20,borderRadius:"50%",background:"var(--accent-glow)",color:"var(--accent)",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>${avatarInitial}</span>`}
                ${profile?.display_name || "you"}
              </button>`
            : html`<button class="theme-toggle" onClick=${()=>setSettingsOpen(o=>!o)}
                title="Settings" aria-label="Settings" aria-expanded=${settingsOpen}>${"\u2699"}</button>`}
          ${settingsOpen && html`<div class="settings-popover">
            ${user && html`<div class="avatar-row">
              ${avatarSrc
                ? html`<img src=${avatarSrc} alt=""
                    style=${{width:44,height:44,borderRadius:"50%",objectFit:"cover",objectPosition:"top",background:"var(--bg-surface)"}}/>`
                : html`<span style=${{width:44,height:44,borderRadius:"50%",background:"var(--accent-glow)",color:"var(--accent)",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700}}>${avatarInitial}</span>`}
              <div class="avatar-row-info">
                <div class="avatar-row-name">${profile?.display_name || "Set up your display name"}</div>
                ${user.email && html`<div class="avatar-row-email">${user.email}</div>`}
              </div>
            </div>`}
            <div class="settings-section-title">${user ? "Profile" : "Settings"}</div>
            ${user && html`<div class="settings-row-stack">
              <${DisplayNameEditor} profile=${profile} onSave=${saveDisplayName}/>
              <button class="settings-action" onClick=${()=>{ setAvatarPickerOpen(true); setSettingsOpen(false); }}>
                ${avatarCardId ? "Change profile card" : "Choose a profile card"}
              </button>
              ${avatarCardId && html`<button class="settings-action link" onClick=${()=>setAvatarCardId(null)}>Reset to default avatar</button>`}
            </div>`}
            <div class="settings-section-title" style=${{marginTop:user?10:0}}>Preferences</div>
            <label class="settings-row" title="When off, hover explanations across the site are suppressed.">
              <input type="checkbox" checked=${tipsEnabled}
                onChange=${e=>setTipsEnabled(e.target.checked)}/>
              <span>Show tooltips</span>
            </label>
            <div class="settings-divider"></div>
            ${user
              ? html`<button class="settings-action danger"
                  onClick=${()=>{ setSettingsOpen(false); signOut(); }}>Sign out</button>`
              : html`<button class="settings-action primary"
                  onClick=${()=>{ setSettingsOpen(false); signIn(); }}>Sign in with Google</button>`}
          </div>`}
        </div>
        ${!isStandalone && (isIOS || isAndroid) && html`<button class="theme-toggle" onClick=${()=>setInstallHelpOpen(true)}
          title="Install Packs.Ink as an app" aria-label="Install app">\uD83D\uDCF2</button>`}
        <button class="theme-toggle" onClick=${toggleTheme} title=${theme==="dark"?"Switch to light":"Switch to dark"}>
          ${theme==="dark"?"\u2600":"\uD83C\uDF19"}
        </button>
      </div>
    </div>
    ${installHelpOpen && html`<${InstallHelpModal}
      installEvent=${installEvent}
      clearInstallEvent=${()=>setInstallEvent(null)}
      isIOS=${isIOS} isAndroid=${isAndroid}
      onClose=${()=>setInstallHelpOpen(false)}/>`}
    ${loading && html`<div class="loading-status">
      ${loaded ? "Refreshing data\u2026" : (loadProgress.current || "Loading\u2026")}
    </div>`}
    ${avatarPickerOpen && html`<${AvatarPicker} raw=${raw}
      onPick=${cid=>{ setAvatarCardId(cid); setAvatarPickerOpen(false); }}
      onClose=${()=>setAvatarPickerOpen(false)}/>`}
    ${showNamePrompt && user && html`<${NamePromptModal} onSave=${saveDisplayName}/>`}
    ${view==="home"&&html`<${HomeView} raw=${raw} sets=${sets} avgs=${avgs} theme=${theme}
      user=${user} collection=${collection} collectionLoading=${collectionLoading}
      sealedPrices=${sealedPrices} sealedCollection=${sealedCollection} setsMeta=${setsMeta}
      updateQty=${updateQty} onSignIn=${signIn}
      openDeckById=${openDeckById} openTournamentById=${openTournamentById}
      openTournamentsList=${openTournamentsList}
      openView=${openView} openDecksSection=${openDecksSection}
      openCardsWithSearch=${openCardsWithSearch}
      openScreenerWithFilter=${openScreenerWithFilter}/>`}
    ${view==="cards"&&html`<${CardsView} raw=${raw} sets=${sets} theme=${theme}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${signIn}
      openDeckById=${openDeckById}
      incomingSearch=${incomingCardsSearch}
      incomingOpenCardId=${incomingCardsOpenId}
      onConsumedIncomingCardsSearch=${() => { setIncomingCardsSearch(null); setIncomingCardsOpenId(null); }}/>`}
    ${view==="collection"&&html`<${CollectionView} raw=${raw}
      user=${viewedCollectionId ? (viewedCollectionData?.profile || null) : user}
      collection=${viewedCollectionId ? (viewedCollectionData?.rawMap || {}) : collection}
      collectionLoading=${viewedCollectionId ? !viewedCollectionData : collectionLoading}
      updateQty=${viewedCollectionId ? (()=>{}) : updateQty}
      bulkUpdateCollection=${viewedCollectionId ? null : bulkUpdateCollection}
      sealedPrices=${sealedPrices}
      sealedCollection=${viewedCollectionId ? (viewedCollectionData?.sealedMap || {}) : sealedCollection}
      updateSealedQty=${viewedCollectionId ? (()=>{}) : updateSealedQty}
      tabClickNonce=${tabClickNonce}
      onSignIn=${signIn} theme=${theme}
      currentUser=${user}
      ownerProfile=${viewedCollectionId ? null : profile}
      saveCollectionVisibility=${saveCollectionVisibility}
      regenerateCollectionShareToken=${regenerateCollectionShareToken}
      viewerOwnCollection=${viewedCollectionId ? collection : null}
      viewerOwnSealedCollection=${viewedCollectionId ? sealedCollection : null}
      viewerContext=${viewedCollectionId ? {
        ownerId: viewedCollectionId,
        ownerToken: viewedCollectionToken,
        data: viewedCollectionData,
        error: viewedCollectionError,
        onClose: closeViewedCollection,
      } : null}/>`}
    ${view==="decks"&&html`<${DecksView} raw=${raw} user=${user}
      collection=${collection} tabClickNonce=${tabClickNonce}
      incomingDeckId=${incomingDeckId}
      onConsumedIncomingDeckId=${() => setIncomingDeckId(null)}
      incomingShareToken=${incomingShareToken}
      onConsumedIncomingShareToken=${() => setIncomingShareToken(null)}
      incomingUserId=${incomingUserId}
      onConsumedIncomingUserId=${() => setIncomingUserId(null)}
      incomingTournamentId=${incomingTournamentId}
      onConsumedIncomingTournamentId=${() => setIncomingTournamentId(null)}
      ownerDisplayName=${profile?.display_name || null}
      openCollectionById=${openCollectionById}
      openDeckById=${openDeckById}
      incomingDeckSection=${incomingDeckSection}
      onConsumedIncomingDeckSection=${() => setIncomingDeckSection(null)}
      onSignIn=${signIn} theme=${theme}/>`}
    ${view==="history"&&html`<${HistoryView} raw=${raw} sets=${sets} theme=${theme}
      sealedPrices=${sealedPrices} setsMeta=${setsMeta}
      historyTarget=${historyTarget}
      incomingCompareCards=${incomingCompareCards}
      onConsumedIncomingCompareCards=${() => setIncomingCompareCards(null)}/>`}
    ${view==="market"&&html`<${MarketView} raw=${raw} sets=${sets} avgs=${avgs} theme=${theme}
      nc=${nc} setNc=${setNc} ne=${ne} setNe=${setNe}
      excludeEnchanted=${excludeEnchanted} setExcludeEnchanted=${setExcludeEnchanted}
      excludeIconic=${excludeIconic} setExcludeIconic=${setExcludeIconic}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${signIn}
      sealedPrices=${sealedPrices}
      openSetHistory=${openSetHistory}/>`}
    ${view==="screener"&&html`<${PriceDatabase} raw=${raw} sets=${sets} theme=${theme}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${signIn}
      onCompareCards=${startCompareCards}
      incomingScreenerView=${incomingScreenerView}
      onConsumedIncomingScreenerView=${() => setIncomingScreenerView(null)}/>`}
    ${view==="faq"&&html`<${FAQView}/>`}
    <${Footer} lastEtlDate=${lastEtlDate} lastRawPriceDate=${lastRawPriceDate}/>
  </div><//>`;
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e};}
  render(){
    if(this.state.error) return React.createElement('div',{style:{padding:'2rem',maxWidth:600,margin:'2rem auto',color:'var(--text)'}},
      React.createElement('h2',{style:{color:'var(--red)',fontSize:16,fontFamily:'Cinzel,serif'}},'Something went wrong'),
      React.createElement('pre',{style:{fontSize:12,color:'var(--text-muted)',whiteSpace:'pre-wrap',marginTop:8}},this.state.error.toString()),
      React.createElement('button',{onClick:()=>this.setState({error:null}),style:{marginTop:12,padding:'8px 16px',cursor:'pointer',background:'transparent',border:'1px solid var(--btn-border)',color:'var(--text)',borderRadius:6}},'Retry'));
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${ErrorBoundary}><${App}/><//>`);
</script>
</body>
</html>
