        <strong>${bulkUndo.summary.cardsTouched}</strong>
        slot${bulkUndo.summary.cardsTouched===1?"":"s"}.
      </span>
      <button class="setdet-undo-btn" disabled=${bulkUndoBusy}
        onClick=${handleBulkUndo}>${bulkUndoBusy ? "Undoing…" : "↶ Undo"}</button>
      <button class="setdet-undo-close" onClick=${()=>setBulkUndo(null)}
        title="Dismiss" aria-label="Dismiss">×</button>
    </div>`}
  </div>`;
};

// Modal launched from CollectionSetDetail. Lets the user bulk-add a master
// set, playset, or custom-count of every card matching the chosen rarities
// in the current set, in foil / non-foil / both. Builds an `updates` list
// that's piped through bulkUpdateCollection in one round-trip.
const BulkAddByRarityModal = ({groups, setRarities, collection, bulkUpdateCollection, onApplied, onClose}) => {
  const [copyCount, setCopyCount] = useState(1);          // 1 = master, 4 = playset
  const [foilMode, setFoilMode] = useState("normal");     // "normal" | "foil" | "both"
  const [picked, setPicked] = useState(() => new Set()); // nothing checked by default
  const [mode, setMode] = useState("set");                // "set" = set quantity, "add" = add on top
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  // Compute the planned updates given current options — drives the preview.
  const plan = useMemo(() => {
    const updates = [];
    let cardsTouched = 0, totalCopies = 0;
    for(const g of groups){
      if(!picked.has(g.Rarity)) continue;
      const isChase = ["Enchanted","Iconic","Epic"].includes(g.Rarity);
      // Chase cards only exist as Holofoil — apply regardless of foilMode.
      // Non-chase respects the toggle.
      const printingsToTouch = [];
      if(isChase){
        if(g.foil) printingsToTouch.push(g.foil);
      } else {
        if((foilMode === "normal" || foilMode === "both") && g.normal) printingsToTouch.push(g.normal);
        if((foilMode === "foil"   || foilMode === "both") && g.foil)   printingsToTouch.push(g.foil);
      }
      for(const p of printingsToTouch){
        const key = g.card_id + ":" + p.tcg_printing;
        const cur = collection[key] || 0;
        const target = mode === "add" ? cur + copyCount : Math.max(copyCount, cur);
        if(target === cur) continue;
        updates.push({cardId: g.card_id, printing: p.tcg_printing, qty: target});
        cardsTouched++;
        totalCopies += (target - cur);
      }
    }
    return {updates, cardsTouched, totalCopies};
  }, [groups, picked, foilMode, copyCount, mode, collection]);

  const apply = useCallback(async () => {
    if(!plan.updates.length){ onClose(); return; }
    setBusy(true); setError(null);
    // Snapshot prior qty for every slot we're about to touch so the parent
    // can offer Undo. Map: "cardId:printing" -> prior qty (0 if unowned).
    const prior = plan.updates.map(u => ({
      cardId: u.cardId,
      printing: u.printing,
      qty: collection[u.cardId + ":" + u.printing] || 0,
    }));
    try {
      const res = await bulkUpdateCollection(plan.updates);
      if(!res || !res.ok){
        setError("Save failed: " + (res?.error || "unknown error"));
        setBusy(false);
        return;
      }
      // Hand the snapshot up so the parent can fire an Undo toast.
      if(onApplied) onApplied({prior, summary: plan});
      onClose();
    } catch(e) {
      setError("Save failed: " + (e?.message || e));
      setBusy(false);
    }
  }, [plan, bulkUpdateCollection, onApplied, onClose, collection]);

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:540}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Bulk add by rarity</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18}}>
        <p class="muted" style=${{fontSize:12,margin:"0 0 14px",lineHeight:1.5}}>
          Adds copies for every card matching the chosen rarities in this set.
          <strong>Set quantity</strong> brings each slot up to the chosen count (won't touch slots that already have more).
          <strong>Add on top</strong> increments existing quantities.
          Chase rarities (Enchanted / Iconic / Epic) always count as foil — the foil toggle only affects the rest.
        </p>
        <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Quantity per card</div>
            <div class="seg-toggle">
              <button class=${copyCount===1?"active":""} onClick=${()=>setCopyCount(1)}>Master ×1</button>
              <button class=${copyCount===4?"active":""} onClick=${()=>setCopyCount(4)}>Playset ×4</button>
            </div>
            <div style=${{marginTop:6,display:"flex",gap:6,alignItems:"center",fontSize:11}}>
              <span class="muted">or custom:</span>
              <input type="number" min="1" max="99" value=${copyCount}
                onChange=${e=>setCopyCount(Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)))}
                style=${{width:60,padding:"4px 7px",border:"1px solid var(--btn-border)",borderRadius:4,
                  background:"var(--bg)",color:"var(--text)",fontSize:12}}/>
            </div>
          </div>
          <div>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Printing</div>
            <div class="seg-toggle">
              <button class=${foilMode==="normal"?"active":""} onClick=${()=>setFoilMode("normal")}>Non-foil</button>
              <button class=${foilMode==="foil"?"active":""} onClick=${()=>setFoilMode("foil")}>Foil</button>
              <button class=${foilMode==="both"?"active":""} onClick=${()=>setFoilMode("both")}>Both</button>
            </div>
          </div>
        </div>
        <div style=${{marginBottom:12}}>
          <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Rarities</div>
          <div class="cards-chipgroup">
            ${setRarities.map(r => html`<button key=${r}
              class=${"chip "+(picked.has(r)?"active":"")}
              onClick=${()=>setPicked(prev=>{ const n=new Set(prev); n.has(r)?n.delete(r):n.add(r); return n; })}>${r}</button>`)}
            ${picked.size > 0 && html`<button class="chip" onClick=${()=>setPicked(new Set())}>Clear</button>`}
            ${picked.size < setRarities.length && html`<button class="chip" onClick=${()=>setPicked(new Set(setRarities))}>All</button>`}
          </div>
        </div>
        <div style=${{marginBottom:14}}>
          <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Mode</div>
          <div class="seg-toggle">
            <button class=${mode==="set"?"active":""} onClick=${()=>setMode("set")}
              title="Bring each matching slot UP TO the chosen count. Slots that already have more are left alone.">
              Set to ×${copyCount}
            </button>
            <button class=${mode==="add"?"active":""} onClick=${()=>setMode("add")}
              title="Add the chosen count on TOP of whatever the user already has.">
              Add ×${copyCount}
            </button>
          </div>
        </div>
        <div style=${{padding:"10px 12px",background:"var(--accent-glow)",border:"1px solid var(--border-accent)",
          borderRadius:6,fontSize:12,marginBottom:14,lineHeight:1.5,color:"var(--accent)"}}>
          <strong>Plan:</strong> ${plan.cardsTouched === 0
            ? html`<span style=${{color:"var(--text-muted)"}}>No changes — every matching slot already meets the target.</span>`
            : html`Update <strong>${plan.cardsTouched}</strong> slot${plan.cardsTouched===1?"":"s"} ·
                  <strong>+${plan.totalCopies}</strong> ${plan.totalCopies===1?"copy":"copies"} to your collection.`}
        </div>
        ${error && html`<div style=${{padding:"8px 0",color:"var(--red)",fontSize:12}}>${error}</div>`}
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick=${onClose} disabled=${busy}>Cancel</button>
          <button class="active" onClick=${apply} disabled=${busy || plan.cardsTouched===0}
            style=${{padding:"7px 16px",fontSize:13}}>
            ${busy ? "Saving…" : "Apply"}
          </button>
        </div>
      </div>
    </div>
  </div>`;
};

// ── Price History view ──────────────────────────────────────────────────
// Two modes: "card" lets you pick any card and see Low price over time;
// "set" charts the set's expected value over time (uses rarity_avg_daily
// SQL view added in supabase/06_rarity_avg.sql).
// Earliest date covered by the TCGCSV archive backfill. Anything before
// this isn't in our prices_daily table — Sets 1 & 2 released before then,
// so their charts can only show data from this date onwards.
const EARLIEST_DATA_DATE = "2024-02-08";

// Format an ISO date string (YYYY-MM-DD) for display without letting the
// viewer's timezone shift it back a day. Date.parse treats "2023-11-17" as
// midnight UTC; toLocaleDateString in a -8 timezone would then show Nov 16.
const fmtIsoDate = (iso) => {
  if(!iso) return "";
  return new Date(iso).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});
};
// Relative time for "this deck was updated X ago". `iso` is an ISO 8601
// timestamp with TZ offset (what timestamptz columns serialize to). The
// Date constructor parses the offset and then toLocaleString uses the
// browser's local TZ, so an 8am Tokyo update reads as "yesterday" /
// "6pm Thursday" automatically for a Chicago viewer. No manual TZ math.
const relativeTime = (iso) => {
  if(!iso) return "";
  const then = new Date(iso).getTime();
  if(!Number.isFinite(then)) return "";
  const diff = Math.max(0, Date.now() - then);
  const sec = Math.floor(diff / 1000);
  if(sec < 60)              return "just now";
  const min = Math.floor(sec / 60);
  if(min < 60)              return min + "m ago";
  const hr = Math.floor(min / 60);
  if(hr < 24)               return hr + "h ago";
  const day = Math.floor(hr / 24);
  if(day < 7)               return day + "d ago";
  const wk = Math.floor(day / 7);
  if(wk < 5)                return wk + "w ago";
  const mo = Math.floor(day / 30);
  if(mo < 12)               return mo + "mo ago";
  const yr = Math.floor(day / 365);
  return yr + "y ago";
};
// Absolute time in the viewer's local timezone — used as a hover tooltip
// so the relative time stays scannable. Format: "Jun 12, 2024, 3:42 PM".
const absoluteLocalTime = (iso) => {
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  try {
    return d.toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"});
  } catch {
    return d.toString();
  }
};
const setDataPartial = (setKey) => {
  const lgs = SET_RELEASE_DATES[setKey]?.lgs;
  return !!lgs && Date.parse(lgs) < Date.parse(EARLIEST_DATA_DATE);
};

// Known Lorcana set release dates (from official Ravensburger schedule).
// LGS = Local Game Store release (in-store availability, often called the
// "early release"). Retail = wide retail availability (~2 weeks later).
// Used to draw markers on the Set EV chart so the pre-order / hype curve
// vs. supply-rich retail period is visible.
const SET_RELEASE_DATES = {
  "The First Chapter":     {lgs:"2023-08-18", retail:"2023-09-01"},
  "Rise of the Floodborn": {lgs:"2023-11-17", retail:"2023-12-01"},
  "Into the Inklands":     {lgs:"2024-02-23", retail:"2024-03-08"},
  "Ursula's Return":       {lgs:"2024-05-17", retail:"2024-05-31"},
  "Shimmering Skies":      {lgs:"2024-08-09", retail:"2024-08-23"},
  "Azurite Sea":           {lgs:"2024-11-15", retail:"2024-11-29"},
  "Archazia's Island":     {lgs:"2025-03-07", retail:"2025-03-21"},
  "Reign of Jafar":        {lgs:"2025-05-30", retail:"2025-06-06"},
  "Fabled":                {lgs:"2025-08-29", retail:"2025-09-05"},
  "Whispers in the Well":  {lgs:"2025-11-07", retail:"2025-11-14"},
  "Winterspell":           {lgs:"2026-02-13", retail:"2026-02-20"},
  "Wilds Unknown":         {lgs:"2026-05-08", retail:"2026-05-15"},
};

// "all" = since release; others are rolling windows ending today.
// "custom" pairs with a date string from the date picker.
const RANGE_OPTIONS = [
  ["all",    "Since Release"],
  ["1y",     "1 Year"],
  ["6m",     "6 Months"],
  ["3m",     "3 Months"],
  ["1m",     "1 Month"],
  ["1w",     "1 Week"],
  ["custom", "Custom"],
];
const rangeStartMs = (key, customStart) => {
  if(key === "all") return null;
  if(key === "custom") return customStart ? Date.parse(customStart) : null;
  const now = Date.now();
  const day = 24*60*60*1000;
  switch(key){
    case "1w": return now - 7*day;
    case "1m": return now - 31*day;
    case "3m": return now - 93*day;
    case "6m": return now - 186*day;
    case "1y": return now - 366*day;
    default: return null;
  }
};

// Resolve the effective "start" timestamp from range/custom + preorder-hide.
const computeChartStartMs = (rangeKey, customStart, hidePreorders, setKey) => {
  const rangeStart = rangeStartMs(rangeKey, customStart);
  const lgsStr = hidePreorders && setKey ? SET_RELEASE_DATES[setKey]?.lgs : null;
  const lgsStart = lgsStr ? Date.parse(lgsStr) : null;
  if(rangeStart != null && lgsStart != null) return Math.max(rangeStart, lgsStart);
  return rangeStart != null ? rangeStart : lgsStart;
};
const clipSeriesFrom = (series, startMs) => {
  if(startMs == null) return series;
  return series.map(s => ({...s, data: (s.data||[]).filter(p => p.x >= startMs)}));
};

const HistoryView = ({raw, sets, theme, historyTarget, sealedPrices, setsMeta, incomingCompareCards, onConsumedIncomingCompareCards}) => {
  const tips = useContext(TipsContext);
  const [mode, setMode] = useState("card");
  // Sealed mode state — parallel to selectedGroup/cardQuery for cards.
  const [sealedSearch, setSealedSearch] = useState("");
  const [selectedSealedPid, setSelectedSealedPid] = useState(null);
  const [sealedHist, setSealedHist] = useState({rows:null, loading:false});
  // Graded mode state — picker options come from graded_prices_latest joined
  // with raw for card metadata. Each option is a (pid, grader, grade) triple.
  const [gradedSearch, setGradedSearch] = useState("");
  const [gradedOptions, setGradedOptions] = useState(null);
  const [gradedGraderFilter, setGradedGraderFilter] = useState(() => new Set());
  const [gradedGradeFilter,  setGradedGradeFilter]  = useState(() => new Set());
  // Shared filter for every Price Graphing picker mode. Same shape as the
  // Cards-tab filter so we can reuse FilterDrawer + matchesCardFilter.
  // Persisted so toggling tabs doesn't lose what the user set up.
  const [historyFilter, setHistoryFilter] = useState(() => emptyFilter());
  const [historyFilterOpen, setHistoryFilterOpen] = useState(false);
  const [cardQuery, setCardQuery] = useState("");
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [history, setHistory] = useState({normal:null, foil:null, loading:false});
  const [setName, setSetNameLocal] = useState("");
  // Multi-card compare: list of {card_id, productId, printing, name} plus
  // the fetched series map (card_id -> [{date_ms, low, market}]). The
  // Screener pushes a list via incomingCompareCards on mount; we fetch
  // each in parallel and render LineChart with one series per card.
  const [compareCards, setCompareCards] = useState([]);
  const [compareSeries, setCompareSeries] = useState({});
  const [compareLoading, setCompareLoading] = useState(false);
  // Consume cross-view nav payload from App. Bumped nonce ensures re-arriving
  // at the same set still re-applies (e.g. user clicks the same EV row twice).
  useEffect(()=>{
    if(historyTarget && historyTarget.setName){
      setMode("set");
      setSetNameLocal(historyTarget.setName);
      const sample = raw.find(r => r.Set === historyTarget.setName);
      const sid = sample && sample.set_id;
      if(sid){
        const item = {
          kind: "set",
          card_id: "set-" + sid,
          productId: null,
          printing: null,
          setId: sid,
          setName: historyTarget.setName,
          name: historyTarget.setName + " — EV / Box",
          sub: "Set EV",
          image: null,
        };
        setCompareCards(prev => prev.some(p => p.card_id === item.card_id) ? prev : [...prev, item]);
      }
    }
  }, [historyTarget, raw]);
  // Consume the Screener -> Price Graphing handoff. Switch to compare mode,
  // load the card list, and clear the App-level state so navigating back
  // and forth doesn't re-trigger.
  useEffect(()=>{
    if(!incomingCompareCards || !incomingCompareCards.length) return;
    setMode("card");
    setCompareCards(incomingCompareCards);
    setCompareSeries({});
    onConsumedIncomingCompareCards && onConsumedIncomingCompareCards();
  }, [incomingCompareCards, onConsumedIncomingCompareCards]);
  // Prerelease guard: a card's price history is meaningless before its set's
  // street date — TCGPlayer's pre-release listings sit 10-20x above eventual
  // floors. Build a (tcgplayer_product_id → earliest-shown-date) map keyed off
  // setsMeta.released_at + 1 day, MAINLINE_SETS only (promos / D23 / Challenge
  // don't have the spike pattern). Mirrors the collection-value chart guard.
  const productEarliestDate = useMemo(() => {
    if(!setsMeta || !setsMeta.length || !raw || !raw.length) return {};
    const setIdToFloor = {};
    for(const s of setsMeta){
      if(!s.released_at || !MAINLINE_SETS.includes(s.name)) continue;
      const d = new Date(s.released_at + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + 1);
      setIdToFloor[s.id] = d.toISOString().slice(0, 10);
    }
    const m = {};
    for(const r of raw){
      const pid = r?.tcgplayer_product_id;
      const floor = setIdToFloor[r?.set_id];
      if(pid != null && floor) m[pid] = floor;
    }
    return m;
  }, [setsMeta, raw]);

  // Fetch each graphed product's history in parallel. Only fetch items whose
  // history we don't already have cached in compareSeries — this avoids
  // re-fetching the whole list every time the user checks one more box.
  // Graded items go to graded_prices_daily; everything else (cards/sealed)
  // goes to fetchCardHistory.
  useEffect(()=>{
    if(!compareCards.length) return;
    const missing = compareCards.filter(c => c.kind !== "set" && !compareSeries[c.card_id]);
    if(!missing.length) return;
    let cancelled = false;
    setCompareLoading(true);
    const tasks = missing.map(c => {
      if(c.kind === "graded"){
        // Pull every snapshot for this (pid, grader, grade) from graded_prices_daily.
        return sbFetchAll("graded_prices_daily", {
          select: "date,ebay_avg_1d,ebay_avg_7d,ebay_avg_30d,ebay_low_price,ebay_high_price",
          tcgplayer_product_id: "eq." + c.productId,
          grader: "eq." + c.grader,
          grade:  "eq." + c.grade,
          order: "date.asc",
        })
        .then(rows => ({id: c.card_id, rows, kind: "graded"}))
        .catch(() => ({id: c.card_id, rows: [], kind: "graded"}));
      }
      return fetchCardHistory(c.productId, c.printing)
        .then(rows => ({id: c.card_id, rows, kind: c.kind}))
        .catch(() => ({id: c.card_id, rows: [], kind: c.kind}));
    });
    Promise.all(tasks).then(results => {
      if(cancelled) return;
      setCompareSeries(prev => {
        const next = {...prev};
        for(const {id, rows, kind} of results){
          if(kind === "graded"){
            next[id] = (rows || []).map(r => ({
              x: new Date(r.date + "T00:00:00Z").getTime(),
              // Graded items don't have raw NM Low/Market — map the eBay
              // sold avg to both "low" and "market" so the same render
              // path works regardless of the showLow / showMarket toggle.
              low: r.ebay_avg_1d == null ? null : +r.ebay_avg_1d,
              market: r.ebay_avg_30d == null ? null : +r.ebay_avg_30d,
            }));
          } else {
            // Drop pre-release rows for the card's set (TCGPlayer pre-release
            // prices sit 10-20x the eventual floor; including them spikes the
            // very left edge of the chart). productEarliestDate is keyed by
            // pid, so look up via the source card item.
            const cardItem = compareCards.find(p => p.card_id === id);
            const floor = cardItem ? productEarliestDate[cardItem.productId] : null;
            next[id] = (rows || []).filter(r => !floor || r.date >= floor).map(r => ({
              x: new Date(r.date).getTime(),
              low: r.low_price == null ? null : +r.low_price,
              market: r.market_price == null ? null : +r.market_price,
            }));
          }
        }
        return next;
      });
      setCompareLoading(false);
    });
    return () => { cancelled = true; };
  }, [compareCards, productEarliestDate]);

  // Fetch graded picker options lazily — only when the user first opens
  // the By Graded tab. Keeps the Price Graphing initial load fast for
  // users who never touch graded.
  useEffect(() => {
    if(mode !== "graded" || gradedOptions != null) return;
    let cancelled = false;
    sbFetchAll("graded_prices_latest", {
      select: "tcgplayer_product_id,grader,grade,ebay_avg_7d,ebay_avg_1d,ebay_avg_30d",
      order: "ebay_avg_30d.desc.nullslast",
    }).then(rows => {
      if(cancelled) return;
      // Build a pid -> raw row index for quick metadata join.
      const byPid = new Map();
      for(const r of (raw || [])){
        if(r.tcgplayer_product_id != null && !byPid.has(r.tcgplayer_product_id)){
          byPid.set(r.tcgplayer_product_id, r);
        }
      }
      const out = [];
      for(const r of (rows || [])){
        const meta = byPid.get(r.tcgplayer_product_id);
        if(!meta) continue;
        out.push({...r, _meta: meta});
      }
      setGradedOptions(out);
    }).catch(() => { if(!cancelled) setGradedOptions([]); });
    return () => { cancelled = true; };
  }, [mode, raw, gradedOptions]);
  // Cache of rarity_avg_daily rows per set_id for set-kind compareCards.
  // Kept separate from compareSeries because EV needs to be recomputed at
  // render time when noPenny / noChase toggles change.
  const [setEvCache, setSetEvCache] = useState({});

  // Fetch raw rarity_avg_daily rows for any set items in compareCards we
  // don't already have. Mirrors the per-card history fetch — incremental.
  useEffect(()=>{
    if(!compareCards.length) return;
    const needed = compareCards.filter(c => c.kind === "set" && !setEvCache[c.setId]);
    if(!needed.length) return;
    let cancelled = false;
    setCompareLoading(true);
    const tasks = needed.map(c =>
      sbFetchAll("rarity_avg_daily", {
        select: "date,rarity,printing,avg_low,avg_market,avg_low_nc,avg_market_nc",
        set_id: "eq." + c.setId,
        order: "date.asc",
      })
        .then(rows => ({setId: c.setId, rows}))
        .catch(() => ({setId: c.setId, rows: []}))
    );
    Promise.all(tasks).then(results => {
      if(cancelled) return;
      setSetEvCache(prev => {
        const next = {...prev};
        for(const {setId, rows} of results) next[setId] = rows;
        return next;
      });
      setCompareLoading(false);
    });
    return () => { cancelled = true; };
  }, [compareCards]);

  // Compute EV time-series from raw rarity_avg_daily rows for a given set,
  // using the current noPenny / noChase toggles. Returns {low, market} where
  // each is [{x, y}].
  const computeSetEv = useCallback((rows, setNameForSet, opts) => {
    const {noPenny, noChase} = opts;
    if(!rows || !rows.length) return {low: [], market: []};
    const pull = getPull(setNameForSet);
    const evForField = (field) => {
      const byDate = {};
      for(const r of rows){
        if(!byDate[r.date]) byDate[r.date] = {};
        const key = getRarKey(r.rarity, r.printing);
        if(!key) continue;
        const v = r[field] != null ? parseFloat(r[field]) : null;
        if(v == null) continue;
        byDate[r.date][key] = v;
      }
      return Object.keys(byDate).sort().map(date => {
        const avgs = byDate[date];
        let ev = 0;
        for(const r of RARS){
          if(noChase && NO_ENCH.has(r)) continue;
          const rate = pull[r];
          const avg = avgs[r];
          if(avg != null && rate != null) ev += avg * rate;
        }
        return {x: Date.parse(date), y: ev};
      });
    };
    return {
      low: evForField(noPenny ? "avg_low_nc" : "avg_low"),
      market: evForField(noPenny ? "avg_market_nc" : "avg_market"),
    };
  }, []);

  // set_id ↔ set_name lookup (from raw cards), used by buildSetCompareItem.
  const setIdByName = useMemo(()=>{
    const m = {};
    for(const r of raw){ if(r.Set && r.set_id && !m[r.Set]) m[r.Set] = r.set_id; }
    return m;
  }, [raw]);

  const buildSetCompareItem = useCallback((setNameForItem) => {
    const sid = setIdByName[setNameForItem];
    if(!sid) return null;
    return {
      kind: "set",
      card_id: "set-" + sid,
      productId: null,
      printing: null,
      setId: sid,
      setName: setNameForItem,
      name: setNameForItem + " — EV / Box",
      sub: "Set EV",
      image: null,
    };
  }, [setIdByName]);

  // Distinct colors for the multi-line chart. Stable mapping by index.
  const COMPARE_COLORS = ["#1d8d4a","#7e54c4","#c64c5a","#4d83bf","#d4a93b","#0e6b6b","#787e88","#e07c2a"];
  const [setEv, setSetEv] = useState({rows:null, loading:false, error:null});
  // Low / Market checkbox state — shared across card mode and set EV mode.
  // Default = Low only. Toggle Market to add it as a dashed series.
  const [showLow, setShowLow] = useState(true);
  const [showMarket, setShowMarket] = useState(false);
  const [setSearch, setSetSearch] = useState("");
  const [rangeKey, setRangeKey] = useState("all");
  const [customStart, setCustomStart] = useState(""); // YYYY-MM-DD when rangeKey="custom"
  const [hidePreorders, setHidePreorders] = useState(() => {
    try { return localStorage.getItem("packsink:history:hidePreorders") !== "0"; }
    catch { return true; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:history:hidePreorders", hidePreorders ? "1" : "0"); } catch {}
  }, [hidePreorders]);
  // EV toggles (only meaningful in set EV mode)
  const [noChase, setNoChase] = useState(false);   // exclude Enchanted + Iconic
  const [noPenny, setNoPenny] = useState(false);   // <$1 → $0 (uses avg_low_nc)

  // De-duplicate cards by card_id, keep one representative row per card
  const cardOptions = useMemo(()=>{
    const seen = new Map();
    for(const r of raw){
      if(!r.card_id) continue;
      if(!seen.has(r.card_id)) seen.set(r.card_id, r);
    }
    return Array.from(seen.values());
  }, [raw]);

  // Memos consumed by the FilterDrawer.
  const histSetsByGroup = useMemo(() => groupSetsForFilter(raw), [raw]);
  const histIllustrators = useMemo(() => {
    const s = new Set();
    for(const r of raw){
      const ills = r.illustrators;
      if(!Array.isArray(ills)) continue;
      for(const n of ills){ if(n) s.add(n); }
    }
    return Array.from(s).sort((a,b) => a.localeCompare(b));
  }, [raw]);
  const histActiveCount = countActiveFilters(historyFilter);
  // Predicate: does the underlying card row pass the drawer filter?
  // Reused by every picker mode (card, graded, set EV by set membership).
  const cardPassesHistoryFilter = useCallback((c) => {
    if(!c) return false;
    return matchesCardFilter(c, historyFilter, null);
  }, [historyFilter]);

  // Smart-search filter: when the input is empty we show ALL cards grouped
  // by set (default mode); when non-empty we filter using parseSearchQuery
  // and show a flat list ranked by relevance.
  const parsedQuery = useMemo(()=>parseSearchQuery(cardQuery||""), [cardQuery]);
  const cardMatches = (c, p) => {
    if(p.filters.ink && c.ink !== p.filters.ink) return false;
    if(p.filters.rarity && c.Rarity !== p.filters.rarity) return false;
    if(p.filters.set && c.Set !== p.filters.set) return false;
    const _cmp = (rv, w, op) => {
      if(w == null) return true; if(rv == null) return false;
      switch(op||"="){case ">":return rv>w;case ">=":return rv>=w;case "<":return rv<w;case "<=":return rv<=w;default:return rv===w;}
    };
    if(!_cmp(c.cost,      p.filters.cost,      p.filters.costOp))      return false;
    if(!_cmp(c.strength,  p.filters.strength,  p.filters.strengthOp))  return false;
    if(!_cmp(c.willpower, p.filters.willpower, p.filters.willpowerOp)) return false;
    if(!_cmp(c.lore,      p.filters.lore,      p.filters.loreOp))      return false;
    if(p.filters.card_type && (c.card_type||"") !== p.filters.card_type) return false;
    if(p.filters.inkable === true  && c.inkable !== true)  return false;
    if(p.filters.inkable === false && c.inkable !== false) return false;
    if(p.filters.classification){
      const cls = (c.classifications||[]).map(s => (s||"").toLowerCase());
      if(!cls.includes(p.filters.classification.toLowerCase())) return false;
    }
    if(p.excludeRarities && p.excludeRarities.size && p.excludeRarities.has(c.Rarity)) return false;
    if(p.name && !nameMatches(p.name, c["Product Name"])) return false;
    return true;
  };
  const flatMatches = useMemo(()=>{
    if(!cardQuery.trim()) return null;
    return cardOptions
      .filter(c => cardMatches(c, parsedQuery) && cardPassesHistoryFilter(c))
      .slice(0, 200);
  }, [cardOptions, cardQuery, parsedQuery, cardPassesHistoryFilter]);

  // For the default (no-search) view: group by set, newest sets first,
  // collector number ascending within each.
  const groupedBySet = useMemo(()=>{
    if(cardQuery.trim()) return null;
    const bySet = {};
    for(const c of cardOptions){
      if(!cardPassesHistoryFilter(c)) continue;
      if(!bySet[c.Set]) bySet[c.Set] = [];
      bySet[c.Set].push(c);
    }
    for(const k of Object.keys(bySet)){
      bySet[k].sort((a,b) => collectorNum(a) - collectorNum(b));
    }
    // Order sets: SET_ORDER reversed for mains, then any extras alphabetically
    const ordered = [];
    for(let i = SET_ORDER.length - 1; i >= 0; i--){
      if(bySet[SET_ORDER[i]]) ordered.push([SET_ORDER[i], bySet[SET_ORDER[i]]]);
    }
    for(const k of Object.keys(bySet).sort()){
      if(!SET_ORDER.includes(k)) ordered.push([k, bySet[k]]);
    }
    return ordered;
  }, [cardOptions, cardQuery, cardPassesHistoryFilter]);

  // Display title for a card row — append rarity for chase / promo cards
  // to distinguish from the base printing in the same name family.
  const cardDisplayTitle = (c) => {
    if(["Enchanted","Iconic","Epic","Promo"].includes(c.Rarity)){
      return `${c["Product Name"]} (${c.Rarity})`;
    }
    return c["Product Name"];
  };

  // Fetch card history when selectedGroup changes
  useEffect(()=>{
    if(!selectedGroup){ setHistory({normal:null, foil:null, loading:false}); return; }
    let cancelled = false;
    setHistory({normal:null, foil:null, loading:true});
    // The "group" we have is one row from raw — find both printings via card_id
    const allRows = raw.filter(r => r.card_id === selectedGroup.card_id);
    const groups = groupCards(allRows);
    const g = groups[0];
    const tasks = [];
    if(g && g.normal && g.normal.tcgplayer_product_id){
      tasks.push(fetchCardHistory(g.normal.tcgplayer_product_id, g.normal.tcg_printing)
        .then(rows => ({key:"normal", rows})));
    }
    if(g && g.foil && g.foil.tcgplayer_product_id){
      tasks.push(fetchCardHistory(g.foil.tcgplayer_product_id, g.foil.tcg_printing)
        .then(rows => ({key:"foil", rows})));
    }
    Promise.all(tasks).then(results => {
      if(cancelled) return;
      const next = {normal:[], foil:[], loading:false};
      for(const r of results) next[r.key] = r.rows;
      setHistory(next);
    }).catch(()=>{
      if(!cancelled) setHistory({normal:[], foil:[], loading:false});
    });
    return ()=>{ cancelled = true; };
  }, [selectedGroup?.card_id, raw]);

  // Fetch sealed-product history when a sealed SKU is selected. Sealed
  // products are always Normal printing — fetchCardHistory keys on
  // tcgplayer_product_id + printing so it transparently works for them.
  useEffect(()=>{
    if(mode !== "sealed" || !selectedSealedPid){
      setSealedHist({rows:null, loading:false});
      return;
    }
    let cancelled = false;
    setSealedHist({rows:null, loading:true});
    fetchCardHistory(selectedSealedPid, "Normal")
      .then(rows => { if(!cancelled) setSealedHist({rows: rows || [], loading:false}); })
      .catch(() => { if(!cancelled) setSealedHist({rows: [], loading:false}); });
    return ()=>{ cancelled = true; };
  }, [mode, selectedSealedPid]);

  // set_id -> position in `sets` (oldest = 0, newest = N-1). Used to sort
  // sealed picker entries newest-set first within each product-type group,
  // matching the Sealed sub-tab on Analytics.
  const setOrderIndexById = useMemo(()=>{
    const byId = {};
    for(const r of raw){
      if(r.set_id && r.Set){
        const idx = sets.indexOf(r.Set);
        if(idx >= 0) byId[r.set_id] = idx;
      }
    }
    return byId;
  }, [raw, sets]);

  // Pre-grouped sealed picker list — same display-type sections as the
  // Market Sealed sub-tab, plus a name-substring filter from the search box.
  // Within each type, newest set first then name; types ordered by
  // sealedDisplayTypeRank (Booster Boxes → Booster Packs → ETB → ...).
  const sealedPickerData = useMemo(()=>{
    if(!sealedPrices) return [];
    const q = sealedSearch.trim().toLowerCase();
    const filtered = sealedPrices.filter(p =>
      p.printing === "Normal" &&
      p.product_type !== "Promo Single" &&
      (!q || cleanSealedName(p.name).toLowerCase().includes(q))
    );
    const byType = new Map();
    for(const item of filtered){
      const t = deriveSealedDisplayType(item);
      if(!byType.has(t)) byType.set(t, []);
      byType.get(t).push(item);
    }
    const out = [];
    for(const [type, list] of byType){
      list.sort((a, b) => {
        const ai = a.set_id != null ? (setOrderIndexById[a.set_id] ?? -999) : -1000;
        const bi = b.set_id != null ? (setOrderIndexById[b.set_id] ?? -999) : -1000;
        if(ai !== bi) return bi - ai;
        return (a.name||"").localeCompare(b.name||"");
      });
      out.push({type, items: list});
    }
    out.sort((a, b) => sealedDisplayTypeRank(a.type) - sealedDisplayTypeRank(b.type));
    return out;
  }, [sealedPrices, sealedSearch, setOrderIndexById]);

  // Build LineChart series from the sealed-history rows (mirrors the card
  // mode's buildHistorySeries, but with one printing instead of two).
  const sealedSeries = useMemo(()=>{
    if(!sealedHist.rows || !sealedHist.rows.length) return [];
    const lowPoints = [], mktPoints = [];
    for(const r of sealedHist.rows){
      const t = new Date(r.date + "T00:00:00Z").getTime();
      if(r.low_price != null)    lowPoints.push({x:t, y:parseFloat(r.low_price)});
      if(r.market_price != null) mktPoints.push({x:t, y:parseFloat(r.market_price)});
    }
    const out = [];
    if(showLow    && lowPoints.length) out.push({label:"Low",    color:"#1d8d4a", data:lowPoints});
    if(showMarket && mktPoints.length) out.push({label:"Market", color:"#7e54c4", data:mktPoints, dashed:true});
    return out;
  }, [sealedHist, showLow, showMarket]);

  const selectedSealed = useMemo(()=>{
    if(!selectedSealedPid || !sealedPrices) return null;
    return sealedPrices.find(p => p.tcgplayer_product_id === selectedSealedPid && p.printing === "Normal") || null;
  }, [selectedSealedPid, sealedPrices]);

  // Fetch set EV history when set or price field changes
  useEffect(()=>{
    if(mode !== "set" || !setName){ setSetEv({rows:null, loading:false, error:null}); return; }
    // Find the set_id matching this name
    const sample = raw.find(r => r.Set === setName);
    if(!sample){ setSetEv({rows:null, loading:false, error:"Unknown set"}); return; }
    let cancelled = false;
    setSetEv({rows:null, loading:true, error:null});
    sbFetchAll("rarity_avg_daily", {
      select: "date,rarity,printing,avg_low,avg_market,avg_low_nc,avg_market_nc",
      set_id: "eq." + sample.set_id,
      order: "date.asc",
    }).then(rows => { if(!cancelled) setSetEv({rows, loading:false, error:null}); })
      .catch(e => {
        if(cancelled) return;
        const msg = String(e?.message || e);
        // Statement timeout = view exists but isn't materialized → run the SQL
        let friendly;
        if(msg.includes("57014") || msg.includes("timeout")){
          friendly = "Set EV view timed out — re-run supabase/06_rarity_avg_daily.sql to convert it to a materialized view (then refresh this page).";
        } else if(msg.includes("404") || msg.includes("relation") || msg.includes("does not exist")){
          friendly = "Run supabase/06_rarity_avg_daily.sql in Supabase to enable this chart.";
        } else {
          friendly = "Set EV chart error: " + msg.slice(0,200);
        }
        setSetEv({rows:null, loading:false, error: friendly});
      });
    return ()=>{ cancelled = true; };
  }, [mode, setName, raw]);

  // Compute set EV series client-side from the rarity-avg rows. Builds one
  // series per active price field (Low and/or Market) so both can be plotted.
  // `noPenny` switches to the avg_*_nc columns (cards <$1 counted as $0).
  // `noChase` skips Enchanted + Iconic rarities entirely (matches the EV tab).
  const setEvSeries = useMemo(()=>{
    if(!setEv.rows || !setEv.rows.length) return [];
    const pull = getPull(setName);
    const evForField = (lowField, marketField, useField) => {
      const field = useField;
      const byDate = {};
      for(const r of setEv.rows){
        if(!byDate[r.date]) byDate[r.date] = {};
        const key = getRarKey(r.rarity, r.printing);
        if(!key) continue;
        const v = r[field] != null ? parseFloat(r[field]) : null;
        if(v == null) continue;
        byDate[r.date][key] = v;
      }
      return Object.keys(byDate).sort().map(date => {
        const avgs = byDate[date];
        let ev = 0;
        for(const r of RARS){
          if(noChase && NO_ENCH.has(r)) continue;
          const rate = pull[r];
          const avg = avgs[r];
          if(avg != null && rate != null) ev += avg * rate;
        }
        return {x: Date.parse(date), y: ev};
      });
    };
    const lowField    = noPenny ? "avg_low_nc"    : "avg_low";
    const marketField = noPenny ? "avg_market_nc" : "avg_market";
    const out = [];
    if(showLow)    out.push({label:"NM Low EV / box",  color:"#c8a846", dashed:false, data: evForField(null,null,lowField)});
    if(showMarket) out.push({label:"Market EV / box", color:"#c8a846", dashed:true,  data: evForField(null,null,marketField)});
    return out;
  }, [setEv.rows, setName, showLow, showMarket, noPenny, noChase]);

  // Vertical markers for the set EV chart — LGS release + retail release.
  const setMarkers = useMemo(()=>{
    const d = SET_RELEASE_DATES[setName];
    if(!d) return null;
    const out = [];
    if(d.lgs)    out.push({x: Date.parse(d.lgs),    label:"LGS",    color:"var(--text-muted)", dashed:true});
    if(d.retail) out.push({x: Date.parse(d.retail), label:"Retail", color:"var(--accent)",     dashed:false});
    return out;
  }, [setName]);

  // Compare-mode builder: lets users assemble a multi-product comparison
  // (cards + sealed) directly from Price Graphing instead of only via the
  // Screener handoff. Items share the same shape as Screener pushes; the
  // `kind` field is informational only (fetchCardHistory works generically
  // for both since sealed products use Normal printing keyed by product_id).
  const COMPARE_MAX = 8;
  const addToCompare = useCallback((item) => {
    if(!item) return;
    setCompareCards(prev => {
      if(prev.some(p => p.card_id === item.card_id)) return prev;
      if(prev.length >= COMPARE_MAX) return prev;
      return [...prev, item];
    });
  }, []);
  const buildCardCompareItem = useCallback((c) => {
    if(!c || !c.card_id) return null;
    const allRows = raw.filter(r => r.card_id === c.card_id);
    const groups = groupCards(allRows);
    const g = groups[0];
    const pick = (g && (g.normal || g.foil)) || null;
    if(!pick) return null;
    return {
      kind: "card",
      card_id: c.card_id,
      productId: pick.tcgplayer_product_id,
      printing: pick.tcg_printing || "Normal",
      name: cardDisplayTitle(c),
      sub: `${c.Set}${c.Number?" · #"+c.Number.split("/")[0]:""}${c.Rarity?" · "+c.Rarity:""}`,
      image: c.img_normal || c.img_small || null,
    };
  }, [raw]);
  const buildSealedCompareItem = useCallback((s) => {
    if(!s || s.tcgplayer_product_id == null) return null;
    return {
      kind: "sealed",
      card_id: "sealed-" + s.tcgplayer_product_id,
      productId: s.tcgplayer_product_id,
      printing: "Normal",
      name: cleanSealedName(s.name),
      sub: deriveSealedDisplayType(s),
      image: s.image_url || null,
    };
  }, []);
  // Each graded compare item is keyed by (pid, grader, grade) so the same
  // card can appear under multiple grade tiers (PSA 10 vs CGC 9.5).
  const buildGradedCompareItem = useCallback((g) => {
    if(!g || g.tcgplayer_product_id == null) return null;
    const meta = g._meta || {};
    return {
      kind: "graded",
      card_id: `graded-${g.tcgplayer_product_id}-${g.grader}-${g.grade}`,
      productId: g.tcgplayer_product_id,
      grader: g.grader, grade: g.grade,
      printing: (g.grader||"").toUpperCase() + " " + g.grade,
      name: (meta["Product Name"] || meta.name || "Unknown") + " — " + (g.grader||"").toUpperCase() + " " + g.grade,
      sub: (meta.Set ? meta.Set + (meta.Number ? " · #" + String(meta.Number).split("/")[0] : "") : "") + " · " + (g.grader||"").toUpperCase() + " " + g.grade,
      image: meta.img_normal || meta.img_small || null,
    };
  }, []);

  // Inline picker used inside Compare mode so users can add cards / sealed
  // without leaving the report. Top 8 card hits and top 4 sealed hits.
  const [compareSearch, setCompareSearch] = useState("");
  const compareSearchHits = useMemo(()=>{
    const q = compareSearch.trim().toLowerCase();
    if(!q) return null;
    const cardHits = [];
    for(const c of cardOptions){
      const name = c["Product Name"] || "";
      if(name.toLowerCase().includes(q)){
        cardHits.push(c);
        if(cardHits.length >= 8) break;
      }
    }
    const sealedHits = [];
    if(sealedPrices){
      for(const p of sealedPrices){
        if(p.printing !== "Normal" || p.product_type === "Promo Single") continue;
        if(cleanSealedName(p.name).toLowerCase().includes(q)){
          sealedHits.push(p);
          if(sealedHits.length >= 4) break;
        }
      }
    }
    return {cards: cardHits, sealed: sealedHits};
  }, [compareSearch, cardOptions, sealedPrices]);

  // Available sets for the picker — only sets we have rarity_avg data for.
  // Reuse the same source as the dropdown (sets prop already excludes promos).
  const filteredSetList = useMemo(()=>{
    const filt = historyFilter.sets;
    const setOk = (s) => !filt || filt.size === 0 || filt.has(s);
    if(!setSearch.trim()) return [...sets].filter(setOk).sort((a,b) => {
      const ai = SET_ORDER.indexOf(a), bi = SET_ORDER.indexOf(b);
      return (bi === -1 ? -999 : bi) - (ai === -1 ? -999 : ai);
    });
    const q = setSearch.toLowerCase();
    return sets.filter(s => setOk(s) && s.toLowerCase().includes(q));
  }, [sets, setSearch, historyFilter.sets]);

  return html`<div class="history-view">
    <div class="history-toolbar">
      <div class="seg-toggle">
        <button class=${mode==="card"?"active":""}    onClick=${()=>setMode("card")}>By Card</button>
        <button class=${mode==="sealed"?"active":""}  onClick=${()=>setMode("sealed")}>By Sealed</button>
        <button class=${mode==="graded"?"active":""}  onClick=${()=>setMode("graded")}>By Graded</button>
        <button class=${mode==="set"?"active":""}     onClick=${()=>setMode("set")}>By Set EV</button>
      </div>
      <div class="seg-toggle">
        ${RANGE_OPTIONS.map(([k,l]) => html`<button key=${k}
          class=${rangeKey===k?"active":""} onClick=${()=>setRangeKey(k)}>${l}</button>`)}
      </div>
      ${rangeKey === "custom" && html`<input type="date" class="custom-date-input"
        value=${customStart}
        max=${new Date().toISOString().slice(0,10)}
        onChange=${e=>setCustomStart(e.target.value)}/>`}
      <label class="checkbox-group" title="Pre-release prices are wildly inflated (often 10-20× the real post-release floor). Default ON hides those days for every card individually using its set's release date. Uncheck to include them anyway.">
        <input type="checkbox" checked=${hidePreorders} onChange=${e=>setHidePreorders(e.target.checked)}/>
        Hide prerelease
      </label>
      ${mode === "set" && html`<label class="checkbox-group" title="Cards worth less than $1 count as $0 in the EV calculation.">
        <input type="checkbox" checked=${noPenny} onChange=${e=>setNoPenny(e.target.checked)}/>
        ${"<"}$1 → $0
      </label>`}
      ${mode === "set" && html`<label class="checkbox-group" title="Exclude Enchanted and Iconic chase rarities from the EV calculation.">
        <input type="checkbox" checked=${noChase} onChange=${e=>setNoChase(e.target.checked)}/>
        No Ench/Iconic
      </label>`}
    </div>

    ${(mode === "sealed" || mode === "card" || mode === "set" || mode === "graded") ? (() => {
      const priceLabel = showLow ? "NM Low" : "NM Market";
      // Per-pid earliest acceptable timestamp = release date + 1 day. Used to
      // drop pre-release spike days from each compared card individually
      // (different cards have different release dates so a single shared
      // startMs can't do this). Promos / undated sets fall through (no clip).
      const releaseFloorByPid = (() => {
        const setRel = {};
        for(const s of (setsMeta || [])) if(s && s.id && s.released_at) setRel[s.id] = s.released_at;
        const m = {};
        for(const r of (raw || [])){
          const pid = r.tcgplayer_product_id;
          if(pid == null || m[pid] !== undefined) continue;
          const rel = setRel[r.set_id];
          if(!rel) continue;
          const d = new Date(rel + "T00:00:00Z").getTime();
          m[pid] = d + 24 * 60 * 60 * 1000; // +1 day
        }
        return m;
      })();
      const builtSeries = compareCards.map((c, i) => {
        let data = [];
        if(c.kind === "set"){
          const rows = setEvCache[c.setId] || [];
          const ev = computeSetEv(rows, c.setName, {noPenny, noChase});
          const arr = showLow ? ev.low : ev.market;
          data = (arr || []).filter(p => Number.isFinite(p.y));
        } else {
          const rows = compareSeries[c.card_id] || [];
          data = rows
            .filter(p => (showLow ? p.low != null : p.market != null))
            .map(p => ({x: p.x, y: showLow ? p.low : p.market}));
        }
        // Per-card pre-release clip: drop points before this card's set
        // released_at + 1 day, unless the user has explicitly toggled
        // pre-release inclusion ON via the "Include prerelease" checkbox
        // (which flips hidePreorders to false).
        if(hidePreorders && c.kind !== "set"){
          const floorMs = releaseFloorByPid[c.productId];
          if(floorMs != null) data = data.filter(p => p.x >= floorMs);
        }
        return {name: c.name, color: COMPARE_COLORS[i % COMPARE_COLORS.length], data};
      });
      const startMs = computeChartStartMs(rangeKey, customStart, hidePreorders, null);
      const clipped = clipSeriesFrom(builtSeries, startMs);
      const rangeLabel = (RANGE_OPTIONS.find(([k]) => k === rangeKey) || [,"All"])[1];
      const reportArgs = {
        title: "Price Comparison Report",
        subtitle: `${compareCards.length} product${compareCards.length===1?"":"s"} · ${priceLabel} · Range: ${rangeLabel}`,
        items: compareCards,
        series: clipped,
        colors: COMPARE_COLORS,
        footerNote: "packs.ink · Unofficial fan site, not affiliated with Disney or Ravensburger",
      };
      const doExportPng = () => exportCompareReportPng(reportArgs);
      const doExportSvg = () => exportCompareReportSvg(reportArgs);
      const doExportCsv = () => {
        const headers = ["#","Name","Type/Set","Kind","Start","End","Change %"];
        const esc = v => { const s = v==null?"":String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
        const lines = [headers.join(",")];
        compareCards.forEach((c, i) => {
          const data = clipped[i] && clipped[i].data ? clipped[i].data.filter(p => Number.isFinite(p.y)) : [];
          const start = data.length ? data[0].y : "";
          const end   = data.length ? data[data.length-1].y : "";
          const pct   = (data.length && start) ? ((end-start)/start*100).toFixed(2) : "";
          lines.push([i+1, c.name, c.sub||"", c.kind==="sealed"?"Sealed":"Card",
            start===""?"":start.toFixed(2), end===""?"":end.toFixed(2), pct].map(esc).join(","));
        });
        const blob = new Blob([lines.join("\n")], {type:"text/csv"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url;
        a.download = "packs-ink-compare-" + new Date().toISOString().slice(0,10) + ".csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const renderSeries = clipped.filter(s => s.data && s.data.length >= 2);
      const isFull = compareCards.length >= COMPARE_MAX;
      const isCardInCompare = (cid) => compareCards.some(p => p.card_id === cid);
      const toggleCard = (c) => {
        if(isCardInCompare(c.card_id)){
          setCompareCards(prev => prev.filter(p => p.card_id !== c.card_id));
        } else if(!isFull){
          const item = buildCardCompareItem(c);
          if(item) setCompareCards(prev => [...prev, item]);
        }
      };
      const toggleSealed = (s) => {
        const sid = "sealed-" + s.tcgplayer_product_id;
        if(isCardInCompare(sid)){
          setCompareCards(prev => prev.filter(p => p.card_id !== sid));
        } else if(!isFull){
          const item = buildSealedCompareItem(s);
          if(item) setCompareCards(prev => [...prev, item]);
        }
      };
      const toggleGraded = (g) => {
        const gid = `graded-${g.tcgplayer_product_id}-${g.grader}-${g.grade}`;
        if(isCardInCompare(gid)){
          setCompareCards(prev => prev.filter(p => p.card_id !== gid));
        } else if(!isFull){
          const item = buildGradedCompareItem(g);
          if(item) setCompareCards(prev => [...prev, item]);
        }
      };
      // Multi-token, punctuation-tolerant search over the joined card
      // metadata. Splits the query on whitespace + non-word chars; every
      // token must appear somewhere in the blob (substring). Lets the user
      // type "elsa spirit" against "Elsa - Spirit of Winter" and find it,
      // or "elsa psa 10" to narrow to grader+grade in one box.
      const gradedFiltered = (gradedOptions || []).filter(g => {
        // Grader / grade chip filters first (cheap; bail before search).
        if(gradedGraderFilter.size && !gradedGraderFilter.has((g.grader||"").toLowerCase())) return false;
        if(gradedGradeFilter.size  && !gradedGradeFilter.has(String(g.grade))) return false;
        // Drawer filters operate on the underlying card metadata (ink, rarity,
        // cost, type, set, etc.). Skip cards whose meta row fails.
        if(g._meta && !cardPassesHistoryFilter(g._meta)) return false;
        const q = gradedSearch.trim().toLowerCase();
        if(!q) return true;
        const m = g._meta || {};
        const blob = ((m["Product Name"] || m.name || "") + " " + (m.Set || "") + " "
                    + (g.grader||"") + " " + g.grade).toLowerCase()
                    .replace(/[^a-z0-9. ]+/g, " ");          // strip punctuation
        const tokens = q.split(/[\s,]+/).filter(Boolean);
        return tokens.every(t => blob.includes(t));
      }).slice(0, 250);

      // Distinct graders / grades present in the dataset — drives the filter chip rows.
      const gradedAllGraders = ["psa","cgc","bgs","sgc","tag"];
      const gradedAllGrades = ["10","9.5","9","8.5","8","7","6","5","4","3","2","1"];

      const toggleSetItem = (setNameForToggle) => {
        const sid = setIdByName[setNameForToggle];
        if(!sid) return;
        const key = "set-" + sid;
        if(isCardInCompare(key)){
          setCompareCards(prev => prev.filter(p => p.card_id !== key));
        } else if(!isFull){
          const item = buildSetCompareItem(setNameForToggle);
          if(item) setCompareCards(prev => [...prev, item]);
        }
      };
      const previewItem = compareCards.length === 1 ? compareCards[0] : null;
      const previewImg = previewItem
        ? (previewItem.kind === "sealed"
            ? previewItem.image
            : (cardOptions.find(c => c.card_id === previewItem.card_id)?.img_normal
               || cardOptions.find(c => c.card_id === previewItem.card_id)?.img_small
               || previewItem.image))
        : null;

      const filtersButton = html`<button class=${"history-picker-filters-btn"+(histActiveCount>0?" active":"")}
        onClick=${()=>setHistoryFilterOpen(true)}
        title="Filter by ink, cost, rarity, type, set, classification, keyword...">
        ☰ Filters${histActiveCount > 0 ? html` <span class="filter-count-badge">${histActiveCount}</span>` : ""}
      </button>`;

      const pickerJsx = mode === "card"
        ? html`<div class="history-picker">
            <div class="history-picker-searchrow">
              <input type="search"
                placeholder="Search — name, rarity, ink, set..."
                value=${cardQuery}
                onInput=${e=>setCardQuery(e.target.value)}/>
              ${filtersButton}
            </div>
            <div class="history-picker-hint">Click any card to add or remove it from the graph. Up to ${COMPARE_MAX}.</div>
            <div class="history-picker-list">
              ${flatMatches != null ? (flatMatches.length === 0
                ? html`<div class="history-picker-empty">No cards match "${cardQuery}"</div>`
                : flatMatches.map(c => {
                    const sel = isCardInCompare(c.card_id);
                    return html`<button key=${c.card_id}
                      class=${"history-picker-item picker-multi "+(sel?"active":"")}
                      disabled=${!sel && isFull}
                      title=${!sel && isFull ? `Graph full (${COMPARE_MAX} max) — remove one to add more` : ""}
                      onClick=${()=>toggleCard(c)}>
                      <span class=${"picker-check "+(sel?"checked":"")}>${sel?"✓":""}</span>
                      <span class="picker-text">
                        <span class="hpi-name">${cardDisplayTitle(c)}</span>
                        <span class="hpi-sub">${c.Set}${c.Number?" · #"+c.Number.split("/")[0]:""}${c.ink?" · "+c.ink:""}</span>
                      </span>
                    </button>`;
                  }))
                : groupedBySet.map(([setKey, cards]) => html`<div key=${setKey} class="history-picker-group">
                    <div class="history-picker-group-head">${setKey}</div>
                    ${cards.map(c => {
                      const sel = isCardInCompare(c.card_id);
                      return html`<button key=${c.card_id}
                        class=${"history-picker-item picker-multi "+(sel?"active":"")}
                        disabled=${!sel && isFull}
                        title=${!sel && isFull ? `Graph full (${COMPARE_MAX} max) — remove one to add more` : ""}
                        onClick=${()=>toggleCard(c)}>
                        <span class=${"picker-check "+(sel?"checked":"")}>${sel?"✓":""}</span>
                        <span class="picker-text">
                          <span class="hpi-name">${cardDisplayTitle(c)}</span>
                          <span class="hpi-sub">${c.Number?"#"+c.Number.split("/")[0]:""}${c.ink?" · "+c.ink:""}${c.Rarity && !["Enchanted","Iconic","Epic","Promo"].includes(c.Rarity)?" · "+c.Rarity:""}</span>
                        </span>
                      </button>`;
                    })}
                  </div>`)}
            </div>
          </div>`
        : mode === "sealed"
        ? html`<div class="history-picker">
            <div class="history-picker-searchrow">
              <input type="search" placeholder="Search sealed product..."
                value=${sealedSearch} onInput=${e=>setSealedSearch(e.target.value)}/>
              ${filtersButton}
            </div>
            <div class="history-picker-hint">Click any product to add or remove it from the graph. Up to ${COMPARE_MAX}.</div>
            <div class="history-picker-list">
              ${sealedPickerData.length === 0
                ? html`<div class="history-picker-empty">${sealedPrices && sealedPrices.length
                    ? `No products match "${sealedSearch}"`
                    : "No sealed-product data loaded. Run supabase/16_sealed_prices_latest.sql."}</div>`
                : sealedPickerData.map(({type, items}) => html`<div key=${type} class="history-picker-group">
                    <div class="history-picker-group-head">${type}</div>
                    ${items.map(item => {
                      const sid = "sealed-" + item.tcgplayer_product_id;
                      const sel = isCardInCompare(sid);
                      return html`<button key=${item.tcgplayer_product_id}
                        class=${"history-picker-item picker-multi "+(sel?"active":"")}
                        disabled=${!sel && isFull}
                        title=${!sel && isFull ? `Graph full (${COMPARE_MAX} max) — remove one to add more` : ""}
                        onClick=${()=>toggleSealed(item)}>
                        <span class=${"picker-check "+(sel?"checked":"")}>${sel?"✓":""}</span>
                        <span class="picker-text">
                          <span class="hpi-name">${cleanSealedName(item.name)}</span>
                        </span>
                      </button>`;
                    })}
                  </div>`)}
            </div>
          </div>`
        : mode === "graded"
        ? html`<div class="history-picker">
            <div class="history-picker-searchrow">
              <input type="search" placeholder="Search — try 'elsa spirit', 'mickey psa 10', 'fabled iconic'..."
                value=${gradedSearch} onInput=${e=>setGradedSearch(e.target.value)}/>
              ${filtersButton}
            </div>
            <div class="graded-picker-filters">
              <div class="graded-picker-filter-row">
                <span class="graded-picker-filter-lbl">Grader</span>
                ${gradedAllGraders.map(g => html`<button key=${g}
                  class=${"chip "+(gradedGraderFilter.has(g)?"active":"")}
                  onClick=${()=>setGradedGraderFilter(prev=>{ const n=new Set(prev); n.has(g)?n.delete(g):n.add(g); return n; })}>${g.toUpperCase()}</button>`)}
                ${gradedGraderFilter.size > 0 && html`<button class="chip chip-clear"
                  onClick=${()=>setGradedGraderFilter(new Set())}>Clear</button>`}
              </div>
              <div class="graded-picker-filter-row">
                <span class="graded-picker-filter-lbl">Grade</span>
                ${gradedAllGrades.map(g => html`<button key=${g}
                  class=${"chip "+(gradedGradeFilter.has(g)?"active":"")}
                  onClick=${()=>setGradedGradeFilter(prev=>{ const n=new Set(prev); n.has(g)?n.delete(g):n.add(g); return n; })}>${g}</button>`)}
                ${gradedGradeFilter.size > 0 && html`<button class="chip chip-clear"
                  onClick=${()=>setGradedGradeFilter(new Set())}>Clear</button>`}
              </div>
            </div>
            <div class="history-picker-hint">Click any graded sale tier to add or remove it from the graph. Up to ${COMPARE_MAX}.</div>
            <div class="history-picker-list">
              ${gradedOptions == null
                ? html`<div class="history-picker-empty">Loading graded sales…</div>`
                : gradedFiltered.length === 0
                  ? html`<div class="history-picker-empty">${gradedOptions.length === 0
                      ? "No graded sales recorded. Run scripts/etl_tcgpricelookup_daily.py to populate."
                      : `No matches for "${gradedSearch}"`}</div>`
                  : gradedFiltered.map(g => {
                      const gid = `graded-${g.tcgplayer_product_id}-${g.grader}-${g.grade}`;
                      const sel = isCardInCompare(gid);
                      const m = g._meta || {};
                      const px = g.ebay_avg_30d ?? g.ebay_avg_7d ?? g.ebay_avg_1d;
                      return html`<button key=${gid}
                        class=${"history-picker-item picker-multi "+(sel?"active":"")}
                        disabled=${!sel && isFull}
                        title=${!sel && isFull ? `Graph full (${COMPARE_MAX} max) — remove one to add more` : ""}
                        onClick=${()=>toggleGraded(g)}>
                        <span class=${"picker-check "+(sel?"checked":"")}>${sel?"✓":""}</span>
                        <span class="picker-text">
                          <span class="hpi-name">${m["Product Name"] || m.name || "Unknown"}</span>
                          <span class="hpi-sub">
                            <span style=${{color:"#c8a846",fontWeight:700}}>${(g.grader||"").toUpperCase()} ${g.grade}</span>
                            ${m.Set ? " · " + m.Set : ""}
                            ${px != null ? " · $" + Number(px).toLocaleString(undefined,{maximumFractionDigits:0}) : ""}
                          </span>
                        </span>
                      </button>`;
                    })}
            </div>
          </div>`
        : html`<div class="history-picker">
            <div class="history-picker-searchrow">
              <input type="search" placeholder="Search sets..."
                value=${setSearch} onInput=${e=>setSetSearch(e.target.value)}/>
              ${filtersButton}
            </div>
            <div class="history-picker-hint">Click any set to add or remove its EV-per-Box line from the graph. Up to ${COMPARE_MAX}.</div>
            <div class="history-picker-list">
              ${filteredSetList.length === 0
                ? html`<div class="history-picker-empty">No sets match "${setSearch}"</div>`
                : filteredSetList.map(s => {
                    const sid = setIdByName[s];
                    const key = sid ? "set-" + sid : null;
                    const sel = key && isCardInCompare(key);
                    const dates = SET_RELEASE_DATES[s];
                    return html`<button key=${s}
                      class=${"history-picker-item picker-multi "+(sel?"active":"")}
                      disabled=${!sid || (!sel && isFull)}
                      title=${!sid ? "No set_id on file for this set" : (!sel && isFull ? `Graph full (${COMPARE_MAX} max) — remove one to add more` : "")}
                      onClick=${()=>toggleSetItem(s)}>
                      <span class=${"picker-check "+(sel?"checked":"")}>${sel?"✓":""}</span>
                      <span class="picker-text">
                        <span class="hpi-name">${s}${setDataPartial(s)?"*":""}</span>
                        <span class="hpi-sub">${dates ? "Retail " + fmtIsoDate(dates.retail) : "No release date on file"}</span>
                      </span>
                    </button>`;
                  })}
            </div>
          </div>`;

      return html`<div class="history-card-mode">
        ${pickerJsx}
        <div class="history-chart-pane">
          <div class="compare-picker-bar">
            <div class="compare-summary">
              ${compareCards.length === 0
                ? html`<span class="muted" style=${{fontSize:12}}>${mode === "card" ? "Check off cards on the left to start graphing." : mode === "sealed" ? "Check off sealed products on the left to start graphing." : mode === "graded" ? "Check off graded sale tiers on the left to graph their eBay history." : "Check off sets on the left to graph their EV per box."}</span>`
                : html`<span style=${{fontSize:12,fontWeight:600}}>${compareCards.length} product${compareCards.length===1?"":"s"} on the graph</span>
                       <span class="muted" style=${{fontSize:11,marginLeft:8}}>· ${priceLabel} · ${rangeLabel}</span>`}
            </div>
            ${compareCards.length > 0 && html`<div class="compare-export-group">
              <button class="settings-action" onClick=${doExportPng} title="Export the comparison chart + product list as a PNG report.">📥 PNG</button>
              <button class="settings-action" onClick=${doExportSvg} title="Export as scalable vector (SVG).">SVG</button>
              <button class="settings-action" onClick=${doExportCsv} title="Export the products table as CSV.">CSV</button>
              <button class="settings-action link" onClick=${()=>{ setCompareCards([]); setCompareSeries({}); }} style=${{fontSize:11}}>Clear all</button>
            </div>`}
          </div>

          ${compareCards.length === 0
            ? html`<div class="chart-empty large">${mode === "card" ? "Pick cards from the list →" : mode === "sealed" ? "Pick sealed products from the list →" : mode === "graded" ? "Pick graded sale tiers from the list — PSA / CGC / BGS / SGC / TAG by grade →" : "Pick sets from the list — each one graphs its EV per box →"}</div>`
            : html`<div>
                ${previewItem && previewImg && html`<div class="history-card-preview">
                  <img class="history-preview-img" src=${previewImg} alt=${previewItem.name}/>
                  <div class="history-preview-info">
                    <div class="history-preview-name">${previewItem.name}</div>
                    <div class="history-preview-meta">${previewItem.sub || ""}</div>
                    ${tcgUrl(previewItem.productId) && html`<div class="history-preview-type">
                      <a href=${tcgUrl(previewItem.productId)} target="_blank" rel="noopener nofollow">View on TCGPlayer ↗</a>
                    </div>`}
                  </div>
                </div>`}
                ${compareCards.length > 1 && html`<div class="compare-legend">
                  <span class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginRight:6}}>On graph</span>
                  ${compareCards.map((c, i) => html`<span key=${c.card_id} class="compare-chip"
                    style=${{borderColor: COMPARE_COLORS[i % COMPARE_COLORS.length]}}>
                    <span class="compare-swatch" style=${{background: COMPARE_COLORS[i % COMPARE_COLORS.length]}}></span>
                    <span class="compare-name">${c.name}</span>
                    ${c.kind === "sealed" ? html`<span class="compare-kind-tag">sealed</span>` : c.kind === "set" ? html`<span class="compare-kind-tag">set EV</span>` : null}
                    <button class="compare-remove"
                      onClick=${()=>{ setCompareCards(prev => prev.filter(x => x.card_id !== c.card_id)); }}
                      title="Remove from graph" aria-label="Remove">×</button>
                  </span>`)}
                </div>`}
                <div class="history-chart-controls">
                  <div class="seg-toggle">
                    <button class=${showLow ? "active" : ""} onClick=${()=>{ setShowLow(true); setShowMarket(false); }}>NM Low</button>
                    <button class=${showMarket ? "active" : ""} onClick=${()=>{ setShowLow(false); setShowMarket(true); }}>NM Market</button>
                  </div>
                </div>
                ${compareLoading
                  ? html`<div class="chart-empty large">Loading history…</div>`
                  : renderSeries.length === 0
                    ? html`<div class="chart-empty large">No price history yet for the selected product${compareCards.length>1?"s":""}.</div>`
                    : html`<${LineChart} series=${renderSeries} width=920 height=320/>`}
                <table class="compare-stats-table">
                  <thead><tr>
                    <th></th><th>#</th><th>Product</th><th>Type / Set</th>
                    <th class="num">Start</th><th class="num">End</th><th class="num">Change</th>
                  </tr></thead>
                  <tbody>
                    ${compareCards.map((c, i) => {
                      const data = clipped[i] && clipped[i].data ? clipped[i].data.filter(p => Number.isFinite(p.y)) : [];
                      const start = data.length ? data[0].y : null;
                      const end   = data.length ? data[data.length-1].y : null;
                      const pct   = (data.length && start) ? ((end-start)/start*100) : null;
                      return html`<tr key=${c.card_id}>
                        <td><span class="legend-swatch" style=${{background: COMPARE_COLORS[i % COMPARE_COLORS.length], display:"inline-block", width:14, height:5, borderRadius:2}}/></td>
                        <td>${i+1}</td>
                        <td><strong>${c.name}</strong>${c.kind === "sealed" && html` <span class="compare-kind-tag">sealed</span>`}</td>
                        <td class="muted">${c.sub || ""}</td>
                        <td class="num">${start==null?"—":"$"+start.toFixed(2)}</td>
                        <td class="num">${end==null?"—":"$"+end.toFixed(2)}</td>
                        <td class=${"num "+(pct==null?"":(pct>=0?"up":"down"))}>${pct==null?"—":(pct>=0?"+":"")+pct.toFixed(1)+"%"}</td>
                      </tr>`;
                    })}
                  </tbody>
                </table>
              </div>`}
        </div>
      </div>`;
    })() : null}
    ${historyFilterOpen && html`<${FilterDrawer}
      filter=${historyFilter} setFilter=${setHistoryFilter}
      setsByGroup=${histSetsByGroup} allIllustrators=${histIllustrators}
      onClose=${()=>setHistoryFilterOpen(false)}
      onReset=${()=>setHistoryFilter(emptyFilter())}/>`}
  </div>`;
};

const CHASE_KEYS = ["enchanted","iconic","epic"];

// Modal card picker for "use a card as your profile picture". Dedupes raw
// to one entry per card_id, filters by a typed query (name substring),
// caps render to keep typing snappy. Click a tile → returns its card_id.
// Display-name validator. Returns an error string if the name impersonates
// the site or contains profanity, otherwise null. Normalizes leetspeak / dots
// / spaces / zero-width chars before matching so "p@cks.1nk" still gets caught.
const RESERVED_NAME_PATTERNS = [
  /packs?ink/, /packsdotink/, /packs?\.?ink/,
  /admin/, /moderator/, /\bmod\b/, /support/, /staff/, /official/, /system/,
  /ravensburger/, /disney/, /lorcana/, /tcgplayer/, /anthropic/, /claude/,
];
const PROFANITY_PATTERNS = [
  /fuck/, /shit/, /bitch/, /cunt/, /asshole/, /dick/, /pussy/, /cock/,
  /nigger/, /nigga/, /faggot/, /retard/, /\brape\b/, /\bnazi\b/, /hitler/,
  /kike/, /chink/, /spic/, /tranny/, /whore/, /slut/,
];
const LEET_MAP = {"0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","8":"b","@":"a","$":"s","!":"i","|":"i"};
function normalizeForCheck(s){
  let n = s.toLowerCase().normalize("NFKD").replace(/[​-‏﻿]/g, "");
  n = n.replace(/[̀-ͯ]/g, "");
  n = n.split("").map(ch => LEET_MAP[ch] || ch).join("");
  return n.replace(/[^a-z]/g, "");
}
function validateDisplayName(raw){
  const stripped = raw.replace(/\s+/g, "");
  if(stripped.length < 2) return "Name must have at least 2 letters";
  const norm = normalizeForCheck(raw);
  if(norm.length < 2) return "Name must contain letters";
  for(const re of RESERVED_NAME_PATTERNS){
    if(re.test(norm)) return "That name is reserved — please pick another";
  }
  for(const re of PROFANITY_PATTERNS){
    if(re.test(norm)) return "Please choose a different name";
  }
  return null;
}

// Collection-sharing controls inside the settings popover. Three per-section
// visibility selects (raw / sealed / graded), copy-link buttons for whichever
// of {public, unlisted} are currently in play, plus regenerate-link and
// make-all-private actions. The single share_token covers any unlisted
// section; rotating it is a single click to revoke a leaked URL.
function CollectionSharingPanel({profile, onChange, onRegenerate}){
  const [savingSection, setSavingSection] = useState(null);
  const [regenBusy, setRegenBusy] = useState(false);
  const [copied, setCopied] = useState(null);
  const [err, setErr] = useState(null);
  if(!profile?.user_id) return null;
  const sections = [
    {key: "raw",    label: "Cards",  col: "collection_raw_visibility"},
    {key: "sealed", label: "Sealed", col: "collection_sealed_visibility"},
    {key: "graded", label: "Graded", col: "collection_graded_visibility"},
  ];
  const valueOf = (s) => profile?.[s.col] || "private";
  const anyUnlisted = sections.some(s => valueOf(s) === "unlisted");
  const anyPublic   = sections.some(s => valueOf(s) === "public");
  const allPrivate  = sections.every(s => valueOf(s) === "private");
  const origin = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "/");
  const publicUrl   = `${origin}?collection=${profile.user_id}`;
  const unlistedUrl = `${origin}?collection=${profile.user_id}&token=${profile.collection_share_token||""}`;
  const change = async (section, level) => {
    setErr(null); setSavingSection(section);
    const r = await onChange(section, level);
    setSavingSection(null);
    if(!r.ok) setErr(r.error || "Couldn't save");
  };
  const copy = async (url, kind) => {
    try {
      await navigator.clipboard.writeText(url);
      setCopied(kind);
      setTimeout(()=>setCopied(c => c===kind ? null : c), 1600);
    } catch { setErr("Couldn't copy to clipboard"); }
  };
  const regen = async () => {
    if(!confirm("Generate a new unlisted link? The old one will stop working immediately.")) return;
    setRegenBusy(true); setErr(null);
    const r = await onRegenerate();
    setRegenBusy(false);
    if(!r.ok) setErr(r.error || "Couldn't regenerate");
  };
  const makeAllPrivate = async () => {
    if(allPrivate) return;
    setErr(null);
    for(const s of sections){
      if(valueOf(s) !== "private"){
        setSavingSection(s.key);
        const r = await onChange(s.key, "private");
        if(!r.ok){ setSavingSection(null); setErr(r.error || "Couldn't save"); return; }
      }
    }
    setSavingSection(null);
  };
  return html`<div class="collection-sharing">
    <div class="collection-sharing-hint">
      Choose who can see each section. <b>Private</b> = only you · <b>Unlisted</b> = anyone with the link ·
      <b>Public</b> = visible from your profile to anyone.
    </div>
    ${sections.map(s => html`
      <label key=${s.key} class="collection-sharing-row">
        <span class="collection-sharing-label">${s.label}</span>
        <select value=${valueOf(s)}
          disabled=${savingSection === s.key}
          onChange=${e => change(s.key, e.target.value)}>
          <option value="private">Private</option>
          <option value="unlisted">Unlisted (link only)</option>
          <option value="public">Public</option>
        </select>
      </label>
    `)}
    ${(anyPublic || anyUnlisted) && html`<div class="collection-sharing-links">
      ${anyPublic && html`<button class="settings-action" onClick=${()=>copy(publicUrl, "public")}>
        ${copied === "public" ? "✓ Copied" : "Copy public link"}
      </button>`}
      ${anyUnlisted && html`<button class="settings-action" onClick=${()=>copy(unlistedUrl, "unlisted")}>
        ${copied === "unlisted" ? "✓ Copied" : "Copy unlisted link"}
      </button>`}
    </div>`}
    <div class="collection-sharing-actions">
      ${anyUnlisted && html`<button class="settings-action link" disabled=${regenBusy} onClick=${regen}>
        ${regenBusy ? "Working…" : "Regenerate unlisted link"}
      </button>`}
      ${!allPrivate && html`<button class="settings-action link danger" onClick=${makeAllPrivate}>
        Make all private
      </button>`}
    </div>
    ${err && html`<div class="collection-sharing-err">${err}</div>`}
  </div>`;
}

// Minimal CSV parser that handles quoted fields with embedded commas /
// doubled-quotes — sufficient for Dreamborn exports.
function parseCsvText(text){
  text = text.replace(/^﻿/, ""); // strip BOM if present
  const rows = [];
  let cur = "", row = [], inQ = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQ){
      if(c==='"' && text[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ = false; }
      else cur += c;
    } else {
      if(c===','){ row.push(cur); cur=""; }
      else if(c==='"' && cur===""){ inQ = true; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){ /* skip */ }
      else cur += c;
    }
  }
  if(cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// Foil printing preference — different cards may use any of these strings,
// and CSV "Foil" maps to whichever is present.
const FOIL_PRINTING_PREF = ["Foil","Cold Foil","Holofoil"];

// Normalize card names for fuzzy matching. Dreamborn exports drift from
// Lorcast's canonical strings in three predictable ways:
//   - Title case vs sentence case ("Out Of Order" vs "Out of Order")
//   - Curly apostrophes vs straight ("He's" vs "He's")
//   - Whitespace around hyphens / extra spaces
// Lowercasing + quote/dash unification + whitespace collapse covers all
// observed cases without risking false positives (cards keep distinct
// names after normalization).
function normalizeCardName(s){
  return (s||"")
    .toLowerCase()
    .replace(/[‘’ʼʻ`´]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[–—]/g, "-")
    .replace(/\s*&\s*/g, " and ")
    .replace(/\s+/g, " ")
    .trim();
}
// Aggressive fallback key: strips all whitespace. Catches cases where word
// boundaries differ between sources, e.g. Dreamborn's "Tweedle Dee" vs
// Lorcast's "Tweedledee". Only consulted when the primary normalized key
// misses, so collision risk is acceptable.
function squashCardName(s){
  return normalizeCardName(s).replace(/\s+/g, "");
}

// Parse a Dreamborn-style CSV and resolve each row to (card_id, printing,
// qty) entries against our raw catalog (rowsByName index).
// Returns {entries, matchedCards, unmatched, totalNormal, totalFoil, error}.
function parseDreambornCsv(text, rowsByName){
  const rows = parseCsvText(text).filter(r => r.length && r.some(c => c && c.length));
  if(!rows.length) return {error:"CSV is empty."};
  const header = rows[0].map(h => h.trim().toLowerCase());
  const need = ["normal","foil","name"];
  for(const k of need){
    if(!header.includes(k)) return {error:`CSV is missing required column "${k}". Expected Dreamborn export format.`};
  }
  const idx = {
    normal: header.indexOf("normal"),
    foil:   header.indexOf("foil"),
    name:   header.indexOf("name"),
    number: header.indexOf("card number"),
  };
  const entries = [];
  const unmatched = [];
