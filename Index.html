  </section>`;
};

// Compact EV strip on Home: last 4 mainline sets, EV/box & EV/pack at
// current pricing, plus the TCGPlayer Booster Box price (linked through
// the affiliate wrapper when available). Tiny inline toggles let the
// user adjust the EV semantics without leaving the page.
const HomeEvStrip = ({sets, avgs, sealedPrices, setsMeta, onTitleClick}) => {
  const [nc, setNc] = useState(false);
  const [excludeBoth, setExcludeBoth] = useState(false);
  const lastFour = useMemo(() => {
    // sets is already MAINLINE_SETS oldest→newest; reverse + take 4.
    return (sets || []).slice().reverse().slice(0, 4);
  }, [sets]);
  const boxBySet = useMemo(() => {
    if(!sealedPrices) return {};
    const out = {};
    for(const row of sealedPrices){
      if(row.product_type !== "Booster Box") continue;
      const nm = (row.name || "").toLowerCase();
      if(nm.includes("case")) continue;
      const price = row.low_price != null ? parseFloat(row.low_price) : null;
      if(price == null) continue;
      const prev = out[row.set_id];
      if(!prev || prev.price > price){
        out[row.set_id] = {
          price, name: row.name,
          url: tcgUrl(row.tcgplayer_product_id),
        };
      }
    }
    return out;
  }, [sealedPrices]);
  // setsMeta is the authoritative set_id↔name map. Prefer set_id-based
  // matching so we don't depend on TCGPlayer's product naming staying
  // exactly in sync with our display names.
  const setIdByName = useMemo(() => {
    const m = {};
    for(const s of (setsMeta||[])) if(s?.name) m[s.name] = s.id;
    return m;
  }, [setsMeta]);
  const boxForSet = (setName) => {
    if(!sealedPrices) return null;
    const wantId = setIdByName[setName];
    let best = null;
    for(const row of sealedPrices){
      if(row.product_type !== "Booster Box") continue;
      const nm = (row.name || "").toLowerCase();
      if(nm.includes("case")) continue;
      // Prefer set_id match. Fall back to name substring if set_id absent.
      const idMatch   = wantId && row.set_id === wantId;
      const nameMatch = !wantId && nm.includes(setName.toLowerCase());
      if(!idMatch && !nameMatch) continue;
      if(row.low_price == null) continue;
      const px = parseFloat(row.low_price);
      if(!best || px < best.price) best = {
        price: px,
        url: tcgUrl(row.tcgplayer_product_id),
      };
    }
    return best;
  };
  const excludeSet = useMemo(() => excludeBoth ? new Set(["Enchanted","Iconic"]) : new Set(), [excludeBoth]);
  if(!lastFour.length) return null;
  return html`<div class="home-ev-strip">
    <div class="home-ev-strip-head">
      ${onTitleClick
        ? html`<button class="home-ev-strip-title home-title-link" onClick=${onTitleClick}
            title="Open Analytics → Expected Value">Recent set EV</button>`
        : html`<div class="home-ev-strip-title">Recent set EV</div>`}
      <div class="home-ev-strip-toggles">
        <label title="Treat cards under $1 as $0 — filters bulk pennies out of the average.">
          <input type="checkbox" checked=${nc} onChange=${e=>setNc(e.target.checked)}/>${" <$1→$0"}
        </label>
        <label title="Drop Enchanted + Iconic from EV. Excludes ultra-rare chase pulls.">
          <input type="checkbox" checked=${excludeBoth} onChange=${e=>setExcludeBoth(e.target.checked)}/> No chase
        </label>
      </div>
    </div>
    <div class="home-ev-strip-table">
      <div class="home-ev-strip-row home-ev-strip-head-row">
        <div>Set</div>
        <div class="num">EV / box</div>
        <div class="num">EV / pack</div>
        <div class="num">Box price</div>
      </div>
      ${lastFour.map(setName => {
        const ev = calcEV(avgs, setName, nc, excludeSet, "low");
        const box = boxForSet(setName);
        const diff = (box && ev) ? (ev - box.price) : null;
        return html`<div key=${setName} class="home-ev-strip-row">
          <div class="home-ev-strip-set">${setName}</div>
          <div class="num">${fmt(ev)}</div>
          <div class="num muted">${fmt(ev ? ev/24 : null)}</div>
          <div class="num">
            ${box
              ? html`${box.url
                  ? html`<a href=${box.url} target="_blank" rel="noopener nofollow" class="home-ev-strip-box-link">${fmt(box.price)}<span class="ext">↗</span></a>`
                  : fmt(box.price)}
                ${diff != null && html`<span class=${"home-ev-strip-diff "+(diff>=0?"up":"down")}>${diff>=0?"+":""}${fmt(diff)}</span>`}`
              : html`<span class="muted">—</span>`}
          </div>
        </div>`;
      })}
    </div>
  </div>`;
};

// Compact deck-activity feed for the Home sidebar. Independent fetch from
// the Decks tab's followingFeed / favoritedDecks (kept inside DecksView)
// to avoid lifting that state up. We union followed-creator decks AND
// favorited decks, sort by updated_at desc, and cap at 15.
//
// Visibility handling:
// - Followed creators: their PUBLIC decks via direct query. (Unlisted decks
//   from creators you follow stay link-only — RLS blocks direct read.)
// - Favorited decks: split by share_token. Favourites stored without a
//   token = public/owner read via direct query. Favourites with a token =
//   unlisted deck → fetch via the SECURITY DEFINER get_shared_deck RPC,
//   which bypasses RLS as long as the token matches. This lets users see
//   updates to unlisted decks they're authorised to view.
const FollowingFeed = ({user, onSignIn, raw, openDeckById, onTitleClick}) => {
  const titleEl = onTitleClick
    ? html`<button class="home-feed-title home-feed-title-link" onClick=${onTitleClick}
        title="Open Decks → Following">Following</button>`
    : html`<div class="home-feed-title">Following</div>`;
  const [entries, setEntries] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    if(!user){ setEntries(null); return; }
    let cancelled = false;
    // Cache key per user so feeds don't leak across accounts.
    const CACHE_KEY = "packsink:following:v1:" + user.id.slice(0,8);
    const cached = readJsonCache(CACHE_KEY, 30 * 60 * 1000);  // 30min TTL
    if(cached && Array.isArray(cached.data)){
      setEntries(cached.data);
      if(!cached.stale) return ()=>{ cancelled = true; };
      // Fall through and refresh in background.
    }
    (async () => {
      try {
        const [{data: followRows}, {data: favRows}] = await Promise.all([
          sbClient.from("user_follows").select("followed_id").eq("follower_id", user.id),
          sbClient.from("deck_favorites").select("deck_id,share_token").eq("user_id", user.id),
        ]);
        const followedIds = (followRows || []).map(r => r.followed_id);
        const directFavIds = (favRows || []).filter(r => !r.share_token).map(r => r.deck_id);
        const tokenFavs    = (favRows || []).filter(r =>  r.share_token);
        const tokenByDeck  = Object.fromEntries((favRows || []).map(r => [r.deck_id, r.share_token || null]));

        const directTasks = [];
        if(followedIds.length){
          directTasks.push(sbClient.from("decks")
            .select("id,user_id,name,inks,visibility,created_at,updated_at,share_token")
            .in("user_id", followedIds)
            .eq("visibility", "public")
            .order("updated_at", {ascending:false})
            .limit(30));
        }
        if(directFavIds.length){
          directTasks.push(sbClient.from("decks")
            .select("id,user_id,name,inks,visibility,created_at,updated_at,share_token")
            .in("id", directFavIds)
            .order("updated_at", {ascending:false})
            .limit(30));
        }
        const tokenTasks = tokenFavs.map(({deck_id, share_token}) =>
          sbClient.rpc("get_shared_deck", {p_deck_id: deck_id, p_token: share_token})
            .then(({data, error}) => (error ? null : (data && data[0]) || null))
            .catch(() => null)
        );

        const [directResults, tokenResults] = await Promise.all([
          Promise.all(directTasks),
          Promise.all(tokenTasks),
        ]);
        if(cancelled) return;

        const combined = new Map();
        for(const r of directResults){
          if(r.error) continue;
          for(const d of (r.data || [])){
            if(!combined.has(d.id)) combined.set(d.id, d);
          }
        }
        for(const d of tokenResults){
          if(d && !combined.has(d.id)) combined.set(d.id, d);
        }
        const decks = Array.from(combined.values())
          .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
          .slice(0, 15);
        if(!decks.length){ setEntries([]); writeJsonCache(CACHE_KEY, []); return; }

        // Index the catalog two ways:
        // - card_id -> {inks, name, set}: per-printing metadata
        // - Product Name -> Set<set name>: every set the card has ever been
        //   printed in. Used for reprint-aware Core legality — a card
        //   reprinted in a Core-legal set is Core-legal regardless of which
        //   printing the user happened to add to the deck.
        const cardMetaById = new Map();
        const setsByProductName = new Map();
        if(raw && raw.length){
          for(const r of raw){
            const inks = r.inks && r.inks.length ? r.inks : (r.ink ? [r.ink] : []);
            const name = r["Product Name"];
            if(r.card_id && !cardMetaById.has(r.card_id)){
              cardMetaById.set(r.card_id, {inks, name, set: r.Set});
            }
            if(name && r.Set){
              let bag = setsByProductName.get(name);
              if(!bag){ bag = new Set(); setsByProductName.set(name, bag); }
              bag.add(r.Set);
            }
          }
        }
        // Per-deck cards we've pulled. Used for both ink + format compute.
        // Direct query first (bulk, fast). Unlisted-from-followed decks
        // get a per-deck get_shared_deck_cards RPC fallback.
        const cardsByDeck = {};
        const needCompute = decks.filter(d => !(d.inks && d.inks.length));
        const allFetchIds = decks.map(d => d.id);
        if(allFetchIds.length && cardMetaById.size){
          const {data: dcRows} = await sbClient.from("deck_cards")
            .select("deck_id,card_id,quantity").in("deck_id", allFetchIds);
          const seen = {};
          for(const dc of (dcRows || [])){
            seen[dc.deck_id] = true;
            (cardsByDeck[dc.deck_id] = cardsByDeck[dc.deck_id] || []).push(dc);
          }
          const rpcCandidates = decks.filter(d => !seen[d.id] && d.share_token);
          if(rpcCandidates.length){
            const rpcResults = await Promise.all(rpcCandidates.map(d =>
              sbClient.rpc("get_shared_deck_cards", {p_deck_id: d.id, p_token: d.share_token})
                .then(({data, error}) => ({deckId: d.id, rows: error ? [] : (data || [])}))
                .catch(() => ({deckId: d.id, rows: []}))
            ));
            for(const {deckId, rows} of rpcResults) cardsByDeck[deckId] = rows;
          }
        }
        const coreSets = new Set(typeof computeCoreSets === "function" ? computeCoreSets() : []);
        const computedInks = {};
        const formatByDeck = {};
        for(const d of decks){
          const cards = cardsByDeck[d.id] || [];
          const inkSet = new Set();
          let totalQty = 0;
          let allInCore = cards.length > 0;
          let anyCardKnown = false;
          for(const dc of cards){
            totalQty += (dc.quantity || 0);
            const meta = cardMetaById.get(dc.card_id);
            if(!meta) continue;
            anyCardKnown = true;
            for(const i of meta.inks) inkSet.add(i);
            // Reprint-aware Core check: card is Core-legal if ANY of its
            // printings (across the catalog) sits in a Core set, not just
            // the specific printing in this deck.
            const allSetsForCard = setsByProductName.get(meta.name) || new Set([meta.set]);
            let hasCorePrinting = false;
            for(const s of allSetsForCard){ if(coreSets.has(s)){ hasCorePrinting = true; break; } }
            if(!hasCorePrinting) allInCore = false;
          }
          computedInks[d.id] = inkSet;
          // Legality: >=60 cards AND <=2 inks. (60 is the minimum; over is OK.)
          // If we couldn't resolve any cards for this deck, fall back to "infinity"
          // so we don't silently hide the tag.
          let fmt;
          if(!anyCardKnown){
            fmt = "infinity";
          } else if(totalQty < 60 || inkSet.size > 2){
            fmt = "invalid";
          } else if(allInCore){
            fmt = "core";
          } else {
            fmt = "infinity";
          }
          formatByDeck[d.id] = fmt;
        }

        const creatorIds = Array.from(new Set(decks.map(d => d.user_id)));
        const {data: profiles} = await sbClient.from("profiles")
          .select("user_id,display_name,avatar_url")
          .in("user_id", creatorIds);
        if(cancelled) return;
        const profileById = {};
        for(const p of (profiles || [])) profileById[p.user_id] = p;
        const computedEntries = decks.map(d => {
          const inks = (d.inks && d.inks.length)
            ? d.inks
            : (computedInks[d.id] ? Array.from(computedInks[d.id]) : []);
          const fmtKey = formatByDeck[d.id] || "infinity";
          return {
            deck: {...d, inks},
            creator: profileById[d.user_id] || null,
            isPublish: Math.abs(new Date(d.updated_at) - new Date(d.created_at)) < 3*60*1000,
            shareToken: tokenByDeck[d.id] || null,
            formatKey: fmtKey,
            formatLabel: fmtKey === "core" ? "Core" : (fmtKey === "infinity" ? "Inf" : null),
          };
        });
        setEntries(computedEntries);
        writeJsonCache(CACHE_KEY, computedEntries);
      } catch(e){
        if(!cancelled) setErr(String(e?.message || e).slice(0, 200));
      }
    })();
    return () => { cancelled = true; };
    // Deliberately depend on user only — the deck-list query doesn't need
    // the catalog. raw is consumed below to enrich ink/format tags; if it
    // hasn't loaded yet, tags appear on the next render (the effect below
    // re-runs format inference when raw arrives). Old behavior was to wait
    // for raw, which made Following appear several seconds late on cold
    // loads when the catalog cache was empty.
  }, [user]);

  if(!user){
    return html`<aside class="home-feed">
      ${titleEl}
      <div class="home-feed-empty">
        Sign in to see new decks from creators you follow and decks you've favorited.
        <button class="active home-feed-signin" onClick=${onSignIn}>Sign in with Google</button>
      </div>
    </aside>`;
  }
  if(err) return html`<aside class="home-feed">
    ${titleEl}
    <div class="home-feed-empty">Couldn't load feed: ${err}</div>
  </aside>`;
  if(entries == null) return html`<aside class="home-feed">
    ${titleEl}
    <div class="home-feed-empty muted">Loading…</div>
  </aside>`;
  if(entries.length === 0) return html`<aside class="home-feed">
    ${titleEl}
    <div class="home-feed-empty">
      No activity yet. Favorite a deck or follow a creator from the Decks tab to fill this feed.
    </div>
  </aside>`;
  return html`<aside class="home-feed">
    ${titleEl}
    <ul class="home-feed-list">
      ${entries.map(({deck, creator, isPublish, shareToken, formatKey, formatLabel}) => {
        const params = new URLSearchParams();
        params.set("deck", deck.id);
        if(deck.visibility !== "public" && shareToken) params.set("token", shareToken);
        const href = "/decks?" + params.toString();
        const inks = (deck.inks && deck.inks.length) ? deck.inks : [];
        // In-app navigation: prevent the default <a> navigation so the
        // browser doesn't request /decks?... from the server (which 404s
        // on dev servers without SPA fallback). Right-click / middle-click
        // / Ctrl-click still get the real href, so "open in new tab"
        // continues to work.
        const onLinkClick = (e) => {
          if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
          if(typeof openDeckById === "function"){
            e.preventDefault();
            openDeckById(deck.id, shareToken);
          }
        };
        return html`<li key=${deck.id} class="home-feed-item">
          <a href=${href} class="home-feed-link"
            onClick=${onLinkClick}
            title=${(creator?.display_name || "Someone") + " " + (isPublish?"published":"updated") + " " + (deck.name || "Untitled deck")}>
            <span class="home-feed-verb-dot ${isPublish?"pub":"upd"}" aria-hidden="true"></span>
            <span class="home-feed-main">
              <span class="home-feed-deckname-line">
                <span class="home-feed-deckname">${deck.name || "Untitled deck"}</span>
                ${formatLabel && html`<span class=${"home-feed-fmt-tag fmt-"+formatKey} title=${formatKey==="core"?"Core Constructed":"Infinity"}>${formatLabel}</span>`}
              </span>
              <span class="home-feed-meta">
                <span class="home-feed-creator">${creator?.display_name || "Someone"}</span>
                <span> · ${isPublish ? "new" : "updated"} ${relativeTime(deck.updated_at)}</span>
              </span>
            </span>
            <span class="home-feed-inks">
              ${inks.map((ink, i) => {
                // Defensive lookup: decks.inks rows have inconsistent casing
                // ("Amber" / "amber" / "AMBER"). INK_ICONS keys are TitleCase.
                if(!ink) return null;
                const key = String(ink).charAt(0).toUpperCase() + String(ink).slice(1).toLowerCase();
                const src = INK_ICONS[key];
                if(!src) return null;
                return html`<img key=${i} src=${src} alt=${key} title=${key} class="home-feed-ink-icon"/>`;
              })}
            </span>
          </a>
        </li>`;
      })}
    </ul>
  </aside>`;
};

// Home-page tournament-results banner. Fetches recent tournaments + their
// results (top 4 per tournament, newest tournaments first, max 16 decks
// total). Renders as a grid below the Following feed. Deck clicks open the
// deck via openDeckById; tournament-name clicks jump to that tournament's
// detail page via openTournamentById.
const TournamentResultsBanner = ({raw, openDeckById, openTournamentById, openTournamentsList}) => {
  const [groups, setGroups] = useState(null);  // [{tournament, decks:[...]}]
  const [err, setErr] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const CACHE_KEY = "packsink:home:tourneys:v1";
    const cached = readJsonCache(CACHE_KEY, 2 * 60 * 60 * 1000);  // 2h TTL
    if(cached && Array.isArray(cached.data)){
      setGroups(cached.data);
      if(!cached.stale) return ()=>{ cancelled = true; };
    }
    (async () => {
      try {
        const {data: ts} = await sbClient.from("tournaments")
          .select("id,name,event_date,format,num_players,inserted_at")
          .order("event_date", {ascending:false, nullsFirst:false})
          .order("inserted_at", {ascending:false})
          .limit(8);
        const tournaments = ts || [];
        if(!tournaments.length){ if(!cancelled){ setGroups([]); writeJsonCache(CACHE_KEY, []); } return; }
        const ids = tournaments.map(t => t.id);
        const {data: rs} = await sbClient.from("tournament_results_v")
          .select("tournament_id,result_id,place,place_rank,player_name,deck_id,deck_name,deck_inks,deck_share_token")
          .in("tournament_id", ids)
          .order("place_rank", {ascending:true, nullsFirst:false});
        const byTournament = {};
        for(const r of (rs || [])){
          (byTournament[r.tournament_id] = byTournament[r.tournament_id] || []).push(r);
        }
        let totalSoFar = 0;
        const out = [];
        for(const t of tournaments){
          if(totalSoFar >= 16) break;
          const slice = (byTournament[t.id] || []).slice(0, 4);
          if(!slice.length) continue;
          const take = slice.slice(0, Math.max(0, 16 - totalSoFar));
          out.push({tournament: t, decks: take});
          totalSoFar += take.length;
        }
        if(!cancelled){ setGroups(out); writeJsonCache(CACHE_KEY, out); }
      } catch(e) {
        if(!cancelled) setErr(String(e?.message || e).slice(0,200));
      }
    })();
    return () => { cancelled = true; };
  }, []);
  // Section header — clicks the title to jump to Decks → Tournaments.
  const titleEl = openTournamentsList
    ? html`<button class="home-feed-title home-feed-title-link"
        onClick=${openTournamentsList}
        title="See all tournaments">Tournament Results</button>`
    : html`<div class="home-feed-title">Tournament Results</div>`;
  if(err) return null;
  if(groups == null) return html`<aside class="home-feed">
    ${titleEl}
    <div class="home-feed-empty muted">Loading…</div>
  </aside>`;
  if(groups.length === 0) return null;
  return html`<aside class="home-feed">
    ${titleEl}
    <div class="home-tourney-list">
      ${groups.map(({tournament: t, decks}) => html`<div key=${t.id} class="home-tourney-block">
        <button class="home-tourney-name"
          onClick=${()=>openTournamentById && openTournamentById(t.id)}
          title="View this tournament">
          ${t.name}
          ${(t.num_players || t.format) ? html`<span class="muted"> ${[
            t.num_players ? `${t.num_players}p` : null,
            t.format ? (t.format === "core" ? "Core" : "Infinity") : null,
          ].filter(Boolean).join(" · ")}</span>` : null}
        </button>
        <ul class="home-tourney-decks">
          ${decks.map(r => html`<li key=${r.result_id}>
            <button class="home-tourney-deck"
              disabled=${!r.deck_id}
              onClick=${()=>r.deck_id && openDeckById && openDeckById(r.deck_id, r.deck_share_token)}
              title=${(r.player_name || "Unknown") + " · " + (r.deck_name || "Untitled")}>
              <span class="ht-place">${r.place || "—"}</span>
              <span class="ht-player">${r.player_name || "Unknown"}: <span class="ht-deck">${r.deck_name || "Untitled"}</span></span>
              <span class="ht-inks">
                ${(r.deck_inks||[]).map((ink, i) => {
                  if(!ink) return null;
                  const key = String(ink).charAt(0).toUpperCase() + String(ink).slice(1).toLowerCase();
                  const src = INK_ICONS[key];
                  return src ? html`<img key=${i} src=${src} alt=${key} title=${key}/>` : null;
                })}
              </span>
            </button>
          </li>`)}
        </ul>
      </div>`)}
    </div>
  </aside>`;
};

// Quick-search bar on the home page. Lightweight typeahead over `raw` —
// matches by Product Name substring. Enter (or clicking "Search") opens the
// Cards tab with the typed query pre-applied. Clicking a suggestion does the
// same but also opens that card's detail modal on landing.
const HomeQuickSearch = ({raw, openCardsWithSearch}) => {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [idx, setIdx] = useState(0);
  const inputRef = useRef(null);
  // Build one entry per Product Name. Enchanted / Iconic / Epic variants
  // live under different card_ids — collapsing by name avoids duplicate
  // "Stitch - Carefree Surfer" rows for the Normal + Enchanted printings.
  // Prefer Normal printing for the thumbnail and prefer non-chase rarities
  // as the canonical click target so picking the suggestion lands on the
  // base card, not its $400 Enchanted twin.
  const byCard = useMemo(() => {
    const m = new Map();
    const isChase = (rar) => /Enchanted|Iconic|Epic/i.test(rar || "");
    for(const r of (raw || [])){
      const name = r["Product Name"];
      if(!name) continue;
      const cur = m.get(name);
      if(!cur){ m.set(name, r); continue; }
      // Replacement rule: prefer non-chase over chase, then Normal printing.
      const curChase = isChase(cur.Rarity);
      const rChase   = isChase(r.Rarity);
      if(curChase && !rChase){ m.set(name, r); continue; }
      if(!curChase && rChase) continue;
      if(cur.tcg_printing !== "Normal" && r.tcg_printing === "Normal"){
        m.set(name, r);
      }
    }
    return Array.from(m.values());
  }, [raw]);
  const suggestions = useMemo(() => {
    const s = q.trim().toLowerCase();
    if(s.length < 2) return [];
    // Tokenize: every whitespace-separated word must appear somewhere in
    // the card's Product Name. "stitch surfer" → matches "Stitch - Carefree
    // Surfer". Within hits, rank by how closely they reflect the query:
    //   1. Full string startsWith (best — exact name prefix)
    //   2. Full string includes (substring contiguous)
    //   3. All tokens present anywhere (default for multi-word queries)
    const tokens = s.split(/\s+/).filter(Boolean);
    const scored = [];
    for(const r of byCard){
      const name = (r["Product Name"] || "").toLowerCase();
      if(!name) continue;
      // Token gate first — cheap reject for non-matches.
      let allHit = true;
      for(const t of tokens){ if(!name.includes(t)){ allHit = false; break; } }
      if(!allHit) continue;
      let rank;
      if(name.startsWith(s))      rank = 0;
      else if(name.includes(s))   rank = 1;
      else                        rank = 2;
      scored.push({r, rank, name});
    }
    scored.sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name));
    return scored.slice(0, 8).map(x => x.r);
  }, [q, byCard]);
  const handleSubmit = () => {
    const txt = q.trim();
    if(!txt) return;
    openCardsWithSearch && openCardsWithSearch(txt);
  };
  const handlePick = (r) => {
    openCardsWithSearch && openCardsWithSearch(r["Product Name"], r.card_id);
  };
  return html`<div class="home-quick-search">
    <input type="search" ref=${inputRef}
      placeholder="Search every card · press Enter to browse"
      value=${q}
      onFocus=${()=>setOpen(true)}
      onBlur=${()=>setTimeout(()=>setOpen(false), 150)}
      onInput=${e=>{ setQ(e.target.value); setIdx(0); setOpen(true); }}
      onKeyDown=${e=>{
        if(e.key === "Enter"){
          e.preventDefault();
          if(open && suggestions.length && idx >= 0 && idx < suggestions.length){
            handlePick(suggestions[idx]);
          } else {
            handleSubmit();
          }
        } else if(e.key === "ArrowDown" && suggestions.length){
          e.preventDefault(); setIdx(i => (i+1) % suggestions.length); setOpen(true);
        } else if(e.key === "ArrowUp" && suggestions.length){
          e.preventDefault(); setIdx(i => (i-1+suggestions.length) % suggestions.length); setOpen(true);
        } else if(e.key === "Escape"){
          setOpen(false);
        }
      }}/>
    <button class="home-quick-search-go" onClick=${handleSubmit}
      title="Open the Cards tab with this search">Search</button>
    ${open && suggestions.length > 0 && html`<div class="home-quick-search-list" role="listbox">
      ${suggestions.map((r, i) => html`<button key=${r.card_id}
        class=${"home-quick-search-item" + (i === idx ? " active" : "")}
        role="option" aria-selected=${i === idx}
        onMouseDown=${e=>e.preventDefault()}
        onClick=${()=>handlePick(r)}>
        ${r.img_small && html`<img src=${r.img_small} alt="" loading="lazy"/>`}
        <div class="home-quick-search-item-text">
          <div class="home-quick-search-item-name">${r["Product Name"]}</div>
          <div class="home-quick-search-item-meta">${r.Set || ""} · ${r.Rarity || ""}</div>
        </div>
      </button>`)}
    </div>`}
  </div>`;
};

const HomeView = ({raw, sets, avgs, theme, user, collection, collectionLoading, sealedPrices, sealedCollection, setsMeta, updateQty, onSignIn, openDeckById, openTournamentById, openTournamentsList, openView, openDecksSection, openCardsWithSearch, openScreenerWithFilter}) => {
  // Convenience: nav shortcuts wired below from header click handlers.
  const goScreener   = openView ? (()=>openView("screener"))   : null;
  const goAnalytics  = openView ? (()=>openView("market"))     : null;
  const goCollection = openView ? (()=>openView("collection")) : null;
  const goFollowing  = openDecksSection ? (()=>openDecksSection("following")) : null;
  // Build a Screener filter payload from the home banner's current state.
  // - "chase"   → rarities = Enchanted/Iconic/Epic, sort by current window
  // - "rareLeg" → rarities = Rare/Super Rare/Legendary
  // - "newest"  → filter set = newest released set, sort by Low desc
  // Direction (gainers / losers / both) mirrors the home toggle.
  const openBannerInScreener = (which) => {
    if(!openScreenerWithFilter) return goScreener && goScreener();
    const w = MOVER_WIN_BY_KEY[windowKey] || MOVER_WIN_BY_KEY["1d"];
    const winColLow = w.pctLow; // e.g. "pct_1d"
    const absWinKey = "abs_pct_" + winColLow.slice("pct_".length); // "abs_pct_1d"
    const bothDirs  = showUp && showDown;
    const direction = bothDirs ? "gainers" // preset is "all" via override below
                    : (showUp && !showDown) ? "gainers"
                    : (showDown && !showUp) ? "losers"
                    : "gainers";
    // When both directions are toggled on (the banner's default), sort by
    // absolute Δ% so positive AND negative movers interleave by magnitude —
    // matches what the home banner shows. Otherwise sort signed by the
    // single chosen direction.
    const base = {
      preset: bothDirs ? "movers" : direction,
      moverWin: winColLow,
      sortKey: bothDirs ? absWinKey : winColLow,
      sortDesc: true,
      priceMode: "low",
      minPrice: "5",
    };
    if(which === "chase"){
      openScreenerWithFilter({...base, filterRarities: ["Enchanted","Iconic","Epic"]});
    } else if(which === "rareLeg"){
      openScreenerWithFilter({...base, filterRarities: ["Rare","Super Rare","Legendary"]});
    } else if(which === "promo"){
      openScreenerWithFilter({...base, filterRarities: ["Promo"]});
    } else if(which === "newest"){
      openScreenerWithFilter({
        preset: "all",
        moverWin: "pct_1d",
        sortKey: "low_today", sortDesc: true,
        priceMode: "low",
        filterSet: NEWEST_SET || "",
        filterRarities: valuableMode === "chase"
          ? ["Enchanted","Iconic","Epic"]
          : ["Common","Uncommon","Rare","Super Rare","Legendary"],
        minPrice: "",
      });
    }
  };
  const [state, setState] = useState({rows:null, loading:true, error:null});
  const [selectedGroup, setSelectedGroup] = useState(null);
  const [windowKey, setWindowKey] = useState("1d");
  const [showUp, setShowUp] = useState(true);
  const [showDown, setShowDown] = useState(true);
  const [paused, setPaused] = useState(false);
  // Most-Valuable banner: "main" (non-chase rarities) vs "chase".
  const [valuableMode, setValuableMode] = useState(() => {
    try {
      const v = localStorage.getItem("packsink:home:valuableMode");
      return (v === "chase" || v === "main") ? v : "main";
    } catch { return "main"; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:home:valuableMode", valuableMode); } catch {}
  }, [valuableMode]);

  // Resolve a mover (carries card_id + tcgplayer_product_id) to the
  // CardDetailModal-shaped "group" via O(1) lookups instead of scanning
  // `raw` (~1500 rows) on every click.
  const {rowsByCardId, rowsByPid} = useMemo(()=>{
    const byCard = new Map(), byPid = new Map();
    if(raw) for(const r of raw){
      if(r.card_id){
        const a = byCard.get(r.card_id); if(a) a.push(r); else byCard.set(r.card_id, [r]);
      }
      if(r.tcgplayer_product_id != null){
        const a = byPid.get(r.tcgplayer_product_id); if(a) a.push(r); else byPid.set(r.tcgplayer_product_id, [r]);
      }
    }
    return {rowsByCardId: byCard, rowsByPid: byPid};
  }, [raw]);
  const openCard = useCallback((mover) => {
    let rows = mover.card_id ? rowsByCardId.get(mover.card_id) : null;
    if(!rows && mover.tcgplayer_product_id != null){
      rows = rowsByPid.get(mover.tcgplayer_product_id);
    }
    if(!rows || !rows.length) return;
    const g = groupCards(rows)[0];
    if(g) setSelectedGroup(g);
  }, [rowsByCardId, rowsByPid]);

  useEffect(()=>{
    let cancelled = false;
    // Hydrate from cache instantly so the banner doesn't go blank on
    // tab-return. price_movers updates daily; 12h TTL is safe.
    const CACHE_KEY = "packsink:movers:v1";
    const cached = readJsonCache(CACHE_KEY, 12 * 60 * 60 * 1000);
    if(cached && Array.isArray(cached.data) && cached.data.length){
      setState({rows: cached.data, loading:false, error:null});
      if(!cached.stale) return ()=>{ cancelled = true; };
      // Fall through and background-refresh.
    }
    sbClient.from("price_movers")
      .select("card_id,set_id,name,version,rarity,ink,collector_number,image_small,image_normal,tcgplayer_product_id,printing,low_today,low_prev,low_7d,low_30d,low_90d,low_180d,low_365d,pct_1d,pct_7d,pct_30d,pct_90d,pct_180d,pct_365d,abs_pct_1d,market_today,market_prev,market_7d,market_30d,market_90d,market_180d,market_365d,mkt_pct_1d,mkt_pct_7d,mkt_pct_30d,mkt_pct_90d,mkt_pct_180d,mkt_pct_365d")
      .order("abs_pct_1d", {ascending:false, nullsFirst:false})
      .limit(5000)
      .then(({data, error}) => {
        if(cancelled) return;
        if(error){
          const msg = String(error.message||error||"");
          let friendly;
          if(msg.match(/relation|does not exist|404|schema cache/i))
            friendly = "Run supabase/10_price_movers_matview.sql in Supabase to enable Movers.";
          else if(msg.includes("57014") || msg.includes("timeout"))
            friendly = "Movers query timed out — consider promoting price_movers to a materialized view.";
          else
            friendly = "Movers fetch error: " + msg.slice(0,200);
          // Only surface error if we have no cached data to show.
          if(!cached) setState({rows:null, loading:false, error:friendly});
        } else {
          // Same normalization as the Screener side — cards.rarity ships
          // "Super_rare" (underscore) from Lorcast and would otherwise miss
          // the RARELEG_RARS filter on the rare-leg banner.
          const rows = (data || []).map(r => ({...r, rarity: normalizeRarity(r.rarity)}));
          setState({rows, loading:false, error:null});
          writeJsonCache(CACHE_KEY, data || []);
        }
      });
    return ()=>{ cancelled = true; };
  },[]);

  const {chase, rareLeg, promo} = useMemo(()=>{
    if(!state.rows) return {chase:[], rareLeg:[]};
    const win = MOVER_WIN_BY_KEY[windowKey] || MOVER_WIN_BY_KEY["1d"];
    const qualifies = (r) => {
      const pct = r[win.pctLow];
      const prior = r[win.lowCol];
      // Apply the "started above $5" floor for the SELECTED window — the
      // matview only enforced "at any window", so we re-apply here against
      // the prior price for this specific window.
      if(pct == null || prior == null || prior < 5) return false;
      if(pct > 0 && !showUp) return false;
      if(pct < 0 && !showDown) return false;
      if(pct === 0) return false; // a 0% move isn't a "mover"
      return true;
    };
    const chase=[], rareLeg=[], promo=[];
    for(const r of state.rows){
      if(!qualifies(r)) continue;
      if(CHASE_RARS.has(r.rarity)) chase.push(r);
      else if(RARELEG_RARS.has(r.rarity)) rareLeg.push(r);
      else if(r.rarity === "Promo") promo.push(r);
    }
    // Sort each bucket by the selected window. Both-directions on → sort by
    // abs(pct) so the largest movers (gains OR drops) rank first. Single
    // direction on → sort signed (gainers desc, droppers asc).
    const cmpAbs    = (a,b) => Math.abs(b[win.pctLow]) - Math.abs(a[win.pctLow]);
    const cmpDesc   = (a,b) => b[win.pctLow] - a[win.pctLow];   // biggest gains first
    const cmpAsc    = (a,b) => a[win.pctLow] - b[win.pctLow];   // biggest drops first
    const cmp = (showUp && showDown) ? cmpAbs
              : showUp ? cmpDesc
              : showDown ? cmpAsc
              : cmpAbs;
    chase.sort(cmp);
    rareLeg.sort(cmp);
    promo.sort(cmp);
    // price_movers only carries image_small + image_normal. Several Challenge
    // Promo C1 cards (Rapunzel - Gifted with Healing, Dragon Fire, Let It Go,
    // Cinderella - Stouthearted) have ONLY image_large populated in Lorcast
    // — both other fields are empty strings — so the matview returns "" for
    // those tiles and MoverTile falls through to its text placeholder.
    //
    // Enrich from the main catalog (raw). Note: writeCache STRIPS img_large
    // from cached rows to save localStorage quota (~30% savings), so we
    // can't read r.img_large directly. But buildRow's fallback chain sets
    // img_normal = c.image_normal || c.image_large || c.image_small — so
    // for these problem cards img_normal IS the large URL. Use it.
    const fallbackImgByCardId = {};
    if(raw){
      for(const r of raw){
        if(r.card_id && !fallbackImgByCardId[r.card_id]){
          fallbackImgByCardId[r.card_id] = r.img_normal || r.img_large || r.img_small || null;
        }
      }
    }
    const enrich = (arr) => arr.map(r => {
      if(r.image_small || r.image_normal || !r.card_id) return r;
      const fb = fallbackImgByCardId[r.card_id];
      // Inject as image_normal so MoverTile's existing image_large → image_normal → image_small chain picks it up.
      return fb ? {...r, image_normal: fb} : r;
    });
    return {
      chase:   enrich(chase  ).slice(0,20),
      rareLeg: enrich(rareLeg).slice(0,20),
      promo:   enrich(promo  ).slice(0,20),
    };
  }, [state.rows, windowKey, showUp, showDown, raw]);

  const directionLabel = (showUp && showDown) ? "|Δ%|"
                       : showUp ? "Δ% (gains)"
                       : showDown ? "Δ% (drops)"
                       : "Δ%";
  const winLabel = (MOVER_WIN_BY_KEY[windowKey]||{}).label || windowKey.toUpperCase();
  const visibleWindows = useMemo(()=>pickVisibleWindows(windowKey), [windowKey]);
  // Most Valuable banner shows the same three windows regardless of which
  // time frame is selected for the Movers banners — its purpose is absolute
  // value, not relative movement, so the global selector shouldn't change
  // what columns it displays.
  const VALUABLE_VISIBLE_WINDOWS = useMemo(()=>MOVER_WINDOWS.slice(0,3), []);

  // Index the movers matview rows by (card_id, printing) so we can splice in
  // delta data on any tile shown elsewhere on this page.
  const moversByKey = useMemo(()=>{
    const m = {};
    if(state.rows) for(const r of state.rows) m[r.card_id+":"+r.printing] = r;
    return m;
  }, [state.rows]);

  // "Most Valuable" banner — top 20 cards of the latest RELEASED set, by Low
  // price (fallback to Market). Walk MAINLINE_SETS from the end and pick
  // the first one that actually has priced cards in `raw`. Handles
  // unreleased sets at the tail (e.g., "Attack of the Vines" pre-release)
  // and never selects a promo / Extras bucket as "newest".
  const NEWEST_SET = useMemo(()=>{
    if(!raw || !raw.length) return null;
    const setsWithPrices = new Set();
    for(const r of raw){
      const p = parseP(r["Low Price"]) ?? parseP(r["TCGPlayer Market"]);
      if(p && p > 0) setsWithPrices.add(r.Set);
    }
    for(let i = MAINLINE_SETS.length - 1; i >= 0; i--){
      if(setsWithPrices.has(MAINLINE_SETS[i])) return MAINLINE_SETS[i];
    }
    return null;
  }, [raw]);
  const valuableCards = useMemo(()=>{
    if(!raw || !raw.length || !NEWEST_SET) return [];
    const chaseSet  = new Set(["Enchanted","Iconic","Epic"]);
    const mainSet   = new Set(["Common","Uncommon","Rare","Super Rare","Legendary"]);
    const isChase   = valuableMode === "chase";
    const targetSet = isChase ? chaseSet : mainSet;
    const priceOf   = (r) => parseP(r["Low Price"]) ?? parseP(r["TCGPlayer Market"]) ?? 0;
    const filtered = raw.filter(r =>
      r.Set === NEWEST_SET &&
      targetSet.has(r.Rarity) &&
      priceOf(r) > 0 &&
      // Main mode shows Normal prints only — foil variants would otherwise
      // crowd out the actual base set top 20. Chase mode keeps whatever
      // printing the data has (chases are inherently foil).
      (isChase || r.tcg_printing === "Normal"));
    filtered.sort((a,b) => priceOf(b) - priceOf(a));
    return filtered.slice(0, 20).map(c => {
      const k = c.card_id + ":" + c.tcg_printing;
      const m = moversByKey[k] || {};
      return {
        card_id: c.card_id,
        tcgplayer_product_id: c.tcgplayer_product_id,
        printing: c.tcg_printing,
        name: c["Product Name"],
        version: null,                              // already merged into name
        rarity: c.Rarity,
        image_large:  c.img_large,
        image_normal: c.img_normal,
        image_small:  c.img_small,
        low_today:    parseP(c["Low Price"])       ?? m.low_today    ?? null,
        low_prev:     m.low_prev    ?? null,
        market_today: parseP(c["TCGPlayer Market"])?? m.market_today ?? null,
        market_prev:  m.market_prev ?? null,
        pct_1d:       m.pct_1d   ?? null,
        pct_7d:       m.pct_7d   ?? null,
        pct_30d:      m.pct_30d  ?? null,
        pct_90d:      m.pct_90d  ?? null,
        pct_180d:     m.pct_180d ?? null,
        pct_365d:     m.pct_365d ?? null,
        mkt_pct_1d:   m.mkt_pct_1d   ?? null,
        mkt_pct_7d:   m.mkt_pct_7d   ?? null,
        mkt_pct_30d:  m.mkt_pct_30d  ?? null,
        mkt_pct_90d:  m.mkt_pct_90d  ?? null,
        mkt_pct_180d: m.mkt_pct_180d ?? null,
        mkt_pct_365d: m.mkt_pct_365d ?? null,
      };
    });
  }, [raw, valuableMode, moversByKey, NEWEST_SET]);

  const valuableControls = html`<div class="seg-grp" role="group" aria-label="Most valuable mode" style=${{padding:2}}>
    <button class=${valuableMode==="main"?"active":""}  onClick=${()=>setValuableMode("main")}  style=${{fontSize:11,padding:"3px 8px"}}>Main</button>
    <button class=${valuableMode==="chase"?"active":""} onClick=${()=>setValuableMode("chase")} style=${{fontSize:11,padding:"3px 8px"}}>Chase</button>
  </div>`;

  return html`<div class="scr">
    <div class="home-page-title">
      <h1 class="title-font" style=${{fontSize:16,fontWeight:700,margin:"0 0 2px",color:"var(--accent)",letterSpacing:0.5}}>Lorcana Market</h1>
      <p class="muted" style=${{fontSize:11,margin:0}}>
        Click a card for details · corner icon opens TCGPlayer.
      </p>
      <${HomeQuickSearch} raw=${raw} openCardsWithSearch=${openCardsWithSearch}/>
    </div>

    <div class="home-grid">
      <div class="home-left-col">
        <${FollowingFeed} user=${user} onSignIn=${onSignIn} raw=${raw} openDeckById=${openDeckById} onTitleClick=${goFollowing}/>
        <${TournamentResultsBanner} raw=${raw} openDeckById=${openDeckById} openTournamentById=${openTournamentById}
          openTournamentsList=${openTournamentsList}/>
      </div>
      <div class="home-grid-main">
        <div class="home-toolbar">
          <div class="seg-grp" role="group" aria-label="Time window">
            ${MOVER_WINDOWS.map(w => html`<button key=${w.key}
              class=${windowKey===w.key?"active":""}
              onClick=${()=>setWindowKey(w.key)}>${w.label}</button>`)}
          </div>
          <div class="dir-toggle">
            <label class=${showUp?"on-up":""}>
              <input type="checkbox" checked=${showUp} onChange=${e=>setShowUp(e.target.checked)}/>
              ▲ Gainers
            </label>
            <label class=${showDown?"on-down":""}>
              <input type="checkbox" checked=${showDown} onChange=${e=>setShowDown(e.target.checked)}/>
              ▼ Droppers
            </label>
          </div>
          <button onClick=${()=>setPaused(p=>!p)}
            title=${paused?"Resume scrolling":"Pause scrolling"}
            style=${{fontSize:12,padding:"5px 11px",border:"1px solid var(--border)",
              background:paused?"var(--accent)":"var(--stat-bg)",
              color:paused?"#fff":"var(--text)",borderRadius:6,cursor:"pointer"}}>
            ${paused?"▶ Resume":"⏸ Pause"}
          </button>
          <span class="muted" style=${{fontSize:11}}>
            Top 20 per banner · prior low ≥ $5 in selected window
          </span>
        </div>
        ${state.loading
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>Loading movers…</div>`
          : state.error
            ? html`<div style=${{padding:"40px 0",textAlign:"center",color:"var(--red)",fontSize:13}}>${state.error}</div>`
            : (!showUp && !showDown)
              ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>
                  Toggle on at least one direction (Gainers or Droppers) to see movers.</div>`
              : html`<div>
                  <${MoversBanner}
                    title="Chase Movers"
                    subtitle=${`Enchanted · Iconic · Epic — top 20 by ${winLabel} ${directionLabel}`}
                    cards=${chase}
                    activeWindow=${windowKey}
                    visibleWindows=${visibleWindows}
                    paused=${paused}
                    onTitleClick=${()=>openBannerInScreener("chase")}
                    onTileClick=${openCard}/>
                  <${MoversBanner}
                    title="Rare – Legendary Movers"
                    subtitle=${`Rare · Super Rare · Legendary — top 20 by ${winLabel} ${directionLabel}`}
                    cards=${rareLeg}
                    activeWindow=${windowKey}
                    visibleWindows=${visibleWindows}
                    paused=${paused}
                    onTitleClick=${()=>openBannerInScreener("rareLeg")}
                    onTileClick=${openCard}/>
                  <${MoversBanner}
                    title="Promo Movers"
                    subtitle=${`Promo printings — top 20 by ${winLabel} ${directionLabel}`}
                    cards=${promo}
                    activeWindow=${windowKey}
                    visibleWindows=${visibleWindows}
                    paused=${paused}
                    onTitleClick=${()=>openBannerInScreener("promo")}
                    onTileClick=${openCard}/>
                  ${NEWEST_SET && html`<${MoversBanner}
                    title=${`${NEWEST_SET.toUpperCase()} · MOST VALUABLE`}
                    subtitle=${`Top 20 ${valuableMode==="chase"?"chase":"non-chase"} by Low price`}
                    controls=${valuableControls}
                    cards=${valuableCards}
                    activeWindow=${""}
                    visibleWindows=${VALUABLE_VISIBLE_WINDOWS}
                    paused=${paused}
                    onTitleClick=${()=>openBannerInScreener("newest")}
                    onTileClick=${openCard}/>`}
                </div>`}
      </div>
      <div class="home-grid-right">
        <${HomeEvStrip} sets=${sets} avgs=${avgs} sealedPrices=${sealedPrices} setsMeta=${setsMeta} onTitleClick=${goAnalytics}/>
        <${CollectionPanel} raw=${raw} user=${user} collection=${collection}
          sealedCollection=${sealedCollection} sealedPrices=${sealedPrices}
          collectionLoading=${collectionLoading} setsMeta=${setsMeta}
          moversByKey=${moversByKey} onTileClick=${openCard} onSignIn=${onSignIn}
          onTitleClick=${goCollection}/>
      </div>
    </div>

    ${selectedGroup && html`<${CardDetailModal} group=${selectedGroup} theme=${theme}
      onClose=${()=>setSelectedGroup(null)}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
  </div>`;
};

// ── Decks: list + editor ────────────────────────────────────────────────
// v1 scope: name + 60-card deck of mainline cards, owned-from-collection
// math, save/load via Supabase. Charts / sharing / advanced UX deferred.

// Lorcana cards that bypass the standard 4-copy deck-building limit.
// Keyed by "Product Name" (the full "<Name> - <Version>" string in our raw
// rows). Lorcana grants these exceptions via card text — Dalmatian Puppy's
// "Puppy Power" sets the cap to 99 and variants share that total; Microbots'
// rules text removes the cap entirely. Update this map as new exception
// cards are printed.
const SPECIAL_DECK_LIMITS = {
  "Dalmatian Puppy - Tail Wagger": 99,
  "Microbots":                     Infinity,
};
const getDeckLimit = (productName) => SPECIAL_DECK_LIMITS[productName] ?? 4;
// Hard cap used by the +/- UI when a card has no theoretical max (Microbots).
const SPECIAL_LIMIT_UI_CAP = 99;
const getDeckLimitForUI = (productName) => {
  const lim = getDeckLimit(productName);
  return lim === Infinity ? SPECIAL_LIMIT_UI_CAP : lim;
};

// Lorcana card-type groups used by the editor's sectioning.
const DECK_SECTIONS = [
  {key:"Character", label:"Characters", match: t => t === "Character"},
  {key:"Action",    label:"Actions",    match: t => t === "Action"},
  {key:"Song",      label:"Songs",      match: t => t === "Song" || t === "Action - Song"},
  {key:"Item",      label:"Items",      match: t => t === "Item"},
  {key:"Location",  label:"Locations",  match: t => t === "Location"},
];

// Lorcana competitive formats.
//   - Infinity: every released mainline set is legal (basically eternal).
//   - Core Constructed: rotating. Sets release in groups of 4; when a new
//     group starts, the oldest group rotates out. So Core's legal window
//     is the two most recent complete groups + whatever's currently in
//     progress. As of Set 12 (Wilds Unknown released, Attack of the Vines
//     not yet): legal = sets 5-12 (Shimmering Skies through Wilds Unknown).
//     When Set 13 releases, sets 5-8 rotate out, leaving 9-13.
//
// To keep this maintainable: list mainline sets in release order, then
// compute Core programmatically from the index of the latest released set.
const MAINLINE_RELEASE_ORDER = [
  "The First Chapter",       // 1
  "Rise of the Floodborn",   // 2
  "Into the Inklands",       // 3
  "Ursula's Return",         // 4
  "Shimmering Skies",        // 5
  "Azurite Sea",             // 6
  "Archazia's Island",       // 7
  "Reign of Jafar",          // 8
  "Fabled",                  // 9
  "Whispers in the Well",    // 10
  "Winterspell",             // 11
  "Wilds Unknown",           // 12
  // "Attack of the Vines",  // 13 — uncomment when released
];

// Compute the Core-Constructed legal window from the latest released set
// number. Rotation drops the oldest 4-set group, keeping the two most
// recent complete groups + the in-progress group. Result is the 5-8 most
// recent sets depending on where we sit in the cycle.
function computeCoreSets(){
  const latest = MAINLINE_RELEASE_ORDER.length; // 1-indexed set number
  if(latest <= 0) return [];
  const groupOfLatest = Math.ceil(latest / 4);          // 12 → group 3
  // The two most recent complete groups + in-progress contribute.
  // Effectively: latest set's group, plus the one before it.
  const firstLegalGroup = Math.max(1, groupOfLatest - 1);
  const firstLegalSetNum = (firstLegalGroup - 1) * 4 + 1;
  return MAINLINE_RELEASE_ORDER.slice(firstLegalSetNum - 1, latest);
}

const DECK_FORMATS = [
  {key:"infinity", label:"Infinity",
   description:"Every released mainline set is legal.",
   legalSets: () => new Set(MAINLINE_RELEASE_ORDER)},
  {key:"core",     label:"Core Constructed",
   description:"Rotating — only the most recent two 4-set groups are legal.",
   legalSets: () => new Set(computeCoreSets())},
];
const getFormat = (key) => DECK_FORMATS.find(f => f.key === key) || DECK_FORMATS[0];

// Decks store the active format as their first tag (or default to Infinity
// if tags is empty). Keeps the schema simple — no migration needed.
const deckFormatKey = (deck) => {
  const t = (deck.tags && deck.tags[0]) || "";
  return DECK_FORMATS.some(f => f.key === t) ? t : "infinity";
};

// Lowest current Low/Market price for a card across its printings. Used to
// price decks (we'd rather pay the cheap version than the foil).
function cheapestCardPrice(rowsForCardId){
  let lo = null;
  for(const r of rowsForCardId){
    const p = r["Low Price"] ?? r["TCGPlayer Market"];
    if(p == null) continue;
    if(lo == null || p < lo) lo = p;
  }
  return lo;
}

// Tournament bulk-upload modal. Admin-only (rendered behind isTournamentAdmin).
// One tournament + N player rows in a single submission. Each row with
// content creates a public deck owned by the uploader + a tournament_decks
// row that carries the player_name + place for display.
const TournamentBulkUploadModal = ({raw, user, onClose, onUploaded}) => {
  const initialRows = () => Array.from({length: 8}, () => ({
    place: "", player_name: "", deck_name: "", deck_text: "",
  }));
  const [tName, setTName] = useState("");
  const [tDate, setTDate] = useState("");
  const [tPlayers, setTPlayers] = useState("");
  const [tFormat, setTFormat] = useState("");
  const [rows, setRows] = useState(initialRows);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  // Build a lookup once so deck-ink inference doesn't scan `raw` per row.
  const cardById = useMemo(() => {
    const m = {};
    for(const c of (raw || [])) if(c && c.card_id && !m[c.card_id]) m[c.card_id] = c;
    return m;
  }, [raw]);
  const inksForEntries = (entries) => {
    const set = new Set();
    for(const e of entries){
      const c = cardById[e.card_id];
      if(!c) continue;
      const inks = (c.inks && c.inks.length) ? c.inks : (c.ink ? [c.ink] : []);
      for(const i of inks) if(i) set.add(i);
    }
    return Array.from(set).sort();
  };

  const updateRow = (i, patch) => setRows(prev => prev.map((r, j) => j === i ? {...r, ...patch} : r));
  const addRow = () => setRows(prev => [...prev, {place:"", player_name:"", deck_name:"", deck_text:""}]);
  const removeRow = (i) => setRows(prev => prev.filter((_, j) => j !== i));

  // Convert a "place" string like "1st", "Top 8", "T16" into a numeric rank
  // for sort. Lower number = better finish. Returns null if unparseable.
  const parsePlaceRank = (s) => {
    if(!s) return null;
    const t = String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
    if(t === "1st" || t === "1") return 1;
    if(t === "2nd" || t === "2") return 2;
    if(t === "3rd" || t === "3") return 3;
    const m = t.match(/^(?:top|t)?(\d+)(?:th|st|nd|rd)?$/);
    if(m) return parseInt(m[1], 10);
    return null;
  };

  const submit = async () => {
    setError(null);
    if(!tName.trim()){ setError("Tournament name is required."); return; }
    const liveRows = rows.filter(r => r.deck_name.trim() || r.deck_text.trim() || r.player_name.trim() || r.place.trim());
    if(!liveRows.length){ setError("Add at least one player row with content."); return; }
    setBusy(true);
    try {
      const rowsPayload = liveRows.map(r => {
        const {entries} = r.deck_text.trim() ? parseDeckText(r.deck_text, raw) : {entries:[]};
        const inks = inksForEntries(entries);
        // Deck-name fallback chain: explicit name -> "Amber/Steel" -> player's deck -> Untitled.
        const fallbackName = (
          inks.length ? inks.join("/")
          : (r.player_name.trim() ? `${r.player_name.trim()}'s deck` : null)
        );
        return {
          place: r.place.trim() || null,
          place_rank: parsePlaceRank(r.place),
          player_name: r.player_name.trim() || null,
          deck_name: r.deck_name.trim() || fallbackName || null,
          entries,
          inks,
        };
      });
      const numPlayers = tPlayers.trim() ? Math.max(0, parseInt(tPlayers, 10) || 0) : null;
      const {data, error: rpcErr} = await sbClient.rpc("bulk_upload_tournament", {
        p_name: tName.trim(),
        p_event_date: tDate || null,
        p_format: tFormat || null,
        p_num_players: numPlayers,
        p_rows: rowsPayload,
      });
      if(rpcErr) throw rpcErr;
      setBusy(false);
      onUploaded && onUploaded(data);
    } catch(e) {
      setBusy(false);
      setError("Upload failed: " + (e?.message || e));
    }
  };

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:980}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Bulk upload tournament</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18,maxHeight:"75vh",overflowY:"auto"}}>
        <div style=${{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <label>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Tournament name *</div>
            <input type="text" value=${tName} onInput=${e=>setTName(e.target.value)}
              placeholder="e.g. Lorcana Challenge — March 2026"
              style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
          </label>
          <label>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Event date</div>
            <input type="date" value=${tDate} onInput=${e=>setTDate(e.target.value)}
              style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
          </label>
          <label>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}># Players</div>
            <input type="number" min="0" value=${tPlayers} onInput=${e=>setTPlayers(e.target.value)}
              placeholder="e.g. 32"
              style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
          </label>
          <label>
            <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Format</div>
            <select value=${tFormat} onInput=${e=>setTFormat(e.target.value)}
              style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}>
              <option value="">—</option>
              <option value="core">Core</option>
              <option value="infinity">Infinity</option>
            </select>
          </label>
        </div>
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase"}}>Players (${rows.length})</span>
          <button onClick=${addRow} style=${{padding:"4px 10px",fontSize:12}}>+ Add row</button>
        </div>
        <div style=${{display:"flex",flexDirection:"column",gap:8}}>
          ${rows.map((r, i) => html`<div key=${i} class="tournament-upload-row">
            <input type="text" placeholder="Place (1st, Top 8…)" value=${r.place}
              onInput=${e=>updateRow(i, {place: e.target.value})}/>
            <input type="text" placeholder="Player name" value=${r.player_name}
              onInput=${e=>updateRow(i, {player_name: e.target.value})}/>
            <input type="text" placeholder="Deck name" value=${r.deck_name}
              onInput=${e=>updateRow(i, {deck_name: e.target.value})}/>
            <textarea placeholder="Paste decklist — '4 Card Name' per line" value=${r.deck_text}
              onInput=${e=>updateRow(i, {deck_text: e.target.value})}
              rows="3"/>
            <button class="tournament-upload-remove" onClick=${()=>removeRow(i)}
              title="Remove this row" aria-label="Remove">×</button>
          </div>`)}
        </div>
        ${error && html`<div style=${{padding:"10px 0",color:"var(--red)",fontSize:12}}>${error}</div>`}
        <div style=${{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
          <button onClick=${onClose} disabled=${busy}>Cancel</button>
          <button class="active" onClick=${submit} disabled=${busy}
            style=${{padding:"7px 16px",fontSize:13}}>
            ${busy ? "Uploading…" : "Upload tournament"}
          </button>
        </div>
        <div class="muted" style=${{fontSize:10,marginTop:8,lineHeight:1.5}}>
          Each row creates a public deck and links it to this tournament. Empty rows are ignored.
          Decks without a list pasted are still created as empty placeholders. All fields except
          tournament name are optional.
        </div>
      </div>
    </div>
  </div>`;
};

// Admin-only modal for editing a single tournament result (add OR edit).
// When `result` is null, runs in "add deck" mode and calls admin_add_tournament_deck.
// When `result` is present, edits place/player/deck name (+ deck cards) via
// admin_update_tournament_deck + admin_replace_tournament_deck_cards.
const TournamentDeckEditModal = ({tournament, result, raw, onClose, onSaved}) => {
  const isEdit = !!result;
  const [place, setPlace] = useState(result?.place || "");
  const [playerName, setPlayerName] = useState(result?.player_name || "");
  const [deckName, setDeckName] = useState(result?.deck_name || "");
  const [deckText, setDeckText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [loaded, setLoaded] = useState(!isEdit);

  // Build a card-by-id lookup for ink inference + name back-resolution.
  const cardById = useMemo(() => {
    const m = {};
    for(const c of (raw || [])) if(c && c.card_id && !m[c.card_id]) m[c.card_id] = c;
    return m;
  }, [raw]);

  // For edit mode: fetch existing deck_cards and pre-fill the textarea
  // as "N Card Name" lines so the user can edit in place.
  useEffect(() => {
    if(!isEdit || !result?.deck_id) return;
    let cancelled = false;
    (async () => {
      try {
        const {data, error: e} = await sbClient.from("deck_cards")
          .select("card_id,quantity")
          .eq("deck_id", result.deck_id);
        if(cancelled) return;
        if(e){ setError("Couldn't load deck cards: " + e.message); setLoaded(true); return; }
        const lines = (data || []).map(dc => {
          const c = cardById[dc.card_id];
          const name = c?.["Product Name"] || dc.card_id;
          return `${dc.quantity} ${name}`;
        });
        setDeckText(lines.join("\n"));
        setLoaded(true);
      } catch(err) { if(!cancelled) { setError(String(err?.message || err)); setLoaded(true); } }
    })();
    return () => { cancelled = true; };
  }, [isEdit, result?.deck_id, cardById]);

  const inksForEntries = (entries) => {
    const set = new Set();
    for(const e of entries){
      const c = cardById[e.card_id];
      if(!c) continue;
      const inks = (c.inks && c.inks.length) ? c.inks : (c.ink ? [c.ink] : []);
      for(const i of inks) if(i) set.add(i);
    }
    return Array.from(set).sort();
  };
  const parsePlaceRank = (s) => {
    if(!s) return null;
    const t = String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
    if(t === "1st" || t === "1") return 1;
    if(t === "2nd" || t === "2") return 2;
    if(t === "3rd" || t === "3") return 3;
    const m = t.match(/^(?:top|t)?(\d+)(?:th|st|nd|rd)?$/);
    if(m) return parseInt(m[1], 10);
    return null;
  };

  const submit = async () => {
    setError(null);
    setBusy(true);
    try {
      const {entries, unmatched} = deckText.trim() ? parseDeckText(deckText, raw) : {entries:[], unmatched:[]};
      if(unmatched.length){
        if(!confirm(`${unmatched.length} line${unmatched.length===1?"":"s"} couldn't be matched and will be skipped:\n\n${unmatched.slice(0,8).join("\n")}${unmatched.length>8?"\n…":""}\n\nSave anyway?`)){
          setBusy(false); return;
        }
      }
      const inks = inksForEntries(entries);
      const fallbackName = inks.length ? inks.join("/") : (playerName.trim() ? `${playerName.trim()}'s deck` : null);
      const effectiveDeckName = deckName.trim() || fallbackName || "Untitled deck";
      if(isEdit){
        // Two RPCs: meta (admin_update_tournament_deck) + cards (admin_replace_tournament_deck_cards).
        const metaRes = await sbClient.rpc("admin_update_tournament_deck", {
          p_result_id: result.result_id,
          p_place: place.trim() || null,
          p_place_rank: parsePlaceRank(place),
          p_player_name: playerName.trim() || null,
          p_deck_name: effectiveDeckName,
        });
        if(metaRes.error) throw metaRes.error;
        const cardsRes = await sbClient.rpc("admin_replace_tournament_deck_cards", {
          p_result_id: result.result_id,
          p_inks: inks,
          p_cards: entries.map(e => ({card_id: e.card_id, quantity: e.quantity})),
        });
        if(cardsRes.error) throw cardsRes.error;
      } else {
        const addRes = await sbClient.rpc("admin_add_tournament_deck", {
          p_tid: tournament.id,
          p_place: place.trim() || null,
          p_place_rank: parsePlaceRank(place),
          p_player_name: playerName.trim() || null,
          p_deck_name: effectiveDeckName,
          p_inks: inks,
          p_cards: entries.map(e => ({card_id: e.card_id, quantity: e.quantity})),
        });
        if(addRes.error) throw addRes.error;
      }
      setBusy(false);
      onSaved && onSaved();
    } catch(e) { setBusy(false); setError("Save failed: " + (e?.message || e)); }
  };

  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:640}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>
          ${isEdit ? "Edit deck" : "Add deck"} · ${tournament?.name || ""}
        </h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18,maxHeight:"75vh",overflowY:"auto"}}>
        ${isEdit && !loaded
          ? html`<div class="muted" style=${{padding:"20px 0",textAlign:"center"}}>Loading deck cards…</div>`
          : html`
            <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Place</div>
                <input type="text" value=${place} onInput=${e=>setPlace(e.target.value)}
                  placeholder="1st, Top 8…"
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
              </label>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Player name</div>
                <input type="text" value=${playerName} onInput=${e=>setPlayerName(e.target.value)}
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
              </label>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Deck name</div>
                <input type="text" value=${deckName} onInput=${e=>setDeckName(e.target.value)}
                  placeholder="auto from inks if blank"
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
              </label>
            </div>
            <label style=${{display:"block",marginBottom:6}}>
              <div class="muted" style=${{fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Decklist</div>
              <textarea value=${deckText} onInput=${e=>setDeckText(e.target.value)}
                placeholder="4 Card Name\n4 Other Card Name\n…"
                style=${{width:"100%",minHeight:280,padding:"8px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:12,fontFamily:"monospace"}}/>
            </label>
            <div class="muted" style=${{fontSize:10,lineHeight:1.4}}>
              One card per line. Format: <code>4 Card Name</code> (or <code>4x</code>, <code>4 - Name</code>).
              Lines that don't match a card are flagged on save.
            </div>
            ${error && html`<div style=${{padding:"10px 0",color:"var(--red)",fontSize:12}}>${error}</div>`}
            <div style=${{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
              <button onClick=${onClose} disabled=${busy}>Cancel</button>
              <button class="active" onClick=${submit} disabled=${busy}
                style=${{padding:"7px 16px",fontSize:13}}>
                ${busy ? "Saving…" : (isEdit ? "Save changes" : "Add deck")}
              </button>
            </div>
          `}
      </div>
    </div>
  </div>`;
};

// Admin: multi-row tournament editor. Mirrors the Bulk Upload layout
// but starts with existing decks pre-populated. On save, diffs the rows
// vs the original snapshot:
//   - rows with a result_id whose meta or cards changed → update + replace_cards
//   - rows with a result_id that match the original exactly → skipped
//   - rows WITHOUT a result_id → admin_add_tournament_deck (new)
//   - original result_ids missing from the form → admin_delete_tournament_deck
const TournamentBulkEditModal = ({tournament, results, raw, onClose, onSaved}) => {
  const [tName, setTName] = useState(tournament?.name || "");
  const [tDate, setTDate] = useState(tournament?.event_date || "");
  const [tPlayers, setTPlayers] = useState(tournament?.num_players != null ? String(tournament.num_players) : "");
  const [tFormat, setTFormat] = useState(tournament?.format || "");
  // Each row: {result_id, place, player_name, deck_name, deck_text, _initialDeckText, _initialMeta}.
  // _initial* fields are the pristine snapshot used for diffing on save.
  const [rows, setRows] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const cardById = useMemo(() => {
    const m = {};
    for(const c of (raw || [])) if(c && c.card_id && !m[c.card_id]) m[c.card_id] = c;
    return m;
  }, [raw]);
  const inksForEntries = (entries) => {
    const set = new Set();
    for(const e of entries){
      const c = cardById[e.card_id];
      if(!c) continue;
      const inks = (c.inks && c.inks.length) ? c.inks : (c.ink ? [c.ink] : []);
      for(const i of inks) if(i) set.add(i);
    }
    return Array.from(set).sort();
  };
  const parsePlaceRank = (s) => {
    if(!s) return null;
    const t = String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
    if(t === "1st" || t === "1") return 1;
    if(t === "2nd" || t === "2") return 2;
    if(t === "3rd" || t === "3") return 3;
    const m = t.match(/^(?:top|t)?(\d+)(?:th|st|nd|rd)?$/);
    if(m) return parseInt(m[1], 10);
    return null;
  };

  // One-time fetch: pull all deck_cards for the tournament's existing decks
  // in a single round-trip, then back-resolve to "N Card Name" lines.
  useEffect(() => {
    if(!results) return;
    let cancelled = false;
    (async () => {
      const deckIds = results.map(r => r.deck_id).filter(Boolean);
      let cardsByDeck = {};
      if(deckIds.length){
        const {data, error: e} = await sbClient.from("deck_cards")
          .select("deck_id,card_id,quantity")
          .in("deck_id", deckIds);
        if(cancelled) return;
        if(e){ setError("Couldn't load deck cards: " + e.message); setLoaded(true); return; }
        for(const dc of (data || [])){
          if(!cardsByDeck[dc.deck_id]) cardsByDeck[dc.deck_id] = [];
          cardsByDeck[dc.deck_id].push(dc);
        }
      }
      const sorted = (results || []).slice().sort((a,b) => {
        const ar = a.place_rank == null ? 9999 : a.place_rank;
        const br = b.place_rank == null ? 9999 : b.place_rank;
        return ar - br;
      });
      const out = sorted.map(r => {
        const dcs = cardsByDeck[r.deck_id] || [];
        const text = dcs.map(dc => {
          const c = cardById[dc.card_id];
          const name = c?.["Product Name"] || dc.card_id;
          return `${dc.quantity} ${name}`;
        }).join("\n");
        return {
          result_id:   r.result_id,
          place:       r.place       || "",
          player_name: r.player_name || "",
          deck_name:   r.deck_name   || "",
          deck_text:   text,
          _initialDeckText: text,
          _initialMeta: {place: r.place || "", player_name: r.player_name || "", deck_name: r.deck_name || ""},
        };
      });
      setRows(out);
      setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [results, cardById]);

  const updateRow = (i, patch) => setRows(prev => prev.map((r, j) => j === i ? {...r, ...patch} : r));
  const addRow = () => setRows(prev => [...prev, {result_id:null, place:"", player_name:"", deck_name:"", deck_text:""}]);
  // Mark a row for deletion. If it had a result_id, we remember it so the
  // save handler can call admin_delete_tournament_deck. New (unsaved) rows
  // just disappear from the array.
  const [deletedIds, setDeletedIds] = useState([]);
  const removeRow = (i) => setRows(prev => {
    const r = prev[i];
    if(r.result_id) setDeletedIds(ds => [...ds, r.result_id]);
    return prev.filter((_, j) => j !== i);
  });

  const submit = async () => {
    setError(null);
    if(!tName.trim()){ setError("Tournament name is required."); return; }
    setBusy(true);
    try {
      const metaChanged =
        tName.trim() !== (tournament?.name || "") ||
        (tDate || "") !== (tournament?.event_date || "") ||
        (tFormat || "") !== (tournament?.format || "") ||
        (tPlayers.trim() === "" ? null : Math.max(0, parseInt(tPlayers, 10) || 0)) !==
          (tournament?.num_players ?? null);
      if(metaChanged){
        const r = await sbClient.rpc("admin_update_tournament_meta", {
          p_tid: tournament.id,
          p_name: tName.trim(),
          p_event_date: tDate || null,
          p_format: tFormat || null,
          p_num_players: tPlayers.trim() ? Math.max(0, parseInt(tPlayers, 10) || 0) : null,
        });
        if(r.error) throw r.error;
      }

      // Process deletions first so deck count math in subsequent steps is honest.
      for(const rid of deletedIds){
        const r = await sbClient.rpc("admin_delete_tournament_deck", {p_result_id: rid});
        if(r.error) throw r.error;
      }

      // Collect unmatched lines across all rows to surface in one prompt.
      const liveRows = rows.filter(r => r.deck_name.trim() || r.deck_text.trim() || r.player_name.trim() || r.place.trim());
      const allUnmatched = [];
      const parsed = liveRows.map(r => {
        const p = r.deck_text.trim() ? parseDeckText(r.deck_text, raw) : {entries:[], unmatched:[]};
        if(p.unmatched.length) allUnmatched.push(`Row "${r.player_name||r.deck_name||"untitled"}": ${p.unmatched.join(", ")}`);
        return {row: r, entries: p.entries};
      });
      if(allUnmatched.length){
        if(!confirm(`Some lines couldn't be matched and will be skipped:\n\n${allUnmatched.slice(0,8).join("\n")}${allUnmatched.length>8?"\n…":""}\n\nSave anyway?`)){
          setBusy(false); return;
        }
      }

      for(const {row: r, entries} of parsed){
        const inks = inksForEntries(entries);
        const fallbackName = inks.length ? inks.join("/") : (r.player_name.trim() ? `${r.player_name.trim()}'s deck` : null);
        const effectiveDeckName = r.deck_name.trim() || fallbackName || "Untitled deck";
        const cardsPayload = entries.map(e => ({card_id: e.card_id, quantity: e.quantity}));

        if(!r.result_id){
          // New row → add.
          const res = await sbClient.rpc("admin_add_tournament_deck", {
            p_tid: tournament.id,
            p_place: r.place.trim() || null,
            p_place_rank: parsePlaceRank(r.place),
            p_player_name: r.player_name.trim() || null,
            p_deck_name: effectiveDeckName,
            p_inks: inks,
            p_cards: cardsPayload,
          });
          if(res.error) throw res.error;
          continue;
        }

        // Existing row → check meta + cards diffs.
        const metaDirty =
          r.place !== r._initialMeta.place ||
          r.player_name !== r._initialMeta.player_name ||
          (r.deck_name || "") !== (r._initialMeta.deck_name || "");
        const cardsDirty = r.deck_text !== r._initialDeckText;

        if(metaDirty){
          const res = await sbClient.rpc("admin_update_tournament_deck", {
            p_result_id: r.result_id,
            p_place: r.place.trim() || null,
            p_place_rank: parsePlaceRank(r.place),
            p_player_name: r.player_name.trim() || null,
            p_deck_name: effectiveDeckName,
          });
          if(res.error) throw res.error;
        }
        if(cardsDirty){
          const res = await sbClient.rpc("admin_replace_tournament_deck_cards", {
            p_result_id: r.result_id,
            p_inks: inks,
            p_cards: cardsPayload,
          });
          if(res.error) throw res.error;
        }
      }

      setBusy(false);
      onSaved && onSaved();
    } catch(e) { setBusy(false); setError("Save failed: " + (e?.message || e)); }
  };

  if(!tournament) return null;
  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class="modal" onClick=${e=>e.stopPropagation()} style=${{maxWidth:980}}>
      <div class="modal-header">
        <h2 class="title-font" style=${{margin:0,fontSize:18}}>Edit tournament</h2>
        <button onClick=${onClose} class="theme-toggle" title="Close">×</button>
      </div>
      <div class="modal-body" style=${{padding:18,maxHeight:"75vh",overflowY:"auto"}}>
        ${!loaded
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center"}}>Loading existing decks…</div>`
          : html`
            <div style=${{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Tournament name *</div>
                <input type="text" value=${tName} onInput=${e=>setTName(e.target.value)}
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
              </label>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}>Event date</div>
                <input type="date" value=${tDate} onInput=${e=>setTDate(e.target.value)}
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
              </label>
              <label>
                <div class="muted" style=${{fontSize:11,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",marginBottom:4}}># Players</div>
                <input type="number" min="0" value=${tPlayers} onInput=${e=>setTPlayers(e.target.value)}
                  style=${{width:"100%",padding:"7px 10px",border:"1px solid var(--btn-border)",borderRadius:6,background:"var(--bg)",color:"var(--text)",fontSize:13}}/>
