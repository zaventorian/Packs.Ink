    ${importState && html`<div class="import-modal-backdrop" onClick=${()=>!importState.busy && setImportState(null)}>
      <div class="import-modal" onClick=${e=>e.stopPropagation()}>
        <h3 class="title-font" style=${{margin:"0 0 10px",fontSize:18}}>Import Collection CSV</h3>
        <div class="import-summary">
          <div><strong>${importState.report.matchedCards.toLocaleString()}</strong> cards matched
            (<strong>${importState.report.totalNormal.toLocaleString()}</strong> normal +
             <strong>${importState.report.totalFoil.toLocaleString()}</strong> foil)</div>
          ${importState.report.unmatched.length > 0 && html`<div class="import-unmatched">
            <strong>${importState.report.unmatched.length.toLocaleString()}</strong> rows couldn't be matched
            ${importState.report.unmatched.length <= 8
              ? html`<ul>${importState.report.unmatched.map((u,i)=>html`<li key=${i}>${u.name}</li>`)}</ul>`
              : html`<ul>${importState.report.unmatched.slice(0,6).map((u,i)=>html`<li key=${i}>${u.name}</li>`)}
                  <li>…and ${(importState.report.unmatched.length-6).toLocaleString()} more</li></ul>`}
          </div>`}
        </div>
        <div class="import-mode">
          <label><input type="radio" name="import-mode" checked=${importState.mode==="replace"}
            onChange=${()=>setImportState(s=>({...s,mode:"replace"}))}/>
            Replace — set each card's quantity to the CSV value
          </label>
          <label><input type="radio" name="import-mode" checked=${importState.mode==="add"}
            onChange=${()=>setImportState(s=>({...s,mode:"add"}))}/>
            Add — add CSV quantities on top of what you already own
          </label>
        </div>
        <div class="import-actions">
          <button onClick=${()=>setImportState(null)} disabled=${importState.busy}>Cancel</button>
          <button class="active" onClick=${commitImport} disabled=${importState.busy}>
            ${importState.busy ? "Importing…" : "Import"}
          </button>
        </div>
      </div>
    </div>`}

    <div class="collection-stats">
      <div class="stat-card">
        <div class="stat-card-lbl">Owned Value</div>
        <div class="stat-card-val green">$${totalValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="stat-card-sub">${totalCards.toLocaleString()} cards · ${totalUnique.toLocaleString()} unique</div>
      </div>
      <div class="stat-card">

        // the per-rarity chase pills are irrelevant. Render a single
        // count + progress bar instead.
        if(setName === EXTRAS_SET_NAME){

          const denom = tot.normal + tot.foil + tot.enchanted + tot.iconic + tot.epic;

        // labeled "Promos" so the tile reads at a glance.
        if(UNIFIED_TILE_SETS.has(setName)){
          const total = own.normal.size + own.foil.size + own.enchanted.size + own.iconic.size + own.epic.size;
          const denom = tot.normal + tot.foil + tot.enchanted + tot.iconic + tot.epic;
          const pct = denom ? (total/denom*100) : 0;
          return html`<div key=${setName} class="set-progress-card" onClick=${()=>setSelectedSet(setName)}>
            <div class="set-progress-name">${setName}</div>
            <div class="set-progress-row">
              <div class="set-progress-row-label">Promos</div>
              <div class="set-progress-row-counts">${total} / ${denom} <span class="set-progress-pct">${pct.toFixed(0)}%</span></div>
              <div class="progress-bar"><div class="progress-fill foil" style=${{width:pct+"%"}}/></div>
            </div>
          </div>`;
        }
        const nOwn = own.normal.size, fOwn = own.foil.size;
        const nPct = tot.normal ? (nOwn/tot.normal*100) : 0;
        const fPct = tot.foil   ? (fOwn/tot.foil*100)   : 0;
        const mis = setMissing[setName];
        return html`<div key=${setName} class="set-progress-card" onClick=${()=>setSelectedSet(setName)}>
          <div class="set-progress-name">${setName}</div>
          <div class="set-progress-row">
            <div class="set-progress-row-label">Normal</div>
            <div class="set-progress-row-counts">${nOwn} / ${tot.normal} <span class="set-progress-pct">${nPct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style=${{width:nPct+"%"}}/></div>
          </div>
          ${tot.foil>0 && html`<div class="set-progress-row">
            <div class="set-progress-row-label">Foil</div>
            <div class="set-progress-row-counts">${fOwn} / ${tot.foil} <span class="set-progress-pct">${fPct.toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill foil" style=${{width:fPct+"%"}}/></div>
          </div>`}
          ${CHASE_KEYS.some(k => tot[k] > 0) && html`<div class="set-chase-row">
            ${CHASE_KEYS.filter(k => tot[k] > 0).map(k => html`<div key=${k} class="chase-pill">
              <span class="chase-pill-lbl">${k[0].toUpperCase()+k.slice(1)}</span>
              <span class="chase-pill-val">${own[k].size} / ${tot[k]}</span>
            </div>`)}
          </div>`}
        </div>`;
      })}
    </div>
  </div>`}
  </div>`;
};

function FAQView(){
  return html`<div class="faq-section">
    <h2>What is Packs.Ink?</h2>
    <p>Packs.Ink is a market and collection tracker for the Disney Lorcana TCG. Use it to <strong>watch prices and price movement</strong>, <strong>track what you own</strong> (raw, sealed, and graded), <strong>build decks</strong>, and <strong>share lists and tournament results</strong> with the community. Prices update daily.</p>

    <p><strong>Collection</strong> — what you own. Three sections (Cards, Sealed, Graded) with set-by-set completion tracking, value over time, and per-section sharing.</p>
    <p><strong>Decks</strong> — your decks, the people you follow, the Discover feed of public decks, and the Tournaments index.</p>

    <h2>Smart search (Cards & Screener)</h2>
    <p>The search box accepts natural-feeling queries like:</p>
    <ul>
      <li><code>amber legendary</code> — ink + rarity</li>
      <li><code>cost:3 ruby</code> — exact ink cost</li>
      <li><code>cost&lt;=2</code>, <code>cost&gt;=5</code> — numeric ranges</li>
      <li><code>set:"wilds unknown"</code> — limit to a set</li>

      <li>Anything else falls back to a name / text-box / illustrator search.</li>
    </ul>
    <p>Filters and search stack — use ink chips + rarity chips + the smart search together to narrow fast.</p>

    <h2>Tracking your collection</h2>
    <p>Sign in (Google) and start adding cards from <strong>Cards</strong>, the <strong>Screener</strong>, any deck detail page, or by clicking a card's title from a deck list. Use the +/- buttons on the card tile or counter to set quantities for normal and foil copies independently.</p>
    <p><strong>Sealed</strong> tracks unopened products (booster boxes, decks, gift sets). <strong>Graded</strong> tracks PSA / BGS / CGC certifications with per-grade price tracking. Bulk CSV import is available in the Collection section if you prefer paste-in.</p>
    <p>The Home page's <strong>Collection Value</strong> chart graphs the value of everything you own over time. Pre-release price spikes are filtered out so a brand-new set doesn't inflate your historical value.</p>

    <h2>Building decks</h2>
    <p>Open the <strong>Decks</strong> tab and hit <em>New deck</em>. Add cards from the side panel (works with smart search), and the editor automatically computes <strong>ink legality</strong>, <strong>card count</strong>, <strong>format</strong> (Core Constructed vs Infinity), and the cost-curve / colors / inkable splits.</p>
    <p>Each deck has a <strong>visibility</strong> setting:</p>
    <ul>
      <li><strong>Private</strong> — only you can view it.</li>
      <li><strong>Unlisted</strong> — anyone with the share link can view, but it isn't listed publicly.</li>
      <li><strong>Public</strong> — appears in your creator profile and on the Discover feed.</li>
    </ul>
    <p>Flipping back to Private rotates the share link so the old URL stops working. There's also a one-click "Regenerate link" if you ever want to revoke a leaked URL without going fully private.</p>

    <h2>Exporting a deck image</h2>
    <p>Open any deck and hit <strong>\u{1F5BC} Export Image</strong> to generate a poster you can post or DM. Toggle the QR code, stats, cost curve, and the three deck-cost lines on/off, change the background style (Ink / Dark / Light), and pick 5–8 columns of card art. Use the <em>Copy</em> button to put a PNG on your clipboard, or <em>Save</em> to download.</p>
    <p><strong>Deck-cost lines</strong> (all three default on, individually toggleable):</p>
    <ul>
      <li><strong>Non-Foil</strong> — total cost if every copy in the deck is a Normal printing.</li>
      <li><strong>Foil</strong> — total cost using the cheapest Foil printing for each card.</li>
      <li><strong>Max Rarity</strong>* — the "treasure-hunt" build: for each card, use its most expensive Enchanted / Iconic / Epic / Promo printing. Cards with no chase printing fall back to their Non-Foil price so totals stay meaningful.</li>
    </ul>
    <p><strong>*Max Rarity exclusions</strong> — two narrow filters so a couple of outlier promos don't dominate the total:</p>
    <ul>
      <li><strong>Promo Set 1, #1–7</strong> are skipped entirely (they're so rarely traded that the listed prices aren't representative).</li>
      <li>Other <strong>Promo</strong>-rarity printings priced over <strong>$1,000</strong> are also skipped. (<strong>Iconic</strong>-rarity printings priced over $1,000 are kept — that's a legitimate chase tier, not an outlier.)</li>
    </ul>
    <p>All cost lines use the same <strong>NM Low</strong> price shown elsewhere on the site.</p>

    <h2>Sharing your collection</h2>
    <p>From the Collection tab's <strong>Share ▾</strong> menu, set each section (Cards / Sealed / Graded) independently to Private, Unlisted, or Public. Public collections appear on your creator profile; Unlisted needs the share link. Visitors who are signed in get a <strong>comparison strip</strong> showing what they own, what overlaps, and what they're missing.</p>

    <h2>Following creators</h2>
    <p>Click any creator's name on a deck (or on the Discover feed) to open their profile. Hit <strong>Follow</strong> to add their public decks to your Home page's Following feed. <strong>Favorites</strong> is the per-deck version — bookmark specific decks without following the whole creator.</p>

    <h2>Tournaments</h2>
    <p>The Decks tab has a <strong>Tournaments</strong> section listing recent events with full top-finish decklists. Click a tournament to see all uploaded results; click any individual deck to view the full list, mulligan-sim it, or export it as an image. Tournament decks render with a trophy badge wherever they appear in the Discover feed.</p>
    <p>Tournament results are admin-uploaded. If you run an event and want results listed here, get in touch via the X link below.</p>

    <h2>How are prices computed?</h2>
    <p>Prices come from <strong>TCGPlayer</strong> and refresh once a day. The <strong>primary price shown is the NM Low</strong> (the cheapest current Near Mint listing on TCGPlayer), with the smoothed <strong>Market</strong> price available via the Low/Market toggle in most surfaces. Low is the more actionable number for buyers — it's the actual current floor — while Market is a smoothed estimate that lags reality.</p>
    <p>Graded prices are tracked separately, per grading company and per grade, refreshed daily.</p>
    <p>Earliest tracked price data is <strong>February 2024</strong>. Sets released before that date show a <strong>*</strong> asterisk where applicable.</p>

    <h2>How do EV calculations work?</h2>
    <p>Each booster pack contains 12 cards. EV is calculated by multiplying the average market price of each rarity by the expected number of that rarity per box (24 packs), then summing. So if Legendaries average $5 and you pull 4 per box on average, Legendaries contribute $20 to box EV.</p>
    <p>The "<strong>${"<$1"} → $0</strong>" toggle treats any card under $1 as $0 — gives a more realistic "sellable" picture since bulk cards aren't worth listing individually. "<strong>No Ench/Iconic</strong>" removes those ultra-rare tiers so you can see the base EV without relying on a jackpot pull.</p>
    <p><strong>Pull rates (Sets 1–11)</strong> per box: 144 C, 72 U, ~32 R, 12 SR, 4 L, 13 C foils, 6 U foils, 3 R foils, 1 SR foil, 0.5 L foils, 0.25 Enchanted, 1.5 Epic, ~0.014 Iconic.</p>
    <p><strong>Pull rates (Sets 12+, Wilds Unknown onward)</strong>: same C/U/SR, but <strong>6 Legendaries</strong>, <strong>0.333 Enchanteds</strong>, <strong>2.5 Epics</strong>, with foil counts adjusted proportionally. These are community-estimated averages — your mileage will vary box-to-box.</p>

    <h2>Install as an app</h2>
    <p>Hit the <strong>\u{1F4F2}</strong> button in the top-right of the page for step-by-step instructions. iOS, Android, and desktop all supported. Once installed, Packs.Ink opens in its own window/app icon with a faster startup and home-screen presence.</p>

    <h2>Affiliate disclosure</h2>
    <p>Packs.Ink participates in the TCGplayer Affiliate Program. As a TCGplayer Affiliate, we earn a commission from qualifying purchases made through TCGplayer links on this site (the price-tag buttons on every card). This costs you nothing extra and helps keep the site running. Thanks for clicking through!</p>

    <h2 id="privacy">Privacy policy</h2>
    <p>This policy covers what data Packs.Ink stores about you and how it's handled.</p>
    <p><strong>What we collect.</strong> The site is fully browseable without an account; only signed-in features collect anything.</p>
    <ul>
      <li><strong>If you sign in with Google:</strong> your Google email, profile display name, and (optionally) profile photo URL. We never see your Google password.</li>

    <p><strong>What we don't collect.</strong> No analytics tracking, no advertising trackers, no third-party cookies, no IP geo-tracking, no fingerprinting. The browse experience is entirely anonymous.</p>
    <p><strong>Where it's stored.</strong> Account + collection data lives in a Supabase Postgres database (US-based). Access is gated by Postgres Row-Level Security so only you can read or modify your own data. The browser holds a recent-data cache in localStorage (purely for speed; cleared when you clear site data).</p>
    <p><strong>Who we share with.</strong> Nobody. We don't sell, rent, or share data with third parties. Publicly visible deck lists, collection shares, and creator profiles are only shared when you explicitly mark a deck/collection as Public or share an Unlisted link.</p>
    <p><strong>How to delete your data.</strong> You can delete individual decks, collection items, etc. from inside the app at any time. To delete your entire account and all associated data, DM <a href="https://x.com/HighScoreZAP" target="_blank" rel="noopener" style=${{color:"var(--accent)"}}>@HighScoreZAP</a> on X with the email address on file — we'll wipe everything within 7 days and confirm by reply.</p>

          tcgplayer_product_id: row["tcgplayer_product_id"],
          tcg_printing: row["tcg_printing"] || row["Printing"],
          card_id: row["card_id"],

      const cardList=Object.values(cards);
      const byRar={};
      for(const r of SET_RARS){const rc=cardList.filter(c=>c.rarity===r);byRar[r]={cards:rc,total:rc.reduce((t,c)=>t+(c.price||0),0),count:rc.length};}

        ${SET_RARS.map(r=>{const s=getBadgeStyle(r,theme),on=activeRars.has(r);
          return html`<button key=${r} onClick=${()=>toggleRar(r)} style=${{background:on?s.bg:"transparent",color:on?s.fg:"var(--text-muted)",
            border:on?"1px solid "+(s.fg+"40"):"1px solid var(--border)",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:600,
            opacity:on?1:0.4,transition:"all 0.15s"}}>${r}</button>`;
        })}
      </div>
    </div>
    <div class="scr"><table>
      <thead><tr>
        <th style=${{textAlign:"left",minWidth:160}}>Set</th><th style=${{minWidth:90}}>Total</th>
        ${SET_RARS.map(r=>html`<th key=${r} style=${{minWidth:70,opacity:activeRars.has(r)?1:0.3}}>${r}</th>`)}
        <th style=${{width:40}}>Cards</th>
      </tr></thead>
      <tbody>${sets.map(s=>{const d=setData[s];if(!d) return null;const total=getTotal(s),isExp=expanded===s;
        return html`<${React.Fragment} key=${s}>

// Monte Carlo box simulator extracted from BoxSim so it can live as its
// own Analytics sub-tab. Runs N box openings and renders the EV distribution
// histogram plus summary stats.
function MonteCarloView({rawData, sets, theme}){
  const [s, setS] = useState("");
  const [n, setN] = useState(1000);
  const [running, setRunning] = useState(false);
  const [dist, setDist] = useState(null);
  const pools = useMemo(()=>s?buildPools(rawData,s):null, [rawData,s]);
  const runSim = () => {
    if(!pools) return;
    setRunning(true);
    setTimeout(()=>{
      const pull = getPull(s);
      const tots = [];
      for(let b=0; b<n; b++){
        let t = 0;
        for(let p=0; p<24; p++) for(const c of simPack(pools, pull)) t += (c.price || 0);
        tots.push(t);
      }
      tots.sort((a,b)=>a-b);
      const mean = tots.reduce((a,b)=>a+b, 0) / tots.length;
      const median = tots[Math.floor(tots.length/2)];
      const bs = 10;
      const minB = Math.floor(tots[0]/bs)*bs;
      const maxB = Math.ceil(tots[tots.length-1]/bs)*bs;
      const bkts = {};
      for(let b=minB; b<=maxB; b+=bs) bkts[b] = 0;
      for(const t of tots){ const b = Math.floor(t/bs)*bs; bkts[b] = (bkts[b]||0) + 1; }
      setDist({totals:tots, mean, median, min:tots[0], max:tots[tots.length-1], buckets:bkts, n});
      setRunning(false);
    }, 50);
  };
  return html`<div>
    <div class="market-explainer">
      <strong>What this does:</strong> simulates opening thousands of booster boxes in seconds — drawing each card with realistic pull rates — and plots the distribution of total box EV. Reading the histogram: the dark bar is near the mean; the tail shows how often a box prints money (and how often it bricks).
    </div>
    <div class="row">
      <${SetSel} val=${s} onChange=${v=>{ setS(v); setDist(null); }} placeholder="Select a set..." sets=${sets}/>
      <select value=${n} onChange=${e=>setN(+e.target.value)} style=${{width:160}}>
        ${[100,500,1000,5000].map(v=>html`<option key=${v} value=${v}>${v.toLocaleString()} boxes</option>`)}
      </select>
      <button onClick=${runSim} disabled=${!s || running} class=${s && !running ? "active" : ""}>
        ${running ? "Running…" : "Run simulation"}
      </button>
    </div>
    ${dist && html`<div style=${{marginTop:"1rem"}}>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:"1rem"}}>
        <${Stat} label="Mean"   value=${fmt(dist.mean)}/>
        <${Stat} label="Median" value=${fmt(dist.median)}/>
        <${Stat} label="Min"    value=${fmt(dist.min)}/>
        <${Stat} label="Max"    value=${fmt(dist.max)} accent="var(--green)"/>
      </div>
      <${Histogram} data=${dist}/>
      <p class="muted" style=${{fontSize:11,marginTop:10}}>
        ${dist.n.toLocaleString()} simulated boxes for ${s}. Mean is the long-run average box value; median is the typical box (half above, half below). Box MSRP is $109.99 — anything to the right of that on the histogram is profit at single-card resale.
      </p>
    </div>`}
  </div>`;
}

// Signal detection for a row. Module-level (instead of inside the
// component) so it can be referenced from the filter useMemo without
// hitting a temporal-dead-zone error. Generic tooltips — per-card numbers
// live in the table cells.
// Compact inline SVG sparkline from the 7 price snapshots the matview
// carries: low_365d -> low_180d -> low_90d -> low_30d -> low_7d -> low_prev
// -> low_today. Roughly maps to a 1-year trend at uneven sampling; gives
// a quick visual cue without an extra DB fetch.
function priceDbSparkline(r){
  const pts = [r.low_365d, r.low_180d, r.low_90d, r.low_30d, r.low_7d, r.low_prev, r.low_today]
    .map(v => (v == null || isNaN(+v)) ? null : +v);
  const valid = pts.filter(v => v != null);
  if(valid.length < 2) return html`<span class="muted" style=${{fontSize:9}}>—</span>`;
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  const range = max - min || 1;
  const W = 64, H = 22;
  const stepX = pts.length > 1 ? W / (pts.length - 1) : W;
  // Linear path skipping nulls (breaks the line at gaps).
  let d = "";
  let drawing = false;
  pts.forEach((v, i) => {
    if(v == null){ drawing = false; return; }
    const x = i * stepX;
    const y = H - ((v - min) / range) * H;
    d += (drawing ? " L " : (d ? " M " : "M ")) + x.toFixed(1) + " " + y.toFixed(1);
    drawing = true;
  });
  const lastValid = pts.findLast ? pts.findLast(v => v != null) : valid[valid.length - 1];
  const firstValid = valid[0];
  const trendUp = lastValid > firstValid;
  const stroke = lastValid === firstValid ? "var(--text-muted)" : (trendUp ? "var(--green)" : "var(--red)");
  return html`<svg viewBox="0 0 ${W} ${H}" width=${W} height=${H} preserveAspectRatio="none"
    style=${{display:"block"}}>
    <path d=${d} fill="none" stroke=${stroke} stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function priceDbSignals(r){
  const out = [];
  const hasMarket = r.low_today != null && r.market_today != null && r.market_today > 0;
  const ratio = hasMarket ? (r.low_today / r.market_today) : null;
  const weekUp = r.pct_7d != null && r.pct_7d >= 15;
  // Buyout — the *divergence* between low and market opened recently.
  // A real sweep re-prices listings upward; market (smoothed sales) lags,
  // so low/market expands above 1. Pairing the ratio with a 1W move keeps
  // this from firing on cards that have just been settled above market
  // for a long time (those are Premium, below). Fallback: cards with no
  // market data still qualify if the floor jumped 1.5× its 30d baseline.
  const ratioBuyout    = hasMarket && ratio >= 1.05 && weekUp;
  const baselineBuyout =
    (r.low_today != null && r.low_30d  && r.low_today >= 1.5 * r.low_30d) ||
    (r.low_today != null && r.low_90d  && r.low_today >= 2   * r.low_90d) ||
    (r.low_today != null && r.low_180d && r.low_today >= 3   * r.low_180d);
  if(ratioBuyout || baselineBuyout) out.push(["buy", "BUY",
    "Buyout — the floor jumped this week and now sits at or above the market sale average. Market hasn't caught up yet, so someone is sweeping inventory."]);
  if(r.pct_7d != null && r.pct_7d <= -20) out.push(["crash", "CRSH",
    "Crashing — low_price down 20% or more on the week."]);
  if(hasMarket){
    if(ratio <= 0.85) out.push(["disc", "DISC",
      "Discount — the cheapest active listing is well below the recent sale-price average."]);
    // Premium = settled-high pricing. The pct_7d < 10 gate is what makes
    // it mutually exclusive with Buyout — if the floor *also* spiked this
    // week, the card is being swept (BUY), not just expensive (PREM).
    if(ratio >= 1.10 && (r.pct_7d == null || r.pct_7d < 10)) out.push(["prem", "PREM",
      "Premium — the floor sits above the market sale average and has been there for a while. The card is just expensive; not an active sweep."]);
  }
  if(r.pct_30d != null && r.pct_30d >= 15) out.push(["trend", "TRND",
    "Trending up — sustained appreciation over the past month, not a one-day blip."]);
  return out;
}

      if(av == null) return 1;
      if(bv == null) return -1;
      return sd ? bv - av : av - bv;
    });
    return out;
  }, [rawEnrichedRows, search, filterSet, filterRarities, filterInks, preset, sortKey, sortDesc, priceMode, setNameById, moverWin, minPrice, maxPrice, minPct, maxPct, pctWin, collFilter, sigFilter, collection, showGraded, gradedSynth, movRowByPid, filterGraders, filterGrades]);

  const rarities = useMemo(() => {
    const present = new Set((state.rows || []).map((r) => r.rarity).filter(Boolean));

    // no current row matches — otherwise the chip vanishes and the filter
    // looks broken (e.g. "Super Rare" set via banner handoff but data is
    // empty for that rarity in this window).
    for(const r of filterRarities) present.add(r);
    const ordered = CARDS_RARITIES.slice().reverse().filter(r => present.has(r));
    const tail = [...present].filter(r => !ordered.includes(r)).sort();
    return [...ordered, ...tail];

  // Mass-entry URL for the selected cards. TCGPlayer accepts qty + card

  const buildBatchBuyUrl = (rows) => {
    if(!rows.length) return null;
    const lines = rows.map(r => `1 ${(r.name || "") + (r.version ? " - " + r.version : "")}`.trim()).filter(Boolean);
    const dest = `https://www.tcgplayer.com/massentry?productline=Lorcana TCG&c=${encodeURIComponent(lines.join("||"))}`;

        tcgUrl(r.tcgplayer_product_id, r.printing) || "",
      ].map(esc).join(","));

    const blob = new Blob([lines.join("\n")], {type: "text/csv"});

      onSignIn=${onSignIn || (() => {})}/>`}
    ${hoverPreview && html`<div class="deck-hover-preview"
      style=${{
        left:  Math.min(window.innerWidth  - 210, hoverPreview.x + 16) + "px",
        top:   Math.min(window.innerHeight - 290, hoverPreview.y + 16) + "px",
      }}>
      <img src=${hoverPreview.src} alt=""/>
    </div>`}
  </div>`;
}

function MarketView({raw, sets, avgs, theme, nc, setNc, ne, setNe,
                    excludeEnchanted, setExcludeEnchanted, excludeIconic, setExcludeIconic,
                    user, collection, updateQty, onSignIn, openSetHistory, sealedPrices}){
  // Market analytics list sets newest-first so the most relevant sets land
  // at the top of every table. Simulators inherit the same ordering — their
  // set dropdown reads better newest-first anyway.
  const setsNewest = useMemo(()=>sets.slice().reverse(), [sets]);
  // Default to Expected Value every time Analytics is opened. The user
  // explicitly asked for this — landing on EV is the strongest signal of
  // current market health and the page's "home" view.
  const [sub, setSub] = useState("ev");
  const [simKind, setSimKind] = useState(()=>{
    try { return localStorage.getItem("packsink:market:simkind") || "pack"; }
    catch { return "pack"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:market:simkind", simKind); } catch {} }, [simKind]);
  // Shared price-source preference: each sub-view renders its own toggle
  // (closer to its filters) but the value is shared so toggling once flips
  // EV, Playset Cost, Card Averages, Heatmap, Sealed. Persisted because
  // users generally settle on one source.
  const [priceMode, setPriceMode] = useState(()=>{
    try { return localStorage.getItem("packsink:market:priceMode") || "low"; }
    catch { return "low"; }
  });
  useEffect(()=>{ try { localStorage.setItem("packsink:market:priceMode", priceMode); } catch {} }, [priceMode]);

  // Build a Set of excluded chase rarities once for EV-style helpers.
  const excludeRars = useMemo(()=>{
    const s = new Set();
    if(excludeEnchanted) s.add("Enchanted");
    if(excludeIconic) s.add("Iconic");
    return s;
  }, [excludeEnchanted, excludeIconic]);

  return html`<div>
    <div class="market-subtabs">
      ${MARKET_SUBS.map(([k,l])=>html`<button key=${k}
        class=${"market-subtab"+(sub===k?" active":"")}
        onClick=${()=>setSub(k)}>${l}</button>`)}
    </div>
    ${sub==="setval"  && html`<${SetValuesView} rawData=${raw} sets=${setsNewest} theme=${theme}
      priceMode=${priceMode} setPriceMode=${setPriceMode}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
    ${sub==="heatmap" && html`<${HeatmapView} sets=${setsNewest} avgs=${avgs}
      priceMode=${priceMode} setPriceMode=${setPriceMode}/>`}
    ${sub==="ev"      && html`<${EVView} raw=${raw} sets=${setsNewest} avgs=${avgs}
      nc=${nc} setNc=${setNc}
      excludeEnchanted=${excludeEnchanted} setExcludeEnchanted=${setExcludeEnchanted}
      excludeIconic=${excludeIconic} setExcludeIconic=${setExcludeIconic}
      excludeRars=${excludeRars}
      priceMode=${priceMode} setPriceMode=${setPriceMode}
      sealedPrices=${sealedPrices}
      openSetHistory=${openSetHistory}/>`}
    ${sub==="avg"     && html`<${AvgView} sets=${setsNewest} avgs=${avgs} nc=${nc} setNc=${setNc}
      priceMode=${priceMode} setPriceMode=${setPriceMode}
      openSetHistory=${openSetHistory}/>`}
    ${sub==="sealed"  && html`<${SealedView} raw=${raw} sets=${setsNewest}
      sealedPrices=${sealedPrices}
      priceMode=${priceMode} setPriceMode=${setPriceMode}
      openSetHistory=${openSetHistory}/>`}
    ${sub==="sim" && html`<div class="sim-kind-bar">
      <label class="sim-kind-label">Simulator</label>
      <select class="sim-kind-select" value=${simKind} onChange=${e=>setSimKind(e.target.value)}>
        <option value="pack">Pack — open one booster at a time</option>
        <option value="box">Box — open 24 packs (full booster box)</option>
      </select>
    </div>`}
    ${sub==="sim" && simKind==="pack" && html`<${PackSim} rawData=${raw} sets=${setsNewest} theme=${theme}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
    ${sub==="sim" && simKind==="box"  && html`<${BoxSim} rawData=${raw} sets=${setsNewest} theme=${theme}
      user=${user} collection=${collection} updateQty=${updateQty} onSignIn=${onSignIn}/>`}
    ${sub==="montecarlo" && html`<${MonteCarloView} rawData=${raw} sets=${setsNewest} theme=${theme}/>`}
  </div>`;
}

// ── Home (landing) ──────────────────────────────────────────────────────
// Two horizontally-scrolling banners of biggest 1-day movers, split by
// rarity tier. Driven by the `price_movers` view (09_price_movers.sql),
// which already enforces the low_prev ≥ $5 floor and computes 1d/7d/30d Δ%.
// We fetch enough to bucket client-side and take top 20 per bucket.
const CHASE_RARS = new Set(["Enchanted","Iconic","Epic"]);
const RARELEG_RARS = new Set(["Rare","Super Rare","Legendary"]);

// Window definitions for the Home movers toolbar. Each window maps to a low
// snapshot column (for the "started >= $5 in this window" floor), a low Δ%
// column (used for sorting + display), and a market Δ% column (display only).
const MOVER_WINDOWS = [
  {key:"1d",  label:"1D", lowCol:"low_prev",  pctLow:"pct_1d",   pctMkt:"mkt_pct_1d"},
  {key:"1w",  label:"1W", lowCol:"low_7d",    pctLow:"pct_7d",   pctMkt:"mkt_pct_7d"},
  {key:"1m",  label:"1M", lowCol:"low_30d",   pctLow:"pct_30d",  pctMkt:"mkt_pct_30d"},
  {key:"3m",  label:"3M", lowCol:"low_90d",   pctLow:"pct_90d",  pctMkt:"mkt_pct_90d"},
  {key:"6m",  label:"6M", lowCol:"low_180d",  pctLow:"pct_180d", pctMkt:"mkt_pct_180d"},
  {key:"1y",  label:"1Y", lowCol:"low_365d",  pctLow:"pct_365d", pctMkt:"mkt_pct_365d"},
];
const MOVER_WIN_BY_KEY = Object.fromEntries(MOVER_WINDOWS.map(w=>[w.key,w]));

// Pick the 3 windows to display on a tile, centered on the active window
// where possible. Active is always included so the sort column is visible.
const pickVisibleWindows = (activeKey) => {
  const i = Math.max(0, MOVER_WINDOWS.findIndex(w => w.key === activeKey));
  const start = Math.max(0, Math.min(MOVER_WINDOWS.length - 3, i - 1));
  return MOVER_WINDOWS.slice(start, start + 3);
};

const fmtPct = (p) => {
  if(p == null) return "—";
  const a = Math.abs(p);
  if(a >= 1000) return (p > 0 ? "+" : "") + Math.round(p/100) + "x"; // 1500% → "+15x"
  // Trim decimals as the number grows so big movers stay inside their cell.
  const fixed = a >= 10 ? 0 : 1;
  return (p > 0 ? "+" : "") + p.toFixed(fixed) + "%";
};
const pctColor = (p) => {
  if(p == null) return "var(--text-muted)";
  if(p > 0) return "var(--green)";
  if(p < 0) return "var(--red)";
  return "var(--text-muted)";
};

    <div class="mt-prices">

      <${Tip} text=${TIP_MARKET} class="mt-dlbl">MKT<//>

// Scroll speed in CSS pixels per second. Lower = slower drift.
const MOVERS_SCROLL_PX_PER_SEC = 28;

const MoversBanner = ({title, subtitle, controls, cards, onTileClick, activeWindow, visibleWindows, paused, onTitleClick}) => {
  const wrapRef = useRef(null);
  // Track manual interaction so the rAF loop yields briefly after the user
  // scrolls / wheels — otherwise the auto-advance immediately yanks the
  // scrollLeft back. After 1.5 s of no interaction we resume drifting.
  const lastUserScrollRef = useRef(0);
  // Hover state lives in a ref so updating it doesn't trigger re-renders
  // (and re-create the rAF effect).
  const hoverRef = useRef(false);
  const pausedRef = useRef(paused);
  useEffect(()=>{ pausedRef.current = paused; }, [paused]);
  const reducedMotion = useMemo(()=>{
    if(typeof window === "undefined") return false;
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, []);

  useEffect(()=>{
    const el = wrapRef.current;
    if(!el || cards.length === 0 || reducedMotion) return;
    // Whenever the cards array re-derives (window/direction/mode change),
    // snap back to the start so the new list is read from the beginning
    // rather than mid-stream. Note: paused is NOT in deps — toggling pause
    // must preserve scroll position.
    el.scrollLeft = 0;
    let pos = 0;
    let raf = 0;
    let last = performance.now();
    // Float accumulator — keeps sub-pixel precision between frames. Without
    // this, 28 px/s × 16 ms = 0.45 px/frame and the value gets lost to
    // integer rounding inside the browser's scrollLeft setter on some
    // platforms — the symptom was "doesn't appear to scroll until you've
    // already scrolled the page."
    const onUser = () => { lastUserScrollRef.current = performance.now(); };
    el.addEventListener("wheel",       onUser, {passive:true});
    el.addEventListener("touchmove",   onUser, {passive:true});
    el.addEventListener("pointerdown", onUser);
    const tick = (now) => {
      const dt = Math.min(64, now - last);
      last = now;
      const sinceUser = now - lastUserScrollRef.current;
      if(!pausedRef.current && !hoverRef.current && sinceUser > 1500){
        pos += (MOVERS_SCROLL_PX_PER_SEC * dt) / 1000;
        const half = el.scrollWidth / 2;
        if(half > 0 && pos >= half) pos -= half;
        el.scrollLeft = pos;
      } else {
        // User is interacting (or paused). Keep our accumulator in sync with
        // wherever they've scrolled to, so resumption is seamless.
        pos = el.scrollLeft;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>{
      cancelAnimationFrame(raf);
      el.removeEventListener("wheel",       onUser);
      el.removeEventListener("touchmove",   onUser);
      el.removeEventListener("pointerdown", onUser);
    };
  }, [cards, reducedMotion]);

  return html`<section style=${{margin:"0 0 10px"}}>
    ${(title || subtitle || controls) ? html`<div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap"}}>
      ${title ? (onTitleClick
        ? html`<button class="home-title-link" onClick=${onTitleClick}
            title="Open Screener with this filter"
            style=${{fontFamily:"'Cinzel',serif",fontSize:12,fontWeight:600,margin:0,color:"var(--accent)",letterSpacing:0.3,background:"none",border:0,padding:0,cursor:"pointer"}}>${title}</button>`
        : html`<h2 class="title-font" style=${{fontSize:12,fontWeight:600,margin:0,color:"var(--accent)",letterSpacing:0.3}}>${title}</h2>`) : null}
      ${controls ? html`<span>${controls}</span>` : null}
      ${subtitle ? html`<span class="muted" style=${{fontSize:10}}>${subtitle}</span>` : null}
    </div>` : null}
    ${cards.length === 0
      ? html`<div class="muted" style=${{fontSize:11,padding:"10px 4px"}}>
          No cards match the current window + direction filters.</div>`
      : html`<div ref=${wrapRef} class=${"movers-wrap"+(paused?" is-paused":"")}
          onMouseEnter=${()=>{ hoverRef.current = true; }}
          onMouseLeave=${()=>{ hoverRef.current = false; }}>
          <div class="movers-track">
            ${cards.map(c => html`<${MoverTile} key=${c.card_id+":"+c.printing} card=${c}
              activeWindow=${activeWindow} visibleWindows=${visibleWindows}
              onClick=${()=>onTileClick && onTileClick(c)}/>`)}
            ${cards.map(c => html`<${MoverTile} key=${"dup:"+c.card_id+":"+c.printing} card=${c}
              activeWindow=${activeWindow} visibleWindows=${visibleWindows}
              onClick=${()=>onTileClick && onTileClick(c)}/>`)}
          </div>
        </div>`}
  </section>`;
};

// Range options for the collection-value chart. Each maps to "days back".
// `all` falls through to fetching the full year (the ETL archive starts
// 2024-02-08, but we cap fetch at 365 days for cost — anything beyond gets
// summarized via the existing 1Y mover delta instead).
const COLLECTION_RANGES = [
  {key:"1m",  label:"1M",  days:30},
  {key:"3m",  label:"3M",  days:90},
  {key:"6m",  label:"6M",  days:180},
  {key:"1y",  label:"1Y",  days:365},
  {key:"all", label:"All", days:365},
];

// Right-side panel on Home: current collection value, line chart over a
// user-selected range, and a tiny "top movers in your collection" list.
const CollectionPanel = ({raw, user, collection, sealedCollection, sealedPrices, collectionLoading, moversByKey, onTileClick, onSignIn, onTitleClick, setsMeta}) => {
  const [rangeKey, setRangeKey] = useState("3m");
  // Per-section visibility toggles for the value chart. All three default
  // ON; users who don't have sealed or graded just see their card line and
  // can hide the empty series if they want. Persisted across sessions.
  const [showCards, setShowCards]   = useState(()=>{try{return localStorage.getItem("packsink:home:colShowCards") !== "0";}catch{return true;}});
  const [showSealed, setShowSealed] = useState(()=>{try{return localStorage.getItem("packsink:home:colShowSealed") !== "0";}catch{return true;}});
  const [showGraded, setShowGraded] = useState(()=>{try{return localStorage.getItem("packsink:home:colShowGraded") !== "0";}catch{return true;}});
  // When true (default), all enabled sections collapse to one summed line.
  // When false, render each enabled section as its own colored line so users
  // can spot which segment of their portfolio is moving.
  const [combinedLine, setCombinedLine] = useState(()=>{try{return localStorage.getItem("packsink:home:colCombined") !== "0";}catch{return true;}});
  useEffect(()=>{try{localStorage.setItem("packsink:home:colCombined", combinedLine?"1":"0");}catch{}}, [combinedLine]);
  useEffect(()=>{try{localStorage.setItem("packsink:home:colShowCards", showCards?"1":"0");}catch{}}, [showCards]);
  useEffect(()=>{try{localStorage.setItem("packsink:home:colShowSealed", showSealed?"1":"0");}catch{}}, [showSealed]);
  useEffect(()=>{try{localStorage.setItem("packsink:home:colShowGraded", showGraded?"1":"0");}catch{}}, [showGraded]);
  // User preference: collapse the panel to just the title + current value.
  // Persisted because power users with a strong opinion on either layout
  // shouldn't re-toggle every session.
  const [minimized, setMinimized] = useState(() => {
    try { return localStorage.getItem("packsink:home:collectionMin") === "1"; }
    catch { return false; }
  });
  useEffect(() => {
    try { localStorage.setItem("packsink:home:collectionMin", minimized ? "1" : "0"); } catch {}
  }, [minimized]);
  const minBtn = html`<button class="panel-min-btn"
    onClick=${()=>setMinimized(m => !m)}
    title=${minimized ? "Expand collection panel" : "Minimize collection panel"}
    aria-label=${minimized ? "Expand" : "Minimize"}>
    ${minimized ? "▸" : "▾"}
  </button>`;
  // Controls for the in-panel "Your Top Movers" list. Independent from the
  // main movers banners so the user can ask "what moved most in MY cards
  // this week" without changing the global window.
  const [moversWindow, setMoversWindow] = useState("1w");
  const [moversUp, setMoversUp] = useState(true);
  const [moversDown, setMoversDown] = useState(true);
  // Two-layer cache. (1) In-memory historyCache keyed by (productsHash,
  // rangeKey) holds the raw fetched rows for instant within-session range
  // switching. (2) A localStorage cache holds the COMPUTED value series
  // for the same key so subsequent visits with the same collection paint
  // the chart immediately and refresh in the background. We store only
  // {date,value} pairs (~30 KB per range max), not the raw rows.
  const [historyCache, setHistoryCache] = useState({});
  const [historyState, setHistoryState] = useState({loading:false, error:null});
  // Series shown immediately from persisted cache while a fresh fetch runs.
  const [cachedSeries, setCachedSeries] = useState(null);

  // Build "owned" map: (product_id|printing) -> quantity, plus owned card
  // refs for the mini movers list.
  const owned = useMemo(() => {
    const map = new Map();
    const ownedRows = [];
    if(!user || !raw.length) return {map, ownedRows};
    const byKey = {};
    for(const r of raw){
      if(r.card_id && r.tcg_printing) byKey[r.card_id+":"+r.tcg_printing] = r;
    }
    for(const [k, qty] of Object.entries(collection)){
      if(qty <= 0) continue;
      const r = byKey[k];
      if(!r || !r.tcgplayer_product_id) continue;
      const pk = r.tcgplayer_product_id + "|" + r.tcg_printing;
      map.set(pk, (map.get(pk)||0) + qty);
      ownedRows.push({row:r, qty});
    }
    return {map, ownedRows};
  }, [raw, collection, user]);

  // Current value — uses today's low (with market fallback), same logic as
  // CollectionView so the two views agree.
  const currentValue = useMemo(() => {
    let v = 0;
    for(const {row, qty} of owned.ownedRows){
      const p = row["Low Price"] ?? row["TCGPlayer Market"] ?? 0;
      v += p * qty;
    }
    return v;
  }, [owned]);

  // Fetch only the active range, on demand. Cache by (productsKey, rangeKey)
  // so toggling between ranges only ever incurs one round-trip apiece.
  const ownedProductsKey = useMemo(() => {
    const ids = Array.from(owned.map.keys()).sort();
    return ids.join(",");
  }, [owned.map]);
  const ownedProductsHash = useMemo(() => shortHash(ownedProductsKey), [ownedProductsKey]);
  // Reset the in-session cache when the collection itself changes (otherwise
  // we'd be showing stale rows for a different set of owned cards).
  useEffect(() => { setHistoryCache({}); }, [ownedProductsKey]);
  const historyRows = historyCache[ownedProductsKey]?.[rangeKey] || null;

  // Hydrate the chart from localStorage immediately whenever the user
  // switches range. If the entry is missing/stale we still trigger the
  // network fetch below; the user just doesn't have to stare at "Loading…".
  useEffect(() => {
    if(!user || owned.map.size === 0){ setCachedSeries(null); return; }
    const key = collectionValueCacheKey(user.id, ownedProductsHash, rangeKey);
    const c = readCollectionValueCache(key);
    setCachedSeries(c && c.series.length ? c.series : null);
  }, [user, owned.map, ownedProductsHash, rangeKey]);

  useEffect(() => {
    if(!user || owned.map.size === 0){ setHistoryState({loading:false, error:null}); return; }
    if(historyRows) return; // already fetched this range this session
    const productIds = Array.from(new Set(Array.from(owned.map.keys()).map(k => parseInt(k.split("|")[0],10))));
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    let cancelled = false;
    setHistoryState({loading:true, error:null});
    fetchCollectionPriceHistory(productIds, since)
      .then(rows => {
        if(cancelled) return;
        setHistoryCache(c => ({...c, [ownedProductsKey]: {...(c[ownedProductsKey]||{}), [rangeKey]: rows}}));
        setHistoryState({loading:false, error:null});
      })
      .catch(e => { if(!cancelled) setHistoryState({loading:false, error:String(e.message||e)}); });
    return () => { cancelled = true; };
  }, [user, owned.map, ownedProductsKey, rangeKey, historyRows]);

  // Pre-release prices on TCGPlayer are wildly inflated (sometimes 10-20x
  // the real price once the set drops). Build a per-product earliest-valid
  // date so the rollup skips any prices_daily snapshot from before release.
  // Promos / non-mainline cards have no `released_at` and aren't filtered.
  const productEarliestDate = useMemo(() => {
    const releaseById = {};
    for(const s of (setsMeta||[])) if(s?.released_at) releaseById[s.id] = s.released_at;
    const map = {};
    for(const r of (raw||[])){
      if(!r.tcgplayer_product_id || !r.set_id) continue;
      // Only mainline sets get the guard (chase prices included). The set
      // name check keeps promo / D23 / EPCOT cards unfiltered — those don't
      // have a "prerelease spike" pattern.
      if(!MAINLINE_SETS.includes(r.Set)) continue;
      const release = releaseById[r.set_id];
      if(!release) continue;
      const d = new Date(release + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + 1);
      const ymd = d.toISOString().slice(0,10);
      const existing = map[r.tcgplayer_product_id];
      if(!existing || ymd > existing) map[r.tcgplayer_product_id] = ymd;
    }
    return map;
  }, [raw, setsMeta]);
  // Forward-fill in computeCollectionValueHistory means a card that wasn't
  // priced during the range start still contributes from its most recent
  // prior snapshot.
  const freshSeries = useMemo(() => {
    if(!historyRows) return null;
    return computeCollectionValueHistory(historyRows, owned.map, productEarliestDate);
  }, [historyRows, owned.map, productEarliestDate]);

  // Persist the fresh series so the next page load with the same collection
  // hydrates instantly. Plain {date,value} pairs — small, JSON-stringifiable.
  useEffect(() => {
    if(!freshSeries || !freshSeries.length || !user) return;
    const key = collectionValueCacheKey(user.id, ownedProductsHash, rangeKey);
    writeCollectionValueCache(key, freshSeries);
  }, [freshSeries, user, ownedProductsHash, rangeKey]);

  // Prefer fresh — but fall back to whatever we hydrated from localStorage
  // so the user sees the chart immediately on return visits.
  const valueSeries = freshSeries || cachedSeries;

  // ── Sealed series ────────────────────────────────────────────────────
  // Mirrors the card pipeline: build owned map → fetch prices_daily → roll
  // up via computeCollectionValueHistory. Sealed entries are always Normal
  // printing so the map keys all end in "|Normal".
  const sealedOwned = useMemo(() => {
    const map = new Map();
    if(!user || !sealedCollection) return map;
    for(const [pid, qty] of Object.entries(sealedCollection)){
      if(qty <= 0) continue;
      map.set(pid + "|Normal", qty);
    }
    return map;
  }, [sealedCollection, user]);
  const sealedCurrentValue = useMemo(() => {
    if(!sealedPrices || !sealedOwned.size) return 0;
    const priceByPid = {};
    for(const p of sealedPrices){
      if(p.printing !== "Normal") continue;
      priceByPid[p.tcgplayer_product_id] = parseFloat(p.low_price ?? p.market_price);
    }
    let v = 0;
    for(const [k, qty] of sealedOwned){
      const pid = parseInt(k.split("|")[0],10);
      const px = priceByPid[pid];
      if(px && !isNaN(px)) v += px * qty;
    }
    return v;
  }, [sealedPrices, sealedOwned]);
  const [sealedHistoryRows, setSealedHistoryRows] = useState(null);
  const sealedOwnedKey = useMemo(() => Array.from(sealedOwned.keys()).sort().join(","), [sealedOwned]);
  useEffect(() => {
    if(!showSealed || !sealedOwned.size){ setSealedHistoryRows(null); return; }
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    const pids = Array.from(new Set(Array.from(sealedOwned.keys()).map(k => parseInt(k.split("|")[0],10))));
    let cancelled = false;
    fetchCollectionPriceHistory(pids, since)
      .then(rows => { if(!cancelled) setSealedHistoryRows(rows); })
      .catch(() => { if(!cancelled) setSealedHistoryRows([]); });
    return () => { cancelled = true; };
  }, [sealedOwnedKey, rangeKey, showSealed]);
  const sealedValueSeries = useMemo(() =>
    sealedHistoryRows ? computeCollectionValueHistory(sealedHistoryRows, sealedOwned, null) : null,
    [sealedHistoryRows, sealedOwned]);

  // ── Graded series ────────────────────────────────────────────────────
  // Fetches the user's graded_collection_items rows once on mount, then
  // pulls graded_prices_daily history for those slots. Reuses the same
  // helpers GradedCollectionView uses so the numbers match.
  const [gradedItems, setGradedItems] = useState(null);
  useEffect(() => {
    if(!user){ setGradedItems([]); return; }
    let cancelled = false;
    sbClient.from("graded_collection_items")
      .select("card_id,grader,grade,quantity")
      .eq("user_id", user.id)
      .then(({data}) => { if(!cancelled) setGradedItems(data || []); });
    return () => { cancelled = true; };
  }, [user]);
  // card_id → tcgplayer_product_id lookup so we can resolve graded item
  // identifiers back into product ids for the price fetch.
  const pidByCardId = useMemo(() => {
    const m = new Map();
    for(const r of (raw || [])) if(r.card_id && r.tcgplayer_product_id) m.set(r.card_id, r.tcgplayer_product_id);
    return m;
  }, [raw]);
  const gradedSlots = useMemo(() => {
    if(!gradedItems) return [];
    const out = [];
    for(const it of gradedItems){
      const pid = pidByCardId.get(it.card_id);
      if(!pid) continue;
      out.push({pid, grader: it.grader, grade: it.grade, qty: it.quantity || 0});
    }
    return out;
  }, [gradedItems, pidByCardId]);
  const gradedCurrentValue = useMemo(() => {
    // We can't price slots without the graded_prices_latest snapshot.
    // valueSeries below computes it from the rolled-up history; use the
    // last point as the current value to stay consistent with the chart.
    return 0;
  }, []);
  const [gradedHistoryRows, setGradedHistoryRows] = useState(null);
  const gradedSlotsKey = useMemo(() => gradedSlots.map(s => `${s.pid}|${s.grader}|${s.grade}|${s.qty}`).sort().join(","), [gradedSlots]);
  useEffect(() => {
    if(!showGraded || !gradedSlots.length){ setGradedHistoryRows(null); return; }
    const days = (COLLECTION_RANGES.find(r => r.key === rangeKey) || COLLECTION_RANGES[1]).days;
    const since = new Date(Date.now() - days*24*3600*1000).toISOString().slice(0,10);
    let cancelled = false;
    fetchGradedHistoryFor(gradedSlots, since)
      .then(rows => { if(!cancelled) setGradedHistoryRows(rows); })
      .catch(() => { if(!cancelled) setGradedHistoryRows([]); });
    return () => { cancelled = true; };
  }, [gradedSlotsKey, rangeKey, showGraded]);
  const gradedValueSeries = useMemo(() =>
    gradedHistoryRows ? computeGradedValueHistory(gradedHistoryRows, gradedSlots) : null,
    [gradedHistoryRows, gradedSlots]);
  const gradedLatestValue = useMemo(() => (gradedValueSeries && gradedValueSeries.length) ? gradedValueSeries[gradedValueSeries.length-1].value : 0, [gradedValueSeries]);

  // Multi-series chart. Each {date,value} series → one line. Toggled-off
  // sections aren't added so they vanish from both the chart and totals.
  const chartSeries = useMemo(() => {
    const toLine = (label, color, series) => {
      if(!series || !series.length) return null;
      return {label, color, dashed:false,
        data: series.map(p => ({x: new Date(p.date+"T00:00:00Z").getTime(), y: p.value}))};
    };
    const sections = [];
    if(showCards)  sections.push({label:"Cards",  color:"var(--accent)", series: valueSeries});
    if(showSealed) sections.push({label:"Sealed", color:"#7e54c4",       series: sealedValueSeries});
    if(showGraded) sections.push({label:"Graded", color:"#c8a846",       series: gradedValueSeries});
    const populated = sections.filter(s => s.series && s.series.length);
    if(!populated.length) return [];
    // Combined mode (default): one line summing every enabled section's
    // value by date. Forward-fill across each section's own dates so a card
    // section without a snapshot on a sealed-only date still contributes its
    // most recent known value (instead of dropping to zero on that day and
    // making the combined line zigzag).
    if(combinedLine){
      // Sort each section's series by date for forward-fill.
      const sortedSections = populated.map(s => ({
        ...s,
        sorted: s.series.slice().sort((a,b) => a.date.localeCompare(b.date)),
      }));
      const dateSet = new Set();
      for(const s of sortedSections) for(const p of s.sorted) dateSet.add(p.date);
      const dates = Array.from(dateSet).sort();
      const data = [];
      const cursors = sortedSections.map(() => ({i: 0, lastY: 0}));
      for(const date of dates){
        let total = 0;
        sortedSections.forEach((s, idx) => {
          const cur = cursors[idx];
          while(cur.i < s.sorted.length && s.sorted[cur.i].date <= date){
            cur.lastY = s.sorted[cur.i].value;
            cur.i++;
          }
          total += cur.lastY;
        });
        data.push({x: new Date(date+"T00:00:00Z").getTime(), y: total});
      }
      return [{label:"Total collection", color:"var(--accent)", dashed:false, data}];
    }
    // Split mode: one colored line per section.
    return sections.map(s => toLine(s.label, s.color, s.series)).filter(Boolean);
  }, [valueSeries, sealedValueSeries, gradedValueSeries, showCards, showSealed, showGraded, combinedLine]);

  // Combined "now" value = sum of enabled sections at their latest point.
  const cardLatestValue = currentValue;
  const sealedLatestValue = sealedCurrentValue;
  const combinedCurrentValue =
    (showCards ? cardLatestValue : 0) +
    (showSealed ? sealedLatestValue : 0) +
    (showGraded ? gradedLatestValue : 0);
  // Combined start value (sum across enabled sections' first datapoint) for
  // the range-delta pill. If only one section is on, use that section's
  // own start so the delta matches what users expect.
  const combinedStartValue = (() => {
    let s = 0, anyHadData = false;
    if(showCards && valueSeries?.length){ s += valueSeries[0].value; anyHadData = true; }
    if(showSealed && sealedValueSeries?.length){ s += sealedValueSeries[0].value; anyHadData = true; }
    if(showGraded && gradedValueSeries?.length){ s += gradedValueSeries[0].value; anyHadData = true; }
    return anyHadData ? s : null;
  })();
  const rangeDelta = (combinedStartValue != null && combinedStartValue > 0) ? (combinedCurrentValue - combinedStartValue) : null;
  const rangeDeltaPct = (combinedStartValue != null && combinedStartValue > 0) ? ((combinedCurrentValue - combinedStartValue) / combinedStartValue * 100) : null;

  // Top 5 movers within owned collection — filtered + sorted by the in-panel
  // window/direction controls.
  const moversWin = MOVER_WIN_BY_KEY[moversWindow] || MOVER_WIN_BY_KEY["1d"];
  const collectionMovers = useMemo(() => {
    if(!user || !owned.ownedRows.length) return [];
    const out = [];
    for(const {row} of owned.ownedRows){
      const m = moversByKey[row.card_id + ":" + row.tcg_printing];
      if(!m) continue;
      const pct = m[moversWin.pctLow];
      if(pct == null || pct === 0) continue;
      if(pct > 0 && !moversUp) continue;
      if(pct < 0 && !moversDown) continue;
      // Hide low-dollar noise: skip cards where both today and prior price
      // sit under $5. A 50% move on a $0.30 card isn't a real signal.
      const maxPx = Math.max(m.low_today ?? 0, m.low_prev ?? 0);
      if(maxPx < 5) continue;
      out.push({row, mover:m, pct});
    }
    const cmpAbs  = (a,b) => Math.abs(b.pct) - Math.abs(a.pct);
    const cmpDesc = (a,b) => b.pct - a.pct;
    const cmpAsc  = (a,b) => a.pct - b.pct;
    out.sort((moversUp && moversDown) ? cmpAbs : moversUp ? cmpDesc : moversDown ? cmpAsc : cmpAbs);
    return out.slice(0, 10);
  }, [user, owned.ownedRows, moversByKey, moversWin.pctLow, moversUp, moversDown]);

  if(!user) return html`<aside class="collection-panel">
    <div class="panel-header">
      ${onTitleClick
        ? html`<button class="panel-title home-title-link" onClick=${onTitleClick}
            title="Open Collection tab"
            style=${{background:"none",border:0,padding:0,cursor:"pointer",font:"inherit",color:"inherit",textAlign:"left"}}>Your Collection</button>`
        : html`<h2 class="panel-title">Your Collection</h2>`}
      ${minBtn}
    </div>
    ${!minimized && html`<div>
      <div class="muted" style=${{fontSize:12,marginBottom:10}}>
        Sign in to track your collection's value over time.</div>
      <button class="active" onClick=${onSignIn} style=${{padding:"7px 14px",fontSize:12}}>Sign in with Google</button>
    </div>`}
  </aside>`;

  // Empty state — fires when the user owns nothing across all three sections.
  if(owned.ownedRows.length === 0 && sealedOwned.size === 0 && gradedSlots.length === 0) return html`<aside class="collection-panel">
    <div class="panel-header">
      ${onTitleClick
        ? html`<button class="panel-title home-title-link" onClick=${onTitleClick}
            title="Open Collection tab"
            style=${{background:"none",border:0,padding:0,cursor:"pointer",font:"inherit",color:"inherit",textAlign:"left"}}>Your Collection</button>`
        : html`<h2 class="panel-title">Your Collection</h2>`}
      ${minBtn}
    </div>
    ${!minimized && (collectionLoading
      ? html`<div class="muted" style=${{fontSize:12,padding:"24px 0",textAlign:"center"}}>Loading your collection…</div>`
      : html`<div class="muted" style=${{fontSize:12}}>
          Add cards (or sealed / graded items) to your collection to see your value chart here.</div>`)}
  </aside>`;

  const deltaColor = rangeDelta == null ? "var(--text-muted)" : rangeDelta >= 0 ? "var(--green)" : "var(--red)";
  const rangeLabel = (COLLECTION_RANGES.find(r => r.key === rangeKey) || {}).label || rangeKey;

  return html`<aside class=${"collection-panel"+(minimized?" is-min":"")}>
    <div class="panel-header">
      ${onTitleClick
        ? html`<button class="panel-title home-title-link" onClick=${onTitleClick}
            title="Open Collection tab"
            style=${{background:"none",border:0,padding:0,cursor:"pointer",font:"inherit",color:"inherit",textAlign:"left"}}>Your Collection</button>`
        : html`<h2 class="panel-title">Your Collection</h2>`}
      ${minBtn}
    </div>
    <div class="panel-value">
      <div class="panel-value-now">$${combinedCurrentValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      ${rangeDelta != null && html`<div class="panel-value-delta" style=${{color:deltaColor}}>
        ${rangeDelta >= 0 ? "+" : ""}$${Math.abs(rangeDelta).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
        <span style=${{opacity:0.8}}>(${rangeDeltaPct >= 0 ? "+" : ""}${rangeDeltaPct.toFixed(2)}%)</span>
        <span class="muted" style=${{fontWeight:400,fontSize:10,marginLeft:4}}>past ${rangeLabel}</span>
      </div>`}
    </div>
    ${!minimized && html`<div>
    <div class="panel-range-buttons">
      ${COLLECTION_RANGES.map(r => html`<button key=${r.key}
        class=${rangeKey===r.key?"active":""}
        onClick=${()=>setRangeKey(r.key)}>${r.label}</button>`)}
    </div>
    <div class="panel-section-toggles">
      <label title="Show Card collection value on the chart">
        <input type="checkbox" checked=${showCards} onChange=${e=>setShowCards(e.target.checked)}/>
        <span class="panel-toggle-swatch" style=${{background:"var(--accent)"}}/>
        <span>Cards <em>${fmt(cardLatestValue)}</em></span>
      </label>
      <label title="Show Sealed-product value on the chart">
        <input type="checkbox" checked=${showSealed} onChange=${e=>setShowSealed(e.target.checked)}/>
        <span class="panel-toggle-swatch" style=${{background:"#7e54c4"}}/>
        <span>Sealed <em>${fmt(sealedLatestValue)}</em></span>
      </label>
      <label title="Show Graded card value on the chart">
        <input type="checkbox" checked=${showGraded} onChange=${e=>setShowGraded(e.target.checked)}/>
        <span class="panel-toggle-swatch" style=${{background:"#c8a846"}}/>
        <span>Graded <em>${fmt(gradedLatestValue)}</em></span>
      </label>
      <label title="Sum every enabled section into a single line (default). Uncheck to see Cards / Sealed / Graded as their own colored lines."
        style=${{marginLeft:"auto"}}>
        <input type="checkbox" checked=${combinedLine} onChange=${e=>setCombinedLine(e.target.checked)}/>
        <span>Combined</span>
      </label>
    </div>
    <div class="panel-chart">
      ${(chartSeries.length && chartSeries.some(s => s.data && s.data.length))
        ? html`<${LineChart} series=${chartSeries} width=340 height=160
            padding=${{top:6,right:8,bottom:20,left:48}}/>
            ${historyState.loading ? html`<div class="muted" style=${{fontSize:10,textAlign:"center",marginTop:-4}}>Refreshing…</div>` : null}`
        : historyState.loading
          ? html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>Loading…</div>`
          : historyState.error
            ? html`<div style=${{padding:"40px 0",textAlign:"center",color:"var(--red)",fontSize:11}}>${historyState.error}</div>`
            : html`<div class="muted" style=${{padding:"40px 0",textAlign:"center",fontSize:12}}>No price history for the selected range yet.</div>`}
    </div>
    <div class="panel-movers">
      <div class="panel-movers-title">Your Top Movers</div>
      <div class="panel-movers-controls">
        <div class="panel-range-buttons">
          ${MOVER_WINDOWS.map(w => html`<button key=${w.key}
            class=${moversWindow===w.key?"active":""}
            onClick=${()=>setMoversWindow(w.key)}>${w.label}</button>`)}
        </div>
        <div class="panel-dir-toggle">
          <label class=${moversUp?"on-up":""}>
            <input type="checkbox" checked=${moversUp} onChange=${e=>setMoversUp(e.target.checked)}/>
            ▲ Gainers
          </label>
          <label class=${moversDown?"on-down":""}>
            <input type="checkbox" checked=${moversDown} onChange=${e=>setMoversDown(e.target.checked)}/>
            ▼ Droppers
          </label>
        </div>
      </div>
      ${collectionMovers.length === 0
        ? html`<div class="muted" style=${{fontSize:11,padding:"10px 2px",textAlign:"center"}}>
            No ${moversWin.label} movement in your collection matching the filters.</div>`
        : html`<table class="panel-movers-table"><tbody>
          ${collectionMovers.map(({row, mover, pct}) => html`<tr key=${row.card_id+":"+row.tcg_printing}
            onClick=${()=>onTileClick && onTileClick(mover)}>
            <td class="panel-movers-img">${row.img_small
              ? html`<img src=${row.img_small} alt="" loading="lazy"/>`
              : ""}</td>
            <td class="panel-movers-name">${row["Product Name"]}</td>
            <td class="panel-movers-price">${fmt(parseP(mover.low_today))}</td>
            <td class="panel-movers-pct" style=${{color:pctColor(pct)}}>${fmtPct(pct)}</td>
          </tr>`)}
        </tbody></table>`}
    </div>
    </div>`}
  </aside>`;
};

// (CollectionMoversSection removed — covered by the in-panel Your Top Movers

const _CollectionMoversSection_unused = ({user, raw, collection, moversByKey, paused, onTileClick}) => {
  const [windowKey, setWindowKey] = useState("1w");
  const [showUp, setShowUp] = useState(true);
  const [showDown, setShowDown] = useState(true);
  const win = MOVER_WIN_BY_KEY[windowKey] || MOVER_WIN_BY_KEY["1d"];
  const visibleWindows = useMemo(() => pickVisibleWindows(windowKey), [windowKey]);
  const cards = useMemo(() => {
    if(!user || !raw.length) return [];
    const byKey = {};
    for(const r of raw){
      if(r.card_id && r.tcg_printing) byKey[r.card_id+":"+r.tcg_printing] = r;
    }
    const out = [];
    for(const [k, qty] of Object.entries(collection)){
      if(qty <= 0) continue;
      const r = byKey[k];
      if(!r) continue;
      const m = moversByKey[k];
      if(!m) continue;
      const pct = m[win.pctLow];
      if(pct == null || pct === 0) continue;
      if(pct > 0 && !showUp) continue;
      if(pct < 0 && !showDown) continue;
      out.push(m);
    }
    const cmpAbs  = (a,b) => Math.abs(b[win.pctLow]) - Math.abs(a[win.pctLow]);
    const cmpDesc = (a,b) => b[win.pctLow] - a[win.pctLow];
    const cmpAsc  = (a,b) => a[win.pctLow] - b[win.pctLow];
    out.sort((showUp && showDown) ? cmpAbs : showUp ? cmpDesc : showDown ? cmpAsc : cmpAbs);
    return out.slice(0, 20);
  }, [user, raw, collection, moversByKey, win.pctLow, showUp, showDown]);
  if(!user) return null;
  const dirLabel = (showUp && showDown) ? "|Δ%|" : showUp ? "Δ% (gains)" : showDown ? "Δ% (drops)" : "Δ%";
  return html`<section style=${{marginTop:18}}>

        ${MOVER_WINDOWS.map(w => html`<button key=${w.key}
          class=${windowKey===w.key?"active":""}

      </div>
      <div class="dir-toggle">
        <label class=${showUp?"on-up":""}>
          <input type="checkbox" checked=${showUp} onChange=${e=>setShowUp(e.target.checked)}/>
          ▲ Gainers
        </label>
        <label class=${showDown?"on-down":""}>
          <input type="checkbox" checked=${showDown} onChange=${e=>setShowDown(e.target.checked)}/>
          ▼ Droppers
        </label>
      </div>
      <span class="muted" style=${{fontSize:11}}>
        ${cards.length ? `Top ${cards.length} cards from your collection · ${win.label} ${dirLabel}` : "—"}
      </span>
    </div>
    ${cards.length === 0
      ? html`<div class="muted" style=${{padding:"24px 0",textAlign:"center",fontSize:12}}>
          No cards in your collection have ${win.label} movement matching the current filters.</div>`
