<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Ticker — promo scene</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Nunito+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Promo scene for the stream ticker.

   Everything here is a PURE FUNCTION OF TIME: there is not one CSS transition
   or @keyframes in this file. __seek(t) positions every element for second t,
   so the recorder can step frame by frame and get identical output on any
   machine at any frame rate — no dropped frames, no real-time capture jitter.
   The one animation that IS a CSS animation is the ticker's own marquee, in
   the iframe, and __seek drives that too through the Web Animations API.

   The bar in the frame is the REAL /ticker?bar=1 page in an iframe, sized
   exactly like an OBS browser source. Nothing about it is re-mocked here.
   The configurator behind the "make it yours" beat is likewise a real
   screenshot of the real page, panned — not an illustration.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#120a1e; --panel:#171226; --gold:#d9b96c; --text:#f2eefc;
  --dim:rgba(242,238,252,0.64); --faint:rgba(242,238,252,0.34);
  --slab:#7fd4ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#000;overflow:hidden;}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;}
#stage{position:relative;overflow:hidden;background:#000;}

/* ── the "stream" behind the overlay ─────────────────────────────────────
   Deliberately an abstract ink field, not fake gameplay: the ticker is the
   product, the backdrop is labelled as the streamer's own content. */
.scene{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(120% 100% at 50% 0%, #241141 0%, #160c26 46%, #0d0718 100%);}
.glow{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;}
.grid-tex{position:absolute;inset:-10%;opacity:0.16;
  background-image:linear-gradient(rgba(217,185,108,0.16) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(217,185,108,0.16) 1px, transparent 1px);
  background-size:96px 96px;}
.vig{position:absolute;inset:0;background:
  radial-gradient(75% 65% at 50% 45%, transparent 0%, rgba(6,3,12,0.55) 78%, rgba(4,2,9,0.88) 100%);}
.scanline{position:absolute;inset:0;opacity:0.10;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0 1px, transparent 1px 3px);}

/* stream furniture — a camera placeholder + LIVE pill, so the frame reads as
   a stream layout without pretending to be one. */
.cambox{position:absolute;border:2px dashed rgba(217,185,108,0.34);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,7,22,0.34);}
.cambox span{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(217,185,108,0.55);font-weight:700;}
.livepill{position:absolute;display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px;border-radius:999px;background:rgba(10,6,18,0.62);
  border:1px solid rgba(255,255,255,0.14);font-size:12px;font-weight:800;
  letter-spacing:0.2em;text-transform:uppercase;}
.livepill i{width:9px;height:9px;border-radius:50%;background:#ff4757;display:block;}
.watermark{position:absolute;left:0;right:0;text-align:center;
  font-family:'Cinzel',serif;font-weight:600;letter-spacing:0.5em;text-transform:uppercase;
  color:rgba(242,238,252,0.16);}

/* ── the overlay itself ── */
.tkslot{position:absolute;overflow:hidden;will-change:transform;}
.tkslot iframe{display:block;border:0;width:100%;height:100%;}
/* Drawn callout that points at the bar without covering it. */
.pointer{position:absolute;display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--gold);}
.pointer b{font-weight:800;}
.pointer .line{height:2px;background:linear-gradient(90deg,var(--gold),rgba(217,185,108,0));
  display:block;border-radius:2px;}

/* ── copy blocks ── */
.block{position:absolute;will-change:transform,opacity;}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:0.34em;text-transform:uppercase;
  color:var(--gold);margin:0 0 18px;}
.eyebrow.slab{color:var(--slab);}
h1{font-family:'Cinzel',serif;font-weight:700;margin:0;line-height:1.04;letter-spacing:0.012em;}
h1 em{font-style:normal;color:var(--gold);}
.sub{color:var(--dim);margin:20px 0 0;line-height:1.45;font-weight:400;}
.rule{height:3px;width:104px;background:var(--gold);border-radius:3px;margin:0 0 26px;}

.flist{list-style:none;margin:0;padding:0;}
.flist li{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;
  will-change:transform,opacity;}
.flist .tick{flex:0 0 auto;color:var(--gold);font-weight:800;line-height:1;}
.flist.slab .tick{color:var(--slab);}
.flist .ftxt{font-weight:600;line-height:1.28;}
.flist .fsub{display:block;color:var(--faint);font-weight:400;margin-top:4px;}

/* ── the real configurator page, panned ──────────────────────────────────
   One tall screenshot of /ticker in a window-shaped frame. The pan is a pure
   function of t like everything else, so it records deterministically. */
.pageframe{position:absolute;overflow:hidden;border-radius:14px;
  border:1px solid rgba(217,185,108,0.30);background:var(--panel);
  box-shadow:0 34px 90px rgba(0,0,0,0.66), 0 0 0 1px rgba(0,0,0,0.5);
  will-change:transform,opacity;}
.pagebar{position:absolute;left:0;right:0;top:0;height:34px;z-index:2;
  background:rgba(10,6,18,0.94);border-bottom:1px solid rgba(255,255,255,0.10);
  display:flex;align-items:center;gap:8px;padding:0 14px;}
.pagebar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.22);
  display:block;flex:0 0 auto;}
.pagebar span{margin-left:10px;font-size:13px;font-weight:700;color:var(--dim);
  letter-spacing:0.04em;}
.pagescroll{position:absolute;left:0;right:0;top:34px;bottom:0;overflow:hidden;}
.pagescroll img{display:block;width:100%;height:auto;will-change:transform;}

.cta{position:absolute;text-align:center;left:0;right:0;will-change:transform,opacity;}
.cta .mark{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:22px;}
.cta .mark img{display:block;}
.cta .url{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);
  line-height:1;letter-spacing:0.01em;}
.cta .tag{color:var(--dim);margin-top:18px;font-weight:600;letter-spacing:0.05em;}
.cta .chips{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;}
.cta .chips span{border:1px solid rgba(217,185,108,0.38);border-radius:999px;
  color:var(--gold);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;}
/* Compact 1-2-3 strip above the mark, so the closing card also answers "how". */
.ctasteps{display:flex;justify-content:center;align-items:center;gap:22px;
  margin-bottom:40px;flex-wrap:wrap;}
.ctasteps .cs{display:flex;align-items:center;gap:12px;}
.ctasteps .n{display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:2px solid rgba(217,185,108,0.55);color:var(--gold);font-family:'Cinzel',serif;
  font-weight:700;line-height:1;flex:0 0 auto;}
.ctasteps .cl{color:var(--dim);font-weight:700;letter-spacing:0.02em;white-space:nowrap;}
.ctasteps .sep{color:rgba(217,185,108,0.34);}

/* ── mobile framing ── */
.mheader{position:absolute;left:0;right:0;display:flex;align-items:center;
  justify-content:center;gap:14px;}
.mheader img{display:block;}
.mheader b{font-family:'Cinzel',serif;font-weight:700;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--gold);}
.mfooter{position:absolute;left:0;right:0;text-align:center;}
.mfooter .u{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);}
.mfooter .s{color:var(--faint);font-weight:600;letter-spacing:0.2em;
  text-transform:uppercase;margin-top:10px;}
.window{position:absolute;overflow:hidden;border-radius:18px;
  border:1px solid rgba(217,185,108,0.22);
  box-shadow:0 26px 70px rgba(0,0,0,0.6);}
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="scene"></div>
</div>

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const FMT = Q.get("fmt") === "mobile" ? "mobile" : "desktop";
const MOBILE = FMT === "mobile";
const W = MOBILE ? 1080 : 1920;
const H = MOBILE ? 1920 : 1080;
const TICKER_SRC = Q.get("ticker") || "/ticker?bar=1";
const DURATION = parseFloat(Q.get("dur") || "36");

const stage = document.getElementById("stage");
stage.style.width = W + "px";
stage.style.height = H + "px";
document.body.style.width = W + "px";
document.body.style.height = H + "px";

/* ─────────────────── timing helpers (pure) ─────────────────── */
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => (x = clamp01(x)) < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
/* Presence envelope: 0 → 1 over `rise` from `at`, 1 → 0 over `fall` before `out`. */
function env(t, at, out, rise, fall){
  rise = rise || 0.55; fall = fall || 0.42;
  if(t < at) return 0;
  if(t >= out) return 0;
  return Math.min(easeOut((t - at) / rise), easeOut((out - t) / fall));
}

/* ─────────────────── the script ───────────────────
   One entry per beat. Times are seconds. The ticker never leaves.
   Both formats share ONE set of beats, so the two cuts say the same thing at
   the same moment — the brief was "same info in each". */
const BEATS = {
  head:   [1.8, 8.0],
  reel:   [8.4, 15.2],
  graded: [15.6, 22.2],
  custom: [22.6, 29.6],
  cta:    [30.0, DURATION],
};

const FEATURES = [
  ["Every card we price, ranked by % move", "The whole market — not a hand-picked list"],
  ["1D · 1W · 1M · 3M · 6M · 1Y", "Each time frame becomes its own labelled section"],
  ["Chase · Rare–Legendary · Promos · All", "One section per rarity group"],
  ["Risers, fallers, or both", "With a price floor, so 10¢ cards stay out"],
];
const GRADED = [
  ["PSA · CGC · BGS · SGC", "Any combination of graders and grades"],
  ["Biggest movers, or biggest single sales", "Every row shows its own grader and grade"],
  ["From our own eBay sale record", "A slab is a different asset from the card"],
];
const CUSTOM = [
  ["Your colours — or fully transparent", "Let the gameplay show through behind it"],
  ["Speed, card art, price floor", "With a live preview while you set it up"],
  ["Every setting rides in the URL", "No account, nothing to install"],
];
const CTASTEPS = ["Build it", "Copy the URL", "Paste into OBS"];

/* ─────────────────── build the scene ─────────────────── */
const scene = document.getElementById("scene");
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
};
const px = (n) => n + "px";

/* Ink-coloured glows drifting behind everything. Six Lorcana inks. */
const INKS = ["#f0b93b","#a05cc8","#2fae6b","#e0424f","#3c86d6","#8a93a8"];
/* The box the ambience is clipped to: the stream window on mobile, the whole
   frame on desktop. Placement and glow size both key off it. */
const MWIN = {top: 190, h: 608};
const AMB_W = W;
const AMB_H = MOBILE ? MWIN.h : H;
const glows = INKS.map((c, i) => {
  const g = el("div", "glow");
  const size = (MOBILE ? 400 : 720) * (0.72 + (i % 3) * 0.22);
  g.style.width = px(size);
  g.style.height = px(size);
  g.style.background = c;
  g.style.opacity = String(i % 2 ? 0.32 : 0.24);
  g.style.marginLeft = px(-size / 2);
  g.style.marginTop = px(-size / 2);
  g.dataset.bx = String((0.10 + 0.16 * i) * AMB_W);
  g.dataset.by = String((0.18 + 0.13 * i) * AMB_H);
  scene.appendChild(g);
  return g;
});
const gridTex = el("div", "grid-tex");
scene.appendChild(gridTex);
scene.appendChild(el("div", "scanline"));
scene.appendChild(el("div", "vig"));

/* Stream furniture. */
const cambox = el("div", "cambox", "<span>your camera</span>");
const livepill = el("div", "livepill", "<i></i><span>Live</span>");
const watermark = el("div", "watermark", "your stream");
if(!MOBILE){
  cambox.style.cssText += ";left:96px;top:74px;width:300px;height:172px;";
  livepill.style.cssText += ";right:96px;top:74px;";
  watermark.style.cssText += ";top:" + px(H * 0.58) + ";font-size:30px;";
  scene.appendChild(cambox); scene.appendChild(livepill); scene.appendChild(watermark);
}

/* The overlay: the real ticker page, in a box the size of an OBS source. */
const TK_H = MOBILE ? 132 : 96;
const tkslot = el("div", "tkslot");
const tkframe = document.createElement("iframe");
tkframe.setAttribute("scrolling", "no");
tkframe.src = TICKER_SRC;
tkslot.appendChild(tkframe);

let mwindow = null;
if(MOBILE){
  // Full-bleed 16:9 "stream window" with the bar pinned to its bottom edge, so
  // the overlay is shown at a real streamer's proportions rather than floated.
  mwindow = el("div", "window");
  mwindow.style.cssText += ";left:0;right:0;top:" + px(MWIN.top) + ";width:" + px(W) +
    ";height:" + px(MWIN.h) + ";border-radius:0;border-left:0;border-right:0;";
  const inner = el("div", "scene");
  inner.style.position = "absolute";
  mwindow.appendChild(inner);
  glows.forEach((g) => inner.appendChild(g));
  inner.appendChild(gridTex);
  inner.appendChild(el("div", "scanline"));
  inner.appendChild(el("div", "vig"));
  cambox.style.cssText += ";left:28px;top:26px;width:190px;height:108px;";
  cambox.querySelector("span").style.fontSize = "10px";
  livepill.style.cssText += ";right:28px;top:26px;";
  watermark.style.cssText += ";top:216px;font-size:26px;";
  inner.appendChild(cambox); inner.appendChild(livepill); inner.appendChild(watermark);
  tkslot.style.cssText += ";left:0;bottom:0;width:" + px(W) + ";height:" + px(TK_H) + ";";
  mwindow.appendChild(tkslot);
  stage.appendChild(mwindow);
  scene.style.background = "radial-gradient(120% 80% at 50% 8%, #1d0f34 0%, #120a1e 52%, #080410 100%)";
} else {
  tkslot.style.cssText += ";left:0;bottom:0;width:" + px(W) + ";height:" + px(TK_H) + ";";
  stage.appendChild(tkslot);
}

/* Callout pointing at the bar, only while the headline is up. */
const pointer = el("div", "pointer",
  '<span class="line" style="width:64px"></span><b>the overlay</b>');
if(MOBILE){
  pointer.style.cssText += ";left:56px;top:" + px(MWIN.top + MWIN.h + 20) + ";font-size:14px;";
} else {
  pointer.style.cssText += ";left:96px;bottom:" + px(TK_H + 22) + ";";
}
stage.appendChild(pointer);

/* ── copy blocks ── */
function mkHead(){
  const b = el("div", "block");
  b.appendChild(el("div", "rule"));
  const sub = "A free scrolling overlay for OBS &amp; Streamlabs.<br>One browser source — nothing to install.";
  if(MOBILE){
    b.style.cssText += ";left:56px;right:56px;top:900px;";
    b.appendChild(el("h1", null, 'Live Lorcana<br>prices on<br><em>your stream.</em>'));
    b.querySelector("h1").style.fontSize = "84px";
    const s = el("p", "sub", sub);
    s.style.fontSize = "30px";
    b.appendChild(s);
  } else {
    b.style.cssText += ";left:110px;top:300px;width:1120px;";
    b.appendChild(el("h1", null, 'Live Lorcana prices,<br><em>across your stream.</em>'));
    b.querySelector("h1").style.fontSize = "84px";
    const s = el("p", "sub", sub);
    s.style.fontSize = "30px";
    b.appendChild(s);
  }
  return b;
}
/* One builder for all three bullet beats: they differ only in copy, accent and
   how much room the beat has to leave beside the page shot. */
function mkList(items, eyebrow, slab, opts){
  const o = opts || {};
  const b = el("div", "block");
  const ul = el("ul", "flist" + (slab ? " slab" : ""));
  items.forEach((pair) => {
    const li = el("li");
    li.appendChild(el("span", "tick", "◆"));
    li.appendChild(el("span", "ftxt",
      pair[0] + (pair[1] ? '<span class="fsub">' + pair[1] + "</span>" : "")));
    ul.appendChild(li);
  });
  const eb = el("p", "eyebrow" + (slab ? " slab" : ""), eyebrow);
  if(MOBILE){
    b.style.cssText += ";left:56px;right:56px;top:900px;";
    eb.style.fontSize = "17px";
    ul.querySelectorAll(".tick").forEach((n) => n.style.fontSize = "19px");
    ul.querySelectorAll(".ftxt").forEach((n) => n.style.fontSize = o.mSize || "33px");
    ul.querySelectorAll(".fsub").forEach((n) => n.style.fontSize = "22px");
    ul.querySelectorAll("li").forEach((n) => n.style.marginBottom = o.mGap || "24px");
  } else {
    b.style.cssText += ";left:110px;top:" + (o.top || "250px") + ";width:" + (o.w || "980px") + ";";
    ul.querySelectorAll(".tick").forEach((n) => n.style.fontSize = "24px");
    ul.querySelectorAll(".ftxt").forEach((n) => n.style.fontSize = "36px");
    ul.querySelectorAll(".fsub").forEach((n) => n.style.fontSize = "23px");
    ul.querySelectorAll("li").forEach((n) => n.style.marginBottom = "26px");
  }
  b.appendChild(eb); b.appendChild(ul);
  return b;
}
function mkCta(){
  const b = el("div", "cta");
  const st = el("div", "ctasteps");
  CTASTEPS.forEach((label, i) => {
    if(i) st.appendChild(el("span", "sep", "—"));
    const cs = el("div", "cs");
    cs.appendChild(el("span", "n", String(i + 1)));
    cs.appendChild(el("span", "cl", label));
    st.appendChild(cs);
  });
  const mark = el("div", "mark", '<img src="/Logos/logo%20transparent.png" alt="">');
  const url = el("div", "url", "packs.ink/ticker");
  const tag = el("div", "tag", "Free · no account · updates itself every day");
  const chips = el("div", "chips",
    "<span>OBS</span><span>Streamlabs</span><span>Any browser source</span>");
  if(MOBILE){
    b.style.cssText += ";top:900px;";
    st.style.gap = "14px";
    st.querySelectorAll(".n").forEach((n) => { n.style.cssText += ";width:40px;height:40px;font-size:20px;"; });
    st.querySelectorAll(".cl").forEach((n) => n.style.fontSize = "25px");
    st.querySelectorAll(".sep").forEach((n) => n.style.fontSize = "20px");
    st.querySelectorAll(".cs").forEach((n) => n.style.gap = "10px");
    mark.querySelector("img").style.height = "96px";
    url.style.fontSize = "66px";
    tag.style.fontSize = "26px";
    chips.querySelectorAll("span").forEach((n) => { n.style.cssText += ";font-size:17px;padding:9px 18px;"; });
  } else {
    b.style.cssText += ";top:300px;";
    st.querySelectorAll(".n").forEach((n) => { n.style.cssText += ";width:46px;height:46px;font-size:23px;"; });
    st.querySelectorAll(".cl").forEach((n) => n.style.fontSize = "28px");
    st.querySelectorAll(".sep").forEach((n) => n.style.fontSize = "22px");
    mark.querySelector("img").style.height = "104px";
    url.style.fontSize = "92px";
    tag.style.fontSize = "30px";
    chips.querySelectorAll("span").forEach((n) => { n.style.cssText += ";font-size:18px;padding:10px 20px;"; });
  }
  b.appendChild(st); b.appendChild(mark); b.appendChild(url);
  b.appendChild(tag); b.appendChild(chips);
  return b;
}
/* Height of the fake browser chrome on the page frame. Declared once because
   the pan maths has to subtract exactly what the CSS reserves. */
const PAGE_BAR_H = 34;
/* The real configurator page, in a browser-ish frame, panned during the beat.
   Injected by the recorder as one tall PNG. */
function mkPage(){
  const f = el("div", "pageframe");
  const bar = el("div", "pagebar", '<i></i><i></i><i></i><span>packs.ink/ticker</span>');
  bar.style.height = px(PAGE_BAR_H);
  f.appendChild(bar);
  const sc = el("div", "pagescroll");
  sc.style.top = px(PAGE_BAR_H);
  const img = el("img");
  img.id = "shotPage";
  img.alt = "";
  sc.appendChild(img);
  f.appendChild(sc);
  if(MOBILE){
    f.style.cssText += ";left:56px;width:968px;top:1180px;height:470px;";
  } else {
    f.style.cssText += ";left:1120px;top:170px;width:710px;height:742px;";
  }
  return f;
}

const blocks = {
  head:   mkHead(),
  reel:   mkList(FEATURES, "What's in the reel", false, {top:"236px", w:"1150px"}),
  graded: mkList(GRADED,   "Graded slabs, too",  true,  {top:"300px", w:"1150px", mGap:"28px"}),
  custom: mkList(CUSTOM,   "Make it yours",      false, {top:"330px", w:"940px", mSize:"30px", mGap:"20px"}),
  cta:    mkCta(),
};
const pageFrame = mkPage();
Object.keys(blocks).forEach((k) => stage.appendChild(blocks[k]));
stage.appendChild(pageFrame);

/* Mobile chrome that is always on screen. */
let mfoot = null;
if(MOBILE){
  const head = el("div", "mheader",
    '<img src="/Logos/logo%20transparent.png" alt="" style="height:64px"><b>Packs.Ink</b>');
  head.style.cssText += ";top:58px;";
  head.querySelector("b").style.fontSize = "34px";
  stage.appendChild(head);
  mfoot = el("div", "mfooter",
    '<div class="u">packs.ink/ticker</div><div class="s">free stream overlay</div>');
  mfoot.style.cssText += ";bottom:58px;";
  mfoot.querySelector(".u").style.fontSize = "40px";
  mfoot.querySelector(".s").style.fontSize = "17px";
  stage.appendChild(mfoot);
}

/* ─────────────────── seek ─────────────────── */
function applyBlock(node, t, at, out, dy){
  const e = env(t, at, out);
  node.style.opacity = String(e);
  const rising = t < at + 0.55;
  const off = rising ? (1 - easeOut((t - at) / 0.55)) * dy : -(1 - e) * dy * 0.6;
  node.style.transform = "translate3d(0," + (e <= 0 ? dy : off).toFixed(2) + "px,0)";
  node.style.visibility = e <= 0.001 ? "hidden" : "visible";
}
function stagger(list, t, at, step, dy){
  for(let i = 0; i < list.length; i++){
    const k = easeOut((t - (at + 0.18 + i * step)) / 0.5);
    list[i].style.opacity = String(k);
    list[i].style.transform = "translate3d(0," + ((1 - k) * dy).toFixed(2) + "px,0)";
  }
}

const listItems = {
  reel:   [].slice.call(blocks.reel.querySelectorAll("li")),
  graded: [].slice.call(blocks.graded.querySelectorAll("li")),
  custom: [].slice.call(blocks.custom.querySelectorAll("li")),
};
const ctaBits = [].slice.call(blocks.cta.children);

/* ── marquee cueing ───────────────────────────────────────────────────────
   The reel is a marquee: at 60 px/s a nine-section loop takes over twelve
   minutes, so a 36-second video plays about 5% of it and would never reach a
   second section header. Each beat therefore starts at its OWN offset into the
   SAME reel, chosen so the section that beat is talking about is on screen.
   The bar still advances at exactly its configured speed WITHIN a beat — only
   the cut between beats moves it, which is what a cut is for.

   __setCues() is fed real measurements from inside the iframe; with no cue
   table the marquee simply runs from zero, so the scene still renders. */
let CUE = null;
window.__setCues = function(data){
  CUE = (data && data.secs && data.secs.length) ? data : null;
};

/* Sections are picked by what they SAY, never by index: the section list is a
   product of the ticker's own config (windows × rarity groups, then graded),
   so an index would quietly point at a different section the moment that
   config changes. */
function pickSec(pred, from){
  if(!CUE) return 0;
  for(let i = from || 0; i < CUE.secs.length; i++) if(pred(CUE.secs[i])) return i;
  for(let i = 0; i < CUE.secs.length; i++) if(pred(CUE.secs[i])) return i;
  return Math.min(from || 0, CUE.secs.length - 1);
}
const isGraded = (s) => /graded|sales/i.test(s.title);
const isRareLeg = (s) => /rare/i.test(s.sub) && !isGraded(s);
const isChase = (s) => /chase/i.test(s.sub) && !isGraded(s);

/* Where in the frame that section's header sits when its beat opens.
   ⚠ Derived, not a fraction of the width. The bar has a fixed packs.ink cap on
   its left, and a header that drifts UNDER it is sliced in half for a couple of
   seconds — which reads as a rendering fault rather than as a marquee. So the
   header starts one beat's worth of travel to the right of the cap: it is fully
   clear of the cap at the cut, and has only just reached it when the beat ends.
   Travel is the bar's own px/s (seqW / dur), so this self-adjusts to the
   configured speed and to either frame width. */
const BEAT_TRAVEL_S = 7.0;
function cueX(){
  if(!CUE) return W * 0.30;
  const pxPerSec = CUE.seqW / CUE.dur;
  return Math.min(W * 0.72, CUE.origin + pxPerSec * BEAT_TRAVEL_S);
}
function cuePlan(){
  return [
    {at: 0,                      sec: 0},
    {at: BEATS.reel[0]   - 0.30, sec: pickSec(isRareLeg, 0)},
    {at: BEATS.graded[0] - 0.30, sec: pickSec(isGraded, 0)},
    {at: BEATS.custom[0] - 0.30, sec: pickSec(isChase, 3)},
    {at: BEATS.cta[0]    - 0.30, sec: pickSec(isGraded, 5)},
  ];
}
/* Scene time → marquee time. Piecewise linear: inside a beat it advances 1:1
   with real time, so the scroll on screen runs at the configured px/s. */
function tickerTimeFor(t){
  if(!CUE) return t;
  const plan = cuePlan();
  let k = 0;
  for(let i = 0; i < plan.length; i++) if(t >= plan[i].at) k = i;
  const p = plan[k];
  const sec = CUE.secs[Math.min(p.sec, CUE.secs.length - 1)];
  /* screenX = origin + left - (tau/dur)*seqW  →  solve for tau at cueX(). */
  const tau0 = (CUE.origin + sec.left - cueX()) * CUE.dur / CUE.seqW;
  const tau = tau0 + (t - p.at);
  /* The animation is infinite, so any positive time is valid; lift a section
     that would otherwise want a negative start by whole loops. */
  return tau < 0 ? tau + CUE.dur * Math.ceil(-tau / CUE.dur) : tau;
}
/* Re-query every frame rather than caching: layoutStrip() tears the marquee
   animation down and rebuilds it (animation:none → reflow → ""), so a cached
   Animation object goes stale the moment fonts land or the bar re-measures. */
function seekTicker(t){
  try{
    const doc = tkframe.contentDocument;
    if(!doc || !doc.getAnimations) return;
    const anims = doc.getAnimations();
    for(let i = 0; i < anims.length; i++){
      try{ anims[i].pause(); anims[i].currentTime = t * 1000; }catch(e){}
    }
  }catch(e){}
}

/* Mobile blocks are centred in the band between the stream window and the
   footer. Measured, not guessed: the beats differ by ~300px of height. */
const MBAND = {top: MWIN.top + MWIN.h + 78, bottom: 1748};
window.__layout = function(){
  if(!MOBILE) return;
  const band = MBAND.bottom - MBAND.top;
  Object.keys(blocks).forEach((k) => {
    const b = blocks[k];
    const prev = b.style.visibility;
    b.style.visibility = "hidden";
    const h = b.getBoundingClientRect().height;
    b.style.visibility = prev;
    b.style.top = px(Math.round(MBAND.top + Math.max(0, (band - h) / 2)));
  });
  /* The custom beat is the one that also carries the page shot: stack the
     frame under its bullets inside the same band. */
  const cb = blocks.custom;
  const prev = cb.style.visibility;
  cb.style.visibility = "hidden";
  const ch = cb.getBoundingClientRect().height;
  cb.style.visibility = prev;
  const fh = 470, gap = 26;
  const top = Math.round(MBAND.top + Math.max(0, (band - (ch + gap + fh)) / 2));
  cb.style.top = px(top);
  pageFrame.style.top = px(top + Math.round(ch) + gap);
};

/* The page shot pans down through the settings. Bounds come from the recorder,
   which measures the real cards in the real page. */
let PAGE = null;
window.__setPage = function(url, meta){
  const img = document.getElementById("shotPage");
  if(img && url) img.src = url;
  PAGE = meta || null;
  window.__layout();
};

window.__seek = function(t){
  // Backdrop: slow, non-repeating drift so no two seconds look identical.
  glows.forEach((g, i) => {
    const bx = +g.dataset.bx, by = +g.dataset.by;
    const x = bx + Math.sin(t * (0.085 + i * 0.011) + i * 1.7) * (MOBILE ? 70 : 120);
    const y = by + Math.cos(t * (0.063 + i * 0.009) + i * 0.9) * (MOBILE ? 38 : 78);
    g.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
  });
  gridTex.style.transform = "translate3d(" + (-(t * 5) % 96).toFixed(2) + "px," +
    (-(t * 2.4) % 96).toFixed(2) + "px,0)";

  // The bar slides up into place and then simply stays — it is the product.
  const inK = easeInOut(clamp01((t - 0.25) / 1.15));
  tkslot.style.transform = "translate3d(0," + ((1 - inK) * (TK_H + 14)).toFixed(2) + "px,0)";
  if(MOBILE && mwindow){
    const wK = easeOut(clamp01((t - 0.1) / 1.0));
    mwindow.style.opacity = String(wK);
    mwindow.style.transform = "translate3d(0," + ((1 - wK) * 40).toFixed(2) + "px,0)";
  }

  // Stream furniture fades in behind the bar, then the "your stream" watermark
  // retires once the viewer has read it.
  const furn = easeOut(clamp01((t - 0.9) / 0.9));
  cambox.style.opacity = String(furn * 0.9);
  livepill.style.opacity = String(furn * 0.9);
  watermark.style.opacity = String(furn * Math.max(0, 1 - clamp01((t - 1.5) / 0.8)));

  // Callout, only while the headline is up.
  const pE = env(t, 1.5, BEATS.head[1] + 0.2, 0.7, 0.45);
  pointer.style.opacity = String(pE);
  pointer.querySelector(".line").style.width = px(Math.round(pE * (MOBILE ? 48 : 64)));

  applyBlock(blocks.head,   t, BEATS.head[0],   BEATS.head[1],   MOBILE ? 34 : 40);
  applyBlock(blocks.reel,   t, BEATS.reel[0],   BEATS.reel[1],   MOBILE ? 30 : 36);
  applyBlock(blocks.graded, t, BEATS.graded[0], BEATS.graded[1], MOBILE ? 30 : 36);
  applyBlock(blocks.custom, t, BEATS.custom[0], BEATS.custom[1], MOBILE ? 30 : 36);
  applyBlock(blocks.cta,    t, BEATS.cta[0],    BEATS.cta[1] + 1, MOBILE ? 30 : 36);
  applyBlock(pageFrame,     t, BEATS.custom[0], BEATS.custom[1], 36);

  stagger(listItems.reel,   t, BEATS.reel[0],   0.30, 22);
  stagger(listItems.graded, t, BEATS.graded[0], 0.30, 22);
  stagger(listItems.custom, t, BEATS.custom[0], 0.30, 22);
  stagger(ctaBits,          t, BEATS.cta[0],    0.20, 20);

  // Pan the configurator shot through its settings across the beat.
  const img = document.getElementById("shotPage");
  if(img && PAGE && PAGE.w){
    const box = pageFrame.getBoundingClientRect();
    const scale = box.width / PAGE.w;
    /* How much of the PAGE the window shows, in the page's own pixels. The
       pan is clamped against it so the sweep can never run off the bottom of
       the shot into empty frame — which it did when the end point was a
       guessed constant instead of the frame's real height. */
    const winH = (box.height - PAGE_BAR_H) / scale;
    const maxY = Math.max(0, PAGE.h - winH);
    const from = Math.min(PAGE.from, maxY);
    const to = Math.min(Math.max(PAGE.bot - winH, from), maxY);
    const span = Math.max(0.8, BEATS.custom[1] - BEATS.custom[0] - 1.2);
    const k = easeInOut(clamp01((t - BEATS.custom[0] - 0.5) / span));
    const y = (from + (to - from) * k) * scale;
    img.style.transform = "translate3d(0," + (-y).toFixed(2) + "px,0)";
  }

  if(MOBILE && mfoot){
    // The persistent footer steps aside while the CTA owns the frame.
    const f = 1 - env(t, BEATS.cta[0], BEATS.cta[1] + 1, 0.5, 0.4);
    mfoot.style.opacity = String(Math.max(0, f) * easeOut(clamp01((t - 1.2) / 0.8)));
  }

  seekTicker(tickerTimeFor(t));
};

/* The recorder waits on this: true once the ticker has painted real rows. */
window.__tickerReady = function(){
  try{
    const doc = tkframe.contentDocument;
    if(!doc) return false;
    const rail = doc.getElementById("rail");
    return !!(rail && rail.firstChild && rail.firstChild.childElementCount > 2);
  }catch(e){ return false; }
};
/* Measured from INSIDE the iframe, so the cue maths uses the bar's own layout
   rather than anything this file assumes about it. */
window.__measureCues = function(){
  try{
    const doc = tkframe.contentDocument;
    const rail = doc.getElementById("rail");
    const seq = rail && rail.firstChild;
    if(!seq) return null;
    const scroll = doc.querySelector(".tk-scroll");
    const dur = parseFloat(rail.style.getPropertyValue("--tk-dur"));
    const seqW = seq.getBoundingClientRect().width;
    if(!dur || !seqW) return null;
    const secs = [];
    for(let i = 0; i < seq.children.length; i++){
      const kid = seq.children[i];
      const tEl = kid.querySelector && kid.querySelector(".tk-sec-title");
      if(!tEl) continue;
      const sEl = kid.querySelector(".tk-sec-sub");
      secs.push({left: kid.offsetLeft, title: tEl.textContent.trim(),
                 sub: sEl ? sEl.textContent.trim() : ""});
    }
    return {dur: dur, seqW: seqW, secs: secs,
            origin: scroll ? scroll.getBoundingClientRect().left : 0};
  }catch(e){ return null; }
};
window.__layout();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { window.__layout(); });
window.__seek(0);
</script>
</body>
</html>
