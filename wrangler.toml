# Cloudflare deployment for packs.ink.
#
# The site stays a zero-build static app: `node scripts/build_dist.mjs` only
# copies an include-list of files into dist/, and worker/index.js handles the
# routing Netlify's _redirects used to do (image proxies + SPA fallback).
#
# Set the build command to `node scripts/build_dist.mjs` in the Cloudflare
# dashboard (Workers → Builds) so a git push deploys, the way Netlify did.
name = "packs-ink"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Apex only. `www` deliberately still points at Netlify's load balancer
# (75.2.60.5, grey-clouded) because that is what serves its 301 → apex; the
# worker has no www redirect of its own. BEFORE decommissioning Netlify, add a
# Cloudflare redirect rule for www → apex, or www breaks.
#
# A ROUTE, not a custom domain. custom_domain = true refuses to coexist with the
# existing A record ("Hostname already has externally managed DNS records") and
# would require deleting it first — leaving the apex with NO record mid-cutover.
# A route attaches to the record we already have, so there is never a DNS gap.
#
# The route is inert while the record is grey-clouded (routes only see proxied
# traffic), so it is safe to deploy BEFORE flipping the cloud. Orange-clouding
# the record is what actually cuts traffic over, and the worker answers every
# request, so Netlify is never reached behind it.
#
# Rollback: grey-cloud `A packs.ink → 75.2.60.5` in the dashboard. Instant, and
# no redeploy needed.
routes = [
  { pattern = "packs.ink/*", zone_name = "packs.ink" },
  # www: inert while the www record is grey-clouded (routes only see proxied
  # traffic — same trick as the apex cutover). Orange-cloud the record and
  # the worker's 301 takes over from Netlify with no DNS change. Needs the
  # deploy token's Zone -> Workers Routes -> Edit (granted 2026-08-23).
  { pattern = "www.packs.ink/*", zone_name = "packs.ink" }
]

# No packs-ink.<account>.workers.dev twin of the site: it was a full duplicate
# origin (duplicate content for crawlers, a second origin for OAuth/CSP) that
# nothing used after the cutover. Redeploying with this set disables it.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# "none" makes ASSETS.fetch return a 404 for unknown paths instead of serving
# its own fallback, which is what lets worker/index.js do the /Index.html
# rewrite itself. Cloudflare's built-in SPA mode looks for a lowercase
# index.html and would not find this site's capital-I Index.html.
not_found_handling = "none"
