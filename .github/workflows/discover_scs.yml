name: Discover Set Championships

# Keeps public.set_championships fresh by re-running the RPH discovery daily.
# Why daily (not weekly like the ELO refresh): stores create new SCs and adjust
# events continuously, and the original staleness is exactly what let a Las Vegas
# SC go missing. SC discovery tolerates a few hours of delay, so GitHub's native
# `schedule:` cron is fine here — no need for the cron-job.org pinger that the
# time-critical price ETL uses.
#
# The script is idempotent (PostgREST upsert on event_id, merge-duplicates), so
# re-running is harmless. It does NOT prune events removed from RPH — stale rows
# linger until a separate guarded cleanup is added.
#
# SET ROTATION IS AUTOMATIC: the scheduled run uses --all-sets, which captures
# every set's SCs and auto-detects the set per event from the Supabase `sets`
# table. New sets are picked up the moment Lorcast adds them to `sets` — nothing
# to edit here. (The optional set_name input below is just for targeted re-pulls.)

permissions:
  contents: read

on:
  schedule:
    # 09:00 UTC daily = 4:00 AM CDT. Off-peak, away from the 01:00/06:00 price
    # ETL crons. GH cron may slip a couple hours under load — fine for SCs.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      set_name:
        description: "Leave blank to discover ALL sets; or name one set to re-pull just that"
        required: false
        default: ""
        type: string

jobs:
  discover:
    name: Discover Set Championships
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover & upsert Set Championships
        # Scheduled runs have an empty set_name -> --all-sets. A manual dispatch
        # with a set_name re-pulls just that set.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SET_NAME: ${{ inputs.set_name }}
        run: |
          if [ -n "$SET_NAME" ]; then
            echo "Discovering SCs for set: $SET_NAME"
            python scripts/elo/discover_wu_scs.py --set "$SET_NAME"
          else
            echo "Discovering SCs for ALL sets"
            python scripts/elo/discover_wu_scs.py --all-sets
          fi

      # Refresh elo_tracked_stores from the freshly-upserted SCs. A Chicagoland
      # store (incl. a NEW location of a chain we already track, e.g. "Chupacabra
      # Games Joliet") only reaches the ELO "Upcoming SCs" tab once its store_id
      # is in elo_tracked_stores — and without this step that only happened on the
      # weekly refresh, so newly-discovered stores lagged. Reads its allowlist from
      # Supabase elo_events (no local DB needed), so it runs fine here. Must come
      # AFTER discover (needs the fresh set_championships) and BEFORE scrape (which
      # reads elo_upcoming_scs = set_championships ⋈ elo_tracked_stores).
      - name: Sync ELO tracked stores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/sync_elo_tracked_stores.py

      # Scrape signed-up rosters for the tracked upcoming SCs, right after the SC
      # list + tracked stores refresh (rosters read elo_upcoming_scs, so the fresh
      # rows must land first — hence chained steps in the same job, not parallel).
      # Fails soft per-event; idempotent (REPLACE members + upsert header).
      - name: Scrape tracked-SC rosters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/scrape_rosters.py
