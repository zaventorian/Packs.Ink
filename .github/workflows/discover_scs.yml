name: Discover Lorcana events

# Keeps public.lorcana_events (EVERY upcoming Lorcana event on Ravensburger Play)
# and public.set_championships fresh by re-running the RPH discovery daily.
# Why daily (not weekly like the ELO refresh): stores create and adjust events
# continuously, and the original staleness is exactly what let a Las Vegas SC go
# missing. Event discovery tolerates a few hours of delay, so GitHub's native
# `schedule:` cron is fine here — no need for the cron-job.org pinger that the
# time-critical price ETL uses.
#
# ONE SCAN, not three. discover_events.py pulls the ~17k-row upcoming index once,
# classifies every event as sc / prerelease / other, and writes both tables. It
# replaced the old pair of steps (discover_wu_scs.py + discover_prereleases.py),
# which walked the same index twice and kept only the two classified subsets —
# so the site had no idea a store ran a Thursday league night. Those two scripts
# stay on disk: they still own the classification logic (imported here) and are
# handy for targeted single-set re-pulls.
#
# Idempotent (PostgREST upsert on event_id, merge-duplicates). It now also PRUNES
# upcoming events RPH dropped, behind a completeness guard so a partial pull can
# never mass-delete live rows.
#
# SET ROTATION IS AUTOMATIC: sets are auto-detected per event from the Supabase
# `sets` table, so a new set is picked up the moment Lorcast adds it — nothing to
# edit here. (The optional set_name input below is just for targeted SC re-pulls.)

permissions:
  contents: read

on:
  schedule:
    # 09:00 UTC daily = 4:00 AM CDT. Off-peak, away from the 01:00/06:00 price
    # ETL crons. GH cron may slip a couple hours under load — fine for SCs.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      set_name:
        description: "Leave blank to discover ALL sets; or name one set to re-pull just that"
        required: false
        default: ""
        type: string
      backfill_stores:
        description: "Also backfill every PAST event for tracked stores (slow; needs migration 121)"
        required: false
        default: "false"
        type: string
      tier_report:
        description: "Print RPH tier metrics per store to the log (read-only)"
        required: false
        default: "false"
        type: string
      scrape_attendance:
        description: "Scrape who PLAYED per past event: true for all (~10min), or a number to cap it"
        required: false
        default: "false"
        type: string
      skip_discover:
        description: "Skip the ~20min upcoming scan. For attendance/backfill-only runs."
        required: false
        default: "false"
        type: string
      diagnose_store:
        description: "Read-only: show who the Fans count is counting for one store (substring of its name)"
        required: false
        default: ""
        type: string

jobs:
  discover:
    name: Discover Lorcana events
    runs-on: ubuntu-latest
    # ONE full RPH scan now (was two), unioning several passes over the ~17k
    # upcoming-Lorcana index, plus the tracked-store sync and the roster scrape.
    # Kept at 35 rather than dropped back to 20: the single scan writes ~4x the
    # rows the SC-only job did, so the upsert leg is longer than the scan it saved.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests python-dotenv

      # One scan -> public.lorcana_events (all kinds, what the site's "Upcoming
      # near me" box reads) + public.set_championships (the SC subset, unchanged,
      # because the whole Elo pipeline binds to that table). A manual dispatch
      # with a set_name instead re-pulls just that set's SCs the old way.
      # The scan is the long pole (~20 min). An attendance or backfill run has no
      # need of it, and re-running it there is what pushes the job into its
      # timeout before the step you actually dispatched for gets to run.
      - name: Discover & upsert Lorcana events
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_discover != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SET_NAME: ${{ inputs.set_name }}
        run: |
          if [ -n "$SET_NAME" ]; then
            echo "Targeted re-pull of Set Championships for set: $SET_NAME"
            python scripts/elo/discover_wu_scs.py --set "$SET_NAME"
          else
            echo "Discovering ALL upcoming Lorcana events"
            python scripts/elo/discover_events.py
          fi

      # Refresh elo_tracked_stores from the freshly-upserted SCs. A Chicagoland
      # store (incl. a NEW location of a chain we already track, e.g. "Chupacabra
      # Games Joliet") only reaches the ELO "Upcoming SCs" tab once its store_id
      # is in elo_tracked_stores — and without this step that only happened on the
      # weekly refresh, so newly-discovered stores lagged. Reads its allowlist from
      # Supabase elo_events (no local DB needed), so it runs fine here. Must come
      # AFTER discover (needs the fresh set_championships) and BEFORE scrape (which
      # reads elo_upcoming_scs = set_championships ⋈ elo_tracked_stores).
      - name: Sync ELO tracked stores
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_discover != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/sync_elo_tracked_stores.py

      # Scrape signed-up rosters for the tracked upcoming SCs, right after the SC
      # list + tracked stores refresh (rosters read elo_upcoming_scs, so the fresh
      # rows must land first — hence chained steps in the same job, not parallel).
      # Fails soft per-event; idempotent (REPLACE members + upsert header).
      # Backfill: every PAST event our tracked stores have run. Only reachable
      # by hand (backfill_stores=true) — it walks ~30 stores' full history, which
      # the nightly job has no reason to redo. Once it has run, the archive step
      # in discover_events.py keeps history current from there.
      - name: Backfill store event history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_stores == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/scrape_store_history.py

      # Read-only: prints the tier metrics per store to the run log.
      # Who actually PLAYED, per past event — the real source for RPH's Event
      # Tickets and Unique Fans. ~4,200 events at one request each on a first
      # full run, so it's by-hand only; a numeric value caps it for slicing.
      - name: Scrape past-event attendance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_attendance != '' && inputs.scrape_attendance != 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.scrape_attendance }}" = "true" ]; then
            python scripts/elo/scrape_event_attendance.py
          else
            python scripts/elo/scrape_event_attendance.py --limit "${{ inputs.scrape_attendance }}"
          fi

      # Read-only: breaks one store's Fans number down into account-keyed vs
      # name-keyed people, one-and-done vs regulars, and any display names that
      # map to more than one person — i.e. every way the count could be inflated.
      - name: Diagnose one store's Fans count
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_store != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/diagnose_store_fans.py --store "${{ inputs.diagnose_store }}" --list 500 --probe

      - name: Report store tier metrics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tier_report == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/report_store_tiers.py

      - name: Scrape tracked-SC rosters
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_discover != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/elo/scrape_rosters.py
