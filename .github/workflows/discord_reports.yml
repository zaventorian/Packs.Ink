name: Discord reports

# Posts the movers report into every Discord channel that asked for one with
# the bot's /reports command (rows in discord_report_subscriptions, migration
# 173). The report is the daily digest's embed, built by the same code — see
# scripts/discord_reports.py.
#
# Two runs a day, and that is safe: the script refuses to post unless the
# newest price date is today, and each channel records last_posted_on, so the
# second run only reaches a channel the first one missed (a late ETL day).
#
# Green before it is switched on: with no DISCORD_BOT_TOKEN secret, or before
# migration 173 is applied, the script says so and exits 0.

on:
  schedule:
    - cron: "20 21 * * *"   # after the 20:30 ETL and the 21:15 digest
    - cron: "20 23 * * *"   # the late-ETL retry
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the reports and print where they would go, WITHOUT posting"
        type: boolean
        default: true
      force_weekly:
        description: "Treat today as a weekly-report day"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Test the reporter (offline)
        run: python scripts/test_discord_reports.py
      - name: Post the reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python scripts/discord_reports.py \
            ${{ (github.event_name == 'schedule' || !inputs.dry_run) && '--post' || '' }} \
            ${{ inputs.force_weekly && '--force-weekly' || '' }}
