name: Discord reports

# The daily goes out in the evening once the day's prices land; the weekly on
# Monday mornings, 9 AM Chicago (see the Monday crons below).
#
# Posts the movers report into every Discord channel that asked for one with
# the bot's /reports command (rows in discord_report_subscriptions, migration
# 173). The report is sectioned by kind of card (chase, base, promos, foils);
# the weekly adds the market pulse and pictures drawn with Pillow — see
# scripts/discord_reports.py.
#
# It runs when an ETL run FINISHES — the ETL is dispatched on time by
# cron-job.org — with GitHub's schedule kept as the fallback. GitHub has
# started this repo's evening schedules 2-3 hours late, so on the schedule
# alone a 21:20 UTC report landed near midnight — and the old "prices must be
# dated today" rule skipped any run that crossed it. Found 2026-09-28, the
# first day a report was due, when none had arrived by 22:45 UTC. Running many
# times a day is safe: nothing posts
# before the day's prices land, a day's report may post until noon UTC the
# next day and no later, and each channel records the price date it last got,
# so no channel is sent a report twice.
#
# Green before it is switched on: with no DISCORD_BOT_TOKEN secret, or before
# migration 173 is applied, the script says so and exits 0.

on:
  workflow_run:
    workflows: ["ETL"]
    types: [completed]
  schedule:
    - cron: "20 21 * * *"   # after the 20:30 ETL and the 21:15 digest
    - cron: "20 23 * * *"   # the late-ETL retry
    # The WEEKLY posts Monday morning, 9 AM - 3 PM Chicago (weekly_open in the
    # script), never beside the daily. Two slots cover both clocks: 14:05 UTC
    # is 9:05 CDT, 15:05 UTC is 9:05 CST. 17:05 is a retry in case GitHub
    # runs the others late; a second run in the window posts nothing twice.
    - cron: "5 14 * * 1"
    - cron: "5 15 * * 1"
    - cron: "5 17 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the reports and print where they would go, WITHOUT posting"
        type: boolean
        default: true
      force_weekly:
        description: "Send the weekly report NOW to every weekly channel (even outside Monday morning, even if they already have it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Test the reporter (offline)
        run: python scripts/test_discord_reports.py
      - name: Post the reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python scripts/discord_reports.py \
            ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && '--post' || '' }} \
            ${{ inputs.force_weekly && '--force-weekly' || '' }}
