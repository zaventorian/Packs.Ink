name: ELO draw report

# Read-only look at how draws classify. Downloads the canonical SQLite, runs
# analyze_draws.py, prints. It never writes flags, never exports, and never
# uploads the DB — so it is safe to run against production at any time, and it
# cannot race the weekly refresh.
#
# It exists because the question it answers ("why wasn't THAT draw flagged?")
# needs the real data, and the analysis is otherwise only runnable on a laptop
# that has the DB.

on:
  workflow_dispatch:
    inputs:
      rule:
        description: "Classification rule"
        required: false
        default: "position"
        type: choice
        options: [position, position-only, score-only]
      player:
        description: "Dump this player's draws individually (substring match)"
        required: false
        default: ""
        type: string
      since:
        description: "With player: only events on/after this date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      id_window:
        description: "How many closing Swiss rounds can hold an ID"
        required: false
        default: "2"
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Draw report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ELO_DB_BUCKET: elo
          ELO_DB_OBJECT: lorcana_elo.db
          # Inputs reach the process through env and are appended as argv
          # entries by python, never interpolated into a shell command line
          # (same reasoning as the refresh workflow's EVENT_IDS).
          RULE: ${{ inputs.rule }}
          PLAYER: ${{ inputs.player }}
          SINCE: ${{ inputs.since }}
          ID_WINDOW: ${{ inputs.id_window }}
        run: |
          python scripts/elo_db_storage.py download
          python - <<'PY'
          import os, subprocess, sys
          cmd = [sys.executable, "scripts/elo/analyze_draws.py",
                 "--rule", os.environ.get("RULE") or "position",
                 "--id-window", os.environ.get("ID_WINDOW") or "2"]
          if os.environ.get("PLAYER"):
              cmd += ["--player", os.environ["PLAYER"]]
          if os.environ.get("SINCE"):
              cmd += ["--since", os.environ["SINCE"]]
          sys.exit(subprocess.run(cmd).returncode)
          PY
