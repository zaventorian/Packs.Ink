name: ELO weekly refresh

# Least-privilege token (matches etl.yml). checkout only needs read.
permissions:
  contents: read

on:
  schedule:
    # Monday 11:00 UTC = 6:00 AM CDT / 5:00 AM CST. Hour past dawn in case
    # any Sunday-night events finish late and the TOs upload Monday morning.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      event_ids:
        description: "One-off RPH event IDs to ingest (space-separated). Add each to ONE_OFF_EVENT_IDS first, or its store joins the tracked set."
        required: false
        default: ""
        type: string
      event_season:
        description: "Season label for those events. Blank = whatever the current set is already using."
        required: false
        default: ""
        type: string

# refresh_elo.py downloads the canonical SQLite at the top and uploads it at the
# bottom, so two overlapping runs would each publish a DB missing the other's
# work. Queue rather than cancel: the upload is the last step, so a queued run
# starts from the finished one's result.
concurrency:
  group: elo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # detect_renames re-scans ~390 RPH events (a few min at 8 workers) on top of
    # the existing ingest/recompute — 45 gives comfortable headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install requests openpyxl python-dotenv

      - name: Refresh ELO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Override the bucket/object name if you set up something different.
          ELO_DB_BUCKET: elo
          ELO_DB_OBJECT: lorcana_elo.db
          # Dispatch inputs reach the shell through env, never interpolated into
          # the command line (same pattern as discover_scs.yml's SET_NAME).
          EVENT_IDS: ${{ inputs.event_ids }}
          EVENT_SEASON: ${{ inputs.event_season }}
        run: |
          set --
          if [ -n "$EVENT_IDS" ]; then
            if [[ ! "$EVENT_IDS" =~ ^[[:space:]]*[0-9]+([[:space:]]+[0-9]+)*[[:space:]]*$ ]]; then
              echo "::error::event_ids must be one or more numeric IDs separated by spaces"
              exit 1
            fi
            set -- --ids $EVENT_IDS
          fi
          if [ -n "$EVENT_SEASON" ]; then
            set -- "$@" --ids-season "$EVENT_SEASON"
          fi
          python scripts/refresh_elo.py "$@"
