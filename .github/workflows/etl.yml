name: ETL

# Minimum permissions the workflow needs. Pinning contents:read here ensures
# actions/checkout gets a working token regardless of repo-level default
# permissions settings.
permissions:
  contents: read

# Reliability strategy:
#   - TCGCSV publishes daily ~20:00 UTC. We fire 3 times to absorb both
#     GitHub's flaky scheduler AND TCGCSV publishing late.
#   - The script is idempotent: if today's prices_daily is already written,
#     it skips the fetch and only refreshes matviews. So later cron firings
#     are cheap no-ops once one succeeds.
#   - "TCGCSV hasn't published yet" exits 0 (not failure), so we don't email
#     on every miss before 20:00 UTC.
#   - Selfheal fires 4× over the post-publish window to catch matview refresh
#     failures even when the main ETL never wrote prices_daily.
on:
  schedule:
    # Primary daily ETL (TCGCSV + graded). 21:00 UTC = 1h after TCGCSV publish.
    - cron: "0 21 * * *"
    # Retry #1: 1.5h later. Catches GitHub dropping the 21:00 trigger or
    # TCGCSV publishing late.
    - cron: "30 22 * * *"
    # Retry #2: 4h later. Last-ditch attempt before next day's cron.
    - cron: "0 1 * * *"
    # Weekly Lorcast metadata refresh — independent of price ETL.
    - cron: "0 22 * * 0"
    # Matview self-heal sweep. Each run is a no-op when matview is current.
    # Spread across the post-publish window so a matview-refresh failure on
    # any attempt above gets repaired within ~30 min.
    - cron: "30 21 * * *"
    - cron: "15 23 * * *"
    - cron: "30 1 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which ETL to run"
        required: true
        default: "prices"
        type: choice
        options:
          - prices
          - graded
          - metadata
          - selfheal
          - both

jobs:
  prices:
    name: TCGCSV daily prices
    runs-on: ubuntu-latest
    # Fires on any of the 3 daily price schedules OR manual dispatch.
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 21 * * *' ||
        github.event.schedule == '30 22 * * *' ||
        github.event.schedule == '0 1 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run TCGCSV daily ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Script exits 0 when today's data is already loaded OR when TCGCSV
        # hasn't published yet, so multiple cron firings produce no email
        # noise. Real failures (network errors, RPC errors) still exit non-zero
        # and surface as workflow failures.
        run: python scripts/etl_tcgcsv_daily.py

  graded:
    name: TCGPriceLookup graded prices
    runs-on: ubuntu-latest
    needs: prices
    if: |
      always() && (
        (github.event_name == 'schedule' && (
          github.event.schedule == '0 21 * * *' ||
          github.event.schedule == '30 22 * * *' ||
          github.event.schedule == '0 1 * * *'
        )) ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'graded' || inputs.job == 'both'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run TCGPriceLookup daily ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TCGPRICELOOKUP_API_KEY: ${{ secrets.TCGPRICELOOKUP_API_KEY }}
        run: python scripts/etl_tcgpricelookup_daily.py

  metadata:
    name: Lorcast metadata refresh
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'metadata' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run Lorcast loader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_lorcast.py

  selfheal:
    name: Matview self-heal
    runs-on: ubuntu-latest
    # Fires on any of the 4 selfheal schedules OR manual dispatch. Always a
    # no-op when matview is current; calls refresh_* when prices_daily has
    # newer rows than card_prices_latest. No external API calls.
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 21 * * *' ||
        github.event.schedule == '15 23 * * *' ||
        github.event.schedule == '30 1 * * *' ||
        github.event.schedule == '0 6 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'selfheal')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-heal matviews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/matview_self_heal.py
