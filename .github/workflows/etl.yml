name: ETL

# Minimum permissions the workflow needs. Pinning contents:read here ensures
# actions/checkout gets a working token regardless of repo-level default
# permissions settings.
permissions:
  contents: read

# Reliability strategy:
#   - Primary trigger is cron-job.org (external pinger), which fires
#     workflow_dispatch on the GitHub REST API at the scheduled times below.
#     GitHub's native `schedule:` cron was consistently delayed 2-4h during
#     high-load windows; the external pinger fires within seconds of schedule.
#   - The cron entries below are a safety net: if cron-job.org has an outage,
#     these still fire (just less promptly). One late ETL + one late selfheal
#     per day is enough to keep the site self-healing.
#   - The script is idempotent: if today's prices_daily is already written,
#     it skips the fetch and only refreshes matviews. So cron-job.org and
#     GH cron firing the same job back-to-back is harmless.
#   - "TCGCSV hasn't published yet" exits 0 (not failure), so we don't email
#     on every miss before 20:00 UTC.
on:
  schedule:
    # Safety-net ETL fallback (cron-job.org is primary). 01:00 UTC = 8 PM CDT
    # — late enough in the day that if cron-job.org missed every earlier slot,
    # this still catches today's TCGCSV snapshot before midnight UTC.
    - cron: "0 1 * * *"
    # Safety-net matview selfheal fallback. 06:00 UTC = 1 AM CDT.
    - cron: "0 6 * * *"
    # Daily Lorcast metadata refresh (was weekly Sun 22:00). 21:00 UTC is just
    # after TCGCSV's ~20:00 daily publish, so a set in its pre-order window fills
    # in within a day of each spoiler instead of waiting for Sunday. Idempotent —
    # a no-op once a set is fully revealed + linked.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which ETL to run"
        required: true
        default: "prices"
        type: choice
        options:
          - prices
          - metadata
          - selfheal
          - both

jobs:
  prices:
    name: TCGCSV daily prices
    runs-on: ubuntu-latest
    # Fires on the daily safety-net cron OR manual dispatch (which is also how
    # cron-job.org triggers us — every external ping is a workflow_dispatch).
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run TCGCSV daily ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Script exits 0 when today's data is already loaded OR when TCGCSV
        # hasn't published yet, so multiple cron firings produce no email
        # noise. Real failures (network errors, RPC errors) still exit non-zero
        # and surface as workflow failures.
        run: python scripts/etl_tcgcsv_daily.py

  smooth:
    name: Smooth phantom Low spikes
    runs-on: ubuntu-latest
    needs: prices
    # Runs after the daily TCGCSV ETL succeeds, walking the trailing 60 days
    # of prices_daily and writing low_price_smoothed for any (pid, printing,
    # date) triple that matches the phantom-spike pattern. Used by the
    # collection-value chart only — every other surface keeps reading raw
    # low_price.
    #
    # Idempotent and self-healing: re-runs just re-evaluate the same trailing
    # window and overwrite as needed. Safe to fire alongside the safety-net
    # schedule cron + cron-job.org pings — the second run is a fast no-op
    # when nothing has changed.
    if: |
      always() && needs.prices.result == 'success' && (
        (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
      )
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Fail fast if the smoothing algorithm regressed against the 4 synthetic
      # cases documented in CLAUDE.md. Runs BEFORE the live smoothing so a
      # broken tunable never touches prices_daily. No external deps / network —
      # the runner uses plain asserts and exits non-zero on any failure.
      - name: Test smoothing algorithm (synthetic cases)
        run: python scripts/test_smooth_low_prices.py
      - name: Run phantom-spike smoothing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/smooth_low_prices.py

  reconcile:
    name: Reconcile catalog (orphan watchdog)
    runs-on: ubuntu-latest
    needs: prices
    # Flags TCGPlayer products that are priced but missing from `cards` AND
    # `sealed_products` — i.e. singles Lorcast hasn't indexed yet (promos,
    # Store-Championship cards), which otherwise sit invisible on the site the
    # way Dash Parr 52/P3 did for a month. Alert-only: it never writes to the
    # catalog, so it can't fail the ETL. The actionable "missing singles" list
    # lands in the run's Step Summary and (if RECONCILE_ALERT_WEBHOOK is set) a
    # Discord ping. Cheap (~19 TCGCSV calls); runs on the daily prices trigger.
    if: |
      always() && needs.prices.result == 'success' && (
        (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
      )
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Reconcile catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional: a Discord (or Discord-compatible) webhook to get pinged
          # when a new missing single appears. Unset → report stays in the Step
          # Summary only.
          RECONCILE_ALERT_WEBHOOK: ${{ secrets.RECONCILE_ALERT_WEBHOOK }}
        run: python scripts/reconcile_catalog.py

  link:
    name: Link pre-order pids
    runs-on: ubuntu-latest
    needs: prices
    # Fills tcgplayer_product_id on cards Lorcast has indexed but not yet linked
    # to a TCGPlayer SKU (every new set: Lorcast publishes card metadata weeks
    # before it links the SKU, while TCGCSV already has pre-order products +
    # prices). Matches unlinked cards to TCGCSV products by collector number
    # (validated by name), fills NULL pids only, refreshes card_prices_latest.
    #
    # Cheap — TCGCSV /products + Supabase, no Lorcast API — so it runs on EVERY
    # prices trigger (several times a day via cron-job.org), not just the daily
    # metadata job. That means a pre-order single gets priced the same day TCGCSV
    # lists it, and the daily load_lorcast null-revert is healed within hours.
    # Idempotent: a no-op once every revealed card is linked.
    if: |
      always() && needs.prices.result == 'success' && (
        (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
      )
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Link pre-order pids
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/link_preorder_pids.py --commit

  # graded job (TCGPriceLookup -> graded_prices_daily, refresh graded_prices_latest)
  # RETIRED 2026-06-30: the TCGPriceLookup feed was discontinued. The legacy
  # graded_prices_daily / graded_prices_latest data is intentionally LEFT FROZEN
  # in place (still read by the legacy graded UI) and slated for eventual deletion.
  # Graded *value* now comes from the in-house graded_sales scrape. The
  # etl_tcgpricelookup_daily.py script + graded_overrides.json are kept on disk
  # but no longer invoked anywhere. (TCGPRICELOOKUP_API_KEY secret is now unused.)

  metadata:
    name: Lorcast metadata refresh
    runs-on: ubuntu-latest
    # Daily (21:00 UTC) or an explicit metadata dispatch. Bumped weekly→daily so
    # a set in its pre-order window fills in within a day of each Lorcast spoiler
    # instead of waiting for Sunday. Deliberately NOT triggered by job=='both' —
    # 'both' is the thrice-daily ping from cron-job.org, and running load_lorcast
    # on every one of those (3x/day) hammered Lorcast's API. Once daily is the
    # compromise: only the Lorcast catalog pull is rate-limited here. The cheap
    # pid-linking (TCGCSV + Supabase, no Lorcast) runs more often via the 'link'
    # job, so pre-order prices appear the same day TCGCSV lists a single.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'metadata')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run Lorcast loader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_lorcast.py
      # Re-apply TCG_PID_OVERRIDES immediately after Lorcast loads. load_lorcast
      # upserts cards on Lorcast's id and overwrites tcgplayer_product_id with
      # Lorcast's value (null for promos it hasn't linked), which REVERTS every
      # manual pid override + drops those cards' prices until re-synced. Running
      # the patch here keeps promo/override prices flowing past the weekly refresh.
      - name: Re-apply pid overrides
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/patch_pid_overrides.py
      # Link pre-order singles whose tcgplayer_id Lorcast hasn't populated yet
      # (every new set: Lorcast publishes card metadata weeks before it links the
      # TCGPlayer SKU, but TCGCSV already has pre-order products + prices). Matches
      # unlinked cards to TCGCSV products by collector number, validated by name,
      # and fills ONLY null pids. Runs after load_lorcast (which nulls them) so
      # the links survive the weekly refresh and newly-revealed cards link as soon
      # as TCGCSV lists them.
      - name: Link pre-order pids
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/link_preorder_pids.py --commit
      # Retire pre-staged stand-in cards (local art + TCGCSV data for cards
      # Lorcast hadn't indexed) once load_lorcast has published the real row for
      # that (set, collector number) — hands the tile over to Lorcast's data/art.
      - name: Retire superseded prestage cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/retire_prestaged.py --commit

  selfheal:
    name: Matview self-heal
    runs-on: ubuntu-latest
    # Fires on the daily safety-net selfheal cron OR manual dispatch (the path
    # cron-job.org's self-heal pings come in on). Always a no-op when matview
    # is current; calls refresh_* when prices_daily has newer rows than
    # card_prices_latest. No external API calls.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'selfheal')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Self-heal matviews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/matview_self_heal.py
