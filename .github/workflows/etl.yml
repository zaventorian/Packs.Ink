name: ETL

# Minimum permissions the workflow needs. The default in many orgs/repos is
# "read only" or even "none" for GITHUB_TOKEN, which makes actions/checkout
# fail with "could not read Username for 'https://github.com': terminal
# prompts disabled". Pinning contents:read here ensures the runner gets a
# token that can clone the repo regardless of the repo's default workflow
# permissions setting.
permissions:
  contents: read

on:
  schedule:
    # Single daily trigger at 21:00 UTC (1h after TCGCSV's ~20:00 UTC refresh).
    # The prices + graded jobs both run off this one cron: GitHub's free tier
    # silently drops scheduled triggers when multiple workflows fire close
    # together, so consolidating into one schedule entry is more reliable
    # than two crons 30 min apart.
    - cron: "0 21 * * *"
    # Weekly metadata refresh from Lorcast: Sundays 22:00 UTC.
    - cron: "0 22 * * 0"
    # Matview self-heal: detects when prices_daily has rows newer than
    # card_prices_latest (i.e. the inline matview refresh in the main ETL
    # failed silently) and runs the four refresh_* RPCs.
    #
    # Was hourly (15 * * * *), but data only updates once per day so 22 of
    # 24 hourly runs were no-ops. Now fires twice: 30 min after the main
    # ETL kicks off (catches a fast inline-refresh failure) and ~2.5h
    # later (catches a slow / hung main ETL that eventually wrote
    # prices_daily but missed the matview refresh). No-op when current.
    - cron: "30 21 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which ETL to run"
        required: true
        default: "prices"
        type: choice
        options:
          - prices
          - graded
          - metadata
          - selfheal
          - both

jobs:
  prices:
    name: TCGCSV daily prices
    runs-on: ubuntu-latest
    # Daily 21:00 cron OR manual with job in {prices, both}
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run TCGCSV daily ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/etl_tcgcsv_daily.py

  graded:
    name: TCGPriceLookup graded prices
    runs-on: ubuntu-latest
    # Runs sequentially after `prices` on the daily schedule so the two
    # jobs don't pile concurrent matview refreshes on Supabase. On manual
    # dispatch, `needs:` is skipped when prices isn't selected.
    needs: prices
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'graded' || inputs.job == 'both'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run TCGPriceLookup daily ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TCGPRICELOOKUP_API_KEY: ${{ secrets.TCGPRICELOOKUP_API_KEY }}
        run: python scripts/etl_tcgpricelookup_daily.py

  metadata:
    name: Lorcast metadata refresh
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'metadata' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run Lorcast loader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/load_lorcast.py

  selfheal:
    name: Matview self-heal
    runs-on: ubuntu-latest
    # Fires twice daily (30 min and ~3h after the main ETL) OR on manual
    # selfheal trigger. Does nothing when the matview is already current;
    # calls refresh_* when prices_daily has rows newer than card_prices_latest.
    # No external API calls (Supabase only), so safe to run while TCGPlayer
    # / TCGCSV are down.
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '30 21 * * *' || github.event.schedule == '0 0 * * *')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'selfheal')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-heal matviews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/matview_self_heal.py
