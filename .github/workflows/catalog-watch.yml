name: Catalog watch

# Answers one question daily: "is there anything Lorcana out there that Packs.Ink
# doesn't know about?" — new sets, new promos, new sealed, cards that can never
# price, TCGplayer groups nobody bound to a set.
#
# It lives in its own workflow ON PURPOSE. It used to be a job inside etl.yml,
# where a red run would have meant "the price pipeline is broken" — the signal
# you have to act on within the hour. A catalog gap is a to-do, not an outage,
# and mixing the two teaches you to ignore both. Two workflows, two emails, two
# different urgencies:
#
#   ETL red            → prices are broken, fix now
#   Catalog watch red  → something new exists; decide what to do with it
#
# Red means something NEW. Everything already ruled on lives in
# scripts/catalog_watch.json with a reason (and often an expiry date), so
# the noise floor is zero and silence genuinely means nothing changed. Before
# that file existed this check ran green every day with 18 missing singles in
# its output, because it exited 0 and wrote to a Step Summary nobody opens.

on:
  schedule:
    # 03:30 UTC — after the ETL's 01:30 safety-net window, so `sealed_products`
    # has already absorbed anything load_sealed_products picked up overnight and
    # we don't flag this cycle's new boxes as missing.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      fail_on_new:
        description: "Exit non-zero (red run + email) when something unacknowledged shows up"
        type: boolean
        default: true

permissions:
  contents: write       # only for the "Open PR" step's branch push — the rest
  pull-requests: write  # of the job (sweep + calendar watch) only ever reads

concurrency:
  group: catalog-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Catalog watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Runs first and needs no network: a malformed ack file (bad regex, an
      # entry with no reason, a kindless rule that swallows everything) would
      # otherwise fail silently by making the sweep pass.
      - name: Test the acknowledgement layer
        run: python scripts/test_catalog_watch.py
      - name: Watch the catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Unset → the report is the Step Summary plus (on a red run)
          # GitHub's own failure email, which is the delivery path that matters.
          RECONCILE_ALERT_WEBHOOK: ${{ secrets.RECONCILE_ALERT_WEBHOOK }}
        run: |
          python scripts/reconcile_catalog.py --watch \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.fail_on_new) && '--no-fail' || '' }}

      # The curated calendar is the one surface nothing refreshes on its own, so
      # it gets the same treatment as the catalog: a daily sweep that is red only
      # when something is announced that we don't have.
      #
      # `if: always()` so a red catalog sweep doesn't hide a calendar finding —
      # being skipped quietly is the bug this whole workflow exists to avoid.
      # It NEVER writes to the calendar: publishing an event stays a person's call.
      - name: Watch for newly announced events
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/watch_calendar_sources.py

      # A finding sitting acknowledged with a decided `resolution` used to just
      # sit there — see apply_catalog_resolutions.py's header for how long the
      # Rapunzel SC pair did exactly that. This is the mechanical half only: it
      # never decides anything (no DB access, no card-identity judgment), it
      # only turns an already-decided resolution into the patch_pid_overrides.py
      # line it describes and opens a PR for a human to read and merge — same
      # "agents stage, a person applies" rule as every migration in this repo.
      # `if: always()` for the same reason as the step above.
      - name: Test the resolutions layer
        if: always()
        id: test_resolutions
        run: python scripts/test_apply_catalog_resolutions.py
      - name: Draft a PR for any resolved-but-unapplied findings
        if: always() && steps.test_resolutions.outcome == 'success'
        id: resolve
        run: |
          if python scripts/apply_catalog_resolutions.py --check; then
            echo "nothing to apply"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/apply_catalog_resolutions.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        if: always() && steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Catalog watch: apply decided promo-printing resolutions"
          title: "Catalog watch: apply decided promo-printing resolutions"
          body: |
            Opened automatically by `scripts/apply_catalog_resolutions.py`,
            which turns a `resolution` block a human already wrote on a
            catalog_watch.json ack into the patch_pid_overrides.py entry it
            describes, and drops the ack.

            **This does not touch the live database.** Merging this PR only
            updates the two files; someone still needs to run
            `python scripts/patch_pid_overrides.py` (with real Supabase
            credentials) for the new row(s) to reach the site.
          branch: catalog-watch/apply-resolutions
          delete-branch: true
          add-paths: |
            scripts/catalog_watch.json
            scripts/patch_pid_overrides.py
