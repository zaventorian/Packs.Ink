name: Catalog watch

# Answers one question daily: "is there anything Lorcana out there that Packs.Ink
# doesn't know about?" — new sets, new promos, new sealed, cards that can never
# price, TCGplayer groups nobody bound to a set.
#
# It lives in its own workflow ON PURPOSE. It used to be a job inside etl.yml,
# where a red run would have meant "the price pipeline is broken" — the signal
# you have to act on within the hour. A catalog gap is a to-do, not an outage,
# and mixing the two teaches you to ignore both. Two workflows, two emails, two
# different urgencies:
#
#   ETL red            → prices are broken, fix now
#   Catalog watch red  → something new exists; decide what to do with it
#
# Red means something NEW. Everything already ruled on lives in
# scripts/catalog_watch.json with a reason (and often an expiry date), so
# the noise floor is zero and silence genuinely means nothing changed. Before
# that file existed this check ran green every day with 18 missing singles in
# its output, because it exited 0 and wrote to a Step Summary nobody opens.

on:
  schedule:
    # 03:30 UTC — after the ETL's 01:30 safety-net window, so `sealed_products`
    # has already absorbed anything load_sealed_products picked up overnight and
    # we don't flag this cycle's new boxes as missing.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      fail_on_new:
        description: "Exit non-zero (red run + email) when something unacknowledged shows up"
        type: boolean
        default: true

permissions:
  contents: write       # only for the "Open PR" step's branch push — the rest
  pull-requests: write  # of the job (sweep + calendar watch) only ever reads
  issues: write         # the tracking issue (see "Update the tracking issue")

concurrency:
  group: catalog-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Catalog watch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Restore the previous run's report
        uses: actions/cache/restore@v4
        with:
          path: .watch/report.json
          key: catalog-watch-report-${{ github.run_id }}
          restore-keys: catalog-watch-report-
      # Runs first and needs no network: a malformed ack file (bad regex, an
      # entry with no reason, a kindless rule that swallows everything) would
      # otherwise fail silently by making the sweep pass.
      - name: Test the acknowledgement layer
        run: python scripts/test_catalog_watch.py
      - name: Watch the catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Unset → the report is the Step Summary plus (on a red run)
          # GitHub's own failure email, which is the delivery path that matters.
          RECONCILE_ALERT_WEBHOOK: ${{ secrets.RECONCILE_ALERT_WEBHOOK }}
        run: |
          mkdir -p .watch
          python scripts/reconcile_catalog.py --watch \
            --prev .watch/report.json --json .watch/report.json --issue-json .watch/issue.json \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.fail_on_new) && '--no-fail' || '' }}

      # A run that is already red cannot get redder: this watch sat red for a
      # week in September 2026 on the same twelve findings, and a thirteenth
      # would have produced the identical failure email. So the open list lives
      # in ONE issue whose body is rewritten every run, and a finding that was
      # not in the previous run's report gets a COMMENT - which GitHub emails
      # with the finding's own name in it. Yesterday's report rides the cache.
      - name: Save this run's report for tomorrow's comparison
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watch/report.json
          key: catalog-watch-report-${{ github.run_id }}
      - name: Update the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f .watch/issue.json || { echo "no report written, skipping"; exit 0; }
          python - <<'PY'
          import json, os, subprocess
          d = json.load(open(".watch/issue.json", encoding="utf-8"))
          title = "Catalog watch: open findings"
          body = d["markdown"] + f"\n\n[Latest run]({os.environ['RUN_URL']}) has the steps for each finding.\n"
          def gh(*a, **kw):
              return subprocess.run(["gh", *a], check=True, text=True, capture_output=True, **kw).stdout
          found = json.loads(gh("issue", "list", "--state", "open", "--search", f'"{title}" in:title',
                                "--json", "number,title"))
          num = next((i["number"] for i in found if i["title"] == title), None)
          open(".watch/body.md", "w", encoding="utf-8").write(body)
          if num is None:
              if not d["open"]:
                  raise SystemExit(0)
              url = gh("issue", "create", "--title", title, "--body-file", ".watch/body.md").strip()
              num = int(url.rsplit("/", 1)[1])
          else:
              gh("issue", "edit", str(num), "--body-file", ".watch/body.md")
          new = d["new_since_last_run"]
          if new:
              text = "New since the last run:\n\n" + "\n".join(f"- `{n}`" for n in new)
              open(".watch/comment.md", "w", encoding="utf-8").write(text)
              gh("issue", "comment", str(num), "--body-file", ".watch/comment.md")
          print(f"issue #{num}: {d['open']} open, {len(new)} new")
          PY

      # A finding sitting acknowledged with a decided `resolution` used to just
      # sit there — see apply_catalog_resolutions.py's header for how long the
      # Rapunzel SC pair did exactly that. This is the mechanical half only: it
      # never decides anything (no DB access, no card-identity judgment), it
      # only turns an already-decided resolution into the patch_pid_overrides.py
      # line it describes and opens a PR for a human to read and merge — same
      # "agents stage, a person applies" rule as every migration in this repo.
      # `if: always()` for the same reason as the step above.
      - name: Test the resolutions layer
        if: always()
        id: test_resolutions
        run: python scripts/test_apply_catalog_resolutions.py
      - name: Draft a PR for any resolved-but-unapplied findings
        if: always() && steps.test_resolutions.outcome == 'success'
        id: resolve
        run: |
          if python scripts/apply_catalog_resolutions.py --check; then
            echo "nothing to apply"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/apply_catalog_resolutions.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        if: always() && steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Catalog watch: apply decided promo-printing resolutions"
          title: "Catalog watch: apply decided promo-printing resolutions"
          body: |
            Opened automatically by `scripts/apply_catalog_resolutions.py`,
            which turns a `resolution` block a human already wrote on a
            catalog_watch.json ack into the patch_pid_overrides.py entry it
            describes, and drops the ack.

            **This does not touch the live database.** Merging this PR only
            updates the two files; someone still needs to run
            `python scripts/patch_pid_overrides.py` (with real Supabase
            credentials) for the new row(s) to reach the site.
          branch: catalog-watch/apply-resolutions
          delete-branch: true
          add-paths: |
            scripts/catalog_watch.json
            scripts/patch_pid_overrides.py

  # The curated calendar is the one surface nothing refreshes on its own, so it
  # gets the same treatment as the catalog: a daily sweep that is red only when
  # something is announced that we don't have. It NEVER writes to the calendar:
  # publishing an event stays a person's call.
  #
  # Its OWN job (it was a step of the job above until 2026-09-30): inside an
  # already-red catalog job its own red added nothing anyone could see.
  calendar:
    name: Calendar watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Watch for newly announced events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/watch_calendar_sources.py

  # The third thing nothing else can see: the sites we RESEARCH from. TCGCSV
  # covers what TCGplayer sells and discovery covers events, but nobody sells a
  # pin and no feed publishes a spoiler. Those lived on a 90-day reminder saying
  # "go look at this site", which cannot tell you whether anything changed. This
  # reads those sites (lorcanaplayer's sitemaps, Takara Tomy's card search, the
  # official gallery, duels.ink's card API) and diffs each against the committed
  # baseline in scripts/source_watch.json.
  #
  # Needs NO secrets: every source is a public page, and the comparison is
  # against Index.html's own lists.
  sources:
    name: Source watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test the watcher
        run: python scripts/test_watch_sources.py
      - name: Watch the sites we research from
        run: python scripts/watch_sources.py
